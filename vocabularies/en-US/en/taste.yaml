notes:
  - Para describir cómo sabe algo se usa seguido de un adjetivo ('it tastes good' = sabe bien) o de 'like' más un sustantivo ('it tastes like chicken' = sabe a pollo).
  - No se debe confundir con 'try', que es más general (intentar algo o probar algo por primera vez); 'taste' se refiere solo a percibir el sabor.
