emotion: thoughtful and calm, searching back in your mind for a detail
notes:
  - Se usa directamente con el objeto, sin preposición ('I remember that day' = Me acuerdo de ese día). Seguido de un verbo, usa '-ing' para un recuerdo del pasado ('I remember meeting her') y 'to' para algo que no debes olvidar hacer ('Remember to call her').
  - No confundir con 'remind' (recordarle algo a alguien).
