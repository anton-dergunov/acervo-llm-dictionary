notes:
  - Imperfective verb; its perfective pair is 'zapytać' (or 'spytać'). To introduce the topic of the question, use 'o' + accusative case (e.g., 'pytać o drogę' — to ask for directions).
  - Do not confuse with 'prosić', which means to ask for a favor or an object (to request). You 'pytasz' for information, but 'prosisz' for help.
