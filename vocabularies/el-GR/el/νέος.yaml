notes:
  - With people, it means 'young' (and as a noun, ο νέος / η νέα means 'young man / woman'). With things or situations, it usually means 'new, another, latest' (μια νέα αρχή, 'a new beginning').
  - For physical objects that are brand new or recently bought, use καινούργιος instead (ένα καινούργιο αυτοκίνητο, 'a new car').
