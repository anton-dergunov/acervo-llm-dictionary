shortGloss: to see; to look at; to watch; to try doing
primaryGloss: to see
emotion: wide-awake and attentive, observing the world with calm curiosity
notes:
  - Ichidan verb (見ない, 見ます, 見て). Takes を to mark what is looked at or watched.
  - Do not confuse with 見える (みえる, to be visible / can see), which is intransitive.
  - After the て-form of another verb, it means 'to try doing' and is usually written in hiragana (〜てみる).
