notes:
  - Used after a noun (often with を) to ask for an item or service, e.g. 水をお願いします ('Water, please'), or on its own when handing something over or answering the phone.
  - Unlike ください, it is not used directly after a verb's て-form (*見てお願いします); use 見てください to ask someone to do an action.
