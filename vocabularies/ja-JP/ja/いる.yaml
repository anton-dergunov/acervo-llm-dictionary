notes:
  - Ichidan verb (いない, います, いて).
  - Used for living, moving beings (people and animals); for inanimate objects and plants, use ある.
  - In Sense 1, the place takes に and the living thing takes が or は. In Sense 2, the person who has someone takes に(は) or は, and the family member or pet takes が.
