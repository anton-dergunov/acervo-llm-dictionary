notes:
  - When refusing an offer or invitation, saying 'いいえ' directly can sound blunt; people often soften it with phrases like 'ちょっと…' (chotto...).
  - In response to a negative question (e.g., 'Aren't you going?'), 'いいえ' confirms the negative ('No, I'm not going') or disagrees with the assumption ('No, I am going').
