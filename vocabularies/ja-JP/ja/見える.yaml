emotion: relaxed and observant, noticing the environment around you without effort
notes:
  - An intransitive (ichidan) verb taking が for the thing seen. It describes what naturally enters your field of vision, whereas 見る (miru) is the active act of looking.
  - Do not confuse with 見られる (mirareru), the potential form of 見る, which means 'to be able to watch' (when conditions or rules allow, e.g., a movie).
