notes:
  - "An intransitive godan verb (分かります, 分かって). The thing understood is marked with が (or は), never を: 日本語が分かります (I understand Japanese)."
  - Unlike 知る (しる, used as 知っている 'to know a fact or person' and 知っていますか 'do you know?'), 分かる involves comprehension or figuring something out. In the negative, however, compare 知っていますか (Do you know?) → いいえ、知りません, versus 分かりますか (Do you understand / Can you tell?) → いいえ、分かりません.
