notes:
  - Traditionally covers both blue and shades of green, so it is still used for traffic lights (青信号, 'green light'), fresh vegetation, and green apples, even though 緑 (midori) is the modern word for green.
  - Can also describe a person's face as 'pale' from shock or illness (顔が青い).
