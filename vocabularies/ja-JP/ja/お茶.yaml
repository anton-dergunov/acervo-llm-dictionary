notes:
  - By default, お茶 refers to Japanese green tea (hot or cold) or barley tea (麦茶), though it can refer to tea in general. Black tea is usually called 紅茶 (kōcha).
  - The お at the beginning is a polite prefix that has become standard; bare 茶 (cha) is rarely used on its own in conversation.
