notes:
  - Used only when someone gives to you or your in-group (the giver takes が/は, the recipient takes に). When you give to others, use あげる; for superiors giving to you, use くださる.
  - Follows the -te form of a verb (〜てくれる) to show someone does an action as a favor for you. It is an ichidan (Group 2) verb, except its plain command form is くれ.
