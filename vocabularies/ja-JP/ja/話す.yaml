primaryGloss: to speak
emotion: straightforward and communicative, connecting with someone else through language
notes:
  - Godan verb (話さない, 話します, 話して). Uses と or に for the person spoken to, を for the topic or story, and で for the language used.
  - Compare 言う (いう, to say specific words), 話す (to talk, converse, or tell a story), and しゃべる (to chat casually).
  - Do not confuse with the homophone 離す (はなす, to separate or let go).
