notes:
  - Because rice is the main staple, 'ăn cơm' literally means 'to eat rice' but is the standard phrase for having a main meal ('Ăn cơm chưa?' = 'Have you eaten yet?').
  - "Vietnamese uses different words for rice at each stage: 'lúa' (the plant), 'thóc' (unhusked grain), 'gạo' (uncooked white grain), and 'cơm' (cooked rice)."
