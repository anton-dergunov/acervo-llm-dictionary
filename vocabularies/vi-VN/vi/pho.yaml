notes:
  - While đường means any road, phố specifically means a city street lined with houses and shops. In street names, phố is standard in Hanoi (e.g. Phố Huế), whereas southern Vietnam uses đường.
  - Common expressions include đường phố (city streets) and lên phố / đi phố (to go into town or downtown).
