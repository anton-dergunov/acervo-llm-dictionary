notes:
  - For losing a game or competition, use 'kalah' (opposite of 'menang', to win). Do not confuse with 'hilang', which means to lose an object (to go missing).
  - Placed before an adjective ('kalah' + adjective), it means to be less [adjective] than something else, e.g., 'kalah cepat' (slower) or 'kalah bagus' (not as good).
