emotion: eager and ready to take action, looking forward to the task ahead
notes:
  - Directly followed by another verb to mean 'start doing' (e.g., mulai bekerja = start working). In formal Indonesian, memulai is often used before a direct noun object.
  - When followed by a time or place, mulai (or mulai dari) means 'starting from' or 'as of', which can refer to the future, unlike sejak ('since', past only).
