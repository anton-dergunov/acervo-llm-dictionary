notes:
  - To negate 'sudah' ('have not yet'), use 'belum', not 'tidak'. Asking 'Sudah makan?' ('Have you eaten?') belongs to everyday small talk and is answered with 'Sudah' or 'Belum'.
  - Do not confuse 'sudah' with 'telah'. Both mean 'already', but 'telah' is formal and mainly used in writing.
