notes:
  - Unlike English 'finish', เสร็จ cannot take a direct object. Place it after the main verb and object (e.g., ทำการบ้านเสร็จ 'finish doing homework'), or after the subject (e.g., งานเสร็จแล้ว 'the work is done').
  - Do not confuse with จบ, which is used for things that have a natural ending, such as a movie, story, meeting, or school term.
