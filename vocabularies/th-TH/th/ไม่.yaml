notes:
  - Cannot be placed directly before a noun to negate it; use ไม่ใช่ (mâi châi) before nouns instead.
  - To answer 'no' to a yes/no question, Thai speakers usually repeat the main verb or adjective after ไม่—for example, ไม่ไป (mâi bpai, 'not going')—rather than saying ไม่ alone, which can sound abrupt.
