notes:
  - มืด refers to the absence of light (or dark shades of color), not the color black (สีดำ). For dark shades of a specific color, เข้ม is more common (e.g. สีน้ำเงินเข้ม 'dark blue').
  - Often used with แล้ว (มืดแล้ว 'it's dark already') to mean night has fallen.
