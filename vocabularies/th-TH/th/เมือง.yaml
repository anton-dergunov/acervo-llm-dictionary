notes:
  - In everyday expressions like เมืองไทย (Thailand) or เมืองนอก (abroad), เมือง means 'country' or 'land'. The formal word for a nation is ประเทศ.
  - Placed before a place name to mean 'the city of ...', or after อำเภอ to mean the capital district of a province (อำเภอเมือง).
