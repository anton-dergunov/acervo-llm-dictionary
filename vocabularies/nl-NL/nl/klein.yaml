notes:
  - When describing a person's height, Dutch uses 'klein' (small) where English uses 'short', and 'lang' (long) where English uses 'tall'. 'Kort' is used for objects and time, not a person's height.
  - Applied to children, 'klein' can also mean 'young' (e.g., 'toen ik nog klein was' – when I was little).
