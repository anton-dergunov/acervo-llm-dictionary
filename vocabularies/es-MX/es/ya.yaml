notes:
  - "'Ya' shifts meaning with verb tense: with the past it means 'already' ('Ya comí', I already ate); with the present it often means 'now' ('Ya entiendo', Now I understand); with the future or present it can reassure someone that something is about to happen ('Ya voy', I'm coming!)."
  - In negative sentences, 'ya no' means 'no longer' or 'not anymore' ('Ya no vivo ahí', I don't live there anymore).
