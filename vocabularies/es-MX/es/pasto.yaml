notes:
  - In many parts of Latin America, especially Mexico, 'pasto' is the standard word for grass or a lawn. In Spain, you are more likely to hear 'césped' for a lawn and 'hierba' for grass in general.
  - Use 'pasto' for the ground cover you walk on; use 'hierba' for wild weeds or small plants that aren't necessarily a lawn.
