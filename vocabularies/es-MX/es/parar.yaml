notes:
  - In Mexico, 'parar' is widely used to mean 'to stop' (a car, an action, a machine). It is synonymous with 'detener'. If you mean 'to stand up', use 'ponerse de pie' or 'pararse' (which is very common in Mexico).
  - Be careful not to confuse 'parar' with 'dejar de', which specifically means to quit doing something (e.g., 'dejó de fumar' - he quit smoking).
