notes:
  - When 'con' is followed by 'mí' (me) or 'ti' (you), they combine into the single words 'conmigo' (with me) and 'contigo' (with you).
  - Used with nouns to form common expressions of manner, such as 'con cuidado' (carefully) or 'con ganas' (enthusiastically).
