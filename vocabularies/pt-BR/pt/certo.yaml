notes:
  - "Position changes the meaning: after a noun it means 'right/correct' ('a resposta certa', the right answer), while before a noun it means 'a certain/particular' ('certas pessoas', certain people)."
  - In everyday Brazilian Portuguese, 'dar certo' means 'to work out / to succeed', and 'Certo!' or 'Tudo certo!' is widely used to mean 'All right! / OK!'.
