shortGloss: to find; to think; to consider
primaryGloss: find
emotion: focused and satisfied, the relief of spotting something you were looking for
notes:
  - Achar is used both for physical discovery and for expressing an opinion. It is the most common way to say 'to think' or 'to have an opinion' in daily Brazilian Portuguese, much more than 'pensar'.
  - Distinguish 'achar' (to find/think) from 'encontrar' (to meet someone or to find something after searching). While they overlap, 'achar' often implies a sudden discovery or a personal subjective belief.
