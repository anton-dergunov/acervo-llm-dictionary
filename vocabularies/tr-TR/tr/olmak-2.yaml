shortGloss: to become; to happen; to be
primaryGloss: to become
emotion: thoughtful and measured, weighing the state of things
notes:
  - In the simple present, 'am/is/are' is normally expressed by personal suffixes (like Evdeyim 'I am at home'), not by olmak. Olmak is used for 'to be' when a full verb form is needed (future, conditional, infinitive, etc.).
  - Also forms countless compound verbs with nouns and adjectives, such as mutlu olmak (to be or get happy) and yardımcı olmak (to help).
