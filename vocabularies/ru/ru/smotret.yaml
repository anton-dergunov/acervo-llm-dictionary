notes:
  - Imperfective; the perfective pair is посмотреть. Use на + accusative for 'to look at' (смотреть на картину), or a direct object in the accusative for 'to watch' (смотреть фильм).
  - Do not confuse with видеть ('to see'), which describes the ability or result of seeing rather than the intentional action.
