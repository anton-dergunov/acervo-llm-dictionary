notes:
  - Use 'pensare a' when directing your thoughts to someone or something (Penso sempre a te = I always think about you), and 'pensare di' when asking for or giving an opinion about it (Cosa pensi di lui? = What do you think of him?).
  - Followed by 'di' + infinitive, it means to plan or intend to do something (Penso di partire = I plan to leave).
