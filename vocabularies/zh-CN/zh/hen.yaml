notes:
  - In simple 'subject + adjective' sentences (e.g., 他很高 'He is tall'), 很 is normally required before the adjective and carries little emphasis unless stressed. Without 很, the sentence implies a comparison.
  - Do not use 很 before the adjective in 比 (bǐ) comparisons (say 他比我高, not 他比我很高).
