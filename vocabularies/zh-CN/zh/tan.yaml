notes:
  - For musical instruments, 弹 is used for plucked string and keyboard instruments like 吉他 (guitar) and 钢琴 (piano), whereas 拉 (lā) is used for bowed strings (小提琴, violin) and 吹 (chuī) for wind instruments.
  - Pronounced tán (second tone) as a verb. In nouns related to bullets or bombs, such as 子弹 (zǐdàn, 'bullet'), it is pronounced dàn (fourth tone).
