notes:
  - For a meal, use the measure word 顿 (dùn), as in 一顿饭 (a meal). For rice, use 碗 (wǎn, bowl), and in everyday speech 米饭 (mǐfàn) is often used to specify cooked rice.
  - In Chinese, 吃饭 (chīfàn, 'to eat a meal') is used for eating any meal, even without rice. Asking 你吃饭了吗？ ('Have you eaten?') is a common friendly greeting.
