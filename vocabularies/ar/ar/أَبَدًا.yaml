notes:
  - Used mainly in negative sentences (especially with لَنْ for the future, or لَا / مَا) to mean 'never' or 'not at all'. For past 'never' ('I have never...'), قَطُّ (qaṭṭu) or لم ... مِنْ قَبْلُ is often preferred in formal Arabic.
  - "Can also stand alone as a strong negative reply: 'Never!' or 'Not at all!'."
