notes:
  - A defective verb ending in alif maqṣūra; the non-past is يَجْرِي (yajrī). In the past tense, the final vowel becomes 'ay' before consonant suffixes (جَرَيْتُ jaraytu, 'I ran').
  - As 'to run', it is synonymous with رَكَضَ (rakaḍa), though جَرَى is also widely used for liquids flowing and events taking place.
