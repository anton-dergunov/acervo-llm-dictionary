notes:
  - Arabic omits 'to be' in simple present-tense sentences. كَانَ is used to put a sentence into the past tense (and its present form يَكُونُ yakūnu is used for the future or after modal words).
  - "The noun or adjective that follows كَانَ as its predicate takes the accusative case (-an): كَانَ الطَّقْسُ جَمِيلًا (The weather was nice)."
