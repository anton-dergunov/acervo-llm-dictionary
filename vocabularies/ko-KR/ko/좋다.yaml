emotion: warm and approving, expressing genuine satisfaction with something
notes:
  - Because 좋다 is an adjective, the thing that is good or liked takes the subject particle 이/가 (e.g. 커피가 좋아요, 'I like coffee'). Contrast with the verb 좋아하다 (to like), which takes the object particle 을/를 (커피를 좋아해요).
  - In pronunciation, ㅎ + ㄷ combines to sound like ㅌ [조타], and before a vowel ㅎ is silent (좋아요 [조아요]).
