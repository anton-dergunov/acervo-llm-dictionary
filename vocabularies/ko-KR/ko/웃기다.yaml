notes:
  - Causative of 웃다 (to laugh). Even when translated into English as an adjective ('is funny'), 웃기다 conjugates as an action verb in Korean (e.g., 웃기는 이야기 'a funny story').
  - As an exclamation, '웃기네!' (or '웃기고 있네!') sounds sarcastic and dismissive ('Don't make me laugh! / That's ridiculous!').
