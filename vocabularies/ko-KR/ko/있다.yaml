language: ko
headword: 있다
lemma: 있다
ipa: it͈a
pos: verb
register: neutral
emoji: 📍
status: active
topics: [Actions]
shortGloss: to be; to exist; to have; to stay
primaryGloss: to be
emotion: matter-of-fact and steady, stating the reality of a situation without extra flair
notes:
  - The opposite of 있다 is 없다 (to not exist; to not have). Its honorific form is 계시다 for a person's location or existence, and 있으시다 for possession.
  - "To say someone has something, mark the item with 이/가 (not 을/를): 시간이 있다 (to have time)."
  - In the meaning 'to stay', 있다 behaves as an action verb (e.g. 집에 있는다); in other meanings it behaves like an adjective in the plain present tense (있다).
