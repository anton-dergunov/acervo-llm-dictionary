shortGloss: to look at; to watch
primaryGloss: to look at
emotion: attentive and present, focusing one's senses on a specific object
notes:
  - Unlike English 'look at', 'mirar' takes a direct object without a preposition for things (e.g., 'Miro la foto', not *'Miro a la foto'*); use 'a' only before a person.
  - While 'mirar' means 'to look at' (focusing your attention), 'ver' means 'to see' and is also the verb used in Spain for watching TV or a movie ('ver la tele', 'ver una película').
