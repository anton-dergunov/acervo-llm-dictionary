notes:
  - Does not change form for masculine and feminine ('un hombre libre', 'una mujer libre'); plural is 'libres'.
  - Used with 'ser' to mean independent ('ser libre') and with 'estar' to mean available or vacant ('¿Está libre esta silla?', 'Estoy libre esta tarde').
  - Do not confuse with 'gratis', which means 'free of charge' (at no cost).
