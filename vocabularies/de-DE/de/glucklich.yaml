emotion: warm, open, and genuinely content with one's current situation
notes:
  - To say 'I am lucky', use 'Ich habe Glück' ('Ich bin glücklich' means 'I am happy'). As 'fortunate/lucky', 'glücklich' is mainly used before nouns, as in 'ein glücklicher Zufall' (a lucky coincidence).
  - Do not confuse with 'fröhlich', which means 'cheerful' in a momentary way; 'glücklich' describes deeper happiness.
