notes:
  - "When using 'schmecken' to mean 'to taste good,' the structure is reversed in German: the food is the subject, and the person who likes it is in the dative case (e.g., 'Die Suppe schmeckt mir' - 'I like the soup')."
  - Don't confuse this with 'probieren' or 'kosten,' which are used when you are actively trying a small amount of something to test its flavour.
