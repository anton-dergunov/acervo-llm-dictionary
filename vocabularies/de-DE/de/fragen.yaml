shortGloss: to ask; to inquire
primaryGloss: ask
emotion: inquisitive and open, seeking information from another person
notes:
  - Takes the accusative case for the person asked ('Ich frage dich'). To ask about something, use 'nach' + dative ('Er fragt nach dem Weg').
  - Do not confuse with 'bitten' (to ask for a favor or item). Use 'fragen' only for asking questions to get information.
  - Reflexive 'sich fragen' means 'to wonder' ('Ich frage mich, ob er kommt').
