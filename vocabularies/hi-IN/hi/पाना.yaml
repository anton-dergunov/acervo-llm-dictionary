shortGloss: to be able to; to get; to find
primaryGloss: to get
emotion: content and satisfied, like holding something you finally received
notes:
  - After a verb stem, 'पाना' means 'to manage to' or 'to be able to', especially in negative sentences, and does not take 'ने' (मैं नहीं आ पाया — I could not come).
  - For passively receiving something or finding a lost item, everyday Hindi usually uses 'मिलना' (मुझे चाबी मिली), whereas 'पाना' implies achieving or finding after effort.
