notes:
  - The person who remembers or misses takes को (e.g., मुझे). For missing someone (sense 1), that person takes the feminine possessive की (मुझे तुम्हारी याद आती है); for recalling something (sense 2), it is the subject (मुझे उसका नाम याद आया).
  - Do not confuse with याद करना (to consciously remember, memorize, or think of someone).
