name: Acervo
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Acervo:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      # "Open at login", registered through SMAppService rather than a launch agent plist.
      - sdk: ServiceManagement.framework
    preBuildScripts:
      - name: Build web interface
        script: |
          cd "$SRCROOT/.."
          npm --prefix web run build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle web interface
        script: |
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dist"
          # Replaced, not merged into. The build directory outlives a build and every asset is
          # named by a digest of its contents, so merging keeps every asset of every earlier build
          # — hundreds of megabytes around a 6 MB interface, in every release and every update.
          rm -rf "$destination"
          mkdir -p "$destination"
          ditto "$SRCROOT/../web/dist" "$destination"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acervo.app
        PRODUCT_NAME: Acervo
        PRODUCT_MODULE_NAME: Acervo
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Acervo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHighResolutionCapable: YES
    scheme:
      testTargets:
        - AcervoTests
  AcervoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Acervo
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Acervo.app/Contents/MacOS/Acervo"
        BUNDLE_LOADER: "$(TEST_HOST)"
