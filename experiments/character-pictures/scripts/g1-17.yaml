# Full run, group g1, batch 17. Written from the fact sheets, following scripts/GUIDE.md.

契:
  object: a contract made by cutting notches into a wooden tally stick with a knife, the wood shown as a sturdy tree standing below
  history: >-
    The oldest forms drew a knife cutting notches into a piece of wood. The modern form changed the
    wood into the broad shape underneath.
  layout: >-
    The upper left holds a pale wooden tally stick standing upright, with three notches cut across it.
    To its right a small knife held point-down cuts toward the stick. Across the lower half stands a
    sturdy pale-brown tree with a broad crossing bough and two roots spreading to both sides. The
    knife does not touch the tree. Colours are pale wood, soft grey steel and light green.
  exact:
    - The three short lines across the stick are all crossed by the one vertical line, which is the stick.
    - The third line across is a little longer than the first two, and it rises to the right.
    - The knife's top line does not touch the stick's top notch; a small gap separates them.
    - The knife's handle starts on the knife's top line and does not touch the tree's left root.
    - The long line across the tree is the longest line of the character, wider than the whole knife and stick together.
    - The tree's two lower strokes both start where the trunk meets the long line across; the left one is longer.
  strokes:
    - where: a short line across the upper part of the left half, rising slightly to the right
      part: the stick's first notch
    - where: a short line across below it, rising slightly to the right, about as long as the first
      part: the stick's second notch
    - where: a line rising to the right across the lower part of the stick, a little longer than the two above
      part: the stick's third notch
    - where: a straight line down the left half, from the top to the bottom, crossing all three lines
      part: the tally stick itself
    - where: a line across the top of the right half, turning down at the right and ending in a small hook to the left
      part: the knife's back and blade, the hook its tip
    - where: a short stroke from the knife's top line down to the left, ending just above the tree
      part: the knife's handle
    - where: a long straight line across the middle of the whole width
      part: the tree's broad bough
    - where: a sweep from the middle of the bough down to the bottom left
      part: the tree's trunk running into its left root
    - where: a stroke from the middle of the bough down to the right, then turning across to the right
      part: the tree's right root

泉:
  object: a spring welling up from a rocky basin at the top, its water flowing down as a stream
  history: >-
    The oldest forms drew water flowing out of the mouth of a cave in the rock. The modern form
    separated the spring above from the flowing water below.
  layout: >-
    A small round stone basin sits at the top of the square with a pale blue bubble of water welling
    above it. Below it the stream flows down the middle of the frame and splashes out to both sides, as in
    a river between banks. Colours are pale grey stone and soft blue water.
  exact:
    - The bubble above the basin does not touch the basin's left side, but meets the start of its top rim.
    - The basin's left side and its top rim start at the same corner.
    - The basin's two short bars start on the left side, rising a little to the right; the lower bar closes the base where the left side ends.
    - The basin's top rim comes down on the right and ends where the lower bar ends.
    - The long straight stream starts on the lower bar of the basin and ends in a small hook up to the left.
    - The stream's right current starts on the stream, and the spray ends on that current's start.
    - The left current stands free and does not touch anything.
    - The right current is the longest stroke of the lower half; the left current is about two thirds as long.
  strokes:
    - where: a short stroke at the top, slanting down to the right and turning back down to the left
      part: the bubble of water welling up
    - where: a short line down the left side of the upper part, slanting a little to the right
      part: the basin's left side
    - where: a line across the top of the upper part from the left side, turning down on the right and sweeping down to the left
      part: the basin's top rim and right side
    - where: a short line across the middle of the basin, rising slightly to the right, about half as long as the rim
      part: a band of lighter stone
    - where: a short line across the bottom of the basin, rising slightly to the right
      part: the basin's base
    - where: a long line down the centre from the basin, ending in a small hook up to the left
      part: the main stream flowing down, curling into an eddy
    - where: a line at the middle left running across, then turning to sweep down to the bottom left
      part: a side current branching off to the left
    - where: a short slanting stroke at the upper right, running down toward the centre
      part: a spray of water splashing up on the right
    - where: a long sweep from the middle of the stream down and out to the bottom right
      part: a current flowing out to the right

封:
  object: a hand sealing a letter with a handful of mortar, two heaps of mortar stacked beside the hand
  history: 'An ideogram: a hand 寸 and heaps of earth 土 to seal something shut.'
  layout: >-
    The left half holds two heaps of pale mortar stacked one above the other, the upper one smaller. The
    right half holds a tall hand and sleeve reaching down, with a small seal stamp held at its middle
    pointing toward the heaps. A pale folded letter lies behind the heaps. The hand has a friendly
    sleeve of soft cloth; colours are pale clay, cream and light blue.
  exact:
    - The upper heap's vertical stroke crosses its short line across; it ends on the upper heap's long ground line.
    - The lower heap's vertical stroke starts on the upper ground line, crosses the short line across, and ends on the lower ground line.
    - The vertical of the upper heap and the vertical of the lower heap do not touch; a small gap separates them.
    - The upper ground line is the longest line of the left half; the lower ground line is a little shorter and rises at its right end.
    - The short lines across the heaps are about as long as each other and a little over half as long as the upper ground line.
    - The hand's line across crosses the long vertical, which ends in a small hook up to the left.
    - The seal dot stands free and touches neither the heaps nor the hand.
  strokes:
    - where: a short line across the upper left, rising slightly to the right
      part: the upper heap's top layer
    - where: a short stroke down the upper heap, slanting a little to the right, crossing the layer
      part: the upper heap's centre ridge
    - where: a long line across the middle of the left half, rising to the right, from the left edge to the centre
      part: the upper heap's ground
    - where: a short line across the lower left, rising slightly to the right
      part: the lower heap's top layer
    - where: a short stroke down the lower heap, slanting a little to the right, from the upper ground line to the lower ground line
      part: the lower heap's centre ridge
    - where: a line across the bottom of the left half, a little shorter than the upper ground line, rising a little at its right end
      part: the lower heap's ground
    - where: a line across the upper middle of the right half, rising slightly to the right
      part: the hand's sleeve cuff
    - where: a very long line down the right half from the top to the bottom, crossing the cuff and ending in a hook up to the left
      part: the arm and hand reaching down, the hook the fingers
    - where: a tiny stroke at the centre, slanting down to the right, standing free
      part: the seal stamp

既:
  object: a person turning away from a bowl of food, having already eaten
  history: >-
    The oldest forms drew a person kneeling by a bowl of food with the head turned away to the back:
    finished eating.
  layout: >-
    A tall food bowl on a stand fills the left third, with grains of food in it. A person stands to its
    right, in profile, facing right, turning away from the bowl with a friendly face (eyes, nose and
    mouth) and simple pale clothes. Colours are cream, soft tan and pale blue.
  exact:
    - The bowl's rim starts at the top of its left side, runs across and turns down on the right.
    - The two grain marks inside the bowl stand free of the rim; each starts on the left side of the bowl and stops short of the other.
    - The bowl's left side turns up to the right at its bottom, and the last small dot touches the bottom of that side.
    - The person's first stroke across the top is the shortest line there; the body's long sweep starts on its middle.
    - The person's arm crosses the body's sweep.
    - The person's last stroke starts on the body's sweep, runs down, then across, and ends in a small hook up.
    - The bowl and the person do not touch.
  strokes:
    - where: a stroke across the upper left, turning down at its right
      part: the bowl's rim and right side
    - where: a short dot inside the bowl, rising slightly to the right
      part: a grain of food
    - where: a short stroke below it, rising to the right
      part: a second grain of food
    - where: a long line down the left, turning up to the right at the bottom
      part: the bowl's left side and its foot
    - where: a short dot slanting down to the right, at the bottom of the left side
      part: the stand's small toe
    - where: a line across the top of the right part, rising slightly to the right
      part: the top of the person's turned head
    - where: a stroke starting lower left of the head line, going down and then across, rising slightly to the right
      part: the person's arm, held out behind
    - where: a long sweep from the middle of the head line down and out to the bottom left
      part: the person's back and body
    - where: a stroke from the middle of the body's sweep, down, then across to the right, ending in a small hook up
      part: the person's leg stepping away

骨:
  object: a bone with its joint knob lying above a piece of meat, flesh and bones
  history: >-
    The oldest forms drew a bone with its joint. The modern form added flesh below it: a skeleton
    wrapped in meat.
  layout: >-
    A pale bone lies across the upper part, a rounded joint knob above its left half, and a long shaft
    reaching to the right. Below it hangs a pale pink piece of meat, with bands of fat across it.
    Colours are ivory and soft pink.
  exact:
    - The joint knob is made of a short vertical on the left and a line across its top turning down on the right; a smaller inner line starts on the vertical.
    - The knob's lines all end on the long shaft below.
    - A short vertical at the left end of the shaft starts where the shaft starts.
    - The long shaft is the longest line across, ending in a small hook down to the left.
    - The meat's top line starts at the top of its left side and ends in a small hook to the left.
    - The two short bands inside the meat both start on its left side, and the lower is a little longer.
    - The meat sits below the shaft and does not touch it.
  strokes:
    - where: a short straight line down the left of the upper part
      part: the joint knob's left side
    - where: a line across the top from the knob's left side, turning down at the right
      part: the knob's top and right side
    - where: a short inner line across, rising slightly to the right, then turning down, below the top line
      part: the joint's socket
    - where: a short stroke down at the far left, below the knob
      part: the bone's left end
    - where: a long line across the middle, from the left end to the right, ending in a small hook down to the left
      part: the long bone shaft
    - where: a line down the left side of the lower part, from the middle to near the bottom
      part: the meat's left edge
    - where: a line across the top of the meat from the left side, turning down at the right and ending in a small hook to the left
      part: the meat's top and right edge
    - where: a short line across inside the meat, rising slightly to the right
      part: a band of fat
    - where: a short line across below it, rising slightly to the right, a little longer
      part: a second band of fat

皇:
  object: an emperor standing under a crown, between the sky above and the ground below
  history: 'An ideogram: a crown 白 on the head of a ruler 王.'
  layout: >-
    A tall pale-gold crown with a jewel on its peak sits on the head of an emperor who fills the lower
    half. He stands facing us in a long pale robe, arms held out to his sides, with a friendly face
    (eyes, nose and mouth). A wide stone dais lies under his feet. Colours are pale gold, cream
    and soft red.
  exact:
    - The crown's jewel meets the start of the crown's top rim.
    - The crown's left side and its top rim start at the same corner.
    - The crown's two bands start on the left side, rising slightly to the right; the lower band closes the base and ends where the rim ends.
    - The upper line across the emperor is his shoulders; the arms below are a little shorter than the shoulders, and the dais is clearly the longest, a little over twice the shoulders.
    - The emperor's vertical body starts on the shoulders, crosses the arms and ends on the dais.
  strokes:
    - where: a short stroke at the top, slanting down to the right and turning back down to the left
      part: the jewel on the crown's peak
    - where: a short line down the left side of the crown, slanting a little to the right
      part: the crown's left side
    - where: a line across the top of the crown from its left side, turning down at the right and running down the right side
      part: the crown's top rim and right side
    - where: a short line across the middle of the crown, rising slightly to the right
      part: a band of gems on the crown
    - where: a short line across the bottom of the crown, rising slightly to the right
      part: the crown's lower band
    - where: a line across, in the upper middle of the lower half
      part: the emperor's shoulders
    - where: a line across below it, a little shorter, crossing the vertical
      part: the emperor's arms, stretched out
    - where: a short straight line down from the shoulders to the dais, crossing the arms
      part: the emperor's body
    - where: a very long line across the bottom, the longest line, from the left edge to the right edge
      part: the dais under his feet

亮:
  object: a lit oil lamp, its flame above a dish of oil on a stand
  history: 'The oldest forms drew a lamp with a flame above a stand.'
  layout: >-
    A small pale flame burns at the top above a wide lamp cover. Below it sits a small open dish of oil, then
    a broad hood, and a stand with two legs reaching the bottom. The lamp glows pale yellow and
    soft orange in cream pottery.
  exact:
    - The flame mark and the line under it stand free of every other stroke and do not touch each other; a small gap separates them.
    - The line under the flame is the lamp cover, about four fifths as long as the hood's long line.
    - The dish's left side and its top line start at the same corner; its bottom line meets the end of the top line.
    - The hood's top line starts on the hood's left side and ends in a small hook down to the left; it is the longest line across.
    - The stand's left leg and the line along its base start at the same corner.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the flame
    - where: a long line across below it, near the top
      part: the lamp cover
    - where: a short line down the left of the dish
      part: the dish's left side
    - where: a line across the top of the dish from the left side, rising slightly, turning down at the right and ending in a small hook
      part: the dish's rim and right side
    - where: a short line across the bottom of the dish, rising slightly to the right
      part: the dish's bottom
    - where: a short line down at the far left of the lower half
      part: the hood's left edge
    - where: the longest line across, from the hood's left edge to the right, ending in a small hook down to the left
      part: the hood's top and right edge
    - where: a short sweep from the middle down to the bottom left
      part: the stand's left leg
    - where: a long stroke from the top of the left leg across to the right, then turning down and curling out along the bottom to the right, ending in a small hook up
      part: the stand's crossbar, right leg and foot

昼:
  object: the sun rising a foot above the horizon, measured against a foot-rule standing beside it
  history: >-
    The oldest forms drew the sun with a hand holding a measuring stick above the horizon: the day is
    when the sun is a foot high.
  layout: >-
    A measuring rod, a foot long, stands at the left and arches over the top left; its end bars are
    two lines. The pale yellow sun, round, sits on the horizon in the lower middle with a band of light
    across it. The long horizon lies across the bottom. Colours are pale yellow, cream and soft blue
    sky.
  exact:
    - The rod's upper end has two lines across, rising slightly to the right; the upper one ends in a small hook down.
    - The rod's long sweep starts at the rod's upper corner and runs down to the bottom left, well beyond the sun.
    - The rod's brace starts on the lower line across and turns across to the right.
    - The rod does not touch the sun, since the sun's left side stops a small gap short of the rod, and the rod's brace stops a small gap short of the sun's top.
    - The sun's top line turns down at the right; its two bottom lines meet at both ends.
    - The horizon line is the longest and stands free of every other stroke.
  strokes:
    - where: a line across the top, rising slightly to the right, ending in a small hook down
      part: the rod's top bar
    - where: a line across below it, rising slightly to the right
      part: the rod's second bar
    - where: a long stroke from the left end of the top bar down, then sweeping down to the bottom left
      part: the rod's long side
    - where: a stroke from the middle of the second bar down to the right, then turning across to the right
      part: the rod's brace
    - where: a straight line down the left of the sun
      part: the sun's left rim
    - where: a line across the top of the sun from the left rim, turning down on the right
      part: the sun's top and right rim
    - where: a short line across the sun's middle, rising slightly to the right
      part: a band of light across the sun
    - where: a short line across the sun's bottom, rising to the right
      part: the sun's bottom rim
    - where: a long line across the very bottom, from the left to the right
      part: the horizon

挥:
  object: a commander's hand directing an army, shown as a war cart of soldiers
  history: 'An ideogram: a hand 扌 directing an army 军.'
  layout: >-
    A large open hand stands at the left, fingers spread, waving the army on. At the right sits a
    war cart under a cloth cover, with a soldier sitting in it, who has a friendly face (eyes, nose
    and mouth) and simple clothes. The cart has a top wheel, a body and a bottom wheel. Colours are
    pale skin, cream cloth and soft green.
  exact:
    - The hand's long vertical crosses the line across and the rising stroke, and ends in a small hook up to the left.
    - The hand's line across is shorter than the rising stroke by about a fifth, and the rising stroke starts below it at the far left.
    - The cart's post and its cover touch, but a small gap separates the post's end from the line across the upper middle.
    - The cover is a line ending in a small hook down to the left; the cart's body is a stroke turning from down to across.
    - The cart's axle line starts in the middle of the body and crosses the long bottom line.
    - The top wheel's line crosses the body, and the axle starts below it.
  strokes:
    - where: a line across the upper middle of the left part, rising slightly to the right
      part: the fingers, spread out
    - where: a long line down the left part from the top to the bottom, crossing the line across, ending in a hook up to the left
      part: the arm and middle finger, the hook the wrist
    - where: a long stroke rising to the right below the line across, crossing the long vertical
      part: the thumb, spread wide
    - where: a short vertical stroke at the upper left of the right part
      part: the cover's left post
    - where: a line across the top from the post's top, ending in a small hook down to the left
      part: the cloth cover, its right edge hanging
    - where: a line across the upper middle, rising slightly to the right
      part: the top wheel's rim
    - where: a stroke going down from the upper middle of the cover, then turning across to the right
      part: the cart's body, front and floor
    - where: a long line across the lower part, from the left to the right edge
      part: the bottom wheel's rim
    - where: a vertical line from the middle down to the bottom, crossing the body and the long bottom line
      part: the axle

揮:
  object: a commander's hand directing an army, shown as a war cart of soldiers
  history: 'An ideogram: a hand 扌 directing an army 軍.'
  layout: >-
    A large open hand stands at the left, fingers spread, waving the army on. At the right sits a
    war cart under a cloth cover, with soldiers in it who have friendly faces (eyes, nose and
    mouth) and simple clothes. The cart has a top wheel, a body with two benches, and a bottom wheel.
    Colours are pale skin, cream cloth and soft green.
  exact:
    - The hand's long vertical crosses the line across and the rising stroke, and ends in a small hook to the left.
    - The hand's line across is a little shorter than the rising stroke, and the rising stroke starts below it at the far left.
    - The hand does not touch the cart, since the bottom wheel stops a small gap short of the hand.
    - The cover starts at the post's top and is about four fifths as long as the bottom wheel; it ends in a small hook down to the left.
    - The cart's body is a short vertical on the left, then a stroke across turning down the right side; the body's left side and the lower bench start at the same corner.
    - The upper bench is shorter than the lower bench, and neither touches the body's left side except where the lower bench starts.
    - The bottom wheel's line is the longest line across; the axle crosses the top wheel, both benches and the bottom wheel.
  strokes:
    - where: a line across the upper middle of the left part, rising slightly to the right
      part: the fingers, spread out
    - where: a very long line down the left part from the top to the bottom, crossing the line across, ending in a hook to the left
      part: the arm and middle finger, the hook the wrist
    - where: a long stroke rising to the right below the line across, crossing the long vertical
      part: the thumb, spread wide
    - where: a short vertical stroke at the upper left of the right part
      part: the cover's left post
    - where: a line across the top from the post's top, ending in a small hook down to the left
      part: the cloth cover
    - where: a short line across the top middle, rising slightly to the right
      part: the top wheel's rim
    - where: a short vertical line down the left of the middle
      part: the cart body's left side
    - where: a line from the top of the left side going across to the right, rising slightly, then turning down the right side
      part: the cart body's top and right side
    - where: a short line across inside the body, rising slightly to the right, in the upper part
      part: the upper bench
    - where: a longer line across inside the body, rising slightly to the right, in the lower part, from the foot of the left side
      part: the lower bench
    - where: a long line across the lower part of the frame, from the left edge to near the right edge
      part: the bottom wheel's rim
    - where: a very long vertical line from the top centre of the cart down to the bottom, crossing the benches and the bottom wheel
      part: the axle running through the cart

祝:
  object: a person praying aloud before a stone altar
  history: 'An ideogram: a person 兄 before an altar 礻, praying.'
  layout: >-
    A stone altar stands at the left with an offering slab above its table. A person stands to its right
    facing left toward the altar, head bowed a little. The head is large and open, the mouth
    speaking the prayer, with eyes and a nose above it, and the body wears a simple pale robe. Colours
    are pale stone grey and soft cream.
  exact:
    - The altar's table top is the longest line of the left half, rising slightly at its left end and turning down to the left into the left brace.
    - The altar's post starts on the table top and is about as long as the table is wide.
    - The offering slab and the right brace dot stand free of every other stroke.
    - The person's head is made of a short left line, a top line turning down at the right, and a short bottom line; the top line is about as long as the altar's table.
    - The head's bottom line is about four fifths as long as the top line, rising slightly to the right.
    - The person's left leg is a sweep below the head's left side; it stands free and stops short of the head.
    - The right leg starts on the head's bottom line, runs down, turns across to the right and rises at its end.
  strokes:
    - where: a short stroke at the top left of the left half, slanting down to the right
      part: the offering slab
    - where: a long line across the middle of the left half, rising slightly to the right, turning down and sweeping down to the left
      part: the altar's table top and left brace
    - where: a straight line down from the middle of the table to near the bottom
      part: the post holding the table
    - where: a short dot at the lower right of the table, slanting down to the right
      part: the right brace
    - where: a short line down the left of the head
      part: the left cheek
    - where: a line across the top of the head, turning at its right end to sweep down to the left
      part: the top of the head and right cheek
    - where: a short line across the bottom of the head, rising a little to the right
      part: the chin and lower lip
    - where: a sweep from below the head's left side down to the bottom left
      part: the person's left leg
    - where: a long stroke from the head's bottom line going down, then turning across to the right and rising at its end
      part: the person's right leg, ending in a raised foot

能:
  object: a bear with a round head, a furry body and two paws with claws
  history: >-
    The oldest forms drew a bear, with a head, body and claws. The modern form kept the head, body and
    two paws as separate parts.
  layout: >-
    A bear sits upright in profile facing right, filling the square. Its head is at the top left, its
    furry body below it on the left, and two paws with claws stretched out to the right, one above the
    other. It has a friendly face with eyes, a nose and a mouth. Colours are warm pale brown and
    cream.
  exact:
    - The head's stroke turns from down to across and ends touching the small dot, its ear.
    - The body's left side is a straight line down, the longest stroke on the left, ending in a plain point.
    - The body's top line starts at the top of the left side and turns down, ending in a small hook to the left.
    - The two short fur dashes inside the body start on the left side and stop short of the body's right side; they are about the same length.
    - Each paw is two strokes, a short claw sweeping down to the left, ending on the paw's long stroke at its middle, and the paw ends in a small hook up.
    - The upper paw is a little shorter than the lower paw; they do not touch each other.
  strokes:
    - where: a stroke in the upper left, going down and then turning across to the right, rising slightly
      part: the bear's head and snout
    - where: a short stroke at the end of the head, slanting down to the right
      part: the bear's ear
    - where: a straight line down the left of the lower half
      part: the body's back
    - where: a line across the top of the body from the back's top, turning down at the right and ending in a small hook to the left
      part: the body's top and chest
    - where: a short dash across inside the body, rising slightly to the right
      part: a band of fur
    - where: a short dash below it, rising slightly to the right
      part: a second band of fur
    - where: a short sweep at the top of the right half, down to the left
      part: the upper paw's claws
    - where: a stroke at the top of the right half, going down and turning across to the right, ending in a hook up
      part: the upper paw
    - where: a short sweep in the middle of the right half, down to the left
      part: the lower paw's claws
    - where: a longer stroke below it, going down and turning across to the right, ending in a hook up
      part: the lower paw

高:
  object: a tall palace of three tiers, with a roof, an upper room and a lower hall with a door
  history: 'The oldest forms drew a tall building with a roof, an upper storey and a door.'
  layout: >-
    A tall pale palace fills the square. A small pointed finial and a wide roof rest on the top, an
    open window room sits below the roof, and a broad hall with a small arched door fills the bottom.
    Colours are pale stone, soft red roof tiles and cream.
  exact:
    - The finial and the roof line stand free of every other stroke and do not touch each other.
    - The roof line is the longest line at the top, about three fifths as wide as the hall.
    - The upper room is a small open box made of a left side, top line turning down on the right, and bottom line; its top line does not touch the roof line.
    - The hall's left wall and its roof-and-right-wall stroke start at the same corner.
    - The hall's long stroke is the widest line of the building and ends in a small hook up to the left.
    - The door is a small box made of a left side and top line start at the same corner, and the threshold line closes its bottom.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the finial
    - where: a long line across below it
      part: the roof
    - where: a short line down the left of the upper room
      part: the room's left side
    - where: a line across the top of the room, turning down at the right and ending in a small hook to the left
      part: the room's top and right side
    - where: a short line across the bottom of the room, rising slightly to the right
      part: the room's floor
    - where: a line down the left of the hall, starting a little to the right at the top
      part: the hall's left wall
    - where: a line across the top of the hall from the wall's top, turning down the right side and ending in a hook up to the left
      part: the hall's top and right wall
    - where: a short line down the left of the door
      part: the door's left post
    - where: a line across the top of the door, rising slightly, then turning down
      part: the door's lintel and right post
    - where: a short line across the bottom of the door, rising slightly to the right
      part: the door's threshold

真:
  object: a low table whose top is checked to be level by an eye looking along it
  history: >-
    The oldest forms drew an eye looking straight along a line to see it is level. The table below was
    added to say what is checked.
  layout: >-
    An upright eye sits over a straight level table top, with a small cross mark above the eye. The eye is
    a tall almond shape with a pale iris. A low table with two legs stands under the top, which is the long
    straight line of the picture. Colours are pale wood, soft blue and cream.
  exact:
    - The cross mark is a line across and a vertical that crosses it; the vertical ends touching the eye's top.
    - The eye's left lid and its top line start at the same corner.
    - The eye's three inner lines (two short and one at the bottom) touch the left lid and stop short of the right side; they are about the same length.
    - The eye's top turns down on the right and ends touching the table top; the left lid also ends on the table top.
    - The table top is the longest line across, nearly the whole width, and the cross mark's line across is a little over half as long.
    - The two legs stand free of the table top and of each other, the left one sweeps down to the left, the right one runs down to the right.
  strokes:
    - where: a line across the top of the upper part, a little over half as long as the table top
      part: the cross mark's arm
    - where: a short stroke down the middle of the top, slanting a little to the right, crossing the line across
      part: the cross mark's post
    - where: a straight line down the left of the eye
      part: the eye's left lid
    - where: a line across the top of the eye from the left lid, turning down on the right
      part: the eye's top and right lid
    - where: a short line across the eye, rising slightly to the right, in the upper part
      part: the iris's upper edge
    - where: a short line across below it, rising slightly to the right
      part: the iris's lower edge
    - where: a short line across the bottom of the eye, rising slightly to the right
      part: the eye's lower lid
    - where: a long straight line across the lower middle, nearly the whole width of the square
      part: the table top, level
    - where: a short sweep at the lower left, down to the left
      part: the table's left leg
    - where: a short stroke at the lower right, slanting down to the right
      part: the table's right leg

料:
  object: a hand holding a dipper to measure out rice grains, with a stalk of rice beside it
  history: 'An ideogram: a dipper 斗 measuring rice 米.'
  layout: >-
    On the left grows a stalk of rice with its grains. On the right a long-handled dipper is held by a
    hand in a pale sleeve at the bottom of the handle, with two grains of rice falling toward its cup.
    The two parts are side by side and do not touch. Colours are pale gold grain, cream and soft green.
  exact:
    - The rice stalk is a straight vertical ending in a plain point, with no hook.
    - The line across crosses the stalk.
    - The stalk's lower left sweep and the dot on its right both start on the stalk, and they do not touch each other.
    - The dipper's cup rim is a line across the whole width of the right half, and the handle crosses it.
    - The handle is a straight vertical ending in a plain point, with no hook, nearly as long as the whole height.
    - The two grains above the cup rim stand free of everything.
  strokes:
    - where: a short dot at the upper left of the left half, slanting down to the right
      part: a grain of rice, upper left
    - where: a short stroke at the top of the stalk's right side, slanting down to the left
      part: a grain of rice, upper right
    - where: a line across the left half, a little below the middle, rising slightly to the right
      part: a branch of rice held out
    - where: a long straight line down the left half from the top to near the bottom, crossing the branch
      part: the rice stalk
    - where: a sweep from the stalk's centre down and out to the bottom left
      part: a branch of grains drooping to the left
    - where: a short dot beside the stalk's lower right, slanting down to the right
      part: a grain of rice drooping to the right
    - where: a small dot at the upper left of the right half, slanting down to the right
      part: a grain falling toward the dipper
    - where: a small dot below it, slanting down to the right
      part: a second grain falling
    - where: a long line across the middle of the right half, the whole width
      part: the dipper's cup rim
    - where: a long straight line down the middle of the right half, crossing the cup rim
      part: the dipper's long handle

愛:
  object: someone dear brought into one's house, under a roof, a hand reaching in from above
  history: >-
    The oldest forms drew a person looking back with a heart and a longing to go home. The traditional
    form puts a heart inside a house, and the simplified form puts a friend inside it.
  layout: >-
    A pale house roof spreads across the middle of the square, with a pale red heart sitting under it.
    Above the roof a hand reaches down from the top, its fingers curling in. Below the house a foot steps
    forward to the right, wearing a soft shoe. Colours are cream, pale red and soft grey.
  exact:
    - The hand's four strokes all stand free, and a small gap separates the long top stroke from the middle dot.
    - The roof's left edge and its ridge start at the same corner; the ridge is the longest line across and ends in a small hook down to the left.
    - The heart stands under the roof and does not touch it; the heart's left side, its curved base, and its two dots all stand free of each other.
    - The heart's curved base runs across, turns up to the right and ends in a small hook up to the left.
    - The foot's two long strokes start at the same corner and cross each other; the leg's long stroke turns down and curls back to the left.
    - The foot does not touch the heart; a small gap separates the heart's base from the leg.
  strokes:
    - where: a line at the top, running to the left, turning down to the left at its end
      part: the hand's back and wrist
    - where: a small dot below the hand's left end, slanting down to the right
      part: the hand's first finger
    - where: a tiny dot at the top centre, slanting down to the right
      part: the hand's middle finger
    - where: a short stroke at the upper right, slanting down to the left
      part: the hand's thumb
    - where: a short line down the left of the roof
      part: the roof's left edge
    - where: a long line across the roof from the left edge, ending in a small hook down to the left
      part: the roof's ridge and right edge
    - where: a short line down the left of the heart, beneath the roof
      part: the heart's left edge
    - where: a stroke across the bottom of the heart, turning up to the right, ending in a small hook up to the left
      part: the heart's rounded base
    - where: a small dot near the top centre of the heart, slanting down to the right
      part: a vessel rising from the heart
    - where: a small dot at the upper right of the heart, slanting down to the right
      part: a second vessel
    - where: a long sweep from the centre of the lower part down to the bottom left
      part: the back leg
    - where: a stroke from the same start across to the right, rising slightly, turning down and then down to the left
      part: the front leg bent at the knee
    - where: a stroke from the middle of the back leg down to the right, then turning across to the right at the bottom
      part: the foot stepping forward

爱:
  object: someone dear brought into one's house, under a roof, a hand reaching in from above
  history: >-
    The oldest forms drew a person looking back with a heart and a longing to go home. The traditional
    form puts a heart inside a house, and the simplified form puts a friend inside it.
  layout: >-
    A pale house roof spreads across the upper middle of the square. Above it a hand reaches down from the
    top, its fingers curling in. Under the roof two hands clasp each other in friendship, a sleeve at the
    lower left and a sleeve at the right, in soft cloth. Colours are cream, pale red and soft grey.
  exact:
    - The hand's four strokes all stand free; a small gap separates the long top stroke from the middle dot.
    - The roof's left edge and its ridge start at the same corner; the ridge is the longest line across and ends in a small hook down to the left.
    - The roof does not touch the hand above it.
    - The left hand's line across is clearly shorter than the right hand's stroke, a little over half as long.
    - The left arm's sweep starts on the roof's ridge, and the line across crosses it.
    - The right hand's stroke starts on the sweep, runs across and turns down to the left; it is clearly longer than the left hand's line across.
    - The fingers' stroke runs down to the right and across, and crosses the right hand's stroke; it does not touch the sweep.
  strokes:
    - where: a line at the top, running to the left
      part: the hand's back and wrist
    - where: a small dot below the hand's left end, slanting down to the right
      part: the hand's first finger
    - where: a tiny dot at the top centre, slanting down to the right
      part: the hand's middle finger
    - where: a short stroke at the upper right, slanting down to the right and turning back down to the left
      part: the hand's thumb
    - where: a short line down the left of the roof
      part: the roof's left edge
    - where: a long line across the roof from the left edge, ending in a small hook down to the left
      part: the roof's ridge and right edge
    - where: a short line across the left of the lower part, rising slightly to the right, a little over half the length of the right hand's stroke
      part: the left hand's fingers
    - where: a long sweep from the roof's ridge down through the line across and out to the bottom left
      part: the left arm and sleeve
    - where: a stroke from the middle of the sweep going across to the right, rising slightly, then turning down to the left
      part: the right hand's back and wrist
    - where: a stroke below it, going down to the right and then across to the right
      part: the right hand's fingers, clasping

展:
  object: clothes laid out for sale in a market stall
  history: 'An ideogram: clothes laid out for sale beneath a stall 尸.'
  layout: >-
    A market stall with a slanting awning stands at the upper left, its long left post reaching
    the bottom. Under the awning a pole carries two garments hanging side by side. Below it a robe lies
    spread flat across the stall's table. Colours are pale cloth, soft blue and cream.
  exact:
    - The awning's top line ends in a small hook down to the left; the line below is a little shorter, about four fifths as long, and rising slightly to the right.
    - The post sweeps down to the bottom left from the awning's top left; it is the longest down stroke.
    - The pole across crosses both hanging garments; the left garment is a little shorter than the right.
    - The pole does not touch the post; a small gap separates them.
    - The right garment starts on the awning's lower line.
    - The robe's shoulder line is the longest line across; the garment's left side starts at its left end.
    - The robe's right sleeve is a short dash that stops a small gap short of the shoulder line.
  strokes:
    - where: a line across the top of the awning, ending in a small hook down to the left
      part: the awning's top edge
    - where: a line across below it, rising slightly to the right, a little shorter
      part: the awning's lower edge
    - where: a long stroke from the awning's top left, down and then sweeping down to the bottom left
      part: the stall's long left post
    - where: a line across the middle of the right of the upper part, rising slightly to the right
      part: the pole for hanging clothes
    - where: a short vertical stroke hanging from the pole at the left, crossing it
      part: the left garment hanging
    - where: a short stroke hanging from the awning down through the pole at the right, slanting a little
      part: the right garment hanging
    - where: a line across the middle of the lower part, rising slightly to the right
      part: the robe's shoulders
    - where: a stroke from the left end of the shoulders going down, then curving up to the right
      part: the robe's left side
    - where: a short slanting stroke at the right, down to the left
      part: the robe's right sleeve
    - where: a stroke from the centre of the shoulders down to the right, then turning across to the right
      part: the robe's right side and hem

素:
  object: a silken thread hanging from the low bough of a tree
  history: 'An ideogram: a silken thread 糸 hanging from a tree.'
  layout: >-
    A tree with a straight trunk and two small boughs at the top stands in the upper half; a long
    low bough spreads across its base. From that low bough a pale white silken thread hangs, twisting in
    a loop and ending in two frayed tips at the bottom. Colours are soft green and pale silk white.
  exact:
    - The tree's trunk crosses both short boughs and ends on the long low bough.
    - The two short boughs are about half as long as the low bough, the upper a little longer than the lower.
    - The thread does not touch the trunk, and a small gap separates the trunk's end from the thread's start.
    - The thread's first loop starts on the low bough; its long stroke does not touch the low bough, and a small gap separates them.
    - The thread's hanging stroke starts on the long loop and ends in a small hook to the left; it is a straight line down.
    - The two frayed tips stand free; the left one is shorter than the right one.
  strokes:
    - where: a short line across the upper part of the tree, rising slightly to the right
      part: the tree's upper bough
    - where: a short line across below it, rising slightly to the right
      part: the tree's second bough
    - where: a stroke down the middle from the top, crossing both boughs
      part: the tree's trunk
    - where: a long line across the lower part of the upper half, from the left to the right edge
      part: the tree's low bough
    - where: a short stroke from the middle of the low bough down to the left and turning across to the right
      part: the thread's first loop
    - where: a stroke from the right of the low bough's middle going down to the left and turning across to the right, rising slightly
      part: the thread's long loop
    - where: a short stroke at the right of the loop, slanting down to the right
      part: the knot of the thread
    - where: a short stroke from the middle of the long loop down, turning to the left at the bottom
      part: the thread hanging down
    - where: a short sweep at the bottom left, down to the left
      part: the thread's left frayed tip
    - where: a short stroke at the bottom right, slanting down to the right
      part: the thread's right frayed tip

笑:
  object: a person laughing with a big grin
  history: >-
    The oldest forms drew a person bending and dancing with joy. The grin above them was added to say
    the person is laughing.
  layout: >-
    A laughing person fills the square. A large happy face with a wide open grin fills the upper
    third, its cheeks raised, its eyes crinkled shut with laughter, and a nose. Below it the body
    bends in joy, arms thrown wide, in simple pale clothes. Colours are pale skin, soft pink and cream.
  exact:
    - The left cheek stroke and the right cheek stroke are the two long strokes at the top, the left a little longer.
    - The eye crinkle on the left starts on the left cheek and does not touch the right cheek; a small gap separates them.
    - The right eye crinkle starts on the right cheek.
    - The two dimple dots stand free of everything.
    - The tilted neck stroke is a line to the left at the top of the body, and the body's long sweep starts on it.
    - The arms' line across crosses the body's sweep; the right leg starts on both.
    - The arms are the longest line across, and the right leg is the longest stroke of the body.
  strokes:
    - where: a stroke down the left of the face from the top left, then turning down to the left
      part: the left cheek, raised
    - where: a short line across the face's left, rising slightly to the right
      part: the left eye, crinkled with laughter
    - where: a tiny dot below it, slanting down to the right
      part: the left dimple
    - where: a stroke down the right of the face from the top, turning down to the left
      part: the right cheek, raised
    - where: a short line across the face's right, rising slightly to the right
      part: the right eye, crinkled with laughter
    - where: a tiny dot below it, slanting down to the right
      part: the right dimple
    - where: a short line at the top of the body, running to the left
      part: the person's tilted neck
    - where: a long line across the middle, from the left to the right
      part: the person's arms, thrown wide
    - where: a long sweep from the neck's middle down, then down and out to the bottom left
      part: the person's body, running down into the left leg
    - where: a long stroke from the centre of the body down to the right, then turning across to the right
      part: the right leg

难:
  object: a hand reaching out to grasp a bird, which flies away
  history: 'An ideogram: a hand 又 trying to catch a bird 隹.'
  layout: >-
    A right hand reaches out from the left, thumb hanging down, trying to catch a bird. At the
    right a small bird perches on a branch facing right, away from the hand, wings folded. The bird
    has a round eye and a beak. Colours are pale skin, soft blue feathers and cream.
  exact:
    - The hand's sleeve stroke crosses its back-of-hand stroke; the hand does not touch the bird, and a small gap separates them.
    - The bird's back is a sweep down to the left; the body's vertical starts on it at its middle.
    - The bird's branch starts on the body and stops at the right; it is the longest line across, and it is touched by the end of the wing's vertical.
    - The three wing lines across are of nearly equal length, the top one a little longer.
    - The wing's vertical starts on the top wing line, crosses the two others and ends on the branch.
    - The eye dot stands free of everything.
  strokes:
    - where: a stroke across the upper part of the left, rising slightly, then turning down and sweeping down to the bottom left
      part: the back of the hand and the thumb, hanging down
    - where: a stroke from the middle left sweeping down to the right
      part: the forearm running to the cuff
    - where: a stroke from the top of the right part, going down and turning down to the left
      part: the bird's head and back
    - where: a long straight line down from the middle of the back to near the bottom
      part: the bird's body
    - where: a small dot at the upper right, slanting down to the right
      part: the bird's eye and beak
    - where: a short line across the upper right, rising slightly to the right
      part: the top wing feather
    - where: a slightly shorter line across below it, rising slightly to the right
      part: the middle wing feather
    - where: a line across below it, rising slightly to the right
      part: the bottom wing feather
    - where: a straight line down on the right, from the top wing line to near the bottom
      part: the wing's edge
    - where: a line across the very bottom, from the body to the right edge
      part: the branch the bird perches on

离:
  object: a rare beast standing straight, with a horned head and strong legs
  history: >-
    The oldest forms drew an animal with a head, a patterned body and hooves, standing straight.
    The head is the roof-like mark on top.
  layout: >-
    A rare beast stands upright facing us. A small horn rises on the head, whose brow is a wide line.
    Its body has a cross of stripes between two flanks, and its legs stand wide below. The beast has
    a gentle face with eyes, a nose and a mouth. Colours are soft sand, pale gold and cream.
  exact:
    - The horn dot stands free and does not touch the brow line; a small gap separates them.
    - The two stripe strokes on the chest cross each other; the second stripe does not touch the left flank, ending a small gap short of the right flank.
    - The left flank turns across at its bottom, rising slightly to the right, and ends on the right flank.
    - The brow line is about as long as the haunch's line across, the longest line across.
    - The left leg is the longest down stroke, and the left leg's start touches the haunch's start.
    - The inner leg starts on the left flank's bottom and crosses the haunch's line across.
    - The small toe starts on the inner leg's end.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the horn
    - where: a wide line across below it, near the top
      part: the beast's brow
    - where: a short stroke from the brow's middle down, then turning down to the left
      part: the first stripe on the chest
    - where: a short stroke slanting down to the right from the upper left of the chest
      part: the second stripe
    - where: a stroke down the left of the body, then turning across to the right, rising slightly
      part: the left flank and belly
    - where: a short line down on the right of the body
      part: the right flank
    - where: a straight line down the left of the lower half
      part: the left foreleg
    - where: a long line across the top of the lower half from the leg's top, turning down at the right and ending in a small hook to the left
      part: the haunch and right hind leg
    - where: a stroke from the middle of the body down, then turning up to the right
      part: the inner leg
    - where: a short stroke slanting down to the right in the middle
      part: the small toe

息:
  object: a friendly face's nose breathing in, above a heart
  history: 'An ideogram: breath through a nose 自 into the heart 心.'
  layout: >-
    A friendly face fills the upper half, with eyes on both sides of its nose and a small smile, and
    pale breath curling toward its nostrils. Below it, in the chest of a simple pale shirt, sits a pale red
    heart with two small vessels rising from its top. Colours are pale skin, cream and soft red.
  exact:
    - The nose's top stroke ends where the left side starts and meets the start of the line across the top.
    - The nose's left side and its top line start at the same corner.
    - The nose's two short creases start on the left side and stop short of the right side; they are about the same length.
    - The nose's base line starts at the left side's end and ends where the top line's end does.
    - The heart's left edge and the curved base stand free of each other and of the nose.
    - The heart's two dots stand free; the upper right one is longer than the one near the centre.
  strokes:
    - where: a short stroke at the top, slanting down to the right and turning down to the left
      part: the top of the nose's bridge
    - where: a straight line down the left of the nose, slanting a little to the right
      part: the nose's left side
    - where: a line across the top, turning down to run down the right side and ending in a small hook to the left
      part: the top of the bridge and the nose's right side
    - where: a short line across in the upper middle of the nose, rising slightly to the right
      part: a crease across the bridge
    - where: a short line across in the lower middle, rising slightly to the right
      part: a second crease
    - where: a line across the bottom of the nose, rising slightly to the right
      part: the base of the nose
    - where: a short stroke on the left of the heart, down a little to the left
      part: the heart's left edge
    - where: a long curve from the left of centre down, along the bottom to the right and up, ending in a small hook up to the left
      part: the heart's rounded body
    - where: a short dot near the top centre of the heart, slanting down to the right
      part: a vessel rising from the heart
    - where: a dot at the upper right of the heart, slanting down to the right
      part: a second vessel

座:
  object: a wide building with a seat in it, two people sitting on the ground facing each other under its roof
  history: >-
    An ideogram: a wide hall 广 with a place to sit 坐, where two people sit on the ground facing each other.
  layout: >-
    A wide lean-to hall fills the square, its roof across the top and its wall on the left. Under the
    roof two people sit on the ground facing each other with a small tree between them. Both have friendly
    faces (eyes, nose and mouth) and simple pale clothes. The ground is the line at the bottom. Colours
    are warm cream, soft green and pale blue.
  exact:
    - The roof's ornament dot stands free of every other stroke.
    - The roof's line across starts on the wall's top and ends at the right, longer than the tree's low bough.
    - The wall is the longest down stroke, curving to the bottom left, and does not touch the left person.
    - The tree's trunk stands free of the roof, and a small gap separates the trunk's top from the roof line.
    - The left person's back sweeps down to the left and the knee dot starts on it at its middle.
    - The right person's back and knee dot likewise; a small gap separates her back from the trunk.
    - The tree's low bough crosses the trunk; the trunk ends on the ground line.
    - The ground is the longest line across, about twice as long as the low bough.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's small ornament
    - where: a line across the upper part from the wall's top to the right, rising very slightly to the right
      part: the roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the wall of the building
    - where: a sweep at the upper left of the people, going down and then down to the left
      part: the left person's back, leaning forward
    - where: a short dot against the lower part of that sweep, slanting down to the right
      part: the left person's knees
    - where: a sweep at the upper right, going down and then down to the left
      part: the right person's back and arm
    - where: a short dot against the lower part of that sweep, slanting down to the right
      part: the right person's knees
    - where: a line across, below the middle, rising slightly to the right
      part: the tree's low bough
    - where: a long straight line down the centre, from the top to the bottom line
      part: the tree's trunk
    - where: a long line across the bottom
      part: the ground
