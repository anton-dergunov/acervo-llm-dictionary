# Full run, group g1, batch 15. Written from the fact sheets, following scripts/GUIDE.md.

要:
  object: a woman with her hands on her waist
  history: >-
    The oldest forms drew a woman with both hands placed on her waist; the upper part is her
    hands and waist, the lower part the woman.
  layout: >-
    One woman fills the square, seen from the front and turned a little to the left. She has a
    friendly face with eyes, a nose and a mouth, set just above the top stroke, and wears a simple
    pale blouse and skirt. Her elbows stick out wide in the upper half, her hands rest on her
    waist, and below the waist her hip, thigh and shin fold down to the bottom, kneeling. Colours
    are pale and soft.
  exact:
    - The short stroke at the top (her shoulders) does not touch the left of the two short down strokes; the right short down stroke starts on it.
    - The long stroke across the upper half turns down at its right end; the two short down strokes cross it.
    - The line across below them closes the frame and touches the end of the long turning stroke.
    - The line across the bottom of the upper half is about two fifths as long as the widest line across the picture, which is the lowest line across.
    - The woman's two lower sweeps cross each other and the widest line across.
    - The widest line across the lower half spans almost the whole width, clearly longer than the long line across above.
  strokes:
    - where: a short line across the top of the upper half, rising a little to the right
      part: her shoulders and collar
    - where: a short stroke at the left of the upper half, slanting down to the right, ending at the left end of the line across the waist
      part: her left sleeve, running down to the elbow
    - where: a long line across the upper half, starting at the top of the left sleeve, turning down at the right end
      part: her arms held out wide at the elbows, the right one bending down to her waist
    - where: a short stroke down to the right, left of the middle of the upper half, crossing the long line across
      part: a fold of her blouse
    - where: a short stroke down to the right, right of the middle of the upper half, starting on the line across the top and crossing the long line across
      part: another fold of her blouse
    - where: a line across the lower part of the upper half, rising a little to the right, shorter than the long line across above it
      part: her belt, where her hands rest
    - where: a stroke from just below the belt, going down, then turning sharply to sweep down to the bottom right
      part: her hip and thigh, folded forward to the knee
    - where: a sweep from the right of the middle of the lower half down to the bottom left, crossing the first
      part: her shin, reaching back
    - where: a line across the lower half from near the left edge to near the right edge, crossing both sweeps
      part: the hem of her wide skirt, spread on the ground

後:
  object: a person walking, with a second person's foot coming down behind him, a trailing thread tied to it
  history: >-
    The oldest forms drew a step 彳 with a small bundle of thread 幺 hanging from a foot 夂 that
    comes down behind: to be behind, to come after.
  layout: >-
    The left third holds a walker seen from the side, facing right, with a friendly face and a simple
    pale coat; only his back leg is ink. The right two thirds hold a second person coming after him,
    also with a face and simple clothes, drawn behind the strokes: a small pale coil of thread hangs
    from his belt in the upper half, and his trailing leg and foot reach down in the lower half. Colours
    are pale.
  exact:
    - The walker's strokes stand apart from the right-hand part; the left part and the right part do not touch.
    - The upper two strokes on the left both sweep down to the left; the lower one is a straight vertical with a plain end, standing free of the upper strokes except for touching the middle of the second.
    - In the thread, the top stroke ends on the middle of the second; the second turns across to the right at its end, and the short stroke ends it from above on the right.
    - The thread's second stroke is clearly the longer, about three fifths as long again as the first.
    - In the foot, the two short sweeps start from the same point; the long sweep crosses the third.
    - The last stroke is the longest of the lower right, sweeping down to the right and turning across to the right at its end.
  strokes:
    - where: a short sweep at the top of the left third, down to the left
      part: the walker's back thigh, bent
    - where: a longer sweep below it, down to the left, with a gap from the first
      part: the walker's back knee and shin
    - where: a straight vertical line from the middle of the lower sweep down to the bottom
      part: the walker's back foot, planted straight
    - where: a short stroke at the top of the right part, going down to the left and turning across to the right
      part: the upper loop of the thread
    - where: a longer stroke below it, from the upper right, going down to the left and turning across, rising slightly to the right
      part: the lower loop of the thread, the first loop ending on its middle
    - where: a short stroke on the right of the thread, slanting down to the right
      part: the knot at the end of the thread
    - where: a short sweep in the middle of the right part, going down to the left
      part: the second person's thigh
    - where: a long stroke starting beside it, going across and rising slightly to the right, then turning to sweep down to the left
      part: his shin, bending back behind him
    - where: a stroke from the middle of the short sweep, going down to the right and turning across to the right at the end
      part: his trailing foot, flat on the ground

度:
  object: a person standing in a lean-to building, among tall posts that stand for twenty people
  history: >-
    The oldest forms drew twenty people 廿 gathered with a hand 又 inside a building 广, to talk over
    a measure. The posts stand for the twenty.
  layout: >-
    A lean-to building takes the upper left and the whole left side: a roof across the top and a tall wall
    down the left. Inside it, in the upper right, a rail carries two tall posts, a tally of twenty, in
    pale wood. Below, a person with a friendly face and simple pale clothes stands facing left toward the
    posts. Pale colours throughout.
  exact:
    - The small dot at the top is a separate mark above the roof, not touching it.
    - The roof starts at the top of the wall, touching it, and rises a little to the right; the wall curves down to the bottom left.
    - The rail across the posts is about as long as the roof, a little over half as long as the line across the person's shoulders.
    - The two posts cross the rail; they do not touch the roof, and the wall stands apart from the rail.
    - The short bar at the posts' feet is clearly the shortest line across, about a fifth as long as the line across the person.
    - The left post's end meets the left end of the short bar; the right post ends on the middle of the bar.
    - The two lowest strokes cross each other, and the long sweep down to the right is the longest of the person's strokes.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's small ornament
    - where: a line across the upper part, from the top of the wall to the right, rising very slightly to the right
      part: the roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the wall of the building
    - where: a line across the upper middle, rising slightly to the right, about as long as the roof
      part: the rail
    - where: a short straight line down, left of the middle, crossing the rail
      part: the left post
    - where: a short stroke down, right of the middle, crossing the rail, turning slightly down to the right
      part: the right post
    - where: a very short line across below the rail, rising slightly to the right
      part: the bar tying the posts at their feet
    - where: a line across the middle, rising slightly to the right, turning down and then sweeping down to the bottom left
      part: the person's shoulders, back and left leg
    - where: a long stroke from the middle of the first, going down to the right and turning across to the right at the end
      part: the person's right leg and foot

美:
  object: a person wearing an elegant crown of ram's horns
  history: >-
    The oldest forms drew a person 大 with a head-dress of horns 羊 on top: a fine, handsome sight.
  layout: >-
    A grown person stands facing you with arms stretched out wide and legs apart, in simple pale
    clothes, filling the lower half. The crown of ram's horns fills the upper half: two horns at the
    top, three bands across, a straight post down its middle. The person's friendly face (eyes, nose,
    mouth) shows just below the crown's lowest band. Pale colours.
  exact:
    - The two horns at the top do not touch the bands below; the left horn is shorter than the right, the right horn curving down toward the left.
    - The top band is the longest of the three bands except the lowest; the middle band is clearly shorter, a little over half as long as the lowest band.
    - The lowest band is the widest line of the crown, wider than the band above it.
    - The post down the middle starts on the top band, crosses the middle band and ends on the lowest band, and stops short of the person's body.
    - The arms are a long line across, a little shorter than the lowest band, and clearly longer than the crown's middle band.
    - The body sweep starts from the lowest band, crosses the arms and sweeps down to the bottom left; the right leg starts on the arms and on the body.
  strokes:
    - where: a short stroke at the top left, slanting down to the right
      part: the crown's left horn
    - where: a short stroke at the top right, curving down to the left
      part: the crown's right horn
    - where: a line across, below the horns, rising slightly to the right
      part: the crown's top band
    - where: a shorter line across the middle, rising slightly to the right
      part: the crown's middle band
    - where: a short straight line down the centre, crossing the middle band
      part: the crown's centre post
    - where: a line across, widest of the crown, below the middle
      part: the crown's lowest band
    - where: a long line across, below the crown, a little shorter than the lowest band
      part: both arms, stretched straight out
    - where: a long sweep from the lowest band, down through the centre, curving out to the bottom left
      part: the neck, body and left leg
    - where: a long sweep from the middle of the body, down and out to the bottom right
      part: the right leg

食:
  object: a covered dish of food on a stand
  history: >-
    The oldest forms drew a tall dish of food 良 with a lid 人 on top: a meal.
  layout: >-
    A pale ceramic lid, shaped like a wide pointed cone, covers the top half. Beneath it stands a tall
    food vessel on a stand, seen from the front, in pale clay with pale rice and vegetables visible in
    the mouth. Soft steam, pale, floats in the gap between lid and vessel. Pale colours.
  exact:
    - The two lid strokes join at the top, the right one starting on the left one at the top.
    - The small dot between lid and vessel is a separate mark; it touches nothing.
    - The vessel's left side starts on the lid's left sweep, below the dot; it ends in a small rise at its bottom.
    - The stroke across the vessel's top turns down on the right; the stroke of the left side touches its left end, and a short bar from the left side touches its end.
    - The two short bars on the left are inside the vessel and touch its left side.
    - The two strokes on the right are short; the stand's foot does not touch the vessel's left side.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left
      part: the lid's left slope
    - where: a sweep from the top of the first stroke down and out to the right, turning across at the end
      part: the lid's right slope
    - where: a small dot just below the lid's top, slanting down to the right
      part: a morsel of food, rising in steam
    - where: a line across the upper middle, turning down at the right
      part: the vessel's rim and its right side
    - where: a short line across the vessel's left, rising slightly to the right
      part: an upper layer of food
    - where: a short line rising to the right, lower on the left of the vessel
      part: a lower layer of food, closing the vessel's side
    - where: a long stroke from the vessel's left, down to the right, then down and curving up to the right at the bottom
      part: the vessel's left side, its belly and its foot
    - where: a short stroke at the right of the vessel, going down and hooking to the left
      part: the vessel's right handle
    - where: a stroke from the foot of the vessel, going down to the right
      part: the stand's foot, spreading to the right

面:
  object: a person's face seen from the front
  history: 'The oldest forms drew the outline of a face with an eye in it.'
  layout: >-
    One large friendly face fills the square, seen from the front, with a smooth skin colour in pale
    tones. Dark hair is not used; the hair is pale brown. Eyes, a nose and a mouth sit on the middle line
    of the face and are drawn into the pale space between the strokes. Pale colours.
  exact:
    - The two top strokes touch, the short stroke starting on the middle of the line across the top.
    - The long stroke that runs across and turns down at the right is the longest in the picture, about as long as the whole width of the face, and ends in a hook.
    - The left cheek stroke starts on the left end of that long stroke.
    - The two long strokes down the middle are about the same length, the right slightly longer, and both start on the long stroke.
    - The two small marks stay on the left of the middle, touching the left of the two long strokes and stopping short of the right one.
    - The bottom line across is about as long as the line across the top, about two fifths the length of the longest stroke, and the left cheek's end meets its start.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the hairline across the forehead
    - where: a short stroke below its middle, going down to the right then down to the left
      part: a lock of hair on the brow
    - where: a stroke at the left, from the middle left going down to the right, then down
      part: the left cheek
    - where: a long stroke across the face from the left, rising slightly, turning down on the right and ending in a hook to the left
      part: the brow line and the right cheek, down to the chin
    - where: a long stroke down, left of the middle, hanging from the brow
      part: the left eye
    - where: a long stroke down, right of the middle, hanging from the brow
      part: the right eye
    - where: a small mark in the middle, rising to the right, upper
      part: the nose
    - where: a small mark in the middle, rising to the right, lower
      part: the mouth
    - where: a line across the bottom of the face, rising slightly to the right
      part: the chin

重:
  object: a traveller bent under a heavy load carried a long way, a block of field earth marked by a mile post
  history: >-
    The oldest forms drew a person carrying a load. The part for a thousand 千 is the carrying pole; the
    part for a mile 里 is a field 田 on earth 土.
  layout: >-
    A traveller with a friendly face, wearing a simple pale coat and a broad hat, stands behind the strokes,
    bent under a carrying pole across his shoulders. From the pole hangs a heavy square block of field earth
    with furrows, in pale brown and green. A tall mile post stands in the middle of the block, rooted in a
    low mound of earth with the ground across the bottom. Pale colours.
  exact:
    - The hat's brim is a short stroke above the pole, sloping down to the left, and the post starts on its middle.
    - The pole is the longest line across in the picture, spanning almost the whole width, and the post crosses it.
    - The field is a square frame; the left side and the top-and-right stroke start from the same point, and the bottom of the left side meets the start of the field's lower inner line.
    - The field's top-and-right stroke turns down and ends touching the lower inner line.
    - The upper inner line across the field is the shortest line across, about a quarter as long as the pole; the lower inner line is a little longer, about a third as long.
    - The field's top-and-right stroke is about four fifths as long as the pole.
    - The post is straight, with a plain end, crosses the field's lines and ends on the ground line.
    - The short mound line crosses the post near its foot and is about two fifths as long as the pole; the ground line is clearly longer, about five sixths as long.
  strokes:
    - where: a short stroke at the top, from the centre sloping down to the left
      part: the traveller's hat brim
    - where: a long line across the upper part, from the left edge to the right edge, rising slightly to the right
      part: the carrying pole across his shoulders
    - where: a short line down on the left of the middle, below the pole
      part: the left side of the field block
    - where: a stroke across from the top of the left side, turning down at the right
      part: the field's top edge and right side
    - where: a short line across inside the field, rising slightly to the right
      part: an upper furrow
    - where: a line across inside the field, below the upper one, rising slightly to the right
      part: a lower furrow, closing the field
    - where: a long straight line down the middle, from the hat brim to near the bottom, crossing the pole and the field
      part: the mile post
    - where: a short line across near the bottom, crossing the post
      part: a low mound of earth
    - where: a long line across the bottom
      part: the ground

将:
  object: going to bed at night
  history: >-
    The oldest forms drew a bed 丬 and an evening moon 夕, with a hand 寸: what is about to happen.
  layout: >-
    On the left stands a pale wooden bed seen from the side, with a folded blanket and a pillow. On the
    right, in the night sky, hangs a pale crescent moon curving open to the left, with a small star
    beside it; below the moon a hand with the thumb out reaches out, drawn simply. Pale colours.
  exact:
    - The short mark and the line rising to the right on the left are two separate marks; the rising line ends on the middle of the long vertical.
    - The long vertical is straight with a plain end, and is the longest line down in the picture.
    - In the moon, the crescent stroke starts on the middle of the short curved stroke above it; the star dot stands apart from the crescent with a small gap.
    - The crescent's long stroke is clearly longer than half the width of the right part.
    - The line across the hand is about four fifths as long as the crescent's long stroke, and the hand's long vertical crosses it and ends in a small hook to the left.
    - The small dot of the hand stands free of everything.
  strokes:
    - where: a short mark at the upper left, slanting down to the right
      part: the pillow
    - where: a line across the lower left, rising to the right and ending on the long vertical
      part: the bed's mattress
    - where: a long straight line down, from the top of the left part to the bottom
      part: the bed's tall headboard post
    - where: a short stroke at the top of the right part, sweeping down to the left
      part: the moon's upper tip
    - where: a longer stroke across the top, turning to sweep down to the left, starting on the tip
      part: the moon's body, the crescent
    - where: a small dot inside the crescent, slanting down to the right
      part: a star
    - where: a line across the middle of the right part, from its left edge to its right edge
      part: the cuff of the sleeve
    - where: a stroke from the middle, going down and ending in a hook up to the left, crossing the cuff
      part: the hand and arm, the hook the fingers
    - where: a small stroke at the left of the hand, slanting down to the right
      part: the thumb

將:
  object: going to bed at night
  history: >-
    The oldest forms drew a bed 爿 and an evening moon 夕, with a hand 寸: what is about to happen.
  layout: >-
    On the left stands a pale wooden bed seen from the side, with a folded blanket and a pillow. On the
    right, in the night sky, hangs a pale crescent moon curving open to the left, with two small stars;
    below the moon a hand with the thumb out reaches out, drawn simply. Pale colours.
  exact:
    - The left stroke of the bed's top and its tall post are joined, the first stroke ending on the middle of the post.
    - The post is straight with a plain end, and is the longest line down in the picture.
    - The mattress line rising to the right ends on the middle of the post; the bed's slanting leg starts on the middle of the mattress.
    - The moon's crescent stroke starts on the middle of the short stroke above it; the two star dots and the crescent stand apart with small gaps, and the stars touch nothing.
    - The hand's line across is about four fifths as long as the crescent's long stroke.
    - The hand's long vertical crosses the line across and ends in a small hook to the left; it stands apart from the crescent.
    - The small dot of the hand touches nothing.
  strokes:
    - where: a short stroke on the upper left, going down then turning up to the right, ending on the post
      part: the pillow, curving round
    - where: a long straight line down, from the top of the left part to the bottom
      part: the bed's tall headboard post
    - where: a line across the lower left, rising to the right and ending on the post
      part: the bed's mattress
    - where: a short stroke from the middle of the mattress, sweeping down to the bottom left
      part: the bed's slanting foot
    - where: a short stroke at the top of the right part, sweeping down to the left
      part: the moon's upper tip
    - where: a longer stroke across the top, turning to sweep down to the left, starting on the tip
      part: the moon's body, the crescent
    - where: a small dot inside the crescent near its top, slanting down to the right
      part: a first star
    - where: a small dot inside the crescent near its bottom, slanting down to the right
      part: a second star
    - where: a line across the middle of the right part, rising slightly to the right
      part: the cuff of the sleeve
    - where: a stroke from the middle, going down and ending in a hook up to the left, crossing the cuff
      part: the hand and arm, the hook the fingers
    - where: a small stroke at the left of the hand, slanting down to the right
      part: the thumb

品:
  object: three people with open mouths talking about something, one above two
  history: 'The oldest forms drew three mouths: many people talking over a thing, the thing everyone discusses.'
  layout: >-
    Three pale round faces, one above and two side by side below, each with a friendly look and a
    wide-open mouth in the middle, in simple pale clothes. The upper face sits in the centre; the two
    lower faces fill the lower left and lower right, close together but not touching. Pale colours.
  exact:
    - The upper mouth is smaller than each of the lower mouths; the two lower mouths are about the same size, the left one a little taller and narrower.
    - In each mouth, the left side and the line across the top start from the same point; the top line turns down to the left at its end.
    - In each mouth, the bottom line is shorter than the top line, about half as long, and touches the left side's lower end or the top line's end.
    - The upper mouth's left side ends where its bottom line starts.
    - The two lower mouths do not touch each other.
  strokes:
    - where: a straight line down on the left of the upper half
      part: the upper mouth's left corner and left side
    - where: a line across the top of the upper half, from its left, turning down to the left at the right end
      part: the upper mouth's upper lip, curving down into its right corner
    - where: a short line across the bottom of the upper mouth, rising slightly to the right
      part: the upper mouth's lower lip
    - where: a straight line down on the far left of the lower half
      part: the lower left mouth's left side
    - where: a line across the top of the lower left mouth, from its left, turning down to the left
      part: the lower left mouth's upper lip and right corner
    - where: a short line across the bottom of the lower left mouth
      part: the lower left mouth's lower lip
    - where: a straight line down in the middle of the lower half
      part: the lower right mouth's left side
    - where: a line across, running right to the edge of the lower half and turning down to the left
      part: the lower right mouth's upper lip and right corner
    - where: a short line across the bottom of the lower right mouth
      part: the lower right mouth's lower lip

相:
  object: an eye staring at a tree
  history: 'An ideogram: an eye 目 looking at a tree 木, to observe.'
  layout: >-
    A tree stands on the left half and an eye, set upright, on the right half, looking at the tree. The
    tree has pale leafy crowns behind its strokes. The iris is a soft round shape, pale brown or blue,
    with a mid-grey pupil, between the eye's inner lines. Pale colours.
  exact:
    - The tree's trunk is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The tree's line across is short and rises a little to the right, crossing the trunk; the left root starts where the trunk and branches cross.
    - The tree's last stroke is a short dot touching the trunk, not a long sweep.
    - The tree is much taller than the eye, which is about three fifths of its height; the tree is wider than the eye.
    - The eye's three inner lines are short, much shorter than the top-and-right stroke, about a fifth of its length each; they touch the left side and stop short of the right side.
    - The top of the eye is one stroke, turning down at the top right and ending in a hook to the left.
  strokes:
    - where: a line across the upper left half, rising slightly to the right
      part: the tree's branches
    - where: a long straight line down the middle of the left half
      part: the tree's trunk
    - where: a sweep from the centre of the trunk down to the bottom left
      part: the tree's root, spreading left
    - where: a short stroke from just below the middle of the trunk, slanting down to the right
      part: the tree's short right root
    - where: a line down the left side of the right half
      part: the eye's left lid
    - where: a line across the top, turning down at the top right corner to run down the right side
      part: the eye's top corner and its right lid
    - where: a short line across the upper middle, from the left side
      part: the upper edge of the iris
    - where: a short line across the lower middle, from the left side
      part: the lower edge of the iris
    - where: a line across the bottom, closing the frame
      part: the eye's bottom corner, where the lids meet

係:
  object: a person holding a skein of thread, the thread that connects people
  history: >-
    The oldest forms drew a person 亻 with a hanging skein of thread 系, a link between people.
  layout: >-
    A person with a friendly face and simple pale clothes stands on the left, seen from the side, facing
    right, reaching toward a skein of pale thread hanging from a peg on the right. The knotted coils of
    thread hang in the upper right and three loose strands fall below. Pale colours.
  exact:
    - The person is narrower than the thread's part, and the two do not touch.
    - The person's second stroke is a straight vertical with a plain end, starting on the middle of the first stroke; the second is nearly as long as the first.
    - The peg is a stroke leading to the left and turning down to the left; the upper coil starts on its middle.
    - The upper coil's end touches the middle of the lower coil; the lower coil is about twice as long as the upper.
    - The short knot stroke ends the lower coil on its right.
    - The strand in the centre hangs from the lower coil's middle and ends in a small hook to the left; the left strand is short and stands free, a gap from the lower coil; the right strand is short, free and clearly shorter than the first strands.
  strokes:
    - where: a long sweep from the top centre of the left part down and out to the bottom left
      part: the person's head, body and left leg
    - where: a straight line down from the middle of the first stroke
      part: the person's right leg, standing straight
    - where: a line at the top of the right part, running from the right to the left, turning down to the left
      part: the peg the skein hangs from
    - where: a short stroke from the middle of the peg, going down to the left and turning across to the right
      part: the upper coil of thread
    - where: a longer stroke, starting right of the coil, going down to the left and turning across, rising slightly to the right
      part: the lower coil of thread
    - where: a short stroke on the right, slanting down to the right, ending the coil
      part: the knot
    - where: a stroke from the middle of the lower coil, going down and ending in a hook up to the left
      part: the central strand of loose thread
    - where: a short stroke at the lower left of the right part, going down to the left, standing free
      part: the left loose end of thread
    - where: a short stroke at the lower right, slanting down to the right, standing free
      part: the right loose end of thread

送:
  object: a person waving goodbye to someone walking away
  history: >-
    The oldest forms drew a person with arms up, waving 关, and someone going away along a road 辶.
  layout: >-
    A person stands on the right, facing left, with a friendly face and a simple pale coat, arms out and
    both hands raised in a wave. Walking away to the left along the road is a second, smaller person, seen
    from the side with a face turned back, in simple clothes. The road runs along the bottom under both.
    Pale colours.
  exact:
    - The two raised hands at the top are separate marks that touch nothing; the right one is a little longer, curving down to the left.
    - The headband below them, a short line rising slightly to the right, does not touch the hands; the body starts on it.
    - The arms are a line across, longer than the headband, about one and a half times its length, and the body crosses it.
    - The body sweeps down to the left and stops short of the road with a small gap; the right leg is short, starts on the arms and stands free.
    - The walker's dot, his head, stands free above his back; his back ends on the middle of the road.
    - The road is the longest stroke, spanning nearly the whole width, running level, then rising slightly at its end.
  strokes:
    - where: a small dot at the top of the right part, left of the middle
      part: the waving person's left hand, raised
    - where: a short stroke at the top, right of the dot, going down to the right, then down to the left
      part: the waving person's right hand, raised
    - where: a short line across below the hands, rising slightly to the right
      part: the headband across the forehead of the round head
    - where: a line across the middle of the right part, from the left to the right
      part: both arms, held out wide
    - where: a stroke from the headband, going down, then curving to sweep down to the left
      part: the body and left leg
    - where: a short stroke from the middle of the arms, going down to the right
      part: the right leg
    - where: a small dot at the top of the left part, slanting down to the right
      part: the walker's head
    - where: a stroke from the left side, across and rising slightly to the right, turning down at its end
      part: the walker's back and bent leg
    - where: a long line across the bottom, level then rising slightly at the right end
      part: the road

总:
  object: a mouth speaking with one heart
  history: >-
    The oldest forms drew many mouths 口 speaking with one mind 心: to gather as one.
  layout: >-
    A wide-open mouth in a friendly pale face sits in the centre, with a small heart in pale red below it.
    Two short sound marks rise above the mouth. The face has eyes and a nose, with a simple collar. Pale
    colours.
  exact:
    - The two short marks at the top are separate and touch nothing; the right one is longer, curving down to the left.
    - The mouth's left side and its top line start from the same point; its bottom line starts where the left side ends.
    - The top line turns down to the left at its right end and ends on the bottom line; the top line is nearly twice as long as the bottom line.
    - The heart is wide, nearly as wide as the whole square; the heart's left edge stands free, a short stroke on the left.
    - The heart's long curve runs down, along the bottom and up, ending in a hook up to the left; it is the longest stroke of the heart.
    - The two vessel dots stand free, one near the top centre, one at the upper right, the right one a little longer.
  strokes:
    - where: a small mark at the top left, slanting down to the right
      part: a sound mark, rising from the mouth
    - where: a short stroke at the top right, going down to the right then down to the left
      part: a second sound mark
    - where: a straight line down the left side of the mouth
      part: the left corner and left side of the open lips
    - where: a line across the top of the mouth, turning down to the left at its right end
      part: the upper lip, curving down into the right corner
    - where: a line across the bottom of the mouth, shorter than the top line
      part: the lower lip
    - where: a short stroke on the left, from the middle down a little to the left
      part: the left edge of the heart
    - where: a long curve from left of centre down, along the bottom to the right and up, ending in a hook up to the left
      part: the rounded lower body of the heart, its tip turning in at the right
    - where: a short dot near the top centre, slanting down to the right
      part: a vessel rising from the top of the heart
    - where: a short dot at the upper right, slanting down to the right
      part: a second vessel at the heart's upper right

屋:
  object: a bird alighting on the ground under a roof
  history: >-
    The oldest forms drew a roof and a bird 至 coming down to the ground under it: to stop, to shelter,
    a house.
  layout: >-
    A roof of pale clay tiles covers the upper left, its wall posts at the left; beneath it, in the
    middle and right, a small bird with a friendly eye alights on the ground in pale feathers. A small
    mound of earth lies beside the bird, and the ground runs under it all. Pale colours.
  exact:
    - The roof's top line ends in a small hook down to the left, and touches the end of the line below it.
    - The roof's lower line starts on the middle of the tall left stroke; the roof's top starts on the tall stroke's start.
    - The tall left stroke is the longest, a sweep down to the bottom left, and does not touch the bird's wing; the gap is small.
    - The bird's wing crosses the start of the long body stroke; the body stroke swings round and turns across at the bottom.
    - The short beak stroke ends on the body's turning.
    - The bird's leg starts on the middle of the body stroke and ends on the ground; the mound line crosses the leg.
    - The ground is the longest line across, clearly longer than the roof's top, about one and a half times as long.
  strokes:
    - where: a line across the upper middle, ending in a small hook down to the left
      part: the roof's ridge
    - where: a line across below it, shorter than the ridge
      part: the roof's eave
    - where: a long stroke down the left side from the roof's left end, turning to sweep down to the bottom left
      part: the wall and its leaning post
    - where: a line across the upper middle of the lower part, rising slightly to the right
      part: the bird's spread wing
    - where: a stroke from the middle of the wing, going down to the left, then turning across, rising slightly to the right
      part: the bird's body and tail, swinging round
    - where: a short stroke at the right, going down to the right, ending on the body
      part: the bird's beak
    - where: a short line across the middle-lower part, rising slightly to the right
      part: a small mound of earth
    - where: a short stroke from below the body, going down
      part: the bird's leg, reaching down to the ground
    - where: a long line across the bottom, from the left to the right
      part: the ground

待:
  object: a visitor arriving to be welcomed by a hand holding up a mound of earth as an offering
  history: >-
    The oldest forms drew a step 彳 toward the court 寺, to wait for or receive someone.
  layout: >-
    On the left a walker arrives, seen from the side, facing right, with a friendly face and a simple pale
    coat; his back leg is ink. On the right the host's hand holds up a little mound of earth as an offering.
    Pale colours.
  exact:
    - The walker's upper two strokes sweep down to the left; the lower is a straight vertical with a plain end touching the middle of the second.
    - The walker and the hand do not touch.
    - In the mound, the short top line is crossed by the central ridge; the base line is the longest, clearly longer than the palm line below it, about nine tenths as long.
    - The central ridge turns down to the right, then straight down, and ends on the middle of the base line.
    - The forearm starts on the base line, crosses the palm line and ends in a small hook up to the left; it does not touch the ridge.
    - The thumb dot is small and stands free, left of the forearm, with a gap from the palm line.
  strokes:
    - where: a short sweep at the top of the left part, down to the left
      part: the walker's back thigh, bent
    - where: a longer sweep below it, down to the left, with a gap from the first
      part: the walker's back knee and shin
    - where: a straight vertical line down from the middle of the lower sweep to the bottom
      part: the walker's back foot, planted straight
    - where: a short line across the upper middle of the right part, rising slightly to the right
      part: the top layer of the mound
    - where: a stroke from the top centre running down to the right and then straight down, crossing the top layer
      part: the mound's central ridge
    - where: a long line across below the middle of the earth, rising slightly to the right, spanning the whole width
      part: the base of the mound
    - where: a line across below it, shorter than the base
      part: the palm held flat
    - where: a long line down from the base line, crossing the palm line, ending in a small hook up to the left
      part: the forearm, with the wrist turning
    - where: a small dot at the lower left, slanting down to the right
      part: the thumb

指:
  object: a hand pointing at a spoon bringing something sweet to a mouth
  history: >-
    The oldest forms drew a hand 扌 pointing at a delicious bite 旨: a spoon and a mouth.
  layout: >-
    A hand with the index finger out and the thumb stands on the left, pointing right. On the right a
    spoon 匕 tips food into a wide-open mouth with a tongue, in pale pink and cream. Pale colours.
  exact:
    - The two lines across on the left cross the long vertical; the upper is a little over half as long as the lower rising stroke.
    - The long vertical is the longest of the hand, ending in a small hook to the left.
    - The spoon's short stroke ends on the middle of the spoon's long stroke; the long stroke turns across to the right at its end and ends in a small hook up.
    - The mouth's left side is a short straight line; the top-and-right stroke ends in a small hook to the left, and the bottom line's end meets that hook.
    - The tongue line and the bottom line start on the left side; the top-and-right stroke starts on its start.
    - The tongue is shorter than the bottom line, about four fifths as long; the top-and-right stroke is about three times as long as the bottom line.
  strokes:
    - where: a line across the upper left, rising slightly to the right, crossing the long vertical
      part: the index finger, pointing right
    - where: a long line down the left part, from near the top to the bottom, ending in a small hook up to the left
      part: the back of the hand and the arm, the hook the wrist
    - where: a line from the lower left, rising to the right across the long vertical
      part: the thumb
    - where: a short stroke at the top right, going down to the left
      part: the spoon's handle
    - where: a long stroke from the top left of the right part, going down, then turning across to the right and ending in a hook up
      part: the spoon's bowl, tipping food
    - where: a short line down at the left of the lower right part
      part: the mouth's left corner
    - where: a line across the top of the mouth, turning down on the right and ending in a hook to the left
      part: the upper lip and the right side of the mouth
    - where: a short line across the middle of the mouth, rising slightly to the right
      part: the tongue
    - where: a line across the bottom of the mouth, rising slightly to the right
      part: the lower lip

音:
  object: a person standing on the ground, singing, with a wide-open mouth below
  history: >-
    The oldest forms drew a tongue 立 in the mouth 日, making a sound.
  layout: >-
    A person stands in the upper half, facing you, arms held out, in simple pale clothes, with a friendly
    face and a singing mouth. The ground runs across under the person's feet. Below it a wide-open
    mouth with a tongue, in pale pink, shows the sound. Pale colours.
  exact:
    - The head dot at the top stands free; the small leg dot at the lower left stands free of the ground line, with a small gap.
    - The arms are a line across, a little above the middle of the upper half, rising slightly to the right.
    - The right leg starts on the arms and ends on the ground line.
    - The ground line is the longest, about twice as long as the arms.
    - In the mouth, the left side and the top line start from the same point; the top line turns down and ends in a hook to the left.
    - The tongue line and the bottom line start on the left side; the bottom line ends where the top line ends; the tongue is shorter, about four fifths as long as the bottom line.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the person's head
    - where: a line across, a little above the middle of the upper half, rising slightly to the right
      part: the arms, held out to both sides
    - where: a short stroke at the lower left, slanting down to the right
      part: the left leg
    - where: a short stroke at the lower right, slanting down to the left to the bottom line
      part: the right leg, standing on the ground
    - where: a long line across the bottom of the upper half, from near the left edge to near the right edge
      part: the ground
    - where: a long straight line down the left side of the lower half
      part: the mouth's left corner
    - where: a line across the top of the mouth, turning down on the right and ending in a hook to the left
      part: the upper lip and the right side of the mouth
    - where: a short line across the middle of the mouth, rising slightly to the right
      part: the tongue
    - where: a line across the bottom of the mouth, rising slightly to the right
      part: the lower lip

科:
  object: a measuring dipper with grain falling into it
  history: >-
    The oldest forms drew a hand measuring grain 禾 with a dipper 斗: to sort, to grade.
  layout: >-
    A stalk of grain with a drooping ear stands on the left half, in pale gold. On the right half a
    measuring dipper with a long handle is held by a pale hand, seen from the side, with two grains
    falling into it. Pale colours.
  exact:
    - The stalk is a straight vertical line with a plain end, and the left and right roots start on it, their starts apart by a small gap.
    - The grain's line across is the widest line of the stalk, crossing the stalk; the ear is a short stroke starting above and turning down to the left, touching the stalk's top.
    - The right root is a short dot, not a sweep; the left root is a long sweep, about as long as the line across.
    - The two grains falling stand free of everything and each other, the lower one nearer the dipper.
    - The cup rim is a long line across, rising slightly, as wide as the dipper; the handle is a straight vertical with a plain end, crossing the rim, and is clearly longer than the rim.
    - The grain's line across is clearly shorter than the cup rim, about five sixths as long.
  strokes:
    - where: a short stroke across the top of the left half, running left then turning down to the left
      part: the ear of grain, drooping over to the left
    - where: a line across, a little above the middle of the left half, rising slightly to the right
      part: the leaves, spreading to both sides
    - where: a long straight line down the middle of the left half, from near the top to the bottom
      part: the stalk
    - where: a sweep from the stalk's centre down to the bottom left
      part: the root spreading out to the left
    - where: a short dot beside the stalk, slanting down to the right
      part: the short root to the right
    - where: a short dot at the upper left of the right half, slanting down to the right
      part: a grain falling toward the dipper
    - where: a short dot below it, slanting down to the right
      part: a second grain falling toward the dipper
    - where: a long line across the middle of the right half, rising slightly to the right, the whole width
      part: the cup rim of the dipper
    - where: a long straight line down the right of the right half, crossing the cup rim, from the top nearly to the bottom
      part: the dipper's long handle

南:
  object: a hanging musical bell
  history: 'The oldest forms drew a bell hung from a handle and bossed with studs.'
  layout: >-
    A pale bronze bell hangs from a short handle at the top: its body is a wide frame open at the bottom, seen from the front, with
    a bar from which the clapper hangs. Studs and the clapper are inside it, in pale gold. Pale colours.
  exact:
    - The bell's handle is a cross of a short line across and a vertical going down to the left; the vertical ends on the start of the bell's top.
    - The bell's top-and-right stroke is long, longer than all other lines across, and ends in a small hook up to the left; it turns down at the right.
    - The left side starts on its start, and the stud dot stands free of the top with a small gap.
    - The short rod hangs from the top line's middle and ends on the middle of the upper bar.
    - The two bars inside are about the same length, the lower slightly longer, a third as long as the top-and-right stroke.
    - The clapper's vertical starts on the upper bar, crosses the lower bar and stands free of the rod, a small gap.
  strokes:
    - where: a line across, rising slightly to the right, across the upper part
      part: the bar of the bell's handle
    - where: a long stroke down the upper part, slanting slightly left, crossing the line across
      part: the bell's hanging cord and handle
    - where: a stroke down the left side, starting at the left of the lower part
      part: the bell's left side
    - where: a long stroke across the top of the lower part, turning down at the right and ending in a hook up to the left
      part: the bell's shoulder and its right side
    - where: a small dot inside the bell at the upper left, slanting down to the right
      part: a stud
    - where: a short stroke down from the bell's top, right of the middle
      part: the rod the clapper hangs from
    - where: a short line across, rising slightly to the right, in the middle of the bell
      part: the upper bar of the clapper
    - where: a line across below it, slightly longer
      part: the lower bar of the clapper
    - where: a short vertical line down from the upper bar, crossing the lower bar
      part: the clapper's rod

带:
  object: a belt tied around a robe, creasing it above the belt but not below, with a cloth hanging
  history: >-
    The oldest forms drew a belt tied round a robe with pleats above it and a cloth hanging from it.
  layout: >-
    A person in a pale robe, whose friendly face and shoulders show faintly behind the top of the strokes,
    wears a belt. Three pleats crease the robe's chest above the belt. Below the belt the cloth of the robe
    hangs smooth and straight, a pale sash in the centre. Pale colours.
  exact:
    - The line across the chest crosses all three pleats; the middle pleat is the longest, the left pleat clearly shorter, a little over half as long, and the right pleat a little shorter than the middle one.
    - The pleats do not touch the belt; the middle pleat's end touches the belt, and a small gap separates the pleat from the sash.
    - The belt is the longest line across, spanning nearly the whole width, ending in a small hook down to the left at the right end.
    - The belt's small left tab is a short down stroke at the belt's left end.
    - The sash is narrower than the belt and shorter than the belt; its top-and-right stroke ends in a hook to the left and is about nine tenths as long as the belt.
    - The sash's left edge and its top start from the same point; the sash's middle line is the longest line down, starting on the belt and crossing the top.
  strokes:
    - where: a line across the upper part, from the left to the right, rising slightly to the right
      part: the neckline across the chest
    - where: a short straight line down on the left, crossing the neckline
      part: the left pleat
    - where: a stroke down in the middle, going down to the right, crossing the neckline
      part: the middle pleat
    - where: a shorter stroke down on the right, going down to the right, crossing the neckline
      part: the right pleat
    - where: a short line down at the far left, below the pleats
      part: the belt's left tab
    - where: a long line across, starting at the tab and rising slightly, ending at the right in a small hook down to the left
      part: the belt
    - where: a short vertical line below the belt, on the left of the middle
      part: the sash's left edge
    - where: a line across, from the left edge's top, turning down and ending in a hook to the left
      part: the sash's top and right edge
    - where: a long straight line down the middle, from the belt to the bottom
      part: the middle crease of the sash

帶:
  object: a belt tied around a robe, creasing it above the belt but not below, with a cloth hanging
  history: >-
    The oldest forms drew a belt tied round a robe with pleats above it and a cloth hanging from it.
  layout: >-
    A person in a pale robe, whose friendly face and shoulders show faintly behind the top of the strokes,
    wears a belt. Four pleats crease the robe's chest above the belt. Below the belt the cloth of the robe
    hangs smooth and straight, a pale sash in the centre. Pale colours.
  exact:
    - The line across the chest crosses three of the four pleats, the first, second and fourth from the left.
    - The pleats do not touch the belt. The small bar between the two middle pleats touches both ends, the left pleat's end meeting its start.
    - The right pleat turns across to the right at its end and ends in a small hook up; it is the longest pleat.
    - The belt is the longest line across, spanning nearly the whole width, ending in a small hook down to the left at the right end.
    - The sash is narrower and a little shorter than the belt, about seven eighths as long, and its top-and-right stroke ends in a hook to the left.
    - The sash's middle line is the longest line down, starting on the belt and crossing the sash's top.
  strokes:
    - where: a line across the upper part, from the left to the right, rising slightly to the right
      part: the neckline across the chest
    - where: a short straight line down on the left, crossing the neckline
      part: the first pleat
    - where: a short stroke down to the right, left of the middle, crossing the neckline
      part: the second pleat
    - where: a short stroke down to the right, in the middle, crossing the neckline
      part: the third pleat
    - where: a short line across below the third pleat, joining its end
      part: the lower stitch between the pleats
    - where: a longer stroke down on the right, crossing the neckline, turning across to the right and ending in a hook up
      part: the fourth pleat, curling at its end
    - where: a short line down at the far left, below the pleats
      part: the belt's left tab
    - where: a long line across, starting at the tab, ending at the right in a small hook down to the left
      part: the belt
    - where: a short vertical line below the belt, on the left of the middle
      part: the sash's left edge
    - where: a line across, from the left edge's top, rising slightly, turning down and ending in a hook to the left
      part: the sash's top and right edge
    - where: a long straight line down the middle, from the belt to the bottom
      part: the middle crease of the sash

段:
  object: a hand striking a chisel into a block of stone
  history: >-
    The oldest forms drew a hand 又 holding a chisel 殳 at a block of stone: to cut it into pieces.
  layout: >-
    A block of pale grey stone with layered strata stands on the left; a hand, seen from the side, holds a
    raised mallet over it on the right. The block's cut face is on the left. The hand wears a simple pale
    cuff. Pale colours.
  exact:
    - The two short layer lines on the stone start on the middle of the tall vertical and rise to the right, and stand free of the mallet.
    - The tall vertical is the longest line down of the stone, longer than the mallet's handle.
    - The stone's base line crosses the vertical and rises to the right at its end.
    - The mallet's head starts on the handle's start and rises, arcs and turns down.
    - The hand's long stroke crosses the other hand stroke, which ends across the stone's base with a small gap.
    - The hand's down-right stroke is the longest, turning across to the right at the end.
  strokes:
    - where: a short stroke at the top left of the stone, going down to the right then down to the left
      part: a chipped corner of the stone
    - where: a tall straight line down the left of the stone
      part: the stone's cut face
    - where: a short line rising to the right from the middle of the tall line
      part: an upper layer of the stone
    - where: a short line rising to the right, below it
      part: a lower layer of the stone
    - where: a line across from the far left, crossing the tall line, turning up to the right
      part: the stone's base ledge
    - where: a short stroke at the top of the right part, going down, then to the left
      part: the mallet's handle
    - where: a stroke from the handle's start, rising to the right, turning down, then across to the right
      part: the mallet's head
    - where: a line across the middle of the right part, turning to sweep down to the left
      part: the forearm
    - where: a stroke from the forearm's middle, going down to the right, turning across to the right at the end
      part: the hand and fingers

香:
  object: a fragrant grain herb with a sweet taste in the mouth
  history: >-
    The oldest forms drew a grain plant 禾 over a mouth 甘 tasting something sweet: a pleasant smell.
  layout: >-
    A wide stalk of pale gold grain fills the upper half, its ear drooping to the left. Below it, in the
    lower centre, a small open mouth with a tongue and a pale pink glow tastes the sweetness. Pale
    colours.
  exact:
    - The stalk is a straight vertical line, ending in a plain point at the bottom of the upper half, with no hook.
    - The leaves are the widest line across the stalk, crossing it; the ear starts above and sweeps down to the left, touching the stalk's top.
    - The two roots start on the stalk where the leaves cross it and do not touch each other; the right root is longer, turning across to the right at its end.
    - The mouth's top-and-right stroke ends in a small hook to the left, and its end meets the end of the bottom line.
    - The mouth stands apart from the stalk, with a small gap below the stalk's foot.
    - The tongue line is shorter than the bottom line, about four fifths as long, and the bottom line is clearly shorter than the top-and-right stroke.
  strokes:
    - where: a stroke at the top, running left and turning down to the left
      part: the ear of grain, drooping over to the left
    - where: a long line across, a little above the middle of the upper half
      part: the leaves, spreading to both sides
    - where: a long line down the middle, from near the top, ending in a plain point
      part: the stalk
    - where: a sweep from the centre of the stalk down and out to the bottom left
      part: the root spreading out to the left
    - where: a stroke from the centre of the stalk down and out to the bottom right, turning across to the right at its end
      part: the root spreading out to the right
    - where: a short line down on the left of the lower centre
      part: the mouth's left corner
    - where: a line across the top of the mouth, turning down on the right and ending in a hook to the left
      part: the upper lip and the right side of the mouth
    - where: a short line across the middle of the mouth, rising slightly to the right
      part: the tongue
    - where: a line across the bottom of the mouth, rising slightly to the right
      part: the lower lip
