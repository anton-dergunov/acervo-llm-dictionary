酋:
  checked: argon
  object: a ceramic wine vessel with a wide flat rim, aged wine inside, and two wisps of fragrant vapour rising above the top
  history: >-
    The oldest forms drew an amphora-like wine jar (酉) with lines above its mouth showing the aroma
    or bubbling liquid of long-fermented wine (八). Because the finest aged wine was offered by the
    head of the clan at rituals, the character came to mean a chief or chieftain.
  layout: >-
    A tall pale terracotta wine jar fills the lower two thirds of the frame, topped by a wide
    bridging rim across the upper third and a narrow neck between the rim and the jar's shoulders.
    Above the centre of the rim float two small pale golden wisps of fermented wine vapour. Inside
    the belly of the jar, a pale amber wash suggests the aged wine around the inner strokes.
  exact:
    - The two short strokes at the very top stand completely free above the long horizontal line; the left one slants down to the right and the right one sweeps down to the left.
    - The long horizontal line across the upper part is about twice as wide as the rectangular jar body below it.
    - The two inner vertical strokes both start touching the middle of the long horizontal line, cross the top edge of the lower box, and end inside the upper half of the box; the left one sweeps slightly left to a point, while the right one turns sharply to the right at its bottom.
    - The lower box is formed by a straight vertical on the left, a stroke that runs across the top and turns down the right side ending in a hook to the left, and a bottom line that connects the lower end of the left vertical to the hook on the right.
    - The short horizontal line inside the lower half of the box (about a quarter as long as the top horizontal line) sits between the two inner verticals and the bottom line, standing free without touching the left or right walls.
  strokes:
    - where: a short dot-like stroke in the top left, slanting down to the right
      part: the left wisp of fragrant vapour rising above the jar
    - where: a short sweep in the top right, slanting down to the left
      part: the right wisp of fragrant vapour rising above the jar
    - where: a very long horizontal line across the upper part from far left to far right
      part: the wide flat rim across the top of the wine vessel
    - where: a straight vertical line down the left side of the lower half
      part: the left wall of the wine jar
    - where: a line across the middle that turns down on the right side and ends at the bottom in a hook to the left
      part: the shoulder and right wall of the wine jar, curving in at the base
    - where: a downward stroke starting at the middle of the long top line, crossing the jar's top edge and sweeping slightly left inside the upper belly
      part: the left side of the vessel's neck extending down into the jar
    - where: a downward stroke to the right of the previous one, starting at the middle of the long top line, crossing the jar's top edge and turning sharply right inside the upper belly
      part: the right side of the vessel's neck extending down and flaring inside the jar
    - where: a short horizontal line floating in the lower half of the jar, about a quarter as long as the top rim
      part: the level surface of the aged wine inside the belly of the jar
    - where: a horizontal line across the bottom of the jar, rising slightly to the right from the left wall to the right wall's hook
      part: the flat base of the wine jar

亘:
