    - In each of the two lower feet, both the taller central vertical and the shorter left vertical end on the bottom line, and a short branch extends to the right from the middle of the taller vertical.
    - The left foot's bottom line slants noticeably up to the right, while the right foot's bottom line is longer and runs nearly level across the bottom right.
