# Full run, group g3, batch 07. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

涩:
  checked: argon
  object: splashing water on the left beside a curved knife blade above a foot stopped on the ground on the right
  history: >-
    The traditional form 澀 was an ideogrammic compound of four feet (止) facing one another to show
    rough, halting movement, with water (氵) added on the left for astringent liquid. The simplified
    form 涩 replaces the four feet on the right with a knife blade (刃) above a single foot (止).
  layout: >-
    The left quarter holds three splashes of pale blue water arranged one above another. The upper
    right holds a pale silver-grey knife blade curving down to the left, with a small glint mark
    beside its cutting edge. Below the blade in the lower right, a pale tan foot seen from the side
    stands flat upon a line of ground.
  exact:
    - The three water strokes on the left stand completely free of one another and do not touch the right half.
    - In the upper right blade, the top stroke runs across to the right and turns down into a long curve ending in an upward hook to the left.
    - The inner sweep of the blade starts touching the left end of the top horizontal stroke and sweeps down to the left.
    - The short slanting stroke of the blade sits in the open space to the left of the inner sweep and stands completely free without crossing or touching it.
    - In the lower right foot, the central vertical line is taller than the shorter slanting line to its left, and both stand on the long bottom ground line without crossing through it.
    - The short horizontal stroke in the lower right starts on the right side of the central vertical line at its middle, and is about a quarter as long as the bottom ground line.
    - The bottom horizontal line is the widest stroke on the right side, nearly twice as wide as the top of the blade.
  strokes:
    - where: a short stroke at the top left, slanting down to the right
      part: an upper splash of water
    - where: a slightly shorter stroke at the middle left, set further left and slanting down to the right
      part: a middle splash of water
    - where: a longer rising stroke at the bottom left, running from the bottom up and to the right
      part: a lower surge of water splashing upward
    - where: a stroke across the top of the right half that turns down on the far right and curves slightly inward, ending in a hook up to the left
      part: the top edge and curved back spine of the knife blade, with the hook as its lower tip
    - where: a sweep starting near the left end of the blade's top line and curving down to the left toward the centre
      part: the sharp front cutting edge of the knife blade
    - where: a short stroke to the left of the blade's cutting edge, slanting down to the left without touching the blade
      part: a sharp glint mark beside the blade's edge
    - where: a vertical line down the middle of the lower right half, standing on the bottom line
      part: the front of the ankle running down into the foot
    - where: a short line across from the middle of the lower vertical stroke to the right, rising slightly
      part: the top of the forefoot extending to the right
    - where: a shorter line to the left of the lower vertical stroke, slanting slightly down to the right to meet the bottom line
      part: the back of the heel standing on the ground
    - where: a long line across the bottom of the right half, supporting the two upright strokes above it
      part: the flat sole of the foot resting on the ground

