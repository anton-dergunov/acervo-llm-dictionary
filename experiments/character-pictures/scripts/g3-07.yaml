粥:
  checked: argon
  object: a stalk of rice with its grains in the middle, flanked on the left and right by two tall curling wisps of steam
  history: >-
    The character is a reduced form of an older ideogrammic compound for congee that showed rice
    steaming above a cauldron. The cauldron at the bottom was later dropped, leaving the central
    rice flanked on both sides by bow-shaped curls of rising steam.
  layout: >-
    Three narrow parts stand side by side across the square without touching. In the middle stands a
    tall stalk of rice with pale golden grains and spreading branches, reaching higher at the top
    than the two sides. On the left and right, two tall sinuous wisps of pale warm steam curl back
    and forth as they rise beside the rice, the right wisp slightly taller and wider than the left.
  exact:
    - The left steam wisp, the central rice stalk, and the right steam wisp stand side by side and do not touch one another.
    - In both the left and right wisps, the top stroke runs across and turns down to meet the right end of the short middle line across, and the lower stroke starts at the left end of that middle line, goes down, turns across to the right, then turns down to end in a hook to the left.
    - The right wisp is slightly wider and taller than the left wisp, starting higher at the top and reaching lower at the bottom.
    - In the central rice component, the long vertical stalk starts highest of all near the top and ends in a plain point at the bottom with no hook, crossing the middle line across.
    - The two upper grain strokes flank the upper part of the central stalk and stand completely free without touching it.
    - Below the crossing in the centre, a sweep goes down to the left from where the stalk crosses the line across, while the lower right stroke is a short dot touching the stalk slightly lower down, not a long sweep.
  strokes:
