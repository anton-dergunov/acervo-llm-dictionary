鼎:
  checked: argon
  object: an ancient bronze ritual cauldron with side handles, a decorated central bowl, and heavy legs below
  history: >-
    The oldest forms drew a round-bellied bronze cauldron with two loop handles at the rim, carved
    ornament on the belly, and legs beneath. In the modern form the belly became the rectangular box
    at the top centre, while the handles and legs split into the flanking structures on the lower
    left and lower right.
  layout: >-
    A ceremonial bronze cauldron fills the square symmetrically. The rectangular box at the top
    centre forms the central bowl of the vessel, crossed by horizontal bands of bronze pattern. The
    crooked upper turns on the left and right form the two projecting side handles and shoulders of
    the vessel, while the two inner vertical lines and the two outer angled legs form the heavy
    tripod stand below. The vessel is coloured in pale sage-green and soft warm bronze behind the
    strokes.
  exact:
    - The upper central box, the lower-left structure, and the lower-right structure do not touch one another.
    - Inside the upper central box, the two inner lines across touch the left vertical wall and stop short of the right vertical wall, while the bottom line connects both walls.
    - On the left, a single stroke goes down from the middle left, turns across to the right, and turns straight down to the bottom to form the left-centre vertical leg.
    - The lower-left line across rises slightly to the right and ends on the middle of the left-centre vertical leg without crossing it, and the bottom-left sweep starts from the middle of that line across.
    - On the middle right, the short upper slanting stroke ends on the middle of the short line across below it.
    - The right-centre vertical leg starts at the left end of that middle-right line across and runs straight down to the bottom, and the final stroke starts from the middle of this vertical leg, runs right, and turns down to the bottom right.
  strokes:
    - where: a line down the left side of the upper centre
      part: the left wall of the cauldron's upper bowl
    - where: a line across the top centre, turning down at the top right to run down the right side of the upper box
      part: the top rim and right wall of the cauldron's upper bowl
    - where: a short line across the upper middle of the top box, rising slightly to the right from the left wall
      part: the upper decorative band carved across the bowl
    - where: a short line across the lower middle of the top box, rising slightly to the right from the left wall
      part: the lower decorative band carved across the bowl
    - where: a line across the bottom of the top box, rising slightly to the right to close the frame
      part: the base of the upper bowl
    - where: a stroke on the left side that goes down from the middle left, turns across to the right below the top box, and turns straight down to the bottom left-centre
      part: the cauldron's left loop handle and shoulder, turning down into the inner-left leg
    - where: a line across the lower left, rising slightly to the right to meet the middle of the inner-left vertical leg
