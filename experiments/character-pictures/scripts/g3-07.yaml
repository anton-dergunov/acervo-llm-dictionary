    - where: a short line across the middle of the central box, rising slightly to the right
      part: the bright band of light across the sun's heart
    - where: a short line across the bottom of the central box, joining the left and right sides
      part: the bottom rim of the sun
    - where: a long line across the lower part of the frame, nearly the full width
      part: the line of the earth stretching across below

