  object: the sun shining in the middle between the line of heaven above and the line of earth below
  history: >-
    Originally an ideogrammic compound placing a revolving form between two horizontal boundary
    lines, the middle part simplified into the sun shape 日, and the character also came to be used
    for 亙, which placed the moon between heaven above and earth below.
  layout: >-
    A short horizontal bar of pale sky marks heaven across the upper part of the frame, and a long
    horizontal bar of pale ground stretches across the bottom as the earth. Centered between them,
    standing free of both, is the glowing pale-gold sun filling the middle of the square, with a
    bright band of light across its heart.
  exact:
    - The top line and the bottom line both stand completely free of the central sun, with clear gaps above and below the sun.
    - The top line is clearly shorter than the bottom line, a little over half as long, and about as wide as the sun below it.
    - The bottom line stretches nearly the full width of the frame across the bottom.
    - In the central sun, the top-and-right stroke starts at the top of the left side, runs across, and turns down at the top right, with both sides slanting slightly inward toward the bottom.
    - The inner line across the middle of the sun touches the left side and stops short of the right side.
    - The sun's bottom line meets the lower ends of both the left side and the right side.
  strokes:
