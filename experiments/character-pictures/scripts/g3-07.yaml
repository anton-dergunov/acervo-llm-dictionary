羡:
  checked: argon
  object: the head of a ram at the top, and below it a person with an open mouth and two drops of saliva, longing for the sheep
  history: >-
    An ideogrammic compound of a sheep (羊) above saliva (㳄, written 次 in the modern form: two drops
    on the left and a person with an open mouth 欠 on the right). Seeing a fine sheep makes the
    person's mouth water with envy and desire.
  layout: >-
    The upper half holds the front-facing head of a pale woolly ram, its horns at the top and its
    ears spreading along the wide middle line. The lower half is wider and holds the scene of
    longing: on the lower left are two pale blue droplets of saliva, and on the lower right is a
    person in profile facing left and looking up toward the ram with an open mouth. The person has a
    clear face with an eye, a nose and an open mouth, and wears simple pale clothes.
  exact:
    - The two short horn strokes at the top stand free above the top horizontal line and do not touch it.
    - Among the three horizontal lines of the ram's head in the upper half, the middle line is the shortest (a little over half as long as the bottom one), the top line is about three quarters as long as the bottom one, and the bottom line is the widest.
    - The vertical line in the upper half starts on the middle of the top horizontal, crosses the middle horizontal, and ends flat on the middle of the bottom horizontal, without sticking out below it or hooking.
    - The upper half (the ram) and the lower half (the person and droplets) do not touch.
    - On the lower left, the short upper dash and the longer rising stroke below it stand completely free of each other and of the person on the right.
    - On the lower right, the horizontal stroke starts on the middle of the upper left-falling sweep and turns at the right into a sharp hook pointing down and left.
    - The lower left-falling sweep starts below the hooked stroke's start without touching it, and the right-falling leg stroke starts on the middle of that sweep.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: the ram's left horn
    - where: a short sweep at the top right, slanting down to the left
      part: the ram's right horn
    - where: a line across below the horns, rising slightly to the right, about three quarters as long as the bottom line of the top half
      part: the brow across the top of the ram's face
    - where: a shorter line across the middle of the top half, a little over half as long as the bottom line of the top half
      part: the ram's eyes, as one line across the face
    - where: a straight line down the centre of the top half, from the top line to the bottom line
      part: the bridge of the ram's nose
    - where: a long line across the middle of the box, forming the base of the top half
      part: the wide lower line of the ram's face and its ears sticking out to both sides
    - where: a short stroke on the lower left, slanting down to the right
      part: the upper drop of saliva
    - where: a longer stroke at the bottom left, rising to the right
