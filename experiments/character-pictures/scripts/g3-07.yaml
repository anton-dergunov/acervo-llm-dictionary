  layout: >-
    The bucket frame occupies the left and centre of the square, with a pale warm wood tone behind
    its left wall, top rim, right wall and two inner horizontal bands. The central strap starts at
    the top rim, runs straight down through both inner bands, and swings wide across the bottom past
    the right side of the bucket, hooking sharply upward on the far right with pale motion shading
    around its curve.
  exact:
    - The top-and-right stroke starts at the top of the left vertical, runs across, turns down at the top right, and ends in a hook to the left above the bottom of the character.
    - The two inner lines across rise slightly to the right and do not touch either the left vertical or the right vertical wall.
    - The upper inner line across is clearly shorter, a little over half as long as the top line, while the lower inner line across is about three quarters as long as the top line.
    - The central stroke starts on the top line, crosses the middle of both inner lines across, reaches lower than the left and right sides, and curves far out to the right past the frame before hooking straight up at its tip.
    - The first leg of the left vertical is about three quarters as long as the vertical leg of the central stroke, and sweeps out to the bottom left at its foot.
  strokes:
    - where: a long line down the left side, sweeping out to the bottom left at its foot
      part: the left wall of the bucket frame, flaring out at the base
    - where: a line across the top from the top of the left stroke, turning down on the right and ending in a hook to the left
      part: the top rim and right wall of the bucket frame, curling inward at its foot
    - where: a short line across the upper middle, rising slightly to the right, clearly shorter and a little over half as long as the top line
      part: the upper horizontal band across the bucket
    - where: a short line across the lower middle, rising slightly to the right, about three quarters as long as the top line
      part: the lower horizontal band across the bucket
    - where: a long line from the top rim straight down the middle, turning wide across to the bottom right and hooking sharply upward at the far right
      part: the central strap running down through the frame and whipping out to the right as it is flung

倦:
  checked: argon
  dropped: Because 卷 (or 龹) serves purely as the phonetic component rather than depicting a curled-up person, drawing a scene from both components would teach a false etymology.

漱:
  checked: argon
  object: a person with mouth wide open on the right gargling water, beside a tied bundle of wood in the middle and splashes of water on the left
  history: >-
    An ideogrammic and phono-semantic compound combining water (氵) on the left with 欶 (to suck or
    gargle, formed from a tied bundle of wood 束 and a person with an open mouth 欠) on the right,
    depicting someone rinsing their mouth with water.
  layout: >-
    Three parts stand side by side across the square. Along the narrow left strip, three splashes of
    pale blue water rise and fall. In the middle stands a tall wooden trunk bound around its waist
    by a rectangular band, with pale foliage above. On the right stands a person facing left toward
    the water, head tilted back with an open mouth; the person has a clear face with eyes, a nose
    and an open mouth, and wears simple pale clothes.
  exact:
    - The three water strokes on the far left stand completely free of one another and do not touch the middle bundle.
    - In the middle part, the long central trunk runs straight down from top to bottom and ends in a plain point with no hook, crossing the upper line across as well as the top and bottom of the middle box.
    - The upper line across and the bottom line of the middle box are each about two thirds as long as the hooked top-and-right stroke of the box.
    - Below the middle box, the left root is a long sweep starting where the trunk meets the bottom of the box, while the right root is a short dot touching the trunk slightly lower down; the two do not touch each other.
    - The right side of the middle box stops just short of the upper sweep on the right, leaving a small gap between the middle and right components.
    - In the right component, the hooked upper stroke starts at the middle of the upper-left sweep, and the lower right-falling stroke starts at the middle of the lower-left sweep.
  strokes:
    - where: a short stroke in the top left, slanting down to the right
      part: the top splash of rinsing water
    - where: a short dot in the middle left, slanting down to the right
      part: the middle droplet of water
    - where: a rising stroke in the lower left, sweeping up and to the right
      part: a jet of water splashing upward from below
    - where: a short line across the upper middle, rising slightly to the right
      part: the upper branches of the wooden bundle
    - where: a short line down the left side of the middle box, slanting slightly to the right
      part: the left side of the binding band around the bundle
    - where: a line across from the top of the short left vertical, turning down on the right to end in a small inward hook
      part: the top and right side of the binding band
    - where: a line across the bottom of the middle box, rising slightly to the right to close the frame
      part: the bottom edge of the binding band
    - where: a long straight vertical line running down through the middle from top to bottom, with no hook
      part: the main wooden trunk running through the bundle
    - where: a sweep from the middle of the trunk just below the box, running down and out to the lower left
      part: the left root spreading from the base of the trunk
    - where: a short dot on the right side of the trunk below the box, slanting down to the right
      part: the short right root of the trunk
    - where: a sweep in the upper right half, running from near the top down and to the left
      part: the tilted head and upper jaw of the person gargling
    - where: a line from the middle of the upper right sweep running across and slightly up to the right, then turning sharply down and inward
      part: the wide-open mouth and curved cheek of the person
    - where: a long curved sweep in the lower right half, running from the centre down and out to the bottom centre
      part: the person's leaning body and forward left leg
    - where: a falling stroke from the middle of the lower sweep, running down and out to the bottom right
      part: the person's braced right leg

粟:
  checked: argon
  object: a millet plant with its stalk, spreading branches and loose grains below, topped by a heavy head of husked grain
  history: >-
    In oracle bone script the character was a pictogram of a cereal stalk heavy with grain in its
    husk at the top. Through later script changes the grain head at the top took the boxy shape of 覀
    above the plant 米.
  layout: >-
    One upright millet plant fills the square. The upper part is a golden-brown cluster and husk of
    unhulled grain sitting like a cap at the top of the plant, narrower than the spreading leaves
    and branches below. The lower part is the stalk with two loose pale grains floating on either
    side and long drooping branches spreading left and right. Soft pale yellow and warm tan tones
    colour the grain cluster and stalk behind the strokes.
  exact:
    - The upper grain-head component is narrower than the lower plant component and does not touch the vertical stalk below it.
    - The uppermost line across is about two thirds as long as the long horizontal line in the lower half.
    - Below the top line sits an enclosed rectangular frame whose left side slants down to the right, whose top and right side are one stroke turning down at the right, and whose bottom line joins the ends of the left and right sides.
    - Two inner vertical lines run down from the top line, cross the upper edge of the rectangular frame, and end on its bottom line; the left inner vertical starts just below the top line with a tiny gap, while the right inner vertical touches the top line.
    - Below the frame, the two short upper grain strokes on the left and right stand completely free of every other stroke.
    - The central vertical stalk starts just below the upper frame without touching it, crosses the long horizontal line, and runs straight down to a plain point at the bottom with no hook.
    - The two lower sweeps both start at the crossing of the central stalk and the long horizontal line, spreading out to the bottom left and bottom right without touching each other.
  strokes:
    - where: a line across the top centre
      part: the top crest of the grain head
    - where: a short line in the upper left, slanting down to the right
      part: the left side of the grain head's outer husk
    - where: a line across below the top line, starting on the upper left vertical and turning down at the right
      part: the upper rim and right side of the grain head's outer husk
    - where: a vertical line to the left of centre in the upper half, running from just below the top line down to the bottom of the upper frame
      part: the left inner rib of the grain head, crossing the upper rim of the husk
    - where: a vertical line to the right of centre in the upper half, running from the top line down to the bottom of the upper frame
      part: the right inner rib of the grain head, crossing the upper rim of the husk
    - where: a line across the bottom of the upper frame, rising slightly to the right to close the box
      part: the base of the grain head's husk
    - where: a short dot in the middle left, below the upper frame, slanting down to the right
      part: a loose grain on the upper left
    - where: a short sweep in the middle right, below the upper frame, slanting down to the left
      part: a loose grain on the upper right
    - where: a long line across, a little below the middle of the box
      part: a branch of the millet plant, held out to both sides
    - where: a long straight vertical line down the middle of the lower half, from just below the upper frame to the bottom
      part: the main stalk of the plant
    - where: a sweep from the centre crossing down and out to the bottom left
      part: a branch of grains drooping to the bottom left
    - where: a falling stroke from the centre crossing down and out to the bottom right, turning across at the foot
      part: a branch of grains drooping to the bottom right
