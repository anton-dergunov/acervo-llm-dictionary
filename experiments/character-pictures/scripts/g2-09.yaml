冗:
  checked: argon
  object: an idle person lounging indoors beneath a low roof
  history: >-
    The oldest forms drew a roof 宀 over a person 人 or 儿 standing idle at home with no fieldwork to
    do. In the modern form the roof has lost its top dot to become 冖, and the person's strokes join
    at the top like 几.
  layout: >-
    The wide roof spans the upper part of the frame, coloured in pale terracotta or warm beige tile
    behind the top strokes. Beneath it, an idle person lounges facing slightly left, with a small
    head just under the roof ridge showing eyes, a nose and a mouth, wearing simple pale clothes
    over the torso between the lower strokes, and legs following the two long strokes down to the
    left and right.
  exact:
    - The roof at the top and the person below do not touch each other.
    - The roof's long top line starts at the middle of the short left downward stroke and ends in a short hook down to the left.
    - The lower right stroke starts touching the top of the lower left sweep.
    - The top horizontal part of the lower right stroke is much shorter than the roof line above, just over a quarter as long, before turning down.
    - The lower right stroke curves flat across at the bottom right and ends in a tall hook pointing straight up.
  strokes:
    - where: a short downward stroke at the upper left, slanting slightly to the left
      part: the left eave of the roof
    - where: a long line starting at the middle of the left eave, running across the top and rising slightly to the right, ending in a short hook down to the left
      part: the roof's ridge and right eave
    - where: a stroke below the roof from the middle left down, sweeping out to the bottom left
      part: the idle person's left side and left leg
    - where: a long stroke starting at the top of the left sweep, running a short way across to the right, turning down, then curving across to the bottom right and ending in a tall hook straight up
      part: the person's shoulders, right leg and upturned foot

兆:
  checked: argon
  object: two people standing back to back and fleeing outward to the left and right from a flood between them, with splashes of water flying above
  history: >-
    Yu Xingwu reads the oracle bone form as two people fleeing in opposite directions with their
    backs to a flood, whereas the traditional Shuowen account took the lines for divination cracks
    on a heated tortoise shell. In the modern form, the two tall central strokes are the fleeing
    figures and the four side strokes are their outstretched arms and flying splashes of water.
  layout: >-
    Two people stand back to back near the middle of the frame, the left person facing left and the
    right person facing right as they flee outward. Each person has a head with eyes, a nose and a
    mouth at the top of their vertical stroke and wears simple pale clothes. Their arms reach
    outward along the lower side strokes on the left and right, while the two upper side strokes are
    pale-blue splashes flying in the air above them, with soft pale blue floodwater surging in the
    gap between their backs.
  exact:
    - The two long central verticals do not touch each other; their vertical shafts are almost the same length, with the right one starting a little higher than the left.
    - The left vertical runs straight down and then sweeps smoothly out to the bottom left, while the right vertical runs straight down, turns wide across to the bottom right, and ends in a tall upward hook.
    - The upper-left dot slants down to the right, about half as long as the lower-right falling stroke, and stops with a small gap before the left vertical.
    - The lower-left rising stroke slants up to the right and its end touches the middle of the left vertical.
    - The upper-right sweep slants down to the left and stops with a small gap before the right vertical.
    - The lower-right falling stroke starts on the middle of the right vertical and slants down to the right.
  strokes:
    - where: a long line to the left of centre, running straight down and then sweeping out to the bottom left
      part: the left person's body and leg, striding out to the left
    - where: a short dot-like stroke in the upper left, slanting down to the right and stopping short of the left vertical
      part: a splash of floodwater flying in the upper left
    - where: a rising stroke in the lower left, slanting up to the right to touch the middle of the left vertical
      part: the left person's outstretched arm
    - where: a long line to the right of centre starting slightly higher than the left vertical, running straight down, turning wide across to the bottom right, and ending in a tall upward hook
      part: the right person's body and leg, the upward hook their foot
    - where: a short sweep in the upper right, slanting down to the left and stopping short of the right vertical
      part: a splash of floodwater flying in the upper right
    - where: a falling stroke in the lower right, starting on the middle of the right vertical and slanting down to the right
      part: the right person's outstretched arm

喪:
  checked: argon
  object: two open mouths wailing on either side of an upright grave marker on an earthen mound, above the draped burial shroud of the dead beneath the ground
  history: >-
    The oldest forms drew many mouths wailing around a mulberry tree, later adding the component for
    dying or the dead. By the seal script it was understood as crying over the dead, and the modern
    form keeps two crying mouths flanking a central cross-post on the ground line, with the stylized
    sign for the dead draped below.
  layout: >-
    Across the middle runs the wide ground line of a pale earthen grave mound, with an upright
    wooden grave marker and crossbar rising from its centre. Flanking the marker in the upper half
    are two open wailing mouths, shaded pale pink inside. Beneath the ground line in the lower half,
    soft pale cloth folds form a draped burial shroud following the lower strokes.
  exact:
    - The upper line across is about half as long as the long middle line across, and the central vertical crosses the middle of the upper line and ends touching the middle of the long middle line.
    - The two small mouths sit on either side of the central vertical between the two horizontal lines, with the right mouth slightly higher than the left; neither mouth touches the central vertical or the horizontal lines.
    - Each mouth is a closed box made of a short left side, a top that turns down to form the right side, and a short bottom line closing it.
    - In the lower half, both the left vertical stroke (which turns sharply up to the right at the bottom) and the long falling stroke start touching the long middle line, with the falling stroke starting to the right of the vertical stroke.
    - The short sweep in the lower right starts below the long middle line without touching it, and its lower end touches the middle of the long falling stroke.
  strokes:
