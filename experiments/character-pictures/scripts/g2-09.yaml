      part: the long trailing edge of the burial shroud sweeping out to the right

乔:
  checked: argon
  object: a tall tower with a peaked roof and wide eaves raised high on pillars
  history: >-
    The traditional form 喬 began as a differentiated form of 高, a tall pavilion or tower, marked at
    the top with an added sign to emphasize height that became 夭 in the Han dynasty. The simplified
    form 乔 condenses the lower tower structure into two tall upright pillars beneath the wide upper
    roof.
  layout: >-
    A tall wooden pavilion rises to fill the square from top to bottom. In the upper part, the
    tilted top stroke forms the peaked roof crest, the horizontal stroke forms the upper crossbeam,
    and the two side sweeps form the wide curving eaves in pale grey-blue tile. Beneath the eaves,
    the two lower vertical strokes become two tall wooden pillars in pale warm tan holding the upper
    structure high.
  exact:
    - The long left sweep starts from the middle of the short top sweep, crosses the middle of the line across, and curves out to the middle left.
    - The right-falling stroke starts on the line across just to the right of the crossing, without touching the left sweep, and sweeps out to the middle right.
    - Both lower strokes stand completely free of the upper part and of each other, with small gaps separating their tops from the two roof sweeps above them.
    - The lower left stroke curves down and slightly to the left, while the lower right stroke is a slightly longer straight vertical line reaching lower down and ending in a plain point with no hook.
  strokes:
    - where: a short sweep across the top, slanting down from right to left
      part: the angled finial crest at the peak of the tower roof
    - where: a line across the upper middle, rising slightly to the right
      part: the upper crossbeam of the roof
    - where: a long sweep from the middle of the top sweep, crossing the line across and curving down to the middle left
      part: the left sloping eave of the tower roof
    - where: a falling stroke from the middle of the line across, sweeping down and out to the middle right
      part: the right sloping eave of the tower roof
    - where: a vertical stroke in the lower left, curving gently down to the bottom left
      part: the tall left wooden pillar supporting the tower
    - where: a straight vertical line in the lower centre-right, running down to the bottom
      part: the tall right wooden pillar supporting the tower

