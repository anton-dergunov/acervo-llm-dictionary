蟲:
  checked: argon
  object: three small snakes or worms clustered together—one at the top centre and two side by side below—representing a swarm of crawling creatures and insects
  history: >-
    The single component 虫 was originally a pictogram of a snake with a broad head and a coiled
    tail. Tripling it into 蟲 created an ideogrammic compound for the whole class of worms, insects,
    and crawling creatures, before the single form 虫 was later borrowed in simplified writing to
    stand for the tripled character.
  layout: >-
    Three small, pale green and soft ochre snakes or worms sit in a triangular cluster: one centred
    in the upper half, one in the lower-left quarter, and one in the lower-right quarter. In each of
    the three creatures, the wide rectangular box forms the broad head with two small eyes, the
    central vertical forms the upright snout above the head and the body running down through the
    neck, the rising lower line forms the belly curving to the right, and the final dot forms the
    curled tail tip.
  exact:
    - The three 虫 components do not touch one another; small gaps separate the top one from the two below, and the bottom-left one from the bottom-right one.
    - The top 虫 is the widest, the bottom-right 虫 is slightly smaller, and the bottom-left 虫 is the narrowest and shortest of the three.
    - In each 虫, the head box is closed at both ends, with its bottom line about two thirds as long as its hooked top-and-right stroke.
    - In each 虫, the central vertical starts well above the head box, crosses straight through the middle of the box, and ends on the middle of the rising bottom line without crossing below it.
    - In each 虫, the rising bottom line touches or meets the final downward-right tail stroke at its right end, while a small gap separates that tail stroke from the underside of the head box above it.
    - The final downward-right stroke of the bottom-right 虫 is noticeably longer than the short tail dots of the top and bottom-left ones.
  strokes:
