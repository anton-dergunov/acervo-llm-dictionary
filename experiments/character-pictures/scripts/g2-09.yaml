丧:
  checked: argon
  object: a mourning scene with a bare mulberry branch and two falling tears for crying at the top, above a fallen figure in a robe representing the dead below
  history: >-
    The oldest form combined a mulberry tree with many crying mouths, and in seal script became
    crying (哭) over the dead (亡). In the simplified form, the upper cross and two side strokes
    preserve the tree top and the two crying mouths, while the lower strokes form the trailing robe
    of the fallen figure below.
  layout: >-
    In the upper half, a small bare mulberry tree top stands on the long middle ground line, with a
    few pale leaves behind its crossed branch and trunk. Flanking the trunk on the left and right
    are two large pale teardrops shed by small crying mouths along the two free side strokes. Below
    the middle ground line lies the slumped figure of the dead in simple pale robes, facing right
    with a peaceful face showing closed eyes, a nose and a mouth, the left vertical-and-rising
    stroke forming the bent legs, the short right sweep the folded arm, and the long sweeping stroke
    the trailing robe hem.
  exact:
    - The upper line across is about half as long as the long middle line across, and the upper vertical crosses it in the middle and ends squarely on the long middle line.
    - The two short strokes on the left and right of the upper vertical—slanting down to the right on the left, and sweeping down to the left on the right—both stand completely free, touching neither the upper cross nor the long middle line.
    - All three lower strokes start on the underside of the long middle line.
    - The lower-left stroke runs down and turns sharply up to the right in a rising hook, without touching the long falling stroke to its right.
    - The long falling stroke starts on the middle line slightly to the left of the upper vertical, sweeps down to the right, and receives the tip of the short lower-right sweep at its middle.
  strokes:
    - where: a line across the upper middle, rising slightly to the right, about half as long as the long middle line across
      part: the horizontal branch of the mulberry tree
    - where: a straight vertical line down the upper centre, crossing the upper line across and ending on the long middle line
      part: the upright trunk of the mulberry tree
    - where: a short stroke in the upper left, slanting down to the right and standing free between the upper and middle lines
      part: the left falling teardrop and crying mouth
    - where: a short sweep in the upper right, slanting down to the left and standing free between the upper and middle lines
      part: the right falling teardrop and crying mouth
    - where: a long line across the middle of the box, rising slightly to the right
      part: the horizontal ground line dividing the tree and tears from the fallen figure below
    - where: a stroke in the lower left, starting on the long middle line, running down and turning sharply up to the right
      part: the bent legs and lower robe of the fallen figure
    - where: a short sweep in the lower right, starting on the long middle line and slanting down to the left to touch the long falling stroke
      part: the folded arm and collar of the fallen figure
    - where: a long falling stroke starting on the long middle line near the centre, sweeping down and out to the bottom right
      part: the reclined body and trailing robe hem of the fallen figure

貌:
  checked: argon
  dropped: The left component 豸 is only an abbreviation of the phonetic 豹, so drawing a beast beside a face would teach a false etymology.

惜:
  checked: argon
  dropped: Because 昔 serves as the sound component and its form depicts strips of meat drying in the sun rather than the abstract notion of the past, picturing a heart beside drying meat would teach a false etymology.

蕩:
  checked: argon
  dropped: Dropping because the character is purely a phono-semantic compound and drawing the folk mnemonic of hot water wiping out plants would teach a false etymology.

脉:
  checked: argon
  dropped: Dropping because the character is a phono-semantic compound with no pictographic or ideographic reading in the scholarly origin, so picturing 永 as long vessels would teach a folk etymology.

扫:
  checked: argon
  object: a hand on the left holding and sweeping with a bound straw broom on the right
  history: >-
    The traditional form 掃 is an ideogrammic compound of a hand 扌 on the left and a broom 帚 on the
    right; the simplified form 扫 keeps the hand and reduces the broom to its bound head 彐.
  layout: >-
    A pale skin-toned hand fills the tall left half, reaching to the right toward a pale golden-tan
    straw broom head in the middle and lower right half. A pale wooden handle connects the top of
    the broom head to the gripping hand. The broom head is framed by the three horizontal courses
    and right edge of the right component, with its bound waist in the middle and its flat sweeping
    bristles along the bottom.
  exact:
    - The left part (the hand) is tall and narrow, while the right part (the broom head) is shorter and sits in the middle and lower right; the two parts do not touch.
    - In the left half, the long vertical stroke crosses both the upper line across and the lower rising stroke, and ends at the bottom in a hook up to the left.
    - In the right half, the upper stroke runs across and turns sharply down on the right, its bottom end touching the bottom line across near its right tip.
    - The middle line across in the right half is about three quarters as long as the bottom line across and stands free, stopping with a small gap before the right vertical leg.
    - The bottom line across in the right half is the longest horizontal stroke, extending slightly past where the right vertical leg meets it.
  strokes:
    - where: a short line across the upper part of the left half, rising slightly to the right
      part: the upper fingers reaching out toward the broom
    - where: a long vertical line down the left half, ending at the bottom in a hook up to the left
      part: the back of the hand and wrist, the hook where the wrist turns
    - where: a rising stroke across the lower middle of the left half, slanting up to the right
      part: the thumb and lower palm pressing up against the broom
    - where: a line across the upper part of the right half that turns sharply down along the right side
      part: the top shoulder and right outer edge of the straw broom head
    - where: a shorter line across the middle of the right half, stopping short of the right side
      part: the cord binding the waist of the straw broom head
    - where: a line across the bottom of the right half
      part: the flat bottom sweeping edge of the broom bristles

闲:
  checked: argon
  object: a gateway of two posts under a crossbeam, barred by a tree standing in its opening as a wooden fence
  history: >-
    An ideogrammic compound of a doorway (门, simplified from 門) and a tree or wood (木): a piece of
    wood or a tree blocking a doorway as a fence or barrier, later used to mean quiet idle time
    behind closed doors.
  layout: >-
    A tall wooden gateway frames the outer left, top right and right sides of the square, open at
    the bottom. Inside the doorway stands a smaller tree with pale green foliage behind its upper
    branches, acting as a barrier across the entrance. The wooden posts and tree bark are painted in
    soft, pale warm browns, keeping clear of the strokes.
  exact:
    - The three outer strokes of the gateway stand completely free of one another and do not touch the inner tree.
    - The short dot at the top left sits high above the gap between the left gatepost and the top crossbeam.
    - The left gatepost and the inner tree's trunk are both straight vertical lines ending in plain points at the bottom, with no hook.
    - The right gatepost turns down from the top crossbeam and ends at the bottom in a clear hook to the left, reaching lower than both the left post and the tree trunk.
    - The top crossbeam of the gateway starts near the top centre and is slightly shorter than the tree's horizontal branch line below it.
    - Inside the gateway, the tree's vertical trunk crosses the middle of its horizontal line; the left sweep starts at that crossing, while the short right stroke is a dot-like stroke that starts just to the right of the trunk with a small gap and does not touch it.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: an iron latch at the top of the left gatepost
    - where: a long straight vertical line down the left side, ending in a plain point
      part: the left gatepost
    - where: a line across the top right, turning down at the top right corner to run down the right side, ending in a hook to the left at the bottom
      part: the crossbeam and the right gatepost, its foot set in the ground
    - where: a horizontal line across the middle inside the gateway, rising slightly to the right
      part: the tree's main branches, barring the doorway
    - where: a straight vertical line down the centre inside the gateway, crossing the horizontal line and ending in a plain point
      part: the trunk of the tree standing in the doorway
    - where: a sweep from the centre crossing down and out to the lower left inside the gateway
      part: the tree's left root, spreading toward the left post
    - where: a short dot-like stroke to the right of the trunk below the crossing, slanting down to the right
      part: the tree's short right root

遵:
  checked: argon
  object: a ceremonial wine jar held up by a hand above a winding road, following in respectful procession
  history: >-
    The character combines a road and stepping foot on the left and bottom with a ceremonial wine
    vessel held aloft by a hand on the right. Offering the vessel of fragrant wine expresses
    veneration and respect, which together with the walking radical means to follow and comply with.
  layout: >-
    The upper and middle right is filled by the ceremonial wine vessel and the hand supporting it,
    while the walking radical wraps around from the left side across the very bottom. At the top of
    the right part, pale golden aroma rises from the wide-rimmed bronze or clay wine jar, which has
    pale amber wine glowing softly inside its body. Directly beneath the jar, an outstretched hand
    and cuffed wrist hold the vessel up in respect. Along the left and bottom, a stepping foot and a
    pale earthen road sweep from the bottom left all the way under the offered vessel to the bottom
    right.
  exact:
    - At the very top of the right part, the left dot stands free with a small gap above the jar's rim, while the right slanting stroke touches the middle of the rim.
    - The upper horizontal rim of the wine jar is about three quarters as long as the long horizontal line of the hand below the jar.
    - The left vertical wall and the top-and-right wall of the jar meet at the top left below the rim, and the bottom horizontal line of the jar connects their lower ends.
    - Two inner vertical strokes start on the middle of the top rim and cross the jar's upper shoulder line; the left one ends free inside the jar, while the right one turns across to the right to touch the jar's right wall.
    - Inside the lower middle of the jar, the short horizontal line stands completely free, with small gaps between its ends and the jar's walls.
    - Below the jar, the vertical hooked stroke starts on the middle of the jar's bottom line, crosses the long horizontal line of the hand, and ends in a hook to the left without touching the sweeping road below.
    - The dot of the hand below the long horizontal line and the top-left dot of the walking radical both stand free.
    - On the lower left, the bent stepping stroke turns down and touches the long bottom sweeping stroke, which runs from the bottom left all the way under the right component to the bottom right.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: a wisp of fragrant wine aroma rising on the left above the jar
    - where: a short stroke to the right of the first dot, running down and slightly left to touch the horizontal line below
      part: a second wisp of aroma rising from the centre of the jar's rim
    - where: a horizontal line across the upper part of the right side, about three quarters as long as the lower horizontal line
      part: the wide flat rim of the ceremonial wine jar
    - where: a vertical line running down the left side of the upper-middle right part
      part: the left wall of the wine jar
    - where: a line from the top of the jar's left wall running across to the right and turning sharply down to form the right side
      part: the upper shoulder and right wall of the wine jar
    - where: a line starting from the middle of the top rim, running down across the jar's shoulder into the left side of the jar
      part: the left inner neck channel dipping into the wine jar
    - where: a line starting from the top rim where the second stroke meets it, running down across the shoulder and turning across to the right to touch the jar's right wall
      part: the right inner neck channel turning toward the side of the jar
    - where: a short horizontal line inside the lower middle of the jar, rising slightly to the right and standing free of the walls
      part: the surface line of the wine inside the belly of the jar
    - where: a horizontal line closing the bottom of the jar from the left wall to the right wall
      part: the flat base of the wine jar
    - where: a long horizontal line across the middle right, below the base of the jar
      part: the outstretched hand and forearm supporting the vessel from beneath
    - where: a vertical stroke starting from the middle of the jar's base, crossing the long horizontal line and running down to end in a hook to the left
      part: the upright wrist and sleeve holding the vessel aloft, the hook its turned cuff
    - where: a short dot below the long horizontal line and to the left of the hooked vertical, slanting down to the right
      part: the thumb mark of the supporting hand
    - where: a short dot at the upper left, slanting down to the right
      part: a leading footprint mark along the upper path
    - where: a stroke on the middle left that runs across to the right, then turns sharply down in a curving step to touch the bottom stroke
      part: the bent leg and stepping stride advancing along the road
    - where: a long sweeping stroke starting at the bottom left, rising slightly to meet the stepping stroke, then running down and across to the bottom right
      part: the winding road sweeping beneath the offered vessel

弗:
  checked: argon
  object: a rope wrapped back and forth around two upright pieces of wood to bind them straight
  history: >-
    The oldest forms drew a cord winding around two wooden staves to straighten them. The winding
    cord later took the shape of a bow, crossed by the two vertical staves.
  layout: >-
    Two tall pale-brown wooden staves stand side by side through the middle of the frame, the left
    one curving slightly outward at the foot and the right one standing straight and a little
    taller. A pale hemp rope winds horizontally across and around both staves in three passes from
    top to bottom, turning at the left and right edges along the bow-shaped strokes.
  exact:
    - Both long vertical strokes cross all three horizontal passes of the winding stroke group.
    - The left vertical starts slightly lower than the right vertical and curves out toward the bottom left, while the right vertical runs straight down from near the top to the bottom and ends in a plain point with no hook.
    - The upper line runs across and turns down on the right to meet the right end of the middle line across.
    - The lower winding stroke starts at the left end of the middle line, drops briefly on the left, runs wide across to the right, and turns down on the right to end in a hook to the left.
  strokes:
    - where: a line across the upper part, turning down at the right
      part: the top pass of the rope, wrapping across to the right and turning down
    - where: a line across the middle, rising slightly to the right to meet the bottom of the upper turn
      part: the middle pass of the rope, pulled tight across the staves
    - where: a line down on the middle left from the start of the middle line, turning wide across to the right and then down on the right, ending in a hook to the left
      part: the lower loop of the rope, turning down on the left, crossing to the right, and hanging down at the hooked end
    - where: a long line down to the left of centre, curving out to the bottom left
      part: the left wooden stave, bound by the rope
    - where: a long straight line down just right of centre, from the top to the bottom
      part: the right wooden stave, bound straight beside the left

胃:
  checked: argon
  object: a stomach pouch filled with rice grains at the top, above the fleshy wall of the abdomen below
  history: >-
    The earliest form drew a rounded stomach pouch containing grains of rice (米), with the flesh
    radical 肉 added underneath to mark it as an organ of the body. In clerical script the pouch and
    its grains were squared into the four-part grid 田 above the flesh frame ⺼.
  layout: >-
    The wider upper half is a rounded stomach pouch in pale pink, its four inner chambers holding
    soft pale-yellow rice grains between the crossed inner folds. Directly below, separated by a
    small gap, the narrower and taller lower half shows the pale rose-coloured muscular flesh of the
    abdomen, banded by two horizontal muscle ridges inside its vertical frame.
  exact:
    - The upper box is wider and shorter than the tall, narrower frame below it, and the two parts do not touch.
    - The left and right walls of the upper box slant slightly inward toward the bottom, closed by the bottom line across.
    - Inside the upper box, the vertical line touches both the top and bottom walls and crosses the middle horizontal line, which stops short of both side walls.
    - In the lower frame, the left vertical line ends in a plain point curving slightly left, while the top-and-right stroke ends at the bottom right in a sharp hook up to the left.
    - The two short inner lines in the lower frame both touch the left vertical line and stop short of the right side.
  strokes:
    - where: a short line down the upper left side, slanting slightly inward
      part: the left wall of the stomach pouch
    - where: a wide line across the top that turns down at the top right to form the upper right side, slanting slightly inward
      part: the top and right walls of the stomach pouch
    - where: a short line across the middle of the upper box, stopping short of both sides
      part: the horizontal inner fold holding the grains inside the stomach
    - where: a short straight line down the middle of the upper box, from the top line to the bottom line
      part: the vertical inner fold dividing the stomach pouch
    - where: a line across the bottom of the upper box, closing it from left to right
      part: the bottom wall of the stomach pouch
    - where: a long line down the left side of the lower half, curving slightly out at the bottom
      part: the left edge of the fleshy abdomen wall
    - where: a line across the top of the lower half that turns straight down the right side and ends in a hook up to the left
      part: the top and right edge of the fleshy abdomen wall
    - where: a short line across the upper middle of the lower frame, rising slightly to the right
      part: the upper muscle ridge of the flesh
    - where: a short line across the lower middle of the lower frame, rising slightly to the right
      part: the lower muscle ridge of the flesh

盪:
  checked: argon
  object: hot steaming soup or water (湯, made of splashing water 氵 and the warm sun 旦 casting rays of heat 勿) inside a wide shallow bowl (皿)
  history: >-
    An ideogrammic and phono-semantic compound combining hot water or soup (湯) at the top with a
    wide shallow vessel (皿) at the bottom, depicting hot liquid sloshing in a basin.
  layout: >-
    The upper two thirds hold the hot water component: on the upper left, three splashes of pale
    blue water rise beside the bowl; on the upper right, a pale warm yellow sun sits above a horizon
    line, with curving wisps of pale steam and heat streaming down from under it. The bottom third
    is filled by a wide, shallow ceramic bowl in pale terracotta and cream, holding pale steaming
    broth that ripples just below the rim.
  exact:
    - The three water strokes on the upper left stand completely free of one another and do not touch the right part or the bowl below.
    - In the small sun box at the top centre, the inner line touches the left vertical and stops short of the right side, and only the right side reaches down to touch the middle of the horizon line below.
    - Below the horizon line, a short sweep starts at its left end, a wide hooked stroke starts from the middle of that sweep and turns down into a hook to the left, and two sweeps hang down to the left from the top of the hooked stroke, with the right sweep longer than the left.
    - In the bowl at the bottom, the outer walls and the two inner ribs all connect the top rim to the bottom base line.
    - The bottom base line is the longest horizontal stroke in the character, clearly wider than the horizon line above and extending well past the walls of the bowl on both sides.
  strokes:
    - where: a short dot slanting down to the right at the top left
      part: the top splash of hot water
    - where: a short dot slanting down to the right at the upper middle left, set further left than the top dot
      part: the middle splash of hot water
    - where: a rising stroke on the middle left, sweeping up and to the right
      part: the lower upward splash of water
    - where: a short vertical line slanting slightly right at the top centre
      part: the left side of the warming sun
    - where: a line across the top right of centre, rising slightly and turning down on the right
      part: the top and right side of the warming sun
    - where: a short line across the middle of the sun box, touching the left side and stopping short of the right
      part: the inner gleam of the sun
    - where: a short line across the bottom of the sun box, rising slightly to the right to close it
      part: the bottom edge of the sun
    - where: a wide line across the upper middle below the sun, rising slightly to the right
      part: the horizon line beneath the sun
    - where: a short sweep down to the left from the left end of the horizon line
      part: the leftmost wisp of rising steam
    - where: a line from the middle of that short sweep across to the right, turning down and ending in a hook to the left
      part: the overarching cloud of heat and steam above the bowl
    - where: a sweep down to the left from the left part of the overarching stroke, about as long as the leftmost wisp
      part: the first inner ray of heat streaming down to the left
    - where: a longer sweep from the middle of the overarching stroke down and to the left
      part: the second, longer ray of heat streaming down toward the bowl
    - where: a line at the lower left slanting down and slightly to the right
      part: the left wall of the bowl
    - where: a wide line from the top of the left wall across to the lower right, turning sharply down and slightly inward
      part: the rim and right wall of the bowl
    - where: a short line inside the left part of the bowl, slanting slightly right from the rim to the base
      part: the left rib on the side of the bowl
    - where: a short line inside the right part of the bowl, slanting slightly left from the rim to the base
      part: the right rib on the side of the bowl
    - where: a very long line across the bottom, extending past the walls of the bowl on both sides
      part: the wide flat base of the bowl
