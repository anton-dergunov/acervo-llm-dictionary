尸:
  checked: argon
  object: a person seen from the side, bent forward at the waist to the right, with the bowed torso at the top and the back and legs sweeping down to the bottom left
  history: >-
    The oldest forms drew a person in profile sitting or lying with a bent body. In the modern form,
    the bowed upper body became the closed rectangular box at the top right, and the back and legs
    became the long sweep down to the bottom left.
  layout: >-
    A single person in profile fills the frame, bending deeply forward toward the right. The closed
    box at the top right is the person's bowed torso dressed in a simple pale tunic, with a small
    head in profile just to the right of the box showing eyes, a nose and a mouth. The long left
    stroke follows the spine and legs down to pale feet at the bottom left.
  exact:
    - The first stroke starts at the top of the long left sweep, runs across to the right rising slightly, and turns sharply down and slightly left at the right end.
    - The lower line across is about three quarters as long as the top stroke; it starts near the middle of the long left sweep and rises slightly to the right to meet the bottom of the first stroke's downward turn, closing the upper box.
    - The long left stroke starts at the top left corner of the upper box, runs straight down past the lower line across, and sweeps out to a point at the bottom left.
  strokes:
    - where: a line across the top from the upper left to the right, turning sharply down and slightly left at the right end
      part: the top of the bowed back and shoulders, turning down along the front of the chest
    - where: a shorter line across below the top stroke, about three quarters as long, rising slightly to the right from the middle of the left stroke to meet the right side
      part: the underside of the bowed torso
    - where: a long stroke from the top left corner down, then sweeping out to the bottom left
      part: the lower back and legs stretching down to the feet

