    - where: a vertical line down the upper middle from near the top, crossing the upper line across and ending on the long middle line
      part: the upright post of the grave marker standing between the two mouths
    - where: a short line slanting down to the right in the upper left, below the crossbar
      part: the left corner of the left wailing mouth
    - where: a short line in the upper left running across from the top of the left side and turning down
      part: the upper lip and right corner of the left wailing mouth
    - where: a short line across the bottom of the left mouth, rising slightly to the right to close the box
      part: the lower lip of the left wailing mouth
    - where: a short line slanting down to the right in the upper right, to the right of the central post
