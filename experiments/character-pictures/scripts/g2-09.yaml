閒:
  checked: argon
  object: a waxing crescent moon seen through the open space between two tall wooden door leaves
  history: >-
    An ideogrammic compound combining a doorway 門 with the moon 月 in the opening between its two
    leaves: moonlight peeking through the crack of a door at night, from which came the meanings of
    a gap or space and of quiet leisure.
  layout: >-
    A tall wooden gateway frames the outer left, top, and outer right of the square, with its two
    paneled upper leaves hanging above a wide central opening. Framed in the gap between the two
    door posts sits an upright waxing crescent moon, lit and curved on its right side, painted in
    soft pale yellow with a faint cool glow around it, while the wooden door leaves are warm pale
    brown.
  exact:
    - The left door post is a long straight vertical ending in a plain point at the bottom, while the right door post reaches slightly lower and ends in a hook up to the left.
    - In the upper left door leaf, the upper inner stroke touches the left post and stops short of the inner vertical edge, while the lower stroke connects the left post to the bottom of the inner vertical edge.
    - In the upper right door leaf, the upper inner stroke touches the inner vertical edge and stops short of the right post, while the lower stroke connects the bottom of the inner vertical edge to the right post.
    - The moon sits inside the lower opening between the two door posts without touching either leaf of the gate.
    - In the moon, the top-and-right stroke starts at the top of the left sweep and ends at the bottom in a hook to the left.
    - The moon's two inner strokes touch its left sweep and stop short of its right side.
  strokes:
    - where: a long straight line down the left side, from the top nearly to the bottom
      part: the outer post of the left door leaf
    - where: a stroke from the top of the left line running across to the right and turning down in the upper left
      part: the top and inner edge of the upper left door panel
    - where: a short stroke inside the upper left panel, rising slightly to the right
      part: a wooden slat across the upper left door panel
    - where: a short stroke below it in the upper left panel, rising slightly to the right to meet the inner corner
      part: the bottom crossbar of the upper left door panel
    - where: a short line down from the top centre of the right half
      part: the inner edge of the upper right door panel
    - where: a long line from the top of that short vertical running across the top right, turning down along the right side to the bottom, ending in a hook up to the left
      part: the top and outer post of the right door leaf
    - where: a short stroke inside the upper right panel, rising slightly to the right
      part: a wooden slat across the upper right door panel
    - where: a short stroke across the bottom of the upper right panel, from the inner corner to the outer post
      part: the bottom crossbar of the upper right door panel
    - where: a line in the lower middle starting below the left panel, running down and sweeping out to the bottom left
      part: the inner edge of the crescent moon, sweeping into its lower horn
    - where: a stroke from the top of the moon's left edge running across to the right, turning down, and ending in a hook to the left
      part: the upper horn and rounded right back of the crescent moon
    - where: a short stroke across the upper middle of the moon, rising slightly to the right
      part: an upper shadowed crater on the moon's face
    - where: a short stroke across the lower middle of the moon, rising slightly to the right
      part: a lower shadowed crater on the moon's face

閑:
  checked: argon
  object: a gateway of two wooden door leaves standing open, with a tree standing inside the doorway as a wooden barrier
  history: >-
    An ideogrammic compound combining a two-leaved gate (門) with a tree or piece of wood (木) placed
    in the opening to bar the entrance and form a fence.
  layout: >-
    A tall wooden gateway frames the left, top and right sides of the square, with its two small
    upper door leaves hanging at the top left and top right. Between the tall side posts, in the
    open doorway below the upper leaves, stands a small tree with a pale leafy crown behind its
    branches and trunk. The wooden gate leaves and posts are shaded in pale warm tan, and the tree's
    foliage is a soft pale green, leaving the doorway open at the bottom.
  exact:
    - The gateway's left outer vertical ends in a plain point at the bottom with no hook, while the right outer vertical reaches lower and ends in a hook up to the left.
    - The right door leaf sits slightly higher than the left door leaf.
    - In both upper door leaves, the middle dot touches the left vertical of that leaf and stops short of the right vertical, while the lower line across closes the box by touching both sides.
    - The tree sits centered inside the lower doorway and does not touch the gate's strokes on either side or above.
    - The tree's vertical trunk crosses the horizontal branch line and ends at the bottom in a plain point with no hook.
    - The tree's left root sweeps down from the crossing of the trunk and branches, while its right root is a shorter stroke slanting down to the right that starts just below the crossing with a small gap between it and the trunk.
  strokes:
    - where: a long straight line down the left side, from near the top to near the bottom, with no hook
      part: the left door leaf's outer post
    - where: a stroke starting at the top of the left line, running across to the right and turning down for about two fifths of the left line's length
      part: the left door leaf's top and inner edge
    - where: a short stroke inside the upper left leaf, starting on the left line and rising slightly to the right without touching the inner edge
      part: the left door leaf's upper stud
    - where: a short line across the bottom of the upper left leaf, rising slightly from the left line to meet the foot of the inner edge
      part: the left door leaf's lower crossbar
    - where: a short line down in the upper right half, about two fifths as long as the left outer post
      part: the right door leaf's inner edge
    - where: a long stroke starting at the top of the right leaf's inner edge, running across the top right, turning down down the right side to the bottom, and ending in a hook up to the left
      part: the right door leaf's top and outer post
    - where: a short stroke inside the upper right leaf, starting on the inner edge and rising slightly to the right without touching the outer post
      part: the right door leaf's upper stud
    - where: a short line across the bottom of the upper right leaf, rising slightly from the foot of the inner edge to touch the outer post
      part: the right door leaf's lower crossbar
    - where: a line across the middle of the doorway between the gateposts, rising slightly to the right
      part: the tree's main branches spreading across the doorway
    - where: a straight line down the centre of the doorway, starting between the two upper door leaves, crossing the branch line, and ending in a plain point at the bottom
      part: the tree's trunk barring the centre of the gate
    - where: a sweep from the crossing of the branch line and the trunk down and out to the bottom left inside the doorway
      part: the tree's left root spreading down to the left
    - where: a short falling stroke to the right of the trunk below the crossing, slanting down to the right without touching the trunk
      part: the tree's short right root

舌:
  checked: argon
  object: a tongue sticking upwards out of a wide-open mouth
  history: >-
    The oldest oracle bone forms drew a forked snake's tongue emerging upwards from an open mouth 口,
    with a horizontal stroke added across the tongue to mark its position. The modern form
    simplified the upper part into the shape of 千 standing on top of the mouth 口.
  layout: >-
    An open mouth sits in the lower half of the square, seen from the front, with pale pink lips and
    a soft mid-grey interior. Rising straight up from the upper lip is a pale pink tongue that
    reaches the slanted tip at the top, with the long middle horizontal stroke cutting across the
    tongue as a wide cross-line.
  exact:
    - The top sweep slants down from right to left at the very top of the character.
    - The upper vertical line starts at the middle of the top sweep, crosses the middle of the long line across, and ends on the middle of the mouth's top line without entering the mouth.
    - The line across the middle is the widest stroke, stretching almost from edge to edge; the top of the mouth below is clearly shorter, a little under two thirds as wide.
    - In the mouth at the bottom, the top stroke starts at the top of the left vertical, runs across, and turns down on the right to meet the right end of the bottom line across.
    - The bottom line across touches the middle of the mouth's left vertical, leaving the bottom tip of the left vertical extending slightly below.
  strokes:
    - where: a short sweep at the top, running from right of centre down and to the left
      part: the slanted tip of the tongue at the top
    - where: a long line across the middle from far left to far right, rising slightly to the right, clearly wider than the mouth below
      part: the wide cross-line across the middle of the tongue
    - where: a straight vertical line down the upper centre, from the middle of the top sweep to the middle of the mouth's top line
      part: the central stem and groove of the tongue rising from the mouth
    - where: a line down the left side of the lower part, slanting slightly inward toward the bottom
      part: the left corner and left side of the open lips
    - where: a line across the top of the lower part, clearly shorter than the middle line above, turning down at the right to run down the right side of the mouth
      part: the upper lip, curving down into the right side of the open mouth
    - where: a short line across the bottom of the mouth from left to right, rising slightly to meet the bottom of the right side
      part: the lower lip closing the bottom of the mouth

