      part: the left side of the bottom-left creature's broad head
    - where: a line across the top of the lower-left box, turning down to the left at its right corner
      part: the top and right side of the bottom-left creature's head
    - where: a shorter line across the bottom of the lower-left box, closing it from left to right
      part: the underside of the bottom-left creature's head
    - where: a vertical line in the lower-left quarter, crossing from above the box down through its middle to end on the rising line below
      part: the bottom-left creature's upright snout and central body
    - where: a line near the bottom left, rising slightly from left to right beneath the lower-left box
