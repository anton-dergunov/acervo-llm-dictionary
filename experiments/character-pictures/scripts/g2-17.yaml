# Full run, group g2, batch 17. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

笛:
  checked: argon
  dropped: Because 由 serves purely as the phonetic component rather than depicting part of a flute, drawing it as an ideogram would teach a false etymology.

朵:
  checked: argon
  object: a drooping cluster of flowers blooming at the top of a tree
  history: >-
    Originally a pictogram of a plant or tree with a heavy, drooping cluster of blossoms at its top;
    the drooping top became the upper part 几 and the plant below became the tree 木.
  layout: >-
    A tree fills the wider lower half of the square, with a straight trunk down the middle, branches
    spreading across, and roots spreading to the bottom left and right, backed by a pale green leafy
    crown. Above the top of the trunk sits a large drooping cluster of pale pink blossoms shaped by
    the upper strokes. The upper flower cluster and the lower tree are separated by a small gap.
  exact:
    - The upper part and the lower tree do not touch each other.
    - In the upper part, the right stroke starts at the top of the left sweep, runs briefly across, turns down, and then turns flat to the right with a plain horizontal foot and no upward hook.
    - The upper part's top across leg is much shorter than the tree's long branch line below it, about a quarter as long.
    - In the lower tree, the straight vertical trunk crosses the middle of the long line across and ends at the bottom in a plain point, with no hook.
    - The lower left and right sweeps both start where the trunk crosses the line across and spread outward without touching each other.
  strokes:
    - where: a sweep in the upper half from the top centre down to the middle left
      part: the drooping left petal of the flower cluster
    - where: a stroke starting at the top of the upper sweep, running briefly across and rising slightly to the right, then turning down and turning flat across to the right with no hook
      part: the arched top and curving right petal of the flower cluster
    - where: a long line across the middle, from left to right
      part: the tree's main branches, spreading out to both sides
    - where: a straight line down the middle of the lower half, from just below the flower cluster to the bottom
      part: the tree's trunk
    - where: a sweep from the crossing of the trunk and branches down and out to the bottom left
      part: the tree's root spreading out to the left
    - where: a falling stroke from the crossing of the trunk and branches down and out to the bottom right
      part: the tree's root spreading out to the right

