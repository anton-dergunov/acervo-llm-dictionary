眉:
  checked: argon
  object: a thick eyebrow arching across the top and sweeping down the left side, above an upright eye with its iris between the two inner lines
  history: >-
    The oldest forms drew an eye with tufts of eyebrow hair above it. In seal and clerical script
    the hairs merged into the band across the top and the long sweep down the left, wrapping around
    the upright eye.
  layout: >-
    At the top, a broad pale-brown eyebrow fills the upper rectangular band and extends into a long
    arched brow ridge sweeping down the left side. Tucked underneath the brow band in the lower
    right is a tall almond-shaped eye stood upright, its lids following the lower box's frame. A
    soft round iris in pale brown or blue sits between the two inner lines of the eye, with a
    mid-grey pupil and nothing black inside it.
  exact:
    - The top stroke starts at the top of the long left sweep, runs across to the right, and turns down to meet the right end of the horizontal line below it, forming a closed rectangular band at the top.
    - A short vertical line stands inside the middle of the top band, touching both its upper and lower lines.
    - The lower line of the top band touches the long left sweep and is about three quarters as long as the top line.
    - The long left sweep starts at the top left corner of the top band and curves down to the bottom left, without touching the eye beside it.
    - The eye sits in the lower right below the top band, with a clear gap separating it from both the top band and the long left sweep.
    - Inside the eye, the two middle horizontal lines touch the left vertical and stop clearly short of the right side, while the bottom line touches both sides to close the frame.
  strokes:
    - where: a line across the top from the upper left to the right, turning down at the top right corner
      part: the upper edge and right tip of the eyebrow
    - where: a short vertical line down the middle of the top band, from the top line to the line below it
      part: a tuft line dividing the middle of the eyebrow
    - where: a line across below the top band, from the upper part of the left sweep to the bottom of the top stroke's right turn, about three quarters as long as the top line
      part: the lower edge of the eyebrow above the eye
    - where: a long line from the top left corner of the brow band down the left side, sweeping out to the bottom left
      part: the long outer tail of the eyebrow and brow ridge sweeping down beside the eye
    - where: a straight line down the left side of the lower half
      part: the eye's left lid
    - where: a line across the top of the lower half, turning down at the right corner to run down the right side
      part: the eye's top corner and its right lid
    - where: a short line across the upper middle of the eye frame, from its left side
      part: the upper edge of the iris
    - where: a short line across the lower middle of the eye frame, from its left side
      part: the lower edge of the iris
    - where: a line across the bottom of the eye frame, joining the left and right sides
      part: the eye's bottom corner, where the lids meet
