鸡:
  checked: argon
  dropped: The character as written is a phono-semantic compound whose left component 又 is a simplified replacement for the phonetic 奚 rather than a semantic hand, so depicting a hand reaching toward a chicken teaches a false etymology.
  object: a right hand on the left reaching out toward a chicken standing in profile on the right
  history: >-
    The earliest oracle bone forms were a direct pictogram of a crested chicken. Later forms added a
    phonetic component beside the bird component, and the modern simplified form writes a hand 又 on
    the left and a bird 鸟 on the right.
  layout: >-
    The picture has two parts side by side, matching the character's proportions: a smaller right
    hand on the middle-left reaching right with its thumb hanging down, and a tall chicken on the
    right facing left toward the hand. The chicken's crest rises at the top, its head and eye sit in
    the upper right, its breast and arched tail follow the large double-turning stroke, and its
    tucked feet follow the lower horizontal line. Soft pale feathers in warm buff and pale
    terracotta fill the chicken's plumage, with a pale coral comb and a pale skin tone on the hand.
  exact:
    - The left part (the hand) is smaller and sits at middle height; the right part (the chicken) is much taller and wider, spanning almost the full height of the box.
    - The left part and the right part do not touch each other.
    - In the left part, the top-left stroke runs across to the right and turns sharply to sweep down to the bottom left, and the diagonal stroke slants down to the right across the middle of that downward sweep.
    - At the top of the right part, the bottom end of the short crest sweep meets both the start of the head stroke and the top of the long neck-and-body stroke.
    - The head stroke runs across to the right, turns down, and ends in a small hook up to the left; the eye dot inside it stands completely free of the surrounding strokes.
    - The long neck-and-body stroke runs straight down from the head, turns sharply across to the right, and turns down on the far right to end in a hook up to the left at the bottom.
    - The lower line across is more than twice as long as the top horizontal leg of the left hand; it starts beneath the right side of the hand and runs across inside the lower curve of the body, standing completely free of every other stroke.
  strokes:
    - where: a stroke in the left half running across to the right, then turning sharply to sweep down to the bottom left
      part: the back of the reaching hand and its thumb hanging down
    - where: a diagonal stroke in the left half slanting from the middle left down to the lower right, crossing the downward sweep
      part: the forearm reaching in from the left
    - where: a short sweep near the top centre running down and slightly to the left
      part: the crest on top of the chicken's head
    - where: a stroke from the bottom of the top sweep running across to the right, turning down, and ending in a small hook up to the left
      part: the top and back of the chicken's head
    - where: a short dot slanting down to the right inside the upper-right head enclosure
      part: the chicken's eye
    - where: a long stroke running straight down from the front of the head, turning across to the right, then turning down on the far right and ending in a hook up to the left at the bottom
      part: the chicken's neck and breast, turning across its wing and down along its curving tail
    - where: a horizontal line across the lower part, from beneath the right side of the hand to inside the lower body curve
      part: the chicken's tucked legs and feet beneath its body

兼:
  checked: argon
  object: a hand in the middle grasping two stalks of grain standing side by side
  history: >-
    An ideogrammic compound combining a hand (又, written in its three-finger form 彐) holding two
    grain plants (禾) together at once. In the modern form, the tops of the two stalks became the two
    short strokes and upper bar at the top, their stems run side by side through the grasping hand,
    and their lower leaves splay out to the left and right below.
  layout: >-
    Two tall stalks of grain stand side by side down the centre, with pale golden grain ears
    drooping at the top and leaves splaying outward near the bottom. Around the middle, a pale hand
    reaches across to grasp both stems together in one grip. Soft pale gold, light green, and warm
    skin tones stay behind the strokes.
  exact:
    - At the top centre, the left dot slants down to the right and the right short sweep slants down to the left; both stand free just above the upper horizontal line without touching it.
    - The upper horizontal line, the top leg of the turned stroke, and the lower horizontal line of the middle part are all about the same width, slightly over half as long as the very long middle horizontal line.
    - The middle horizontal stroke is the widest stroke of the character, extending far to the left and crossing well past the vertical turn on the right.
    - The turned stroke in the upper middle runs across to the right and turns down, crossing the long middle line and ending on the right end of the lower horizontal line.
    - Two straight vertical lines start on the upper horizontal line and run side by side all the way down through all three lines of the middle hand part, ending in plain points at the bottom with no hooks; the right vertical reaches slightly lower than the left.
    - A sweep to the bottom left starts where the left vertical crosses the lower horizontal line, and a falling stroke to the bottom right starts on the right vertical just below that crossing.
  strokes:
    - where: a short dot at the top centre-left, slanting down to the right
      part: the drooping ear of the left grain stalk
    - where: a short sweep at the top centre-right, slanting down to the left
      part: the drooping ear of the right grain stalk
    - where: a line across the upper part, rising slightly to the right
      part: the upper leaves spanning the tops of both grain stalks
    - where: a line across the upper middle, turning down on the right
      part: the top finger and back of the grasping hand
    - where: a very long line across the middle from far left to far right
      part: the long middle finger and outstretched leaf crossing both stalks
    - where: a shorter line across the lower middle, rising slightly to the right
      part: the lower finger of the grasping hand
    - where: a long straight line down the left of the centre, from the upper horizontal line to near the bottom
      part: the stem of the left grain stalk
    - where: a long straight line down the right of the centre, from the upper horizontal line to the bottom
      part: the stem of the right grain stalk
    - where: a sweep from the middle of the left vertical down and out to the bottom left
      part: the lower leaf of the left grain stalk, splaying left
    - where: a falling stroke from the middle of the right vertical down and out to the bottom right
      part: the lower leaf of the right grain stalk, splaying right

阴:
  checked: argon
  object: a steep terraced hill on the left beside a waxing crescent moon standing upright on the right
  history: >-
    The traditional form combined a terraced mound with a phonetic component for shade and clouds;
    this form replaced the right side with the moon to pair with the sun in its counterpart, showing
    the shaded, moonlit side of a hill. The left component originally drew a cliff with stepped
    terraces cut into its flank, and the right component drew a crescent moon stood upright.
  layout: >-
    A narrow terraced hillside fills the left side of the square, with a straight cliff spine on the
    far left and two rounded earthen steps jutting to the right in its upper half, shaded in pale
    cool grey and soft tan. On the right stands a wider upright crescent moon, waxing so its rounded
    lit back curves on the right, coloured pale buttery yellow with soft grey craters on its face.
    The hill and the moon stand side by side without touching.
  exact:
    - The left part (the hill) is narrower than the right part (the moon), and the two parts do not touch.
    - On the left, the terraced stroke starts at the top of the straight vertical line, turns sharply down and left, then bulges out in a curve and ends in a hook to the left about halfway down the vertical line.
    - The long vertical line on the far left runs straight down and ends in a plain point at the bottom, with no hook.
    - On the right, the moon's top-and-right stroke starts touching the top of its left sweep, turns down at the top right, and ends at the bottom in a hook to the left.
    - The moon's two short inner lines across both touch the left sweep and stop short of the right vertical side.
  strokes:
    - where: a line across the top of the left part that turns sharply down and left, then curves out to the right and ends in a hook to the left near the middle
      part: the two stepped terraces jutting out from the upper flank of the hill
    - where: a long straight line down the far left, from the top to the bottom
      part: the steep cliff spine of the hill
    - where: a long line down the left side of the right part, curving out to the bottom left at its foot
      part: the inner edge of the crescent moon, its foot sweeping out into the lower horn
    - where: a line across the top of the right part, turning down at the top right to run down the right side, ending in a hook to the left at the bottom
      part: the upper horn and the rounded back of the crescent moon, curling in at the bottom
    - where: a short line across the upper middle of the right part, rising slightly to the right
      part: an upper shadowed crater on the moon's face
    - where: a short line across the lower middle of the right part, rising slightly to the right
      part: a lower shadowed crater on the moon's face

