罚:
  checked: argon
  object: a net held open at the top above a folded speech ribbon of accusation on the bottom left and an upright knife on the bottom right
  history: >-
    The character is an ideogrammic compound combining 詈 (a net 网 over speech 言, meaning to ensnare
    with words or accuse) and a knife 刀 (刂), depicting verbal abuse and a blade used in crime and
    punishment. The simplified form reduces the full speech component 言 on the bottom left to its
    cursive two-stroke form 讠.
  layout: >-
    Across the top sits a wide rectangular net in a wooden frame, tapering slightly toward its
    bottom bar, with pale woven mesh behind the two inner vertical cords. Below the left side of the
    net sits the speech component: a pale scroll-like speech ribbon following the folded lower
    stroke, with a small sound mark floating above it. Below the right side of the net stands an
    upright pale steel knife blade, its short inner ridge on the left and its long spine and hooked
    tip on the right.
  exact:
    - The top net is a closed four-sided frame divided into three cells by two short inner lines that touch both the top bar and the bottom bar.
    - The net's left side slants down to the right and its right side slants down to the left, so the bottom bar is narrower than the top.
    - The net at the top does not touch either the speech component on the bottom left or the knife on the bottom right.
    - All four strokes in the lower two-thirds of the box stand completely free of one another, with no touches or crossings.
    - In the speech component on the bottom left, the lower stroke rises from the far left, turns sharply down, and turns sharply at the bottom to rise to the right.
    - In the knife on the bottom right, the left vertical is clearly shorter, a little over a third as long as the right vertical, and ends in a plain point with no hook, while the long right vertical reaches from just below the net to the bottom of the box and ends in a hook up to the left.
  strokes:
    - where: a short line at the upper left, slanting down and slightly to the right
      part: the left side of the net's frame
    - where: a long line across the top that turns sharply down at the top right, slanting inward to end in a small hook to the left
      part: the top bar and right side of the net's frame
    - where: a short line running straight down inside the left middle of the net frame
      part: the left inner vertical cord of the net
    - where: a short line inside the right middle of the net frame, starting down to the right and turning down to the left
      part: the right inner vertical cord of the net
    - where: a line across the bottom of the net frame, rising slightly to the right to close the frame
      part: the bottom bar of the net's frame
    - where: a short stroke below the left side of the net, slanting down to the right, about three quarters as long as the net's left side
      part: the mark of spoken breath above the speech ribbon
    - where: a long folded stroke in the bottom left that rises from the far left, turns sharply down, and turns sharply at the bottom to rise to the right
      part: the folded ribbon of spoken accusation
    - where: a short straight vertical line in the lower middle-right, ending in a plain point with no hook
