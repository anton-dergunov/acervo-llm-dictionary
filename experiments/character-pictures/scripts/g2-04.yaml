    one long horizontal stroke across the middle represents the binding cord.
  layout: >-
    A row of upright pale-tan bamboo slips stands side by side filling the frame, joined along the
    top by the upper bar and bound across the middle by a horizontal cord that extends past the
    outer slips on both sides. Each vertical stroke is the dark ink spine or edge of a pale bamboo
    slip, with the two inner slips ending a little higher at the bottom than the two outer slips.
  exact:
    - A single continuous frame stroke starts at the top of the leftmost vertical, runs across the top as a single bar, turns down at the top right as the rightmost vertical, and ends in a hook to the left at the bottom.
    - The top bar is about half as long as the wide horizontal line across the middle.
    - The leftmost vertical curves slightly out toward the bottom left and ends in a plain point, with no hook.
    - The two inner vertical lines sit side by side inside the frame; both start by touching the top bar and end in plain points above the bottoms of the two outer verticals.
    - The long horizontal line across the middle crosses both outer verticals and both inner verticals, extending well past the frame on the left and on the right.
  strokes:
