罰:
  checked: argon
  object: a net stretched across the top over a speaking mouth with rising bars of speech on the lower left and an upright knife on the lower right
  history: >-
    An ideogrammic compound combining a net and spoken words (verbal abuse, or catching the accused)
    with a knife (crime or punishment). The top part is a horizontal net frame, the lower left is an
    open mouth with lines of speech rising above it, and the lower right is a standing blade.
  layout: >-
    Across the upper part, a wide rectangular fishing net with pale mesh cords spans over both lower
    parts. Below on the left sits an open mouth with pale lips and horizontal bars of spoken sound
    rising above it. Below on the right stands an upright pale steel knife blade facing left toward
    the words. All three components stay separate from one another.
  exact:
    - The top net forms a wide closed rectangle tilted slightly up to the right, divided inside by a pair of short vertical strokes that touch both its top and bottom bars.
    - The top net does not touch the lower components; a small gap separates its bottom bar from the dot of the speech component below.
    - In the lower-left speech component, the top dot touches the middle of the long line across below it.
    - The upper line across in the speech component is long and reaches far out to the left, while the pair of lines across below it are less than half as long and stand free.
    - The mouth at the bottom left is a closed box whose top-and-right stroke and bottom line both touch the left vertical and meet at the bottom right.
    - In the lower-right knife component, both vertical strokes stand completely free; the left vertical is less than half as long as the right vertical and ends plain, while the long right vertical ends at the bottom in a sharp hook to the left.
