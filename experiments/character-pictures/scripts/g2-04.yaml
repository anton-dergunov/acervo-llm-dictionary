麥:
  checked: argon
  object: a wheat plant 來 with grain ears hanging on both sides of its stalk, and its crossing lower roots 夂 growing down beneath it
  history: >-
    來 originally drew a wheat plant with drooping grain ears, leaves and roots, and was later
    borrowed to mean "to come". The bottom component 夂 was added beneath the wheat plant either as a
    downward-pointing foot to distinguish the words or to show the lower growth and roots of the
    wheat.
  layout: >-
    A single ripe wheat plant fills the square from top to bottom. The upper part 來 spreads wide
    across the top two-thirds, with a central stalk, short top leaves, two drooping golden-yellow
    ears of grain on the left and right, and two wide side roots arching out to the left and right.
    Tucked beneath the end of the stalk between the wide side roots, the narrower lower part 夂 forms
    a cluster of pale tan roots reaching down to the bottom left. All colours are pale gold, soft
    ochre and warm tan.
  exact:
    - The upper component spans the full width of the box, while the lower component sits narrower in the bottom half, tucked between the two wide upper sweeps.
    - The central stalk crosses the top line across and stops near the centre of the box in a plain point with no hook, leaving a small gap above the lower component.
    - Flanking the upper stalk, both short ear sweeps curve down to the left without touching the top line across, the stalk, or the wide lower sweeps; each has a short stroke starting at its middle and slanting down to the right.
    - The wide upper left sweep starts on the middle of the stalk and the wide upper right sweep starts near the bottom end of the stalk; their starts do not touch each other.
    - In the lower component, the sweep down to the left starts below the stalk without touching it and is clearly shorter than the wide upper left sweep, a little over half as long.
    - The lower turning stroke starts at the middle of that lower left sweep, runs across to the right, and turns sharply to sweep all the way to the bottom left.
    - The final stroke is a short stroke slanting down to the right that crosses the middle of the lower turning sweep and stops well short of the bottom right, about half as long as the upper right sweep's main leg.
  strokes:
    - where: a short line across the upper middle, rising slightly to the right
      part: the wheat plant's short top leaves
    - where: a straight line down the upper middle from the top to the centre, crossing the top line across
      part: the wheat stalk
    - where: a short sweep on the upper left of the stalk, running down and curving to the lower left
      part: the left ear of grain, hanging down
    - where: a small dot-like stroke slanting down to the right, starting at the middle of the left ear's sweep
      part: a single grain on the left ear
    - where: a short sweep on the upper right of the stalk, about as long as the left ear's sweep, running down and curving to the lower left
      part: the right ear of grain, hanging down
    - where: a short stroke slanting down to the right, starting at the middle of the right ear's sweep
      part: a single grain on the right ear
    - where: a long sweep from the middle of the stalk down and out to the lower left
      part: the upper root spreading wide to the left
    - where: a long falling stroke from near the bottom of the stalk down and out to the right, turning across at its foot
      part: the upper root spreading wide to the right
    - where: a sweep down to the left below the end of the stalk, clearly shorter than the wide upper left sweep and a little over half as long
      part: the left branch of the lower root cluster
    - where: a stroke starting at the middle of the lower left sweep, running across to the right and turning sharply to sweep down to the bottom left
      part: the main taproot turning and reaching deep to the bottom left
    - where: a short stroke slanting down to the right across the middle of the lower turning sweep, about half as long as the upper right sweep
      part: a short rootlet crossing the main taproot

