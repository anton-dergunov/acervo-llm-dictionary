丹:
  checked: argon
  object: a timber-framed mine shaft with a wide horizontal crossbeam and a lump of red cinnabar ore inside its upper chamber
  history: >-
    The oldest forms drew the frame of a well or mine shaft with a mark in the middle for the
    cinnabar ore inside it. In the modern form, the tall frame and wide crossbeam form the shaft,
    and the dot in the upper chamber is the pellet of cinnabar.
  layout: >-
    A tall timber mine frame stands upright in the centre, with a wide wooden crossbeam running all
    the way across its middle and extending past both side timbers. Inside the upper space of the
    frame, above the crossbeam, sits a rounded lump of soft vermilion-red cinnabar ore on the
    central dot. The timbers are pale warm wood and the shaft opening inside the frame is shaded a
    very pale stone grey.
  exact:
    - The left side stroke goes down and curves out to the bottom left.
    - The top-and-right stroke touches the top of the left stroke, runs a short way across—about a third as wide as the long middle line—and turns straight down the right side, ending in a hook to the left.
    - The short dot sits inside the upper chamber above the long line across and stands completely free, touching neither the frame nor the line across.
    - The long line across runs through the middle and crosses both the left and right sides of the frame, extending well past them on both the left and the right.
  strokes:
    - where: a long line down the left of the centre, curving out to the bottom left
      part: the left timber of the mine shaft
    - where: a line from the top of the left stroke across to the right, turning straight down the right side and ending in a hook to the left at the bottom
      part: the top cap and right timber of the mine shaft
    - where: a short dot slanting down to the right inside the upper space of the frame
      part: the lump of red cinnabar ore inside the mine
    - where: a long line across the middle from the far left to the far right, crossing both side strokes
      part: the wide horizontal crossbeam bracing the mine shaft

