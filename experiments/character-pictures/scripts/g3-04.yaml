蔓:
  checked: argon
  dropped: Because the origin analyses 曼 solely as a phonetic component, depicting it as part of a scene would teach a false etymology.

叠:
  checked: argon
  object: three folded bundles of cloth stacked in a pyramid at the top, above a wide cover over a tall chest of drawers resting on a flat base
  history: >-
    The traditional form combined three suns or three fields at the top with a covered stand below
    to depict a stack or pile. The simplified form replaces the top stack with a pyramid of three
    crossed shapes above a wide cover and a tall stand with shelves.
  layout: >-
    The upper half holds three small folded bundles of cloth arranged in a triangle, one at the top
    centre and two side by side below it, with each bundle's crossed folds following its two
    strokes. Below them, a wide cloth cover drapes across the middle, hanging down on the left and
    hooking in on the right. Beneath the cover stands a tall narrow chest of drawers with two inner
    drawer seams, resting on a wide flat base plank at the bottom. Colours stay soft and pale, with
    pale blue and cream for the folded clothes and warm pale tan for the wooden chest and base.
  exact:
    - The three small crossed shapes in the upper half sit in a triangle—one at the top centre and two side by side below it—and do not touch one another or the cover below.
    - In each of the three upper shapes, the first stroke runs across to the right and turns sharply down to the left as a sweep, and the second stroke slants down to the right across the sweep.
    - The wide middle cover starts with a short line slanting down to the left, and its long top line runs all the way across to the right and ends in a sharp hook down to the left; it does not touch the chest beneath it.
    - In the tall narrow frame below the cover, the top-and-right stroke starts at the top of the left vertical, runs across, and turns straight down to rest on the bottom line.
    - The two short inner lines across inside the tall frame both touch the left vertical and stop short of the right vertical.
    - The bottom line across is as wide as the middle cover and extends well past both sides of the tall frame, whose two verticals end on it without crossing through.
  strokes:
    - where: a stroke at the top centre running across to the right, then turning sharply down to sweep to the left
      part: the upper fold of the top bundle of cloth
    - where: a short stroke at the top centre slanting down to the right, crossing the top sweep
      part: the lower cross-fold of the top bundle of cloth
    - where: a stroke on the upper left below the top bundle, rising slightly across to the right and turning sharply down to sweep to the left
      part: the upper fold of the lower-left bundle of cloth
    - where: a short stroke on the upper left slanting down to the right, crossing the lower-left sweep
      part: the lower cross-fold of the lower-left bundle of cloth
    - where: a stroke on the upper right beside the lower-left bundle, running across to the right and turning sharply down to sweep to the left
      part: the upper fold of the lower-right bundle of cloth
    - where: a short stroke on the upper right slanting down to the right, crossing the lower-right sweep
      part: the lower cross-fold of the lower-right bundle of cloth
    - where: a short line on the middle left, slanting down to the left
      part: the left hanging flap of the wide cover
    - where: a long line from the top of the left flap across the middle to the right, ending in a hook down to the left
      part: the top edge and right tucked corner of the wide cover
    - where: a straight vertical line down the left side of the lower centre
      part: the left side of the tall chest of drawers
    - where: a stroke from the top of the left vertical running across to the right, then turning straight down to the bottom line
      part: the top rim and right side of the tall chest of drawers
    - where: a short line across the upper middle of the tall chest, rising slightly to the right
      part: the upper drawer seam
    - where: a short line across the lower middle of the tall chest, rising slightly to the right
      part: the lower drawer seam
    - where: a long line across the bottom from left to right
      part: the wide flat base plank under the chest

疊:
  checked: argon
  object: three square bundles of folded clothes stacked in a pyramid at the top, above a wide cover draped over a tiered chest of drawers on a flat base
  history: >-
    Originally written with three suns or bright objects on top of a sacrificial stand to mean a
    pile or layer; according to the Shuowen Jiezi, the Xin dynasty replaced the top with three
    square field shapes, yielding three square bundles stacked atop a covered stand or chest of
    drawers.
  layout: >-
    The upper half holds a pyramid of three square cloth bundles—one centred at the top and two side
    by side below it—painted in soft pale blues and creams, each tied or creased with a cross
    inside. Across the middle runs a wide pale linen cover with short hanging flaps at both ends.
    Beneath the cover sits a tall rectangular wooden chest in pale warm tan with two horizontal
    drawer dividers inside, resting on a wide flat base plank at the bottom.
  exact:
    - The three square bundles in the upper half do not touch one another, and none of them touches the wide cover below.
    - The lower-right square bundle sits slightly higher than the lower-left square bundle.
    - Inside each of the three square bundles, the short vertical stroke touches the top and bottom edges and crosses the inner horizontal stroke, while the inner horizontal stroke stops short of both the left and right outer walls.
    - Below the bundles, the wide cover starts with a short stroke slanting down to the left on the far left, touched at its top by a very long horizontal stroke that crosses the whole width and ends in a sharp hook down to the left on the far right.
    - The tall rectangular chest under the cover does not touch the cover above it; both its left vertical post and its right vertical post stand directly on the middle of the long bottom base line.
    - The two inner horizontal lines of the chest both touch the left vertical post and stop clearly short of the right vertical post.
    - The bottom base line is nearly as wide as the cover above, extending far past both sides of the chest.
  strokes:
    - where: a short line slanting slightly down to the right in the upper centre-left
      part: the left side of the top folded bundle
    - where: a line across the top centre, turning sharply down on the right
      part: the top and right sides of the top folded bundle
    - where: a short line across the middle of the top square, rising slightly to the right
      part: the horizontal fold inside the top bundle
    - where: a short line down the middle of the top square
      part: the vertical fold inside the top bundle
    - where: a line across the bottom of the top square, rising slightly to the right
      part: the bottom edge of the top folded bundle
    - where: a short line slanting slightly down to the right on the middle left
      part: the left side of the lower-left folded bundle
    - where: a line across the top of the lower-left square, turning sharply down on the right
      part: the top and right sides of the lower-left folded bundle
    - where: a short line across the middle of the lower-left square, rising slightly to the right
      part: the horizontal fold inside the lower-left bundle
    - where: a short line down the middle of the lower-left square
      part: the vertical fold inside the lower-left bundle
    - where: a short line across the bottom of the lower-left square, rising to the right
      part: the bottom edge of the lower-left folded bundle
    - where: a short line slanting slightly down to the right just right of the centre
      part: the left side of the lower-right folded bundle
    - where: a line across the top of the lower-right square, turning sharply down on the right
