    An ideogrammic compound combining food in a covered vessel on the left (飠, the side form of 食)
    with a worm or insect on the right (虫): an insect eating away at food, and by extension anything
    slowly nibbled away or eclipsed.
  layout: >-
    The covered food dish on its stand fills the left half in pale warm clay and cream tones. The
    upright insect or caterpillar fills the right half in pale soft green, facing left toward the
    food dish as it nibbles. The two halves stand close side by side without touching.
  exact:
    - The food vessel on the left and the insect on the right do not touch.
    - At the top left, a short stroke slanting down to the right starts near the top of the long left sweep and is much shorter than the sweep.
    - Just below the lid on the left, a small dot slanting down to the right stands completely free of every other stroke.
    - In the vessel on the left, the long left vertical starts on the middle of the upper left sweep, runs straight down, and ends in a long hook rising up to the right that touches the middle of a short downward-right stroke at the lower right.
    - Inside the vessel, the upper short rising stroke touches the left vertical and stops short of the right wall, while the lower short rising stroke closes the bowl by meeting the bottom end of the right wall.
    - In the right half, the insect's middle box is closed at the bottom by a line across that meets both the left vertical and the right side.
    - A long vertical in the right half starts high above the box, crosses straight through the middle of the box's top and bottom lines, and ends on the middle of the long rising stroke at the bottom, whose right end touches the middle of the final short downward-right stroke.
  strokes:
    - where: a sweep in the upper left from near the top down and out to the middle left
      part: the left slope of the food vessel's lid
    - where: a short stroke from the top of the left sweep, slanting down to the right
      part: the right slope of the food vessel's lid
    - where: a small free-standing dot below the lid in the upper left, slanting down to the right
      part: a morsel of food rising in steam under the lid
    - where: a stroke in the middle left running across to the right and turning down
      part: the food vessel's rim and its right wall
    - where: a short stroke inside the vessel on the left, rising slightly to the right
      part: an upper layer of food inside the vessel
    - where: a second short stroke lower inside the vessel on the left, rising slightly to the right
