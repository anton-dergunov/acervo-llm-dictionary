钉:
  checked: argon
  object: a cast-iron bell on the left for metal, beside a large metal nail with a flat head and long shaft on the right
  history: >-
    The character adds the metal sign 金, simplified on the left to 钅, to 丁, which originally drew a
    nail seen from the side, after 丁 came to be used for other meanings.
  layout: >-
    On the left half sits a pale grey-bronze cast-iron bell for the metal radical, with a sloped
    left shoulder, horizontal bands across its body, and an upturned lower lip. On the right half
    stands a large pale-grey iron nail seen from the side, with a wide flat head across the top and
    a long vertical shaft pointing down. The bell and the nail stand side by side without touching.
  exact:
    - The left part and the right part do not touch each other.
    - On the left, the top-left sweep runs from near the top down to the middle left, and the short top horizontal starts from the middle of this sweep and rises slightly to the right.
    - The middle horizontal on the left sits below the top horizontal with a small gap between it and the left sweep, while the lower horizontal beneath it is wider, about three quarters as long as the nail head on the right.
    - The vertical stroke on the left starts at the middle of the middle horizontal, crosses the lower horizontal, and turns sharply up to the right at the bottom.
    - On the right, the wide horizontal line across the upper right is the longest horizontal stroke in the character.
    - The long vertical shaft on the right starts from the middle of the wide top line and runs straight down to the bottom, ending in a hook up to the left.
  strokes:
    - where: a sweep from the top left down and out to the middle left
      part: the sloped left shoulder of the metal bell
    - where: a short line across the upper left, starting from the middle of the left sweep and rising slightly to the right
      part: the top rim of the metal bell
    - where: a short line across the middle of the left half, rising slightly to the right
      part: the upper band across the bell
    - where: a wider line across the lower middle of the left half, rising slightly to the right
      part: the lower band across the bell
    - where: a line down the centre of the left half from the middle band, crossing the lower band and turning sharply up to the right at the bottom
      part: the central ridge of the bell and its upturned bottom lip
    - where: a wide line across the upper part of the right half, rising slightly to the right
      part: the flat head of the nail
    - where: a long line down the middle of the right half from the centre of the top line, ending at the bottom in a hook up to the left
      part: the nail's vertical shaft and bent point

禿:
  checked: argon
  object: a bald person with a single stalk of grain on top of the head for sparse hair
  history: >-
    Originally an ideogrammic compound of hair (毛) above a person (儿); the top part later shifted
    into a stalk of grain (禾), showing a person with only a few sparse strands of hair like a single
    stalk on a bare head.
  layout: >-
    The top half is a single pale golden stalk of grain (禾) with a drooping ear at the very top,
    spreading leaves across the upper middle, a vertical stem, and two lower leaves draping left and
    right atop the head. Below it in the bottom half, a small bald person (儿) with a smooth bare
    head, a friendly face with eyes, a nose and a mouth, and simple pale clothes stands on two legs
    formed by the two bottom strokes.
  exact:
    - The top part is a stalk of grain and the bottom part is two legs, with a clear gap separating the top and bottom parts.
    - At the top, the vertical stem starts from the middle of the top slanting sweep, crosses the horizontal line, and ends in a plain point at the centre with no hook.
    - The upper left sweep starts at the crossing of the horizontal line and the vertical stem, while the upper right falling stroke starts on the vertical stem just below the horizontal line.
    - The two bottom leg strokes stand completely free of each other and of the grain stalk above.
    - The bottom right stroke runs down, makes a broad turn to the right along the bottom, and ends in a tall upward hook.
  strokes:
    - where: a short slanting sweep across the very top, running down from right to left
      part: the heavy ear of grain at the top of the stalk, drooping over to the left
    - where: a line across the upper part, rising slightly to the right
      part: the leaves of the grain stalk, spreading out to both sides
    - where: a straight vertical line down the upper middle, from the middle of the top sweep to the centre
      part: the upright stem of the grain stalk sitting on top of the bald head
    - where: a sweep from the crossing of the upper stem down and out to the middle left
      part: the left lower leaf of the stalk, draping down over the left side of the head
    - where: a falling stroke from the middle of the upper stem down and out to the middle right
      part: the right lower leaf of the stalk, draping down over the right side of the head
    - where: a sweep in the lower left half, running from below the centre down and out to the bottom left
      part: the bald person's left leg
    - where: a long stroke in the lower right half, running down from below the centre, turning across to the bottom right, and ending in an upward hook
      part: the bald person's right leg and upturned foot

焚:
  checked: argon
  object: a fire burning beneath a grove of two trees
  history: >-
    An ideogrammic compound placing a grove of two trees 林 above a fire 火, depicting setting fire to
    woods.
  layout: >-
    In the upper half, two trees stand side by side with pale leafy crowns behind their upper
    branches and trunks. In the lower half directly beneath the trees, a wide fire leaps upward,
    filled with pale warm orange and yellow tongues of flame between the strokes, with two sparks
    flying off on the left and right.
  exact:
    - The grove of two trees occupies the upper half and the wide fire occupies the lower half, with a small gap keeping the trees and the fire separate.
    - Both tree trunks are straight vertical lines ending in a plain point at the bottom, with no hook.
    - The two trees do not touch each other, and the right tree sits slightly higher than the left tree.
    - In the left tree, the trunk crosses the horizontal branch, the left sweep starts at their crossing, and the short right dot stands just free of the trunk.
    - In the right tree, the trunk crosses the horizontal branch, the left sweep starts at their crossing and is about three quarters as long as the left tree's left sweep, and the right stroke is a short slanting stroke starting on the trunk just below the crossing.
    - In the fire at the bottom, the left dot and the right short sweep stand free on either side of the central flame, while the long right-falling stroke starts from the middle of the long left-falling sweep.
  strokes:
    - where: a line across the upper left, rising slightly to the right
      part: the left tree's branches
    - where: a straight line down the middle of the upper left
      part: the left tree's trunk
    - where: a sweep from the crossing of the left trunk down to the middle left
      part: the left tree's left root
    - where: a short dot beside the left trunk, slanting down to the right
      part: the left tree's short right root
    - where: a line across the upper right, rising slightly to the right
      part: the right tree's branches
    - where: a straight line down the middle of the upper right
      part: the right tree's trunk
    - where: a sweep from the crossing of the right trunk down to the left
      part: the right tree's left root
    - where: a short stroke from the right trunk slanting down to the middle right
      part: the right tree's short right root
    - where: a short dot in the lower left, slanting down to the right
      part: a small spark or flame leaping off to the left
    - where: a short stroke in the lower right, slanting down to the left
      part: a small spark or flame leaping off to the right
    - where: a long sweep from the centre down and out to the bottom left
      part: the left edge of the big central flame, from its tip down to its base
    - where: a long falling stroke from the middle of the central sweep down and out to the bottom right
