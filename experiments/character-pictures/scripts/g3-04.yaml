  history: >-
    An ideogrammic compound combining 戌, a broad-bladed battle-axe or halberd, with 口, a mouth or
    mark placed under the blade; it is also used as the simplified form of 鹹 (salty).
  layout: >-
    A tall halberd-like battle-axe spans the whole frame: its long shaft slants from the top centre
    down to the bottom right, crossed near the top by a horizontal cross-bar from whose left end a
    broad pale bronze axe blade curves down to the bottom left. Tucked inside the space between the
    left blade and the shaft sit a short horizontal bar and an open mouth with pale pink lips below
    it. A lower blade sweeps across the lower shaft on the right, and a small pale tassel hangs at
    the top right.
  exact:
    - The upper line across touches the top of the left sweep at its left end and crosses the long slanting shaft near its middle.
    - The inner horizontal line sits below the upper line across, is a little under half as long, and stands completely free, touching neither the left sweep nor the shaft.
    - The small mouth box sits below the inner horizontal line and does not touch the left sweep or the shaft.
    - In the mouth, the left vertical meets the top-and-right stroke at the top left, and the bottom line across closes the box at the bottom.
    - The long shaft runs from the top centre down to the bottom right and ends in a sharp upward hook.
    - The right-hand sweep crosses the lower part of the long shaft from upper right to lower left.
    - The short dot in the top right stands free above the upper line across and to the right of the shaft's top.
  strokes:
    - where: a line across from the middle left to the upper right, rising slightly
      part: the upper cross-bar of the battle-axe head
    - where: a long sweep from the left end of the upper cross-bar down to the bottom left
      part: the outer curved edge of the broad left axe blade
    - where: a short line across in the centre, rising slightly to the right
      part: the inner horizontal bar on the axe blade above the mouth
    - where: a short line down in the lower left inside the frame, slanting slightly right
      part: the left corner of the open mouth
    - where: a short line across below the inner bar, turning down on the right
      part: the upper lip and right corner of the open mouth
    - where: a short line across at the bottom of the mouth, rising slightly to the right
      part: the lower lip closing the bottom of the mouth
    - where: a long slanting line from the top centre down to the bottom right, ending in an upward hook
      part: the long main shaft of the battle-axe and its hooked butt
    - where: a sweep from the middle right down and left across the lower shaft
      part: the lower blade sweeping across the shaft
    - where: a short falling dot in the top right, slanting down to the right
      part: a small tassel knot near the top of the shaft

