# Full run, group g3, batch 04. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

侯:
  checked: argon
  object: a person standing on the left beside an overhanging archery target and an upright arrow on the right
  history: >-
    The oldest forms drew a hanging target cloth with an arrow aimed at it; shooting at the target
    was how lords and marquises were tested. Later forms added a standing person on the left.
  layout: >-
    On the left, a standing person in profile faces right toward the target, with a friendly face
    showing eyes, a nose and a mouth, and simple pale robes. On the upper right hangs a pale cloth
    archery target on a wooden frame. Below the target on the lower right stands a large upright
    arrow pointing up toward the target, with pale feathers at its base.
  exact:
    - The person on the left and the target and arrow on the right do not touch.
    - In the left part, the vertical stroke starts at the middle of the upper-left sweep and runs straight down to a plain point.
    - At the top of the right part, the top stroke runs across, turns sharply down and left, and ends resting on the middle of the long upper line across.
    - The upper line across is about as long as the lower line across.
    - A short sweep starts from the middle of the upper line across and goes down to the left.
    - The middle line across starts at the middle of that short sweep and is a little under half as long as the lower line across.
    - The long central sweep starts at the middle of the middle line across, crosses the middle of the lower line across, and curves out to the bottom left.
    - The final falling stroke starts where the central sweep crosses the lower line across and sweeps down to the bottom right.
  strokes:
    - where: a sweep in the upper left from near the top down and out to the middle left
      part: the person's shoulder and back
    - where: a straight line down the left side from the middle of the upper sweep to the bottom left
      part: the person's standing body and legs
    - where: a short line across the top of the right half, turning sharply down and slightly left
      part: the top rim and right edge of the target canopy
    - where: a long line across the upper part of the right half, rising slightly to the right
      part: the lower crossbar of the target frame
    - where: a short sweep from the middle of the upper crossbar down to the left
      part: the left barb of the arrowhead
    - where: a short line across the middle of the right half, starting from the middle of the short sweep
      part: the base of the arrowhead
    - where: a long line across the lower part of the right half
      part: the wide cross-guard across the arrow's shaft
    - where: a long sweep starting from the middle of the short middle line across, passing through the lower line across and curving down to the bottom left
      part: the arrow's shaft and its left tail feather
    - where: a falling stroke starting from the crossing of the shaft and the lower line across, sweeping down to the bottom right
      part: the arrow's right tail feather

蚀:
  checked: argon
  object: an insect or worm on the right nibbling at a covered dish of food on the left
  history: >-
    An ideogrammic compound combining food (食, simplified on the left to 饣) with an insect or worm
    (虫) on the right: a creature nibbling away at a dish of food, and by extension anything that
    eats away or erodes.
  layout: >-
    On the left sits a covered food vessel in pale warm ceramic tones, topped by a peaked lid. On
    the right rises an upright worm-like insect in pale green and soft ochre, facing left toward the
    food as if nibbling at the dish, with a broad rectangular head in the middle, an upright body
    running through it, and a tail curving up to the right at the base. The two halves stand close
    side by side without touching.
  exact:
    - The left part (the food dish) and the right part (the insect) do not touch each other.
    - On the left, the short hooked stroke starts from the middle of the upper left sweep, turns sharply at its right corner, and hooks back down to the left.
    - The lower left stroke goes straight down and turns sharply up to the right at the bottom; it stands completely free, touching neither the lid strokes above it nor the insect on the right.
    - On the right, the short left vertical, the top-and-right turning stroke, and the bottom line across meet at their corners to form a closed rectangular head in the middle.
    - The long vertical of the insect starts high above the rectangular head, runs straight down through the middle of the top and bottom lines of the head, and ends touching the middle of the rising bottom stroke.
    - The rising stroke at the bottom of the right half is wider than the rectangular head above it, and its right end touches the middle of the final short falling stroke.
  strokes:
    - where: a sweep from the top of the left half down and out to the middle left
      part: the left slope of the dish's lid
    - where: a short line from the middle of the left sweep across to the right, turning sharply down to the left
      part: the right slope and overhanging rim of the dish's lid
    - where: a vertical line in the lower left half, going straight down and turning sharply up to the right at the bottom
      part: the side and curving base of the food vessel
    - where: a short line in the middle of the square, slanting slightly down to the right
      part: the left side of the insect's head
    - where: a line from the top of that short stroke across to the right, turning down to the left
      part: the top and right side of the insect's head
    - where: a line across the middle of the right half, rising slightly to the right to close the box
      part: the underside of the insect's head
    - where: a long straight line from the top of the right half down through the middle of the box to the lower right half
      part: the insect's tall upper crest and upright body
    - where: a long line across the bottom of the right half, rising slightly to the right
      part: the insect's lower body, curving to the right
    - where: a short falling stroke at the bottom right, slanting down to the right across the end of the rising stroke
      part: the tip of the insect's tail

燕:
  checked: argon
  object: a swallow in flight seen from above, with its head and open beak at the top, its plump body in the middle, its wings spread to left and right, and its fanned tail feathers at the bottom
  history: >-
    A pictogram of a swallow in flight seen from above. The top part (廿) drew its head and open
    beak, the middle box (口) its body, the two side parts (北) its outspread wings, and the row of
    dots at the bottom (灬) its forked tail.
  layout: >-
    A single swallow flies upward, filling the square from its head at the top to its tail at the
    bottom. The upper strokes form its head and open beak, with two small eyes beside them. The
    small box in the centre is its plump body, flanked on the left and right by its two spread
    wings. The row of short strokes across the bottom forms the feathers of its fanned tail. Soft
    pale blue-grey plumage and a pale rust-tinted throat sit behind the strokes.
  exact:
    - In the top part, a long horizontal line is crossed by two vertical lines whose bottom ends are joined by a short horizontal line, forming a small closed box below the long line.
    - In the middle centre sits a small closed box that does not touch the top part above it or the wing strokes to its left and right.
    - On the middle left, a vertical line stands to the left of the central box, and two short strokes on its left—an upper horizontal line and a lower rising stroke—both touch the middle of that vertical line.
    - On the middle right, a long stroke runs down beside the central box, turns across to the right at the bottom, and ends in an upward hook, while a short sweep down to the left touches the middle of its vertical leg.
    - Across the bottom sit four separate short strokes in a row that touch nothing else, with the leftmost slanting down to the left and the other three slanting down to the right, the rightmost being the longest of the four.
  strokes:
    - where: a long line across the upper part, rising slightly to the right
      part: the wide crest and brow across the swallow's head
    - where: a vertical line in the upper left-centre, crossing the long upper line
      part: the left side of the swallow's open beak and head
    - where: a vertical line in the upper right-centre, starting slightly higher and crossing the long upper line
      part: the right side of the swallow's open beak and head
    - where: a short line across the centre below the long upper line, joining the bottoms of the two upper verticals
      part: the base of the swallow's head and throat
    - where: a short vertical line down the left side of the central box
      part: the left side of the swallow's plump body
    - where: a line across the top of the central box, turning down on the right side
      part: the top and right side of the swallow's body
    - where: a short line across the bottom of the central box, closing it
      part: the lower edge of the swallow's body
    - where: a vertical line in the middle left, to the left of the central box
      part: the inner frame of the left wing alongside the body
    - where: a short line across the middle left, touching the middle of the left vertical
      part: the upper feathers of the outspread left wing
    - where: a short stroke in the middle left rising to the right to touch the left vertical below the upper wing stroke
      part: the lower feathers of the outspread left wing
    - where: a short sweep in the middle right from upper right down to the left, touching the right wing's vertical leg
      part: the upper feathers of the outspread right wing
    - where: a long stroke to the right of the central box running down, turning across to the right, and ending in an upward hook
      part: the inner frame and outer tip of the outspread right wing
    - where: a short stroke at the bottom left, slanting down to the left
      part: the outer left feather of the swallow's tail
    - where: a short dot at the bottom left-centre, slanting down to the right
      part: the inner left feather of the swallow's tail
    - where: a short dot at the bottom right-centre, slanting down to the right
      part: the inner right feather of the swallow's tail
    - where: a slightly longer stroke at the bottom right, slanting down to the right
      part: the outer right feather of the swallow's tail

