鈎:
  checked: argon
  object: a cast-iron bell on the left standing for metal, beside a curved metal hook with an inner barb on the right
  history: >-
    A variant of 鉤 made of metal (釒) on the left and a hook (勾) on the right, which also gives the
    sound. The left part comes from the ancient form of a cast bell used for metal words, while the
    right part draws the curved shaft and inner catch of a hook.
  layout: >-
    The picture is split into two halves of similar width that sit side by side without touching. On
    the left hangs a pale grey-blue cast-iron bell, tilted slightly at its base to follow the rising
    bottom stroke, with two horizontal bands, a central clapper, and two studs on its skirt. On the
    right hangs a larger pale steel-grey metal hook that starts a little higher and reaches a little
    lower than the bell, its long shaft curving down the right side to an upturned point at the
    bottom, with a bent inner barb tucked inside its curve.
  exact:
    - The left part (the bell) and the right part (the hook) do not touch; the right part starts a little higher and reaches a little lower than the left.
    - On the left, the short right-shoulder stroke starts near the top of the long left sweep; the two bands across the middle do not touch the left sweep, and the upper band is slightly shorter than the lower band.
    - On the left, the vertical line starts at the middle of the upper band, crosses the middle of the lower band, and ends on the middle of the bottom stroke, which slants up to the right.
    - On the left, the two small dots on either side of the vertical stand completely free of the bands, the vertical, and the bottom rising stroke.
    - On the right, the long outer stroke starts at the middle of the upper sweep, runs across to the right, turns down the right side, and ends at the bottom in a sharp hook pointing up to the left.
    - Inside the curve of the right hook, a stroke sweeps down to the left and turns sharply across to rise slightly to the right, with a short stroke slanting down to the right across its end; this inner part does not touch the outer hook stroke.
  strokes:
    - where: a long sweep from the top of the left half down and out to the middle left
      part: the bell's left shoulder
    - where: a short stroke from near the top of the left sweep, slanting down to the right
      part: the bell's right shoulder
    - where: a short line across the middle of the left half, rising slightly to the right, about three quarters as long as the top bar of the hook on the right
      part: the bell's upper band
    - where: a line across the left half below the upper band, slightly longer than the upper band and rising slightly to the right
      part: the bell's lower band
    - where: a vertical line down the middle of the left half, from the middle of the upper band through the lower band to the bottom rising stroke
      part: the bell's clapper
    - where: a small dot in the lower left, slanting down to the right, standing free to the left of the vertical line
      part: a stud on the bell's left skirt
    - where: a small dot in the lower part of the left half, slanting down to the left, standing free to the right of the vertical line
      part: a stud on the bell's right skirt
    - where: a rising stroke at the bottom of the left half, slanting up from the bottom left to the right
      part: the bell's rim
    - where: a sweep from the top of the right half down to the left
      part: the upper neck of the hook
    - where: a long stroke starting at the middle of the right half's upper sweep, running across to the right, turning down along the right side, and ending at the bottom in a sharp hook up to the left
      part: the arched back, long shaft and upturned point of the hook
    - where: a stroke inside the curve of the right half, sweeping down to the left and turning sharply across, rising slightly to the right
      part: the bent arm of the inner barb inside the hook
    - where: a short stroke inside the curve of the right half, slanting down to the right across the end of the inner barb's arm
      part: the point of the inner barb

吕:
  checked: argon
  object: two cast blocks of metal, ingots, stacked one above the other with a gap between them
  history: >-
    The oldest forms drew two separate blocks of cast metal, one above the other. Seal script added
    a short line linking the two blocks, which survives in the variant form 呂, while 吕 keeps the
    original disconnected pair.
  layout: >-
    Two trapezoidal metal ingots float one above the other in the middle of the square, separated by
    a clear gap. The upper block is smaller and narrower; the lower block is wider and slightly
    taller. Both blocks have a soft pale bronze or warm grey-gold sheen with subtle bevelled faces
    inside the strokes.
  exact:
    - The upper box and the lower box are completely separate and do not touch each other.
    - The upper box is smaller and narrower than the lower box; its top edge is about three quarters as long as the lower box's top edge.
    - In each box, the left stroke slants down and slightly to the right, and the top and right sides are one stroke that runs across and turns sharply down and inward to the left.
    - In each box, the bottom line connects the lower end of the left stroke to the lower end of the right turn, closing the shape.
  strokes:
    - where: a short line on the left of the upper half, slanting down and slightly to the right
      part: the left side of the upper metal block
    - where: a line across the top of the upper half, about three quarters as long as the lower box's top, turning down and inward at the right
      part: the top edge and right side of the upper metal block
    - where: a short line across the bottom of the upper box, rising slightly to the right between the left and right sides
      part: the bottom edge of the upper metal block
    - where: a line on the left of the lower half, slanting down and slightly to the right
      part: the left side of the lower metal block
    - where: a long line across the top of the lower half, turning sharply down and inward at the right
      part: the top edge and right side of the lower metal block
    - where: a line across the bottom of the lower half, joining the bottom of the left side to the bottom of the right side
      part: the bottom edge of the lower metal block

