鉤:
  checked: argon
  object: a cast-iron metal bell on the left beside a large curved metal hook on the right with a small square opening tucked inside its bend
  history: >-
    An ideographic compound combining metal (釒, the side form of 金, originally a cast bronze bell)
    on the left with a curved hook (句) on the right.
  layout: >-
    The left half holds a pale grey-blue cast-iron bell with horizontal bands, two small studs on
    its skirt, and a rising rim at the base. The right half holds a large pale steel hook curving
    out to the far right and down to a sharp upturned barb at the bottom, with a small square
    opening nested inside the hollow of its curve.
  exact:
    - The left part and the right part stand side by side and do not touch; the hook on the right reaches lower than the bell on the left.
    - In the left part, the short right-shoulder stroke starts near the top of the long left sweep, and the upper band starts at the middle of that sweep; both bands rise slightly to the right, with the lower band a little longer than the upper.
    - The straight vertical in the left part starts at the middle of the upper band, crosses the middle of the lower band, and ends cleanly on the middle of the rising bottom rim, with no hook.
    - The small dot on the lower left and the short leftwards sweep on the lower right of the bell both stand completely free of the surrounding strokes.
    - In the right part, the long outer hook stroke starts at the middle of the upper sweep, runs across to the far right, turns down to the bottom, and ends in a sharp hook up to the left.
    - The small square mouth sits inside the bend of the hook without touching the outer hook strokes; its bottom line meets the bottom of its left vertical and extends slightly past the bottom of its right leg.
  strokes:
    - where: a long sweep in the upper left half, from the top down to the middle left
      part: the metal bell's left shoulder
    - where: a short stroke near the top of the left half, slanting down to the right from near the top of the left sweep
      part: the metal bell's right shoulder
    - where: a short line across the middle of the left half, touching the middle of the left sweep and rising to the right
      part: the metal bell's upper band
    - where: a slightly longer line across the left half below the upper band, rising slightly to the right
      part: the metal bell's lower band
    - where: a straight vertical line down the middle of the left half, from the upper band through the lower band to the bottom rim
      part: the metal bell's central clapper
    - where: a small dot at the lower left, slanting down to the right
      part: a stud on the metal bell's left skirt
    - where: a short sweep in the lower right of the left half, slanting down to the left
      part: a stud on the metal bell's right skirt
    - where: a long stroke across the bottom of the left half, rising to the right
      part: the metal bell's rim
    - where: a sweep in the upper right half, running from the top down to the left
      part: the upper neck of the hook
    - where: a very long stroke starting from the middle of the upper right sweep, running across to the far right, turning straight down to the bottom, and ending in a hook up to the left
      part: the curved shank and upturned barbed point of the hook
    - where: a short vertical line in the middle of the character, inside the bend of the hook
      part: the left side of the square opening inside the hook
    - where: a stroke running across from the top of the short vertical and turning down on the right
      part: the top and right sides of the square opening inside the hook
    - where: a short line across the bottom of the inner square, rising slightly to the right to close it
      part: the bottom edge of the square opening inside the hook

柵:
  checked: argon
  object: a wooden fence of upright stakes bound together on the right, standing beside a tree on the left
  history: >-
    An ideogrammic compound combining a tree or wood (木) on the left with a row of upright wooden
    slats bound together (冊) on the right, depicting a wooden palisade or fence.
  layout: >-
    A narrow tree stands in the left part of the frame with a pale leafy crown behind its upper
    branches, while a wide wooden palisade fence fills the right part. The fence is built from
    upright wooden stakes framed across the top and bound across the middle by a long horizontal
    rail. Pale wood grain and soft green foliage sit behind the strokes.
  exact:
    - The left part (the tree) is narrower and does not touch the wider fence on the right.
    - The tree's trunk is the tallest vertical line and ends in a plain point at the bottom, with no hook; its line across is less than half as long as the fence's middle crossbar.
    - On the tree trunk, the left sweep starts at the crossing with the line across, while the short right dot touches the trunk a little lower down, so the two do not touch each other.
    - In the fence on the right, the leftmost upright starts where the top-and-right stroke begins and curves slightly left as it goes down, about three quarters as tall as the tree trunk.
    - The top-and-right stroke runs across the top of the fence, turns sharply down at the top right as the rightmost post, and ends at the bottom in a hook to the left.
    - The two inner upright stakes are shorter—a little over half as tall as the tree trunk—and their tops stop just short of the top bar without touching it.
    - The long middle line across runs all the way through every upright stroke of the fence, sticking out past both the left and right outer posts.
  strokes:
    - where: a short line across the upper part of the left side, rising slightly to the right
      part: the tree's main branches
    - where: a long straight line down the middle of the left side, from near the top to the bottom, with no hook
      part: the tree's trunk
    - where: a sweep from the crossing on the left trunk down and out to the bottom left
      part: the tree's left root
    - where: a short dot on the right side of the trunk below the crossing, slanting down to the right
      part: the tree's short right root
    - where: a line down the left side of the right part, about three quarters as tall as the trunk and curving slightly left toward the bottom
      part: the leftmost upright stake of the fence
    - where: a line from the top of the leftmost stake across to the right, turning sharply down and ending at the bottom in a hook to the left
      part: the top rail and the rightmost tall post of the fence
    - where: a long line across the middle of the right part, crossing all the upright stakes from left to right
      part: the long horizontal rail binding the fence stakes together
    - where: a shorter vertical line down the left-centre of the fence frame, a little over half as tall as the trunk
      part: an inner upright stake of the fence
    - where: a shorter vertical line down the right-centre of the fence frame, beside the other inner stake
      part: another inner upright stake of the fence

