    added hands (now the two small square shapes) and the clothing component (衣), split between the
    top collar and the flowing lower hem around a crossed chest lattice.
  layout: >-
    A person stands facing the viewer, filling the square from top to bottom. A friendly face with
    eyes, a nose and a mouth sits at the top behind the upper collar line, and the two small square
    shapes below it are the person's raised hands in wide cuffs lifting the robe off the shoulders.
    The grid in the middle forms the crossed woven chest straps and wide waistband of the garment,
    while the strokes at the bottom form the loosened panels and hem of the pale robe parting to the
    left and right. All clothing and skin tones are kept in soft, pale washes.
