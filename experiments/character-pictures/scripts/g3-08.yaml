乂:
  checked: argon
  object: a pair of garden shears for cutting weeds, with two long blades crossing at a central pivot
  history: >-
    The oldest oracle bone and bronze forms drew a tool for cutting weeds, either a sickle-like
    blade or a large pair of crossed shears. The modern character keeps the two crossed strokes of
    the shears.
  layout: >-
    A pair of weeding shears fills the square along the two crossing strokes. Simple pale wooden
    grips wrap the upper ends of the two strokes, a small pale grey pivot sits in the middle where
    they cross, and pale steel blades follow the lower halves as they sweep down and out to their
    points at the bottom left and bottom right.
  exact:
    - The two strokes cross each other near the middle.
    - The sweep from near the top centre to the bottom left starts clearly higher than the stroke from the upper left.
    - The stroke from the upper left runs down to the right and turns more level as it reaches the bottom right.
  strokes:
    - where: a long curved sweep from high near the top centre down and out to the bottom left
      part: one half of the shears, running from its upper grip through the pivot to the tip of the left blade
    - where: a long falling stroke from the upper left down to the right, turning across at the bottom right
      part: the other half of the shears, running from its upper grip through the pivot to the tip of the right blade

