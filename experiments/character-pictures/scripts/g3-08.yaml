繭:
  checked: argon
  object: a hanging oval silk cocoon beneath two mulberry leaf sprouts, split down the middle to show twisted silk thread on the left and a silkworm on the right
  history: >-
    An ideogrammic compound combining silk, a worm, and an abbreviated form of needlework that
    frames the cocoon and its leafy top. It depicts a silkworm enclosed in its cocoon spinning silk
    thread.
  layout: >-
    At the top, two pale green leaf sprouts stand side by side. Below them hangs a large pale cream
    cocoon framed by the wide outer enclosure and divided down the centre by a vertical seam. Inside
    the left half of the cocoon sits a twisted skein of pale golden silk thread with loose strands
    at the bottom; inside the right half curls a pale green silkworm facing up, with its head,
    segmented body, and tail following the strokes.
  exact:
    - At the top, the two leaf sprouts are separated in the middle and do not touch the cocoon top below them.
    - The left top sprout consists of a short vertical stem with a short horizontal line touching the left side of its middle.
    - The right top sprout consists of a short vertical stem slanting down to the left with a short horizontal line touching the right side of its middle.
    - The large lower frame has a long vertical down the left side and a long top-and-right stroke that touches the top of the left vertical, runs across, turns down the right side, and ends in a hook to the left.
    - A long straight vertical line hangs down the centre from the middle of the frame's top bar, ending in a plain point without touching the bottom, dividing the interior in two.
    - Inside the left half, two angled hooked twists of silk sit above a row of three separate small dots at the bottom, without touching the outer frame or the centre line.
    - Inside the right half, a small rectangular mouth box is pierced down its middle by a straight vertical line that starts above the box and ends on a rising lower stroke, with a short dot at the right tip of the rising stroke.
  strokes:
    - where: a short line down in the upper left-centre
      part: the stem of the left mulberry sprout
    - where: a short line across on the upper left, rising slightly to touch the middle of the left sprout's stem
      part: the left leaf blade stretching out to the left
    - where: a short line slanting down to the left in the upper right-centre
      part: the stem of the right mulberry sprout
    - where: a short line across on the upper right, starting from the middle of the right sprout's stem and rising slightly to the right
      part: the right leaf blade stretching out to the right
    - where: a long vertical line down the left side of the lower part
      part: the left outer wall of the cocoon
    - where: a long stroke starting at the top of the left wall, running across the top, turning sharply down the right side, and ending in a hook to the left
      part: the top roof and right outer wall of the cocoon, curving in at the bottom
    - where: a long straight vertical line hanging from the middle of the cocoon's top bar down the centre
      part: the central seam dividing the cocoon into two chambers
    - where: in the upper part of the left chamber, a short stroke slanting down to the left and turning sharply across to the right
      part: the upper loop of the twisted silk skein
    - where: in the middle of the left chamber, a stroke slanting down to the left through the upper loop's end and turning sharply up to the right
      part: the lower loop of the twisted silk skein
    - where: a tiny dot slanting down to the right at the right tip of the lower loop
      part: the knot tying the silk skein
    - where: a short vertical dot near the bottom left of the left chamber
      part: the left hanging tassel of silk thread
    - where: a tiny dot slanting down to the right, beside the left tassel in the left chamber
      part: the middle hanging tassel of silk thread
    - where: a tiny dot slanting down to the right, to the right of the middle tassel in the left chamber
      part: the right hanging tassel of silk thread
    - where: in the middle of the right chamber, a short vertical line on the left of the small box
      part: the left side of the silkworm's middle body ring
    - where: a stroke starting at the top of that short vertical, running across to the right and turning down
      part: the top and right side of the silkworm's middle body ring
    - where: a short line across closing the bottom of the small box in the right chamber
      part: the underside of the silkworm's middle body ring
    - where: a straight vertical line in the right chamber starting above the small box and running down through its centre
      part: the silkworm's upright upper body and spine
    - where: near the bottom of the right chamber, a stroke slanting up to the right beneath the vertical spine
      part: the silkworm's lower tail segment curving up
    - where: a short dot slanting down to the right at the right end of the rising tail stroke
      part: the tip of the silkworm's tail

覓:
  checked: argon
  object: a hand reaching down from above over a figure whose head is a large watching eye, searching with hand and eye
  history: >-
    An ideogrammic compound combining a hand reaching down from above (爫, from 爪) and a person whose
    head is a large watching eye (見): searching for something with both hand and eye.
  layout: >-
    At the top, a pale open hand reaches down from above, its back and fingers formed by the top
    cluster of strokes. Below it stands a small figure wearing simple pale clothes whose head is one
    large upright almond-shaped eye, with a soft pale brown or blue iris between the two inner lines
    and a mid-grey pupil, above two legs striding below.
  exact:
    - All four strokes of the top hand stand completely free of one another and do not touch the eye below.
    - The eye's left vertical meets the top-and-right stroke at the top left and the bottom closing line at the bottom left, while the bottom closing line touches the bottom of the right side.
    - The two inner lines of the eye touch the left vertical and are about three quarters as long as the top line, stopping short of the right side.
    - The lower left sweep starts at the bottom left of the eye frame, while the lower right leg starts from the middle of the bottom closing line, curves wide to the right, and ends in an upward hook.
  strokes:
    - where: a short sweep across the top, slanting down from right to left
      part: the back of the hand reaching down from above
    - where: a short dot at the upper left, slanting down to the right
      part: the hand's left finger reaching down
    - where: a short dot in the upper middle, slanting down to the right
      part: the hand's middle finger reaching down
    - where: a short sweep at the upper right, slanting down to the left
      part: the hand's thumb reaching down on the right
    - where: a straight line down the left side of the middle box
      part: the watching eye's left lid
    - where: a line across the top of the middle box, turning down at the right to run down the right side
      part: the watching eye's top corner and right lid
    - where: a short line across the upper middle of the eye, from the left side, about three quarters as long as the top line
      part: the upper edge of the iris
    - where: a short line across the lower middle of the eye, from the left side, about as long as the upper inner line
      part: the lower edge of the iris
    - where: a line across the bottom of the eye, closing the frame from left to right
      part: the eye's bottom corner and the figure's shoulders
    - where: a sweep from the bottom left corner of the eye down and out to the bottom left
      part: the figure's left leg
    - where: a long stroke from the middle of the eye's bottom line down, curving across to the bottom right and ending in a hook straight up
      part: the figure's right leg, with its foot turned up

鶯:
  checked: argon
  object: an oriole bird beneath a wide covering of bright green feathers, with its head, eye, body and tail, standing on its feet
  history: >-
    The character combines a bird at the bottom with a cover across the middle and two fire-like
    tufts at the top, traditionally understood as a bird draped in bright, patterned green and
    golden plumage.
  layout: >-
    The picture is stacked in three tiers filling the square. At the top sit two symmetrical tufts
    of pale green and yellow-green feathers side by side. Across the upper middle stretches a wide
    arched mantle of soft green plumage. Beneath this mantle stands the oriole in profile facing
    left, painted in pale golden yellow and soft olive green, with its small head, eye, breast,
    arched body, hanging tail and four toes along the bottom.
  exact:
    - At the top, the two feather tufts sit side by side above the wide middle cover and do not touch it.
    - Each top tuft has a central vertical stroke sweeping slightly to the left at its foot, flanked by two upper dots and a lower right dot; in the left tuft only the upper right dot touches the central stroke, while in the right tuft only the lower right dot touches the central stroke.
    - The wide cover across the middle starts at the top of its short left downward stroke and runs almost the full width of the frame, ending in a sharp hook down to the left.
    - The bird's short crest stroke starts on the middle of the wide cover and slants down to the left to meet the top of the head's upper stroke.
    - In the bird's head, the upper inner line touches the left vertical and stops short of the right side, about two thirds as long as the top of the head, while the lower inner line touches both the left vertical and the bottom of the head's right side.
    - The neck line below the head starts on the left vertical and is about a quarter as long as the wide cover above, with its right end open.
    - The long body stroke starts at the bottom of the left vertical, runs wide to the right, turns down to the bottom of the frame, and ends in a hook to the left.
    - Along the bottom under the body, a longer leftmost toe stroke slants down to the left and three shorter dots to its right slant down to the right, all standing free of the body and of one another.
  strokes:
    - where: a short dot slanting down to the right at the upper left, standing free
      part: the left feather tip of the left tuft of green plumage
    - where: a short stroke slanting down to the left in the upper left-centre, touching the middle of the left tuft's main shaft
      part: the upper right feather tip of the left tuft of green plumage
    - where: a stroke in the upper left-centre running down and sweeping slightly to the left
      part: the main shaft of the left tuft of green plumage
    - where: a short dot slanting down to the right beside the lower part of the left shaft, standing free
      part: the lower right barb of the left tuft of green plumage
    - where: a short dot slanting down to the right in the upper centre between the two main shafts, standing free
      part: the left feather tip of the right tuft of green plumage
    - where: a short stroke slanting down to the left at the upper right, standing free
      part: the upper right feather tip of the right tuft of green plumage
    - where: a stroke in the upper right-centre running down and sweeping slightly to the left
      part: the main shaft of the right tuft of green plumage
    - where: a short stroke slanting down to the right from the middle of the right shaft
      part: the lower right barb of the right tuft of green plumage
    - where: a short line running down and slightly to the left at the upper-middle left
      part: the left hanging edge of the feather mantle covering the bird
    - where: a long line across from the top of the left hanging edge to the far right, ending in a hook down to the left
      part: the wide top arch and right edge of the feather mantle covering the bird
    - where: a short stroke in the centre, slanting down to the left from the middle of the wide arch above the bird's head
      part: the bird's crest
    - where: a straight vertical line down the left side of the bird's head and body
      part: the front of the bird's head and its breast
    - where: a line from the top of the breast line across and slightly up to the right, then turning down and slightly to the left
      part: the top and back of the bird's head
    - where: a short line inside the upper head, rising slightly to the right from the left vertical and stopping short of the right side
      part: the bird's eye line
    - where: a line across the bottom of the head, rising slightly to the right from the left vertical to meet the bottom of the head's right side
      part: the bird's cheek feathers
    - where: a short line below the head, rising slightly to the right from the left vertical
      part: the bird's neck feathers
    - where: a long line from the bottom of the left vertical across to the right, turning down to the bottom and ending in a hook to the left
      part: the bird's body and tail
    - where: a short stroke at the bottom left, slanting down to the left and standing free
      part: the bird's back toe
    - where: a short dot at the bottom left-centre, slanting down to the right and standing free
      part: the bird's first front toe
    - where: a short dot at the bottom centre, slanting down to the right and standing free
      part: the bird's middle front toe
    - where: a short stroke at the bottom right-centre, slanting down to the right and standing free
      part: the bird's last front toe
