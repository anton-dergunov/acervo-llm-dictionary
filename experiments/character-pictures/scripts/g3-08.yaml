  dropped: Because the character is a phono-semantic compound with no pictographic or ideographic reading in the scholarly origin, picturing the outer 勹 as a spoon or wrapper would teach a false etymology.

觅:
  object: a hand reaching down from above over a figure whose head is a large watching eye, searching with hand and eye
  history: >-
    An ideogrammic compound combining a hand at the top with a person whose head is a large eye
    below, meaning to seek or search with hands and eyes. The simplified form keeps the four-stroke
    clawed hand above and reduces the eye-and-person below to its open-bottomed simplified shape.
  layout: >-
    In the top third, a pale hand reaches downward, its back along the top sweep and its three
    fingers spread along the three short strokes below. In the lower two-thirds stands the searching
    figure from 见, whose upper frame encloses a large open eye with a pale iris and a small nose and
    mouth just below, wearing simple pale clothes over the body and legs. The two components sit one
    above the other with a clear gap between them.
  exact:
    - The four strokes of the top hand all stand completely free of one another and do not touch the lower part.
    - At the very top, a short sweep runs from right to left; below it sit two short dots slanting down to the right on the left and middle, and a short sweep slanting down to the left on the right.
    - In the lower part, the top bar starts on the top of the left vertical and turns down at the right so the two verticals form an open-bottomed frame of equal depth with no bottom line.
    - The long sweep to the bottom left starts inside the upper part of the open frame without touching either side wall.
    - The last stroke starts just to the right of the middle of that sweep without touching it, drops down, runs wide to the bottom right, and ends in a tall upward hook.
  strokes:
    - where: a short sweep across the top, slanting down from right to left
      part: the back of the hand reaching down from above
    - where: a short stroke on the upper left, slanting down to the right
      part: the hand's left finger reaching down
    - where: a short dot in the upper middle, slanting down to the right
      part: the hand's middle finger reaching down
    - where: a short sweep on the upper right, slanting down to the left
      part: the hand's right finger reaching down
    - where: a straight line down the left side of the middle frame
      part: the left lid of the large watching eye
    - where: a line across the top of the middle frame, turning down at the right to run straight down the right side
      part: the top corner and right lid of the large watching eye
    - where: a long sweep starting inside the frame near its top, running down and out to the bottom left
      part: the searching figure's body, running down into the left leg
    - where: a stroke starting near the middle of the left leg, running down, turning across to the bottom right, and ending in an upward hook
      part: the searching figure's right leg and upturned foot

