乂:
  object: a pair of garden shears for cutting weeds, with two long blades crossing at a central pivot
  history: >-
    The oldest oracle bone and bronze forms drew a tool for cutting weeds, either a sickle-like
    blade or a large pair of crossed shears. The modern character keeps the two crossed strokes of
    the shears.
  layout: >-
    A pair of weeding shears fills the square along the two crossing strokes. Simple pale wooden
    grips wrap the upper ends of the two strokes, a small pale grey pivot sits in the middle where
    they cross, and pale steel blades follow the lower halves as they sweep down and out to their
    points at the bottom left and bottom right.
  exact:
    - The two strokes cross each other near the middle.
    - The sweep from near the top centre to the bottom left starts clearly higher than the stroke from the upper left.
    - The stroke from the upper left runs down to the right and turns more level as it reaches the bottom right.
  strokes:
    - where: a long curved sweep from high near the top centre down and out to the bottom left
      part: one half of the shears, running from its upper grip through the pivot to the tip of the left blade
    - where: a long falling stroke from the upper left down to the right, turning across at the bottom right
      part: the other half of the shears, running from its upper grip through the pivot to the tip of the right blade

竄:
  object: a mouse crouching beneath the rocky mouth of a hole, hiding in its burrow
  history: >-
    An ideogrammic compound combining a cave or hole at the top with a mouse at the bottom, showing
    a rodent hiding in or scurrying through its burrow. The mouse component itself is an ancient
    pictogram with a toothy head at the top and legs, claws and a long tail below.
  layout: >-
    The rocky mouth of a burrow spans the upper third of the square, shaded in pale grey-brown
    stone. Directly beneath the opening sits a pale grey mouse filling the lower two thirds: its
    blocky, toothy head is in the middle of the square, its two bent legs and small claws occupy the
    lower left and centre, and its long tail curves out to the bottom right.
  exact:
    - The top cave sits in the upper third and does not touch the mouse below it.
    - In the cave at the top, the top dot stands free above the roof line; the roof line starts at the middle of the left vertical stroke and ends in a hook down to the left; the two inner strokes touch the underside of the roof line, the left sweeping down to the left and the right turning across to the right with a plain end.
    - In the mouse's head in the middle, the top is open in the centre with a small gap between the left sweep and the right corner stroke; the two short inner strokes touch the left and right walls respectively and do not meet in the middle; the bottom line across connects the bottom of the left and right walls.
    - All seven strokes of the mouse's lower body stand completely free of the head and of one another.
    - The left leg and middle leg both run down and turn sharply up to the right at the bottom, each accompanied by two small stacked dots to its right that do not touch the leg.
    - The rightmost stroke is a long curve sweeping down to the bottom right and ending in a tall upward hook.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right
      part: a stone at the top of the hill above the hole
    - where: a short stroke at the upper left, slanting down to the left
      part: the left side of the rocky overhang
    - where: a long line across the upper part, ending in a hook down to the left at the right
      part: the overhanging roof of the hole
    - where: a sweep under the left part of the roof, running down and out to the lower left
      part: the left wall of the hole's mouth
    - where: a stroke under the right part of the roof, running down and turning across to the right
      part: the right wall of the hole's mouth
    - where: a short sweep below the hole's left side, slanting down to the left
      part: the upper left side of the mouse's snout
    - where: a short line slanting down on the middle left, below the snout sweep
      part: the left cheek of the mouse's head
    - where: a short stroke inside the left side of the head, rising slightly to the right
      part: the mouse's left tooth inside its mouth
    - where: a stroke across the upper right of the head, turning sharply down to the left
      part: the upper right side and right cheek of the mouse's head
    - where: a short stroke inside the right side of the head, rising slightly to the right
      part: the mouse's right tooth inside its mouth
    - where: a line across the middle, rising slightly to the right to close the bottom of the head
      part: the mouse's lower jaw
    - where: a vertical line down the lower left, turning sharply up to the right at the bottom
      part: the mouse's front leg and upturned paw
    - where: a small dot to the right of the upper part of the front leg, slanting down to the right
      part: an upper claw beside the front leg
