  history: >-
    An ideogrammic compound combining 山, a three-peaked mountain range, at the top with 高, a tall
    tiered palace or tower, below to represent a lofty, towering mountain peak.
  layout: >-
    The mountain range sits across the upper quarter of the square, narrower than the building
    beneath it, with three pale rocky peaks rising behind its three strokes. The tall three-tiered
    palace fills the lower three quarters of the square, with a tiled roof under a small finial dot,
    a small upper room in the middle, and a wide lower hall enclosing a doorway at the bottom,
    coloured in soft pale stone and warm wood tones.
  exact:
    - The mountain at the top is narrower and much shorter than the palace below it, and the two parts do not touch.
    - In the top mountain, the middle vertical starts highest and ends on the middle of the base line; the left stroke turns at the bottom left into the base line, which meets the middle of the right vertical so the right vertical's bottom end extends slightly below the base.
    - The small finial dot below the mountain and the long roof line beneath the dot both stand free, touching no other stroke.
    - The small upper room's box sits centered between the roof line and the wide lower hall without touching either, its three strokes meeting at the corners.
    - The lower hall's left vertical meets the start of the wide top-and-right stroke, which turns down the right side and ends at the bottom right in a prominent hook up to the left, leaving the bottom of the hall open.
    - The small inner doorway box sits centered inside the open lower hall without touching the outer frame.
  strokes:
