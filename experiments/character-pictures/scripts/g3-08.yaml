嵩:
  object: a mountain range of three peaks at the top rising above a tall three-tiered palace with a roof, an upper room and a lower hall with a door
  history: >-
    An ideogrammic compound combining 山, a three-peaked mountain range, at the top with 高, a tall
    tiered palace or tower, below to represent a lofty, towering mountain peak.
  layout: >-
    The mountain range sits across the upper quarter of the square, narrower than the building
    beneath it, with three pale rocky peaks rising behind its three strokes. The tall three-tiered
    palace fills the lower three quarters of the square, with a tiled roof under a small finial dot,
    a small upper room in the middle, and a wide lower hall enclosing a doorway at the bottom,
    coloured in soft pale stone and warm wood tones.
  exact:
    - The mountain at the top is narrower and much shorter than the palace below it, and the two parts do not touch.
    - In the top mountain, the middle vertical starts highest and ends on the middle of the base line; the left stroke turns at the bottom left into the base line, which meets the middle of the right vertical so the right vertical's bottom end extends slightly below the base.
    - The small finial dot below the mountain and the long roof line beneath the dot both stand free, touching no other stroke.
    - The small upper room's box sits centered between the roof line and the wide lower hall without touching either, its three strokes meeting at the corners.
    - The lower hall's left vertical meets the start of the wide top-and-right stroke, which turns down the right side and ends at the bottom right in a prominent hook up to the left, leaving the bottom of the hall open.
    - The small inner doorway box sits centered inside the open lower hall without touching the outer frame.
  strokes:
    - where: a short vertical line down the top centre
      part: the ridge of the tallest, middle peak
    - where: a short vertical line on the upper left, turning at the bottom to run across to the right, rising slightly
      part: the ridge of the left peak, then the base of the mountain range
    - where: a short vertical line down the upper right
      part: the ridge of the right peak
    - where: a small dot below the mountain's base at the centre, slanting down to the right
      part: the palace roof's finial
    - where: a long line across above the middle, rising slightly to the right
      part: the palace roof
    - where: a short line slanting down to the right on the left of the upper room
      part: the upper room's left side
    - where: a line across the top of the upper room, turning down at the right side
      part: the upper room's top and right side
    - where: a short line across the bottom of the upper room, rising slightly to the right
      part: the upper room's floor
    - where: a line down the left side of the lower hall
      part: the hall's left wall
    - where: a wide line across the top of the lower hall from the left wall's top, turning down the right side and ending in a hook up to the left
      part: the hall's top and right wall
    - where: a short line slanting down to the right on the left of the inner door
      part: the door's left post
    - where: a line across the top of the inner door, rising slightly, then turning down on the right side
      part: the door's lintel and right post
    - where: a short line across the bottom of the inner door, rising slightly to the right
      part: the door's threshold

