邑:
  checked: argon
  object: a walled city enclosure at the top, with a person kneeling below it
  history: >-
    The oldest forms combined a square enclosure at the top, representing city walls, with a
    kneeling person below to mean a settlement or town. In the modern form the enclosure became the
    small upper box 口 and the kneeling figure became the lower part 巴.
  layout: >-
    In the upper third sits a square walled city enclosure seen from above, with pale earthen brick
    walls along its four sides. Below a small gap, a person in simple pale robes kneels facing
    right: the upper box of the lower component frames the person's shoulder on the left and bowed
    head with eyes, nose and mouth on the right, divided by the collar line, with folded arms along
    the lower bar and the kneeling legs and robe sweeping across the bottom to an upturned foot on
    the right.
  exact:
    - The upper box and the lower component do not touch each other, leaving a small gap between them.
    - In the upper box, the top line starts at the top of the left vertical, turns down at the right, and touches the bottom line; the bottom line starts at the bottom of the left vertical.
    - In the lower part, the upper horizontal starts at the top of the long left stroke, runs across, turns down on the right, and meets the right end of the middle horizontal.
    - A short vertical line, the shortest vertical in the character, runs down the middle of the lower component's upper box, touching both the top and bottom horizontals of that box.
    - The middle horizontal starts on the long left vertical, rises slightly to the right, and closes the box.
    - The long outer stroke runs down the left side, curves across the bottom well past the right side of the upper box, and turns sharply upward at the bottom right.
  strokes:
    - where: a short line down the left side of the upper box
      part: the left wall of the city enclosure
    - where: a line across the top of the upper box, turning down on the right side
      part: the top and right walls of the city enclosure
    - where: a line across the bottom of the upper box
      part: the front wall closing the city enclosure
    - where: a line across the top of the lower part, turning down on the right with a small inward hook
      part: the kneeling person's shoulder line and the top and front outline of the head
    - where: a very short vertical line down the middle of the lower part's upper box
      part: the collar separating the person's shoulder on the left from the head on the right
    - where: a line across the middle of the lower part, rising slightly to the right
      part: the kneeling person's folded arms and sleeve across the waist
    - where: a long stroke running down the left side of the lower part, curving across the bottom to the far right and turning sharply upward at the end
      part: the kneeling person's back, curving into the legs along the ground and ending in the upturned foot at the right

羹:
  checked: argon
  object: a lamb cooked over fire at the top to make savoury broth, and a person wearing a crown of ram's horns below
  history: >-
    An ideogrammic compound combining 羔, a sheep 羊 over cooking fire 灬, with 美, a person Big 大
    wearing a crown of ram's horns 羊, together signifying fine, savoury lamb soup.
  layout: >-
    The scene is stacked top to bottom. In the upper half, a frontal lamb's head sits above four
    strokes of cooking fire, with a pale warm glow and faint wisps of broth steam behind the
    strokes. In the lower half stands a pleased person seen from the front with a friendly face
    (eyes, nose and mouth) and simple pale clothes, wearing an ornate ram-horn crown and stretching
    both arms out wide. All colours are pale and soft.
  exact:
    - The two top horn strokes of the upper sheep stand free with a small gap above the first horizontal line.
    - The upper vertical line starts at the middle of the first horizontal line, crosses the second horizontal line, and ends cleanly at the middle of the third, wide horizontal line without passing through it.
    - The four fire strokes across the middle and the two horn strokes of the lower crown just beneath them all stand completely free of every other stroke.
    - In the four fire strokes, the leftmost slants down to the left, the middle two are short dots slanting down to the right, and the rightmost is a longer stroke slanting down to the right.
    - In the lower crown, the vertical post starts at the middle of its top band, crosses its middle band, and ends at the middle of its wide lowest band.
    - The lowest band of the lower crown is the widest horizontal line in the character; the wide line of the upper sheep is about nine tenths as long, the arm line near the bottom is about seven tenths as long, and the four shorter inner horizontal lines are each about half to three fifths as long.
    - The lower left-sweeping body stroke starts at the middle of the crown's lowest band, crosses the middle of the arm line, and sweeps out to the bottom left; the right leg stroke starts where the body crosses the arm line and sweeps out to the bottom right.
  strokes:
