    - Below the widest line across, the long left sweep and the long right falling stroke meet at their tops at the middle of that line.
    - The lower vertical stroke starts from the middle of the long left sweep, runs straight down, and turns sharply up to the right at the bottom.
    - The short sweep on the lower right starts below the widest line across without touching it, and its lower end touches the middle of the long right falling stroke.
