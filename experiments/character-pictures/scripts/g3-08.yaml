      part: the lamb's left horn
    - where: a short stroke at the top centre-right, sweeping down to the left
      part: the lamb's right horn
    - where: a line across below the top horns, about three fifths as long as the widest line, rising slightly to the right
      part: the brow and ears of the lamb's head
    - where: a shorter line across the upper middle, about half as long as the widest line, rising slightly to the right
