# Full run, group g1, batch 01. Written from the fact sheets, following scripts/GUIDE.md.
一:
  object: the flat line of the horizon, with sky above it and land below
  history: >-
    The oldest forms drew a single bar, standing for heaven, for earth, or for the first of the
    counted things.
  layout: >-
    One long straight horizon crosses the middle of the frame from side to side. Pale blue sky lies
    above it and soft pale green land lies below it, both kept faint so that the line stays the only
    strong mark.
  exact:
    - The line is perfectly straight and almost level, not curved, with plain square ends.
  strokes:
    - where: a long straight line across the middle of the frame, from the left side nearly to the right side
      part: the line of the horizon

了:
  object: a baby wrapped tightly in a blanket, only its face showing
  history: >-
    The oldest forms drew a child swaddled in blankets, with the arms bound in and no legs showing.
    The modern form keeps only the head cloth and the wrapped body.
  layout: >-
    The swaddled baby stands upright and fills the frame from top to bottom, with a round friendly
    face (two eyes, a small nose, a smiling mouth) near the top, under the blanket's folded edge. The
    blanket is pale cream or pale yellow and wraps the whole body.
  exact:
    - The first stroke runs across the top and turns down to the left, and its end touches the start of the second stroke.
    - The second stroke starts at that touching point, runs down with a gentle bend to the right and ends in a small hook up to the left.
    - The second stroke is clearly the longer one and hangs down the centre of the frame.
  strokes:
    - where: a line across the upper part of the frame, from the upper left to the right, turning back down to the left at its end
      part: the folded edge of the blanket over the baby's head and shoulders
    - where: a long stroke starting at the end of the first, running down the centre, bending a little to the right, ending in a small hook up to the left
      part: the wrapped body, the hook the tucked end of the blanket at the feet

入:
  object: an arrow pointing the way in, passing through a doorway
  history: >-
    The oldest forms drew a pointed shape that meant going in. The modern form keeps two strokes
    leaning against each other like the sides of a point.
  layout: >-
    A pale doorway opening stands behind the strokes. The two strokes meet at the top like the sides of
    a sharp arrowhead pointing up and into the opening, with a pale wooden arrow shaft hidden behind
    them.
  exact:
    - The short stroke starts on the middle of the long stroke and runs down to the left, ending at the lower left.
    - The long stroke starts higher, to the right of the short stroke's start, sweeps down to the right and ends in a gentle turn across to the right.
    - The short stroke is clearly shorter, a little over half as long as the long one.
  strokes:
    - where: a short sweep starting on the middle of the long stroke and running down to the bottom left
      part: the arrowhead's left side, going down to its barb
    - where: a long stroke from the upper middle sweeping down to the right, turning to run across to the right at its end
      part: the arrowhead's long right side, flaring at the foot into the doorway's threshold

力:
  object: the head of a plow, with its long handle
  history: >-
    The oldest forms drew a plow with its pointed share and handle, the tool that gives a farmer his
    strength.
  layout: >-
    A plow stands in a pale brown field. Pale furrows run behind it, and a soft green hillside rises in
    the distance. The plow's beam, blade and handle follow the strokes.
  exact:
    - The two strokes cross at the middle of each.
    - The stroke with the hook starts on the left, runs across to the right, turns down and ends in a small hook up to the left.
    - The sweep is a long stroke starting at the top, running down and curving to the bottom left, and it crosses the first stroke.
  strokes:
    - where: a line across from the middle left to the right, turning down at the right and ending in a small hook up to the left
      part: the plow's beam, then its blade going down into the soil, the hook the share
    - where: a long stroke from the top running down, then sweeping to the bottom left, crossing the first stroke
      part: the plow's long handle

二:
  object: two planks lying one above the other, heaven above and earth below
  history: >-
    The oldest forms drew two bars one above the other, the upper standing for heaven and the lower for
    earth.
  layout: >-
    Two flat wooden planks lie one above the other, centred in the frame, with a wide gap between them.
    Pale blue sky shows above the upper plank and pale green earth below the lower one, both faint.
  exact:
    - The upper plank is clearly shorter, a little over half as long as the lower one.
    - The upper plank rises very slightly to the right; the lower one is level.
    - The two planks do not touch.
  strokes:
    - where: a short line across the upper part of the frame, centred, rising very slightly to the right and clearly shorter than the lower line
      part: the upper plank, heaven
    - where: a long line across the lower part of the frame, nearly the full width
      part: the lower plank, earth

又:
  object: a right hand, reaching out with its thumb hanging down
  history: >-
    The oldest forms drew a right hand with the fingers and the thumb spread. The modern form is two
    strokes crossing, the hand and the arm.
  layout: >-
    A pale right hand with a sleeved forearm fills the frame. The forearm comes in from the upper left
    and reaches to the lower right; the hand is open and relaxed, drawn in soft skin tones behind the
    strokes, with the sleeve in a pale colour.
  exact:
    - The two strokes cross near the middle of each.
    - The first stroke runs across to the right and then turns sharply down to the left, ending low on the left side.
    - The second stroke sweeps from the upper left down to the lower right and ends in a short turn across to the right.
  strokes:
    - where: a stroke across the upper part of the frame to the right, then turning down to the left and running down the left side to the bottom
      part: the back of the hand and the thumb, hanging down
    - where: a stroke from the middle left sweeping down to the bottom right, ending in a short turn across to the right
      part: the forearm running to the cuff of the sleeve

几:
  object: a small low table
  history: >-
    The oldest forms drew a small table with a flat top and two legs, a low stand for sitting at.
  layout: >-
    A small low wooden table, pale wood, fills the frame with its top at the upper part and its legs
    down to the ground. Soft pale floor lies below the lowest stroke.
  exact:
    - The two strokes touch at the top left, where the left leg joins the top.
    - The left leg is a short sweep down to the bottom left.
    - The second stroke runs across the top, rising slightly to the right, turns down for the right leg, and ends in a small curl across and up at the foot.
  strokes:
    - where: a short sweep from the top left down to the bottom left
      part: the table's left leg
    - where: a long stroke starting at the top of the left leg, running across the top, rising slightly to the right, then turning down the right side and ending in a curl to the right and up
      part: the table's top, then its right leg, the curl its foot

幾:
  object: a small low table
  history: >-
    The oldest forms drew a small table with a flat top and two legs. The traditional form adds two
    tiny skeins of thread above a guard with his weapon, meaning very small.
  layout: >-
    Two tiny skeins of pale thread hang side by side across the upper part of the frame, the left one
    a little higher than the right. Below them a guard stands for the table's legs and top: he faces
    left, with a friendly face (eyes, nose, mouth) and simple pale clothes, holding a long halberd
    upright beside him. A small pale table is drawn behind him. The floor lies below the lowest stroke.
  exact:
    - The left skein is made of a looping stroke, a second sweeping stroke and a tiny dot where they end; the right skein is the same, a little lower and to the right.
    - The two skeins do not touch each other and do not touch the guard.
    - The across stroke at the guard's middle rises slightly to the right and is crossed by the halberd's long shaft.
    - The halberd's shaft runs down to the lower right and ends in a small hook up.
    - The long sweep at the right of the guard crosses the shaft and ends at the bottom centre.
    - The small dot at the right edge stands free of every other stroke.
  strokes:
    - where: a small looping stroke at the upper left, going down to the right, back down to the left and then across, rising slightly to the right
      part: the left skein's first loop of thread
    - where: a short sweep down to the left from the top of the left skein, ending in a small turn across to the right
      part: the left skein's second loop of thread
    - where: a tiny dot at the end of the left skein's loops
      part: the left skein's loose end
    - where: a small looping stroke at the upper right, going down to the right, back down to the left and then across, rising slightly to the right
      part: the right skein's first loop of thread
    - where: a short sweep down to the left from the top of the right skein, ending in a small turn across to the right
      part: the right skein's second loop of thread
    - where: a tiny dot at the end of the right skein's loops
      part: the right skein's loose end
    - where: a long line across the middle of the frame, rising slightly to the right
      part: the guard's outstretched arm and the halberd's crossbar
    - where: a stroke starting on the middle of the long line, running down to the right and then sweeping down to the bottom left
      part: the guard's back, bending down to his left leg
    - where: a short dot-like stroke below the middle, slanting down to the right, touching the guard's back
      part: the guard's foot
    - where: a very long stroke from the top centre running straight down and then sweeping down to the right, ending in a small hook up
      part: the halberd's shaft, the hook its blade
    - where: a sweep from the right of the shaft's middle down to the bottom centre, crossing the shaft
      part: the guard's right leg
    - where: a short dot at the right edge of the frame, slanting down to the right
      part: the tassel on the halberd

儿:
  object: a small child, standing on two legs
  history: >-
    The oldest forms drew a child with a big head and a soft skull. The modern form keeps only the two
    legs the child stands on.
  layout: >-
    A small child stands facing the viewer, with a round friendly face (two eyes, a nose, a smiling
    mouth), hair and simple pale clothes. The head and body are drawn pale above the two legs, which
    are the strokes.
  exact:
    - The two strokes do not touch each other.
    - The left leg is a short sweep and clearly shorter than the right leg, a little over half as long.
    - The right leg runs down, turns across to the right and ends in a small curl rising to the right, forming the foot.
  strokes:
    - where: a short stroke on the left side, down and sweeping to the bottom left
      part: the child's left leg
    - where: a longer stroke on the right half starting higher, running down, then turning across to the right and rising at its end
      part: the child's right leg, the rising end its foot

八:
  object: a round fruit split into two halves that move apart
  history: >-
    The oldest forms drew two bent lines going away from each other, meaning to divide.
  layout: >-
    A pale round melon is cut in two. Its halves slide apart: the left half is lower and smaller, the
    right half is taller and larger. Each stroke is a cut edge where the halves part.
  exact:
    - The two strokes do not touch each other.
    - The left stroke is clearly shorter, a little over half as long as the right stroke, and starts lower than the right stroke.
    - The right stroke starts near the top centre and ends in a gentle turn across to the right.
  strokes:
    - where: a short sweep on the left half, down and out to the bottom left, starting at the middle height
      part: the left half's cut edge
    - where: a longer stroke starting near the top centre, running down to the right and turning across to the right at its end
      part: the right half's cut edge

九:
  object: a bent arm with its elbow
  history: >-
    The oldest forms drew a bent arm, and the elbow was the curve. The modern form is two strokes
    crossing.
  layout: >-
    A person seen from the side, facing right, with a friendly face (eyes, nose, mouth) and a simple
    pale shirt. The person's back falls along the first stroke and the bent arm is the second.
  exact:
    - The two strokes cross where the sweep passes the start of the second stroke.
    - The second stroke starts at the left, runs across and rises slightly to the right, turns down at the elbow, runs across the bottom and ends in a small hook up.
    - The sweep is long and starts at the top, running down to the bottom left.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left
      part: the person's back
    - where: a line starting at the left, crossing the sweep, running across and rising slightly to the right, then turning down, then across to the right and curling up
      part: the upper arm, then the elbow turning down, then the forearm and fist curling up

个:
  object: a person standing with a counting staff planted in front of them
  history: >-
    The oldest forms drew a person with a mark for one counted unit. The modern form is the person
    above a vertical tally.
  layout: >-
    A person stands facing the viewer with legs apart and a round friendly face (eyes, nose, mouth) and
    simple pale clothes. A long straight plain wooden staff stands in front of them, running down from
    the chest to the ground between the feet.
  exact:
    - The staff is a straight vertical line with a plain end at the bottom, with no hook, and it stands free of the person.
    - The staff is shorter than the person's left sweep, about four fifths as long.
    - The person's right leg starts at the top of the left sweep.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left
      part: the person's body, running down into the left leg
    - where: a stroke starting at the top of the first sweep, running down to the right and turning across to the right at its end
      part: the person's right leg
    - where: a long straight vertical line starting below the person's chest in the centre and running down to the bottom, touching no other stroke
      part: the counting staff

之:
  object: a foot in a shoe, walking
  history: >-
    The oldest forms drew a foot with its toes, meaning to follow or go. The modern form is a cursive
    version of the same foot.
  layout: >-
    A foot in a soft pale shoe fills the frame and walks to the right, shown from the side. The sole
    runs along the bottom and the shoe's upper arches over it. A round ankle bone sits at the top
    centre above the shoe. The ground below the sole is pale.
  exact:
    - The small dot at the top stands free of every other stroke.
    - The stroke over the foot starts at the left, rises slightly to the right, then turns down to the left, and its end touches the middle of the sole.
    - The stroke over the foot and the sole are about as long as each other.
    - The sole runs across to the right, turning down to the right and then rising at its end.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the ankle bone
    - where: a stroke about as long as the sole below, from the middle left across, rising slightly to the right, then turning back down to the left and ending on the long stroke below
      part: the upper of the shoe, arching over the foot
    - where: a line about as long as the stroke above it, across the lower part of the frame from the left, running across, turning down to the right and curling up at the right end
      part: the sole of the shoe, the curl its toe

工:
  object: a workman's spade
  history: >-
    The oldest forms drew a workman's tool, a spade or a similar tool of the trade.
  layout: >-
    A spade stands upright. A short handle bar crosses the top of the shaft and the wide flat blade
    sits at the bottom. The wood of the shaft is pale, the blade pale grey.
  exact:
    - The shaft touches the middle of the top handle bar and the middle of the bottom blade.
    - The top bar is clearly shorter, a little over half as long as the bottom blade.
    - The top bar rises very slightly to the right; the bottom blade is level.
  strokes:
    - where: a short line across the upper part, rising slightly to the right
      part: the spade's handle bar
    - where: a short vertical line from the middle of the handle bar straight down to the middle of the bottom line
      part: the spade's shaft
    - where: a long line across the lower part, nearly the full width
      part: the spade's wide flat blade

小:
  object: a small grain, split in two by a stick, its halves falling apart
  history: >-
    The oldest forms drew a small thing divided by a line, meaning something very small.
  layout: >-
    A straight stick stands upright in the centre, ending in a small hook at its foot. A tiny pale
    grain has been cut by it, and its two halves fall to either side, one to the left and one to the
    right, at the same height.
  exact:
    - The three strokes do not touch each other.
    - The centre stick is straight and long, with a small hook up to the left at its foot.
    - The two side strokes are short, about a quarter of the stick's length, and mirror each other.
  strokes:
    - where: a long straight line down the centre, ending in a small hook up to the left
      part: the stick, the hook its foot
    - where: a short stroke to the left of the stick at middle height, slanting down to the left
      part: the grain's left half, falling away
    - where: a short stroke to the right of the stick at middle height, slanting down to the right
      part: the grain's right half, falling away

三:
  object: three planks lying one above the other
  history: >-
    The oldest forms drew three bars one above the other.
  layout: >-
    Three flat wooden planks lie stacked one above the other, evenly spaced, centred in the frame. The
    bottom plank is the longest. Pale sky behind and a pale ground below the bottom plank, both faint.
  exact:
    - The top plank and the middle plank are about the same length, each about half as long as the bottom one.
    - The top plank rises very slightly to the right; the other two are level.
    - The three planks do not touch each other.
  strokes:
    - where: a short line across the upper part, centred, rising slightly to the right, about half as long as the bottom line
      part: the top plank
    - where: a short line across the middle, centred, about half as long as the bottom line
      part: the middle plank
    - where: a long line across the lower part, nearly the full width
      part: the bottom plank

己:
  object: a loom with thread woven across it
  history: >-
    The oldest forms drew a coil of thread on a loom, the line looping and winding.
  layout: >-
    A small pale wooden loom fills the frame. A thread winds on it. The top beam is at the upper left,
    a small rod sits under it, and the thread runs down the left side, along the bottom, and up at the
    right. The thread is pale and soft.
  exact:
    - The top stroke runs across to the right, then turns down to the left, and its end touches the end of the small bar below.
    - The small bar below it rises slightly to the right and starts on the top of the long stroke.
    - The long stroke starts at the small bar's left end, runs down the left side, turns across to the right along the bottom, and rises at its right end only a little, ending about halfway up, well below the top bars.
    - The small bar is shorter than the top stroke, about half its length.
  strokes:
    - where: a line across the upper part of the frame to the right, then turning down to the left in a short hook
      part: the loom's top beam and its hanging post
    - where: a short line below the first, rising slightly to the right, its left end on the start of the long stroke
      part: the loom's small rod
    - where: a very long stroke starting at the rod's left end, running down the left side, turning across to the right along the bottom, then rising at its right end
      part: the thread running down the loom's frame and along the base, the rising end the thread's loose tail

才:
  object: a sprout growing out of the ground
  history: >-
    The oldest forms drew a sprout pushing up through the soil.
  layout: >-
    A young green sprout stands in the soil. The line of the ground crosses the sprout's stem in the
    upper middle. Above the ground, pale leaves unfold behind the top of the stem; below it, the pale
    brown soil fills the lower part of the frame, with the roots in it.
  exact:
    - The ground line crosses the stem near its upper third; the stem is clearly longer below the line than above it.
    - The stem is a straight vertical line that ends at the bottom in a small hook up to the left.
    - The root sweep starts where the stem and the ground line cross and runs down to the bottom left.
    - The root sweep touches both the ground line and the stem at its start.
  strokes:
    - where: a long line across the upper middle of the frame, rising very slightly to the right
      part: the line of the ground
    - where: a long vertical line down the centre from the top to the bottom, ending in a small hook up to the left, crossing the ground line
      part: the sprout's stem above the ground, its root below, the hook the root's tip
    - where: a sweep from the crossing of the stem and the ground line down to the bottom left
      part: the root spreading to the left

馬:
  object: a horse galloping to the left
  history: >-
    The oldest forms drew a whole horse in profile, with head, mane, body and four legs. The modern
    form straightens it into a head, mane and legs.
  layout: >-
    A pale brown horse gallops to the left with its head at the upper left and its tail streaming to
    the right. It has a friendly eye and a mane on its neck. Four hooves in the lower part of the frame
    follow the four small marks below the body. The ground is pale and lies below the lowest stroke.
  exact:
    - The top stroke runs across, rising slightly to the right, and is the longest of the strokes that run across.
    - The left stroke runs down from the left end of the top stroke, bending a little to the right, and its end meets the start of the body line.
    - The two short lines across the middle are about two thirds as long as the top one and rise slightly to the right.
    - The middle vertical starts on the middle of the top stroke, crosses both short lines and ends on the body line.
    - The body line starts at the bottom of the left stroke, rises to the right, turns across, then turns down and ends in a small hook up to the left.
    - The four marks below the body stand free of every other stroke and of each other.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the top of the horse's forelock
    - where: a stroke down the left side from the top, bending slightly to the right
      part: the horse's face and nose
    - where: a short line across the upper middle, rising slightly to the right, crossing the middle vertical
      part: the upper part of the mane
    - where: a short line across the middle, a little longer, rising slightly to the right, crossing the middle vertical
      part: the lower part of the mane
    - where: a vertical line from the middle of the top stroke down to the body line, crossing the two short lines
      part: the horse's neck
    - where: a long stroke from the bottom of the left stroke, rising to the right, then across, then down to the bottom, ending in a small hook up to the left
      part: the horse's back, rump and tail, the hook its tail tip
    - where: a short vertical stroke at the lower left
      part: the first hoof
    - where: a short dot below the body, slightly to the right of the first
      part: the second hoof
    - where: a short dot below the middle of the body, slanting down to the right
      part: the third hoof
    - where: a short stroke at the lower right, slanting down to the right
      part: the fourth hoof

马:
  object: a horse galloping to the left
  history: >-
    The oldest forms drew a whole horse in profile, with head, mane, body and four legs. The modern
    form straightens it into a head, mane and legs.
  layout: >-
    A pale brown horse gallops to the left with its head at the upper left and its tail streaming to
    the right. It has a friendly eye and a mane on its neck. The forelegs reach out to the left along
    the bottom line. The ground is pale and lies below the lowest stroke.
  exact:
    - The first stroke runs across from the upper left and turns down at the right; the second stroke stands just below its end and does not touch it.
    - The second stroke runs down, turns across to the right, then turns down and ends in a small hook to the left.
    - The bottom line is a little shorter than the first stroke, about nine tenths as long, and stands clear of the second stroke.
    - None of the three strokes touches another.
  strokes:
    - where: a line across the upper left to the right, turning down at its right end
      part: the horse's head and neck, bending down
    - where: a stroke starting a little below the first, running down the left, then across to the right, then turning down and ending in a small hook to the left
      part: the horse's back, rump and tail, the hook its tail tip
    - where: a line across the lower part of the frame, from the bottom left to the middle, level
      part: the horse's outstretched forelegs

广:
  object: a lean-to building with its roof against a wall
  history: >-
    The oldest forms drew a rough shelter leaning against a cliff, which became the general sign for a
    building.
  layout: >-
    A simple building stands with a long sloping wall at the left and a flat roof reaching to the right.
    A small roof ornament sits at the top. Windows and doors are drawn pale. The ground lies below the
    lowest stroke.
  exact:
    - The small top dot stands free of every other stroke.
    - The roof line starts at the top of the wall and rises very slightly to the right.
    - The wall is the longest stroke, running down and curving to the bottom left, ending in a plain point.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's small ornament
    - where: a line across the upper part from the top of the wall to the right, rising very slightly to the right
      part: the roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the wall of the building

土:
  object: a lump of clay on a potter's wheel
  history: >-
    The oldest forms drew a lump of clay standing on a wheel, a mound on a flat base.
  layout: >-
    A lump of pale brown clay sits on the potter's wheel. The wheel's flat disk is the bottom stroke
    and its spindle rises from it. The clay is a soft mound around the spindle, with its lower edge
    along the short crossing stroke. No hands appear.
  exact:
    - The short crossing line sits on the upper half of the upright and crosses it, with the upright continuing a little above it.
    - The upright touches the middle of the bottom line.
    - The short crossing line is clearly shorter than the bottom line, a little over half as long.
  strokes:
    - where: a short line across the middle, rising very slightly to the right, crossing the upright
      part: the lower edge of the clay lump
    - where: a vertical line down the centre from the top to the bottom line
      part: the wheel's spindle, running through the clay
    - where: a long line across the bottom, nearly the full width
      part: the wheel's flat disk

乾:
  object: the sun with rays shining out, the dry heat of the day
  history: >-
    The oldest forms drew rays of light going out from the sun. The right-hand part is there for the
    sound only, and is drawn as more rays.
  layout: >-
    A pale yellow sun with a square-ish rim stands at the left half of the frame, with a ray crossing
    above it and a ray crossing below it, like two plus-shaped bundles of rays. On the right half,
    three long pale rays stream out: a falling ray at the top, a short one and a long wavy one below.
  exact:
    - The upper ray is a short line across and a short stroke down crossing it in the middle.
    - The sun's left side meets the start of its top, and the top turns down on the right; the two short bars inside rise to the right, and the upper bar touches the left side without reaching the right.
    - The lower bar of the sun joins the left side and ends where the top's right side ends.
    - The top and the sun's right side do not touch the right-hand rays.
    - The lower ray is a line across, crossed in the middle by a vertical.
    - The long wavy ray at the right stands free of every other stroke.
  strokes:
    - where: a short line across the top left, rising slightly to the right
      part: the upper ray's cross bar
    - where: a short stroke down just right of the middle of the upper bar, crossing it
      part: the upper ray's long line
    - where: a short vertical line on the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, rising slightly to the right, then turning down on its right
      part: the sun's top and right rim
    - where: a short stroke inside the sun, rising to the right, touching the left rim
      part: the sun's upper inner band
    - where: a short stroke inside the sun below the first, rising to the right
      part: the sun's lower inner band
    - where: a long line across the lower left, rising slightly to the right
      part: the lower ray's cross bar
    - where: a vertical line down from the sun's lower inner band, crossing the lower bar and ending at the bottom
      part: the lower ray's long line
    - where: a stroke at the top of the right half, falling down to the left
      part: a long ray falling from the upper right
    - where: a short line across the upper right, rising to the right and touching the falling ray
      part: a short ray shining to the right
    - where: a long line across the middle of the right half, turning down to the left, then down to the right, across, and curling up at the end
      part: a long wavy ray streaming out below

干:
  object: a wooden club with a crossbar
  history: >-
    The oldest forms drew a club or an axe, a weapon with a forked head.
  layout: >-
    A tall plain wooden club stands upright, with a small cap on top and a crossbar lashed near the
    upper middle. The wood is pale brown. The shaft continues far below the crossbar to the ground.
  exact:
    - The top cap is clearly shorter, about half as long as the crossbar.
    - The shaft starts on the middle of the top cap, crosses the crossbar near its middle, and continues far below it.
    - The shaft ends in a plain point at the bottom, with no hook.
  strokes:
    - where: a short line across the top, rising slightly to the right, about half as long as the crossbar
      part: the club's cap
    - where: a long line across the upper middle, nearly the full width
      part: the club's crossbar
    - where: a long vertical line from the middle of the top cap straight down to the bottom, crossing the crossbar
      part: the club's shaft

飛:
  object: a bird flying with its wings flapping
  history: >-
    The oldest forms drew a bird with its wings spread. The traditional form draws two birds, one above
    the other, flying.
  layout: >-
    Two birds fly together. A small bird flies at the upper right with its wing arched. A larger
    bird flies below it, seen from above, with its body straight down the centre and its wings spread
    wide across the frame. Pale blue sky, pale grey-brown feathers, a small friendly eye on each bird.
  exact:
    - The upper bird's wing is one stroke that stands free of every other stroke. It runs across, turns down, then down to the right, and ends in a small hook up.
    - The upper bird's two small feather marks are short and meet end to start, the first slanting down to the left and the second down to the right.
    - The lower bird's body is a long straight vertical line in the left half and crosses the wing.
    - The lower bird's wing starts at the left, rises, turns down, then across to the right, and ends in a small hook up.
    - The two small marks under the lower wing's right end touch each other; neither touches the wing.
    - The upper bird is smaller than the lower bird.
  strokes:
    - where: a stroke across the upper right, rising slightly to the right, then turning down and down to the right, ending in a small hook up
      part: the upper bird's arched wing
    - where: a tiny stroke at the upper right, slanting down to the left
      part: the upper bird's first feather
    - where: a tiny stroke at the upper right just below, slanting down to the right
      part: the upper bird's second feather
    - where: a short sweep at the upper left, down and to the left
      part: the lower bird's crest
    - where: a longer sweep starting at the middle of the crest, running down to the bottom left
      part: the lower bird's tail
    - where: a long stroke starting at the left of the middle, rising to the right, then turning down, then across to the right and ending in a small hook up
      part: the lower bird's wide spread wing
    - where: a tiny vertical stroke in the right half, in the middle height
      part: the lower bird's first feather
    - where: a short stroke below it, slanting down to the right, touching the first feather
      part: the lower bird's second feather
    - where: a long vertical line down the left of the centre, crossing the wing
      part: the lower bird's body

飞:
  object: a bird flying with its wings flapping
  history: >-
    The oldest forms drew a bird with its wings spread. The traditional form draws two birds, one above
    the other, flying.
  layout: >-
    One pale grey-brown bird flies to the right across a pale blue sky, with a small friendly eye. The
    big curve is its whole wing and body, rising from the left, falling and ending in a flick. Two small
    feather strokes stand at its right.
  exact:
    - The wing and body is one long stroke that runs across and rises slightly to the right, turns down, then down to the right, and ends in a small hook up.
    - The upper small feather stroke slants down to the right and curves back to the left; it stands free of every other stroke.
    - The lower small feather stroke slants down to the right and starts on the long stroke.
    - The two small strokes do not touch each other.
  strokes:
    - where: a very long stroke from the upper left, rising slightly to the right, turning down, then down to the right, ending in a small hook up
      part: the bird's wing and body in flight, the hook its wing tip
    - where: a small stroke at the upper right, slanting down to the right then curving back down to the left
      part: a feather at the wing's far edge
    - where: a small stroke at the right of the middle, slanting down to the right, its start on the long stroke
      part: a feather at the wing's lower edge

丸:
  object: a clenched fist holding a round pebble
  history: >-
    The oldest forms drew a bent arm with a small round thing held in the hand, a pellet.
  layout: >-
    A sleeved arm bends at the elbow, and its fist holds a small round grey pebble. The skin is pale
    and the sleeve a pale colour; the pebble sits where the dot lies.
  exact:
    - The sweep and the long stroke cross where the sweep passes the start of the long stroke.
    - The long stroke starts at the left, runs across, rising slightly to the right, turns down, then down to the right, then across, and ends in a small hook up.
    - The dot crosses the sweep, a little below the long stroke's start, slanting down to the right.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left
      part: the upper arm
    - where: a line starting at the left, crossing the sweep, running across to the right, then down, then across and ending in a small hook up
      part: the forearm, bent at the elbow, ending in the fist
    - where: a short dot-like stroke on the left half, crossing the sweep and slanting down to the right
      part: the pebble held in the hand

亡:
  object: a person lying in a coffin
  history: >-
    The oldest forms drew a person inside a box, the coffin, meaning one who has died.
  layout: >-
    A plain wooden coffin seen from the front stands in the lower part of the frame, with its lid
    resting above it, wider than the box. Inside lies a peaceful person with closed eyes, a calm face
    (nose and mouth) and plain pale clothes. A small knob sits on top of the lid.
  exact:
    - The small top mark stands free of every other stroke.
    - The lid is a long straight line across, wider than the coffin below it, rising very slightly to the right.
    - The coffin stroke starts on the middle of the lid's lower edge, near its left end, runs down the left side and turns across to the right along the bottom.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the lid's small knob
    - where: a long line across the upper middle, rising slightly to the right
      part: the coffin lid
    - where: a stroke starting on the lid in the left half, running down, then turning across to the right along the bottom
      part: the coffin's left side and floor

不:
  object: a bird flying up toward the sky
  history: >-
    The oldest forms drew a bird with its wings, flying up toward the sky line.
  layout: >-
    A bird flies upward toward a pale line of sky that crosses the top of the frame. It faces up, with a
    small friendly eye. Its left wing sweeps down to the lower left, its body hangs straight down, and
    its right wing falls to the lower right. The bird is pale grey-brown against pale blue.
  exact:
    - The line of the sky is long and nearly level, rising slightly to the right.
    - The left wing starts at the middle of the sky line and sweeps down to the bottom left.
    - The body starts on the left wing and runs down, bending slightly to the right.
    - The right wing is a short stroke that stands free of every other stroke, slanting down to the right.
  strokes:
    - where: a long line across the top, rising slightly to the right
      part: the line of the sky
    - where: a long sweep starting at the middle of the sky line, running down and out to the bottom left
      part: the bird's left wing
    - where: a stroke starting on the left wing, a little below the top, running down and bending slightly to the right
      part: the bird's body and tail
    - where: a short stroke to the right of the body, slanting down to the right and standing free
      part: the bird's right wing
