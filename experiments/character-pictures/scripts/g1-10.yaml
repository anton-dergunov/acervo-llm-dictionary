# Full run, group g1, batch 10. Written from the fact sheets, following scripts/GUIDE.md.

別:
  object: a knife drawing a boundary between classes, a mouth above a strong arm on its left and the knife standing on its right
  history: >-
    An ideogram: a knife 刂 cutting between the classes 另, to separate and to tell apart. The
    left part joins a mouth 口 and an arm 力, the right part is the knife.
  layout: >-
    The left half holds a wide-open mouth in the upper part and, below it, a strong flexed arm with a
    pale sleeve, the fist at the right. The mouth and the arm do not touch. The right half holds one
    tall upright knife with a pale steel blade, and a short handle piece standing beside the blade at
    its upper left. Soft pale colours throughout.
  exact:
    - The mouth is a small open mouth in the upper left; its left side and its top and right side meet at the top left, and its short lower lip rises a little to the right and joins both.
    - The arm is below the mouth and does not touch it; the arm's second stroke starts on the end of its first stroke.
    - The knife stands free of the left part; its blade is the long stroke, about three times as long as the short handle piece beside it.
    - The blade ends at the bottom in a small hook to the left; the short handle piece is a plain vertical with no hook.
  strokes:
    - where: a short line down the upper left, from the top to the middle of the left part
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, turning down at its right end to the lower left
      part: the mouth's upper lip, curving down into its right corner
    - where: a short line rising slightly to the right, joining the ends of the first two strokes
      part: the mouth's lower lip
    - where: a long stroke from just below the mouth, down and then sweeping to the bottom left
      part: the arm's shoulder and back edge, sweeping down to the left
    - where: a line starting on the sweep, across to the right, turning down and ending in a small hook to the left
      part: the arm's upper edge and forearm, the hook the fist
    - where: a short vertical line in the upper left of the right half, free of everything else
      part: the knife's short handle piece
    - where: a very long vertical line down the right half from the top to the bottom, ending in a small hook to the left
      part: the knife's blade, the hook its curved tip

别:
  object: a knife drawing a boundary between classes, a mouth above a strong arm on its left and the knife standing on its right
  history: >-
    An ideogram: a knife 刂 cutting between the classes 另, to separate and to tell apart. The
    left part joins a mouth 口 and an arm 力, the right part is the knife.
  layout: >-
    The left half holds a wide-open mouth in the upper part and, below it, a strong flexed arm with a
    pale sleeve, the fist at the right. The mouth sits above the arm and does not touch it. The right
    half holds one tall upright knife with a pale steel blade, and a short handle piece standing
    beside the blade at its upper left. Soft pale colours throughout.
  exact:
    - The mouth is a small open mouth in the upper left; its left side and its top and right side meet at the top left, and its short lower lip runs across level and joins both.
    - The arm's long upper stroke runs from the left across the lower half and turns down at the right into a hook to the left; the arm's sweep crosses it in the middle.
    - The mouth's lower lip starts on the top of the arm's sweep; the mouth's left side stops a little short of the sweep.
    - The knife stands free of the left part; its blade is the long stroke, about three times as long as the short handle piece beside it.
    - The blade ends at the bottom in a small hook to the left; the short handle piece is a plain vertical with no hook.
  strokes:
    - where: a short line down the upper left, from the top to the middle of the left part
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, rising slightly, turning down at its right end to the lower left
      part: the mouth's upper lip, curving down into its right corner
    - where: a short level line across the bottom of the mouth
      part: the mouth's lower lip
    - where: a long line across the lower left, from near the left edge to the right, turning down and ending in a small hook to the left
      part: the arm's upper edge and forearm, the hook the fist
    - where: a stroke from the lower lip down, crossing the long line across, and sweeping to the bottom left
      part: the arm's shoulder and back edge, sweeping down to the left
    - where: a short vertical line in the upper left of the right half, free of everything else
      part: the knife's short handle piece
    - where: a very long vertical line down the right half from the top to the bottom, ending in a small hook to the left
      part: the knife's blade, the hook its curved tip

島:
  object: a bird perched atop a mountain, the bird facing left with the mountain beneath its belly
  history: >-
    An ideogram: a bird 鳥 perched atop a mountain 山, an island rising from the sea. The oldest
    forms drew the bird with a crest, an eye and long tail feathers.
  layout: >-
    A large bird with pale feathers fills the upper right and centre, facing left, its head at the top
    left and its tail sweeping down to the right. A small pale grey-green mountain with three peaks
    sits below the bird's chest at the lower left, the bird perched on it. The bird has a round eye
    and a small beak. Pale blue sea beyond the foot of the mountain.
  exact:
    - The small crest stroke at the top and the long breast line below it do not touch each other; the crest stroke ends where the stroke across the back begins.
    - The three short feather lines all start on the breast line; the highest is the shortest, about a third as long as the line across the back.
    - The long underside stroke starts at the bottom of the breast line, rises to the right, runs across and then turns down into a hook to the left.
    - The mountain stays small and stands below the bird; its centre peak and its right peak do not touch the bird's underside stroke.
    - In the mountain the centre peak is short and ends on the bottom line; the bottom line turns up at the right, where the right peak stands on it.
  strokes:
    - where: a short stroke at the top, slanting down to the right and then turning down to the left
      part: the bird's crest
    - where: a stroke down the left side of the bird, starting just below the crest and running down, turning slightly down
      part: the bird's breast line
    - where: a line starting at the foot of the crest, across to the right, turning down and to the left at its end
      part: the bird's back, ending in the folded wing tip
    - where: a short line across the upper left of the body, rising a little to the right, starting on the breast line
      part: the first feather line of the wing
    - where: a short stroke rising to the right from the breast line, lower than the first
      part: the second feather line of the wing
    - where: a short line across below it, rising slightly to the right, starting on the breast line
      part: the third feather line of the wing
    - where: a long stroke starting at the bottom of the breast line, rising to the right, running across, then turning down and ending in a hook to the left
      part: the bird's belly and tail, the hook its tail tip
    - where: a short stroke at the top of the mountain, slanting down to the right and then down
      part: the mountain's centre peak
    - where: a line from the middle left down to the bottom left, turning there to run along the bottom, rising slightly to the right
      part: the mountain's left ridge, then the base along the ground
    - where: a short vertical line at the right end of the base
      part: the mountain's right peak

岛:
  object: a bird perched atop a mountain, the bird facing left with the mountain beneath its belly
  history: >-
    An ideogram: a bird 鸟 perched atop a mountain 山, an island rising from the sea. The oldest
    forms drew the bird with a crest, an eye and long tail feathers.
  layout: >-
    A large bird with pale feathers fills the upper right and centre, facing left, its head at the top
    left and its tail curving down to the lower right. A small pale grey-green mountain with three
    peaks sits at the lower left, the bird perched on it. The bird has a small beak and a round eye.
    Pale blue sea beyond the foot of the mountain.
  exact:
    - The small crest stroke at the top touches the start of the back stroke and the start of the long outline stroke.
    - The eye is a small free dot inside the head; it touches no other stroke.
    - The back stroke runs across, rising slightly, then turns down, ending in a small hook to the left.
    - The long outline stroke runs down the front of the bird, then across to the right, rises slightly, runs on to the right, then turns down at the right end and ends in a hook to the left.
    - The mountain is small and sits at the lower left; its right peak does not touch the end of the long outline stroke.
    - In the mountain the centre peak is short and ends on the bottom line; the bottom line turns up to the right and ends on the right peak.
  strokes:
    - where: a short stroke at the top, slanting down to the right and then turning down to the left
      part: the bird's crest
    - where: a line across the top of the body, rising slightly to the right, turning down and ending in a small hook to the left
      part: the bird's back and tail, the hook its tail tip
    - where: a small dot inside the head, slanting down to the right
      part: the bird's eye
    - where: a long stroke starting at the crest, running down the front, turning across to the right along the belly, then turning down and ending in a hook to the left
      part: the bird's breast and belly, curving down into its legs
    - where: a short stroke in the mountain's centre, slanting down to the right and then down
      part: the mountain's centre peak
    - where: a line from the middle left down to the bottom left, turning there to run along the bottom, rising a little to the right
      part: the mountain's left ridge, then the base along the ground
    - where: a short vertical line at the right end of the base
      part: the mountain's right peak

足:
  object: a leg above a bare foot, a round knee over a foot standing on the ground
  history: >-
    A pictograph: the leg 口 above the foot. The oldest forms drew the knee or the calf as a round
    shape over the foot, toes pointing forward.
  layout: >-
    A round pale knee in the upper middle, drawn as an open box with rounded corners, sits on top of
    one straight shin that runs down into a bare foot. The foot fills the lower half of the square,
    its toes up at the right and its heel at the left, standing on a ground line. Pale skin
    colours; the sole rests on the ground.
  exact:
    - The knee is a small open box in the upper middle; its left side and its top and right side meet at the top left, and its short lower line rises a little to the right.
    - The long shin starts on the knee's lower line and does not touch the knee's left side.
    - The short stroke on the right of the shin is shorter than the knee's top line, about two fifths as long as the top line of the knee.
    - The long sweep at the left, down to the bottom left, is the longest downward stroke and does not touch the shin; it ends on the start of the long ground stroke.
    - The ground stroke starts at the sweep's upper end, slants down to the right and then runs across to the bottom right; the shin ends on it.
  strokes:
    - where: a short line down the left side of the upper box, from the top to the middle
      part: the knee's left side
    - where: a line across the top of the box, turning down at its right end and to the left
      part: the knee's top, curving down its right side
    - where: a short line across the bottom of the box, rising a little to the right
      part: the knee's lower edge
    - where: a straight vertical line down the middle from the knee's lower edge, down to the sole
      part: the shin and the foot's long middle line, down to the ground
    - where: a short line across the right of the shin, rising slightly to the right
      part: the second toe, held out to the right
    - where: a line on the left, from the middle left down and out to the bottom left, a little over half again as long as the shin below the knee
      part: the heel and the outer edge of the foot
    - where: a stroke from the upper end of the left sweep, down to the right and then turning across to the right to the bottom right
      part: the sole and the ground the foot stands on

声:
  object: a stone chime hanging from a frame, a sounding stone that rings
  history: >-
    A simplified form of 聲, which drew a hanging stone chime being struck. The top keeps the frame,
    the lower part the chime.
  layout: >-
    A pale wooden frame hangs at the top: a long beam, a short hanger and a lower bar. Below the
    frame, with a small gap between them, hangs one pale grey stone chime with a slanted left edge and
    a flat top and bottom. Soft grey and wood colours.
  exact:
    - The long beam at the top is about a half again as long as the lower bar; the hanger crosses the long beam in its middle and ends on the lower bar.
    - The lower bar is clearly shorter than the long beam, about two thirds as long.
    - The chime does not touch the lower bar; a small gap lies between the middle of the lower bar and the chime's top.
    - The chime's top edge across is a little shorter than the long beam, about nine tenths as long, and ends in a small hook down to the left.
    - The short dot in the middle of the chime joins the top edge to the bottom edge; the bottom edge's right end meets the end of the top edge's hook.
    - The slanted left edge starts at the top edge's left end, and the bottom edge starts on it.
  strokes:
    - where: a long line across the top of the square, from near the left to near the right
      part: the frame's long beam
    - where: a short stroke from above the beam down through its middle, ending on the lower bar
      part: the hanger from which the chime hangs
    - where: a shorter line across below the beam, under the hanger's end
      part: the frame's lower bar
    - where: a line across the middle left to the right, ending in a small hook down to the left
      part: the chime's top edge
    - where: a small dot in the middle of the chime, joining the top edge down to the bottom edge
      part: the chime's centre rib
    - where: a line across the lower part, rising slightly to the right, ending at the right end of the top edge
      part: the chime's bottom edge
    - where: a long sweep from the top left of the chime down and out to the bottom left
      part: the chime's slanted left edge

快:
  object: a quick decisive person beside a heart, a decisive will
  history: 'An ideogram: a decisive 夬 will 忄. The right part gives the sound and the sense of a firm cut.'
  layout: >-
    A narrow upright pale rose heart stands on the left half. On the right half a person stands seen
    from the front with arms stretched out and one fist raised in a firm, quick gesture. The person has
    a friendly face with eyes, a nose and a mouth, and wears a simple pale tunic.
  exact:
    - The heart's short left stroke stands free; the short stroke beside it on the right touches the long vertical, in the middle.
    - The heart's long vertical runs almost the full height and does not touch the person.
    - The arms line is the longest line across, running across almost the whole right half, and crosses the body line.
    - The person's raised arm stroke crosses the body and ends on the arms line.
    - The right leg starts on the body line where the arms line crosses it, runs down to the right and then across; it is about half as long as the body line.
    - The body line is the longest stroke; the heart's vertical is nearly as long, about nine tenths.
  strokes:
    - where: a short vertical line in the middle of the left half, free of the others
      part: a small vessel on the heart's left
    - where: a short dot-like stroke slanting down to the right, touching the long vertical in the middle
      part: a small vessel on the heart's right
    - where: a long vertical line down the left, from the top to the bottom
      part: the heart's long upright edge
    - where: a line across the upper middle to the right, turning down to the left in a short sweep
      part: the person's raised arm and fist, held in a firm gesture
    - where: a long line across the middle, from the left to near the right edge
      part: the person's arms, flung wide
    - where: a long stroke from the top centre down, curving and sweeping to the bottom left
      part: the person's head and body, running down into the left leg
    - where: a stroke from the middle of the body, down to the right and then turning across to the right
      part: the person's right leg and foot

改:
  object: a hand with a stick disciplining a kneeling child
  history: 'An ideogram: a hand with a stick 攵 disciplining a kneeling child 己, to correct and to change.'
  layout: >-
    A small child kneels on the left, curled forward, turned to face right, with a friendly face with
    eyes, a nose and a mouth and a simple pale tunic. On the right a grown hand in a pale sleeve holds a
    thin pale switch above the child, a gentle correction. The hand and the child do not touch.
  exact:
    - The child's head stroke runs across and turns down to the left; its end meets the end of the short arm stroke below it.
    - The child's short arm stroke starts on the long back stroke.
    - The child's long stroke runs down, then along the ground, and its end rises a little to the right.
    - The child's strokes do not touch the hand's strokes.
    - The stick's shaft is the stroke at the top; the second stick stroke starts on the end of the first and rises to the right.
    - The hand's two lower strokes cross each other in the middle; the sweep to the left is shorter than the stroke down to the right.
  strokes:
    - where: a line across the upper left, turning down to the left in a short hook
      part: the child's bowed head and neck
    - where: a short line below it, rising slightly to the right, ending at the first stroke's end
      part: the child's arm
    - where: a long stroke starting at the arm's left end, running down the left, then along the bottom, rising at its end to the right
      part: the child's back, lap and the raised foot
    - where: a stroke from the top of the right half, slanting down and to the left
      part: the switch held in the hand
    - where: a line rising to the right from the end of the switch, across the upper right
      part: the hand's grip along the switch
    - where: a stroke from the middle of the grip, down and sweeping out to the lower left
      part: the hand's wrist and palm
    - where: a longer stroke from the middle, down to the right and then turning across to the right
      part: the forearm and sleeve, reaching to the right

形:
  object: sunlight streaming through a window, three rays falling in across a window frame
  history: >-
    An ideogram: sunlight 彡 streaming through a window 开. The three rays are long strokes of light.
  layout: >-
    A plain pale wooden window frame fills the left half: a top rail, a long crossbar, a left post
    and a right post, which together make a window. On the right three pale yellow rays of light
    fall in from the upper right, one above the other, the bottom ray the longest.
  exact:
    - The long crossbar runs almost across the whole left half; it is the longest across line and is crossed by both posts.
    - The short top rail is about three quarters as long as the crossbar.
    - The left post starts at the left end of the top rail and sweeps out to the bottom left; the right post starts in the middle of the top rail and runs straight down.
    - The right post is nearly as long as the left post, about as long.
    - The three rays stand free of the window and of each other; the bottom ray is the longest, about as long as the two upper rays together, and the upper two are about half as long as the lowest.
    - The crossbar's right end stays short of the rays by a small gap.
  strokes:
    - where: a short line across the top of the left half
      part: the window's top rail
    - where: a long line across the middle of the left half, rising slightly to the right
      part: the window's crossbar
    - where: a stroke from the left end of the top rail, down, crossing the crossbar, and sweeping to the bottom left
      part: the window's left post
    - where: a straight line from the middle of the top rail down, crossing the crossbar, to the bottom
      part: the window's right post
    - where: a short sweep at the upper right, down to the left
      part: the first ray of sunlight
    - where: a short sweep below it, down to the left
      part: the second ray of sunlight
    - where: a longer sweep low on the right, down to the left
      part: the third ray of sunlight, the longest

返:
  object: a hand held up against a cliff beside a winding road, someone walking back along it
  history: >-
    An ideogram: to walk 辶 backwards 反. The oldest forms drew a hand against a cliff, with the road
    beneath it.
  layout: >-
    A pale grey cliff stands on the right with an overhanging ledge at the top, and a pale open hand
    held flat against its face. A pale path winds from the lower left around the foot of the cliff. A
    small pale stepping stone lies at the start of the path at the upper left.
  exact:
    - The ledge runs from right to left and turns down at its left end, where the cliff's face starts.
    - The hand's long stroke starts on the cliff face and rises to the right, then turns down to the left; it is clearly longer than the thumb stroke below.
    - The thumb stroke crosses the hand's long stroke in the middle, runs down to the right, and does not touch the cliff face.
    - The stepping stone is a short free dot; the path's upper bend ends on the long base stroke.
    - The long base stroke is clearly longer than the bend above, about one and a half times as long; its end rises slightly at the right.
    - The path does not touch the cliff face; small gaps lie between them.
  strokes:
    - where: a short stroke at the top, running to the left, then turning down to the left
      part: the cliff's overhanging ledge
    - where: a long sweep from the left end of the ledge, down and out to the bottom left
      part: the cliff's face
    - where: a stroke from the middle of the cliff's face, across to the right, rising slightly, then turning down to the left
      part: the hand's back and the wrist
    - where: a stroke below it, from near the cliff, down to the right
      part: the hand's thumb and fingers
    - where: a short stroke at the upper left, down to the right, free of the others
      part: the stepping stone at the start of the path
    - where: a line from the middle left, across to the right and rising slightly, turning down to the lower left
      part: the path's upper bend
    - where: a very long line along the bottom, from the bottom left across to the right, rising slightly, then turning across to the right
      part: the path's long base running out along the ground

告:
  object: an ox's head over a mouth, speaking with the force of an ox
  history: >-
    An ideogram: to speak 口 with the force of an ox 牛. The oldest forms drew the ox's head with horns
    over a mouth.
  layout: >-
    A pale ox's head seen from the front fills the upper part of the square, with its horns and ears
    held out to both sides. Below its muzzle a wide-open mouth fills the lower middle, calling out. The
    ox has two round eyes and a broad muzzle. Pale brown and rose colours.
  exact:
    - The ox's face line crosses the line across the upper part and stops on the long line of the ears; it does not run on below it.
    - The long line of the ears runs almost the whole width of the square, about twice as long as the line across the upper part.
    - The short stroke of the left horn touches the line across the upper part in its middle.
    - The mouth is below the ox and does not touch it.
    - The mouth's left side and its top line start at the same point; its lower lip is a short line that meets the top line's end.
    - The mouth is about a half as wide as the ears line.
  strokes:
    - where: a short stroke at the upper left, slanting down to the left
      part: the ox's left horn
    - where: a line across the upper part, from the foot of the first stroke to the right, rising slightly
      part: the top of the head, the brow between the horns
    - where: a long straight line down the centre, from the top edge to the long line across, crossing the brow
      part: the right horn at its top, then the long face down to the muzzle
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the ears, held out to both sides
    - where: a straight line down the left of the lower middle, slanting a little to the right
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, turning down at its right end into a hook to the left
      part: the upper lip, curving down into the right corner
    - where: a line across the bottom of the mouth
      part: the lower lip

克:
  object: a weapon planted on a beast to subdue it, a cross-shaped club above a beast with a big open mouth and two legs
  history: >-
    An ideogram: a weapon 十 used to subdue a beast 兄. The oldest forms drew a creature with a big
    head and two legs, held down.
  layout: >-
    A pale cross-shaped club stands in the upper part of the square, its crosspiece above and its long
    handle planted on the head of a pale creature below. The creature has a big open mouth for a
    head, small friendly eyes above the mouth's edge, and two strong legs, the right one long with a
    raised foot. Soft pale colours; the creature is calm.
  exact:
    - The club's crosspiece rises slightly to the right and is crossed by the handle, which runs down from the top; the two are about as long as each other.
    - The handle ends on the top of the creature's head; it touches the head's top line.
    - The head is an open box made of its left side, its top line turning into a hook down to the left, and its lower line.
    - The head's top line is the longest across line, and the lower line is about half as long as the top line.
    - The left leg is a sweep to the bottom left that stands free of everything else; the right leg is long, turning across to the right and rising at its end.
    - The right leg starts on the head's lower line and does not touch the top line.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the club's crosspiece
    - where: a straight stroke from above, down through the crosspiece, ending on the head
      part: the club's long handle
    - where: a short line down the left of the head, slanting to the right
      part: the head's left side
    - where: a line across the top of the head, ending in a hook down to the left
      part: the top of the head and its right cheek
    - where: a shorter line across the bottom of the head, rising slightly to the right
      part: the head's lower line, the lower lip
    - where: a sweep from below the left of the head down and out to the bottom left
      part: the creature's left leg
    - where: a long stroke from the middle of the lower line going down, turning across to the right and rising at its end
      part: the creature's right leg, ending in a raised foot

剋:
  object: a weapon planted on a beast to subdue it, a cross-shaped club above a beast with a big open mouth and two legs
  history: >-
    An ideogram: a weapon 十 used to subdue a beast 兄. The oldest forms drew a creature with a big
    head and two legs, held down. The traditional form adds a knife 刂 beside it.
  layout: >-
    A pale cross-shaped club stands in the upper left, its long handle planted on the head of a pale
    creature below it. The creature has a big open mouth for a head, small friendly eyes, and two strong
    legs. On the right stands a tall pale knife, apart from the creature. Soft pale colours.
  exact:
    - The club's crosspiece rises slightly to the right and is crossed by the handle; the handle is a little longer than the crosspiece.
    - The handle's end touches the head's top line, in the middle.
    - The head is an open box; its short left side and its top line start at the same point on the left; the top line ends in a hook down to the left and meets the lower line.
    - The lower line is about half as long as the top line.
    - The left leg stands free of the head and the right leg; the right leg is long, turning down to the right and rising at its end.
    - The knife stands free of the creature; its blade is the long stroke, about two and a half times as long as the short handle piece beside it, and ends in a small hook to the left.
  strokes:
    - where: a line across the upper left, rising slightly to the right
      part: the club's crosspiece
    - where: a straight stroke from above, down through the crosspiece, ending on the head
      part: the club's long handle
    - where: a short stroke down the left of the head, slanting to the right
      part: the head's left side
    - where: a line across the top of the head, ending in a hook down to the left
      part: the top of the head and its right cheek
    - where: a shorter line across the bottom of the head, rising slightly to the right
      part: the head's lower line, the lower lip
    - where: a sweep from below the left of the head down and out to the bottom left
      part: the creature's left leg
    - where: a long stroke from the lower line going down, turning down to the right, then rising across to the right and up at its end
      part: the creature's right leg, ending in a raised foot
    - where: a short vertical line in the upper middle of the right part
      part: the knife's short handle piece
    - where: a long vertical line down the right part, ending in a small hook to the left
      part: the knife's blade

证:
  object: someone speaking the truth, a mouth giving a word, and a bare foot stepping up to a line and stopping exactly on it
  history: 'An ideogram: to speak 讠 the truth 正, to prove. The oldest forms drew a foot stepping up to a line.'
  layout: >-
    On the left a small simple pale mouth in profile speaks, with a short sound mark above it. On the
    right a pale bare foot steps up to a mark across the top and stops exactly on it, standing on the
    ground. Soft warm skin colours; the foot stays simple.
  exact:
    - The sound mark and the mouth stand free of each other and of the foot.
    - The mouth is one long line across, rising slightly, turning down and then rising to the right at the bottom; it is longer than anything in the foot.
    - The foot's top mark rises a little to the right; the foot's long line starts on it, slants a little to the right and runs down onto the ground.
    - The ground line is the longest line of the foot, about twice as long as the top mark.
    - The short toe stroke starts on the foot's long line; the outer edge on the left stands free of the ground line's start, with a small gap.
  strokes:
    - where: a short stroke at the top left, slanting down to the right
      part: the sound mark, a spoken word
    - where: a long line starting at the left, across and rising slightly, turning down and then rising to the right at the bottom
      part: the speaker's mouth in profile, the upper lip, the throat and the lower jaw
    - where: a short line across the top of the right half, rising slightly to the right
      part: the mark the foot comes to
    - where: a line from the middle of the top mark down, slanting a little to the right and then straight down to the ground line
      part: the foot's long middle line, from the toes to the heel
    - where: a short line from the middle of the foot's long line out to the right, rising slightly
      part: the foot's inner toe
    - where: a line on the left side, slanting down to the right, stopping short of the ground line
      part: the foot's outer edge
    - where: a long line across the bottom of the right half
      part: the ground the foot stands on

住:
  object: a person who hosts, standing beside a lit lamp
  history: 'An ideogram: a person 亻 who hosts 主, to dwell. The right part shows a lamp with its flame, the lamp left burning for a guest.'
  layout: >-
    A person stands on the left half, seen from the front, facing right toward the lamp, with a friendly
    face with eyes, a nose and a mouth and a simple pale robe. On the right half a small pale lamp
    on a stand burns with a small flame. Soft warm colours.
  exact:
    - The person has two strokes, a long sweep from the top to the bottom left and a straight vertical starting in the middle of the sweep and running down.
    - The straight vertical ends in a plain point with no hook and does not touch the lamp's base; a small gap lies between them.
    - The flame is a free small dot at the top; it touches no other stroke.
    - The lamp's bowl rim is about three quarters as long as the base; the collar is a little shorter than the rim, about two thirds as long as the base.
    - The stand starts on the rim, crosses the collar and ends on the base.
  strokes:
    - where: a long sweep from the top left of the left half, down and out to the middle left
      part: the host's head and body, running down into the left leg
    - where: a straight vertical line from the middle of the sweep down to the bottom
      part: the host's right leg
    - where: a small dot at the very top of the right half, slanting down to the right
      part: the lamp's flame
    - where: a line across the upper part of the right half, rising slightly to the right
      part: the lamp's bowl rim, holding the oil
    - where: a shorter line across the middle, a little shorter than the rim
      part: the lamp's collar on the stand
    - where: a straight vertical line down the middle of the right half, from the bowl rim to the base
      part: the lamp's stand
    - where: a long line across the bottom of the right half
      part: the lamp's base

君:
  object: a leader holding out a staff, and a mouth below giving orders
  history: >-
    An ideogram: a leader 尹 giving orders 口. The oldest forms drew a hand holding a rod, the sign of
    one who commands.
  layout: >-
    A leader stands on the left, seen from the front, with a friendly face with eyes, a nose and a
    mouth, in a simple pale robe, holding a staff level out to the right. Below the staff, on the lower
    right, a wide-open mouth gives an order. Soft pale colours.
  exact:
    - The staff is the longest line across, running nearly the whole width of the square, and crosses the arm line and the body line.
    - The forearm line is about half as long as the staff; its right end meets the end of the upper arm line.
    - The body line is the longest stroke down; it starts at the top where the head and arm line start, and ends at the bottom left.
    - The mouth is small, about a third as long as the body line is tall, and is attached to the body line by its left side and its top.
    - The mouth's lower lip rises slightly to the right and meets the end of the top line's hook.
  strokes:
    - where: a line from the upper left across to the right, then turning down at its right end
      part: the leader's head, shoulder and upper arm, turning down at the elbow
    - where: a long line across the upper part, from the left to the right edge, rising slightly
      part: the staff held level
    - where: a line across the middle left, from the body to the right, ending where the upper arm ends
      part: the leader's forearm and hand
    - where: a long stroke from the top left down, curving and sweeping to the bottom left
      part: the leader's body, running down into the left leg
    - where: a short vertical line in the lower middle, starting on the body line
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, ending in a hook down to the left
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom, rising slightly to the right
      part: the lower lip

役:
  object: a walker taking small steps, carrying food in his hand
  history: >-
    An ideogram: a person walking over 彳 with food in hand 殳, a servant on an errand. The oldest forms
    drew a hand holding a tool.
  layout: >-
    A walker is seen from the side, facing right, in the left third of the square: pale body and
    friendly face with eyes, a nose and a mouth at the top, a simple coat, his legs stepping one after the
    other. On the right a small pale table holds a bowl of food, and a hand below it holds the table
    up. Soft warm colours.
  exact:
    - The two upper sweeps of the walker stand apart with a small gap between them; the short one is about half again as long as the other, and the lower one is longer.
    - The vertical starts in the middle of the lower sweep and runs down, ending in a plain point.
    - The first stroke of the walker stands free of the others.
    - The table's left leg and its top line meet at the top; the top line turns down and across.
    - The hand does not touch the table, and a small gap lies under it.
    - The hand's two strokes cross in the middle; the long falling stroke is about as long as the other stroke across.
  strokes:
    - where: a short sweep at the top of the left third, down to the left, free of the others
      part: the back thigh, bent
    - where: a longer sweep below it, down to the left, with a small gap from the first
      part: the back knee and shin
    - where: a straight vertical line down from the middle of the lower sweep to the bottom
      part: the back foot, planted straight
    - where: a short sweep at the top of the right part, down to the left
      part: the table's left leg
    - where: a line from the top of the left leg across, rising slightly, then turning down and across to the right
      part: the table's top and its curved right leg, holding the bowl
    - where: a line across the middle of the right part, turning down to the left in a long sweep
      part: the hand's back and the forearm
    - where: a stroke from the middle, down to the right and then across to the right
      part: the hand's fingers, held under the table

听:
  object: words from a mouth reaching an ear that listens
  history: >-
    An ideogram: words 口 reaching an ear 斤. The oldest forms of the traditional character drew an ear
    with an attentive listener.
  layout: >-
    A small wide-open mouth sits at the left, speaking toward the right. On the right a large pale ear
    seen from the side, its rim at the top and on the left, listening. The ear is skin-coloured with
    soft rose inside. Soft pale colours.
  exact:
    - The mouth is a small open box; its left side and its top line start at the same point, and its lower lip is a short line rising slightly, which touches both.
    - The mouth's lower lip is about a third as long as the top line is wide; the top line is about four fifths of the ear's inner line across.
    - The mouth does not touch the ear.
    - The ear's rim stroke at the top runs to the left; its end touches the start of the long sweep.
    - The ear's long sweep is the longest stroke down, and the inner vertical is about four fifths as long as it.
    - The inner line across rises slightly to the right and starts on the long sweep; the inner vertical starts on the middle of the inner line.
  strokes:
    - where: a short vertical line down the left, from the top to the middle of the mouth
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, turning down at its right end
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, rising slightly
      part: the lower lip
    - where: a short stroke at the top right, running to the left and turning down to the left
      part: the ear's top rim
    - where: a long sweep from the top of the ear, down and out to the bottom left
      part: the ear's back edge
    - where: a long line across the upper middle of the ear, rising slightly to the right
      part: the ear's inner ridge
    - where: a long vertical line down from the middle of the ridge to the bottom
      part: the ear's canal and lobe

聽:
  object: words from a mouth reaching an ear that listens
  history: >-
    An ideogram: words reaching an ear that listens attentively with the heart. The oldest forms drew
    an ear with an attentive listener.
  layout: >-
    A large pale ear seen from the side fills the left side, a small plain wooden post at its foot. On
    the right a wide-open watchful eye with a small cross-shaped mark above it looks on, and below it
    sits a pale rose heart under a short bar. The ear is skin-coloured, the eye pale blue, the heart
    pale rose. A soft warm tone throughout.
  exact:
    - The ear's top bar rises slightly to the right; its left vertical starts at the bar's left end and ends on the long inner line.
    - The ear's long right vertical starts in the middle of the top bar and runs down well below the ear's inner line.
    - The long inner line at the bottom of the ear rises to the right; the right vertical touches it in the middle.
    - The two small dots in the ear stand free and do not touch the right vertical.
    - The small post under the ear has a top bar, a middle bar and a bottom bar rising to the right; the vertical crosses the middle bar; the post stands apart from the long right vertical with a small gap.
    - The eye's top and right line is the longest across line on the right; it ends in a hook to the left.
    - The eye's pupil dot and inner stroke stand free, and touch the eye's lower line.
    - The heart's bar is a free line across above the heart; the heart's left tick and long curve and the two dots stand free of each other.
  strokes:
    - where: a line across the top of the left part, rising slightly to the right
      part: the ear's top rim
    - where: a short vertical line down from the left end of the top rim
      part: the ear's front edge
    - where: a long vertical line down from the middle of the top rim, to the bottom of the left part
      part: the ear's back edge, running down to the lobe
    - where: a small dot in the upper ear, rising to the right
      part: the first fold inside the ear
    - where: a small dot below it, rising to the right
      part: the second fold inside the ear
    - where: a line rising to the right across the middle of the ear, joining the front edge and the back edge
      part: the ear's lower fold
    - where: a short line across below the ear, rising slightly to the right
      part: the post's top bar
    - where: a short line across below it, rising slightly to the right
      part: the post's middle bar
    - where: a short vertical line crossing the middle bar, from the top bar down
      part: the post's upright
    - where: a line rising to the right along the bottom left
      part: the post's foot bar
    - where: a short line across the top of the right part, rising slightly to the right
      part: the cross-shaped mark's bar
    - where: a short line down from above the bar, slanting a little to the right, crossing the bar
      part: the cross-shaped mark's upright
    - where: a short stroke on the left of the eye, slanting down to the right
      part: the eye's left corner
    - where: a long line across the eye's top, turning down at its right and ending in a hook to the left
      part: the eye's upper lid and its right corner
    - where: a small dot inside the eye, slanting down
      part: the eye's iris
    - where: a short vertical line inside the eye, to the right of the iris
      part: the eye's pupil
    - where: a line across the bottom of the eye, rising slightly to the right
      part: the eye's lower lid
    - where: a line across, rising slightly to the right, above the heart
      part: the bar over the heart
    - where: a short stroke at the heart's left, going down to the left
      part: the heart's left edge
    - where: a long stroke from the heart's top, down to the right, along the bottom, rising to the right and ending in a hook to the left
      part: the heart's rounded body
    - where: a small dot near the top of the heart, slanting down to the right
      part: a vessel rising from the top of the heart
    - where: a short stroke at the heart's upper right, slanting down to the right
      part: a second vessel at the heart's upper right

走:
  object: someone running, a person striding off the ground with a bare foot planted below
  history: >-
    An ideogram: someone 土 stepping with their foot 止. The oldest forms drew a person with swinging
    arms running.
  layout: >-
    A person runs in the upper part of the square, seen from the front, with a friendly face with eyes,
    a nose and a mouth, a pale scarf at the neck, a simple pale tunic and arms flung wide. Below, one
    leg ends in a bare pale foot, toes up, planted on a long line of ground. Soft warm colours.
  exact:
    - The scarf is a short line, clearly shorter than the arms, about half as long as the arms.
    - The body line crosses the scarf in its middle and ends on the arms line; the leg below starts at the same point and runs straight down into the foot.
    - The arms line is the longest line across, running almost the whole width of the square.
    - The left sweep of the foot is longer than the foot's middle line, about half as long again, and the ground stroke starts at its upper end.
    - The left sweep stands apart from the arms line with a small gap.
    - The second toe is a short line out to the right of the middle line, about a third as long as the arms line.
  strokes:
    - where: a short line across the upper part, rising slightly to the right
      part: the runner's scarf at the neck
    - where: a stroke from the top down, slanting a little to the right and then straight, crossing the scarf and ending on the arms line
      part: the runner's head and body
    - where: a long line across the middle, rising slightly to the right, nearly the whole width
      part: the runner's arms, flung wide
    - where: a short line down from the end of the body, straight down to the ground
      part: the stepping leg and the foot's long axis
    - where: a short line out to the right from the middle of the foot, rising slightly
      part: the foot's second toe, held out
    - where: a line on the left of the foot, sweeping down to the bottom left
      part: the foot's small toe and outer edge
    - where: a long stroke from the top of the left sweep, down to the right and then across to the bottom right
      part: the ground under the foot

花:
  object: a flower in bloom, plants above and below them a figure standing and another tumbling over
  history: >-
    An ideogram: a flower 艹 in bloom 化, a plant that changes and opens. The right part gives the sound
    and the change.
  layout: >-
    Pale green plants fill the top of the square, with soft pink blossoms behind their stalks. Below
    them, on the left, a small person stands upright, and on the right a small person bows over and curls
    in a tumble, the change that is a bloom. Both have friendly faces with eyes, a nose and a mouth and
    simple pale clothes. Soft colours.
  exact:
    - The plants' line across is long and is crossed by both stalks; the left stalk is shorter than the right, about three quarters as long.
    - The right stalk begins at the very top and the left stalk lower down.
    - The stalks stand apart from the people below them with small gaps.
    - The standing person's sweep goes down to the bottom left; the vertical begins in the middle of the sweep and has a plain end with no hook.
    - The bowing person's back sweep crosses the long stroke in the middle; the long stroke goes down, then across to the right and rises at its end.
    - The long stroke is about twice as long as the back sweep.
  strokes:
    - where: a long line across the top, nearly the width of the square
      part: the plants' stems, joined across
    - where: a short stalk crossing the line, slanting down to the right
      part: the left plant's stalk
    - where: a longer stalk crossing the line at the right, slanting down to the left
      part: the right plant's stalk
    - where: a long sweep from the upper left of the lower part, down and out to the bottom left
      part: the standing person's head and body, running into the left leg
    - where: a short vertical line down from the middle of the sweep
      part: the standing person's right leg
    - where: a sweep at the right, from the upper right down to the left
      part: the bowing person's back
    - where: a long stroke from the top, down, then turning across to the right and rising at its end
      part: the bowing person's body, bent legs and raised feet

护:
  object: a raised hand guarding a home, a hand held up beside a door
  history: 'An ideogram: a hand 扌 guarding a home 户, to protect. The oldest forms drew a hand and a single door.'
  layout: >-
    On the left a pale open hand is held up, fingers spread to both sides, facing right and guarding
    the door. On the right stands a single wooden door in its frame, swinging open a little on its
    pivot. Skin colour and warm wood colours, pale.
  exact:
    - The hand's long upright stroke ends in a hook to the left, and crosses both of the hand's other strokes.
    - The upper finger line rises to the right and is clearly shorter than the door's top frame, about as long as the thumb stroke.
    - The thumb stroke rises to the right and crosses the upright below the finger line.
    - The door's pivot dot stands free of the door's frame, and a small gap lies below it.
    - The door's top frame ends in a hook down to the left; the crossbar ends on the frame's end.
    - The door's sweep starts at the top of the frame and runs down to the bottom left, not touching the hand.
    - The crossbar is about two thirds as long as the top frame.
  strokes:
    - where: a short line across the upper left, rising slightly to the right, crossing the upright
      part: the fingers of the hand, spread to the sides
    - where: a long vertical line down the left, ending in a small hook to the left, crossing the lines across
      part: the hand's middle finger, running down through the palm to the wrist, the hook the wrist
    - where: a line from the lower left rising to the right, crossing the upright
      part: the thumb, spread wide
    - where: a small slanting dot at the top of the right half, free of the others
      part: the pivot at the top of the door
    - where: a line across the upper part of the right half, ending in a hook down to the left
      part: the top of the frame and its short post
    - where: a line across the middle of the right half, rising slightly to the right, ending on the frame's end
      part: the crossbar on the door
    - where: a long sweep from the start of the top line down to the bottom left
      part: the edge of the door, swinging open

即:
  object: a hungry person kneeling over a bowl of food
  history: >-
    An ideogram: a hungry person 卩 kneeling over food 皀, to eat at once. The oldest forms drew a person
    kneeling beside a food vessel.
  layout: >-
    A tall pale food vessel, a bowl of rice on a footed stand, sits on the left half. On the right a
    person kneels facing left toward it, head bent, with a friendly face with eyes, a nose and a mouth
    and a simple pale tunic. Soft warm colours.
  exact:
    - The vessel's rim stroke rises to the right, turns down to the right and then down; its end meets the end of the lowest short stroke inside.
    - The two short strokes inside the bowl rise to the right, stand apart from the vessel's long left wall and stay short, the lower one a little longer than the upper.
    - The vessel's long wall starts at the rim's start and runs down, curving at the bottom and rising to the right.
    - The vessel's foot is a short stroke that ends on the long wall's bend, and stays apart from the lowest inner stroke with a small gap.
    - The kneeling person's head-and-back stroke starts at the same point as the vertical, at the top; its end turns in a hook up to the left.
    - The vertical stroke is the longest stroke on the right, running from the top to near the bottom.
  strokes:
    - where: a stroke at the top of the left half, rising to the right, then turning down to the right, then down
      part: the vessel's rim and its right shoulder
    - where: a short stroke inside the vessel, rising slightly to the right, high up
      part: the grains heaped in the bowl
    - where: a short stroke inside the vessel below it, rising to the right
      part: the grains lower in the bowl
    - where: a long stroke from the top left, down and curving to the right, ending rising at the right
      part: the vessel's left wall and base
    - where: a short stroke inside the lower part, slanting down to the right
      part: the vessel's footed stand
    - where: a line across the top of the right half, turning down on the right and ending in a hook to the left
      part: the kneeling person's bowed head and back, the hook the foot
    - where: a long vertical line down the left of the right half
      part: the kneeling person's chest and thigh

局:
  object: a measuring rule above a mouth in a place where measures are discussed
  history: >-
    An ideogram: a place where measures 尺 are discussed 口. The oldest forms drew a rule held to the
    body, enclosing the speaker.
  layout: >-
    A long pale wooden measuring rule leans across the square, with marks and a hooked end, forming a
    frame open at the bottom. Within the frame, in the lower middle, a small wide-open mouth speaks
    about it. Soft wood and rose colours.
  exact:
    - The rule's top end stroke runs across, rising a little to the right, and ends in a hook down to the left; its start touches the start of the long edge.
    - The mark below it is shorter than the end stroke, about three quarters as long.
    - The long edge is the longest stroke down; the rule's long curved arm is the longest stroke of all.
    - The arm starts in the middle of the long edge, runs across to the right, turns down and ends in a hook up to the left.
    - The mouth is small and sits within the frame; its left side stands apart from the long edge with a small gap.
    - The mouth's left side and its top line start at the same point; its lower lip rises slightly to the right and meets the top line's end.
  strokes:
    - where: a stroke across the top, rising slightly to the right, ending in a hook down to the left
      part: the rule's top end cap
    - where: a shorter line below it, rising slightly to the right, ending at the end cap's end
      part: a mark across the rule
    - where: a long sweep from the top, down and out to the bottom left
      part: the rule's long edge
    - where: a very long stroke starting on the long edge, across to the right, turning down and ending in a hook up to the left
      part: the rule's long curved arm
    - where: a short vertical line in the lower middle, free of the long edge
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, turning down at its right end
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the lower lip
