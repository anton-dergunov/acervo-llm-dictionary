    - Inside the upper box on the right, the middle line across is short, touches the left vertical side, and stops clearly short of the right side, while the lower line across closes the bottom of the box from side to side.
    - In the lower right part, the left vertical and the wide top-and-right stroke meet at the top-left corner, and the right side turns down and ends in a hook to the left.
    - The long vertical down the middle of the right half starts by touching the middle of the upper box's bottom line, crosses the top bar of the lower cloth, and runs straight down well below the cloth's sides to a plain point with no hook.
