弊:
  checked: argon
  object: two hands reaching up from below to tear apart a tattered hanging cloth that is being struck with a stick from the upper right
  history: >-
    An emphatic form of 敝, which drew a piece of cloth 巾 shredded into tatters and beaten with a
    stick held in a hand 攵; 弊 adds a pair of hands 廾 underneath, breaking and tearing the worn cloth
    with both hands.
  layout: >-
    The upper half is split into two parts side by side. On the upper left hangs a pale, frayed
    cloth on a central pole, with loose threads and tears around and inside its rectangular frame.
    On the upper right, a pale hand grips a small stick, striking toward the cloth. Across the lower
    half, a second pair of pale hands and forearms reaches up from the bottom on a wide horizontal
    bar of outstretched wrists to pull the tattered cloth apart.
  exact:
    - In the upper-left cloth, the central vertical line starts high above the frame and crosses straight through the horizontal top edge, ending in a plain point with no hook.
    - The left vertical of the cloth meets the start of the top-and-right frame stroke, which turns down on the right and ends in a small hook to the left.
    - Above the cloth's frame, the left dot and the right short sweep stand free on either side of the central vertical without touching it.
    - Inside the cloth's frame, the left inner sweep touches the middle of the left vertical, while the right inner dot stands completely free.
    - In the upper-right hand, the short rising line starts at the middle of the upper-left sweep, the curved downward sweep starts from the middle of that rising line, and the long right-falling stroke crosses the curved sweep.
    - In the lower half, the long horizontal line spans nearly the full width and is crossed by both lower verticals; the left vertical curves out toward the bottom left, while the right vertical runs straight down to a plain end.
    - The upper-left cloth, the upper-right striking hand, and the lower two-hands component do not touch one another.
  strokes:
    - where: a short dot in the upper left, slanting down to the right
      part: a loose thread flying off the upper left of the tattered cloth
    - where: a short sweep in the upper centre-left, slanting down to the left
      part: a loose thread flying off the upper right of the tattered cloth
    - where: a vertical line down the left side of the upper half
      part: the left edge of the hanging cloth
    - where: a line across the middle of the upper-left quarter, turning down and ending in a small hook to the left
      part: the top hem and right edge of the hanging cloth
    - where: a vertical line down the centre of the upper-left quarter, from near the top straight through the cloth
      part: the central rod and vertical fold of the hanging cloth
    - where: a short sweep inside the left side of the cloth frame, slanting down to the left
      part: a fray tearing inward on the left side of the cloth
    - where: a short dot inside the right side of the cloth frame, slanting down to the right
      part: a fray tearing on the right side of the cloth
    - where: a sweep at the top of the upper-right quarter, slanting down and to the left
      part: the upper end of the stick held above the cloth
    - where: a short line across the upper-right quarter, rising slightly to the right from the middle of the upper sweep
      part: the back of the upper hand gripping the stick
    - where: a curved sweep in the upper-right quarter from the short cross-line down and to the left
      part: the lower end of the stick striking toward the cloth
    - where: a falling stroke across the upper-right quarter, running from near the cloth down and out to the middle right
      part: the wrist and forearm of the upper striking hand
    - where: a long horizontal line across the lower half from left to right
      part: the outstretched wrists and arms linking the two lower hands
    - where: a vertical sweep in the lower-left half, crossing the long horizontal line and curving out to the bottom left
      part: the left hand and forearm reaching up from below
    - where: a straight vertical line in the lower-right half, crossing the long horizontal line down to the bottom
      part: the right hand and forearm reaching up from below
