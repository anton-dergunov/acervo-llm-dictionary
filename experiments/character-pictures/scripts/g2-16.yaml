# Full run, group g2, batch 16. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

壳:
  checked: argon
  dropped: The character is a simplification of a phono-semantic compound with no pictographic or ideographic reading in the scholarly origin, so picturing the folk mnemonic would teach a false etymology.

碩:
  checked: argon
  dropped: Depicting 碩 as a scene of a stone and a head would teach a false etymology, since 石 serves only as the phonetic component.

俠:
  checked: argon
  object: a chivalrous person standing on the left beside a tall protector on the right who holds two smaller people sheltered under outstretched arms
  history: >-
    An ideogrammic compound combining a person 亻 on the left with 夾 on the right, which itself shows
    a large person 大 supporting two smaller people 从 beneath the arms: a knight-errant who stands by
    and protects others.
  layout: >-
    On the left, a standing person in profile faces right toward the group. On the right, a tall
    figure stands facing forward with both arms stretched wide, sheltering two smaller figures
    tucked beneath the left and right arms, one on each side of the tall figure's torso. All the
    people have friendly faces with eyes, a nose and a mouth, and wear simple pale robes.
  exact:
    - The standing person on the left and the group on the right do not touch each other.
    - In the left person, the vertical line starts from the middle of the upper left sweep and runs straight down to a plain end with no hook.
    - In the tall figure on the right, the long central sweep starts at the top, crosses the middle of the horizontal arm line, and curves down to the bottom centre-left.
    - The tall figure's right leg sweep starts on the lower middle of the long central sweep and runs down and out to the bottom right.
    - Beneath the horizontal arm line sit two small figures, one to the left of the long central sweep and one to its right; neither small figure touches the long central sweep or the horizontal line above.
    - In each of the two small figures, a short sweep down to the left is touched at its middle by a short dot slanting down to the right.
  strokes:
    - where: a sweep in the left part from the upper left down and out to the middle left
      part: the left person's leaning upper body and arm
    - where: a straight line down the left part from the middle of the upper left sweep to the bottom left
      part: the left person's standing torso and legs
    - where: a line across the upper middle of the right part, rising slightly to the right
      part: the tall protector's two outstretched arms
    - where: a long sweep from the top centre down through the horizontal arm line, curving out to the bottom centre-left
      part: the tall protector's body and left leg
    - where: a falling stroke from the lower middle of the long central sweep down and out to the bottom right
      part: the tall protector's right leg
    - where: a short sweep down to the left, under the left side of the horizontal arm line and to the left of the long central sweep
      part: the left small person's body and left leg
    - where: a short dot slanting down to the right from the middle of the left small sweep
      part: the left small person's right leg
    - where: a short sweep down to the left, under the right side of the horizontal arm line and to the right of the long central sweep
      part: the right small person's body and left leg
    - where: a short dot slanting down to the right from the middle of the right small sweep
      part: the right small person's right leg

