夹:
  checked: argon
  object: a tall central man standing with arms stretched wide and a pin across his head, with two smaller people tucked closely on either side of his torso
  history: >-
    The traditional form 夾 is an ideogrammic compound showing a central person (大) flanked by two
    smaller people (人) tucked under his arms on either side. The simplified form 夹 merges the top
    into the capped man 夫 and reduces the two flanking people to two inward-slanting strokes between
    the upper line and the outstretched arms.
  layout: >-
    A tall man fills the frame from top to bottom, facing forward with his arms stretched wide along
    the lower horizontal line and a hairpin across his topknot at the upper line. Tucked into the
    spaces on the left and right of his chest, just above his outstretched arms, two smaller figures
    lean inward toward his body along the two short side strokes. All three people have friendly
    faces with eyes, a nose and a mouth, and wear simple pale clothes.
  exact:
    - The upper line across is clearly shorter than the lower line across, a little over half as long.
    - The long central sweep starts well above the upper line across, crosses the middle of both lines across, and curves out to the bottom left.
    - The two short strokes between the two lines across slant inward toward the central vertical and stand completely free, touching no other stroke.
    - The lower right falling stroke starts right where the lower line across and the central vertical sweep cross.
  strokes:
    - where: a short line across the upper part, rising slightly to the right, clearly shorter than the lower line across, a little over half as long
      part: the hairpin across the central man's head
    - where: a short stroke on the left side between the two lines across, slanting down and inward to the right
      part: the small person tucked on the left side, leaning in toward the central man
    - where: a short sweep on the right side between the two lines across, slanting down and inward to the left
      part: the small person tucked on the right side, leaning in toward the central man
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the central man's two arms, stretched wide beneath the two flanking figures
    - where: a long sweep from the top centre, straight down through the middle of both lines across, then curving out to the bottom left
      part: the central man's head, torso and left leg
    - where: a long falling stroke from the central crossing of the lower line across and the vertical sweep, running down and out to the bottom right
      part: the central man's right leg

亭:
