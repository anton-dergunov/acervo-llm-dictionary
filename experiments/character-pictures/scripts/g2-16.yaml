  history: >-
    Created as a variant of 綿 (fine silk floss) by replacing the silk thread component 糸 with a tree
    木, because cotton came from a tree yet yielded white cloth like silk 帛. The right side combines
    白 (white, a white tuft or boll above) and 巾 (a hanging cloth below).
  layout: >-
    The picture is split into two halves side by side. The left half is a cotton tree with pale
    green leaves around its upper branches and trunk. The right half is slightly wider and taller:
    its upper part is a plump, soft cream-white cotton boll framed by the box of 白, and its lower
    part is a pale warm-grey and cream hanging cloth 巾 draped beneath the boll, with a long central
    pleat running down to the bottom.
