    frame to a single chevron pair.
  layout: >-
    An open mouthSeen from the front fills the square. In the upper half, pale white upper teeth and
    a soft pink upper gum sit behind the vertical and horizontal dividers above the wide middle bar.
    In the lower half, the U-shaped outer frame forms the open lower jaw and lower lip, enclosing a
