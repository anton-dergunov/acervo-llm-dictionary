  dropped: Because 丁 is purely a phonetic component attached to an abbreviated tower radical and the origin gives no pictographic or ideographic reading of the whole character, depicting 丁 as part of a pavilion would teach a false etymology.

串:
  checked: argon
  object: two wide rectangular beads strung one above the other on a long vertical skewer
  history: >-
    The oldest forms drew two objects pierced through the middle by a single vertical rod or cord to
    show things strung together. The modern form keeps the two rectangular shapes stacked on the
    central vertical line.
  layout: >-
    A long straight skewer runs vertically down the middle of the frame from near the top to near
    the bottom. Two flat rectangular beads or blocks are threaded onto it one above the other, with
    the lower bead slightly wider and taller than the upper one. The beads are shaded in soft pale
    jade green or warm tan behind the strokes, with the wooden or metal skewer passing cleanly
    through both.
  exact:
    - The upper rectangular box and the lower rectangular box are separated by a clear gap and do not touch each other.
    - The lower box is slightly wider and taller than the upper box, with its top-and-right stroke being the widest part of the character and the upper box's top-and-right stroke about five-sixths as long.
    - In both boxes, the left side slants down to the right, the top line turns down to the left at the right corner, and the bottom line closes the shape between them.
    - The long central vertical line starts above the upper box, crosses straight through the top and bottom lines of both boxes, and extends well below the lower box, ending in a plain point with no hook.
  strokes:
    - where: a short line in the upper half slanting down and slightly to the right on the left side
      part: the left side of the upper strung bead
    - where: a line across the top of the upper half that turns sharply at the right corner to slant down to the left
      part: the top and right side of the upper strung bead
    - where: a line across the middle of the upper half, closing the upper box from left to right
      part: the bottom edge of the upper strung bead
    - where: a short line in the lower half slanting down and slightly to the right on the left side
      part: the left side of the lower strung bead
    - where: a wide line across the top of the lower half that turns sharply at the right corner to slant down to the left
      part: the top and right side of the lower strung bead
    - where: a line across the lower half, rising slightly to the right to close the lower box
      part: the bottom edge of the lower strung bead
    - where: a long straight vertical line right down the centre from the top to the bottom, piercing both boxes
      part: the long skewer threading both beads together

樽:
  checked: argon
  dropped: It is a purely phono-semantic compound according to the scholarly origin, so drawing a combined scene would teach a false etymology.

辨:
  checked: argon
  dropped: The character is classified as a phono-semantic compound (ls=psc) rather than a pure ideogram, and the script's depiction of two sprouting tree shoots separated by a knife teaches a false etymology.
  object: two sprouting woody stems with shoot crowns on the left and right, separated down the middle by a curved knife blade
  history: >-
    Originally formed from a knife (刀) placed between two 辛 components (辡), understood as a knife
    dividing two like sides or alternatives in order to tell them apart.
  layout: >-
    Three upright parts stand side by side across the square without touching. On the left and right
    are two matching woody stems with pale green sprouting shoot crowns at the top and pale brown
    bark along their lower stems; the right stem sits slightly higher at the top and reaches lower
    at the bottom than the left stem, while the left stem curves outward to the bottom left. Between
    them in the centre hangs a pale steel knife blade curving down to the left, cleanly dividing the
    two plants.
  exact:
    - The left plant, the central knife, and the right plant do not touch one another.
    - The right plant starts higher and reaches lower than the left plant.
    - In both outer plants, the top slanting stroke and the left inner dot stand free, and the upper bar is about two thirds as long as the wide middle bar.
    - In the left plant, the right inner stroke starts just below the upper bar without touching it and ends on the wide middle bar, whereas in the right plant the right inner stroke touches both the upper bar and the wide middle bar.
    - In the left plant, the lower bar is about two thirds as long as the wide middle bar and the stem curves down to the bottom left; in the right plant, the lower bar is nearly as long as the wide middle bar and the stem runs straight down to a plain point with no hook.
    - In the centre, the short dot and the long curved blade sweep stand completely free of each other and of the outer plants.
  strokes:
    - where: a short stroke at the top of the left third, slanting down to the right
      part: the top bud at the tip of the left shoot crown
    - where: a line across the upper part of the left third, rising slightly to the right, about two thirds as long as the wide bar below it
      part: the upper rim of the left shoot crown
    - where: a short dot on the left below the upper bar of the left third, slanting down to the right
      part: the left inner shoot of the left crown
    - where: a short stroke on the right below the upper bar of the left third, slanting down to the left to touch the wide bar below
      part: the right inner shoot of the left crown
    - where: a wide line across the middle of the left third, rising slightly to the right
      part: the wide crown base of the left shoots
    - where: a line across the lower part of the left third, rising slightly to the right, about two thirds as long as the wide bar above it
      part: the side branch line across the left stem
    - where: a long stroke from the middle of the left wide bar down through the lower bar, curving out to the bottom left
      part: the left plant's main woody stem, curving left at the base
    - where: a short dot in the centre, to the left of the long central sweep, slanting down to the right
      part: the short side guard of the central knife
    - where: a long stroke down the centre from the upper middle, curving down and to the left in the lower middle
      part: the long curved blade of the central knife separating the two plants
    - where: a short stroke at the top of the right third, slanting down to the right
      part: the top bud at the tip of the right shoot crown
    - where: a line across the upper part of the right third, rising slightly to the right, about two thirds as long as the wide bar below it
      part: the upper rim of the right shoot crown
    - where: a short dot on the left below the upper bar of the right third, slanting down to the right
      part: the left inner shoot of the right crown
    - where: a short stroke on the right from the upper bar of the right third, slanting down to the left to touch the wide bar below
      part: the right inner shoot of the right crown
    - where: a wide line across the middle of the right third, rising slightly to the right
      part: the wide crown base of the right shoots
    - where: a line across the lower part of the right third, rising slightly to the right, nearly as long as the wide bar above it
      part: the side branch line across the right stem
    - where: a long straight vertical line from the middle of the right wide bar down to the bottom, crossing the lower bar
      part: the right plant's main woody stem

尘:
  checked: argon
  object: small grains of dust floating in the air above a mound of earth on the flat ground
  history: >-
    An ancient variant and modern simplified form of 塵, replacing the deer with the component for
    small (小) above earth (土) to form an ideogrammic compound meaning fine particles of dirt or
    dust.
  layout: >-
    In the upper half, three pale tan grains of dust float in the air, the middle one a tall
    vertical sliver and the side ones short slanting specks to its left and right. In the lower half
    sits a pale brown and ochre mound of earth on the flat ground, slightly wider than the cluster
    of dust grains above it. A faint, pale dusty haze surrounds the three upper grains behind the
    strokes.
  exact:
    - The three strokes of the upper component all stand completely free of one another and of the earth component below.
    - The upper vertical stroke ends in a plain point near the centre with no hook, leaving a small gap above the top of the lower vertical stroke so that the two verticals do not join into one line.
    - In the lower half, the upper line across is clearly shorter than the bottom line across, a little over half as long.
    - The lower vertical stroke crosses the shorter line across at the middle of both and ends on the middle of the long bottom line without crossing it.
  strokes:
    - where: a straight vertical line down the upper centre, ending in a plain point near the middle with no hook
      part: the tall central sliver of dust floating in the air
    - where: a short sweep in the upper left, slanting down to the left beside the upper vertical
      part: the left grain of dust
    - where: a short stroke in the upper right, slanting down to the right beside the upper vertical
      part: the right grain of dust
    - where: a line across the lower middle, clearly shorter than the bottom line, a little over half as long, rising slightly to the right
      part: the broad middle of the mound of earth
    - where: a vertical line down the lower centre, starting just below the upper vertical and running down to touch the middle of the bottom line
      part: the upright core of the mound of earth
    - where: a long line across the bottom, spanning nearly the full width
      part: the flat ground beneath the mound of earth

羞:
  checked: argon
  dropped: Since 丑 is purely a phonetic component rather than an ideographic part of a scene, illustrating the character would teach a false etymology.

陶:
  checked: argon
  object: a stepped mound of clay on the left, and a potter bending over an earthenware jar on the right
  history: >-
    Oracle bone and bronze forms drew people digging earth from a mound of clay. By seal script the
    inner earth had become an earthenware jar 缶 under a bending figure 勹, beside the clay mound 阝:
    clay from the hill shaped into pottery.
  layout: >-
    The left side is a narrow tall bank of pale terracotta clay with two rounded terraces on its
    right edge. Filling the wider right side, a potter bends forward to the left over a
    round-bellied clay jar tucked beneath his arched back. The potter has a small head at the top
    with a face (eyes, nose and mouth) looking down at the jar and wears simple pale clothes.
  exact:
    - The left mound and the right potter-and-jar group do not touch.
    - On the far left, the long straight vertical ends in a plain point at the bottom with no hook; the double-curved terrace stroke starts at the top of that vertical and ends in a hook to the left at mid-height.
    - At the top of the right part, the sweep down to the left is touched at its middle by the long wrapping stroke, which runs across to the far right, turns down to the bottom, and ends in a hook up to the left.
    - Inside the wrap, the jar sits below the top sweep with a small gap between them, and none of the jar's strokes touch the long right wrapping stroke.
    - At the top of the jar, the short upper line across starts from the middle of the small left sweep; it is about three-fifths as long as the wider middle line across below it.
    - The jar's central vertical starts from the middle of the upper line across, crosses the middle line across, and ends on the bottom horizontal leg of the lower L-shaped stroke.
    - The lower U-shaped base sits below the middle line across with a clear gap on both sides; the left vertical turns right to form the bottom and ends against the middle of the short right vertical.
  strokes:
    - where: a stroke in the upper left starting at the top of the left vertical, running across, bending in and curving out again to end in a hook to the left at mid-height
      part: the two stepped terraces of the clay mound
    - where: a long straight line down the far left, from top to bottom, with no hook
      part: the sheer cut face of the clay mound
    - where: a sweep from the top centre down and to the left
      part: the potter's arm reaching down toward the clay jar
    - where: a long stroke starting from the middle of the top sweep, running across to the top right, turning down the far right side to the bottom and ending in a hook up to the left
      part: the potter's arched back and kneeling legs, curving around the jar
    - where: a short sweep slanting down to the left beneath the potter's arm
      part: the flared left lip of the jar's rim
    - where: a short line across the upper middle, starting from the middle of the short sweep and rising slightly to the right
      part: the narrow mouth and rim of the clay jar
    - where: a longer line across the centre, below the rim
      part: the wide shoulder of the clay jar
    - where: a vertical line down the middle of the jar, from the middle of the rim across the shoulder to the base
      part: the central vertical rib down the body of the clay jar
    - where: a short vertical on the lower left of the jar that turns sharply to run across the bottom to the right
      part: the lower left wall and flat base of the clay jar
    - where: a short vertical line down the lower right of the jar, touched at its middle by the right end of the base
      part: the lower right wall of the clay jar

夾:
  checked: argon
  object: a tall person standing front-on with arms outstretched, flanked by two smaller people tucked under either arm supporting them from both sides
  history: >-
    An ideogrammic compound combining a standing person facing forward in the centre with two
    smaller side-view figures tucked beneath the arms on the left and right, showing someone
    supported or wedged from both sides.
  layout: >-
    The tall central person fills the square from top to bottom, facing forward with arms stretched
    wide above the two smaller figures. Two smaller people stand tucked beneath the left and right
    arms in the middle band, leaning in toward the central person's sides. All three people have
    friendly faces with eyes, a nose and a mouth, and wear simple pale clothes in soft muted tones.
  exact:
    - The long central sweep starts at the top centre, crosses the middle of the upper line across, and curves out to the bottom left.
    - The central person's right leg starts on the central sweep at the middle of the character and sweeps down and out to the bottom right.
    - The two smaller figures sit in the middle band below the left and right ends of the upper line across, and neither touches the upper line across or the central person's strokes.
    - Each smaller figure is made of a short sweep down to the left, only about a fifth as long as the central sweep, with an even shorter stroke slanting down to the right from its middle.
    - The left smaller figure's right-falling stroke is a tiny dot that stops short of the central sweep; the right smaller figure's left sweep stops just above where the central person's right leg begins.
  strokes:
    - where: a line across the upper middle, rising slightly to the right
      part: the central person's outstretched arms, from hand to hand
    - where: a long sweep from the top centre down through the middle, then curving out to the bottom left
      part: the central person's torso, running down into the left leg
    - where: a long falling stroke from the middle of the central sweep down and out to the bottom right
      part: the central person's right leg
    - where: a short sweep in the middle left, below the left end of the upper line across, curving down to the left
      part: the left supporting person's body and outer leg
    - where: a short dot-like stroke from the middle of the left short sweep, slanting down to the right
      part: the left supporting person's inner leg
    - where: a short sweep in the middle right, below the right end of the upper line across, curving down to the left
      part: the right supporting person's body and inner leg
    - where: a short stroke from the middle of the right short sweep, slanting down to the right
      part: the right supporting person's outer leg

硕:
