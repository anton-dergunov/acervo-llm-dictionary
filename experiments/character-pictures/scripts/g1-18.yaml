# Full run, group g1, batch 18. Written from the fact sheets, following scripts/GUIDE.md.

般:
  object: a hand holding a short tool, sorting small items on a shallow boat-shaped tray
  history: >-
    An ideogram: a hand holding a tool 殳 beside a tray 舟, sorting things into kinds. The tray is the
    old picture of a small boat seen from above.
  layout: >-
    The tray fills the left side: a small wooden boat-shaped tray seen from above, its prow at the top,
    with a few small pale items sitting in it. On the right a hand reaches in from the right holding a
    short tool whose head is raised above it, the hand below the head. Pale wood and soft colours.
  exact:
    - The tray and the hand with the tool do not touch each other.
    - The plank across the middle crosses the tray's left side and sticks out a little beyond it; on the right it ends on the right side.
    - The two dots inside the tray stand free, one above and one below the long stroke across.
    - The tray's right side is one stroke, turning down from the top and ending in a small hook to the left.
    - The hand's two strokes cross each other; the upper one runs across and turns down to the left, the lower one is the long falling stroke to the right.
    - The tool's head has two strokes that start at one point at the top; the second ends in a small hook then runs to the right.
  strokes:
    - where: a short slanting stroke at the top of the left half, running down to the right and then turning down to the left
      part: the pointed prow of the tray
    - where: a long line down the left side, from the prow down to the bottom left
      part: the left side of the tray
    - where: a line across the top of the tray, turning down to run down the right side, ending in a small hook to the left at the bottom
      part: the right side of the tray, its stern turning in
    - where: a short dot inside the tray, above the middle
      part: a small item on the tray
    - where: a long line across the middle, rising slightly to the right, crossing the left side and ending on the right side
      part: a plank laid across the tray
    - where: a short dot inside the tray, below the middle
      part: a second small item on the tray
    - where: a short stroke at the top of the right half, running down and turning down to the left
      part: the left edge of the tool's raised head
    - where: a line across the top of the right half from the head's start, turning down and then across to the right, ending in a small hook
      part: the top and right edge of the tool's head, then its handle
    - where: a line across the upper middle of the right half, turning down to the left, ending in a sweep to the bottom
      part: the hand's upper edge, turning into the wrist
    - where: a long falling stroke from the middle of the right half down and out to the bottom right, ending by running across
      part: the hand's arm, reaching in from the right

讀:
  object: a seller at a stall showing off his learning, words coming out of a speaking mouth beside a stall hung with a net over a shell
  history: >-
    An ideogram: showing off 賣 one's literacy 言. 言 is a mouth with words coming out of it; 賣 is
    selling, goods under a net, here a signpost over a net and a shell.
  layout: >-
    The left third is a large open mouth with two lines of speech rising from it and a small flag above;
    everything pale pink and cream. The right two thirds is a market stall seen from the front, with a
    signpost standing on top, a pale net hung over the middle of the stall, and a cowrie shell below the
    net. A friendly seller stands behind the stall, with a face and simple pale clothes, his body hidden
    below the shell.
  exact:
    - The mouth and the stall do not touch each other.
    - The speech sign has a small slanting stroke above a long line across; the two lines of speech below are short and stand free of it.
    - The mouth is made of a short vertical on the left, a stroke that rises to the right then turns down, and a short line at the bottom; the vertical and the bottom line meet the stroke at its two ends.
    - The signpost's vertical crosses the long bar and ends on the shorter bar below it.
    - The net's top stroke ends in a small hook down to the left; the two small dots hang from it and touch the net's bottom line.
    - The net and the shell do not touch.
    - The shell's two long strokes start at one point; the vertical ends where the bottom ridge starts, and the two feet at the bottom do not touch the shell or each other.
  strokes:
    - where: a small slanting stroke at the top of the left third, running down to the right
      part: the small flag above the speaker
    - where: a long line across the left third, rising slightly to the right
      part: the top edge of the speech
    - where: a short line across below the long line, rising slightly to the right
      part: the first line of speech
    - where: a short line across below, rising slightly to the right, a little shorter than the one above
      part: the second line of speech
    - where: a short line down at the lower left of the left third
      part: the left side of the mouth
    - where: a stroke that rises to the right from the top of that line and then turns down at its right end
      part: the top and right side of the mouth
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the bottom lip
    - where: a long line across the top of the right part, rising slightly to the right
      part: the signpost's long bar
    - where: a short vertical line down through the middle of the long bar
      part: the signpost's post
    - where: a shorter line across below the long bar, rising slightly to the right, where the post ends
      part: the signpost's lower bar
    - where: a short line down to the right at the left of the stall, just under the signpost
      part: the net's left edge
    - where: a long line across from the net's left edge, ending in a small hook down to the left at the right end
      part: the net's top edge and its right corner
    - where: a short dot below the top edge, left of centre
      part: a knot of the net
    - where: a short dot below the top edge, right of centre
      part: a second knot of the net
    - where: a line across at the bottom of the net, rising slightly to the right
      part: the net's lower edge
    - where: a vertical line down the left of the shell
      part: the shell's left edge
    - where: a stroke from the top of the shell across to the right, then turning down
      part: the shell's top and right edge
    - where: a short line across inside the shell, rising slightly to the right
      part: the shell's upper ridge
    - where: a short line across below it, rising slightly to the right
      part: the shell's middle ridge
    - where: a short line across below it, at the bottom of the shell
      part: the shell's lower lip, closing the shell
    - where: a short sweep below the shell at the left, down to the left
      part: the shell's left foot
    - where: a short stroke below the shell at the right, down to the right
      part: the shell's right foot

读:
  object: a seller at a stall showing off his learning, words coming out of a speaking mouth beside a stall hung with a net over a shell
  history: >-
    An ideogram: showing off 卖 one's literacy 讠. 讠 is the speaking sign, words coming out of a mouth;
    卖 is selling, here a signpost over a stall with goods on a table.
  layout: >-
    The left third is a speaking sign: a small slanting mark above a tall curved stroke like the line of
    a mouth speaking, in pale pink. The right two thirds is a market stall seen from the front, a
    signpost standing on top, an awning hung under it, and a small table with two small items on it. A
    friendly seller stands behind the table, with a face and simple pale clothes, only his head and
    shoulders showing.
  exact:
    - The speaking sign and the stall do not touch each other.
    - The speaking sign's long stroke rises to the right, then turns down and ends in a small hook up to the right.
    - The signpost's bar is a little over half as long as the awning below it; its post crosses the bar and ends on the awning.
    - The awning is one long stroke ending in a small hook down to the left, the longest line of the stall.
    - The two small items stand free of everything.
    - The table top is a long line across, nearly as long as the awning, and it is crossed by the table's long leg; it does not touch the speaking sign.
    - The table's long leg ends in a sweep to the left and does not hook.
  strokes:
    - where: a small slanting mark at the top of the left third, running down to the right
      part: a word spoken from above
    - where: a long stroke starting at the middle of the left third, rising slightly to the right, then turning down to the bottom with a small hook up to the right
      part: the speaker's mouth line, curving down
    - where: a short line across the top of the right part, rising slightly to the right
      part: the signpost's bar
    - where: a short stroke from the top running down, crossing the bar and turning down a little further
      part: the signpost's post
    - where: a long line across below the post, ending in a small hook down to the left at the right
      part: the awning of the stall
    - where: a short dot below the awning at the left
      part: a small item on the table
    - where: a short dot below it, a little to the left
      part: a second small item on the table
    - where: a line across the lower part, rising slightly to the right, nearly as long as the awning
      part: the table top
    - where: a long stroke starting inside the awning, going down and sweeping to the bottom left, crossing the table top
      part: the table's long left leg
    - where: a short stroke at the bottom right, running down to the right
      part: the table's right leg

旅:
  object: a man travelling with a pack on his back
  history: >-
    The oldest forms drew people gathered under a banner, a company on the march. The modern form kept
    a man 方 and a pack 氏.
  layout: >-
    The man fills the left half and faces left, walking, with a friendly face and a simple pale tunic.
    The pack on his back fills the right half and stands behind him, tied at the top with a strap, in
    soft pale brown canvas.
  exact:
    - The man's line across, his arms, is the longest line of the left half and rises slightly to the right; his front leg starts on it.
    - The man and the top of the pack do not touch; the pack's top bar stands near the top right and does not reach him.
    - The man's second long stroke starts at the left end of his body line and turns twice, ending in a small hook up to the left.
    - The pack's two small strokes at the top form a slanting stroke with a line across through it.
    - The pack's lower body stroke is a long bend ending in a small hook up to the right.
    - The pack's strap runs from the middle down to the bottom right and does not touch the short stroke above it.
  strokes:
    - where: a short stroke at the top of the left half, slanting down to the right
      part: the man's head
    - where: a long line across the left half, rising slightly to the right
      part: the man's arms, held out for balance
    - where: a stroke starting just below the arms at the left, going across to the right, turning down and ending in a small hook up to the left
      part: the man's back and rear leg
    - where: a stroke starting at the middle of the arms line, going down and sweeping to the bottom left
      part: the man's front leg, stepping forward
    - where: a stroke at the top of the right half, running down to the right and then turning down to the left
      part: the pack's top flap
    - where: a line across the top of the right half, rising slightly to the right, through the flap
      part: the strap tying the pack shut
    - where: a short stroke below the flap, running down and turning down to the left
      part: the pack's hanging strap end
    - where: a long stroke starting at the left of the lower right half, going down and bending up to the right at the bottom
      part: the pack's rounded back
    - where: a short stroke at the upper right, running down to the right and turning down to the left
      part: the pack's side flap
    - where: a long stroke starting inside the pack, running down to the right and then across to the right
      part: the pack's carrying strap and lower edge

酒:
  object: a jar of wine with its lid, and splashes of water beside it
  history: >-
    The oldest forms drew a pointed jar with a narrow neck and wine in it. Water 氵 was added at its
    side, for liquid.
  layout: >-
    On the left two small splashes of water and a long curved stream rising between them, in pale blue.
    On the right a tall clay jar with a narrow neck and a flat rim, pale terracotta, with pale wine
    showing inside the body.
  exact:
    - The water and the jar do not touch each other.
    - The two splashes are short slanting strokes; the third stroke of the water is a long rising stroke, not a splash.
    - The jar's neck is two vertical strokes, the right one ending in a small hook to the right; they hang from the rim and stay inside it.
    - The jar's left side starts at the shoulder line and runs down to the bottom; the shoulder line runs across and turns down on the right, ending in a small hook to the left.
    - The jar's shoulder line starts near the left neck stroke and crosses it.
    - The line inside the jar, the wine level, is short and stands free of the sides.
    - The jar's bottom line ends where the right side ends.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: a splash of water, upper
    - where: a short stroke below it, slanting down to the right
      part: a second splash of water
    - where: a long stroke rising from the bottom left to the middle right of the left part
      part: the water, flowing up and out in a long curve
    - where: a long line across the top of the right part, rising slightly to the right
      part: the jar's flat rim
    - where: a stroke starting at the left of the jar's body, slanting a little to the right and then down to the bottom
      part: the jar's left side
    - where: a stroke from the left side across the jar, turning down on the right and ending in a small hook to the left at the bottom
      part: the jar's shoulder and right side
    - where: a short vertical line hanging from the rim, left of centre
      part: the jar's left neck
    - where: a short vertical line hanging from the rim, right of centre, ending in a small hook to the right
      part: the jar's right neck
    - where: a short line across inside the jar's body
      part: the level of the wine
    - where: a line across at the bottom of the jar, rising slightly to the right
      part: the jar's base

射:
  object: a drawn bow, an arrow ready, and a hand pulling it
  history: >-
    The oldest forms drew a bow with an arrow, and a hand drawing it. Later the bow was written as a
    body 身 and the hand as an inch 寸.
  layout: >-
    The bow fills the left half, standing upright, its string pulled back to the right, with a pale
    arrow lying across it. On the right a hand and forearm come in from the right, pulling the string.
    Pale wood and soft colours.
  exact:
    - The bow and the hand do not touch.
    - The bow's two small strokes in the middle are short dots, side by side, one above the other, and stand free of the long curved stroke.
    - The long curved stroke goes across the top of the bow, turns down and ends in a small hook up to the left.
    - The arrow, a line rising to the right, and the lower limb, a sweep to the lower left, start at the same point on the bow.
    - The hand's arm crosses its vertical.
    - The hand's vertical is nearly as long as the bow is tall and ends in a small hook up to the left.
    - The thumb is a small dot standing free.
  strokes:
    - where: a short stroke at the top, running down to the right and turning down to the left
      part: the bow's upper tip
    - where: a short straight line down from the tip
      part: the bow's string, upper part
    - where: a long stroke across the top, turning down along the right side of the bow to the bottom and ending in a small hook up to the left
      part: the bow's curved limb
    - where: a short dot on the string, rising slightly to the right
      part: a tie on the string, upper
    - where: a short dot below it, rising slightly to the right
      part: a tie on the string, lower
    - where: a line at the lower left rising to the right
      part: the arrow, resting across the bow
    - where: a sweep from where the arrow ends, down to the bottom left
      part: the bow's lower tip
    - where: a long line across the upper middle of the right half, rising slightly to the right
      part: the hand's forearm, pulling the string
    - where: a long vertical line down the right half, crossing the forearm and ending in a small hook up to the left
      part: the hand and wrist
    - where: a small dot below the forearm at the left of the right half
      part: the thumb

健:
  object: a strong person beside a wall being built, courses laid one on another around a straight post
  history: >-
    An ideogram: a person 亻 who can build 建. 建 also gives the sound. 建 is a hand holding a rod
    over a stride, the act of setting up.
  layout: >-
    A strong person with a friendly face and simple pale clothes stands on the left, arms by his sides.
    To the right of him, a wall built of five pale stone courses, each a little shorter than the one
    below the top, stands around a long vertical post, resting on a long pale foundation that starts at
    the person's feet and runs out to the right.
  exact:
    - The person and the wall do not touch except through the foundation that begins at his feet.
    - The wall's top stroke goes across and turns down, its end meeting the end of the third course.
    - The second course is the longest; the courses below it get shorter, the fourth the shortest, and the lowest is longer again, about three quarters as long as the second.
    - The post crosses every course and is the tallest line in the picture.
    - The post stops just above the foundation without touching it.
    - The person's second stroke is straight and vertical, starting from the middle of his first and standing apart from the foundation.
  strokes:
    - where: a long stroke at the top left, going down and sweeping to the bottom left
      part: the person's body and left leg
    - where: a vertical line down from the middle of the first stroke to the bottom
      part: the person's right leg
    - where: a short line across the top of the wall's left, rising slightly to the right, turning down at its right end
      part: the wall's top course and its rim
    - where: a long line across below, rising slightly to the right
      part: the wall's second course, the longest
    - where: a line across lower down, rising slightly to the right, about two thirds as long
      part: the wall's third course
    - where: a shorter line across lower down, about half as long as the second course
      part: the wall's fourth course
    - where: a line across lower down, rising slightly to the right, about three quarters as long
      part: the wall's fifth course
    - where: a long vertical line down the right half, from the very top to the bottom, crossing every course
      part: the post the wall is built around
    - where: a line across at the middle left, rising slightly to the right, turning down at its right end and then down to the left at the bottom
      part: the foundation's left post and edge
    - where: a long stroke from the bottom left, running down to the right and then out across to the right
      part: the long foundation, running out to the right

席:
  object: a straw mat and a cloth laid down in a house with a lean-to roof
  history: >-
    An ideogram: a house 广 with a mat of cloth 巾 or of straw 艹 laid in it, a seat.
  layout: >-
    A lean-to building fills the left and top: its roof across the top and its wall down the left side.
    Inside the house, at the top, a mat of straw lies across, plaited from a row of straw stalks, pale
    gold. Below it a pale cloth hangs from the mat's centre, its folds falling to the ground. The
    building is pale and soft.
  exact:
    - The roof's ornament, a small dot above it, stands free.
    - The wall starts at the roof's left end and runs down and sweeps to the bottom left.
    - The straw mat's long line across does not touch the wall.
    - The two short strokes through the mat are not the same height; the left one is a little longer.
    - The cloth's left side stands apart from its top line; its top line starts on the left, runs across, turns down and ends in a small hook to the left.
    - The cloth's tall middle line starts on the mat's short bar and is the longest vertical, going nearly to the bottom.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's small ornament
    - where: a line across the upper part, from the top of the wall to the right, rising very slightly to the right
      part: the roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the wall of the house
    - where: a long line across the upper middle, a little shorter than the roof
      part: the straw mat's top edge
    - where: a vertical line down through the left of the mat's line, ending at the mat's lower bar
      part: the first row of straw stalks
    - where: a short stroke through the right of the mat's line, running down and turning down
      part: the second row of straw stalks
    - where: a short line across below the mat, rising slightly to the right, from the lower end of the straw stalks
      part: the mat's lower edge
    - where: a short vertical line at the left of the lower part
      part: the cloth's left edge
    - where: a line across from the cloth's left edge, turning down at the right and ending in a small hook to the left
      part: the cloth's top edge and right edge
    - where: a tall vertical line down the middle from the mat's short bar nearly to the bottom
      part: the cloth's centre fold

班:
  object: two pieces of jade with a knife between them, cutting jade in two
  history: >-
    An ideogram: a knife 刂 cutting a piece of jade 王 in two, a division into two classes.
  layout: >-
    Two pieces of pale green jade stand side by side. The left is narrower and a little shorter; the
    right is wider and taller. Between them, a small knife with a pale steel blade and a short handle
    stands upright, cutting the stone. The jade pieces are carved stone, each a stack of three flat
    slabs on a straight cord.
  exact:
    - The left jade is narrower and a little shorter than the right jade.
    - In each jade the bottom slab is the longest and the other two are a little over half as long.
    - In each jade the cord crosses the middle slab and joins the top slab and the bottom slab.
    - In the left jade the bottom slab rises to the right; its cord ends on that slab.
    - The knife's handle and blade do not touch each other or either jade.
    - The knife's blade is a long stroke that ends in a sweep to the left and has no hook.
  strokes:
    - where: a short line across the top of the left jade, rising slightly to the right
      part: the left jade's top slab
    - where: a short line across the middle of the left jade, rising slightly to the right, a little shorter
      part: the left jade's middle slab
    - where: a vertical line down the left jade, crossing the middle slab, from the top slab to the bottom
      part: the left jade's cord
    - where: a long line across the bottom of the left jade, rising to the right
      part: the left jade's bottom slab
    - where: a short vertical line in the middle, a little above centre
      part: the knife's handle
    - where: a long stroke at the middle, from the top down to the bottom, sweeping at its end to the bottom left
      part: the knife's blade
    - where: a line across the top of the right jade, rising slightly to the right
      part: the right jade's top slab
    - where: a line across the middle of the right jade, rising slightly to the right
      part: the right jade's middle slab
    - where: a vertical line down the right jade, from the top slab, crossing the middle slab, turning down a little to the right at the bottom
      part: the right jade's cord
    - where: a long line across the bottom of the right jade, the longest line of the picture
      part: the right jade's bottom slab

哥:
  object: one person speaking over another, two speakers one above the other
  history: >-
    An ideogram: one speaker 可 over another, speaking again and again, an elder brother. 可 is a
    mouth under a bar.
  layout: >-
    Two speakers stand one above the other in the square. The upper is small, in the upper middle of
    the square. The lower is much wider and larger, filling the lower square, as if the first stood on
    his shoulders. Each is a person with a friendly face and simple pale clothes, drawn as a T shape
    with arms stretched along the bar and the body as the vertical line, and each has a speech balloon
    shaped like a small open box at his left, drawn on the left of the vertical line.
  exact:
    - The upper speaker is small and the lower one wide, the lower bar about twice as long as the upper.
    - In each speaker the vertical line starts from the bar and ends in a small hook to the left; the upper one is a short down stroke, the lower one long.
    - The upper speaker's body does not touch the lower speaker's bar except at its end; it reaches the lower bar.
    - The lower speaker's body starts from the lower bar and stands apart from the upper one's.
    - Each speech balloon is three strokes, a short line down on the left, a line across and down on its right, and a short line along the bottom; the balloon's bottom line meets both.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the upper speaker's arms
    - where: a short vertical line down at the left of the upper speaker's balloon
      part: the upper balloon's left side
    - where: a line across the top of the balloon, rising slightly to the right, then turning down at its right
      part: the upper balloon's top and right side
    - where: a short line across the bottom of the balloon, rising slightly to the right
      part: the upper balloon's bottom
    - where: a short stroke from the middle of the upper bar, running down to the right, then turning down to meet the lower bar
      part: the upper speaker's body
    - where: a long line across the lower half, running across to the right, the longest line of the picture
      part: the lower speaker's arms
    - where: a short vertical line down at the left of the lower speaker's balloon
      part: the lower balloon's left side
    - where: a line across the top of the lower balloon, rising slightly to the right, turning down at its right end with a small hook to the left
      part: the lower balloon's top and right side
    - where: a short line across the bottom of the lower balloon
      part: the lower balloon's bottom
    - where: a long vertical line down from the lower bar to the bottom, ending in a small hook up to the left
      part: the lower speaker's body and feet

索:
  object: a rope hanging from a ceiling, tied to a cross-shaped peg
  history: >-
    An ideogram: a rope 糸 hanging from the ceiling 冖. The twisted strands were drawn as a skein of
    silk, with its loose ends.
  layout: >-
    A flat ceiling covers the top of the square, a beam across with a short wall on its left. A
    cross-shaped peg is fixed to its middle, and a thick cream rope hangs from the peg down to the
    bottom, twisted twice in loops and ending in a hanging tail with two loose strands.
  exact:
    - The peg's bar and its post cross at the middle of the bar; the post ends on the ceiling beam.
    - The ceiling's left wall is short and starts at the beam's left end; the beam is the longest line and ends in a small hook down to the left at its right end.
    - The rope's first loop is a stroke down to the left, then across to the right; it starts on the beam.
    - The rope's second loop crosses over to the right; its small dot is the end of the knot.
    - The rope's tail starts on the second loop and ends in a hook to the left.
    - The two loose strands at the bottom stand free of the tail and of each other.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the peg's bar
    - where: a short vertical line down through the middle of the bar, ending at the beam
      part: the peg's post
    - where: a short line down at the left of the ceiling
      part: the ceiling's left wall
    - where: a long line across below the peg, from the wall's top, ending in a small hook down to the left
      part: the ceiling beam
    - where: a stroke hanging from the beam's middle, down to the left and then turning across to the right
      part: the rope's first loop
    - where: a stroke starting at the first loop's right, down to the left and then turning across rising slightly to the right
      part: the rope's second loop
    - where: a short stroke at the right of the second loop, down to the right
      part: the knot of the rope
    - where: a vertical stroke hanging from the second loop's middle, then turning to the left at the bottom
      part: the rope's tail
    - where: a short stroke at the bottom left, down to the left
      part: the left loose strand
    - where: a short stroke at the bottom right, down to the right
      part: the right loose strand

益:
  object: a wide dish overflowing with water, the water spilling down its sides
  history: >-
    An ideogram: water 水 over a container 皿, so full that it overflows, benefit.
  layout: >-
    The upper part is water, a pale blue mound of water above a dish with splashes at its top. The
    lower part is a wide shallow dish in pale clay, its mouth narrower than its base, seen from the
    front. Streams of water spill down over its rim to both sides.
  exact:
