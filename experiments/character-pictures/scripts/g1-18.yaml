    - where: a long line down from the top, running down and turning down a little
      part: the marker's post
    - where: a short vertical line below the post, at the left of the hollow
      part: the hollow's left side
    - where: a line across the top of the hollow, turning down on the right
      part: the hollow's top and right side
    - where: a short line across the bottom of the hollow, rising slightly to the right
      part: the hollow's bottom
    - where: a stroke at the top of the right half, running down and turning down to the left
      part: the hand's forearm, coming down from above
    - where: a line rising to the right from the middle of the forearm
      part: the stick, held out
    - where: a stroke from the stick's start, going down and sweeping to the bottom left
      part: the hand and fingers, gripping
    - where: a long stroke from the middle of the forearm down to the right, then out across to the right
      part: the swing of the stick

術:
  object: a skilled walker striding past a tree that bears a single fruit
  history: >-
    An ideogram: a professional 行 and his skill 术. 行 is a crossroads, the street he walks. 术 also
    gives the sound.
  layout: >-
    A walker taking steps, seen from the side facing right, fills the full square; his back leg is on
    the left and his front leg on the right. In the space between his legs stands a small tree with a
    plain trunk, its spreading roots, and one pale fruit at its upper right. Pale clothes, a friendly
    face.
  exact:
    - The walker's first two sweeps are separate, a small gap between them; his foot is a vertical starting on the lower sweep.
    - The tree's branches line is about three fifths as long as the walker's long stride line; its trunk is the tallest line of the tree.
    - The tree's trunk crosses its branches line and ends in a plain point at the bottom, with no hook.
    - The tree's left root is a short sweep to the left; the right root ends in a small hook to the right.
    - The fruit is a small dot and stands free.
    - The walker's front leg starts on the stride line and ends in a small hook up to the left.
  strokes:
    - where: a short sweep at the top of the left, down to the left
      part: the walker's back thigh
    - where: a longer sweep below it, down to the left, with a small gap from the first
      part: the walker's back knee and shin
    - where: a straight vertical line down from the middle of the lower sweep to the bottom
      part: the walker's back foot
    - where: a line across the upper part of the middle, rising slightly to the right
      part: the tree's branches
    - where: a long vertical line down the middle
      part: the tree's trunk
    - where: a short stroke at the lower left of the trunk, down to the left
      part: the tree's left root
    - where: a short stroke at the lower right of the trunk, down and ending in a hook to the right
      part: the tree's right root
    - where: a small dot at the upper right of the trunk
      part: a single fruit
    - where: a short line across the upper part of the right half, rising slightly to the right
      part: the hem of the walker's coat
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the walker's stride line, hips and knee
    - where: a long line down from the middle of the stride line, ending in a small hook up to the left
      part: the walker's front leg, the hook his toes
