焉:
  checked: argon
  object: a bird in profile facing left, with a tall flat-topped crest and head on top and a folded wing, curved tail and four claws below
  history: >-
    The character arose as a ligature of 於 and 是, combining the lower half of the bird 烏 with the 正
    part of 是 at the top. By the small seal script it was reanalysed and drawn as a single crested
    yellow bird whose tall head is formed by 正 above a bird's body, tail and claws.
  layout: >-
    A single bird in profile faces left and fills the square from its flat-topped crest at the top
    to its hooked tail at the bottom right. The upper 正 component forms the bird's strange square
    crest, brow and neck collar, with a small eye and beak tucked on the left side of the head.
    Below the collar, the middle strokes form the folded wing and the long curved back and tail
    sweeping down on the right, while the four short strokes at the bottom form its claws and lower
    feathers. Soft pale yellow and warm buff plumage fills the bird behind the strokes.
  exact:
    - The top line across is about two thirds as long as the long middle line across below the head.
    - The upper middle vertical starts at the middle of the top line and ends on the middle of the long line across; a short line across starts from the middle of that vertical and runs to the right, about a quarter as long as the long line across.
    - The upper left vertical is about three quarters as long as the upper middle vertical; it starts free below the left end of the top line and ends on the long line across.
    - Below the long line across, the middle short line across is nearly half as long as the long line across and stands completely free, with a clear gap between its left end and the bent stroke beside it.
    - The long bent stroke starts on the long line across just below the upper left vertical, goes down a little to the left, turns sharply across to the right, and turns down again into a curve ending in a hook up to the left.
    - A row of four short strokes sits below the horizontal stretch of the bent stroke and stands completely free; the leftmost slants down to the left and the other three slant down to the right.
  strokes:
    - where: a line across the top, about two thirds as long as the long middle line across, rising slightly to the right
      part: the flat top of the bird's crest
    - where: a straight line down the upper middle, from the middle of the top line to the long line across
      part: the central shaft of the bird's head and crest
    - where: a short line across in the upper right, from the middle of the upper vertical to the right
      part: a back plume jutting out from the crest
    - where: a short line down on the upper left, about three quarters as long as the upper middle vertical, slanting slightly to the right to meet the long line across
      part: the front edge of the bird's brow and face
    - where: a long line across the upper middle, from the far left to the far right, rising slightly to the right
      part: the base of the bird's head and neck collar
    - where: a short line across the centre, nearly half as long as the long line above it, standing free without touching the stroke on its left
      part: the upper edge of the bird's folded wing
    - where: a long stroke starting on the left of the long line across, going down to the middle left, turning sharply across to the right, then turning down on the right and ending in a hook up to the left at the bottom
      part: the bird's breast, turning across along its lower wing and back, then curving down into its long hooked tail
    - where: a short stroke in the lower left, slanting down and out to the left
      part: the bird's front claw
    - where: a short dot in the lower left-centre, slanting down to the right
      part: the bird's second claw
    - where: a short dot in the lower centre, slanting down to the right
      part: the bird's third claw
    - where: a short stroke in the lower right-centre inside the curve of the tail, slanting down to the right
      part: the bird's rear claw

奠:
  checked: argon
  object: a ceremonial wine jar with overflowing wine above its rim, set upon a low offering table with two splayed legs
  history: >-
    Oracle bone forms drew a wine vessel placed on a mat. Bronze and seal forms added two strokes
    above the vessel for overflowing wine and two legs below the mat to form a low ritual stand,
    which clerical script later reshaped into the bottom component.
  layout: >-
    A rounded bronze or pottery wine jar fills the upper two thirds of the square, with two small
    splashes of overflowing wine floating just above its wide flat mouth. The neck of the jar
    narrows between the rim and the squared body, which holds pale amber wine up to the inner
    horizontal line. Beneath the base of the jar sits a wide, flat wooden offering stand whose two
    legs splay out to the bottom left and bottom right, painted in soft warm browns and pale golds.
  exact:
    - The two short strokes at the very top stand free above the upper horizontal line and do not touch it.
    - The two inner vertical strokes both start on the upper horizontal line, cross the top edge of the jar's rectangular body, and end inside the upper half of the body without touching its sides.
    - The left inner vertical curves slightly left to a point, while the right inner vertical turns sharply to the right at its bottom.
    - The short horizontal line inside the lower half of the jar stands completely free, touching neither the side walls nor the inner verticals above it.
    - The bottom horizontal line of the jar closes its rectangular body from the bottom of the left wall to the bottom of the right wall.
    - The lower horizontal line of the stand is the widest stroke of the character, wider than the jar's rim, which is about three quarters as long.
    - The long left-sweeping stroke of the stand starts at the middle of the jar's bottom line and crosses the wide lower horizontal line, while the right-sweeping leg starts where those two cross.
  strokes:
    - where: a short dot at the top centre-left, slanting down to the right
      part: a splash of overflowing wine rising on the left above the rim
    - where: a short sweep at the top centre-right, slanting down to the left
      part: a splash of overflowing wine rising on the right above the rim
    - where: a long horizontal line across the upper part, about three quarters as wide as the bottom horizontal line
      part: the wide flat rim of the wine jar
    - where: a vertical line down the left side of the middle section
      part: the left wall of the wine jar's body
    - where: a line running across from the top of the left wall to the right, then turning sharply down to form the right side
      part: the shoulder and right wall of the wine jar's body
    - where: a vertical line starting from the middle-left of the top rim, crossing the jar's shoulder and curving slightly left inside the upper body
      part: the left side of the jar's neck extending down inside the vessel
    - where: a vertical line starting from the middle-right of the top rim, crossing the jar's shoulder and turning right at its bottom inside the upper body
      part: the right side of the jar's neck extending down inside the vessel
    - where: a short horizontal line floating free inside the lower half of the jar's body
      part: the surface line of the wine inside the jar
    - where: a horizontal line across the bottom of the jar, joining the ends of its left and right walls
      part: the flat base of the wine jar
    - where: a very long horizontal line across the lower part of the square, from near the left edge to near the right edge
      part: the wide flat top board of the offering table
    - where: a long sweep starting from the middle of the jar's base, passing down through the table board and curving out to the bottom left
      part: the central support and splayed left leg of the offering table
    - where: a long falling stroke starting where the left leg crosses the table board, sweeping down and out to the bottom right
      part: the splayed right leg of the offering table

彭:
