  object: a ceremonial drum on a pedestal on the left, with three booming sound waves radiating on the right
  history: >-
    An ideogrammic compound combining a drum mounted on a stand with a crest ornament on top (壴) and
    three strokes on the right (彡) representing the booming beats of the drum.
  layout: >-
    The left half holds an upright ceremonial drum on a stand, with a cross-shaped crest ornament at
    the top, the drum body in the middle, and a two-strut pedestal resting on a rising base at the
    bottom. In the right half, three parallel curved strokes sweep down and to the left to show
    booming sound waves. Pale warm wood and tan tones fill the drum and stand, with soft pale golden
    ripples behind the three sound strokes on the right.
  exact:
    - In the top crest on the left, the vertical line crosses the upper line across and ends on the middle of the lower line across; the lower line across is shorter, about three quarters as long as the upper one.
    - The middle of the left half is a closed small box separated by a narrow gap from the lower line across above it.
    - Below the box, the left dot stands free without touching the box or the rising base line, while the right short sweep starts on the bottom line of the box and ends on the middle of the rising base line.
    - The three sweeps on the right stand completely free of the drum and of each other, stacked from top to bottom.
    - The lowest sweep on the right is much longer than the upper two, reaching down to the bottom centre below the drum stand.
  strokes:
    - where: a line across the upper part of the left half, rising slightly to the right
      part: the wide crossbar of the crest ornament atop the drum
    - where: a vertical line down the middle of the top left, crossing the upper line across
      part: the central stem of the top crest ornament
    - where: a shorter line across below the upper line across, about three quarters as long, touched at its middle by the vertical stem
      part: the lower mount of the top crest ornament
    - where: a short line down on the left of the middle section, slanting slightly right
      part: the left rim of the drum body
    - where: a line across from the top of the left rim, rising slightly to the right and turning down to form the right side
      part: the upper and right rim of the drum body
    - where: a short line across closing the bottom of the middle box from left to right
      part: the lower rim of the drum body
    - where: a short dot slanting down to the right below the left side of the drum box
      part: the left strut of the drum stand
    - where: a short sweep down to the left, starting from the bottom line of the drum box and touching the base line below
      part: the right strut of the drum stand
    - where: a long rising stroke from the bottom left up toward the lower centre
      part: the tilted base of the drum stand
    - where: a sweep in the upper right half, running from the top right down and to the left
      part: the upper sound wave radiating from the drum
    - where: a sweep in the middle right half, running parallel below the upper sweep down and to the left
      part: the middle sound wave radiating from the drum
    - where: a long sweep in the lower right half, running from the middle right all the way down to the bottom centre
      part: the lowest, longest sound wave radiating from the drum

