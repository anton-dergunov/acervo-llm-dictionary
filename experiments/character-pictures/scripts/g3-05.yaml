绵:
  checked: argon
  object: a twisted skein of silk thread on the left beside a hanging piece of fine white silk cloth topped by a white silk cocoon on the right
  history: >-
    An ideogrammic compound combining silk thread (糸, simplified to 纟) on the left with white silk
    textile (帛, made of white 白 above and cloth 巾 below) on the right, depicting soft, continuous
    silk floss and fabric.
  layout: >-
    The left side shows a pale cream skein of twisted silk thread following the two angled bends and
    the rising tail below; it is narrower and shorter than the right side. The right side shows a
    plump pale-ivory silk cocoon at the top (on the strokes of 白) and a soft pale-tinted silk cloth
    draped below it (on the strokes of 巾), hanging from a horizontal fold with a central vertical
    sash running down the middle.
  exact:
    - The left part (the silk thread) and the right part (the silk cloth) do not touch; the left part is narrower and shorter than the right.
    - In the left part, the upper bent stroke runs down to the left and turns sharply across to the right, its end touching the middle of the lower bent stroke; the rising stroke at the bottom stands completely free.
    - At the top of the right part, the short sweep slants down to the left and touches the start of the upper box's top line.
    - Inside the upper right box, the middle line across touches the left wall and stops short of the right wall, while the lower line across closes the bottom of the box from wall to wall.
    - In the lower right part, the outer frame starts at the top of the short left vertical, runs across, turns down on the right side, and ends in a hook to the left.
    - The long central vertical starts at the middle of the upper box's bottom line, crosses the lower frame's top line, and runs straight down to a plain point well below the cloth's sides, with no hook; the left vertical of the cloth is about half as long as this central vertical.
  strokes:
    - where: a stroke in the upper left half running down to the left, then turning sharply across and rising slightly to the right
      part: the upper loop of the twisted silk skein
    - where: a stroke in the middle of the left half running down to the left from just above the first bend's end, then turning sharply up to the right
      part: the lower loop of the twisted silk skein
    - where: a rising stroke in the lower left half, slanting across and up to the right below the two bends
      part: the tied lower tail of the silk skein
    - where: a short sweep at the very top of the right half, slanting down to the left
      part: the loose top filament of the white silk cocoon
    - where: a short line down the upper middle, forming the left wall of the upper right box
      part: the left side of the silk cocoon
    - where: a line across from the top of the upper box's left wall, rising slightly to the right and turning down to form the right wall
      part: the top and right side of the silk cocoon
    - where: a short line across the middle of the upper right box, rising slightly to the right
      part: a ridge across the middle of the silk cocoon
    - where: a line across the bottom of the upper right box, rising slightly to the right to close it
      part: the lower rim of the silk cocoon
    - where: a short line down the left side of the lower right half
      part: the left hanging edge of the silk cloth
    - where: a wide line across from the top of the lower left edge, turning down on the right side and ending in a hook to the left
      part: the top fold and right hanging edge of the silk cloth, curling in at the bottom right
    - where: a long straight line down the middle of the lower right half, from the bottom of the upper box to the very bottom
      part: the central hanging pleat and sash running down the middle of the silk cloth

詣:
  checked: argon
  object: a speaking mouth with its tongue sticking out on the left (言), beside a spoon (匕) above a mouth tasting a sweet morsel (日) on the right (旨), depicting skilled, savoury speech
  history: >-
    Built from 言 (speech, a mouth with a tongue sticking out above it) on the left and 旨 (delicious,
    a spoon 匕 above a mouth holding something sweet, now written like 日) on the right, together
    suggesting words as pleasing and accomplished as fine flavour.
  layout: >-
    The scene is split into two halves of nearly equal size, with the right half slightly wider and
    taller. On the left, a pink tongue rises above a small open mouth. On the right, a pale wooden
    or ceramic spoon with an upturned handle floats above a second mouth holding a pale golden sweet
    morsel on its tongue. All colours stay soft and pale behind the strokes.
  exact:
    - The left part (言) and the right part (旨) do not touch each other.
    - In the left part, the top slanted dot and the three horizontal lines above the mouth stand completely free of one another; the upper horizontal line is more than twice as long as the two short bars below it.
    - In the small mouth at the bottom left, the left vertical meets the start of the top-and-right stroke, and the bottom bar touches the middle of the left vertical and meets the bottom of the right turn.
    - In the spoon at the top right (匕), the short sweep from the top right down to the left ends on the vertical leg of the long L-shaped stroke, which turns across to the right and ends in a tall upward hook.
    - In the box at the bottom right (日), the top-and-right stroke touches the top of the left vertical, turns down on the right, and hooks left at the bottom to meet the lower bar.
    - The inner bar of the bottom-right box touches the middle of the left vertical and stops short of the right side.
  strokes:
    - where: a short stroke at the top of the left half, slanting down to the right
      part: the tip of the speaking tongue
    - where: a long line across the upper part of the left half, rising slightly to the right
      part: the broad base of the speaking tongue, laid across
    - where: a short bar across the middle of the left half, less than half as long as the line above it
      part: the upper fold of the tongue
    - where: a short bar across the left half just below the previous bar, about the same length
      part: the lower fold of the tongue
    - where: a short line down the lower left, slanting slightly to the right
      part: the speaking mouth's left lip
    - where: a line across the top of the lower-left mouth, turning down at the right
      part: the speaking mouth's upper lip and right corner
    - where: a short line across the bottom of the lower-left mouth, rising slightly to the right
      part: the speaking mouth's lower lip
    - where: a short sweep in the upper right half, running from the top right down and left to touch the vertical of the spoon
      part: the bowl of the spoon
    - where: a long stroke in the upper right half, running down from the top, turning wide across to the right, and ending in an upward hook
      part: the stem and upturned handle of the spoon
    - where: a line down the left side of the lower right half
      part: the tasting mouth's left corner
    - where: a line across the top of the lower right half, turning down on the right and ending in a hook to the left
      part: the tasting mouth's upper lip and right side
    - where: a short bar across the middle of the lower-right box, touching the left side and stopping short of the right
      part: the sweet morsel resting inside the mouth
    - where: a short bar across the bottom of the lower-right box, joining the left vertical to the bottom hook of the right side
      part: the tasting mouth's lower lip

夷:
  checked: argon
  object: a standing person facing forward with arms stretched wide and legs apart, carrying a curved hunting bow slung across their chest
  history: >-
    Earliest forms combined an arrow and a cord or bow to mean shooting; later forms reshaped the
    top and bottom into a standing person (大) overlapping a bow (弓) across the middle, depicting a
    person armed with a bow.
  layout: >-
    A tall standing person fills the square from head to feet, facing the viewer with a friendly
    face (eyes, nose, and mouth) at the top of the central vertical stroke and wearing a simple pale
    tunic. Their arms stretch straight out along the top horizontal line, and their legs spread wide
    at the bottom. Overlapping the middle of their torso is a pale wooden hunting bow, its limbs
    winding back and forth horizontally across the body.
  exact:
    - The long central vertical stroke starts at the very top above the upper horizontal line, runs straight down through the middle of the top line and all three horizontal segments of the bow, and curves out to the bottom left.
    - The top horizontal line (the arms) does not touch the bow below it.
    - In the bow around the middle, the upper line is nearly as long as the top arm line and turns down at the right to meet the right end of the middle line, which is about three quarters as long as the top line.
    - The lower bow stroke starts at the left end of the middle line, goes briefly down on the left, then runs wide across to the right before turning down and ending in a hook to the left.
    - The right leg starts on the central vertical stroke just below the lowest crossing of the bow and sweeps down to the bottom right without touching the bow.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the person's outstretched arms
    - where: a line across below the arms, turning down at the right end
      part: the upper limb and tip of the bow slung across the chest
    - where: a shorter line across the middle, meeting the bottom of the upper bow turn on the right
      part: the middle bend of the bow, running back to the left grip
    - where: a stroke starting at the left end of the middle line, going briefly down on the left, then sweeping wide across to the right and turning down to end in a hook to the left
      part: the bow's grip on the left and its long lower limb curving down on the right
    - where: a long line from the top centre straight down through the arms and the bow, then sweeping out to the bottom left
      part: the person's head, torso, and left leg
    - where: a sweeping stroke from the middle of the central line, just below the bow, down and out to the bottom right
      part: the person's right leg

