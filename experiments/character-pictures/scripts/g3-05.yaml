耍:
  checked: argon
  object: a kneeling woman facing left in the lower half, wearing a wide hanging false beard above her in the upper half for playful disguise
  history: >-
    An ideogrammic compound placing a beard 而 above a woman 女: a woman putting on a false beard in
    play or comic disguise, from which the meaning to play or frolic comes.
  layout: >-
    The picture is split into two parts stacked top to bottom with a small gap between them. In the
    upper half hangs a large theatrical false beard, shaded in pale warm brown and soft tan, with a
    short mouthpiece bar at the very top, a short strap below it, and four hanging locks of hair
    like the teeth of a wide comb. In the lower half, a woman kneels facing left with a cheerful
    face (eyes, a nose and a smiling mouth) and simple pale flowing clothes, her arms spread wide
    across the frame as she dances in disguise.
  exact:
    - The upper beard part and the lower woman part do not touch; a small gap separates the beard's hanging strands from the top of the woman below.
    - The top line across is the shortest horizontal, less than half as long as the woman's wide line across at the bottom.
    - A short sweep goes down to the left from the middle of the top line across to touch the main horizontal bar of the beard.
    - The beard's main frame starts where the left vertical hangs down, runs across to the right (a little over half as wide as the woman's bottom line across), turns down on the right, and ends in a hook up to the left.
    - The left outer vertical and the two inner verticals of the beard all hang down from the horizontal bar and end in plain points at the bottom, with no bottom line connecting them.
    - In the woman below, the first stroke runs down a little to the left and turns sharply to sweep down to the bottom right; the second sweep curves from the middle down to the bottom left, crossing the first; the very long line across spans almost the full width of the box and crosses both.
  strokes:
    - where: a short line across near the top centre, tilting slightly up to the right
      part: the upper lip bar of the false beard
    - where: a short sweep from the middle of the top line down and to the left
      part: the central strap connecting the lip bar to the beard's main band
    - where: a straight line down the left side of the upper half, ending in a plain point
      part: the outer left lock of the hanging beard
    - where: a line across the upper half from the top of the left vertical, turning down on the right and ending in a hook to the left
      part: the main upper band of the beard and its outer right lock, curling inward at the tip
    - where: a straight line down inside the left half of the beard frame, from the main band to a plain point
      part: the inner left lock of the beard
    - where: a straight line down inside the right half of the beard frame, from the main band to a plain point
      part: the inner right lock of the beard
    - where: a stroke in the lower half starting below the inner left lock, running down to the left and turning sharply to sweep down to the bottom right
      part: the kneeling woman's upper body and back, turning at her hip into her folded legs
    - where: a curved sweep in the lower half from just above the long horizontal line down and out to the bottom left
      part: the woman's front sleeve and skirt sweeping down to the left
    - where: a very long line across the lower half from the far left edge to the far right edge
      part: the woman's outstretched arms held wide in playful dance

旱:
  checked: argon
  object: the blazing sun 日 shining down on a parched, cracked desert 干
  history: >-
    An ideographic compound combining the sun 日 at the top with 干 below, representing the scorching
    sun baking the dry ground in a drought, while 干 also supplies the sound.
  layout: >-
    The sun sits in the upper part of the frame, narrower than the desert below, filled with a soft
    pale yellow and warm orange glow. Below a small gap, the wider lower part is a flat expanse of
    pale ochre and tan baked desert earth stretching from the upper ridge down to the bottom, split
    by a long horizontal fissure and a deep vertical drought crack.
  exact:
    - The top part (the sun) and the bottom part (the desert) are separate and do not touch, with the bottom part wider and taller than the top part.
    - In the sun, the left side and the right side both slant slightly inward toward the bottom.
    - The short inner line across the middle of the sun touches the left side and stops short of the right side, while the bottom line of the sun touches both sides.
    - In the bottom part, the upper line across is about half as long as the wide lower line across.
    - The long vertical line in the bottom part starts at the middle of the upper line across without rising above it, crosses the wide lower line across at its middle, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a line down the left side of the upper part, slanting slightly inward toward the bottom
      part: the left rim of the sun
    - where: a line across the top of the upper part, turning down at the top right to slant slightly inward along the right side
      part: the top and the right rim of the sun
    - where: a short line across the middle of the upper part, touching the left side and stopping short of the right side
      part: the bright band of light across the heart of the sun
    - where: a short line across the bottom of the upper part, rising slightly to the right to join both sides
      part: the bottom rim of the sun
    - where: a line across the middle of the frame below the sun, rising slightly to the right, about half as long as the lower line across
      part: the flat upper horizon ridge of the parched desert
    - where: a long line across the lower middle of the frame, spanning nearly the full width
      part: a wide horizontal fissure splitting the baked desert floor
    - where: a long straight vertical line from the middle of the upper desert line down to a plain point at the bottom, crossing the wide lower line
      part: a deep vertical drought crack running down through the parched earth

