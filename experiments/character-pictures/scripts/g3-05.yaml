颳:
  checked: argon
  dropped: The character is a phono-semantic compound where 舌 (originally 𠯑) serves only as the phonetic component rather than depicting a biting tongue, so the script's picture teaches a false folk etymology.
  object: a billowing gust of wind 風 wrapping from the left and bottom around an open mouth with a protruding, biting tongue 舌 on the upper right
  history: >-
    An ideographic compound combining wind 風 on the left and bottom with a tongue sticking out of a
    mouth 舌 on the upper right, picturing a sharp, biting wind that scrapes like a tongue.
  layout: >-
    The sweeping frame of the wind fills the left half and curves beneath the right half to hook up
    at the bottom right, washed in pale sky-blue and soft grey air currents. Tucked inside the left
    hollow of the wind is its small wind-insect component, drawn in pale sage green. Tucked in the
    upper right, above the wind's bottom sweep and to the right of its central drop, is a pale rose
    mouth with a pale pink tongue sticking straight up from its top.
  exact:
    - The outer wind frame starts at the top of the long left sweep, runs across the top of the left half, turns down through the centre, and curves underneath the right component to end in a tall upward hook at the bottom right.
    - Inside the left hollow of the wind, the top short sweep does not touch the outer left sweep, while the top-left corner of the small middle box touches the middle of the outer left sweep and its right side stops short of the central downward turn.
    - The inner vertical of the left part starts on the middle of the top short sweep, crosses both horizontal lines of the small middle box, and ends on the middle of the bottom rising stroke, whose right end meets the short falling dot.
    - The tongue component sits in the upper right half, entirely to the right of the wind frame's downward turn and above its bottom curve, without touching the wind frame anywhere.
    - In the upper part of the tongue on the right, the vertical line starts on the middle of the top sweep, crosses the middle of the wide line across, and ends on the middle of the mouth box's top line.
    - The wide line across the middle of the tongue is about twice as long as the short line closing the bottom of the mouth box below it.
  strokes:
    - where: a long sweep down the far left side, curving slightly out to the bottom left
      part: the left outer edge of the billowing wind
    - where: a line from the top of the left sweep across the top of the left half, turning down through the centre, curving across the bottom under the right half, and ending in a tall hook up at the bottom right
      part: the top crest and sweeping lower gust of the wind
    - where: a short sweep down to the left near the top of the left hollow
      part: the head crest of the small wind-insect inside the gust
    - where: a short line down on the left side of the middle of the left hollow, touching the outer left sweep
      part: the left side of the wind-insect's body
    - where: a line across from the top of that short vertical, rising slightly to the right and turning down
      part: the top and right side of the wind-insect's body
    - where: a short line across the middle of the left hollow, closing the small box
      part: the underside of the wind-insect's body
    - where: a straight line down the middle of the left hollow, from the top short sweep through the small box to the lower rising stroke
      part: the central spine of the wind-insect
    - where: a rising stroke near the bottom of the left hollow, slanting up to the right
      part: the lower tail of the wind-insect
    - where: a short dot slanting down to the right at the right tip of the rising stroke
      part: the tip of the wind-insect's tail
    - where: a short sweep down to the left near the top of the right half
      part: the curled tip of the biting tongue
    - where: a wide line across the middle of the right half, rising slightly to the right
      part: the spread blade of the tongue
    - where: a straight line down the upper middle of the right half, from the middle of the top sweep through the wide line across to the top of the lower box
      part: the central groove of the tongue
    - where: a short line down the left side of the lower right part, above the wind's bottom curve
      part: the left corner of the mouth
    - where: a line across from the top of that short vertical, rising slightly to the right and turning down
      part: the upper lip and right corner of the mouth
    - where: a short line across the bottom of the mouth box, connecting the left and right sides
      part: the lower lip closing the bottom of the mouth
