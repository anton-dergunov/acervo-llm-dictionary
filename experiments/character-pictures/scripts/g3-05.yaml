袁:
  checked: argon
  object: a hand at the top holding up a long robe with wide sleeves, a framed opening at the chest, and crossed lapels below
  history: >-
    Oracle bone forms combined a robe 衣 with a hand 又 at the top to mean putting on clothes, and
    variant forms added a small circle in the middle, now written 口. In later scripts the hand at
    the top became 土 above the robe's shoulders, while the lower half kept the crossed lapels and
    hem of 衣.
  layout: >-
    A long pale robe hangs from the upper third to the bottom of the square, seen from the front. At
    the top centre, a pale hand reaches down along the upper cross strokes to hold the robe's collar
    above the wide shoulder line. Below the shoulders, the small box in the centre frames a round
    neck opening at the chest, and the lower strokes form the crossed lapels and flowing hem of the
    robe.
  exact:
    - The top horizontal line is about half as long as the wide shoulder line below it.
    - The top vertical line crosses the middle of the top horizontal line and ends on the middle of the wide shoulder line, without crossing below it.
    - The small box in the centre sits below the wide shoulder line without touching it; its top and right side are one stroke that turns down to the left, and its bottom line closes the box.
    - Both the long left sweep and the long right falling stroke start together at the bottom-left corner of the central box.
    - The vertical stroke under the left sweep starts at the middle of that sweep and turns sharply up to the right at its foot.
    - The short sweep on the right slants down to the left and ends on the middle of the long right falling stroke.
  strokes:
    - where: a short line across the upper part, rising slightly to the right, about half as long as the wide line below it
      part: the fingers of the hand holding the top of the robe
    - where: a straight line down the top centre, crossing the short top line and ending on the wide line below
      part: the wrist and hand reaching down to the collar
    - where: a long line across the upper middle, rising slightly to the right
      part: the robe's wide shoulders and outstretched sleeves
    - where: a short line down left of centre, below the wide shoulder line, slanting slightly to the right
      part: the left side of the chest opening
    - where: a line across from the top of the left side to the right, about half as long as the wide shoulder line, turning down to the left for the right side
      part: the top and right edge of the chest opening
    - where: a short line across the bottom of the central box, rising slightly to the right to close it
      part: the lower edge of the chest opening
    - where: a long sweep from the bottom-left corner of the central box down and out to the bottom left
      part: the robe's left lapel, sweeping down to the left
    - where: a line from the middle of the left sweep straight down, turning sharply up to the right at the bottom
      part: the inner panel under the left lapel, its hem flicking up
    - where: a short sweep on the middle right, slanting down to the left to touch the long right stroke
      part: the fold of the right lapel
    - where: a long falling stroke from the bottom-left corner of the central box down and out to the bottom right
      part: the robe's right lapel, sweeping out to the hem

