禽:
  checked: argon
  object: a hunter reaching wide from above over a hunting net set up under foliage in the woods, with a woven mesh basket above a framed handle
  history: >-
    In oracle bone inscriptions this character was a pictogram of a long-handled hunting net used to
    capture birds and game. In bronze inscriptions a top component was added that later corrupted
    into a person 人 above the net 离.
  layout: >-
    At the top, a hunter seen from the front leans over with both arms spread wide to the left and
    right, forming the wide inverted V roof of the character; a small friendly head with eyes, a
    nose and a mouth sits just above the top peak, with simple pale clothes behind the shoulders.
    Tucked underneath the hunter's outstretched arms is the hunting net under a small shoot and
    bough of pale green foliage: a U-shaped basket with crossed mesh cords in the middle, and a wide
    rectangular lower frame with a central angled handle at the bottom. All background colours are
    pale brown and soft green.
  exact:
    - The two long top strokes meet near the top centre and sweep wide to the left and right, without touching any of the net strokes below them.
    - The small dot under the top peak stands completely free, touching neither the top sweeps above nor the horizontal line below.
    - The upper horizontal line is about half as wide as the lower frame's crossbar.
    - The two short slanting strokes inside the basket cross each other at their middles; the down-left stroke starts on the middle of the upper horizontal line, while the down-right stroke touches nothing else, and neither touches the basket bottom below.
    - The basket's left rim turns across to the right and ends on the middle of the short vertical right rim, which does not touch the lower frame below it.
    - In the lower half, the long horizontal crossbar starts at the top of the left vertical strut, turns down at the right, and ends in a hook to the left.
    - The central handle starts on the middle of the basket's bottom line, crosses the lower frame's crossbar, turns up to the right, and ends on the middle of the short final down-right stroke, which does not touch the crossbar above it.
  strokes:
    - where: a long sweep from the top centre down and out to the middle left
      part: the hunter's outstretched left arm
    - where: a long sweep from near the top of the left sweep down and out to the middle right
      part: the hunter's outstretched right arm
    - where: a small dot below the top peak, slanting down to the right
      part: the top shoot of foliage above the net
    - where: a line across the upper middle, rising slightly to the right and about half as wide as the lower frame
      part: the bough across the top of the net
    - where: a short sweep from the middle of the upper line down to the left, less than half as long as the top left sweep
      part: the first crossed cord of the net's mesh
    - where: a short stroke in the middle slanting down to the right, crossing the short down-left sweep
      part: the second crossed cord of the mesh
    - where: a stroke down the left of the middle section, then turning across to the right and rising slightly
      part: the left rim and bottom of the net's basket
    - where: a short line down on the right of the middle section
      part: the right rim of the net's basket
    - where: a line down the left side of the lower half
      part: the left strut of the lower frame
    - where: a wide line across the lower half from the top of the left strut, turning down at the right and ending in a hook to the left
      part: the crossbar and right strut of the lower frame
    - where: a stroke from the middle of the basket's bottom line down across the crossbar, then turning up to the right
      part: the net's central handle
    - where: a short stroke in the lower middle slanting down to the right
      part: the short tie on the handle

