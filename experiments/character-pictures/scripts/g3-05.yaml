  history: >-
    An ideogrammic compound placing water 水 inside a crossroads 行: water overflowing its channel and
    spreading out along the roads in every direction.
  layout: >-
    A street intersection seen from above fills the square. The left curbs and side lane occupy the
    left column, and the right curbs and side lane occupy the right column, bordered by pale stone
    paving. Between them, pale blue water flows down the central main road and spills into the side
    lanes, with the central strokes forming ripples and splashes in the current.
  exact:
    - The three vertical zones—the left road curbs, the central water strokes, and the right road curbs—do not touch one another.
    - On the left, the upper sweep and the longer lower sweep do not touch each other.
    - The left vertical line starts from the middle of the lower-left sweep and ends in a plain point at the bottom, with no hook.
    - In the centre, the two upper slanting dots and the lower rising stroke all stand completely free of one another.
    - On the right, the upper line across is about half as long as the lower line across and stands free above it.
    - The right vertical line starts from the middle of the lower-right line across, reaches lower than the left vertical, and ends in a hook up to the left.
  strokes:
    - where: a short sweep at the top of the left side, curving down to the left
      part: the upper-left curb, curving out along the left side lane
    - where: a longer sweep below it on the left side, curving down to the left
      part: the lower-left curb of the left side lane
    - where: a straight vertical line down from the middle of the lower-left sweep to the bottom left
      part: the left curb running straight down the main road
    - where: a short dot in the upper centre, slanting down to the right
      part: an upper splash of water in the middle of the flooded road
    - where: a short dot below it in the centre, slanting down to the right
      part: a second splash of water in the central current
    - where: a rising stroke in the lower centre, running from bottom-left up and to the right
      part: a surging ripple of water sweeping up toward the middle of the intersection
    - where: a short line across the upper part of the right side, rising slightly to the right
      part: the upper-right curb along the right side lane
    - where: a long line across the middle of the right side, rising slightly to the right
      part: the lower-right curb of the right side lane
    - where: a long vertical line down from the middle of the lower-right line across, ending in a hook up to the left
      part: the right curb running down the main road, the hook its corner stone at the bottom

屎:
  checked: argon
  object: a crouching person (尸) wrapping from the top and left over droppings shaped like a stalk of grain with scattered pellets (米) below
  history: >-
    Oracle bone forms drew a crouching body (尸) with three or four small dots beneath the backside
    to show droppings. In Warring States script those dots merged and corrupted into the character
    for rice (米), giving the modern form.
  layout: >-
    A person in simple pale clothes crouches at the top and left, facing right with a clear face
    showing eyes, a nose and a mouth at the upper enclosure, their arched back and leg sweeping down
    the left side. Tucked underneath in the lower right half is a pale tan stalk of grain and small
    droppings on a soft pale mound of dung, following the strokes of 米.
  exact:
    - The upper-left body (尸) wraps around the top and left of the lower-right grain stalk (米), and the two parts do not touch each other.
    - In the upper part, the top stroke runs across to the right and turns down to the left to meet the right end of the shorter horizontal line below it; both start on the long left sweep.
    - The vertical stalk of the lower part starts just below the upper enclosure with a small gap, crosses the wide horizontal line through the middle, and ends at the bottom in a plain point with no hook.
    - The horizontal line of the lower part is the longest line across in the character and stops on the left with a small gap before the outer left sweep.
    - The two small upper strokes of the lower part—a dot on the left slanting down to the right and a short sweep on the right slanting down to the left—stand completely free on either side of the vertical stalk.
    - The two lower sweeps start where the horizontal line and vertical stalk cross, spreading down to the bottom left and bottom right.
  strokes:
    - where: a line across the top from the upper left-centre to the upper right, turning down to the left at the corner
      part: the top and front of the crouching person's bent head and shoulders
    - where: a shorter line across below the top stroke, rising slightly to the right to meet the turned-down end
      part: the underside of the person's folded arms and upper torso
    - where: a long stroke from the top-left corner straight down and then sweeping out to the bottom left
      part: the crouching person's arched back running down into the leg
    - where: a short dot in the middle left, slanting down to the right and standing free
      part: a small grain-like dropping at the upper left
    - where: a short stroke in the middle right, slanting down to the left and standing free
      part: a small grain-like dropping at the upper right
    - where: a long line across the lower middle, from just inside the left sweep to the right side
      part: a horizontal straw branch spreading to both sides beneath the person
    - where: a long straight vertical line down the centre, from just below the upper enclosure to the bottom
      part: the upright central stalk in the dung mound
    - where: a sweep from the central crossing down and out to the bottom left
      part: a lower branch drooping to the bottom left
    - where: a falling stroke from the central crossing down and out to the bottom right
      part: a lower branch drooping to the bottom right

