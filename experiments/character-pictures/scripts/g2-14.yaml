恆:
  checked: argon
  object: a human heart on the left, beside a crescent moon held steadily between an upper sky line and a lower ground line on the right
  history: >-
    An ideogrammic compound combining a heart on the left with the sign for constancy on the right,
    which draws a crescent moon waxing between an upper line for the sky and a lower line for the
    ground; the modern simplified variant replaces the crescent moon with the sun.
  layout: >-
    The left third holds a pale rose human heart oriented vertically along the tall left stroke,
    with its side lobes on either side. The right two thirds hold a pale yellow crescent moon waxing
    on the right, set between a horizontal sky line above and a longer ground line below. Soft pale
    colours fill the heart and the crescent moon behind the ink strokes.
  exact:
    - The left part and the right part do not touch, with a small gap between the lower part of the tall left vertical and the start of the bottom horizontal line.
    - On the left, the short far-left stroke stands free, while the small upper-right dot starts on the middle of the tall straight vertical, which ends at the bottom in a plain point with no hook.
    - On the right, the top horizontal line is a little over half as long as the bottom horizontal line and rises slightly to the right.
    - The slanted left sweep of the moon starts at the middle of the top horizontal line, runs about half as long as the tall left vertical, and stops well above the bottom horizontal line without touching it.
    - The moon's outer stroke starts at the middle of that slanted left sweep, runs across to the right, and turns sharply down to the left to rest its bottom end on the middle of the bottom horizontal line.
    - The two small dots inside the moon stand completely free of the surrounding strokes, one above the other.
  strokes:
    - where: a short stroke on the middle left, slanting slightly down to the left, a quarter as long as the tall left vertical
      part: the left lobe of the heart
    - where: a short dot to the right of the tall left vertical, starting on its upper middle and slanting down to the right
      part: the right lobe of the heart
    - where: a long straight vertical line down the left side from near the top to near the bottom, ending in a plain point
      part: the main central vessel running through the heart
    - where: a line across the top of the right part, rising slightly to the right, a little over half as long as the bottom line
      part: the upper sky line
    - where: a sweep starting from the middle of the upper line and slanting down to the left, about half as long as the tall left vertical
      part: the inner left edge of the crescent moon
    - where: a stroke starting from the middle of the right part's left sweep, running across to the right and turning sharply down and slightly left to touch the middle of the bottom line
      part: the upper tip and outer right curve of the crescent moon
    - where: a small dot inside the upper middle of the moon shape, slanting down to the right
      part: the upper shading mark on the face of the moon
    - where: a small dot inside the lower middle of the moon shape, below the upper dot, slanting down to the right
      part: the lower shading mark on the face of the moon
    - where: a long line across the bottom of the right part, running from just right of the tall left vertical to the far right
      part: the lower ground line

佩:
  checked: argon
  object: a person standing on the left beside a large ornamental cloth sash hanging from a wide belt frame on the right
  history: >-
    Originally a compound of a person, a framing loop, and a piece of cloth, depicting a large
    ornamental sash or pendant worn at the waist.
  layout: >-
    On the left stands a person facing right, with a friendly face showing eyes, a nose and a mouth,
    wearing simple pale clothes. On the right, taking up the wider share of the square, hangs a
    large ornamental waist sash with a wide outer ribbon frame draping down on both sides and
    flaring out to the bottom right, while an inner folded cloth hangs from a short upper clasp bar
    down the middle on a long vertical cord. Soft pale silk and jade-tinted fills sit behind the
    strokes.
  exact:
    - The person on the left and the sash frame on the right stand close together but do not touch.
    - In the person on the left, the vertical leg starts from the middle of the upper sweep down to the left and ends in a plain point with no hook.
    - The wide outer frame starts at the top of its left sweep, runs across rising slightly, turns down on the right, and curves out to the bottom right ending in an upward hook.
    - The short upper line across inside the frame does not touch the outer frame on either side.
    - The inner cloth's left vertical and its hooked top-and-right stroke meet at the top left, and neither touches the outer frame.
    - The long central vertical starts at the middle of the short upper line across, crosses the top of the inner cloth, receives the inner cloth's left-pointing hook at its middle, and reaches lowest of all the strokes, ending in a plain point with no hook.
    - The inner cloth's left vertical is short, a little over a third as long as the central vertical, while the top of the inner cloth is a little over half as wide as the top of the outer frame.
  strokes:
    - where: a sweep in the upper left from near the top down and out to the middle left
      part: the leaning shoulder and outstretched arm of the person
    - where: a straight line down the lower left, starting from the middle of the upper sweep
      part: the standing body and leg of the person
    - where: a long line from the upper centre-left down and curving slightly to the bottom left
      part: the left hanging streamer of the outer sash frame
    - where: a wide stroke from the top of the left streamer across to the right, turning down along the right side and curving out at the bottom right to end in an upward hook
      part: the top band and sweeping right tail of the outer sash frame
    - where: a short line across inside the upper part of the outer frame, rising slightly to the right
      part: the upper clasp bar holding the inner sash
    - where: a short line down inside the middle left of the outer frame
      part: the left folded edge of the inner cloth
    - where: a line across from the top of the short inner vertical to the right, turning down and ending in a small hook to the left
      part: the top fold and right edge of the inner cloth
    - where: a long straight line down the centre of the right part, from the middle of the upper clasp bar through the inner cloth to the bottom
      part: the long central pendant cord hanging down through the cloth sash
