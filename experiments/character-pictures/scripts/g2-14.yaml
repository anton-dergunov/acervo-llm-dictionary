    - where: a line across from the top of the left rim, rising slightly to the right and turning down to the bottom right
      part: the top and right rim of the sun frame
    - where: a short line across the middle of the lower right frame, touching the left rim
      part: the inner crossbar of the sun
    - where: a short line across the bottom of the lower right frame, joining the left and right rims
      part: the bottom rim of the sun frame

滩:
  checked: argon
  dropped: Because the origin gives only a phono-semantic compound reading with 难 serving purely for sound, a picture combining its components would teach a false etymology.

傍:
  checked: argon
