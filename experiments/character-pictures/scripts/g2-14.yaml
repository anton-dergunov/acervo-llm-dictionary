堪:
  checked: argon
  object: a tall mound of earth on the left beside a heavy, layered earthen protrusion resting on a braced stone base on the right
  history: >-
    Formed from earth 土 on the left and 甚 (extreme, heavy) on the right, the character first meant a
    heavy mountain or earthen protrusion, and from that came to mean enduring a heavy weight of
    earth.
  layout: >-
    The scene has two parts side by side, matching the character's proportions: the left mound of
    earth is narrower and shorter, sitting in the left third, while the massive earthen crag and its
    base fill the wider right two thirds from top to bottom. On the left, pale brown soil forms a
    steep mound around the cross-shaped earth strokes above a sloping ground edge. On the right, the
    upper grid forms a tall, heavy block of stratified earth and rock, resting on the wide stone
    ledge across the middle, while the two small struts and the L-shaped bedrock basin below brace
    and endure the load in soft ochre and pale grey-brown tones.
  exact:
    - The left part (earth) is narrower and shorter than the right part, and its rising bottom stroke stops just short of the right part's long middle line without touching it.
    - In the left part, the vertical line crosses the short upper line across and ends down on the middle of the rising bottom stroke.
    - In the upper right part, the two vertical lines both cross the upper line across and end down on the long middle line across; the right vertical starts higher than the left vertical.
    - The upper line across in the right part is about three quarters as long as the long middle line across below it.
    - The two short inner lines between the two verticals touch the left vertical and stop just short of the right vertical.
    - At the bottom right, the L-shaped stroke starts by touching near the left end of the long middle line, runs down, and turns across to the right along the bottom with a plain end and no hook.
    - The two short strokes inside the lower right frame stand completely free, touching neither the long middle line above nor the L-shaped stroke below.
  strokes:
    - where: a short line across the middle of the left third, rising slightly to the right
      part: the broad middle ridge of the left mound of earth
    - where: a straight vertical line down the middle of the left third, from the upper left to the rising bottom stroke
      part: the upright core of the left mound of earth
    - where: a stroke across the bottom of the left third, slanting up to the right
      part: the sloping ground beneath the left mound
    - where: a line across the upper part of the right side, rising slightly to the right, about three quarters as long as the long middle line below it
      part: the upper rock ledge binding the tall earthen crag
    - where: a vertical line down the left side of the upper right part, crossing the upper line and ending on the long middle line
      part: the left upright wall of the heavy earthen mass
    - where: a vertical line down the right side of the upper right part, starting higher up, crossing the upper line and ending on the long middle line
      part: the taller right upright wall of the heavy earthen mass
    - where: a very short line across between the two verticals in the upper right part, touching the left vertical
      part: the upper packed layer of earth inside the crag
    - where: a second very short line across below the first between the two verticals, touching the left vertical
      part: the lower packed layer of earth inside the crag
    - where: a long line across the middle of the right two thirds, rising slightly to the right
      part: the wide stone shelf bearing the weight of the earthen mass above
    - where: a short sweep down to the left below the middle of the long line across, standing free
      part: the left supporting stone strut beneath the shelf
    - where: a short stroke slanting down to the right beside the short sweep, standing free
      part: the right supporting stone strut beneath the shelf
    - where: a stroke starting near the left end of the long middle line, running straight down and turning sharply across to the right along the bottom with no hook
      part: the deep L-shaped bedrock foundation enduring the weight from below

