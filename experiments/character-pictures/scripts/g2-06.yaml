  history: >-
    The oracle bone form combined a tiger with a person beneath it to show a tiger about to eat a
    person. In later forms the top and left became the tiger radical and the bottom was stylized
    into a reversed three-pronged shape.
  layout: >-
    A pale-ochre striped tiger wraps around the top and left side, facing right: its ear stands at
    the top centre, its open upper jaw and fang reach across the upper right, its arched back and
    tail sweep down the left edge, and its foreleg reaches out in the middle with an upturned claw.
    Tucked into the lower space beneath the tiger is a crouching person facing right, with eyes, a
    nose and a mouth and simple pale clothes, kneeling with one arm raised overhead and the other
    stretched wide.
  exact:
    - At the top centre, the short vertical stroke touches the middle of the long hooked horizontal below it, and the very short upper horizontal starts from the middle of that top vertical.
    - The long upper horizontal starts at the top of the long left sweep and ends on the right in a sharp hook down to the left.
    - Inside the upper enclosure, the bent stroke starts just below the middle of the long upper horizontal with a small gap between them, crosses the middle horizontal line (which is about half as long as the long upper horizontal), and ends on the right in an upward hook.
    - The upper tiger part and the lower part do not touch each other.
    - In the lower half, the vertical-then-horizontal stroke sits on the left and turns right along the bottom to a plain end with no hook, so the bottom component opens to the right.
    - The upper horizontal of the lower part starts at the top of that lower vertical and is less than half as long as the long lower horizontal below it.
    - The long lower horizontal is the widest across stroke in the character, crossing the middle of the lower vertical so that it sticks out to the left of the vertical and reaches past the bottom horizontal on the right.
  strokes:
    - where: a short line at the top centre running down slightly to the right and then straight down
      part: the tiger's upright ear on the crown of its head
    - where: a very short line across from the middle of the top vertical, rising slightly to the right
      part: the tuft at the tip of the tiger's ear
    - where: a long line across the upper part, rising slightly to the right and ending in a hook down to the left
      part: the tiger's upper snout and open jaw, the hook its sharp upper fang
    - where: a long sweep from the left end of the upper jaw line down and out to the bottom left
      part: the tiger's arched striped back and tail
    - where: a line across the centre, about half as long as the upper jaw line, rising slightly to the right
      part: the stripe across the tiger's chest
    - where: a line from just below the middle of the upper jaw line running down, crossing the centre line, then turning across to the right and ending in an upward hook
      part: the tiger's front leg reaching right, ending in an upturned claw
    - where: a short line across in the lower half, less than half as long as the long line below it, rising slightly to the right from the top of the lower vertical
      part: the crouching person's raised arm shielding their head
    - where: a long line across the lower part from the bottom left to the bottom right, crossing the lower vertical
      part: the crouching person's outstretched arms reaching wide
    - where: a line in the lower half running down from the start of the short lower-half line, crossing the long lower line, and turning across to the right along the bottom
      part: the crouching person's bent back and kneeling legs

