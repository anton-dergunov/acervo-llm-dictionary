    - where: a long sweep from the top-left corner of the roof down and out to the bottom left
      part: the sloping left wall and eaves of the shelter
    - where: a line across the upper middle of the right part, below the roof beam
      part: the top of the rain cloud under the leaky roof
    - where: a vertical line down the left side of the lower right part
      part: the left curtain of falling rain
    - where: a line across from the top of the left rain line, turning straight down on the right and ending in a hook to the left
      part: the top arch and right curtain of falling rain
    - where: a straight vertical line down the middle of the rain frame, from the cloud line to the bottom
      part: a central stream of water leaking straight down
    - where: a short dot in the upper left inside the rain frame, slanting down to the right
      part: an upper-left raindrop dripping inside
    - where: a short dot in the lower left inside the rain frame, below the upper-left dot, slanting down to the right
      part: a lower-left raindrop dripping inside
    - where: a short dot in the upper right inside the rain frame, slanting down to the right
      part: an upper-right raindrop dripping inside
    - where: a short dot in the lower right inside the rain frame, below the upper-right dot, slanting down to the right
      part: a lower-right raindrop dripping inside

鸟:
  checked: argon
  object: a bird, with its head, eye, body and tail, standing on its feet
  history: >-
    The oldest forms drew a bird in profile with a crest, an eye, a body, a dangling tail and claws.
    The simplified form comes from the cursive writing of the traditional character, keeping the eye
    dot inside the head and reducing the bottom strokes to a single line across.
  layout: >-
    A bird in profile faces left and fills the frame. Its crested head occupies the upper centre,
    with the eye dot inside the head outline; its breast drops down the left side before turning
    across into the back and sweeping down on the right as a long dangling tail, while the lower
    line across forms the feet below the body. Soft pale feathers in light warm brown or pale blue
    fill the bird behind the strokes.
  exact:
    - The short sweep at the top meets the upper-left corner where both the head stroke and the long body stroke begin.
    - The upper head stroke runs across to the right, turns down, and ends in a small hook to the left above the middle turn of the body.
    - The short dot inside the head stands completely free, touching neither the head outline nor the left vertical.
    - The long body stroke runs down the left side to the middle, turns sharply across to the right, and turns down on the right side to end at the bottom in a hook up to the left.
    - The lower line across sits beneath the left corner of the body and stops short of the right tail stroke, standing completely free without touching or crossing any stroke.
  strokes:
    - where: a short sweep at the top centre, slanting down to the left
      part: the crest at the top of the bird's head
    - where: a stroke from the end of the top sweep across to the right, turning down and ending in a small hook to the left
      part: the top and back of the bird's head
    - where: a short dot inside the upper head space, slanting down to the right
      part: the bird's eye
    - where: a long stroke from the upper left of the head straight down to the middle, turning across to the right, then turning down on the right side and ending at the bottom in a hook up to the left
      part: the bird's throat, breast, back and dangling tail
    - where: a line across the lower part, from the bottom left into the open space beneath the body
      part: the bird's feet beneath its body

葬:
  checked: argon
  object: remains of the dead and a kneeling figure in the middle, laid beneath a tuft of grass at the top and resting on a wide burial mat supported from below at the bottom
  history: >-
    An ideogrammic compound that originally placed the character for death and remains (死) inside
    thick grass (茻) above and below, depicting a burial in the grass. In the modern form the upper
    grass became the grass crown (艹) and the lower grass became two supporting strokes crossing a
    horizontal line (廾).
  layout: >-
    The picture is stacked in three tiers from top to bottom. At the top, pale green blades of grass
    rise along the grass crown. In the middle under a narrow wooden cover bar, pale bleached bone
    fragments lie on the left while a small kneeling mourner faces left on the right, with a calm
    face showing eyes, a nose and a mouth, wearing simple pale clothes. At the bottom, a wide woven
    reed burial mat stretches all the way across, held up from beneath by two supporting posts or
    arms.
  exact:
    - The bottom horizontal line is the longest stroke across; the top grass line is about three quarters as long, and the middle horizontal bar is half as long as the bottom line.
    - The two short vertical strokes of the top grass cross the top horizontal line and stop with a clear gap above the middle horizontal bar.
    - In the middle section, the left sweep starts at the left end of the middle horizontal bar, the turning stroke starts near the top of that sweep and curves down to the left, and the inner dot touches the left sweep but stops short of the curved stroke.
    - On the right of the middle section, the hooked stroke starts at the middle of the horizontal bar, runs down, turns right and ends in an upward hook; the short upper-right sweep does not touch the bar above it, and its lower end touches the middle of the hooked stroke.
    - The two lower vertical strokes start below the middle section without touching it, and both cross the long bottom horizontal line; the left one curves down to the bottom left, while the right one runs straight down to a plain point with no hook.
  strokes:
    - where: a line across the top, about three quarters as long as the bottom line across
      part: the turf line of the grass above the grave
    - where: a short stroke slanting down to the right across the left side of the top line
      part: the left tuft of grass blades
    - where: a short stroke slanting slightly down to the left across the right side of the top line
      part: the right tuft of grass blades
    - where: a line across the upper middle, half as long as the bottom line across
      part: the wooden cover slab over the grave
    - where: a short sweep from the left end of the upper-middle bar down to the middle left
      part: the upper edge of the broken bone on the left
    - where: a stroke starting near the top of the left sweep, going briefly right and turning into a longer sweep down to the lower left
      part: the lower shaft of the broken bone
    - where: a short dot inside the bone shape, slanting down to the right from the middle of the upper-left sweep
      part: a notch inside the bone fragment
    - where: a short sweep in the upper-right middle, slanting down to the left to touch the upright stroke beside it
      part: the kneeling mourner's arms, folded toward the left
    - where: a stroke from the middle of the upper-middle bar running down, curving across to the right and ending in an upward hook
      part: the kneeling mourner's back and tucked legs
    - where: a very long line across the lower part of the square, the widest stroke of the character
      part: the wide woven reed mat beneath the burial
    - where: a vertical stroke on the lower left, crossing the long bottom line and curving down to the bottom left
      part: the left support holding up the burial mat
    - where: a vertical stroke on the lower right, crossing the long bottom line and running straight down to a plain point
      part: the right support holding up the burial mat

弄:
  checked: argon
  object: a string of three flat jade pieces in the upper half, held up by two hands reaching from below in the lower half
  history: >-
    An ideogrammic compound combining jade at the top with two hands at the bottom, showing two
    hands holding and playing with a jade ornament. In the modern form the jade at the top is
    written without a dot.
  layout: >-
    In the upper half hangs a jade ornament of three horizontal jade bars threaded on a central
    vertical cord, tinted pale celadon green. In the lower half, two pale-skinned hands and forearms
    reach upward from below to cradle and play with the jade above. The wide horizontal stroke
    across the lower half forms the open palms and wrists spread wide beneath the jade, while the
    two downward strokes form the left and right forearms.
  exact:
    - The upper part has three horizontal lines connected through their middles by a short vertical line, with no extra dot.
    - The top line across is a little less than half as long as the widest line across the lower half, the second line is slightly shorter than the top line, and the third line is wider than both, a little over half as long as the widest line.
    - The upper vertical line starts at the middle of the top line, crosses the middle of the second line, and stops at the middle of the third line.
    - The two downward strokes of the lower part start just below the third horizontal line, separated from it by a small gap so that the upper and lower parts do not touch.
    - The long horizontal line in the lower half spans nearly the full width of the character and crosses both of the lower downward strokes.
    - The lower left downward stroke runs straight down at first and then sweeps out to the bottom left, while the lower right stroke runs straight down to a plain point at the bottom with no hook.
  strokes:
    - where: a line across the top centre, rising slightly to the right and a little less than half as long as the widest line below
      part: the upper jade piece
    - where: a slightly shorter line across below the top line, rising slightly to the right
      part: the middle jade piece
    - where: a short vertical line down the upper centre from the middle of the top line, crossing the second line and stopping on the third line
      part: the cord threading the three jade pieces together
    - where: a line across the middle of the box, wider than the two lines above it and a little over half as long as the widest line below
      part: the lowest, widest jade piece
    - where: a very long line across the lower half from far left to far right
      part: the outstretched palms and wrists of the two hands held open beneath the jade
    - where: a stroke starting just below the left half of the lowest jade line, running down through the long horizontal line and sweeping out to the bottom left
      part: the left hand and forearm, curving down to the left
    - where: a long straight vertical line starting just below the right half of the lowest jade line, crossing the long horizontal line and running down to the bottom right of centre
      part: the right hand and forearm, reaching straight up from below

柔:
  checked: argon
  object: an upright bamboo spear above a supple tree
  history: >-
    The oldest forms drew soft, pliant twigs atop a tree 木. In the Eastern Zhou period the upper
    part was assimilated to the bamboo spear 矛 above the tree 木, evoking supple wood that bends
    without breaking.
  layout: >-
    An upright bamboo spear fills the upper half of the square, and a wide, supple tree fills the
    lower half directly beneath it, with a small gap between the butt of the spear and the top of
    the tree trunk. The spear has a pale grey-blue blade at the top, a ringed crossguard across the
    upper middle, a pale tan bamboo shaft curving down the centre, and a soft pale red tassel
    sweeping down to the left. Below, the tree has a pale brown trunk and roots, with a soft pale
    green leafy crown behind its outstretched branches.
  exact:
    - The upper spear and the lower tree do not touch; there is a small gap between the hooked bottom of the upper shaft and the top of the lower trunk.
    - The lower tree is wider than the upper spear, and its horizontal branch line is the widest stroke in the character.
    - In the upper spear, the top stroke runs across to the right, about two thirds as wide as the lower branch line, and turns sharply down to the left to meet the end of the short central dot.
    - The short central dot slants down to the right, its lower end touching the middle of the spear's crossguard and the start of the upper left sweep.
    - The spear's crossguard runs wide across the upper middle, almost as wide as the lower branch line, and ends at the right in a sharp hook down to the left.
    - Both the curved upper shaft and the upper left sweep start together at the middle of the crossguard, and the upper shaft ends in a hook up to the left.
    - In the lower tree, the straight vertical trunk crosses the horizontal branch line near the trunk's top and ends at the bottom in a plain point, with no hook.
    - The lower tree's two root sweeps start where the trunk crosses the branch line, with a small gap between their starts, and spread out to the bottom left and bottom right.
  strokes:
    - where: a short line across the top, about two thirds as wide as the lower branch line, turning sharply at the right to slant down to the left
      part: the pointed tip of the spearhead
    - where: a short dot in the upper centre slanting down to the right, where the top stroke's point meets the middle of the upper bar
      part: the collar at the base of the spearhead
    - where: a wide line across the upper middle from left to right, almost as wide as the lower branch line, rising slightly and ending in a hook down to the left
      part: the spear's crossguard, with its side ring hooked at the right end
    - where: a vertical line from the centre of the upper bar down to the middle of the character, curving slightly and ending in a hook up to the left
      part: the flexible bamboo shaft of the spear, hooked at its butt end
    - where: a sweep starting at the centre of the upper bar and running down and out to the middle left
      part: the tassel hanging from the middle of the spear
    - where: a wide line across the lower half from left to right, rising slightly
      part: the tree's main branches, spreading out to both sides
    - where: a straight vertical line down the centre of the lower half, crossing the lower branch line and ending at the bottom in a plain point
      part: the tree's trunk
    - where: a sweep from the crossing of the lower branch line and trunk down and out to the bottom left
      part: the tree's root spreading out to the left
    - where: a falling stroke from the crossing of the lower branch line and trunk down to the bottom right, turning out to the right at the foot
      part: the tree's root spreading out to the right
