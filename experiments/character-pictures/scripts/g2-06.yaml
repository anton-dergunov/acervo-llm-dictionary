乘:
  checked: argon
  object: a person climbing a tree, with the tree's crown, branch, trunk and roots as 禾 and the climber's two legs and feet flanking the trunk as 北
  history: >-
    The oldest forms drew a person high in a tree with two prominent feet below, climbing up the
    branches. In the modern form 乘, the tree and the climber at its top simplified into the
    grain-stalk shape 禾, while the two climbing feet on either side of the trunk became 北.
  layout: >-
    A tall tree fills the square from top to bottom along the central trunk, with a pale leafy
    canopy behind the upper strokes. Near the top of the tree, the climber's upper body and head
    appear in soft pale colours behind the upper branch, with a friendly face showing eyes, a nose
    and a mouth, and simple pale clothes. In the middle of the character, flanking the trunk below
    the main branch, the two halves of 北 are the climber's left and right legs and feet braced
    asynchronously against the tree as they climb, while the two long lower sweeps form the tree's
    spreading roots at the base.
  exact:
    - The central trunk starts at the middle of the top slanting stroke, crosses the long upper line across, and runs straight down to a plain point at the bottom with no hook.
    - The long upper line across is the widest horizontal stroke, about four times as long as the short horizontal stroke on the middle left.
    - On the left of the trunk below the upper line across, the short vertical is about a third as long as the trunk and touches neither the upper line across nor the trunk; the two short strokes to its left both end on its left side.
    - On the right of the trunk below the upper line across, the curved stroke goes down for about a third of the trunk's length, turns across to the right, and ends in a sharp hook up; the short slanting sweep from the right touches the middle of its vertical leg.
    - The two long lower sweeps both start on the central trunk near its middle, just below the flanking middle strokes, and sweep out to the bottom left and bottom right without touching each other at their starts.
  strokes:
    - where: a short sweep at the very top, running from right to left and slanting down to the left
      part: the topmost bough at the crown of the tree, drooping to the left
    - where: a long line across the upper part, rising slightly from left to right
      part: the main upper branch of the tree, which the climber holds
    - where: a long straight line down the middle from the top sweep to the very bottom, with no hook
      part: the tree's tall central trunk
    - where: a short vertical line down on the left side of the trunk, below the main branch
      part: the climber's left shin and ankle, braced beside the trunk
    - where: a short line across in the middle left, rising slightly to touch the middle of the left short vertical
      part: the upper edge of the climber's left foot, sticking out to the left
    - where: a short stroke in the lower middle left, rising to the right to touch the lower part of the left short vertical
      part: the sole and heel of the climber's left foot
    - where: a short sweep in the middle right, slanting down to the left, about a third as long as the lower left root sweep
      part: the top of the climber's right foot and ankle strap
    - where: a stroke to the right of the trunk going down, turning across to the right, and ending in an upward hook
      part: the climber's right lower leg and foot, the upward hook forming the upturned toe
    - where: a long sweep from the middle of the central trunk down and out to the bottom left
      part: the tree's left root spreading into the ground
    - where: a long falling stroke from the middle of the central trunk down and out to the bottom right
      part: the tree's right root spreading into the ground

乙:
  checked: argon
  object: a young plant shoot, bent in a winding curve as it sprouts
  history: >-
    A pictogram whose earliest meaning is debated: the Shuowen reads its winding line as a young
    plant shoot bending as it pushes up to sprout, while other scholars see a winding flow of water.
  layout: >-
    One young sprouting shoot fills the square, its stem following the single winding stroke from
    top to bottom. A pair of soft, pale green seed-leaves unfurls behind the upper bend of the stem,
    and a pale tan seed husk sits around the rounded bottom curve, with no dark outlines.
  exact:
    - The entire character is one continuous stroke with no breaks.
    - The stroke begins near the upper left, runs across to the right, and turns at a sharp angle at the upper right to sweep diagonally down to the lower left.
    - At the bottom left the stroke curves smoothly into a wide, rounded base across the bottom and ends in a tall upward hook at the lower right.
  strokes:
    - where: a single continuous stroke running across the top to the right, turning sharply down to the bottom left, then curving across the bottom and hooking straight up on the right
      part: the bent stem of the sprouting shoot, from its upper tip down through its curved base to its upturned root end

匹:
  checked: argon
  object: a folded bolt of woven cloth seen from the side, with an outer fold wrapping the top, left and bottom and two tucked inner folds inside
  history: >-
    Bronze inscriptions and early scholars read the character as a picture of layers and folds in a
    bolt of cloth, later regularized into an outer three-sided wrap enclosing two inner strokes that
    show the tucked folds of fabric.
  layout: >-
    A thick bolt of pale cream and soft indigo-tinted woven fabric fills the square, seen in
    cross-section from the side with its folded spine on the left and its open side on the right.
    The top line and the long left-and-bottom stroke form the outer wrap of the bolt, while the two
    inner strokes form the creases of the fabric folded and tucked inside. Soft fabric weave and
    pale shading lie between the layers behind the strokes.
  exact:
    - The top line's left end touches the top of the left vertical stroke, and the frame stays completely open on the right.
    - The left inner sweep stands completely free inside the frame, with a small gap below the top line and a small gap above the bottom turn of the outer stroke.
    - The right inner stroke starts touching the middle of the top line, runs down, turns across to the right, and ends in a prominent upward hook.
    - The outer stroke runs down the left side—the longest downward leg—before turning sharply at the bottom left to run across the bottom to the right with a plain end.
    - The downward leg of the right inner stroke is a little over half as long as the outer left vertical, and the left inner sweep is shorter still.
  strokes:
    - where: a line across the top from the upper left to the upper right
      part: the top layer of the folded bolt of cloth
    - where: a short stroke in the left middle, running down and sweeping to the lower left without touching any other stroke
      part: an inner fold of cloth hanging down to the left inside the bolt
    - where: a stroke starting from the middle of the top line, running about halfway down, then turning across to the right and ending in an upward hook
      part: a tucked inner layer of cloth folding to the right and curling up at its end
    - where: a long stroke running straight down the left side from the start of the top line, then turning sharply at the bottom left to run across the bottom to the right
      part: the outer fold of the bolt, running down the spine on the left and along the bottom layer

