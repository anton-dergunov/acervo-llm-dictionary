# Full run, group g2, batch 06. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

幻:
  checked: argon
  object: a skein of twisted silk thread on the left, with a long strand drawn out and curving down into a hook on the right
  history: >-
    The character was borrowed for its sound to mean illusion. Ji Xusheng reads its oldest form as a
    variant of 玄, showing a twisted skein of silk thread (幺) on the left with one stroke elongated
    on the right to distinguish the two characters.
  layout: >-
    The twisted silk skein fills the left half, with two angled loops stacked one above the other
    and bound at the lower right. In the right half, separated by a clear gap, the elongated silk
    strand runs across, turns down, and hooks to the left. Pale, soft silk fibres surround the skein
    and the trailing strand behind the strokes.
  exact:
    - In the left part, the upper bent stroke runs down to the left and turns across to the right, its end touching the middle of the lower bent stroke.
    - The lower bent stroke sweeps down to the bottom left and turns up to the right, its end touching the middle of the short slanting stroke.
    - The short stroke at the lower right of the left part slants down to the right.
    - The right stroke runs across to the right, turns sharply down, and ends in a hook up to the left.
    - The left part and the right stroke do not touch; the right stroke stands completely free.
  strokes:
    - where: a stroke in the upper left running down and to the left, then turning sharply across and rising slightly to the right
      part: the upper loop of the twisted silk skein
    - where: a stroke in the left half starting below the top of the upper loop, sweeping down to the bottom left and turning up to the right
      part: the lower loop of the twisted silk skein
    - where: a short stroke at the lower right of the left half, slanting down to the right across the end of the lower loop
      part: the short tied end binding the silk skein
    - where: a long stroke in the right half running across to the right, turning down, and ending in a hook up to the left
      part: the elongated silk strand drawn out to the right and curving up at the tip

