唐:
  checked: argon
  object: a hollow ritual percussion drum hung on a wooden stand, with its open resonating chamber at the bottom
  history: >-
    The oldest forms drew a hollow ritual percussion instrument with a box-like mark at the bottom
    highlighting its hollowness, and were borrowed for the name of King Tang. In the modern form the
    upper part of the instrument merged into a sheltering frame on the left and a crossed body in
    the middle above the bottom opening.
  layout: >-
    A tall wooden stand wraps from the top and down the left side. Inside it hangs the body of a
    pale bronze or wooden ritual drum suspended on a central shaft, with a wide horizontal band
    crossing through its middle. Below the drum body sits a rectangular hollow resonating box. All
    fills use soft pale warm tones of wood and bronze behind the strokes.
  exact:
    - The short slanting dot at the top centre stands free above the top crossbar without touching it.
    - The top crossbar starts at the top of the long left sweep and is about three quarters as long as the widest middle line.
    - The central vertical shaft starts just below the top crossbar without touching it, crosses all three horizontal lines of the middle body, and ends in a plain point just below the third line without touching the bottom box.
    - In the middle body, the upper line runs across and turns down to the left to close on the right end of the lower line; the middle line is the longest horizontal and crosses cleanly through both the vertical shaft and the right side of the frame, without touching the long left sweep.
    - The bottom box has a left vertical, a top-and-right stroke that turns down at the corner, and a bottom line that closes the box from the bottom of the left vertical to the bottom of the right side.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the top finial of the wooden stand
    - where: a line across the upper part, rising slightly to the right
      part: the horizontal beam of the stand
    - where: a long stroke from the left end of the upper beam down the left side, sweeping out to the bottom left
      part: the tall side post of the stand
    - where: a line across the upper middle, turning down to the left on the right side
      part: the upper rim and right wall of the drum's casing
    - where: a long line across the middle, extending from near the left post out past the right wall
      part: the wide striking band across the middle of the drum
    - where: a shorter line across the lower middle, debajo of the wide band
      part: the lower rim of the drum's casing
    - where: a straight line down the middle from just below the top beam through the three middle lines
      part: the central shaft suspending the drum
    - where: a short line down on the lower left, tilting slightly to the right
      part: the left wall of the hollow resonating chamber at the base
    - where: a line across the top of the lower box, turning down on the right side
      part: the top and right walls of the hollow resonating chamber
    - where: a line across the bottom of the lower box, joining the left wall to the right wall
      part: the floor of the hollow resonating chamber

