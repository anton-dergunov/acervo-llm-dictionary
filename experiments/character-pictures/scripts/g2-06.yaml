孙:
  checked: argon
  object: a child on the left beside a hanging skein of silk thread on the right, representing a line of descent
  history: >-
    The traditional form 孫 is an ideogrammic compound combining a child (子) on the left with a tied
    skein of silk thread (系) on the right to represent the continuation of a family line. The
    simplified form 孙 comes from the cursive writing of 孫, which reduced the silk skein on the right
    into the three strokes of 小.
  layout: >-
    The left half shows a small child wrapped in pale swaddling cloth, facing right toward the silk
    skein, with a friendly face showing eyes, a nose and a mouth, and outstretched arms rising to
    the right. The right half shows a vertical skein of pale silk thread hanging down the middle,
    with two loose side strands flanking it at middle height. All colours are soft and pale behind
    the strokes.
  exact:
    - In the left half, the top stroke runs across, rises slightly to the right, and turns sharply down to the left to meet the start of the curved vertical body stroke.
    - The left half's rising stroke slants upward from the far left toward the centre, crossing the middle of the curved vertical stroke.
    - Both the curved vertical stroke in the left half and the long straight vertical stroke in the right half end at the bottom in a hook up to the left.
    - The three strokes of the right half—the tall central vertical and the two short side strokes at middle height—all stand completely free of one another.
    - The short left-slanting stroke to the left of the right vertical does not touch the child's strokes on the left, leaving a small clear gap between the two halves.
  strokes:
    - where: a line across the top of the left half, rising slightly to the right and turning sharply down to the left
      part: the top and side of the child's head
    - where: a long curved line down the middle of the left half, bowing slightly right and ending at the bottom in a hook up to the left
      part: the child's swaddled body, the hook at the bottom its bundled feet
    - where: a rising line across the middle of the left half, slanting up from the far left toward the centre
      part: the child's arms, held out and reaching up toward the right
    - where: a long straight line down the middle of the right half, ending at the bottom in a hook up to the left
      part: the main hanging cord of the silk skein, hooked at its lower end
    - where: a short stroke near the centre at middle height, to the left of the right vertical, slanting down to the left
      part: the left loose strand of the silk skein
    - where: a short stroke on the far right at middle height, to the right of the right vertical, slanting down to the right
      part: the right loose strand of the silk skein

