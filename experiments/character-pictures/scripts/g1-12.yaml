# Full run, group g1, batch 12. Written from the fact sheets, following scripts/GUIDE.md.

汽:
  object: steam rising from water, a stream on the left and a person breathing out a drifting cloud of vapour on the right
  history: >-
    An ideogram: water 氵 and gas 气, the vapour that rises from water. The gas part also gives the
    sound.
  layout: >-
    A small stream of pale blue water fills the narrow left part of the frame. On the right a small
    person with a friendly face (eyes, nose, mouth) and simple pale clothes bends slightly forward
    and breathes out layers of soft white vapour that drift to the right above the lower ribbon.
    Colours are pale blue and white.
  exact:
    - The stream on the left and the person on the right do not touch.
    - The person's back sweeps down to the lower left; the first puff of breath starts on the middle of that back, and the second puff stands apart from both.
    - The two upper puffs are short and about equal, each about a quarter as long as the long ribbon below.
    - The long ribbon is by far the longest stroke; it rises slightly, turns down at the right and ends in a small hook turning up.
    - The ribbon starts apart from the end of the rising current, with a small gap between them.
  strokes:
    - where: a short slanting dot at the upper left, running down to the right
      part: a drop at the top of the stream
    - where: a short slanting dot at the middle left, running down to the right
      part: a second drop, splashing off the water
    - where: a stroke at the lower left rising to the right up to the centre of the left part
      part: the current of the water, lifting toward the steam
    - where: a sweep in the upper part of the right half, going down to the right and turning down to the lower left
      part: the person's back, bent slightly forward
    - where: a short line across the top of the right half, rising slightly to the right, starting on the middle of the sweep
      part: the first puff of breath leaving the person's mouth
    - where: a short line across the middle of the right half, rising slightly to the right, apart from the others
      part: a second, lower layer of the breath
    - where: a very long line across the lower half, rising slightly, then turning down at the right and ending in a small hook turning up
      part: the long ribbon of vapour drifting out and curling over at its end

伸:
  object: a person stretching an arm out toward a bolt of lightning striking straight down through a pale box of light
  history: >-
    An ideogram: a person 亻 extending something 申 to another. The right part is a bolt of lightning
    through a flash of light, and it also gives the sound.
  layout: >-
    The person stands on the left, tall, with a friendly face (eyes, nose, mouth) and simple pale
    clothes, an arm reaching toward the right. On the right a pale yellow box of light stands as a
    flash, and a straight bolt of lightning runs down through its middle, longer than the box itself.
  exact:
    - The person's right leg starts on the middle of the body sweep.
    - The box's left edge is a short line; the top and right side are one stroke turning down at the top right and ending in a hook to the left.
    - The two bars inside the box cross the bolt and do not touch the left edge or the top stroke; the lower bar closes the box from the left edge to the right edge.
    - The bolt is a straight vertical ending in a plain point, with no hook, running from above the box to below it and crossing the top stroke and both bars.
    - The bolt is the longest stroke of the right part, nearly as tall as the whole frame.
  strokes:
    - where: a long sweep from the upper left down and out to the bottom left
      part: the person's body, running down into the left leg
    - where: a vertical line from the middle of the body sweep down to the bottom of the left part
      part: the person's right leg
    - where: a short line down the left side of the box, slanting a little to the right
      part: the left edge of the flash of light
    - where: a line across the top of the box, turning down at the right and running down the right side, ending in a hook to the left
      part: the top and right edge of the flash
    - where: a short line across the middle of the box, crossing the vertical
      part: the bright band at the heart of the flash
    - where: a line across the lower part of the box, rising a little to the right, crossing the vertical
      part: the bottom edge of the flash
    - where: a long straight vertical down the middle of the right part, from near the top of the frame to near the bottom
      part: the lightning bolt, striking straight down through the flash

針:
  object: a cast-iron bell beside a long metal pin standing upright
  history: >-
    An ideogram: metal 釒 and a pin 十. The metal part is the form of 金, which the oldest forms drew
    as a cast-iron bell.
  layout: >-
    On the left half hangs a small pale grey iron bell. On the right half a long straight pin stands
    upright, with a flat crossbar head set across it high up. The bell and the pin are separate things
    and do not touch. Pale grey metal on a pale ground.
  exact:
    - The bell's dome stroke turns sharply and sweeps to the lower left; the small top knob and the rising band both start on it.
    - The central post of the bell runs down from the upper band, crossing the lower band, and ends on the middle of the bottom rim.
    - The short dot at the lower left and the short slanting stroke at the lower right of the bell stand free of every other stroke and do not touch the post or the rim.
    - The lower band is about two thirds as long as the pin's crossbar; the bottom rim is nearly as long as the crossbar.
    - The pin's crossbar is the longest across stroke and crosses the pin high up; the pin is a straight vertical ending in a plain point, with no hook, and it is the longest stroke.
    - The bell's post is only about a third as long as the pin.
  strokes:
    - where: a stroke from the top centre of the left half, down and turning sharply to sweep down to the lower left
      part: the bell's left side and shoulder
    - where: a short dot at the top, slanting down to the right, starting on the tip of the first stroke
      part: the bell's top knob
    - where: a short stroke at the upper left, rising to the right, starting on the middle of the bell's side
      part: the bell's upper band
    - where: a line across the middle of the left half, rising slightly to the right
      part: the bell's lower band
    - where: a short vertical line down from the middle of the upper band, crossing the lower band
      part: the post at the centre of the bell
    - where: a small dot below the lower band at the left, slanting down to the right
      part: a stud on the bell's left
    - where: a short stroke below the lower band near the middle, slanting down to the left
      part: a stud on the bell's right
    - where: a line across the bottom of the left half, turning up to the right at its end
      part: the bell's rim; the post ends on its middle
    - where: a long line across the upper-middle of the right half, rising slightly to the right
      part: the pin's flat crossbar head
    - where: a long straight vertical down the middle of the right half, from the top almost to the bottom, crossing the line across
      part: the pin's shaft, ending in a point

针:
  object: a cast-iron bell beside a long metal pin standing upright
  history: >-
    An ideogram: metal 钅 and a pin 十. The metal part is the form of 金, which the oldest forms drew
    as a cast-iron bell.
  layout: >-
    On the left half hangs a small pale grey iron bell. On the right half a long straight pin stands
    upright, with a flat crossbar head set across it high up. The bell and the pin are separate things
    and do not touch. Pale grey metal on a pale ground.
  exact:
    - The bell's rising top band starts on the middle of the side stroke; the side stroke does not touch the upper band under it, with a small gap between them.
    - The central post starts on the upper band and crosses the lower band, then turns up to the right at its foot as the rim.
    - The upper band is about half as long as the pin's crossbar; the lower band is about seven tenths as long.
    - The bell's post is about six tenths as long as the pin.
    - The pin is a straight vertical ending in a plain point, with no hook; the crossbar crosses it high up and is the longest across stroke.
    - The lower band does not touch the crossbar, with a small gap between them.
  strokes:
    - where: a stroke from the top of the left half, down and turning sharply to sweep down to the lower left
      part: the bell's left side and shoulder
    - where: a short stroke across the upper part of the left half, rising to the right, starting on the middle of the side
      part: the bell's top band
    - where: a short line across the middle of the left half, rising slightly to the right
      part: the bell's upper band
    - where: a longer line across the lower middle of the left half, rising slightly to the right
      part: the bell's lower band
    - where: a vertical line from the middle of the upper band down to the bottom of the left half, turning up to the right at its foot
      part: the post at the centre of the bell, and the bell's rim sweeping out at the foot
    - where: a long line across the upper-middle of the right half, rising slightly to the right
      part: the pin's flat crossbar head
    - where: a long straight vertical down the middle of the right half, from the top almost to the bottom, crossing the line across
      part: the pin's shaft, ending in a point

国:
  object: a walled country, with its treasure kept safe inside the borders
  history: >-
    An ideogram: a border 囗 around a treasure. The older form put a spear 或 inside to guard the
    land; the simplified form puts a jade treasure 玉 there.
  layout: >-
    A strong pale stone wall frames the whole square as the country's border, with a small gap
    nowhere. Inside it, in the middle, hangs a jade necklace on a cord with three pale green jade
    pieces and a small bead. The wall is below and around it; nothing else is inside.
  exact:
    - "The left wall and the top-and-right wall are one corner: the top wall starts at the top of the left wall, runs across and turns down on the right, ending at the bottom right."
    - The bottom wall starts where the left wall ends and ends touching the right wall.
    - The jade does not touch the wall anywhere.
    - "The three jade pieces: the top and middle ones are about equal, each a little under a third as long as the top wall; the lowest piece is clearly longer, about one and a third times as long as either."
    - The cord runs from the top piece down to the lowest piece and crosses the middle piece.
    - The small bead at the right stands free, below the middle piece and above the lowest piece, and touches nothing.
  strokes:
    - where: a long vertical line down the left side of the frame
      part: the left wall of the border
    - where: a line across the top, starting at the top of the left wall, turning down at the right and running down the right side
      part: the top wall and the right wall of the border
    - where: a short line across the upper part of the middle, rising a little to the right
      part: the upper jade piece
    - where: a short line across the middle, almost as long as the top one, crossing the vertical
      part: the middle jade piece
    - where: a short vertical line down the middle from the top piece to the lowest piece, crossing the middle piece
      part: the cord of the necklace
    - where: a line across below the middle, clearly longer than the top two
      part: the lowest, widest jade piece
    - where: a small dot at the right, below the middle line and above the lowest line, slanting down to the right
      part: the small jade bead
    - where: a line across the bottom, rising slightly to the right, from the foot of the left wall to the right wall
      part: the bottom wall of the border

國:
  object: a walled country, with its treasure kept safe inside the borders
  history: >-
    An ideogram: a border 囗 around a treasure. The older form put a spear 或 inside to guard the
    land; the simplified form puts a jade treasure 玉 there.
  layout: >-
    A strong pale stone wall frames the whole square as the country's border. Inside it, in the
    middle, a small walled homestead stands on a short line of ground at its lower left, and a tall
    spear stands guard to its right, its long shaft curving at the foot and ending in an upturned
    point. A small pale tassel hangs at the spear's head. The wall is below and around it all.
  exact:
    - "The left wall and the top-and-right wall are one corner: the top wall starts at the top of the left wall, runs across and turns down on the right, ending at the bottom right."
    - The bottom wall starts where the left wall ends and ends touching the right wall.
    - The spear's crosspiece crosses the shaft and is clearly shorter than the top wall, about a quarter as long.
    - The spear's shaft is a long stroke going down, then curving to the right, ending in a hook up; a sweep from the middle of the shaft goes down to the lower left and crosses it.
    - The tassel at the top right is a small separate dot touching nothing.
    - The homestead is a small box with a short vertical on the left, a top and right side in one stroke, and a bottom line closing it; the tiny base line under it is wider than the box and rises at its right end.
    - The spear's sweep stops short of the homestead, with a small gap between them; the homestead does not touch the wall.
  strokes:
    - where: a long vertical line down the left side of the frame
      part: the left wall of the border
    - where: a line across the top, starting at the top of the left wall, turning down at the right and running down the right side
      part: the top wall and the right wall of the border
    - where: a short line across the upper middle, rising a little to the right
      part: the spear's crosspiece
    - where: a short vertical on the left of the middle, below the crosspiece
      part: the homestead's left wall
    - where: a line from the top of the left wall of the homestead across, rising a little, then turning down on the right
      part: the homestead's roof and right wall
    - where: a short dot-like line across the bottom of the homestead, rising slightly to the right
      part: the homestead's floor, closing the box
    - where: a rising line at the lower left of the middle, below the homestead, rising to the right
      part: the ground the homestead stands on
    - where: a long stroke starting at the top of the middle, running down, then curving to the right and ending in a hook up
      part: the spear's long shaft
    - where: a sweep from the middle right of the shaft down to the lower left, crossing it
      part: the spear's blade
    - where: a small dot at the top right, slanting down to the right, apart from the shaft
      part: the spear's tassel
    - where: a line across the bottom, rising slightly to the right, from the foot of the left wall to the right wall
      part: the bottom wall of the border

学:
  object: a school building with a child inside it, learning
  history: >-
    An ideogram: a building 冖 where children 子 study. The top part, three small marks, also gives
    the sound.
  layout: >-
    A broad pale roof covers the upper part of the frame; three small pale roof ornaments sit along its
    top. Under the roof the child sits at the lower part, a baby wrapped in a pale cloth with its arms
    out wide, with a friendly face (eyes, nose, mouth). The child fills the lower half.
  exact:
    - The three small ornaments on top stand free of each other and of the roof; the two short ones on the left are about equal, and the right one is longer and turns down to the left.
    - The roof's left edge is a short line down; the ridge starts there, runs across to the right and ends in a small hook down to the left.
    - The child's head line runs across and turns back down to the left; it ends where the body begins, touching the body stroke.
    - The body is a long stroke, starting at the end of the head line, running down and ending in a hook to the left.
    - The child's arms are a straight line across, about as long as the roof ridge, crossing the body; the arms do not touch the head line.
  strokes:
    - where: a short slanting dot at the upper left, running down to the right
      part: the left roof ornament
    - where: a short slanting dot at the top centre, running down to the right
      part: the middle roof ornament
    - where: a longer stroke at the upper right, running down to the left after a short slant to the right
      part: the right roof ornament
    - where: a short line down at the left of the roof
      part: the roof's left edge
    - where: a long line across the roof, starting at the top of the left edge, ending in a small hook down to the left
      part: the roof's ridge and right edge
    - where: a line across the upper part of the child, turning back down to the left to end at the centre
      part: the child's head, its top and right side
    - where: a long line down the centre, starting at the end of the head line, ending at the bottom in a hook to the left
      part: the body in its wrap, the hook its feet
    - where: a long line across the middle of the child, from near the left edge to near the right edge
      part: both arms, stretched out wide

學:
  object: a school building with a child inside it, learning
  history: >-
    An ideogram: a building 冖 where children 子 study. The top part, two hands reaching toward a
    pattern of crossing marks, shows teaching.
  layout: >-
    Two small raised hands, one on each side, reach toward two small crossed marks that sit one above
    the other in the middle at the top. Under them a broad pale roof spreads across the middle of the
    frame. The child sits below it, a baby wrapped in a pale cloth with its arms out wide, with a
    friendly face (eyes, nose, mouth). The child fills the lower half.
  exact:
    - The left hand is a short sweep ending at the start of a longer stroke slanting down to the right; two small dots touch that longer stroke on its right.
    - The right hand is a stroke across the top turning down on the right; two small dots on its left touch it.
    - The upper crossed mark is two strokes crossing, one down to the left and one down to the right; the lower crossed mark is the same, a little below; the two marks stand apart from the hands and from the roof.
    - The roof's left edge is a short line down; the ridge is a long line across ending in a small hook down to the left; the lowest end of the left hand's long stroke touches the start of the ridge.
    - The lower end of the right hand touches the middle of the ridge.
    - The child's head line runs across and turns back down to the left, ending where the body begins; the body ends in a hook to the left; the arms are a straight line across, a little shorter than the ridge.
  strokes:
    - where: a short sweep at the upper left, down to the left
      part: the left hand's thumb
    - where: a stroke from the upper left of the middle down to the right
      part: the left hand's palm and arm
    - where: a small dot on the right of the left hand, upper, rising to the right
      part: a finger of the left hand
    - where: a small dot on the right of the left hand, lower, rising to the right
      part: another finger of the left hand
    - where: a sweep at the top centre, down to the left
      part: the upper crossed mark, its first stroke
    - where: a stroke at the top centre, down to the right, crossing the previous one
      part: the upper crossed mark, its second stroke
    - where: a sweep below the upper mark, down to the left
      part: the lower crossed mark, its first stroke
    - where: a stroke below the upper mark, down to the right, crossing the previous one
      part: the lower crossed mark, its second stroke
    - where: a stroke at the upper right, across to the right and then turning down on the right side
      part: the right hand's arm and palm
    - where: a small dot-like line at the right, upper, rising slightly to the right, ending on the right hand
      part: a finger of the right hand
    - where: a small dot-like line at the right, lower, rising slightly to the right, ending on the right hand
      part: another finger of the right hand
    - where: a short line down at the left of the roof
      part: the roof's left edge
    - where: a long line across the roof, starting at the top of the left edge, ending in a small hook down to the left
      part: the roof's ridge and right edge
    - where: a line across the upper part of the child, turning back down to the left to end at the centre
      part: the child's head, its top and right side
    - where: a long line down the centre, ending at the bottom in a hook to the left
      part: the body in its wrap, the hook its feet
    - where: a long line across the middle of the child, from near the left edge to near the right edge
      part: both arms, stretched out wide

話:
  object: a mouth speaking, with lines of sound rising from it, beside a mouth with its tongue stuck out
  history: >-
    An ideogram: speech 言 and a tongue 舌. The tongue part also gives the sound. The oldest forms
    drew a mouth with a tongue coming out of it.
  layout: >-
    On the left a small mouth with pale lips speaks, and four soft lines of sound rise above it. On
    the right a second, larger mouth with pale lips has a pink tongue standing up out of it. Colours
    are pale pink and cream. The two parts are separate.
  exact:
    - The four lines of sound on the left stand free of each other and of the mouth; the top one is a small dot, the second is long, the next two are short and about equal, each about half as long as the second.
    - "The small mouth: a short vertical on the left, a line across the top turning down on the right, and a bottom line that meets the end of the top line."
    - "The tongue: the sweep at the top starts at the right and runs to the left; the line across and the vertical cross each other, and the vertical starts on the sweep."
    - The line across the tongue is the longest of the right part, and the vertical runs from the sweep down to the mouth's top, touching it.
    - "The larger mouth: a vertical on the left; a top and right side in one stroke ending in a small hook down to the left; and a bottom line touching the vertical and the hook."
  strokes:
    - where: a small slanting dot at the top of the left part, running down to the right
      part: the first puff of sound
    - where: a long line across the upper left, rising slightly to the right
      part: the longest line of sound
    - where: a short line across below it, rising slightly to the right
      part: a line of sound
    - where: a short line across below that, about as long as the previous one, rising slightly to the right
      part: another line of sound
    - where: a short vertical at the lower left
      part: the speaking mouth's left side
    - where: a line across the lower left, rising slightly to the right, then turning down at its end
      part: the speaking mouth's top lip and right side
    - where: a short line across the very bottom of the left part, rising slightly to the right
      part: the speaking mouth's lower lip
    - where: a sweep at the top of the right part, from the right down to the left
      part: the tongue's tip, curling to the left
    - where: a long line across the middle of the right part, rising slightly to the right
      part: the tongue's wide upper surface
    - where: a vertical line down from the sweep, crossing the line across and ending at the top of the larger mouth
      part: the tongue's centre, running into the mouth
    - where: a vertical line at the lower left of the right part
      part: the larger mouth's left side
    - where: a line across from the top of that vertical, turning down at the right and ending in a small hook down to the left
      part: the larger mouth's upper lip and right side
    - where: a line across the bottom of the larger mouth, rising slightly to the right
      part: the larger mouth's lower lip

话:
  object: a mouth speaking, with lines of sound rising from it, beside a mouth with its tongue stuck out
  history: >-
    An ideogram: speech 言 and a tongue 舌. The tongue part also gives the sound. The oldest forms
    drew a mouth with a tongue coming out of it.
  layout: >-
    On the left a small speaking mouth with pale lips, with a small puff of sound above it. On the
    right a second, larger mouth with pale lips has a pink tongue standing up out of it. Colours are
    pale pink and cream. The two parts are separate.
  exact:
    - The speaking mouth stands apart from the larger mouth, with a small gap.
    - The puff at the top is a small slanting dot that stands free; the mouth stroke is long, lying across, then turning down and finally up.
    - "The tongue: the sweep at the top starts at the right and runs to the left; the line across and the vertical cross each other, and the vertical starts on the sweep."
    - The line across the tongue is the longest of the right part, and the vertical runs from the sweep down onto the larger mouth's top, touching it.
    - "The larger mouth: a vertical on the left; a top and right side in one stroke ending in a small hook down to the left; and a bottom line meeting the vertical and the hook."
  strokes:
    - where: a small slanting dot at the top of the left part, running down to the right
      part: the puff of sound
    - where: a long stroke across the lower left, rising slightly to the right, then turning down at the right and rising again to the right at its end
      part: the speaking mouth, its upper lip, cheek and lower lip
    - where: a sweep at the top of the right part, from the right down to the left
      part: the tongue's tip, curling to the left
    - where: a long line across the middle of the right part, rising slightly to the right
      part: the tongue's wide upper surface
    - where: a vertical line down from the sweep, crossing the line across and ending at the top of the larger mouth
      part: the tongue's centre, running into the mouth
    - where: a vertical line at the lower left of the right part
      part: the larger mouth's left side
    - where: a line across from the top of that vertical, turning down at the right and ending in a small hook down to the left
      part: the larger mouth's upper lip and right side
    - where: a line across the bottom of the larger mouth, rising slightly to the right
      part: the larger mouth's lower lip

定:
  object: a person settled under a roof, standing firmly
  history: >-
    An ideogram: a person 疋 settling under a roof 宀. The lower part is a leg and a foot, and the
    person stands firmly.
  layout: >-
    A pale roof covers the upper part of the frame, with a small pale ornament at its peak. Under it a
    person stands firmly, filling the lower part of the frame, with a friendly face (eyes, nose,
    mouth) and simple pale clothes. The legs are apart and the right foot is set flat.
  exact:
    - The small ornament at the top stands free of the roof, with a gap between it and the ridge.
    - The roof's left edge is a short vertical; the ridge starts on the middle of that edge, runs across to the right and ends in a small hook down to the left.
    - The person's shoulders do not touch the roof, with a small gap under the ridge.
    - The body starts on the middle of the shoulders; the arm starts on the middle of the body.
    - The left leg is a long sweep down to the lower left; the right leg starts on the middle of the left leg and sweeps down to the right, ending in a flat foot across to the right; the body ends on the middle of the right leg.
    - The right leg is clearly the longest stroke.
  strokes:
    - where: a short slanting dot at the top centre, running down to the right
      part: the ornament at the roof's peak
    - where: a short vertical at the left of the roof
      part: the roof's left edge
    - where: a long line across the roof, starting on the middle of the left edge, rising slightly and ending in a small hook down to the left
      part: the roof's ridge and right edge
    - where: a medium line across below the roof, rising slightly to the right
      part: the person's shoulders
    - where: a short stroke down from the middle of the shoulders, slanting to the right then straight down
      part: the person's body
    - where: a short line across to the right, starting on the middle of the body
      part: the person's arm
    - where: a sweep from the left of the body, going down and out to the bottom left
      part: the person's left leg
    - where: a long stroke starting on the middle of the left leg, down to the right and then turning across to the right
      part: the person's right leg, ending in a flat foot, with the body ending on it

现:
  object: a standing man whose head is one large eye, looking at a piece of jade
  history: >-
    An ideogram: seeing 见 jade 王. The right part is a man whose head is one large eye, and it also
    gives the sound.
  layout: >-
    On the left a pale green jade necklace hangs on a cord, with a small upper jade piece, a small
    middle piece and a wide lowest piece. On the right stands a man with a single large eye as his head
    (a simple face is the eye with a nose and mouth beneath), simple pale clothes, looking toward the
    jade on his left.
  exact:
    - The jade's top piece and middle piece are about equal; the lowest piece is clearly longer, the top piece about three quarters as long as it.
    - The cord runs from the top piece down, crossing the middle piece and touching the lowest piece, which rises a little at its right end.
    - The jade does not touch the man.
    - "The eye's frame is open at the bottom: a short stroke down the left side, and a stroke across the top turning down on the right."
    - The man's body starts inside the frame and sweeps down to the lower left; the right leg starts on the middle of the body, runs down and then across to the right, ending in a small hook turning up.
    - The right leg is nearly as long as the body.
  strokes:
    - where: a short line across the upper part of the left, rising slightly to the right
      part: the upper jade piece
    - where: a short line across the middle of the left, rising slightly to the right, about as long as the upper one
      part: the middle jade piece
    - where: a straight vertical down from the middle of the upper piece to the lowest piece, crossing the middle piece
      part: the necklace cord
    - where: a line across the bottom of the left, clearly longer, turning up to the right at its end
      part: the lowest, widest jade piece
    - where: a short vertical line down the left side of the right part, from the top, slanting a little to the right
      part: the eye's left lid
    - where: a line across the top of the right part, starting on the top of the lid, turning down at the right and running down the right side
      part: the eye's top corner and right lid
    - where: a long sweep starting inside the frame near its top and running down and out to the bottom left
      part: the man's body, running into his left leg
    - where: a stroke starting on the middle of the body, running down, then across to the right and ending in a small hook turning up
      part: the man's right leg, with its foot turned up

現:
  object: a standing man whose head is one large eye, looking at a piece of jade
  history: >-
    An ideogram: seeing 見 jade 王. The right part is a man whose head is one large eye, and it also
    gives the sound.
  layout: >-
    On the left a pale green jade necklace hangs on a cord, with a small upper jade piece, a small
    middle piece and a wide lowest piece. On the right stands a man with a single large eye as his
    head, with a pale brown iris between the two inner lines, a nose and mouth beneath, and simple pale
    clothes, looking toward the jade on his left.
  exact:
    - The jade's top piece and middle piece are about equal; the lowest piece is clearly longer, the top piece a little over half as long as it.
    - The cord runs from the top piece down, crossing the middle piece and touching the lowest piece, which rises a little at its right end.
    - The jade does not touch the man.
    - "The eye's frame: a line down the left side; a line across the top, turning down on the right and ending on the bottom line."
    - The two inner lines are short and touch the left side; the upper is a little shorter than the lower, and both stop short of the right side.
    - The bottom line of the eye closes the frame, longer than the two inner lines.
    - The left leg is a sweep from just below the bottom line down to the lower left and does not touch the right leg's start.
    - The right leg starts on the middle of the bottom line, runs down, then across to the right and ends in a small hook turning up.
  strokes:
    - where: a short line across the upper part of the left, rising slightly to the right
      part: the upper jade piece
    - where: a short line across the middle of the left, rising slightly to the right, about as long as the upper one
      part: the middle jade piece
    - where: a straight vertical down from the middle of the upper piece to the lowest piece, crossing the middle piece
      part: the necklace cord
    - where: a line across the bottom of the left, clearly longer, turning up to the right at its end
      part: the lowest, widest jade piece
    - where: a line down the left side of the eye, from the top to the bottom
      part: the eye's left lid
    - where: a line across the top of the eye, starting on the lid, turning down at the right and running down the right side
      part: the eye's top corner and right lid
    - where: a short line across the upper middle of the eye, from the left side
      part: the upper edge of the iris
    - where: a short line across the lower middle of the eye, from the left side, a little longer than the upper one
      part: the lower edge of the iris
    - where: a line across the bottom of the eye, a little longer than the inner two, closing the frame
      part: the eye's bottom corner and the man's shoulders
    - where: a short sweep from just below the eye's bottom line down and out to the bottom left
      part: the man's left leg
    - where: a long stroke starting on the middle of the eye's bottom line, running down, then across to the right and ending in a small hook turning up
      part: the man's right leg, with its foot turned up

画:
  object: a painting on a canvas, set on an easel
  history: >-
    An ideogram: a painting on an easel. The traditional form adds the painter's brush above the
    canvas; the simplified form keeps only a bar above.
  layout: >-
    A pale wooden easel stands in the lower part of the frame, holding a canvas whose painting shows a
    field divided into four plots, in pale greens and yellows. A short crossbar sits above the canvas,
    apart from it, as the top bar of the easel. Pale colours.
  exact:
    - The top bar stands free of every other stroke.
    - "The canvas: a left side, a top-and-right side in one stroke turning down at the right, and a bottom line rising to the right that ends where the left side ends."
    - The two inner lines of the field cross each other; the vertical runs from the canvas top to the canvas bottom and the line across is about a third as long as the canvas top.
    - The easel's left upright is the longest vertical, then turning to run across below the canvas rising slightly to the right; its end touches the right upright.
    - The right upright starts to the right of the canvas and does not touch the canvas's top-right corner, with a small gap between them.
  strokes:
    - where: a line across the top, a little shorter than the canvas
      part: the easel's top bar
    - where: a short vertical down the left side of the canvas, slanting a little to the right
      part: the canvas's left edge
    - where: a line across the top of the canvas, starting at the top of the left edge, turning down at the right and running down the right edge
      part: the canvas's top and right edge
    - where: a short line across the middle of the canvas, rising slightly to the right
      part: the painted field's line across
    - where: a vertical line down the middle of the canvas, from the top edge to the bottom edge
      part: the painted field's line down
    - where: a short line along the bottom of the canvas, rising to the right, from the left edge to the right edge
      part: the canvas's bottom edge
    - where: a long line down the left of the easel from the middle left, then turning across to the right below the canvas and rising slightly
      part: the easel's left upright and its tray
    - where: a vertical line down the right, starting at the right of the canvas, slanting a little to the right
      part: the easel's right upright

畫:
  object: a painting on a canvas, set on an easel
  history: >-
    An ideogram: a painting on an easel. The traditional form adds the painter's brush above the
    canvas; the simplified form keeps only a bar above.
  layout: >-
    At the top a painter's hand holds a long brush with a pale wooden handle that points straight down
    toward the canvas, the bristles a wide soft tuft at the foot. Under it a canvas, with a painted
    field divided into four plots in pale greens and yellows, stands on a long pale wooden base of the
    easel at the bottom of the frame.
  exact:
    - The long vertical is the brush handle and crosses all four lines across above it; it ends touching the wide line below, which is the bristles.
    - "The painter's hand has four lines across: the longest is the back of the hand; the other three are shorter, the top one a little over half as long as the back, and the lowest two a little under half as long."
    - The thumb starts at the left, and the back of the hand crosses its end.
    - "The canvas: the left edge is a short slanting stroke, the top-and-right edge hooks down to the left at its end, and the bottom line meets both."
    - The two inner lines of the field cross; the vertical is short and the line across is about a quarter as long as the canvas top.
    - The long base line at the bottom stands free; it is clearly wider than the canvas.
  strokes:
    - where: a stroke at the upper left, across to the right, ending in a small hook down to the left
      part: the painter's thumb
    - where: a long line across the upper part of the frame, rising slightly to the right, crossing the thumb's end
      part: the back of the painter's hand
    - where: a medium line across below the back of the hand, rising slightly to the right
      part: a finger wrapped round the brush
    - where: a shorter line across below that, rising slightly to the right
      part: another finger wrapped round the brush
    - where: a long vertical running from the top of the frame down through all four lines to the line below
      part: the brush's long handle
    - where: a wide line across below the hand, from near the left to near the right
      part: the wide tuft of the brush's bristles
    - where: a short slanting stroke at the left of the canvas, running down to the right
      part: the canvas's left edge
    - where: a line across the top of the canvas, starting at the top of the left edge, ending in a small hook down to the left
      part: the canvas's top and right edge
    - where: a short line across the middle of the canvas, rising slightly to the right
      part: the painted field's line across
    - where: a short vertical down the middle of the canvas, crossing the line across
      part: the painted field's line down
    - where: a line along the bottom of the canvas, rising slightly to the right, meeting the left edge's end and the top edge's end
      part: the canvas's bottom edge
    - where: a long line across the bottom of the frame, below the canvas, wider than the canvas
      part: the easel's base

使:
  object: a person acting as a messenger beside a hand giving orders
  history: >-
    An ideogram: a person 亻 working for the government 吏. The right part shows a hand with a mouth
    giving orders under a line.
  layout: >-
    On the left a messenger stands, tall, with a friendly face (eyes, nose, mouth) and simple pale
    clothes, listening. On the right a line lies across the upper part, a small mouth with pale lips
    speaks under it, and a hand and arm hang from the line, sweeping down to the lower left and
    reaching across to the right. Pale colours.
  exact:
    - The messenger's right leg starts on the middle of the body sweep.
    - The line across the top is crossed at its middle by the start of the long arm sweep.
    - "The small mouth: a short vertical on the left, a top and right side in one stroke ending in a small hook down to the left, and a bottom line closing it; the vertical and the top stroke start together."
    - The mouth's left side does not touch the hand's reaching stroke, with a small gap between them.
    - The arm sweep is the longest stroke; the hand's reaching stroke is nearly as long, and crosses the arm sweep.
    - The line across the top is about a third as long as the arm sweep.
  strokes:
    - where: a long sweep from the upper left, going down and turning to sweep out to the bottom left
      part: the messenger's body, running down into the left leg
    - where: a vertical line from the middle of the body sweep down to the bottom of the left part
      part: the messenger's right leg
    - where: a line across the upper part of the right half, rising slightly to the right
      part: the line above, the edge of the office
    - where: a short vertical down the left of the mouth, below the line
      part: the mouth's left side
    - where: a line across from the top of that vertical, ending in a small hook down to the left after going across and down
      part: the mouth's upper lip and right side
    - where: a line across the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip
    - where: a very long stroke from the top of the right half, starting at the middle of the line across, running straight down and then sweeping to the lower left
      part: the official's arm and thumb, hanging down
    - where: a long stroke starting at the lower middle of the right half, going across to the right, turning down, then across to the right again
      part: the back of the hand, reaching across to the cuff of the sleeve

法:
  object: a stream of water following its course along a bank of earth
  history: >-
    An ideogram: the course 去 followed by a stream 氵. The right part is a bank of earth and a
    winding path; it also gives the sound.
  layout: >-
    A stream of pale blue water runs down the left side. On the right a pale brown bank of earth rises
    up from a long ground line, and a narrow winding path runs from the ground line down to the lower
    right below it. Colours are pale blue and pale brown.
  exact:
    - The stream's three strokes stand free of each other and of the bank, with small gaps.
    - "The bank: a short line across near the top, a vertical crossing it and ending on the long ground line below; the ground line is the longest across stroke."
    - The ground line is clearly longer than the shelf at the top, which is about two thirds as long.
    - The path starts at the foot of the vertical, sweeps down to the lower left and then runs across to the right, rising slightly; it crosses the ground line at its start.
    - The path's short fork starts on the middle of the path's end and runs down to the right; it is about a quarter as long as the vertical.
    - The vertical's foot stops short of the path with a small gap.
  strokes:
    - where: a short slanting dot at the upper left, running down to the right
      part: a drop of the stream
    - where: a short slanting dot at the middle left, running down to the right
      part: a second drop, splashing from the stream
    - where: a stroke rising from the bottom left up to the centre of the left part
      part: the current of the stream, lifting
    - where: a line across the upper part of the right half, rising slightly to the right
      part: a shelf of earth near the top of the bank
    - where: a vertical line down the middle of the right half, crossing the shelf and ending on the ground line
      part: the cut face of the bank
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the ground line of the bank
    - where: a stroke starting at the middle of the ground line, sweeping down to the lower left and then turning across to the right, rising slightly
      part: a winding path down the bank, the course the water follows
    - where: a short stroke at the lower right, starting on the end of the path and running down to the right
      part: a short fork of the path

所:
  object: an axe swung at a wooden door
  history: >-
    An ideogram: an axe 斤 swung at a door 户. The oldest forms drew an axe with its head on a handle,
    and a single-leaf door.
  layout: >-
    On the left a single wooden door stands in its frame, swinging open on its pivot, with a small
    panel in its upper part. On the right an axe, seen from the side, is held upright with its blade
    turned toward the door. Pale wooden and grey colours. Nobody holds the axe.
  exact:
    - The door's pivot at the top is a short slanting stroke that touches the start of the long edge.
    - The panel is made of a stroke across rising slightly and turning down, and a line across closing it; both start on the long edge and their ends meet.
    - The panel stops short of the axe with a small gap; the door and the axe do not touch.
    - The axe's handle is the long vertical at the right, nearly as long as the door's edge.
    - The axe head is a line across, as long as the handle's top is wide; it is about a third as long as the whole frame's width and crosses the blade stroke at the blade's middle.
    - The blade is a sweep starting at the right and running left, then down to the lower left; the blade does not touch the pivot of the door.
  strokes:
    - where: a short slanting stroke at the top of the door, sloping down to the left
      part: the door's pivot at the top
    - where: a long sweep from the top left of the door down to the bottom left
      part: the door's edge, swinging open
    - where: a line across the upper middle of the door, starting on the edge, rising slightly and turning down at its right end
      part: the panel's top and right side
    - where: a short line across the middle of the door, starting on the edge, rising slightly to the right, ending where the previous stroke ends
      part: the panel's bottom edge
    - where: a short stroke at the top of the axe, running from the right to the left, then turning down to the left
      part: the top of the blade's back
    - where: a long sweep from the end of that stroke, running down and out to the lower left
      part: the blade's cutting edge
    - where: a line across the upper middle of the right part, starting on the middle of the blade
      part: the top of the axe head
    - where: a long vertical down from the middle of the head to the bottom of the frame
      part: the axe's handle

金:
  object: a cast-iron bell, hung up, with bands round it and studs on its skirt
  history: >-
    A pictograph: a cast-iron bell. The two upper strokes are the bell's shoulders; the lines below
    are its bands, the dots its studs.
  layout: >-
    A pale grey cast-iron bell hangs in the middle of the frame, wide at the foot, with its shoulders
    in the upper part. Two bands run round it, a post (the clapper) hangs from the middle down to the
    rim, and two studs sit on its lower skirt. Pale grey metal on a pale ground.
  exact:
    - The two shoulder strokes meet at the top.
    - The upper band is shorter than the lower band, about eight tenths as long; both rise slightly to the right.
    - The clapper starts on the middle of the upper band, crosses the lower band and ends on the middle of the rim, touching it.
    - The two studs and the bell's shoulders stand free; the two studs are small, the right one a little longer than the left; neither touches the rim.
    - The rim is the longest across stroke; the upper band is about half as long as the rim and the lower band about three fifths.
    - The left shoulder is a long sweep down to the lower left; the right shoulder runs down to the right and turns across.
  strokes:
    - where: a long sweep from the top centre down to the bottom left of the upper half
      part: the bell's left shoulder
    - where: a stroke from the top centre running down to the right, then turning across to the right
      part: the bell's right shoulder
    - where: a short line across the middle, rising slightly to the right
      part: the bell's upper band
    - where: a line across below it, a little longer, rising slightly to the right
      part: the bell's lower band
    - where: a vertical line from the middle of the upper band down, crossing the lower band and ending on the rim
      part: the clapper
    - where: a small dot at the lower left, slanting down to the right
      part: a stud on the bell's left skirt
    - where: a small stroke at the lower right, running down to the right and then back down to the left
      part: a stud on the bell's right skirt
    - where: a long line across the bottom, from the left to the right
      part: the bell's rim

取:
  object: a hand reaching out to take an ear
  history: >-
    An ideogram: a hand 又 taking the ear 耳 of a fallen enemy, as the proof of a capture. The hand
    is a right hand with its thumb hanging down.
  layout: >-
    On the left a human ear seen from the side, in pale skin colour, with two folds inside. On the
    right a right hand with a sleeve cuff reaches in from the right toward the ear, its thumb hanging
    down. Nothing else is in the scene; the hand does not hold anything yet.
  exact:
    - The ear's top line starts at the left and ends at the right; the front edge starts on its start, and the back edge, a long vertical, starts on its middle.
    - The two folds are small dots on the front edge, touching nothing else; the upper one is a little longer than the lower and neither touches the back edge.
    - The ear's bottom line is clearly shorter than the top line? no, it is a little longer, rising to the right, and crosses the back edge, with the front edge ending on its middle.
    - The back edge is the longest vertical, the front edge about half as long.
    - The hand's back stroke is the longest across stroke, starting just right of the ear's rim; its thumb runs down and swings to the lower left; it does not touch the ear.
    - The forearm starts on the back of the hand and crosses the thumb stroke, ending in a short turn across to the right.
  strokes:
    - where: a line across the top of the left part, rising slightly to the right
      part: the top of the ear's rim
    - where: a short vertical line down the left side, from the start of the top line to below the middle
      part: the front edge of the ear, where it meets the cheek
    - where: a long straight vertical line down the right of the left part, from the middle of the top line to the bottom
      part: the back of the ear's rim, running down into the lobe
    - where: a small dot-like line in the upper middle, rising slightly to the right, starting on the front edge
      part: the upper fold inside the ear
    - where: a small dot-like line in the middle, rising to the right, starting on the front edge
      part: the lower fold inside the ear
    - where: a line from the lower left rising to the right, below the middle, crossing the back edge
      part: the bottom of the ear's bowl
    - where: a stroke starting across the upper right, rising slightly, then turning down and then down to the left
      part: the back of the hand and the thumb, hanging down
    - where: a stroke starting at the middle left of the hand, sweeping down to the bottom right and ending in a short turn across to the right
      part: the forearm, running to the cuff of the sleeve

併:
  object: a standing person beside two people sitting side by side on one bench, combining with them
  history: >-
    An ideogram: a person 亻 taking land 并. The right part is two people sitting side by side on one
    bench, joined together, and it also gives the sound.
  layout: >-
    On the left stands a tall person with a friendly face (eyes, nose, mouth) and simple pale
    clothes, facing right. On the right two people sit side by side on one long bench, each with a face
    and pale clothes. The standing person does not touch them.
  exact:
    - The left person's right leg starts on the middle of the body sweep.
    - "The two hair strokes stand free: the left is a short dash, the right is about twice as long and turns down to the left."
    - The shoulders line is about three quarters as long as the bench rail and rises slightly; the rail is the longest across stroke.
    - The left person's body starts at the left end of the shoulders; the right person's body starts on the middle of the shoulders.
    - Both bodies cross the rail; the right body is a little longer than the left and ends in a plain point, with no hook.
    - The rail stops short of the standing person, with a small gap between them.
  strokes:
    - where: a long sweep from the upper left, going down and turning to sweep out to the bottom left
      part: the standing person's body, running down into the left leg
    - where: a vertical line from the middle of the body sweep down to the bottom of the left part
      part: the standing person's right leg
    - where: a short dash at the upper left of the right part, sloping down to the right
      part: the left seated person's hair
    - where: a longer stroke at the upper right, sloping down to the right and turning down to the left
      part: the right seated person's hair
    - where: a line across under the hair, rising slightly to the right
      part: the two people's shoulders
    - where: a long line across the middle, from the left to the right, rising slightly
      part: the rail the two people hold
    - where: a stroke starting at the left end of the shoulders, going down and sweeping to the bottom left, crossing the rail
      part: the left seated person's body
    - where: a straight vertical from the middle of the shoulders down to the bottom, crossing the rail
      part: the right seated person's body

表:
  object: a robe with a fur piece lying on its neckline
  history: >-
    An ideogram: fur 毛 on clothing 衣. The oldest forms drew fur worn on a garment.
  layout: >-
    A pale robe hangs empty and seen from the front, filling the lower two thirds of the frame, with
    crossed lapels. A soft fur piece in pale brown lies on its neckline at the top. Pale colours.
  exact:
    - The fur piece is two short bars crossed by a central spine; the two bars are about equal and rise slightly to the right.
    - The spine starts at the top, runs down with a slight turn and ends on the middle of the robe's shoulder line.
    - The shoulder line is the longest across stroke; each fur bar is a little over half as long.
    - The left lapel starts on the middle of the shoulder line and sweeps down to the lower left; the spine does not touch it, with a small gap.
    - The inner panel's edge starts on the middle of the left lapel and turns up to the right at its foot.
    - The small fold at the right stands free of the shoulder line and touches the right lapel at its middle.
    - The right lapel starts at the top of the left lapel and sweeps out to the bottom right.
  strokes:
    - where: a short line across the upper middle, rising slightly to the right
      part: the upper layer of the fur
    - where: a short line across the middle of the fur, below the first, rising slightly to the right
      part: the lower layer of the fur
    - where: a stroke running down from the top centre, slanting to the right at first and then straight down, crossing both bars
      part: the fur's central spine
    - where: a long line across the upper part of the robe, rising slightly to the right
      part: the shoulders and the sleeves, held out to both sides
    - where: a long sweep from the middle of the shoulder line down and out to the lower left
      part: the left lapel, crossing over the chest
    - where: a short line down left of centre, starting on the middle of the left lapel and flicking up to the right at its foot
      part: the edge of the inner panel under the left lapel, its hem turning up
    - where: a short stroke at the right, slanting down to the left
      part: the fold of the right lapel at the chest
    - where: a long sweep from the start of the left lapel down and out to the bottom right
      part: the right lapel, sweeping out to the hem

受:
  object: a hand reaching down to pass a covered thing to a second hand below
  history: >-
    An ideogram: something 冖 passed from one hand 爫 to another 又. The upper hand reaches down; the
    lower hand is a right hand with its thumb hanging down.
  layout: >-
    At the top a hand reaches down from above with its back and three fingers spread. In the middle a
    small bundle wrapped in a pale cloth is held between the hands. At the bottom a right hand with a
    cuff reaches in from the left to receive it, its thumb hanging down. The hands do not touch the
    cloth by any stroke. Pale colours.
  exact:
    - "The upper hand's back is a stroke running from the right to the left and turning down to the left; the three fingers are short and stand free of it and of each other: the left one slants down to the right, the middle one is a small dot, the right one turns down to the left."
    - The cloth's left side is a short vertical; the cloth's top starts on its start, runs across to the right and ends in a small hook down to the left.
    - None of the upper hand's fingers touches the cloth, with small gaps between them.
    - The lower hand's back stroke is across, then turning down and finally down to the left; the forearm sweeps down to the bottom right, ending in a short turn across, and crosses it.
    - The forearm is the longest stroke, longer than the hand's back stroke.
  strokes:
    - where: a stroke at the top, running from the right to the left and turning down to the left
      part: the back of the upper hand
    - where: a short slanting stroke at the upper left, running down to the right
      part: the upper hand's left finger
    - where: a small dot at the top centre, running down to the right
      part: the upper hand's middle finger
    - where: a short stroke at the upper right, running down to the right and then turning back down to the left
      part: the upper hand's right finger
    - where: a short vertical at the left of the middle
      part: the cloth's left side, hanging down
    - where: a long line across the middle, from the top of the left side, ending in a small hook down to the left
      part: the cloth's top and its right edge, hanging down
    - where: a stroke starting across the lower middle, rising slightly, then turning down and then down to the left
      part: the back of the lower hand and its thumb, hanging down
    - where: a stroke from the middle left of the lower part sweeping down to the bottom right and ending in a short turn across to the right
      part: the forearm, running to the cuff of the sleeve

或:
  object: a small walled homestead defended by a spear
  history: >-
    An ideogram: defending yourself 口 with a spear 戈. The oldest forms drew the spear beside a
    walled place on a line of ground.
  layout: >-
    On the left a small walled homestead stands on a line of ground at its foot. On the right a tall
    spear stands guard, its long shaft curving at the foot and ending in an upturned point; a sweep
    crosses it and a small pale tassel hangs at its head. Pale colours; no person is shown.
  exact:
    - The spear's crosspiece is a line across the upper middle, crossing the shaft at its middle; it is the longest across stroke.
    - "The homestead is a small box: a short vertical on the left; a top and right side in one stroke, rising to the right, then turning down; and a bottom line; the vertical ends where the bottom line starts, and the top stroke ends where the bottom line ends."
    - The base line is wide, almost as wide as the homestead's width plus half again; it is a bit shorter than the crosspiece, a little under half as long, and rises to the right.
    - The homestead stands apart from the spear, with a small gap, and the base line stands free of every other stroke.
    - The spear's sweep starts on the right of the shaft and crosses it at its middle, going down to the lower left.
    - The tassel is a small dot at the top right, standing free of everything.
  strokes:
    - where: a line across the upper middle, rising slightly to the right
      part: the spear's crosspiece
    - where: a short vertical at the middle left
      part: the homestead's left wall
    - where: a stroke starting at the middle of the left wall, rising to the right and then turning down
      part: the homestead's roof and right wall
    - where: a short line across the bottom of the homestead, rising slightly to the right, meeting the end of the previous stroke
      part: the homestead's floor
    - where: a line across the lower left, below the homestead, turning up to the right
      part: the line of ground the homestead stands on
    - where: a very long stroke from the top centre, running straight down, then curving down to the right and ending in a hook up
      part: the spear's long shaft, crossing the crosspiece
    - where: a sweep from the middle right of the shaft down to the lower left
      part: the spear's blade
    - where: a small dot at the top right, slanting down to the right, apart from the shaft
      part: the tassel at the spear's head
