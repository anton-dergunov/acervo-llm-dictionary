# Full run, group g1, batch 03. Written from the fact sheets, following scripts/GUIDE.md.

气:
  object: a person breathing out a cloud of air, the breath drifting away to the right
  history: >-
    The oldest forms drew wavy lines of vapour rising and drifting. The modern form keeps them as
    three stacked strokes, the lowest one long and curling.
  layout: >-
    A person stands at the upper left, seen from the side and facing right, with a friendly face
    (eyes, nose, mouth) and a simple pale tunic. Pale grey-blue breath leaves the mouth and drifts
    right and down across the square in soft layers, the longest layer curling at its end.
  exact:
    - The top stroke touches the sweep in the middle of the sweep; the short stroke below it stands free of both.
    - The short middle stroke is clearly shorter than the top stroke, a little over three quarters as long, and does not touch anything.
    - The bottom stroke is by far the longest, about three times the length of the top stroke; it runs across, rises slightly, turns down, then down to the right and ends in a small hook upward.
  strokes:
    - where: a sweep at the upper left, going down and turning to the lower left
      part: the person's back and body, bent slightly forward
    - where: a short line across the top, rising slightly to the right, starting on the middle of the sweep
      part: the first puff of breath leaving the person's mouth
    - where: a short line across the middle left, rising slightly to the right, apart from the others
      part: a second, lower layer of the breath
    - where: a very long line across the lower half, rising slightly, then turning down at the right and curling up at the end in a small hook
      part: the long ribbon of breath drifting out and curling over at its end

氣:
  object: a person breathing out a cloud of air, the breath drifting away to the right
  history: >-
    The oldest forms drew wavy lines of vapour rising and drifting. The traditional form adds rice 米
    inside the drifting lines, as the steam of cooked rice.
  layout: >-
    A person stands at the upper left, seen from the side and facing right, with a friendly face
    (eyes, nose, mouth) and a simple pale tunic. Pale grey-blue breath leaves the mouth and drifts
    across the square in soft layers, the longest layer passing under the person, bending down the
    right side and curling up at its end, so that it wraps the rice from above and from the right.
    A rice plant with its grains stands at the lower left, inside the wrap, in pale gold.
  exact:
    - The upper breath strokes follow the same shapes as in the simple form; the top stroke touches the sweep in the middle of the sweep.
    - The longest breath stroke is wide, about as wide as the whole picture, runs across, turns down at the right and ends in a small hook upward.
    - The rice sits at the lower left and fills about half the width; it does not touch the long breath stroke.
    - In the rice, the stalk crosses the line across at its middle, and the two lower sweeps start on the stalk at the line across.
    - The stalk is a straight vertical with a plain point at the bottom, with no hook.
  strokes:
    - where: a sweep at the upper left, going down and turning to the lower left
      part: the person's back and body, bent slightly forward
    - where: a short line across the top, rising slightly to the right, starting on the middle of the sweep
      part: the first puff of breath leaving the person's mouth
    - where: a short line across below it, rising slightly to the right, apart from the others
      part: a second, lower layer of the breath
    - where: a very long line across the middle, rising slightly, turning down at the right side and curling up at the end in a small hook
      part: the long ribbon of breath drifting out and wrapping the rice from above and from the right
    - where: a short dot at the upper left of the rice, slanting down to the right
      part: a grain of rice, upper left
    - where: a short stroke at the top of the rice, slanting down to the left
      part: a grain of rice, upper right
    - where: a line across the rice, a little below its middle, rising slightly to the right
      part: a branch of the rice, held out to both sides
    - where: a long straight line down the middle of the rice, from the top to the bottom
      part: the rice stalk
    - where: a sweep from the centre of the stalk down and out to the bottom left
      part: a branch of grains drooping to the bottom left
    - where: a short stroke from below the middle of the stalk, down and out to the right
      part: a branch of grains drooping to the right

氏:
  object: a person bowing low, head bent forward, facing left
  history: >-
    The oldest forms drew a person bent over with an arm held out. The modern form turned the bend
    into a long curving stroke with a hook.
  layout: >-
    A person fills the square, bowing toward the left: the head is bent forward and low at the upper
    left, the back is a long curve, and the long lower stroke is the body and legs, folding at the
    right. The person has a friendly face with closed eyes, a nose and a mouth, and wears a simple
    pale robe.
  exact:
    - The short top stroke sweeps left and ends on the start of the left curving stroke; the long curving stroke on the right starts on the middle of the short top stroke.
    - The line across rises a little to the right and crosses the long right stroke, but does not touch the left curving stroke.
    - The left curving stroke ends in a rising tick to the right. The long right stroke goes down, turns to the right and rises at its end.
  strokes:
    - where: a short stroke at the top, running to the left and turning down to the left
      part: the bowed head and neck
    - where: a curving stroke on the left half, down to the right, then down, ending in a tick that rises to the right
      part: the person's chest and bent knee
    - where: a line across the middle, rising slightly to the right, crossing the long right stroke
      part: the arm held out across the body
    - where: a long stroke starting on the head stroke, going down, then curving down to the right and ending rising upward
      part: the back and the folded legs, ending in the foot

介:
  object: a person standing above a border made of two posts
  history: >-
    The oldest forms drew a person between two marks that divide them. The modern form keeps the
    person on top and the two dividing marks below.
  layout: >-
    A person stands with legs wide apart at the top, filling the width, with a friendly face (eyes,
    nose, mouth) and simple pale clothes. Below, two border posts stand in the ground, pale wood,
    dividing one side from the other. The posts do not touch the person's legs.
  exact:
    - The two top strokes spread wide, the left sweep long, the right stroke going down to the right and turning across at its end.
    - The left border post sweeps down to the left and does not touch the left leg; the right post is a straight vertical with a plain end, and does not touch the right leg.
    - The left post is shorter than the right post, about three quarters as long.
    - The two posts do not touch each other.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left of the upper half
      part: the person's body, running down into the left leg
    - where: a stroke starting at the top of the sweep, going down to the right and turning across to the right at the end
      part: the right leg, ending in a foot turned out
    - where: a shorter sweep in the lower left, down and to the left
      part: the left border post, leaning outward
    - where: a straight vertical line in the lower middle, a little right of centre, ending in a plain point
      part: the right border post

父:
  object: a father's hand holding an axe by its handle
  history: >-
    The oldest forms drew a hand gripping a stone axe. The modern form keeps the crossed strokes of
    the hand and handle and two short strokes for the blade.
  layout: >-
    A father stands, filling the square, with a friendly face (eyes, nose, mouth) and a simple pale
    tunic. His hand grips an axe: the blade at the top, its handle running down to the left. The two
    blade edges are at the top, and the arm reaches in across the handle from the left.
  exact:
    - The two top strokes stand free, the left one sweeping down to the left, the right one a short stroke down to the right.
    - The left top stroke is longer than the right top one, about one and a third times as long.
    - The long sweep and the long falling stroke cross at the middle of the sweep.
    - The long sweep ends in a small turn to the left at its end. The falling stroke ends turning across to the right.
  strokes:
    - where: a short sweep at the upper left, down to the left
      part: the axe blade's left edge
    - where: a short stroke at the upper right, slanting down to the right
      part: the axe blade's right edge
    - where: a long stroke from the centre going down and out to the bottom left, ending in a small turn to the left
      part: the axe handle, held in the hand
    - where: a long stroke from the middle left going down to the right and turning across to the right at the end
      part: the father's arm, reaching across the handle

五:
  object: five elements as two crossing rods, between the sky above and the earth below
  history: >-
    The oldest form drew a cross between two lines, heaven above and earth below. The modern form
    kept the cross as two strokes between two lines.
  layout: >-
    A line of sky at the top and a line of earth at the bottom enclose the picture. Between them two
    wooden rods cross in an X, in pale warm colours, each ending on a line, as the elements held
    between heaven and earth. Nothing else.
  exact:
    - The top line is shorter than the bottom line, a little over half as long.
    - The slanting rod starts on the middle of the top line, goes down a little to the left, and ends on the middle of the bottom line.
    - The crossing rod is a line across that crosses the slanting rod and then turns down onto the bottom line.
    - The crossing rod is about three quarters as long as the bottom line.
  strokes:
    - where: a short line across the top, a little over half the width
      part: heaven, the line of the sky
    - where: a slanting line from the middle of the top line down and a little to the left to the bottom line
      part: the first rod, leaning
    - where: a line across the middle, crossing the slanting line, then turning down at the right to land on the bottom line
      part: the second rod, bent at the end
    - where: a long line across the bottom, the whole width of the square
      part: earth, the ground line

戶:
  object: a single wooden door in its frame, swinging open on its pivot
  history: >-
    The oldest forms drew one leaf of a double door, hanging from a hinge. The modern form kept the
    one leaf and a pivot mark at the top.
  layout: >-
    A single pale wooden door fills the square, its left edge standing on the ground at the lower
    left, the door swung open a little to the right. A small hinge pin sits above it at the top.
  exact:
    - The small stroke at the top stands free of every other stroke.
    - The top edge of the door runs across and ends in a small hook down to the left at its right end.
    - The middle crossbar is shorter than the top edge, about two thirds as long, and rises slightly to the right.
    - The top edge starts on the long left edge and ends on the end of the crossbar; the crossbar starts on the middle of the left edge.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right
      part: the door's pivot pin
    - where: a line across the upper part, running to the right and ending in a small hook down to the left
      part: the top rail of the door, the hook its latch
    - where: a line across the middle, rising slightly to the right, about two thirds as long as the top rail
      part: the middle crossbar of the door
    - where: a long stroke down the left side, from the top left turning down to the left
      part: the door's left edge, its hinge side

双:
  object: two hands side by side
  history: >-
    The oldest forms drew two right hands next to each other, as a pair. The modern form repeats the
    simple hand twice.
  layout: >-
    Two open hands face each other side by side. The left hand is smaller and sits a little lower;
    the right hand is larger and taller. Pale skin tone, with a simple pale cuff on each wrist.
  exact:
    - The left hand is narrower and shorter than the right; its top is lower than the right hand's top.
    - In each hand the line across turns down and the falling stroke crosses it.
    - The two hands do not touch each other.
    - The left falling stroke is shorter than the right one, a little over half as long.
  strokes:
    - where: a stroke across the upper left half, turning down to the left at its right end
      part: the left hand's back and wrist
    - where: a short stroke from the middle of the left hand, slanting down to the right across the first
      part: the left hand's fingers
    - where: a stroke across the upper right half, turning down and then down to the left
      part: the right hand's back and wrist
    - where: a long stroke from the middle of the right hand, slanting down to the right and turning across at its end
      part: the right hand's fingers, ending in the thumb

雙:
  object: two hands side by side
  history: >-
    The oldest forms drew two right hands next to each other, as a pair. The traditional form instead
    draws two birds side by side above a hand, a pair of lovebirds perched on a branch.
  layout: >-
    Two small round lovebirds perch side by side on a branch, facing each other: the left bird faces
    right, the right bird faces left. Each has a round body, a beak, a bright eye, folded wings, and
    pale green and pink feathers. The branch runs under them, forked like a hand.
  exact:
    - The two birds do not touch each other. The right bird is a little larger than the left.
    - In each bird the three short feather strokes lie one above another, and the tall vertical crosses them.
    - The left bird's sweep is the longest down stroke; the right bird's top sweep is a little over half as long.
    - The two dots at the top, one on each bird, stand free of every other stroke.
    - The branch is a line across turning down to the left, crossed by a falling stroke turning across to the right.
    - The branch lies under both birds and does not touch them.
  strokes:
    - where: a sweep at the upper left, going down to the lower left
      part: the left bird's back and tail
    - where: a short vertical at the left bird's back, below the sweep
      part: the left bird's wing edge
    - where: a small dot at the top of the left bird
      part: the left bird's eye
    - where: a short line across the upper left bird, rising slightly to the right
      part: the left bird's upper wing feather
    - where: a short line across below it, rising slightly to the right
      part: the left bird's middle wing feather
    - where: a short line across below it, rising slightly to the right
      part: the left bird's lower wing feather
    - where: a vertical line down the left bird's body, crossing the feathers
      part: the left bird's breast
    - where: a line across the bottom of the left bird, rising slightly to the right
      part: the left bird's feet gripping the perch
    - where: a sweep at the top of the right bird, down to the left
      part: the right bird's back and tail
    - where: a vertical line down the right bird's body, below the sweep
      part: the right bird's breast
    - where: a small dot at the top of the right bird
      part: the right bird's eye
    - where: a short line across the upper right bird, rising slightly to the right
      part: the right bird's upper wing feather
    - where: a short line across below it, rising slightly to the right
      part: the right bird's middle wing feather
    - where: a short line across below it, rising slightly to the right
      part: the right bird's lower wing feather
    - where: a vertical line crossing the right bird's feathers
      part: the right bird's wing spine
    - where: a longer line across the bottom of the right bird, rising slightly to the right
      part: the right bird's feet gripping the perch
    - where: a long line across the lower half, turning down to the left at its end
      part: the main branch, bending down to the left
    - where: a stroke from the middle of the branch, down to the right and turning across at the end
      part: the fork of the branch, reaching right

斗:
  object: a measuring dipper with a long handle, held by a hand
  history: >-
    The oldest forms drew a ladle with a cup and a long handle. The modern form keeps the cup and
    handle as a cross, with two marks for what is measured.
  layout: >-
    A wooden dipper stands upright: a long handle down the middle and a wide cup rim across it. Two
    grains of rice fall into the cup from the upper left. A pale hand grips the lower end of the
    handle at the bottom.
  exact:
    - The two grains stand free of every other stroke and are about the same size.
    - The cup rim runs across the whole width and the handle crosses it.
    - The handle is a straight vertical, slightly leaning to the right, ending in a plain point with no hook.
    - The grains stop short of the cup rim.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: a grain of rice falling toward the dipper
    - where: a short stroke below it at the left, slanting down to the right
      part: a second grain of rice falling toward the dipper
    - where: a long line across the middle, the whole width of the square
      part: the cup rim of the dipper
    - where: a long straight line down the middle, crossing the cup rim, from the top nearly to the bottom
      part: the dipper's long handle

鬥:
  object: two people boxing, facing each other
  history: >-
    The oldest forms drew two people facing each other with raised hands. The modern form keeps two
    uprights for the bodies and two fists between them.
  layout: >-
    Two boxers stand on either side of the picture facing each other: the left one is a little
    shorter and the right one taller. Each has a friendly face with eyes, nose and mouth, and simple
    pale clothes, with a pale boxing glove raised in the middle of the picture.
  exact:
    - The left boxer's body is shorter than the right boxer's, about three quarters as long.
    - The right boxer's body ends in a small hook up to the left at the bottom (the foot).
    - The two bodies and the gloves stand apart, with no touches.
    - In each glove the vertical crosses the second line across, and ends on the lowest line across.
    - Both gloves are about the same size, the left one a little taller.
  strokes:
    - where: a straight vertical on the left, from the top left to the bottom
      part: the left boxer's body
    - where: a short line across at the top of the left glove, rising to the right
      part: the left glove's top edge
    - where: a short line across below it, rising slightly to the right
      part: the left glove's cuff band
    - where: a short vertical through the left glove, from the top line to the bottom line
      part: the left glove's spine
    - where: a short line across the bottom of the left glove, rising slightly to the right
      part: the left glove's lower edge
    - where: a short line across at the top of the right glove, rising slightly to the right
      part: the right glove's top edge
    - where: a short line across below it, rising slightly to the right
      part: the right glove's cuff band
    - where: a short vertical through the right glove, from the top line to the bottom line
      part: the right glove's spine
    - where: a short line across the bottom of the right glove
      part: the right glove's lower edge
    - where: a long line down the right side, from the top right to the bottom, ending in a small hook up to the left
      part: the right boxer's body, the hook his foot

互:
  object: two hooks hooked into each other between a bar above and a bar below
  history: >-
    The oldest forms drew two hooks linked together. The modern form shows the pair as a bent chain
    between two lines.
  layout: >-
    A short bar hangs at the top and a long bar lies at the bottom, in pale wood. Between them two
    iron hooks are hooked into each other, pale grey, one hanging from the top bar and one standing
    on the bottom bar.
  exact:
    - The top bar is shorter than the bottom bar, a little over half as long.
    - The hanging hook starts on the middle of the top bar, goes down, then turns across to the right where it meets the other hook.
    - The standing hook starts where the hanging hook ends, goes across to the right and turns down onto the middle of the bottom bar.
    - The standing hook is about three quarters as long as the bottom bar.
  strokes:
    - where: a short line across the top, a little over half the width
      part: the top bar the first hook hangs from
    - where: a stroke from the middle of the top bar going down, then turning across and rising slightly to the right
      part: the hanging hook
    - where: a stroke starting at the end of the hanging hook, going across to the right and then turning down to the bottom bar
      part: the standing hook, hooked into the first
    - where: a long line across the bottom, the whole width
      part: the bottom bar the second hook stands on

巨:
  object: a hand holding a large carpenter's square
  history: >-
    The oldest forms drew a hand holding a carpenter's square, the tool of a craftsman. The modern
    form keeps the open frame with the hand's strokes inside.
  layout: >-
    A large pale wooden carpenter's square opens to the right, in the shape of a bracket. A hand
    reaches in from the right and grips the square's spine, its fingers curling around it. The hand
    is a skin tone, with a pale cuff.
  exact:
    - The top arm and the long left edge start at the same point at the top left.
    - The long left edge goes down then turns across to the right at the bottom, and is more than twice as long as the top arm.
    - The hand's upper stroke ends in a small hook down to the left, and its end touches the lower stroke; its start touches the left edge.
    - The hand's lower stroke starts on the left edge and is shorter than the upper stroke, about three quarters as long.
    - The top arm is a little shorter than the hand's upper stroke, about nine tenths as long.
  strokes:
    - where: a line across the top, from the left edge to the right
      part: the square's top arm
    - where: a line across the middle left, running right and ending in a small hook down to the left
      part: the hand's back and curled fingers
    - where: a shorter line across below it, from the left edge to the right
      part: the hand's wrist and thumb
    - where: a long stroke down the left side, then turning across to the right along the bottom
      part: the square's spine and bottom arm

币:
  object: a paper bill hung on a cloth stand, a cloth over a rod
  history: >-
    The oldest forms drew money written on silk, cloth hung over a stand. The modern form puts a
    slanting stroke on top of the cloth.
  layout: >-
    A pale cloth hangs over a rod on a stand, filling the lower three quarters of the square. A pale
    paper bill rests slanting at the top of the stand, its edge leaning to the left. The cloth is a
    soft silk in pale blue.
  exact:
    - The bill's slanting stroke runs from the upper right to the left and down; the stand starts on the middle of that stroke.
    - The rod stroke starts on the left cloth edge and crosses the stand at its middle.
    - The right edge of the cloth ends in a small hook to the left at its hem.
    - The stand is a straight vertical, longer than the cloth, ending in a plain point at the bottom with no hook.
    - The left cloth edge is much shorter than the right one, about a third as long.
  strokes:
    - where: a stroke at the top, from the upper right sweeping down to the left
      part: the paper bill laid slanting on top
    - where: a short line down the left side, a little below the top
      part: the left edge of the cloth, hanging down
    - where: a line across the upper part, turning down to run down the right side and ending in a small hook to the left
      part: the rod with the cloth over it, and the cloth's right edge, curling at its hem
    - where: a long straight line down the centre, from the bill to the bottom
      part: the stand that holds the rod

出:
  object: a sprout growing out of a pot
  history: >-
    The oldest forms drew a sprout above a bowl, growing up and out. The modern form stacked the
    sprout on a cup shape.
  layout: >-
    A pale clay pot stands at the bottom, open at the top. A young green sprout grows up out of it,
    with a leaf on each side. The pot fills the lower third; the sprout fills the upper two thirds.
  exact:
    - The stem stands straight in the middle, a vertical that ends on the bottom of the pot, with no hook.
    - The left leaf is longer and lower than the right leaf; the right leaf is a short vertical, about a third as long as the stem.
    - The left leaf's end touches the right leaf, and the stem crosses the left leaf.
    - The pot is open at the top; the right wall is a short stroke, about two fifths of the length of the stem.
    - The left leaf does not touch the pot.
  strokes:
    - where: a stroke from the upper left, going down and turning across to the right, rising slightly
      part: the left leaf, drooping and curling in
    - where: a short stroke at the right, down to the right then straight down
      part: the right leaf, small and upright
    - where: a long stroke down the middle, from the top, ending in a plain point
      part: the sprout's stem
    - where: a stroke at the bottom from the left, down and then across to the right, rising slightly
      part: the pot's left wall and base
    - where: a short stroke at the right, down to the right and then straight down
      part: the pot's right wall

他:
  object: a person, and beside him another person also there
  history: >-
    The oldest forms drew a snake-like mark meaning also. The modern form keeps it beside the person
    to mean the other, an additional person.
  layout: >-
    A person stands at the left, facing right, with a friendly face (eyes, nose, mouth) and simple
    pale clothes. A second person kneels at the right, facing left, also with a friendly face and
    simple pale clothes. Their sizes are different: the kneeling one is wider.
  exact:
    - The standing person is narrower and taller; the kneeling person at the right is wider.
    - The standing person's short vertical starts on the middle of the sweep and does not touch the second person's line across.
    - The second person's line across rises to the right and ends in a hook down to the left; the vertical crosses it.
    - The long stroke on the right goes down, turns across to the right and rises at its end.
  strokes:
    - where: a long sweep from the top of the left half, down and out to the bottom left
      part: the standing person's body, running into the left leg
    - where: a vertical line down the left half, starting on the middle of the sweep
      part: the standing person's right leg
    - where: a line across the middle, rising to the right and ending in a hook down to the left
      part: the second person's shoulders and bent arm
    - where: a vertical line down the right half, crossing the line across, from the top
      part: the second person's body
    - where: a long stroke on the right starting at the left end of the line across, going down, turning across to the right and rising at the end
      part: the second person's folded knees

生:
  object: a shoot growing up out of the soil
  history: >-
    The oldest forms drew a sprout with leaves above a line of ground. The modern form kept the stem
    and ground and drew the leaves as short strokes.
  layout: >-
    A green shoot grows up the middle of the square out of a line of brown soil at the bottom. Pale
    leaves open on both sides of its stem.
  exact:
    - The stem is a straight vertical ending on the middle of the ground line, with no hook.
    - The upper leaf line is a little longer than the lower one, about one and a fifth times as long.
    - The upper line across is a little over half as long as the ground line and the lower one a little under half as long.
    - The two lines across both cross the stem, the upper rises more than the lower.
    - The small curving stroke at the left touches the upper line across at its start.
    - The ground line is the longest line and sits at the bottom.
  strokes:
    - where: a small curving stroke at the left, down to the right then down and to the left
      part: a young leaf, at the left
    - where: an upper line across, a little over half as long as the ground line, rising slightly to the right, crossing the stem
      part: the upper pair of leaves
    - where: a shorter line across below it, a little under half as long as the ground line, rising slightly to the right, crossing the stem
      part: the lower pair of leaves
    - where: a straight vertical line down the middle, from the top to the ground
      part: the shoot's stem
    - where: a long line across the bottom
      part: the soil, the ground line

对:
  object: a pair of hands facing each other
  history: >-
    The oldest forms drew a hand set against another hand, facing. The modern form simplified one of
    them to a few strokes.
  layout: >-
    Two hands face each other. The left hand is smaller and open; the right hand is taller, with a
    long arm. Pale skin tone, each with a simple cuff.
  exact:
    - The left hand is narrower and shorter than the right.
    - The left hand's line across turns down and the falling stroke crosses it.
    - The right hand's top line is about half as long as the left hand's line across.
    - The right hand's vertical crosses its top line and ends in a hook up to the left; its small dot stands free.
    - The two hands do not touch each other.
  strokes:
    - where: a stroke across the left half, turning down and then down to the left
      part: the left hand's back and wrist
    - where: a short stroke across the first, slanting down to the right
      part: the left hand's fingers
    - where: a line across the upper right half
      part: the right hand's arm held across
    - where: a long vertical down the right half, crossing the line across and ending in a hook up to the left
      part: the right hand, its hook the thumb
    - where: a small dot beside the vertical, slanting down to the right, standing free
      part: the wrist spot on the right hand

對:
  object: a pair of hands facing each other
  history: >-
    The oldest forms drew a hand set against another hand, facing. The traditional form instead draws
    a hand holding a lit candelabrum.
  layout: >-
    A tall candelabrum in pale wood stands at the left, with four candles on its top bar, their
    pale flames above. A hand in a skin tone reaches in from the right and holds it, with a cuff at
    the wrist.
  exact:
    - The four candles on the top bar stand free of each other.
    - The top bar is the longest line across of the candelabrum, the middle bar is clearly shorter, about three fifths as long.
    - The lowest bar and the hand's arm line are each about four fifths as long as the top bar.
    - The stem is a vertical that runs from the top bar down to the middle bar and on to the base, ending on the base.
    - The base rises slightly to the right.
    - The hand's line across is crossed by its tall vertical, which ends in a hook up to the left.
    - The small dot of the hand stands free.
  strokes:
    - where: a short vertical at the upper left of the candelabrum
      part: a candle, the second from the left
    - where: a short stroke at the top centre, down to the right and then straight down
      part: a candle at the centre
    - where: a small dot at the upper left
      part: the leftmost candle, a short one
    - where: a short stroke at the upper right, sloping down to the left
      part: the rightmost candle
    - where: a long line across, rising slightly to the right
      part: the top bar holding the candles
    - where: a small dot below the top bar, on the left
      part: a bead on the candelabrum
    - where: a short vertical in the middle, from the top bar down
      part: the upper stem
    - where: a line across the middle, about three fifths as long as the top bar, rising slightly to the right
      part: the middle bar
    - where: a line below it, rising to the right
      part: the lower bar
    - where: a short vertical crossing the lower bar
      part: the lower stem
    - where: a line across the bottom, about four fifths as long as the top bar, turning up at the right
      part: the foot of the candelabrum
    - where: a line across the right, about four fifths as long as the top bar, rising slightly
      part: the hand's arm
    - where: a long vertical down the right, crossing the arm, ending in a hook up to the left
      part: the hand, the hook its thumb
    - where: a small dot beside the vertical, slanting down to the right
      part: the wrist spot

民:
  object: an eye pierced by a dagger
  history: >-
    The oldest forms drew an eye with a dagger thrust into it, a mark of slavery. The modern form
    keeps the eye and the blade crossing it.
  layout: >-
    A large eye fills the left half, with the lids around a pale iris. A dagger with a curved blade
    crosses the lower half from left to right, its tip passing the eye. Pale steel for the blade, a
    soft pale iris.
  exact:
    - The eye's upper line ends in a small hook down to the left; its lower line below it is clearly shorter, a little over two thirds as long.
    - The eye's long left side goes down and curves up to the right, and does not touch the dagger's crossguard.
    - The crossguard crosses the blade at the middle.
    - The blade starts on the eye's lower line and goes down to the right, curving up at the tip.
    - The crossguard is shorter than the blade, about half as long.
  strokes:
    - where: a line across the top, ending in a small hook down to the left
      part: the eye's upper lid
    - where: a shorter line across below it, a little over two thirds as long, rising slightly to the right
      part: the eye's lower lid
    - where: a long stroke down the left side, then curving up to the right at the bottom
      part: the eye's left edge and base
    - where: a line across, lower, rising slightly to the right
      part: the dagger's crossguard
    - where: a long stroke from the eye's lower line, down to the right then curving up at the end
      part: the dagger's curved blade

主:
  object: a lamp with a flame
  history: >-
    The oldest forms drew a lamp on a stand with a flame above. The modern form kept the dot for the
    flame and the lamp as a stand.
  layout: >-
    A small oil lamp in pale brass stands on a base. A soft yellow flame burns above it. The lamp's
    tall stand runs down the middle to a wide base.
  exact:
    - The flame stands free above the lamp.
    - The middle bar is a little shorter than the top bar, about four fifths as long.
    - The base is the longest line, nearly twice the length of the top bar.
    - The stand starts on the middle of the top bar, crosses the middle bar and ends on the middle of the base; it ends in a plain point with no hook.
    - There is no dot at the lower right.
  strokes:
    - where: a small dot at the very top, slanting down to the right
      part: the flame
    - where: a line across the upper part, rising slightly to the right
      part: the lamp's bowl rim, holding the oil
    - where: a shorter line across the middle, rising slightly to the right
      part: the lamp's collar on the stand
    - where: a straight vertical line down the middle, from the bowl to the base
      part: the lamp's stand
    - where: a long line across the bottom, the whole width of the square
      part: the lamp's base

代:
  object: a person beside a tall crooked stake marking the passing of time
  history: >-
    The oldest forms drew a stake with a string. The modern form puts it beside a person, as time
    passing over a man.
  layout: >-
    A person stands at the left with a friendly face (eyes, nose, mouth) and simple pale clothes. At
    the right stands a tall wooden stake, curving at the bottom to the right, with a small peg at its
    upper right. A pale shadow lies on the ground, marking time.
  exact:
    - The person is narrower than the stake and a little shorter; the stake reaches the top of the square.
    - The stake's crossbar rises to the right and the stake crosses it at its middle.
    - The stake's stroke goes down, curves to the right at the bottom and ends in a small hook upward.
    - The small peg at the upper right stands free.
    - The crossbar is clearly shorter than the stake, less than half as long.
  strokes:
    - where: a long sweep from the top of the left part, down and out to the bottom left
      part: the person's body, running down into the left leg
    - where: a vertical line down the left part, starting on the middle of the sweep
      part: the person's right leg
    - where: a line across the middle, rising to the right, crossing the stake
      part: the crossbar tied to the stake
    - where: a long stroke from the top, down the middle of the right half, curving to the right at the bottom and ending in a small hook up
      part: the tall crooked stake
    - where: a small stroke at the upper right, slanting down to the right
      part: the peg at the stake's top

外:
  object: a crescent moon at night above a cracked bone used for divination
  history: >-
    The oldest forms drew the night moon beside a crack on a bone, the marks of fortune-telling at
    night. The modern form keeps the crescent and the crack.
  layout: >-
    A pale night sky in soft blue. At the left a crescent moon, its bulge on the right, in pale
    yellow, and a small star inside its hollow. At the right a pale oracle bone with a long crack
    down it and a short branch crack.
  exact:
    - The crescent opens to the left, its bulge on the right.
    - The star stands free and does not touch the moon.
    - The moon's two strokes are joined at the top, where the outer stroke starts on the inner one.
    - The long crack is a straight vertical; the branch crack starts on its middle and slants down to the right.
    - The moon and the bone do not touch; the bone is taller than the moon.
  strokes:
    - where: a sweep at the upper left, down to the left
      part: the crescent's inner edge
    - where: a stroke starting at its top, going across to the right, then turning down and down to the left
      part: the crescent's outer rim, bulging right
    - where: a short stroke inside the crescent, slanting down to the right
      part: a small star in the moon's hollow
    - where: a tall vertical line at the right, from the top to the bottom
      part: the main crack of the bone
    - where: a short stroke from the middle of the crack, down to the right
      part: the branch crack

世:
  object: a branch with three leaves
  history: >-
    The oldest forms drew three leaves on a branch. The modern form kept the three as short strokes
    on a bough.
  layout: >-
    A curving green bough crosses the square from the upper left down to the lower right. A thin
    twig crosses it near the top, with two leaves hanging from the twig and a third small leaf at the
    bottom between them. Pale green leaves.
  exact:
    - The twig is the longest line across, nearly the whole width, and crosses the bough and both leaf stalks.
    - The two hanging leaves are about the same length, each about half as long as the bough.
    - The third leaf is a short line across at the bottom, about a quarter as long as the twig, starting where the left hanging leaf ends and ending on the right hanging leaf's end.
    - The bough starts at the upper left, goes down, then turns across to the right at the bottom.
  strokes:
    - where: a long line across the upper middle, the whole width of the square
      part: the twig
    - where: a vertical line in the middle of the left half, hanging down from the twig
      part: the left hanging leaf
    - where: a line in the right half, going down to the right and turning down, from the twig
      part: the right hanging leaf
    - where: a short line across at the bottom between the two, rising slightly to the right
      part: the third leaf, small
    - where: a long stroke from the upper left, going down and turning across to the right at the bottom
      part: the bough

电:
  object: lightning striking from a storm cloud
  history: >-
    The oldest forms drew a forked flash across the sky. The modern form keeps the bolt as a single
    bent stroke through a boxed cloud.
  layout: >-
    A low storm cloud in pale grey fills the middle of the picture, as a box with two layers inside.
    A bold bolt of lightning, pale yellow, strikes down through it at the middle, then bends across
    to the right at the bottom and turns up. Nothing is black.
  exact:
    - The cloud's left edge and top-and-right edge meet at the top left.
    - The two inner layer lines do not touch the left edge.
    - The lower inner layer line is a little longer than the upper one, about one and a tenth times as long.
    - The bolt is a long stroke that passes down through the cloud, crosses both inner lines, then runs across the bottom to the right and turns up at its end.
    - The bolt is much longer than anything else, longer than the cloud is wide and tall together.
  strokes:
    - where: a short stroke down the left side, slanting down to the right
      part: the cloud's left edge
    - where: a stroke across the top, turning down along the right side and ending at the bottom
      part: the cloud's top and right edge
    - where: a short line across the middle, rising slightly to the right, not touching the left edge
      part: the cloud's upper inner layer
    - where: a short line across the bottom, rising slightly to the right, ending on the right edge
      part: the cloud's lower inner layer and base
    - where: a long stroke from the top, down through the cloud, then turning across to the right, rising slightly, then up at the end
      part: the bolt of lightning, bending at the bottom

電:
  object: lightning striking from a storm cloud
  history: >-
    The oldest forms drew a forked flash across the sky. The traditional form places the bolt under a
    rain cloud, with rain falling.
  layout: >-
    A wide pale grey rain cloud hangs across the top, with rain falling from its middle and drops at
    its sides. Under it a smaller boxed storm cloud in pale grey, and a bold bolt of pale yellow
    lightning striking down through it, then bending to the right at the bottom and turning up.
  exact:
    - The rain cloud is wide, nearly the width of the square; the lower boxed cloud is narrower, about three quarters of its width.
    - The top line of the rain cloud is short, a little under half as long as the cloud's body line, and the central rain stream starts on it.
    - The rain cloud's body line ends in a small hook down to the left at its right end.
    - The four rain drops stand free of the cloud lines and of each other.
    - The bolt is long; the upper left line of the lower cloud ends where the lower inner layer starts.
    - The lower inner layer is longer than the upper one, about one and a quarter times as long.
  strokes:
    - where: a line across the very top, from the centre to the right, a little under half as long as the cloud's body line below
      part: the top of the sky, the upper edge of the cloud
    - where: a short line down the left side, from below the top line
      part: the left edge of the cloud, hanging down
    - where: a line across below the top line, turning down at the right and ending in a small hook down to the left
      part: the body of the cloud and its right edge, hanging down
    - where: a short line down the centre, from the top line to the middle
      part: a stream of rain pouring from the middle of the cloud
    - where: a small dot in the left half, upper
      part: a raindrop
    - where: a small dot in the left half, lower
      part: a raindrop
    - where: a small dot in the right half, upper
      part: a raindrop
    - where: a small dot in the right half, lower
      part: a raindrop
    - where: a short stroke down the left of the lower cloud, slanting down to the right
      part: the lower cloud's left edge
    - where: a stroke across the top of the lower cloud, turning down along its right side
      part: the lower cloud's top and right edge
    - where: a short line across the middle of the lower cloud, rising slightly to the right
      part: the lower cloud's upper inner layer
    - where: a longer line across the bottom of the lower cloud, rising slightly to the right
      part: the lower cloud's lower inner layer
    - where: a long stroke from the middle of the lower cloud's top, down, then turning across to the right and up at the end
      part: the bolt of lightning, bending at the bottom

付:
  object: a person handing something over, a hand held out to the person
  history: >-
    The oldest forms drew a hand passing something to a person. The modern form keeps the person
    and the hand side by side.
  layout: >-
    A person stands at the left, facing right, with a friendly face (eyes, nose, mouth) and simple
    pale clothes, arms out to receive. At the right a hand in a skin tone reaches toward them from a
    sleeve, holding out a small pale object.
  exact:
    - The person is narrower than the hand; the hand's sleeve reaches the top and the bottom of the square.
    - The person's short vertical starts on the middle of the sweep and does not touch the hand's line across.
    - The hand's line across is crossed by its long vertical, which ends in a hook up to the left.
    - The small dot stands free of every other stroke, below the line across.
  strokes:
    - where: a long sweep from the top of the left part, down and out to the bottom left
      part: the person's body, running into the left leg
    - where: a vertical line down the left part, starting on the middle of the sweep
      part: the person's right leg
    - where: a line across the upper middle, reaching to the right edge
      part: the arm held out across
    - where: a long vertical down the right half, crossing the arm and ending in a hook up to the left
      part: the hand itself, the hook the thumb
    - where: a small dot beside the vertical, slanting down to the right, apart from other strokes
      part: the object being handed over

只:
  object: words coming out of a mouth
  history: >-
    The oldest forms drew a mouth with two strokes of speech spreading below it. The modern form
    keeps the mouth above and the spreading strokes below.
  layout: >-
    A wide-open mouth fills the upper half. Below it two soft wisps of breath, pale blue, spread
    apart as the spoken words leave it, one drifting to the lower left and one to the lower right.
  exact:
    - The two wisps below stand free of the mouth and of each other.
    - The mouth's bottom lip is clearly shorter than its top line, a little over half as long.
    - The mouth's top stroke starts on the top of the left side and ends on the end of the bottom lip.
    - The left wisp is a little longer than the right, about one and a tenth times as long.
    - The wisps spread wide, the left reaching beyond the mouth's left corner, the right beyond the right.
  strokes:
    - where: a short straight line down the left side of the mouth
      part: the left corner and left side of the open lips
    - where: a line across the top from left to right, turning down at the top right and down to the left
      part: the upper lip, curving down into the right corner of the mouth
    - where: a short line across the bottom of the mouth, a little over half as long as the top line, rising slightly to the right
      part: the lower lip
    - where: a sweep below the mouth, down to the left
      part: the words drifting to the lower left
    - where: a stroke below the mouth on the right, down to the right
      part: the words drifting to the lower right

加:
  object: a strong arm and a shouting mouth, a cause supported with the strength of one's words
  history: >-
    The oldest forms drew a strong arm and a mouth together, to add one's strength to the words.
    The modern form kept the arm and mouth side by side.
  layout: >-
    At the left a strong flexed arm, with a rounded muscle, in a skin tone, filling the height of
    the square. At the lower right a wide-open mouth, smaller than the arm, shouting in support.
  exact:
    - The arm's line across turns down and ends in a small hook up to the left; the long sweep crosses it at the middle.
    - The mouth's top line is about half as long as the arm's line across.
    - The long sweep is the longest stroke on the left, much longer than the mouth's left side.
    - The mouth's left side is a short vertical, a little over two fifths of the long sweep; it does not touch the arm.
    - The mouth's top line starts on the top of its left side, rises to the right, turns down to the right and ends going down.
    - The mouth's bottom line starts at the end of the left side and is clearly shorter than the mouth's top line, a little under half as long.
    - The mouth sits lower and is smaller than the arm.
  strokes:
    - where: a stroke across the left half, turning down and ending in a hook up to the left
      part: the forearm and the bulging muscle, the hook the fist
    - where: a long sweep from the top left down and out to the bottom left, crossing the forearm
      part: the upper arm and shoulder
    - where: a short straight line down the left side of the mouth
      part: the left corner and left side of the open lips
    - where: a line across the top of the mouth, about half as long as the arm's line, rising slightly to the right, turning down at the right
      part: the upper lip, curving down into the right corner of the mouth
    - where: a short line across the bottom of the mouth, a little under half as long as the top line, rising slightly to the right
      part: the lower lip
