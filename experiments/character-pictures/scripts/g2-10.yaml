孔:
  checked: argon
  object: a swaddled baby on the left beside a wide curved opening on the right
  history: >-
    Bronze inscriptions combined a child 子 with a stroke at the top of the head marking the
    fontanelle, the soft opening in a newborn's skull. In the modern form that mark moved to the
    right as the long hooked stroke 乚, standing for an opening or hollow cavity beside the child.
  layout: >-
    The left half holds a baby wrapped in pale swaddling cloth, with a friendly face showing eyes, a
    nose and a mouth, its arms slanting up toward the right. The right half holds a pale hollow
    opening or niche whose straight left wall, curved floor and upturned right rim follow the long
    hooked stroke.
  exact:
    - The child on the left and the long hooked stroke on the right do not touch; a small gap separates the right stroke from both the head and the rising arm stroke.
    - In the left half, the top stroke runs across, rises slightly, and turns sharply back down to the left, its end touching the top of the vertical body stroke.
    - The vertical stroke on the left bows slightly to the right and ends at the bottom in a hook up to the left.
    - The arm stroke on the left is a rising line slanting upward from the far left to the centre, crossing the middle of the vertical body stroke.
    - The long stroke on the right starts higher than the child's head, runs straight down, curves smoothly at the bottom to run across to the right, and turns sharply up at the bottom right into a tall upward hook.
  strokes:
    - where: a line across the top of the left half, rising slightly to the right and turning sharply back down to the left
      part: the baby's head, its top and right side, closing at the chin
    - where: a curved line down the middle of the left half, bowing slightly right and ending at the bottom in a hook up to the left
      part: the baby's body bundled in its wrap, the hook its bundled feet
    - where: a rising line across the middle of the left half, slanting up from the far left to the centre
      part: the baby's arms, stretched out wide
    - where: a long line from the top centre straight down, curving at the bottom to run across to the right and turning sharply up into a tall hook at the bottom right
      part: the left wall, curved floor and upturned right rim of the opening

