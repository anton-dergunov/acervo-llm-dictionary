  history: >-
    An ideogrammic compound of a gate (門) with a person (人) inside the doorway: someone glimpsed
    darting through a gate, hence to dodge or flash past.
  layout: >-
    A tall wooden gateway frames the left, top and right of the square, open at the bottom, with two
    panelled door leaves hanging across the upper two fifths in pale warm wood. In the open passage
    between the gateposts below the door panels stands a person seen from the front, legs apart as
    if darting through. The person has a small head with eyes, a nose and a mouth just above the top
    of the body stroke, and wears simple pale clothes with pale arms so that only the body and legs
    are ink.
  exact:
    - The gateway is open at the bottom; the left outer vertical ends in a plain point, while the slightly taller right outer vertical ends in a small hook up to the left.
    - Each upper door leaf hangs down about two fifths of the gate's height, leaving a gap between the two leaves at the top centre.
    - Inside the left leaf, the upper inner stroke touches the left vertical and stops just short of the inner vertical, while the lower stroke closes the bottom of the leaf.
    - Inside the right leaf, the upper inner stroke touches the short inner vertical and stops short of the right vertical, while the lower crossbar connects the foot of the inner vertical to the right vertical.
    - The person sits in the middle of the doorway below the two upper door leaves without touching the gate; the shorter right leg starts from the middle of the longer left-sweeping body stroke.
  strokes:
