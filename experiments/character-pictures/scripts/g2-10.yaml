    - The first stroke runs across the top, turns sharply down on the right side, and ends at the bottom in a hook up to the left.
    - The long sweep down to the bottom left starts from the middle of the top line across and does not cross above it.
    - The short stroke on the middle left slants down to the left in the space below the top line and to the left of the curved sweep, standing completely free of both strokes.
  strokes:
    - where: a line across the top that turns down on the right side and ends at the bottom in a hook up to the left
      part: the top edge and thick back spine of the knife blade
    - where: a long curved sweep from the middle of the top line down and out to the bottom left
      part: the sharp cutting edge of the blade
    - where: a short stroke slanting down to the left in the middle left, to the left of the curved sweep
      part: the indicator mark beside the sharp edge of the blade

丘:
  checked: argon
  object: a hill with two grassy mounds side by side rising above flat ground
  history: >-
    The oldest forms drew two hilltops side by side on a baseline, a double-crested mound where 山
    draws three peaks. In the modern form the left mound rises higher with a sloping crest at the
    top, a cross-ridge extends to the right, and both verticals stand on the long bottom ground
    line.
  layout: >-
    A soft grassy hill with two rounded mounds fills the centre of the square above a wide flat
    ground line at the bottom. The left mound rises higher, framed by the top-left sweep and the
    taller left vertical; the lower right mound sits beside it under the middle horizontal ridge and
    around the shorter right vertical. Pale green and warm earth tones shade the two mounds behind
    the strokes, with nothing below the bottom ground line.
  exact:
    - The top sweep slants down to the left and meets the top of the left vertical.
    - The left vertical runs straight down from the end of the top sweep to stand on the bottom line, without crossing below it.
    - The middle line across starts on the middle of the left vertical, rises slightly to the right, and is clearly shorter than the bottom line, a little over half as long.
    - The right vertical starts from the middle of the upper line across, about three quarters as long as the left vertical, and stands on the bottom line without crossing above or below.
    - The bottom line runs all the way across the base from left to right, supporting both verticals.
  strokes:
    - where: a sweep from the top centre slanting down to the left
      part: the sloping crest of the higher left mound
    - where: a tall line from the left end of the top sweep down to the bottom line
      part: the steep left side of the hill
    - where: a line from the middle of the left vertical across to the right, rising slightly, a little over half as long as the bottom line
      part: the ridge running across to the lower right mound
    - where: a shorter vertical line from the middle of the ridge down to the bottom line, about three quarters as tall as the left vertical
      part: the side of the lower right mound
    - where: a long straight line across the bottom from left to right
      part: the flat ground at the base of the hill

姻:
  checked: argon
  dropped: It is a pure phono-semantic compound where 因 serves only for sound, so depicting both components as a scene would teach a false etymology.

琴:
  checked: argon
  dropped: Because 今 serves only as the phonetic component and has no pictographic role in the instrument, drawing the whole character as one picture would teach a false etymology.

旋:
  checked: argon
  object: a tall banner flag on the left with its streamer flying at the top right, and a foot below on the right stepping around a circular arc
  history: >-
    The oldest forms combined a fluttering flag on a pole with a circle and a foot beneath it,
    showing soldiers or marchers wheeling around a standard. In the modern form, the flag's pole and
    hanging banner sit on the left, its flying streamer sits at the top right, and the circle and
    foot have merged into the lower-right component.
  layout: >-
    The left side and upper right form an ancient standard with pale cloth folds: the flagpole and
    hanging banner fill the left half, while the top-right strokes form a pale pennant ribbon
    fluttering to the right. Below the pennant on the right, the hooked horizontal forms the upper
    arc of a pale circular ring, and the lower strokes form a bare or sandalled foot stepping to the
    right along that circle.
  exact:
    - The short slanting dot at the top left stands free above the left horizontal line.
    - The left horizontal line is about three quarters as long as the wide hooked horizontal on the right, and stops just short of the top-centre sweep with a small gap between them.
    - The left sweep starts at the middle of the left horizontal line, and the hooked lower-left stroke starts near the top of that sweep, turns down, and ends in a hook up to the left.
    - At the top centre, a sweep runs down to the left, and a shorter horizontal line (a little over half as long as the hooked horizontal below it) starts from its middle and rises slightly to the right.
    - Below that, the longest horizontal runs from the centre to the middle right and ends in a sharp hook down to the left.
    - A straight vertical line hangs from the middle of the hooked horizontal down to the middle of the long bottom-right falling stroke, with a short stroke rising to the right from its middle.
    - A lower-centre sweep runs down to the left, and the long bottom-right falling stroke starts from the middle of that sweep and extends out to the bottom right.
  strokes:
    - where: a short stroke slanting down to the right at the top left, standing free
      part: the finial ornament at the top of the flagpole
    - where: a line across the middle left, rising slightly to the right, about three quarters as long as the hooked horizontal on the right
      part: the crossbar of the flagpole
    - where: a stroke starting just below the middle of the left crossbar, going briefly right, turning down and left, and ending in a hook up to the left
      part: the hanging inner edge and curled bottom corner of the banner
    - where: a sweep from the middle of the left crossbar down and out to the bottom left
      part: the main shaft and outer edge of the banner on the left
    - where: a sweep from the top centre down and to the left toward the centre
      part: the upper mast attachment of the flying streamer
    - where: a line across the upper right, starting from the middle of the top-centre sweep and rising slightly to the right
      part: the streamer ribbon fluttering out to the right
    - where: a long line across from the centre to the middle right, rising slightly and ending in a hook down to the left
      part: the curved upper arc of the turning circle above the foot
    - where: a straight line down from the middle of the hooked horizontal to the lower right
      part: the upright ankle and shin of the pivoting foot
    - where: a short stroke from the middle of the upright ankle line, rising slightly to the right
      part: the front strap across the instep
    - where: a sweep from the centre, below the start of the hooked horizontal, down to the bottom centre-left
      part: the trailing heel of the foot
    - where: a long stroke starting from the middle of the heel sweep, slanting down to the right and flattening out at the bottom right
      part: the sole of the foot stepping around to the right

晋:
  checked: argon
  object: a wide cross-shaped temple seen from the front in the upper half, with the sun rising below it in the lower half
  history: >-
    Originally an ideogrammic compound of 臸 (to arrive) above the sun 日, meaning to advance as the
    sun rises. The simplified form replaces the upper part with 亚, a cross-shaped temple or hall,
    standing above the sun 日.
  layout: >-
    The wide front of the temple fills the upper half of the square, with a flat roof held up by two
    inner pillars on a broad stone floor and two small side wings flanking the pillars in pale
    sandstone. Centered underneath the broad floor sits the rectangular sun in the lower half,
    glowing with a soft pale gold light and warm pale rays behind the strokes.
  exact:
    - The top line across is about half as long as the broad line across the middle.
    - The two vertical pillars in the upper half both start on the top line across and end on the broad middle line across.
    - The short slanting stroke on the upper left and the short sweep on the upper right both stand completely free, without touching the pillars or the horizontal lines.
    - The sun in the lower half is much narrower than the broad middle line above it, and sits below that line without touching it.
    - In the lower half, the top and right side of the sun are one stroke that starts at the top of the left vertical, turns down at the right, and ends in a small hook to the left.
    - The inner horizontal line of the sun touches the left vertical and stops short of the right side, while the bottom line connects the left vertical to the right side.
  strokes:
    - where: a line across the top centre, about half as long as the wide line across the middle
      part: the temple's flat roof
    - where: a vertical stroke down the left of the upper centre, from the top line to the wide middle line
      part: the temple's left pillar
    - where: a vertical stroke down the right of the upper centre, from the top line to the wide middle line
      part: the temple's right pillar
    - where: a short dot-like stroke in the upper left, outside the left pillar, slanting down to the right
      part: the temple's left wing, standing apart
    - where: a short sweep in the upper right, outside the right pillar, slanting down to the left and stopping short of the pillar
      part: the temple's right wing, standing apart
    - where: a very long line across the middle from the far left to the far right, rising slightly to the right
      part: the broad floor of the temple
    - where: a straight vertical line down the left side of the lower centre
      part: the left rim of the sun
    - where: a line across the top of the lower centre, turning down at the right to run down the right side and ending in a small hook to the left
      part: the top and right rim of the sun
    - where: a short line across the middle of the lower centre, starting on the left vertical and stopping short of the right side
      part: a band of light across the heart of the sun
    - where: a line across the bottom of the lower centre, joining the left vertical to the right side
      part: the bottom rim of the sun

闪:
  checked: argon
  object: a person darting through an open gateway, framed between the two gateposts under a crossbeam
  history: >-
    An ideogrammic compound combining a gate (門, simplified from cursive to the single-frame 门) and
    a person (人) inside it, showing someone glimpsed for an instant as they dash through a doorway.
  layout: >-
    A tall wooden gateway fills the square, open at the bottom, with its left post on the left, an
    iron latch at the upper left, and its crossbeam and hooked right post on the right. Centered
    inside the open doorway is a small person seen from the front in mid-stride, with a face showing
    eyes, a nose and a mouth just above the top of the body stroke, wearing simple pale clothes with
    pale arms at the sides. Soft pale timber tones shade the gate behind the strokes.
  exact:
    - All three strokes of the outer gate stand completely free of one another and do not touch.
    - The short dot sits at the top left, above and to the right of the left vertical's top, between the left vertical and the start of the top crossbeam.
    - The left vertical is straight and ends in a plain point at the bottom, with no hook.
    - The top-and-right stroke starts near the top centre, runs across to the top right, turns sharply down the right side, and reaches lower than the left vertical before ending in a hook up to the left.
    - Inside the gate, the person's right-falling leg starts at the middle of the left-sweeping body stroke.
    - The person sits wholly inside the doorway and does not touch the left vertical or the right vertical of the gate.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: an iron latch at the top of the left gatepost
    - where: a long straight line down the left side
      part: the left gatepost
    - where: a line from the top centre across to the top right, turning down to run along the right side and ending at the bottom in a hook up to the left
      part: the crossbeam and the right gatepost, its foot set in the ground
    - where: a sweep inside the gate from the upper centre down and out to the middle left
      part: the person's body, running down into the left leg
    - where: a short falling stroke inside the gate, from the middle of the body sweep down to the middle right
      part: the person's right leg

挟:
  checked: argon
  dropped: Because the scholarly origin classifies the character purely as a phono-semantic compound with no pictographic or ideographic reading, drawing a picture for it would teach a false etymology.

