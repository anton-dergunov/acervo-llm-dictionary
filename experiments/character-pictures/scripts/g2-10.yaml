  history: >-
    An ideogrammic compound formed by tripling the character for a kneeling woman (女), representing
    many women together and, by extension, intrigue or craftiness.
  layout: >-
    Three kneeling women fill the square in a pyramid arrangement, all seen in profile facing left.
    One wide woman kneels centred in the upper half, while two narrower women kneel side by side in
    the lower half without touching each other or the top woman. Each woman has a clear face with
    eyes, a nose and a mouth, and wears simple pale robes.
  exact:
    - The three women do not touch one another; there is a clear gap between the top woman's lower right leg and the bottom-right woman, and between the two lower women.
    - In every woman, the bent stroke from the top turns sharply at an angle to sweep down to the right, and the downward-left sweep crosses its lower leg.
    - The top woman's line across is the longest, stretching wide across the upper half and crossing both her bent back stroke and the top of her downward-left sweep.
    - The bottom-left woman's line across is clearly shorter, just under half as long as the top woman's, rising slightly to the right to end on the start of her downward-left sweep without crossing past it.
    - The bottom-right woman is slightly wider than the bottom-left woman; her line across is about two thirds as long as the top woman's and crosses both her bent stroke and the top of her downward-left sweep.
  strokes:
