  object: a hand reaching over a dying fire that is cooling into pale ashes, with the hand and arm on the top-left strokes and the low flame and sparks on the bottom-right strokes
  history: >-
    An ideogrammic compound of a hand 又 (now written 𠂇 at the top left) and fire 火: fire that has
    died down into ash cool enough to touch with the hand.
  layout: >-
    A pale-skinned hand and forearm fill the upper and left part of the frame, reaching across from
    the left over the fire below, with the thumb rising at the top of the long sweep and the fingers
    stretching out to the right along the upper line across. Nestled underneath in the lower right
    is a low, dying fire in soft orange and yellow over a small pale-grey mound of ash at its base,
    with two small sparks floating on either side.
  exact:
    - The long upper-left sweep starts well above the upper line across, crosses it near its middle, and sweeps far down to the lower left.
    - The upper-left hand strokes and the lower-right fire strokes do not touch each other; the top of the fire's central sweep stops just short of the upper line across.
    - In the fire in the lower right, the small left dot and the short upper-right sweep both stand completely free, touching neither the central sweep nor the outer strokes.
    - The fire's lower-right falling stroke starts at the middle of the fire's central sweep and flares out to the bottom right.
    - The upper-left sweep is noticeably longer than the fire's central sweep, which is about three quarters as long and sits lower and further right.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the outstretched fingers and top of the hand reaching over the fire
    - where: a long sweep starting high at the top centre-left, crossing the line across and curving down to the lower left
      part: the raised thumb at the top and the forearm sweeping down to the left
    - where: a short dot in the middle left, between the two long sweeps, slanting down to the right
      part: a small spark or fleck of ash on the left side of the fire
    - where: a short sweep in the middle right, slanting down to the left
      part: a small spark or fleck of ash on the right side of the fire
    - where: a sweep from the centre, just below the upper line across, curving down and out to the bottom left
      part: the left edge of the dying flame, from its tip down to its base in the ashes
    - where: a falling stroke from the middle of the flame's central sweep down and out to the bottom right
      part: the right edge of the dying flame, flaring out at its base in the ashes

