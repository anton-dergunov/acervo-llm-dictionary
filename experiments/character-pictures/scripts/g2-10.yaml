      part: the top woman's head and back, turning at her hip into her folded thigh and knee
    - where: a sweep in the upper half from just right of the top centre down and left to the middle
      part: the top woman's arm, reaching down across her body
    - where: a long line across the upper half from left to right
      part: the top woman's other arm, held wide across in front of her
    - where: a stroke in the bottom-left quarter from the middle left down a little to the left, turning sharply to sweep down to the right near the bottom centre
      part: the bottom-left woman's head and back, turning at her hip into her folded thigh and knee
    - where: a sweep in the bottom-left quarter from near the centre down to the bottom left
      part: the bottom-left woman's arm, reaching down across her body
    - where: a short line across the bottom-left quarter, just under half as long as the top woman's line across, rising slightly to the right and ending at the top of her downward-left sweep
      part: the bottom-left woman's other arm, held forward
    - where: a stroke in the bottom-right quarter from the centre down a little to the left, turning sharply to sweep down to the bottom right
      part: the bottom-right woman's head and back, turning at her hip into her folded thigh and knee
    - where: a sweep in the bottom-right quarter from the middle right down and left toward the bottom centre
