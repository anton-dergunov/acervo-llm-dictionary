    - where: a line across the bottom-right quarter, about two thirds as long as the top woman's line across, running from the centre to the right edge
      part: the bottom-right woman's other arm, held across in front of her

勿:
  checked: argon
  object: an ancient curved knife with two streaks running down across its blade
  history: >-
    Originally the character for cutting, the oracle bone forms drew a curved knife blade with
    droplets or streaks of blood from cutting, or fragments being sliced off. It was early on
    borrowed for the sound of the word meaning "do not".
  layout: >-
    One broad, curved ancient knife fills the frame. The upper-left sweep forms the angled handle
    and guard at the top left, while the long wrapping stroke forms the top ridge and the curved
    right spine of the pale grey-bronze blade, tapering to a hooked point at the bottom. Inside the
    blade, the two parallel sweeps run down and to the left from the top ridge, tinted with soft
    pale red along their edges as streaks on the flat of the blade.
  exact:
    - The horizontal part of the wrapping stroke starts at the middle of the upper-left sweep, runs across to the right, and turns down into a long curve ending in a hook up and to the left at the bottom.
    - Both inner sweeps start touching the underside of the horizontal line and sweep down and to the left inside the knife frame without touching the bottom hook.
    - The left inner sweep starts near the left end of the horizontal line and is clearly shorter, a little under half as long in its upper part and about two thirds as long overall as the right inner sweep.
    - The right inner sweep starts at the middle of the horizontal line and reaches much lower, down toward the bottom left.
    - The upper-left sweep and the two inner sweeps run roughly parallel to one another and never cross or touch each other.
  strokes:
    - where: a sweep from the top left-centre down and out to the middle left
      part: the angled handle and front guard of the knife
    - where: a line from the middle of the first sweep across to the right, turning down along the right side and ending at the bottom centre in a hook up to the left
      part: the top ridge and curved outer spine of the knife blade, ending at its point
    - where: a shorter sweep inside the frame, starting near the left end of the horizontal line and curving down to the middle left
      part: the shorter left streak running down the blade
    - where: a longer sweep inside the frame, starting at the middle of the horizontal line and curving down to the bottom left
      part: the longer right streak running down the blade and marking its inner edge

灰:
