    - where: a stroke from the top of the left line running across to the right and turning down for about two fifths of the gate's height
      part: the left door leaf's top and inner edge
    - where: a short stroke inside the upper left leaf, from the left line rising slightly to the right
      part: the left door leaf's middle slat
    - where: a short stroke below it, from the left line rising slightly to the right to meet the foot of the inner edge
      part: the left door leaf's lower crossbar
    - where: a short line down from the top centre of the right half
      part: the right door leaf's inner edge
    - where: a long stroke from the top of that short line, running across the top right and turning down the right side all the way to the bottom, ending in a hook up to the left
      part: the right door leaf's top and outer post
    - where: a short stroke inside the upper right leaf, from the short inner edge rising slightly to the right
      part: the right door leaf's middle slat
    - where: a short line across the bottom of the upper right leaf, from the foot of the inner edge to the outer post
      part: the right door leaf's lower crossbar
