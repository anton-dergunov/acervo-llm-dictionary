闹:
  checked: argon
  object: a market stall with a crossbar, central post and hanging cloth canopy (市) standing inside a wide gateway (门)
  history: >-
    The traditional form 鬧 combined fighting (鬥) with a market (市) to evoke the noise and bustle of
    a marketplace. The simplified form 闹 replaces the fighting component with a gate (门), framing
    the market stall inside an open gateway.
  layout: >-
    A tall wooden gateway frames the square on the left, top right and right side, with its iron
    latch floating at the top left. Centered inside the open gateway stands a market stall: a
    central wooden post topped by a crossbar and roof finial, with a pale woven cloth canopy hanging
    from a horizontal rod across its middle. The wood is pale warm brown and the market cloth is
    soft pale ochre, keeping all shading light behind the strokes.
  exact:
    - The three strokes of the outer gate stand completely free of one another and do not touch the inner market component.
    - The left gatepost is a long straight vertical with a plain bottom and no hook, while the right gatepost turns down from the top crossbeam and ends at the bottom in a prominent hook to the left.
    - Inside the gate, the market's top dot sits below and to the right of the gate's top-left dot with a clear gap, and does not touch the horizontal crossbar below it.
    - The market's central vertical starts against the underside of the horizontal crossbar without projecting above it, crosses the lower canopy frame, and ends at the bottom in a plain point with no hook.
    - In the lower inner canopy frame, the short left vertical and the hooked top-and-right stroke meet at the top left corner; both sides end well above the bottom of the central post.
    - The left gatepost is the longest vertical, the central market post is about two thirds as long, and the left side of the inner canopy is less than a third as long.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: the iron latch above the left gatepost
    - where: a long straight line down the left side, with no hook
      part: the left gatepost
    - where: a line across the top right, turning down at the top right corner to run down the right side and ending in a hook to the left
      part: the gate's crossbeam and right gatepost
    - where: a short dot in the upper centre inside the gate, slanting down to the right
      part: the finial above the market stall
    - where: a line across the upper middle inside the gate, rising slightly to the right
      part: the top crossbar of the market stall
    - where: a short line down on the left side of the inner lower part
      part: the left hanging edge of the market cloth canopy
    - where: a line across from the top of the short inner vertical to the right, turning down and ending in a small hook to the left
      part: the top rod and right hanging edge of the market cloth canopy
    - where: a straight line down the centre from the underside of the upper-middle crossbar, crossing the canopy and ending in a plain point
      part: the central post of the market stall

矛:
  checked: argon
  object: an upright bamboo spear with a pointed blade at the top, a ringed crossguard across the middle, a shaft down the centre, and a tassel sweeping down to the left
  history: >-
    The oldest forms drew a thrusting spear upright, showing its two-edged point at the top, a small
    side ring on the socket for tying a streamer, and the shaft below. In the modern form the blade
    and socket became the angled strokes at the top, the ring widened into the long hooked bar
    across the middle, and the shaft and hanging tassel became the two lower strokes.
  layout: >-
    The spear stands upright, filling the frame from top to bottom. At the top centre, a pale grey
    metal blade surrounds the angled upper strokes. Across the middle runs the wide crossbar with
    its hooked ring on the right; from the centre of this bar, a pale ochre bamboo shaft runs down
    to the bottom, while a soft pale red tassel sweeps down and out to the bottom left.
  exact:
    - The top stroke's horizontal leg is clearly shorter than the wide middle line across, a little over a third as long, before it turns sharply down to the left.
    - The lower end of the top angled stroke touches the middle of the short slanting stroke below it.
    - The short slanting stroke in the upper middle stops above the wide middle line across and does not touch it.
    - The wide middle line across spans almost the full width of the frame and ends at the right in a sharp hook down to the left.
    - Both the central vertical shaft and the long left sweep start together at the middle of the wide line across.
    - The central vertical curves slightly and ends at the bottom centre in a hook up to the left, while the left sweep runs out to a plain point at the bottom left.
  strokes:
    - where: a short line across the top, a little over a third as wide as the middle bar, turning sharply at the right to slant down to the left
      part: the pointed tip of the spearhead
    - where: a short stroke in the upper middle slanting down to the right
      part: the collar at the base of the spearhead
    - where: a wide line across the middle from left to right, rising slightly and ending in a hook down to the left
      part: the spear's crossguard, with its side ring hooked at the right end
    - where: a long vertical line from the centre of the middle bar down to the bottom centre, curving slightly and ending in a hook up to the left
      part: the bamboo shaft of the spear, hooked at its butt end
    - where: a long sweep starting at the centre of the middle bar and running down and out to the bottom left
      part: the tassel hanging from the middle of the spear

