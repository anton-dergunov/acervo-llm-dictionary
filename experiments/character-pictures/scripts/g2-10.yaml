垂:
  checked: argon
  object: a plant rooted in the earth at the base, with spreading branches and drooping flower shoots hanging down on either side
  history: >-
    Originally written 𡍮, a pictogram of a plant with drooping branches and hanging flowers (𠂹)
    growing above the earth (土). The modern strokes preserve the central stem, the spreading tiers
    of branches with two hanging shoots on the left and right, and the earth at the bottom.
  layout: >-
    A symmetrical plant with drooping foliage and pale blossoms fills the frame from top to bottom.
    The central vertical stroke is the main stem, crossed by three tiers of horizontal branches and
    topped by a drooping tip bending to the left. Two short vertical shoots hang down across the
    wide middle branch on the left and right, surrounded by soft pale petals and leaves behind the
    strokes, while the lowest horizontal stroke forms the flat mound of earth at the base.
  exact:
    - The central vertical starts touching the middle of the top sweep, crosses the upper, middle, and lower lines across, and ends on the middle of the bottom line across without extending below it.
    - The middle line across is by far the widest stroke; the upper, lower, and bottom lines across are all clearly shorter, each a little over half as long as the middle one.
    - The two short vertical strokes on the left and right cross the wide middle line across and slant slightly inward as they go down.
    - The two short outer vertical strokes do not touch the upper line across above them or the lower line across below them, leaving a clear gap at both ends.
    - Every stroke ends plainly with no hooks.
  strokes:
    - where: a short sweep near the top, running from right to left and slanting slightly down
      part: the drooping top tip of the plant bending to the left
    - where: a line across the upper part, clearly shorter than the wide middle line across and a little over half as long, rising slightly to the right
      part: the upper branch spreading to both sides
    - where: a long straight line down the centre, from the middle of the top sweep to the middle of the bottom line across
      part: the main central stem of the plant
    - where: a very long line across the middle, spanning nearly the full width of the frame
      part: the wide main branch spreading out to the left and right
    - where: a short vertical line on the left side, slanting slightly down to the right and crossing the wide middle line across
      part: a drooping shoot with hanging flowers on the left side
    - where: a short vertical line on the right side, slanting slightly down to the left and crossing the wide middle line across
      part: a drooping shoot with hanging flowers on the right side
    - where: a line across the lower part, clearly shorter than the wide middle line across and a little over half as long
      part: the lower branch spreading to both sides
    - where: a line across the bottom, a little over half as long as the wide middle line across
      part: the flat mound of earth at the base of the plant

