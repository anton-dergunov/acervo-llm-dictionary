删:
  checked: argon
  object: an ancient book of bamboo slips bound by a cord on the left, with an upright scraping knife on the right
  history: >-
    An ideogrammic compound combining a book of strung bamboo slips (册) on the left and a knife (刂,
    from 刀) on the right. Before paper, writing was done on bamboo slips and mistakes were scraped
    off with a knife.
  layout: >-
    The bound bamboo slips fill the left and middle of the square as two side-by-side pairs of tall
    vertical strips tied across the middle by a horizontal cord, coloured in pale warm bamboo tan.
    The upright knife stands on the right with its short cutting edge facing the slips and its long
    spine on the far right, shaded in pale grey-blue.
  exact:
    - The bamboo slips on the left and the knife on the right do not touch each other.
    - The bamboo slips form two arched pairs side by side with a narrow gap between the two pairs; in each pair, the left vertical sweeps down to a plain point, while the right stroke starts at the top of the left vertical, runs briefly across, turns down, and ends in a hook to the left.
    - The horizontal line across the middle of the left part rises slightly to the right, crossing all four vertical lines of the bamboo slips and stopping short of the knife.
    - Both vertical strokes of the knife on the right stand completely free of every other stroke.
    - The knife's inner vertical is short, a little over a third as long as the outer vertical, and ends in a plain point, while the outer vertical on the far right is the tallest stroke, starting higher and reaching lower to end in a hook to the left.
  strokes:
    - where: a long line down the far left, sweeping slightly outward toward the bottom left
      part: the outer left bamboo slip
    - where: a line from the top of the leftmost vertical across to the right, turning down and ending in a small hook to the left
      part: the top edge of the left pair of slips and its right bamboo slip
    - where: a long line down just left of the centre, sweeping slightly toward the bottom left
      part: the left bamboo slip of the inner pair
    - where: a line from the top of the middle-left vertical across to the right, turning down and ending in a small hook to the left
      part: the top edge of the inner pair of slips and its right bamboo slip
    - where: a long line across the middle of the left side, rising slightly to the right across all the slips
      part: the cord that binds all the bamboo slips together
    - where: a short straight line down the upper-middle part of the right side
      part: the inner cutting edge of the upright knife blade
    - where: a very long line down the far right from near the top to near the bottom, ending in a hook to the left
      part: the long spine and hooked tip of the upright knife

