長:
  object: an old man with long hair and a cane
  history: >-
    The oldest forms drew an old man with long flowing hair leaning on a cane, a long life.
  layout: >-
    The old man fills the square, bent a little, with long white hair falling on the left, a kind
    wrinkled face, a pale grey robe and bare feet. He leans on a cane held in his right hand, which
    slants down to the right. Colours are pale.
  exact:
    - The short line across the top is the top of the head and sits above the hair; it starts at the top of the long hair stroke.
    - The two short lines inside are strands of hair, each about as long as the top line, and both start on the long hair stroke without reaching the robe.
    - The long line across the middle is the longest across stroke, more than twice as long as the short lines above it.
    - The long hair stroke ends on that long line; it does not touch the robe's sweep below.
    - The robe's sweep starts on the long line and runs down, then turns up to the right at the bottom with a small foot.
    - The cane is a long slanting stroke from the end of the hair stroke down to the bottom right, turning across to the right at the end; the small stroke is the hand gripping the cane and touches it.
  strokes:
    - where: a short line across the top, rising slightly to the right
      part: the top of the old man's head
    - where: a stroke down from the start of the top line, slanting right and then straight down, ending on the long line across the middle
      part: the long hair falling at the left
    - where: a short line across the upper middle, rising slightly to the right, from the long hair stroke
      part: a strand of hair, upper
    - where: a short line across below it, rising slightly to the right, from the long hair stroke
      part: a strand of hair, lower
    - where: a long line across the middle, rising slightly to the right, from near the left edge to near the right edge
      part: the old man's shoulders and arms
    - where: a stroke from the long line's middle left, down, then turning up to the right at the bottom
      part: the robe and his left leg, with the foot turned up
    - where: a very short stroke on the right of the long line, slanting down to the right
      part: the old man's hand gripping the cane
    - where: a long stroke from the end of the long hair stroke, down to the right, then turning across to the right at the end
      part: the cane, planted in the ground

长:
  object: an old man with long hair and a cane
  history: >-
    The oldest forms drew an old man with long flowing hair leaning on a cane, a long life.
  layout: >-
    The old man fills the square, a little bent, with long white hair falling down his back, a kind
    wrinkled face, a pale grey robe and bare feet. He leans on a cane that slants down to the right.
    Colours are pale.
  exact:
    - The short sweep at the upper right is a free strand of hair blowing and touches nothing.
    - The line across the middle is long and crosses the long vertical stroke at its middle.
    - The long vertical stroke runs from the top left down to the bottom centre and turns up to the right at its end.
    - The cane starts on the line across the middle and does not touch the long vertical stroke; it is about as long as the line across.
  strokes:
    - where: a short sweep at the upper right, from the upper middle down and out to the lower left
      part: a free strand of the old man's hair
    - where: a long line across the middle, rising slightly to the right, ending in a turn across to the right
      part: the old man's shoulders and arms
    - where: a long stroke from the top left straight down, crossing the line across, then turning up to the right at the bottom
      part: the long hair and body, ending in the foot turned up
    - where: a stroke from the middle of the line across, down to the right, then turning across to the right
      part: the cane, planted in the ground

什:
  object: a person standing at the head of a file of ten people, beside a cross-shaped marker standing for ten
  history: >-
    The oldest forms drew a person and the sign for ten, a file of ten people.
  layout: >-
    A person fills the left of the square, facing right, with a friendly face and simple pale clothes.
    On the right stands a tall cross-shaped marker of pale wood, the sign of ten, with a file of small
    people lined up behind it in the distance, each with a face. Colours are pale.
  exact:
    - The person and the cross do not touch.
    - The person's second stroke starts on the first and does not touch the cross's horizontal.
    - The cross's vertical is a straight vertical ending in a plain point at the bottom, with no hook, and it is the longest stroke, filling the whole height.
    - The cross's horizontal is about half as long as the vertical and crosses the vertical at its middle.
  strokes:
    - where: a sweep from the top left of the left half down and out to the bottom left
      part: the person's body, running down into the left leg
    - where: a vertical line in the left half, starting from the middle of the sweep and running straight down
      part: the person's right leg
    - where: a line across the right half, a little above its middle
      part: the cross's arms, held out to both sides
    - where: a long straight line down the right half, crossing the horizontal at its middle
      part: the marker's post

書:
  object: a hand holding a brush and writing words on paper
  history: >-
    The oldest forms drew a hand holding a brush, with the words it writes on a page.
  layout: >-
    A hand, pale skin and a pale sleeve, grips an upright brush in the top half. The brush's tip
    touches the paper's top edge that runs across the middle. Below it a small pale page holds the
    written words, drawn as a small box with two lines of writing inside it.
  exact:
    - The top stroke runs across and ends in a small hook down to the left; the long line across beneath it crosses its end.
    - The brush's shaft is a straight vertical, a plain stroke with no hook, crossing the sleeve line and both finger lines, and ends on the paper's edge.
    - The sleeve line is the longest stroke in the top half, the finger lines are shorter, the upper one a little under half as long and the lower one a little over a third as long.
    - The thumb stroke above the sleeve line is clearly shorter than it, about two thirds as long.
    - The paper's edge is shorter than the sleeve line, about four fifths as long.
    - The written box's left side is short and its top turns down on the right; its bottom line is a short stroke linking them, with the two inner lines between.
    - The inner lines touch the left side and stop short of the right side.
  strokes:
    - where: a stroke across the upper left half, about two thirds as long as the sleeve line below it, ending in a small hook down to the left
      part: the hand's top, the thumb
    - where: a long line across the top of the hand, almost the whole width
      part: the sleeve and wrist
    - where: a line across below it, shorter, from the left of the middle to the right of the middle
      part: the upper fingers gripping the brush
    - where: a line across below it, shorter still, rising slightly to the right
      part: the lower fingers gripping the brush
    - where: a long straight line down the middle, from above the top to below the fingers
      part: the brush's shaft, with its tip on the paper
    - where: a line across the lower middle, about four fifths as long as the sleeve line
      part: the paper's top edge
    - where: a short line down the left side of the box below
      part: the written box's left side
    - where: a line across the top of the box, turning down on the right
      part: the written box's top and right side
    - where: a short line across the middle of the box, from the left side
      part: the first line of writing
    - where: a line across the bottom of the box, closing it
      part: the second line of writing and the box's base

书:
  object: a hand holding a brush and writing words on paper
  history: >-
    The oldest forms drew a hand holding a brush, with the words it writes on a page.
  layout: >-
    A pale brush stands upright in the middle, a pale hand gripping it, and its tip rests on a long
    pale mark it has made across the lower half. A single small drop of pale ink sits to the upper
    right of the brush.
  exact:
    - The brush's shaft is a straight vertical, a plain stroke with no hook, and crosses both lines across.
    - The upper line across is short, about half as long as the lower one, and ends in a small hook down to the left; its end touches the lower line.
    - The lower line across is long, turns down on the right and ends in a small hook to the left.
    - The ink drop is a very short slanting stroke at the upper right and touches nothing.
  strokes:
    - where: a short line across the upper left, ending in a small hook down to the left
      part: the hand's grip on the brush
    - where: a long line across the lower half, turning down at the right and ending in a small hook to the left
      part: the long mark the brush has made, and the writing line
    - where: a long straight line down the middle, crossing both lines across
      part: the brush's shaft
    - where: a very short stroke at the upper right, slanting down to the right
      part: the drop of ink

区:
  object: a district, a walled enclosure open on the right, with its people living inside
  history: >-
    The oldest forms drew a walled place with several mouths, the households, inside it. The simplified
    form replaces them with a cross.
  layout: >-
    A low pale wall wraps around the district on the top, the left and the bottom, open on the right. A
    crossroads of two pale paths, under a lord's control, crosses in the middle, with small pale
    houses behind it.
  exact:
    - The wall's top stroke is a separate short line that touches the start of the big left-and-bottom stroke at the top left.
    - The big left-and-bottom stroke runs down the left side, then turns across to the right along the bottom, and is the longest stroke.
    - The two crossing paths are about equal, the one sweeping down to the left a little longer than the one slanting down to the right, and they cross at their middles.
    - The crossing paths touch neither the top wall nor the left-and-bottom wall.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the wall's top edge
    - where: a sweep from the upper right of the middle down and out to the lower left
      part: the crossroads' path running down to the left
    - where: a stroke from the upper left of the middle down to the right
      part: the crossroads' path running down to the right
    - where: a long stroke down the left side from the top left, then turning across to the right along the bottom
      part: the wall's left side and bottom edge

區:
  object: a district, a walled enclosure open on the right, with its people living inside
  history: >-
    The oldest forms drew a walled place with several mouths, the households, inside it. The simplified
    form replaces them with a cross.
  layout: >-
    A low pale wall wraps around the district on the top, the left and the bottom, open on the right.
    Inside it three small households sit, one above and two below side by side, each a small pale face
    with its mouth drawn as a small open box, the upper one in the middle and the two lower ones left
    and right.
  exact:
    - The three mouths are small boxes with open mouths, each closed on all four sides, and they do not touch each other or the wall.
    - The upper mouth is higher and a little left of the middle; the two lower mouths sit side by side below it.
    - The wall's top stroke is a separate line that touches the start of the big left-and-bottom stroke.
    - The left-and-bottom stroke runs down the left side and turns across the bottom, and is by far the longest stroke.
    - The lower left mouth stands a little away from the wall's left side and does not touch it.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the wall's top edge
    - where: a short stroke down the left side of the upper box, slanting a little to the right
      part: the upper mouth's left side
    - where: a line across the top of the upper box, rising slightly to the right, turning down at the right
      part: the upper mouth's top lip and right side
    - where: a short line across the bottom of the upper box, rising slightly to the right
      part: the upper mouth's bottom lip
    - where: a short straight line down the left side of the lower left box
      part: the lower left mouth's left side
    - where: a stroke rising to the right across the top of the lower left box, then turning down
      part: the lower left mouth's top lip and right side
    - where: a very short line across the bottom of the lower left box, rising slightly to the right
      part: the lower left mouth's bottom lip
    - where: a short straight line down the left side of the lower right box
      part: the lower right mouth's left side
    - where: a stroke rising to the right across the top of the lower right box, then turning down
      part: the lower right mouth's top lip and right side
    - where: a short line across the bottom of the lower right box, rising slightly to the right
      part: the lower right mouth's bottom lip
    - where: a long stroke down the left side from the top left, then turning across to the right along the bottom
      part: the wall's left side and bottom edge

少:
  object: a few small grains of sand falling, beside the long curved edge of a sand drift
  history: >-
    The oldest forms drew a few small grains of sand. The small 小 gives the meaning of little.
  layout: >-
    Three small pale grains of sand fall in the upper part, one in the middle and one on each side, and
    below them a pale sand drift sweeps in a long curve from the right down to the lower left. Colours
    are pale gold and cream.
  exact:
    - The middle grain's stroke is a plain vertical-looking stroke that slants a little to the right, with no hook at its end, and is the longest of the three.
    - The right grain is under half as long as the middle one, slanting down to the right; the left grain is about the same length, slanting down to the left.
    - The three grains touch nothing and nothing touches them.
    - The sweep below starts in the middle right, just below the grains, and runs down to the bottom left; it touches nothing.
  strokes:
    - where: a stroke in the upper middle, slanting a little to the right and then straight down, with no hook
      part: the middle grain's trail, a trickle of sand falling
    - where: a short stroke at the upper left, slanting down to the left
      part: the left grain of sand falling
    - where: a short stroke at the upper right, slanting down to the right
      part: the right grain of sand falling
    - where: a long sweep from the middle right down and out to the bottom left
      part: the curved edge of the sand drift

文:
  object: a person standing facing you, bare chest tattooed with crossing marks
  history: >-
    The oldest forms drew a person seen from the front with a tattoo on the chest, the first writing.
  layout: >-
    A person fills the square, seen from the front, with a friendly face, a topknot, bare shoulders and a
    simple pale skirt below the waist. The tattoo is a pair of crossing lines on the chest. Colours
    are pale.
  exact:
    - The topknot is a short dot-like stroke at the top, separate from everything.
    - The line across rises slightly to the right and is the shoulders; it touches the crossing lines at its middle.
    - The two crossing lines cross each other at their middles; the one sweeping down to the left starts at the shoulder line, the other starts lower and further left and is a little longer.
  strokes:
    - where: a short slanting stroke at the top, slanting down to the right
      part: the person's topknot
    - where: a line across the upper part, rising slightly to the right, from near the left to the right
      part: the person's shoulders and arms
    - where: a stroke from the middle of the shoulder line, down to the right and then straight down, then sweeping down to the bottom left
      part: the first of the crossing tattoo lines, the person's chest and left leg
    - where: a long stroke from the left of the middle down to the right, then turning across to the right
      part: the second tattoo line, crossing the first, running into the right leg

比:
  object: two spoons standing side by side, the left one smaller and the right one bigger
  history: >-
    The oldest forms drew two spoons or ladles side by side, to compare them.
  layout: >-
    Two upright spoons stand side by side as in the box. The left spoon is narrower and shorter and its
    scoop sits low; the right spoon is wider and taller, its handle starting higher. Both bowls curve up
    to the right at the bottom, in pale silver.
  exact:
    - The left spoon is narrower and shorter than the right spoon.
    - The left spoon's short rising stroke starts on its stem at the middle and rises to the right.
    - The right spoon's short sweep slants down to the left and ends on the stem's middle.
    - The two spoons do not touch each other.
    - Both stems end in a small upward curl to the right at the bottom.
  strokes:
    - where: a short stroke from the middle of the left stem, rising to the right
      part: the left spoon's rim
    - where: a stroke from the top left, down, then turning up to the right at the bottom
      part: the left spoon's handle and scoop
    - where: a short sweep at the top of the right half, from the upper right down to the left
      part: the right spoon's neck
    - where: a long stroke from the top centre of the right half, down, then across to the right and curling up
      part: the right spoon's handle and its scoop curling up at the bottom right

元:
  object: a person standing, facing you, with the head emphasized by two lines
  history: >-
    The oldest forms drew a person with a large head, marked by a line above it.
  layout: >-
    A person stands facing you with a friendly face and simple pale clothes, the large head between the
    two lines, the shorter line above as the crown of the head and the longer line below as the
    shoulders. The legs are below, the left leg a short sweep and the right a long stroke with a foot.
  exact:
    - The upper line is a little over half as long as the lower line, and the two lines are apart.
    - The upper line touches nothing; the lower line touches both legs at its middle.
    - The right leg is much longer than the left, about twice as long, runs down, curves to the right and ends in a small hook turning up.
  strokes:
    - where: a short line across the top, rising slightly to the right
      part: the crown of the head
    - where: a longer line across below it, rising slightly to the right
      part: the shoulders and arms, at the base of the head
    - where: a sweep from the middle of the lower line down and out to the bottom left
      part: the person's left leg
    - where: a long stroke from the middle of the lower line down, bending right and running across, ending in a small hook turning up
      part: the person's right leg, with its foot

引:
  object: a bow with its string pulled back, the string drawn out to the right
  history: >-
    The oldest forms drew a bow and the string pulled back. The vertical line is the drawn string.
  layout: >-
    A hunting bow stands upright on the left, its limbs bending in and out, in pale wood. A thin pale
    string is pulled back and stands as a straight line on the right, apart from the bow.
  exact:
    - The string is a straight vertical ending in a plain point with no hook, nearly as long as the bow; it does not touch the bow.
    - The bow's top stroke is longer than its second stroke, which is about half as long, and the two meet at their ends.
    - The bow's last stroke ends in a small hook up to the left.
  strokes:
    - where: a line across the top of the left half, rising slightly to the right, turning down at the right
      part: the bow's upper tip, curving back
    - where: a short line across the upper middle of the left half, meeting the end of the first stroke
      part: the upper limb of the bow, bending back toward the grip
    - where: a line down the left from above the middle, across to the right below the middle, then down the right to the bottom, ending in a small hook to the left
      part: the grip, then the long lower limb curving out and down to the lower tip
    - where: a long straight vertical line in the right half
      part: the bowstring, drawn back

止:
  object: a bare foot, toes up, standing on the ground
  history: >-
    The oldest forms drew a foot print with toes at the top. The modern form keeps the toes and the
    ground line under the foot.
  layout: >-
    A bare human foot is seen from the front, toes up, standing on a line of ground at the bottom.
    The big toe is in the middle, a second toe out on the right, and a small toe on the left, in pale
    skin colours.
  exact:
    - The ground line is the longest stroke, nearly the whole width.
    - The big toe stroke runs down, turns slightly right, and reaches the ground line at its middle; it is a plain stroke with no hook.
    - The small toe at the left is about half as long as the big toe, starts at the middle left and reaches the ground line.
    - The second toe is short, about two fifths as long as the big toe, starts at the middle of the big toe and rises a little to the right.
  strokes:
    - where: a long line in the middle, from near the top, slanting a little to the right and then straight down to the ground line
      part: the big toe and the foot's main axis
    - where: a short line from the middle of the big toe out to the right, rising slightly
      part: the second toe, held out
    - where: a shorter line on the left, from the middle left down, slanting a little to the right, to the ground line
      part: the small toe and the edge of the foot
    - where: a long line across the bottom
      part: the ground under the foot

反:
  object: a hand held up flat against a cliff
  history: >-
    The oldest forms drew a hand pressed against a cliff, to turn back.
  layout: >-
    A tall pale grey cliff stands at the left, its ledge jutting out at the top. A hand, pale skin
    colour, is pressed up against the cliff's face at the right, with fingers reaching out toward the
    left, held up.
  exact:
    - The ledge at the top runs from the right to the left and meets the top of the cliff's face.
    - The cliff's face is a long sweep down to the bottom left and is the longest down stroke.
    - The hand's first stroke starts on the cliff's face at its middle; the second stroke does not touch the cliff.
    - The two hand strokes cross each other.
  strokes:
    - where: a short stroke across the top from right to left, turning down at its left end
      part: the cliff's overhanging ledge
    - where: a long sweep from the left end of the ledge down and out to the bottom left
      part: the cliff's face
    - where: a stroke from the middle of the cliff's face across to the right, then turning down to the left
      part: the hand's back and the wrist
    - where: a stroke below it from near the cliff, down to the right and then across to the right
      part: the hand's thumb and fingers

友:
  object: two hands joined in friendship
  history: >-
    The oldest forms drew two hands side by side, joined, for friends.
  layout: >-
    Two pale arms in simple sleeves meet in the middle of the square. The left hand comes from the top
    left, the right hand from the bottom right, and they clasp. Colours are pale.
  exact:
    - The left hand's line across crosses its sweep at the line's middle.
    - The left hand's line across is clearly shorter than the right hand's line across, a little over half as long.
    - The right hand's first stroke starts on the left hand's sweep at its middle.
    - The right hand's second stroke does not touch the left hand's sweep; it crosses the right hand's first stroke.
  strokes:
    - where: a line across the upper left, rising slightly to the right, clearly shorter than the right hand's line, a little over half as long
      part: the left hand's fingers
    - where: a long sweep from the top centre down and out to the bottom left, crossing the line across
      part: the left arm and sleeve
    - where: a stroke from the middle of the sweep across to the right, then turning down to the left, clearly longer than the line across the upper left
      part: the right hand's back and wrist
    - where: a stroke below it, down to the right and then across to the right
      part: the right hand's fingers, clasping

夫:
  object: a grown man standing facing you, arms stretched wide, a hairpin through his hair
  history: >-
    The oldest forms drew a person with arms stretched out and a pin through the hair, a man come of age.
  layout: >-
    A grown man fills the square, facing you, arms out wide, legs apart, with a friendly face, a
    topknot and simple pale clothes. A pale pin passes across the topknot above his head.
  exact:
    - The hairpin is a short line across the head, clearly shorter than the arms line, a little over half as long, and crosses the neck.
    - The arms line is the long line across the middle, crossing the body.
    - The body is the longest stroke and sweeps from the top centre down to the bottom left.
    - The right leg starts where the arms line crosses the body.
  strokes:
    - where: a short line across the upper part, rising slightly to the right, clearly shorter than the arms line, a little over half as long
      part: the hairpin through his hair
    - where: a long line across the middle, from near the left edge to near the right edge
      part: both arms, stretched out to the sides
    - where: a long sweep from the top centre, straight down through the centre, then curving out to the bottom left
      part: the neck and body, running down into the left leg
    - where: a long sweep from the centre down and out to the bottom right
      part: the right leg

队:
  object: a group of people gathered beside a hill
  history: >-
    The oldest forms drew people gathered at a hill. The modern form shows the hill and the people.
  layout: >-
    A pale green hill fills the left, its crest a small mound. On the right a group of people stand
    gathered, a big front figure and smaller ones behind it, each with a friendly face and simple pale
    clothes. The front figure is formed by the strokes on the right.
  exact:
    - The hill's top stroke is short, runs across and turns down, and ends in a small hook to the left; it joins the top of the hill's vertical.
    - The hill's vertical is a straight line with no hook at its end, and is the shorter of the two long verticals.
    - The front figure's sweep is the longest stroke; its second stroke is short and touches it at its middle.
    - The hill and the figure do not touch.
  strokes:
    - where: a stroke across the upper left, rising slightly, turning down at its right end and ending in a small hook to the left
      part: the hill's crest and its slope
    - where: a straight line down the left side
      part: the hill's steep face
    - where: a long sweep from the upper middle down and out to the bottom left
      part: the front person's body, running into the left leg
    - where: a stroke from the middle of the sweep, down to the right
      part: the front person's right leg

片:
  object: half of a tree trunk split lengthwise
  history: >-
    The oldest forms drew half of a tree trunk, split in two. It is the left half or right half of the
    old tree sign.
  layout: >-
    A tall half-trunk of pale wood, flat face to the left, rough bark edge to the right, fills the
    square. Rings of the wood show on its face, and a short twig stub sticks up at the top.
  exact:
    - The flat face is a long sweep down to the bottom left and is the longest stroke on the left.
    - The two lines across both start on the flat face, at its middle.
    - The upper line across is short, about half as long as the lower one.
    - The twig stub is a short vertical at the top and its end touches the upper line across.
    - The lower line turns down at the right and ends at the foot of the trunk.
  strokes:
    - where: a long sweep from the top left down to the bottom left
      part: the trunk's flat cut face
    - where: a short stroke at the top centre, slanting a little to the right and then straight down
      part: the twig stub at the top
    - where: a short line across the upper middle, rising slightly to the right, from the flat face
      part: the trunk's upper ring
    - where: a longer line across the lower middle, rising slightly to the right, from the flat face, then turning down
      part: the trunk's bark edge and its foot

支:
  object: a hand holding a branch for support
  history: >-
    The oldest forms drew a hand holding a branch.
  layout: >-
    A pale branch with a crossing twig rises at the top, held by a pale hand below it. The hand
    clasps the branch's lower end and its fingers spread to the right. Colours are pale.
  exact:
    - The twig is a short line across the branch, crossing it at the middle, shorter than the branch's length.
    - The twig is clearly shorter than the hand's long line across, less than half as long.
    - The branch is a straight vertical, ending on the hand's first stroke with no hook.
    - The hand's first stroke is long, across to the right and then down to the left; its second stroke crosses it.
  strokes:
    - where: a short line across the upper part, rising slightly to the right, less than half as long as the hand's line below
      part: the twig
    - where: a vertical line down the middle of the upper half, slanting a little to the right and then straight down
      part: the branch
    - where: a stroke, more than twice as long as the twig, from the left of the middle across to the right, then turning down and out to the left
      part: the hand's back and wrist, holding the branch
    - where: a stroke below it, down to the right and then across to the right
      part: the hand's fingers

王:
  object: a tall person standing as a bridge between the sky above and the earth below, arms stretched out
  history: >-
    The oldest forms drew a person joining heaven and earth, the king. The three bars with one
    vertical are what remains.
  layout: >-
    A tall person with a friendly face and simple pale robes stands at the centre, the head just above
    the top bar. The top bar is a line of the sky, the middle bar the person's arms, the bottom bar the
    line of the earth. Pale blue sky, pale green earth.
  exact:
    - The three bars are equally spaced from top to bottom, and the vertical runs from the top bar to the bottom bar.
    - The vertical starts on the top bar and stops on the bottom bar; it does not go above the top bar or below the bottom bar.
    - The bottom bar is the longest, the top bar is a little over half as long as the bottom one, and the middle bar is the shortest, about half as long as the bottom one.
    - There is no dot anywhere.
  strokes:
    - where: a line across the top, a little over half the width of the bottom bar
      part: the sky overhead
    - where: a line across the middle, the shortest line, crossing the vertical
      part: the person's arms, stretched out
    - where: a straight line down the middle, from the top bar to the bottom bar
      part: the person's body, standing between heaven and earth
    - where: a long line across the bottom, the longest line
      part: the earth under his feet

太:
  object: a giant man, with a small normal-sized man standing beside his leg for scale
  history: >-
    The oldest forms drew a giant 大 with a small dot of a man beside him. The dot is a person for scale.
  layout: >-
    A giant man fills the square, facing you, arms stretched wide, legs apart, with a friendly face and
    simple pale clothes. Beneath his body, between his legs and at the left, stands a tiny normal-sized
    man, also with a face and simple pale clothes, only as tall as the giant's knee.
  exact:
    - The giant's arms line is long, nearly the whole width, and crosses his body.
    - The giant's right leg starts on his body just below the arms line and does not touch the arms line.
    - The small man is a short slanting dot-like stroke, about a fifth as long as the right leg, and touches the giant's body.
  strokes:
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the giant's arms, stretched out to the sides
    - where: a long sweep from the top centre, straight down through the centre, then curving out to the bottom left
      part: the giant's neck and body, running down into the left leg
    - where: a long sweep from the centre of the body just below the arms down and out to the bottom right
      part: the giant's right leg
    - where: a short dot-like stroke at the lower left of the body, slanting down to the right
      part: the small man standing for scale
