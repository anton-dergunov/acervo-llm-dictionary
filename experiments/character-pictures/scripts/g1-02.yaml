# Full run, group g1, batch 02. Written from the fact sheets, following scripts/GUIDE.md.

見:
  object: a standing man whose head is one large eye, the eye emphasized above his legs
  history: >-
    The oldest forms drew a person with a huge eye in place of the head. The modern form stacks an
    upright eye over the two legs of a person.
  layout: >-
    A large upright almond-shaped eye fills the upper half and is the man's head; its lids follow the
    frame strokes, and the iris is a soft pale blue or brown shape between the two inner lines, with a
    mid-grey pupil. Below it the man's body is short and he stands on two legs, the left leg short and
    the right leg long and reaching out to the right. He wears a simple pale tunic and trousers.
  exact:
    - The two inner lines of the eye touch the left side and stop short of the right side.
    - The eye's top and right side are one stroke, turning down at the top right; its bottom line closes the frame and touches the right side.
    - The eye's bottom line and the left side meet at the bottom left corner.
    - The left leg is a short sweep that does not touch the eye; the right leg is much longer, about twice as long, and starts from the middle of the eye's bottom line.
    - The right leg runs down, then across to the right, and ends in a small hook turning up.
  strokes:
    - where: a line down the left side of the eye, from the top to the bottom
      part: the eye's left lid
    - where: a line across the top of the eye, turning down at the top right to run down the right side
      part: the eye's top corner and its right lid
    - where: a short line across the upper middle of the eye, from the left side
      part: the upper edge of the iris
    - where: a short line across the lower middle of the eye, from the left side, about as long as the upper one
      part: the lower edge of the iris
    - where: a line across the bottom of the eye, a little longer than the inner two, closing the frame
      part: the eye's bottom corner, where the lids meet, and the man's shoulders
    - where: a short sweep from just below the eye's bottom line down and out to the bottom left
      part: the man's left leg
    - where: a long stroke from the middle of the eye's bottom line down, then across to the right, ending in a small hook turning up
      part: the man's right leg, with its foot turned up

见:
  object: a standing man whose head is one large eye, the eye emphasized above his legs
  history: >-
    The oldest forms drew a person with a huge eye in place of the head. The modern form stacks an
    upright eye over the two legs of a person.
  layout: >-
    A large upright eye sits at the top and is the man's head; the frame of its lids is open at the
    bottom, and the iris is a soft pale blue or brown shape inside it with a mid-grey pupil. The man's
    body begins inside the eye's frame and runs down into a long left leg and a long right leg that
    reaches out to the right. He wears a simple pale tunic and trousers.
  exact:
    - The eye's frame is open at the bottom; its left side and its top-and-right side are two separate strokes that touch at the top left.
    - The left leg stroke starts inside the frame, near its top, and does not touch the frame's left side.
    - The right leg starts at the middle of the left leg without quite touching it, runs down, then across to the right, and ends in a small hook turning up.
    - The two legs together are long, reaching from the middle of the eye to the bottom of the square.
  strokes:
    - where: a short line down the left side of the frame, from the top, slanting a little to the right
      part: the eye's left lid
    - where: a line across the top of the frame, turning down at the top right to run down the right side
      part: the eye's top corner and its right lid
    - where: a long sweep starting inside the frame near its top, down and out to the bottom left
      part: the man's body, running into his left leg
    - where: a stroke starting at the middle of the left leg, running down, then across to the right, ending in a small hook turning up
      part: the man's right leg, with its foot turned up

分:
  object: a knife cutting a piece in two so the halves part to the left and right
  history: >-
    The oldest forms drew two pieces parting above a knife, to divide.
  layout: >-
    A pale loaf-like lump sits at the top, split down its middle into a left half and a right half that
    lean apart. Below it a knife hangs blade-down with its spine and handle at the top and its sharp
    edge on the left. Colours are pale: the lump is cream, the knife handle light wood, the blade pale
    steel.
  exact:
    - The two top strokes spread apart and touch neither each other nor the knife.
    - The left top stroke is short and sweeps down to the left; the right top stroke is longer and ends in a turn across to the right.
    - The knife's top stroke runs across, turns down and ends in a small hook turning up to the left.
    - The knife's second stroke starts on the knife's top stroke at its start and sweeps down to the left; it is about as long as the left piece.
  strokes:
    - where: a short sweep at the upper left, from the middle of the upper left down and out to the left
      part: the left half of the split lump, falling away to the left
    - where: a stroke from the top centre sweeping down to the right, then turning across to the right
      part: the right half of the split lump, falling away to the right
    - where: a stroke across the left of the lower part, turning down on the right and ending in a small hook turning up to the left
      part: the knife's spine and handle, the hook its guard
    - where: a sweep from the start of the knife's top stroke down and out to the bottom left
      part: the knife's sharp edge

中:
  object: a straight stake driven through the centre of a square box, standing upright
  history: >-
    The oldest forms drew a flag-pole or arrow through the middle of a box. The line through the box
    is the centre.
  layout: >-
    A wide square wooden box, pale brown, is seen from the front, with one tall straight stake or pole
    piercing it from its top to beyond its bottom, exactly in the middle. The stake is pale, with a
    small pennant of pale red at the top, behind the strokes.
  exact:
    - The box is wider than it is tall, and the stake is much longer than the box is high.
    - The stake crosses the box's top and its bottom and is a straight vertical line ending in a plain point at each end, with no hook.
    - The box's top and right side are one stroke, ending in a small hook down to the left at the lower right where it meets the bottom line.
    - The left side is short, a little over a third as long as the stake, and it meets the start of the bottom line.
  strokes:
    - where: a short line down the left side of the box
      part: the box's left side
    - where: a line across the top of the box, turning down at the right and ending in a small hook to the left
      part: the box's lid and its right side
    - where: a line across the bottom of the box, rising slightly to the right
      part: the box's base
    - where: a long straight line down the middle, crossing the top and the bottom of the box
      part: the stake driven through the box

今:
  object: a wide-open mouth under a roof of lips, speaking words that fall out below
  history: >-
    The oldest forms drew an open mouth, shaped like a lid, with the things it talks about beneath it.
  layout: >-
    A large open mouth fills the top half, drawn as a tent of lips with a pink tongue inside, as if
    someone is speaking toward the viewer. Below it hang the things spoken of, as two small pale
    objects, a small dot-like thing and a small bent bundle, drawn behind and around the strokes.
  exact:
    - The two top strokes meet at the top as a roof; the left one is longer and sweeps down to the left, the right one is a little shorter and ends in a turn across to the right.
    - The small slanting stroke below does not touch the roof; it is very short, about a fifth as long as the roof's right stroke.
    - The lowest stroke runs across to the right and then turns down to the left, and touches nothing.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left
      part: the mouth's left lip, running down to the left
    - where: a stroke from the start of the first sweep, down to the right, then turning across to the right
      part: the mouth's right lip
    - where: a very short slanting stroke below the roof, in the middle, slanting down to the right
      part: the first small thing being spoken of
    - where: a stroke at the lower left, across to the right, then turning down to the left
      part: the second thing spoken of, a small bent bundle

开:
  object: two hands lifting the latch bar of a door
  history: >-
    The oldest forms drew a door with its bar, and two hands lifting the bar to open it.
  layout: >-
    A pale wooden door fills the square. Its short latch bar sits at the top centre. Two pale arms
    reach up from the bottom, the left arm slanting and the right arm straight, their hands lifting
    the bar. The door's crossbar runs across the middle.
  exact:
    - The latch bar at the top is short, a little under half the width of the crossbar, and rises slightly to the right.
    - The crossbar is the longest stroke, nearly the whole width.
    - The right arm starts at the middle of the latch bar and runs straight down, a plain vertical with no hook, crossing the crossbar.
    - The left arm starts below the latch bar and does not touch it; it crosses the crossbar and sweeps down to the left, about five sixths as long as the right arm.
  strokes:
    - where: a short line across the top, rising slightly to the right
      part: the door's latch bar
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the door's crossbar
    - where: a stroke from upper left of the middle, down, crossing the crossbar, and sweeping to the bottom left
      part: the left arm, with its hand lifting the bar
    - where: a straight line from the middle of the latch bar down, crossing the crossbar, to the bottom
      part: the right arm, reaching up to the bar

公:
  object: a private bundle being divided, its two halves parting above it
  history: >-
    The oldest forms drew a division 八 of something kept private 厶, a share handed out to all.
  layout: >-
    At the top, a pale loaf is divided into two halves that fall apart to left and right. Below, a
    small closed pouch, pale, holds what is private, and the division reaches out from it. The pouch
    is drawn with a soft rounded shape.
  exact:
    - The two top strokes are separate and touch neither each other nor the pouch.
    - The left top stroke is shorter and sweeps down to the left; the right top stroke is longer and ends in a turn across to the right.
    - The pouch's first stroke runs down and turns across, rising to the right; the second is a short stroke, a little over a third as long as the first, and the first stroke's end touches it in the middle.
  strokes:
    - where: a sweep at the upper left, from the middle of the left half down and out to the left
      part: the left half of the divided loaf
    - where: a stroke from the top centre sweeping down to the right, then turning across to the right
      part: the right half of the divided loaf
    - where: a stroke in the lower middle running down, then turning across and rising a little to the right
      part: the pouch's left side and its base
    - where: a short stroke slanting down to the right, meeting the end of the pouch's base
      part: the pouch's right side, closing it

内:
  object: a man stepping into a doorway
  history: >-
    The oldest forms drew a doorway and a person going into it. The modern form shows the doorway
    frame with the figure passing through it.
  layout: >-
    A pale open doorway fills the lower two thirds, a tall frame whose lintel is crossed by the man.
    The man leans forward into it with his friendly face, simple pale clothes and a long left leg
    reaching down to the left, a short stride to the right.
  exact:
    - The doorway's left post is a separate vertical that does not touch the man.
    - The doorway's lintel and right post are one stroke, turning down at the right and ending in a small hook up to the left.
    - The man's long sweep crosses the lintel near its left end, and it ends just short of the left post without touching it.
    - The man's second stroke is short, about a third as long as his first, and touches the first; it does not touch the doorway.
  strokes:
    - where: a straight line down the left side of the lower part
      part: the doorway's left post
    - where: a line across from the top of the left post, turning down at the right and ending in a small hook up to the left
      part: the doorway's lintel, its right post and the threshold
    - where: a long sweep from the top centre, crossing the lintel, down and out to the left
      part: the man's body, running down into his left leg
    - where: a short stroke from the middle of the man's sweep, down to the right
      part: the man's right leg, stepping in

