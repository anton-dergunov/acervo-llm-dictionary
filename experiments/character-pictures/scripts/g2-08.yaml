盾:
  checked: argon
  object: an upright eye peering out from behind a tall curved shield braced with a cross at the top
  history: >-
    In the oracle bone script, the character was a pictogram of a shield with a cross-shaped front.
    Later forms added an eye 目 beneath the shield's rim 厂 and cross 十, showing a defender's eye
    looking out from behind the shield.
  layout: >-
    A tall shield in pale warm wood and soft bronze tones fills the square, its curved top and left
    edge following the two outer sweeps and its upper face braced by the cross. Tucked beneath the
    cross in the lower right sits an upright almond-shaped eye peering out, with a soft pale brown
    iris and mid-grey pupil between the two inner lines.
  exact:
    - The top sweep runs from the top right down and left to touch the top of the long left sweep.
    - Beneath the top sweep sits a cross whose horizontal line is the widest across stroke, starting just inside the left sweep with a tiny gap, while its short vertical line starts below the top sweep with a small gap, crosses the horizontal line, and touches the top of the eye box below.
    - Below the cross sits the tall narrow rectangular frame of the eye, whose top horizontal leg is about half as long as the horizontal line of the cross above it.
    - Inside the eye frame, two short inner lines across touch the left vertical and stop clearly short of the right vertical, while a third line across the bottom joins the left and right verticals to close the frame.
  strokes:
    - where: a sweep across the top from right to left, slanting down toward the upper left
      part: the arched top rim of the shield
    - where: a long sweep from the left end of the top stroke down and out to the bottom left
      part: the long curved left rim of the shield
    - where: a long line across the upper middle, from just inside the left sweep out to the right
      part: the horizontal cross-brace on the shield
    - where: a short line down the upper centre, crossing the horizontal line and ending on top of the lower box
      part: the vertical post of the shield's cross-brace
    - where: a straight line down the left side of the lower half
      part: the peering eye's left lid
    - where: a line across from the top of the lower left vertical, turning down at the right and ending in a small hook at the bottom
      part: the peering eye's upper corner and right lid
    - where: a short line across the upper inside of the lower box, touching the left vertical
      part: the upper edge of the iris
    - where: a short line across the middle inside of the lower box, touching the left vertical
      part: the lower edge of the iris
    - where: a line across the bottom of the lower box, connecting the left and right sides
      part: the bottom corner of the peering eye

卓:
  checked: argon
  object: a child standing tall with arms spread wide and a small flag on a pole atop their head
  history: >-
    The oldest forms were an ideogrammic compound showing a child with a small flag on their head,
    signifying standing tall and lofty. In the modern form, the flag remains at the top while the
    child's head, outstretched arms, and body below have taken the shape of the character 早.
  layout: >-
    A standing child fills the frame from top to bottom, facing forward. At the top centre, a short
    vertical pole rises from the head with a pale pennant fluttering to the right. The box in the
    upper middle forms the child's capped head, with the inner line as the cap's brim and a friendly
    face with eyes, a nose, and a mouth in the lower half above the chin line. Below the head, a
    wide horizontal stroke forms the outstretched arms and a vertical stroke forms the upright body
    and legs dressed in a simple pale tunic.
  exact:
    - The upper vertical line stands at the top centre and its bottom touches the middle of the head box's top line.
    - The short top line across starts at the middle of the upper vertical line and extends only to the right, about a fifth as long as the wide lower line across.
    - The head box in the upper middle is less than half as wide as the wide lower line across, and its left and right sides slant slightly inward toward the bottom.
    - The inner line across inside the head box touches the left side and stops short of the right side, leaving a clear gap.
    - The bottom line of the head box joins the bottom of the left side to the bottom of the right side.
    - The lower vertical line starts at the middle of the head box's bottom line, crosses the wide lower line across at its middle, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a short vertical line down the top centre, ending on the top of the middle box
      part: the flagpole rising from the top of the child's head
    - where: a short line across from the middle of the top vertical to the right, rising slightly
      part: the top edge of the small flag fluttering to the right
    - where: a short line down the left side of the upper-middle box, slanting slightly inward
      part: the left side of the child's capped head
    - where: a line across the top of the upper-middle box, turning down to form its right side and about two fifths as wide as the long lower line across
      part: the crown and right side of the child's capped head
    - where: a short line across the middle of the box, starting on the left side and stopping short of the right side
      part: the brim of the cap across the child's brow
    - where: a short line across the bottom of the box, joining the left and right sides
      part: the child's chin
    - where: a very long line across the lower middle from the far left to the far right, rising slightly
      part: the child's arms stretched out wide
    - where: a long straight vertical line from the middle of the box's bottom down through the long horizontal line to the bottom centre
      part: the child's upright body and legs

罷:
  checked: argon
  object: a bear caught beneath a wide rectangular net, with its head and furry body on the lower left and two clawed paws on the lower right
  history: >-
    An ideogrammic compound combining a net 网 at the top with a bear 能 below: a bear trapped in a
    net after a chase, unable to go on, from which came the meaning to stop or cease. The top net
    was compressed into the wide four-part frame 罒.
  layout: >-
    Across the top sits the wide rectangular net frame with pale mesh cords inside. Below it fills
    the bear in pale brown fur, seen in profile facing right: on the upper left is its round head
    with an eye and snout and a small ear; below the head is its tall furry torso; on the right,
    stacked one above the other, are its two paws reaching out to the right with claws.
  exact:
    - The wide net frame at the top is closed on the bottom and divided inside by two short vertical strokes that touch both the top bar and the bottom bar.
    - The net at the top does not touch the bear below it.
    - On the upper left of the bear, the head stroke sweeps down to the left and turns sharply to rise to the right, its tip touching the middle of the short ear stroke slanting down to the right.
    - On the lower left, the tall narrow body has a left vertical and a top-and-right stroke ending in a bottom hook to the left; the two short inner dashes touch the left side and stop short of the right side.
    - On the right are two stacked paw shapes separated by a small gap, the lower one wider and longer than the upper one.
    - In each paw shape on the right, a short sweep slanting down to the left touches the middle of a stroke that goes down, curves across to the right, and ends in an upward hook.
  strokes:
    - where: a short line slanting down to the right at the left end of the top part
      part: the left side of the net's frame
    - where: a long line across the very top from the top of the left side, turning down to the left at the top right
      part: the top bar and right side of the net's frame
    - where: a short stroke inside the left part of the top frame, slanting down to the right
      part: a left inner cord of the net
    - where: a short stroke inside the right part of the top frame, slanting slightly down to the left
      part: a right inner cord of the net
    - where: a line across the bottom of the top frame, rising slightly to the right to close it
      part: the bottom rim of the net's frame
    - where: a stroke on the upper left below the net, sweeping down to the left and turning sharply to rise to the right
      part: the bear's head and snout
    - where: a short stroke at the right end of the head, slanting down to the right
      part: the bear's ear
    - where: a line down the left of the lower half
      part: the bear's back
    - where: a line across from the top of the back, turning straight down and ending in a small hook to the left at the bottom
      part: the top of the bear's body and its chest
    - where: a short dash across inside the upper part of the body, rising slightly to the right
      part: an upper band of fur on the body
    - where: a short dash across inside the lower part of the body, rising slightly to the right
      part: a lower band of fur on the body
    - where: a short sweep on the upper right below the net, slanting down to the left
      part: the upper paw's claws
    - where: a stroke on the upper right below the net, going down and curving across to the right to end in an upward hook
      part: the bear's upper paw
    - where: a short sweep in the lower right half, slanting down to the left
      part: the lower paw's claws
    - where: a longer stroke in the lower right half, going down and curving wide across to the right to end in an upward hook
      part: the bear's lower paw

