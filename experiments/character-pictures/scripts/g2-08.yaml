    - The two side strokes in the lower half slant outward on either side of the central vertical and stand completely free of every other stroke.
    - The lower-left slanting sweep is about half as long as the main downward sweep above it, and the upper-right short stroke is about three quarters as long as the lower-right slanting stroke below it.
  strokes:
