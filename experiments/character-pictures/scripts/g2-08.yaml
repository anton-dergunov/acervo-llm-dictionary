    framed shape of the sun with a bar of light at its centre.
  layout: >-
    Three suns fill the square in a triangular arrangement: one sun sits centred in the upper half,
    and two sit side by side in the lower half. Each sun's rectangular frame is filled with a soft,
    pale warm yellow and golden glow, surrounded by a faint, pale halo of light behind the strokes.
    The lower-left sun is slightly narrower than the others, and the lower-right sun is slightly
    taller and wider than the lower-left one.
  exact:
    - The three suns are completely separate and do not touch one another.
    - The top sun sits centred above the gap between the two lower suns; the lower-right sun is wider and slightly taller than the lower-left sun.
    - In every sun, the top-and-right stroke starts at the top of the left vertical, runs across rising slightly to the right, and turns sharply down to form the right side.
    - In every sun, the middle inner line touches the middle of the left vertical and stops short of the right side, leaving a small gap.
    - In every sun, the bottom line connects the bottom of the left vertical to the bottom of the right vertical, closing the frame.
  strokes:
