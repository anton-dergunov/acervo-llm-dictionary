牧:
  checked: argon
  object: an ox's head seen from the front on the left, and a hand holding a herding whip on the right
  history: >-
    An ideogrammic compound combining an ox 牛 on the left with a hand holding a whip or stick 攴
    (written 攵) on the right: tending and herding cattle.
  layout: >-
    The ox's head fills the narrower, taller left half, seen from the front with pale brown fur,
    eyes and a soft muzzle around its strokes. The herder's hand, sleeve and whip fill the wider
    right half, reaching in from the lower right with the whip held up beside the ox. The two sides
    sit close together without touching, and all colours stay pale and soft.
  exact:
    - The left part (the ox's head) and the right part (the hand with the whip) do not touch each other; small gaps separate their strokes in the centre.
    - The left part is narrower and taller; the right part is wider and slightly shorter.
    - In the left part, the upper line across starts at the middle of the short upper-left sweep and crosses the long vertical line.
    - The long vertical line on the left is straight and ends in a plain point at the bottom, with no hook.
    - The lower stroke on the left is a rising stroke slanting up to the right across the middle of the long vertical.
    - In the right part, the line across starts at the middle of the upper sweep and rises slightly to the right; it is slightly longer than the upper line across on the left.
    - In the right part, the lower sweep starts at the middle of the line across and curves down to the bottom centre; the falling stroke starts below the upper sweep without touching it, crosses the middle of the lower sweep, and extends to the bottom right.
  strokes:
    - where: a short sweep at the upper left, slanting down to the left
      part: the ox's left horn
    - where: a line across the upper part of the left half, starting from the middle of the first sweep and rising slightly to the right
      part: the top of the ox's head, the brow between the horns
    - where: a long straight line down the left half, from near the top to near the bottom, crossing the brow line
      part: the ox's right horn at its top, then the long face down to the muzzle
    - where: a rising stroke across the lower part of the left half, slanting up to the right and crossing the long vertical
      part: the ox's ears, held out to both sides
    - where: a sweep in the upper right half, from near the top centre down to the left
      part: the herding whip's handle, held aloft
    - where: a line across the upper right half, starting from the middle of the upper sweep and rising slightly to the right
      part: the whip's lash, extending to the right
    - where: a long sweep from the middle of the right line across, curving down to the bottom centre
      part: the lower curve of the herder's hand and sleeve
    - where: a long falling stroke from the centre down and out to the bottom right, crossing the lower sweep
      part: the herder's forearm, reaching in from the bottom right to hold the whip

兽:
  checked: argon
  object: a forked hunting weapon with two top prongs, a latticed head and a wide crossbar, set above an open mouth
  history: >-
    The traditional form 獸 combined a forked hunting weapon 單 and a dog 犬 to mean hunting and wild
    game, with a mouth 口 added later. The simplified form dropped the dog and kept the left side:
    the two-pronged hunting weapon above the mouth.
  layout: >-
    The upper half holds the head of a forked wooden hunting weapon standing upright: two short
    prongs rise at the top above a square latticed frame bound with pale tan cord, with a wide
    wooden crossbar running horizontally below it. Beneath the crossbar sits an open mouth in soft
    pale rose. All colours stay pale and warm behind the strokes.
  exact:
    - The two short prong strokes at the top—a dot slanting down to the right on the left, and a sweep slanting down to the left on the right—stand free above the upper box and do not touch each other.
    - The upper box sits centred in the top half; its top and right side are one stroke turning down at the top right corner, and its bottom line closes the box from the bottom of the left side to the bottom of the right side.
    - Inside the upper box, the central vertical line runs from the middle of the top bar to the middle of the bottom bar and crosses the inner horizontal line, which stops short of both the left and right outer sides.
    - The long horizontal line across the middle is by far the widest stroke, nearly twice as wide as the upper and lower boxes, and stands completely free between them.
    - The lower mouth box sits centred beneath the long middle line; its top and right side are one stroke turning down at the top right corner, and its bottom line starts on the left vertical slightly above its lower tip and closes the bottom of the right side.
  strokes:
    - where: a short dot-like stroke at the top left, slanting down to the right
      part: the hunting weapon's left prong
    - where: a short sweep at the top right, starting slightly higher and slanting down to the left
      part: the hunting weapon's right prong
    - where: a vertical line down the left side of the upper box, slanting slightly inward
      part: the left side of the weapon's latticed head
    - where: a line across the top of the upper box, turning sharply down at the top right corner to form the right side
      part: the top rim and right side of the weapon's latticed head
    - where: a short line across the middle of the upper box, rising slightly to the right
      part: the horizontal cross-lashing inside the weapon's head
    - where: a vertical line down the middle of the upper box, from the top bar to the bottom bar
      part: the central vertical strut inside the weapon's head
    - where: a line across the bottom of the upper box, joining the left and right sides
      part: the bottom rim of the weapon's latticed head
    - where: a very long line all the way across the middle, from the far left to the far right
      part: the wide crossbar below the weapon's head
    - where: a vertical line down the left side of the lower box, slanting slightly inward
      part: the left side of the open mouth
    - where: a line across the top of the lower box, turning down at the top right corner to form the right side
      part: the upper lip and right side of the mouth
    - where: a line across the bottom of the lower box, closing the mouth from left to right
      part: the lower lip closing the mouth

孕:
  checked: argon
  object: a pregnant woman with a rounded belly enclosing her child
  history: >-
    The oldest forms drew a side view of a woman with a child inside her swollen belly. In the
    modern character the woman's upper body and belly became the top part 乃, curving around the
    child 子 below.
  layout: >-
    The pregnant mother fills the upper half facing right, her head rising just above the top
    stroke, her back along the left sweep and her rounded belly curving out on the right around the
    child. The child fills the middle and lower half, its head tucked inside the curve of the
    mother's belly and its arms stretched wide across the lower part. Both mother and child have
    gentle faces with eyes, a nose and a mouth, and wear simple pale clothes.
  exact:
    - The top stroke runs across to the right, turns sharply down to the left, turns across to the right again, and curves down to end in a hook to the left.
    - The left sweep starts under the left end of the top stroke and curves down to the middle left.
    - The child's head stroke starts on the middle of the left sweep, runs across and turns down to the left to the centre, with the hooked bottom of the upper right curve touching its turn.
    - The upper right hooked curve stops short of the long lower line across, leaving a clear gap between them.
    - The lower vertical curves down from the bottom end of the child's head stroke, ends at the bottom in a hook up to the left, and is crossed at its middle by the long line across.
    - The lower line across is the widest stroke; the top horizontal leg is a little under half as long, and the child's head horizontal leg is shorter still, just over a quarter as long.
  strokes:
    - where: a line across the top, turning down to the left, then turning across to the right and curving down on the right side to end in a hook to the left
      part: the mother's shoulder and chest, curving out around her rounded pregnant belly
    - where: a sweep from near the left end of the top stroke down and out to the middle left
      part: the mother's back
    - where: a short line across the middle from the left sweep, turning back down to the left to end at the centre
      part: the child's head, tucked inside the mother's belly
    - where: a curved line down the centre from the bottom of the head stroke, bowing slightly right and ending at the bottom in a hook up to the left
      part: the child's body, the hook its bundled feet
    - where: a long line across the lower half, from near the left edge to near the right edge
      part: the child's arms, stretched out wide

圳:
  checked: argon
  object: a mound of earth on the left beside a stream flowing down between its two banks on the right, forming a drainage ditch cut in the soil
  history: >-
    An ideographic compound combining earth (土) on the left and a flowing stream (川) on the right to
    depict a furrow or drainage ditch cut through the ground by running water.
  layout: >-
    The scene pairs a raised bank of earth on the left with a stream channel flowing down on the
    right. The earth part on the left is narrower and shorter, sitting in the upper and middle left
    with pale ochre soil behind its strokes. The stream part on the right is wider and taller,
    filling the right side from top to bottom with pale blue water between its banks.
  exact:
    - The earth component on the left is narrower and shorter than the stream component on the right.
    - In the left part, the upper line across and the vertical cross at their middles, and the bottom of the vertical touches the middle of the lower rising stroke.
    - The lower rising stroke on the left stops just short of the stream's left stroke, leaving a small gap between the two components.
    - All three vertical strokes of the stream on the right stand completely free of one another and do not touch any other stroke.
    - In the stream on the right, the left stroke curves out to the bottom left, the middle vertical is straight and clearly shorter—a little over half as long as the rightmost vertical—and the rightmost vertical runs straight from near the top to near the bottom with no hook.
  strokes:
    - where: a short line across the middle of the left part, rising slightly to the right
      part: the broad middle of the mound of earth
    - where: a vertical line down the centre of the left part, crossing the upper line across and ending on the lower rising stroke
      part: the upright core of the mound of earth, from top to base
    - where: a stroke across the bottom of the left part, rising sharply to the right
      part: the sloped ground beneath the mound of earth
    - where: a long line down the left side of the right part, curving out to the bottom left
      part: the stream's left bank, bending away at the bottom
    - where: a straight vertical line down the middle of the right part, clearly shorter and a little over half as long as the rightmost vertical
      part: the current of water flowing down the middle of the stream
    - where: a long straight vertical line down the far right side, from near the top to near the bottom, with no hook
      part: the stream's tall right bank

