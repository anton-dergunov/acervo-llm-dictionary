罢:
  checked: argon
  object: a tired bear caught beneath a rectangular hunting net, unable to get away
  history: >-
    The traditional form 罷 is an ideogrammic compound of a net (网, written 罒 at the top) over a bear
    (能), depicting a bear caught in a net once exhausted from a chase. The simplified form replaces
    the bear at the bottom with 去 ("to leave"), suggesting being stuck under a net and unable to
    leave.
  layout: >-
    A wide rectangular hunting net fills the top third of the square, with pale tan mesh behind the
    strokes of its frame. Directly beneath the net, a pale brown bear crouches facing the viewer
    with a tired face—small round ears, eyes, a snout and a mouth—around the top of the central
    vertical stroke. Its outstretched front arms follow the shorter upper line across, a long wooden
    snare bar runs wide across its middle along the long horizontal stroke, and its crouched hind
    legs follow the angled strokes at the bottom.
  exact:
    - The net at the top is a closed four-sided frame divided into three sections by two short inner vertical strokes that touch both the top and bottom bars.
    - In the lower part, the upper line across is half as long as the wide lower line across.
    - The central vertical stroke below the net touches the middle of the net's bottom bar, crosses the shorter upper line across, and stops on the wide lower line across without crossing it.
    - Below the wide line across, a stroke starts at the middle of that line, sweeps down to the left, and turns sharply across to the right to touch the middle of the final short stroke slanting down on the bottom right.
    - Every stroke ends plainly, with no hooks anywhere in the character.
  strokes:
    - where: a short stroke at the top left, slanting slightly down to the right
      part: the left side of the net's frame
    - where: a line across the top, turning sharply down at the top right to form the right side
      part: the top bar and right side of the net's frame
    - where: a short line down inside the left part of the top frame
      part: the left inner cord of the net
    - where: a short line down inside the right part of the top frame, slanting slightly to the left
      part: the right inner cord of the net
    - where: a line across the bottom of the top frame, rising slightly to the right to close it
      part: the bottom bar of the net's frame
    - where: a line across the upper middle, half as long as the wide line below it
      part: the bear's outstretched front arms
    - where: a vertical line from the bottom of the net down to the middle of the wide line across, crossing the shorter line across
      part: the bear's head and upper body pinned under the net
    - where: a long line across the middle of the character, stretching almost from side to side
      part: a long wooden snare bar holding the bear down
    - where: a stroke from the middle of the long line across, sweeping down to the lower left and turning sharply across to the lower right
      part: the bear's bent left hind leg and foot
    - where: a short stroke at the bottom right, slanting down to the right across the end of the previous stroke
      part: the bear's right hind leg braced on the ground

頒:
  checked: argon
  dropped: Because 分 serves only as the phonetic component and the character has no pictographic or ideographic reading in the scholarship, drawing a scene from its parts would teach a false etymology.

畑:
  checked: argon
  object: a fire burning on the left beside a dry field divided into four plots on the right
  history: >-
    An ideogrammic compound coined in Japan and borrowed into Chinese, combining fire 火 on the left
    with a field 田 on the right to depict dry upland farmland cleared by burning brush, in contrast
    to a flooded rice paddy.
  layout: >-
    A tall, narrow fire fills the left half, its big flame coloured pale orange and soft yellow with
    small sparks on either side. In the lower right half lies a wider square dry field seen from
    above, divided by raised earthen banks into four plots of pale warm-brown soil. The fire reaches
    much higher than the field, while both reach down to the same level at the bottom.
  exact:
    - The fire on the left is narrower and much taller than the field on the right, and the two components do not touch.
    - In the fire on the left, the leftmost short downward stroke stands free, while both the upper right short sweep and the lower right short slanting stroke touch the long central sweep.
    - The fire's lower right stroke is shortened into a brief slanting dot that stops well clear of the field's left edge.
    - In the field on the right, the top edge and right edge are one stroke that turns sharply down at the top right corner.
    - The field's inner vertical line touches both the top edge and the bottom edge, crossing the inner horizontal line in the middle.
    - The field's inner horizontal line stops slightly short of the left wall and the right wall.
  strokes:
    - where: a short downward stroke on the middle left, standing free to the left of the tall sweep
      part: a small spark leaping off to the left of the fire
    - where: a short stroke in the upper part of the left half, sweeping down to the left to touch the tall sweep
      part: a small flame or spark on the upper right of the fire
    - where: a long stroke in the left half running down from near the top and sweeping out to the bottom left
      part: the main body and left edge of the big flame, from its tip to its base
    - where: a short stroke slanting down to the right from the lower middle of the tall flame stroke
      part: the right base of the flame, tucked in short beside the field
    - where: a line near the middle running down and slanting slightly to the right
      part: the raised bank along the left edge of the dry field
    - where: a line across the middle of the right half, turning down at the right to run to the bottom right
      part: the raised banks along the top and right edges of the dry field
    - where: a short line across the middle of the field in the right half, rising slightly to the right
      part: the inner bank dividing the upper plots of the field from the lower plots
    - where: a straight line down the middle of the field, from the top edge to the bottom edge
      part: the inner bank dividing the left plots of the field from the right plots
    - where: a line across the bottom of the field in the right half, rising slightly to the right
      part: the raised bank along the bottom edge of the dry field

凭:
  checked: argon
  object: a person on the upper left and a wooden rest stand on the upper right (任), set above a small low table (几) for leaning on
  history: >-
    An ideogrammic compound combining 任 (to rely on or bear, made of a person 亻 and a post frame 壬)
    above 几 (a small low table or armrest stool), showing someone leaning on a low table to rest.
  layout: >-
    The scene is stacked in two halves. In the upper half, a person in profile on the left faces
    right with a friendly face (eyes, nose and mouth) and simple pale clothes, leaning toward a pale
    wooden rest stand on the upper right. In the lower half, a small low wooden table sits beneath
    them with a curved left leg and a hooked right foot. All fills are pale wood and soft cloth
    tones.
  exact:
    - The upper half (the person and stand) and the lower half (the low table) do not touch each other.
    - In the upper left, the straight vertical starts at the middle of the slanting sweep and ends in a plain point with no hook.
    - The upper-left person and the upper-right stand do not touch; a small gap separates the left vertical from the long middle crossbar.
    - At the top of the upper-right stand, the top stroke is a short sweep slanting down from right to left.
    - The central vertical of the upper-right stand starts at the middle of the top sweep, crosses the middle line across, and ends cleanly on the middle of the lower line across without sticking out below.
    - In the upper-right stand, the middle line across is the widest stroke, while the bottom line across is about three quarters as long.
    - In the lower table, the right stroke starts at the top of the left leg sweep, runs a short way across, turns down, curves out to the bottom right, and ends in an upward hook.
  strokes:
    - where: a sweep in the upper left from near the top down and out to the middle left
      part: the leaning person's head and tilted shoulder
    - where: a straight line down the upper left, starting at the middle of the upper-left sweep
      part: the person's standing body and legs
    - where: a short sweep in the top right, slanting from right to left and slightly down
      part: the tilted top bar of the wooden rest stand
    - where: a long line across the upper right, below the top sweep
      part: the wide middle crossbar of the wooden rest stand
    - where: a short vertical line down the centre of the upper-right part, from the top sweep through the middle crossbar to the lower bar
      part: the central upright post of the wooden rest stand
    - where: a line across the bottom of the upper-right part, about three quarters as long as the crossbar above it
      part: the flat base bar of the wooden rest stand
    - where: a sweep from just below the centre down and out to the bottom left
      part: the low table's left leg
    - where: a long stroke starting at the top of the left leg, running across to the right, turning down and curving across the bottom right to end in an upward hook
      part: the low table's top, then its right leg and upturned foot

尺:
  checked: argon
  object: a standing person in profile, striding to measure a foot's length along the leg
  history: >-
    Early forms drew a person in profile (now written as the upper body 尸) with a curved mark on the
    lower leg to show the standard ten-cun length of a foot, or a person pacing out a measure.
  layout: >-
    A person stands facing right and fills the square. The closed upper box forms the torso dressed
    in a simple pale tunic, with a small head showing eyes, a nose and a mouth sitting just above
    the top left corner, and pale arms at the side. Below the waist, the two long sweeps form the
    left and right legs striding wide apart.
  exact:
    - The top stroke starts where the long left sweep begins, runs across to the right, and turns sharply down and slightly left.
    - The lower line across is about as long as the top line across; it starts at the middle of the long left sweep and rises slightly to the right to meet the bottom end of the top stroke, closing the upper box.
    - The long left stroke runs straight down the left side of the upper box before sweeping out to the bottom left.
    - The long right falling stroke starts at the middle of the long left sweep, right where the lower line across begins, and sweeps down and out to the bottom right.
  strokes:
    - where: a line across from the top left to the right, turning sharply down and slightly left
      part: the shoulder and front of the person's tunic over the chest
    - where: a line across the middle, rising slightly to the right to close the upper box
      part: the belt and lower hem of the tunic at the waist
    - where: a long line from the top left straight down, then sweeping out to the bottom left
      part: the person's back running down into the left leg
    - where: a long falling stroke from the middle of the left sweep down and out to the bottom right
      part: the person's outstretched right leg, marking the measured length

