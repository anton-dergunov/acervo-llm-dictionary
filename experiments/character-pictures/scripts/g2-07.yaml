  history: >-
    In oracle bone script the character was drawn with two vertical lines joined by a crossbar.
    Traditional explanations read it as a flat wooden dish or everyday serving tray, and the modern
    form shapes it like a small low table with a short mark inside.
  layout: >-
    A low flat-topped serving tray or dish fills the frame, seen from the front. The top of the
    stroke frame forms the flat dish surface, curving down on the left and right into the two legs
    of the stand, with the short inner stroke forming a wooden support peg jutting from the middle
    of the left leg. The tray is shaded in pale warm wood tones behind the strokes.
  exact:
    - The top-and-right stroke starts at the top of the left sweep, runs across and slightly up to the right, turns down, and ends at the bottom right in a broad curve that hooks upward.
    - The short dot in the middle starts directly on the middle of the left sweep and slants down to the right.
    - The short dot stops well short of the right leg, leaving a clear gap between them.
  strokes:
