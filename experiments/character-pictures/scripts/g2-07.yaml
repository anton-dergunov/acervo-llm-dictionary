乃:
  checked: argon
  object: a woman seen in profile facing right, with a protruding chest and rounded belly
  history: >-
    Scholars such as Chen Duxiu and Guo Moruo read the oldest form as a side view of a woman with a
    protruding chest, the original form of 奶, also seen as the pregnant figure in 孕. In the modern
    two-stroke form, the stepped stroke on the right traces the front profile and the sweep on the
    left forms the back.
  layout: >-
    A woman stands in profile facing right, filling the frame from top to bottom. Her head sits just
    above the top bar, with a clear face showing an eye, nose and mouth, and she wears a simple pale
    robe. The stepped, hooked stroke on the right traces her front contour from chest to waist,
    belly and foot, while the sweep on the left forms her back and trailing robe.
  exact:
    - The first stroke starts near the top left, runs across and slightly up to the top right, turns sharply down and left to the middle, turns right again, and curves down to end in an upward hook at the bottom centre.
    - The second stroke starts on the top bar a little to the right of its left end, so the top bar juts out to the left past the junction.
    - The second stroke sweeps smoothly down and out to the bottom left, ending in a plain point with no hook.
  strokes:
    - where: a long stroke starting near the top left, running across to the top right, turning down and left to the middle, turning right again, and curving down to end in an upward hook at the bottom centre
      part: the woman's shoulder and protruding chest at the top right, dipping in at her waist and curving out around her rounded belly down to her foot at the bottom hook
    - where: a sweep starting on the top bar left of centre and curving down and out to the bottom left
      part: the back of the woman's body and robe sweeping down behind her

