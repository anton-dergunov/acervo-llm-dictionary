辯:
  checked: argon
  object: two upright marking knives flanking a speaking mouth and tongue in the middle, representing a sharp exchange of words
  history: >-
    Formed from speech 言 placed between a pair of 辛 marking knives (辡), representing two sides in
    sharp accusation and debate.
  layout: >-
    Three vertical parts stand side by side across the square without touching. On the left and
    right stand two upright marking knives in pale grey-blue and soft ochre; the left knife's lower
    shaft curves out to the bottom left while the taller, wider right knife's shaft runs straight
    down near the bottom. Tucked between them in the centre is a mouth in pale rose with its tongue
    sticking out above it.
  exact:
    - The left marking knife, the middle mouth and tongue, and the right marking knife stand side by side with clear gaps and do not touch each other.
    - The right knife component is wider and taller than the left one, reaching higher at the top and much lower at the bottom, while the middle mouth component is narrower and shorter than both.
    - In the left knife component, the main shaft starts at the middle of the wide horizontal bar, crosses the rising lower bar, and sweeps down and out to the bottom left.
    - In the right knife component, the main shaft starts at the middle of the wide horizontal bar, crosses the lower bar, and runs straight down to a plain point at the bottom with no hook.
    - In both the left and right knife components, the top tip dot and the left inner dot stand free, while the right inner stroke slants down to the left to touch the middle of the wide guard bar below it.
    - In both knife components, the upper bar is about two thirds to three quarters as long as the wide guard bar below it, and the lower grip bar across the shaft is slightly shorter than the wide guard bar.
    - In the middle component, the top dot and the three horizontal tongue bars stand free above the mouth, with the two lower fold bars about two thirds as long as the broad upper tongue bar; below them, the left vertical, the hooked top-and-right stroke, and the bottom bar join to close the small mouth box.
