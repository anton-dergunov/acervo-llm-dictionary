    to mark criminals. Together the doubled knives and speech represent two sides accusing and
    debating each other with sharp words.
  layout: >-
    Three parts stand side by side across the square without touching. On the left and right are two
    tall upright marking knives with wide cross-guards above and blades pointing down, the left
    blade curving down to the left and the right blade running straight down; the right knife is
    wider and taller than the left. Between them in the centre sits a small speaking mouth in
    profile with its tongue and a sharp spoken sound rising from it. All metal and mouth shapes are
    tinted in pale, soft steel-blue, warm grey, and pale rose behind the strokes.
  exact:
    - The three side-by-side parts—the left knife, the middle speech sign, and the right knife—do not touch one another.
    - The right part is wider and taller than the left part, reaching higher at the top and lower at the bottom.
    - In both the left and right parts, the top slanted dot stands free above the upper line across, and the left inner dot below the upper line stands free without touching the lines above or below it.
    - In the left part, the right inner downward stroke touches the middle of the wide middle line across at the bottom, while in the right part it touches both the upper line across and the wide middle line across.
    - In both outer parts, the wide middle line across is the longest horizontal, with a shorter upper line above it and a slightly shorter lower line across the blade below it.
    - The left part's long vertical starts at the middle of its wide line across, crosses the lower line across, and curves down to the bottom left, whereas the right part's long vertical runs straight down from its wide line across through its lower line to a plain point at the bottom right, with no hook.
