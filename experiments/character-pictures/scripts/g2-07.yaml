伏:
  checked: argon
  object: a person standing on the left with a friendly dog at their side on the right, the dog reared up on its hind legs with front paws out and one ear pricked up
  history: >-
    An ideogrammic compound combining a person 亻 on the left and a dog 犬 on the right: a dog
    crouching or attending at a person's side, or a person bowing low like a dog.
  layout: >-
    The person occupies the narrower left side and faces right toward the dog, with a clear face
    showing eyes, a nose and a mouth, and simple pale clothes. The dog fills the wider right side,
    standing on its hind legs with its front paws stretched out along the horizontal stroke, its
    head at the top of the long central sweep, and its pricked ear on the upper-right dot, painted
    in pale warm tan.
  exact:
    - The person on the left and the dog on the right do not touch each other; small gaps separate the person's vertical stroke from the left end of the dog's horizontal line and from the bottom tip of the dog's central sweep.
    - The person on the left is much narrower than the dog on the right.
    - In the person, the vertical stroke starts from the middle of the upper-left sweep and runs straight down to a plain point, with no hook.
    - In the dog, the long central sweep starts higher than the person, crosses the middle of the horizontal line, and curves down to the lower centre-left.
    - The dog's right-falling stroke starts on the long central sweep just below the crossing, leaving a slight gap below the horizontal line.
    - The short dot in the upper right stands free above the right half of the horizontal line.
  strokes:
    - where: a sweep in the left part from the top down and out to the middle left
      part: the person's inclined head, shoulder and back
    - where: a straight line down from the middle of the left sweep to the bottom left
      part: the person's body and standing legs
    - where: a line across the middle of the right part, rising slightly to the right
      part: the dog's front legs, stretched out to both sides
    - where: a long sweep from the top centre down through the line across, curving out toward the bottom left of the right part
      part: the dog's head and neck at the top, running down into its body and left hind leg
    - where: a falling stroke starting on the long sweep just below the crossing, sweeping down and out to the bottom right
      part: the dog's right hind leg
    - where: a short dot slanting down to the right in the upper right, above the line across
      part: the dog's pricked-up ear

哭:
  checked: argon
  object: two open mouths crying out loudly above a weeping person with a lock of long hair
  history: >-
    In oracle bone inscriptions, the character combined two mouths at the top, representing loud
    cries, with a person with long hair below. In later forms, the person with long hair took on the
    shape of the dog component, with the extra dot on the right remaining where the hair stood.
  layout: >-
    Two wide-open mouths sit side by side in the upper part, tinted pale pink inside, with the right
    mouth placed slightly higher than the left. Below them stands a weeping person seen from the
    front with arms and legs spread wide, wearing simple pale clothes and having a small head with
    tearful eyes, a nose and a mouth at the top of the central sweep. A pale lock of long hair flows
    out to the right around the free-standing dot beside the head.
  exact:
    - The two mouths at the top sit side by side without touching each other, and the right mouth sits slightly higher and is slightly wider than the left mouth.
    - Each mouth is formed by a left vertical slanting slightly inward, a top stroke that turns down to form the right side, and a bottom line across that closes the box.
    - The lower figure does not touch either of the two mouths above it.
    - The long sweep down to the bottom left starts just below the left mouth and crosses right through the middle of the lower line across.
    - The long falling stroke to the bottom right starts at the crossing of the central sweep and the lower line across.
    - The short slanting dot sits below the right mouth and above the right end of the lower line across, standing completely free of every other stroke.
  strokes:
    - where: a short line down the upper left, slanting slightly to the right
      part: the left corner of the left crying mouth
    - where: a line across the top of the upper left that rises slightly to the right and turns sharply down
      part: the upper lip and right corner of the left crying mouth
    - where: a short line across the bottom of the upper left box, rising slightly to the right
      part: the lower lip of the left crying mouth
    - where: a short line down near the top centre, slanting slightly to the right
      part: the left corner of the right crying mouth
    - where: a line across the top right that rises slightly to the right and turns sharply down
      part: the upper lip and right corner of the right crying mouth
    - where: a short line across the bottom of the upper right box, rising slightly to the right
      part: the lower lip of the right crying mouth
    - where: a long line across the middle of the box, rising slightly to the right
      part: the weeping person's outstretched arms
    - where: a long sweep starting below the left mouth, running down through the middle of the line across and curving out to the bottom left
      part: the weeping person's head and torso, continuing down into the left leg
    - where: a long falling stroke from the crossing in the centre down and out to the bottom right
      part: the weeping person's right leg
    - where: a short dot slanting down to the right in the space below the right mouth and above the right end of the long line across
      part: the lock of long hair beside the weeping person's head

嵐:
  checked: argon
  dropped: Because 風 is only an abbreviated phonetic component rather than an ideographic element, drawing wind blowing off a mountain would teach a false etymology.

癒:
  checked: argon
