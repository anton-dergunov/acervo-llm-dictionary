丢:
  checked: argon
  object: a person stepping away above a cave opening below, beneath a single mark at the top for leaving once and for all
  history: >-
    An ideogrammic compound of once (一) and to go away (去)—gone once and for all, and so lost or
    discarded. In 去, the upper part was a person (大, later written as 土) stepping away from a cave
    opening (口, later written as 厶) below; in the simplified form 丢, the top bar 一 slants down to
    the left as a sweep.
  layout: >-
    Across the top sits a single pale grey bar slanting down to the left. Below it in the upper
    middle stands a person seen from the front and facing forward, with a face (eyes, nose and
    mouth) and simple pale tunic, arms held out along the upper horizontal line and body along the
    central vertical above a wide pale tan ground line across the middle. Beneath the middle of the
    ground line sits a triangular cave opening in pale stone grey, bounded by the bent sweep on the
    left and bottom and the short falling stroke on the right.
  exact:
    - The top stroke is a sweep slanting down to the left, about half as wide as the long ground line across the middle.
    - The upper line across is clearly shorter than the long middle line across, a little over half as long, and rises slightly to the right.
    - The central vertical starts at the middle of the top sweep, crosses the upper line across, and ends on the long middle line without crossing through it.
    - The lower bent stroke starts at the middle of the long line across, sweeps down to the left, and turns sharply to run across to the right, rising slightly.
    - The horizontal leg of the lower bent stroke ends at the middle of the short falling stroke on the bottom right.
  strokes:
    - where: a sweep across the top, slanting from the upper right down to the upper left
      part: the single bar at the top marking once
    - where: a line across the upper middle, clearly shorter than the long middle line—a little over half as long—and rising slightly to the right
      part: the outstretched arms of the person going away
    - where: a vertical line down the upper middle, from the middle of the top sweep to the middle of the long line across
      part: the head and torso of the person
    - where: a long line across the middle from the far left to the far right, the longest stroke
      part: the wide ground line across the middle
    - where: a stroke starting at the middle of the long line across, sweeping down to the lower left and turning sharply to run across to the right
      part: the left wall and floor of the cave opening left behind below
    - where: a short falling stroke in the lower right, slanting down to the right across the end of the cord's horizontal leg
      part: the right wall of the cave opening on the bottom right

