  history: >-
    The oldest forms combined a spoon at the top with a mouth holding something sweet at the bottom,
    meaning delicious taste and later purpose or aim. In the modern form, the mouth with its morsel
    has taken the boxy shape of 日.
  layout: >-
    In the upper half, a wider, shallow spoon lies horizontally with its bowl on the left and its
    curved handle sweeping out to the right and turning up at the tip, washed in pale warm wood or
    soft silver tones. Below a small gap, a narrower, taller rectangular mouth opens with pale pink
    lips along the outer frame and a small pale golden sweet morsel resting on the middle line.
  exact:
    - The top part (the spoon) is wider and shorter than the bottom part (the mouth), and the two parts do not touch.
    - In the top part, the sweep from the upper centre slants down to the left and its end touches the vertical leg of the lower curved stroke without crossing it.
    - The spoon's main stroke runs down the upper left, curves smoothly into a long line across to the right, and turns sharply upward into a tall hook at the right end.
    - In the bottom box, the top and right side are one stroke that starts at the top of the left vertical, turns down at the top right, and ends in a hook to the left at the bottom right.
    - The middle line across the bottom box touches the left vertical and stops well short of the right side, about two thirds as long as the top of the box.
    - The bottom line across connects the lower end of the left vertical to the right vertical where its hook begins.
  strokes:
    - where: a sweep in the upper half from the top centre down and to the left, touching the left vertical leg
      part: the inner rim of the spoon's bowl
    - where: a stroke down the upper left that curves into a long line across to the right and turns sharply up at the tip
      part: the underside of the spoon's bowl and its long curved handle
    - where: a straight line down the left side of the lower half
      part: the left corner of the mouth
    - where: a line across the top of the lower half, turning down the right side and ending in a hook to the left
      part: the upper lip and the right corner of the mouth
    - where: a short line across the middle of the lower box, touching the left side and stopping short of the right
      part: a sweet morsel resting on the tongue inside the mouth
    - where: a line across the bottom of the lower box, joining the left side to the right side
      part: the lower lip closing the bottom of the mouth

