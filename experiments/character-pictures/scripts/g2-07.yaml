漁:
  checked: argon
  object: splashing river water on the left and a fish swimming upwards on the right, its head at the top and its tail fanning out at the bottom
  history: >-
    An ideogrammic compound combining river water 水 on the left with a fish 魚 on the right,
    depicting catching fish in a stream. The traditional form keeps the four separate tail strokes
    at the bottom of the fish.
  layout: >-
    The left quarter holds pale blue splashing water around the three strokes of the water side,
    which stand free of the fish. The right three quarters hold a fish seen from above or in profile
    swimming straight upwards, with its pointed head at the top, a squared scaly body in the middle,
    and a broad fanned tail at the bottom enclosing the row of bottom strokes. Colours are soft pale
    blues for the water and pale silvery-orange for the fish.
  exact:
    - The three water strokes on the left stand completely free of one another and of the fish on the right.
    - In the water side, the top two strokes slant down to the right while the bottom stroke is a longer rising stroke going up and to the right.
    - At the top of the fish, the second head stroke starts at the middle of the left sweep, runs across to the right, and turns sharply down to the left to touch the middle of the body's top line.
    - The fish's body is a closed four-sided frame whose left and right sides lean inward toward the bottom.
    - Inside the body, the upright backbone touches the middle of the top line and the middle of the bottom line, and crosses the short inner line across.
    - The short inner line across the middle of the body rises slightly to the right and stops short of both the left and right sides of the body.
    - Below the body sit four separate tail strokes standing free in a row, with the leftmost slanting down to the left and the other three slanting down to the right, the rightmost being the longest.
  strokes:
    - where: a short dot at the upper left, slanting down to the right
      part: an upper splash of river water
    - where: a short dot at the middle left, below and to the left of the upper dot, slanting down to the right
      part: a middle splash of river water
    - where: a longer rising stroke at the lower left, running from the bottom left up and to the right
      part: a surging wave of water rising on the left
    - where: a sweep at the top of the right part, from the top centre down and out to the left
      part: the fish's head, its left curve
    - where: a line across the top right, starting from the middle of the head curve and turning sharply down to the left
      part: the fish's head, its top and right side
    - where: a line down the left side of the fish's body, slanting slightly to the right
      part: the left side of the body
    - where: a line across the top of the body from the top of the left side, turning down at the right
      part: the body's top and right side
    - where: a short line across the middle of the body, rising slightly to the right, touching neither side
      part: the line of scales across the middle
    - where: an upright line down the middle of the body, from the top edge to the bottom edge
      part: the fish's backbone
    - where: a line across the bottom of the body, rising slightly to the right to meet the bottom of the right side
      part: the underside of the body
    - where: a short stroke below the left side of the body, slanting down to the left and standing free
      part: the outer left tail ray
    - where: a small dot below the body, left of the backbone, slanting down to the right and standing free
      part: the inner left tail ray
    - where: a short stroke below the body, right of the backbone, slanting down to the right and standing free
      part: the inner right tail ray
    - where: a longer stroke below the right side of the body, slanting down to the right and standing free
      part: the outer right tail ray
