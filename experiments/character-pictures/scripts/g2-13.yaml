    An ideogrammic compound combining a hand reaching down at the top with a kneeling woman at the
    bottom, depicting a hand gently calming and steadying her.
  layout: >-
    In the upper part, a pale open hand reaches downward, its back formed by the top sweep and its
    fingers by the three short strokes below it. In the wider lower part, a kneeling woman is seen
