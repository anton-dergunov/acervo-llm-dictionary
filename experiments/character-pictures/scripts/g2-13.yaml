奔:
  checked: argon
  object: a person with arms and legs flung wide at the top, running through tufts of grass below
  history: >-
    Originally an ideogrammic compound of a person and three feet below to show fast running steps.
    In the modern form the person at the top is written as 大 with outstretched arms and legs, and
    the three feet at the bottom merged into 卉, three cross-shaped tufts of grass.
  layout: >-
    The running person fills the upper half of the square, facing forward with a clear face (eyes,
    nose and mouth) at the top of the central sweep and wearing simple pale clothes, arms stretched
    out and legs flung wide in mid-stride. Tucked into the open space beneath the legs is a small
    central tuft of grass, above a wide grassy ridge crossed by two larger stalks in the lower half.
    Soft pale green blades and light tan earth tones surround the grass strokes without dropping
    below the lowest stroke.
  exact:
    - The upper line across is about two thirds as long as the bottom line across, and the short middle line across is a little over a third as long as the bottom line across.
    - At the top, the long left sweep starts at the top centre and crosses the middle of the upper line across, while the right falling stroke starts on the upper line across just to the right of the crossing and sweeps wide to the right.
    - The small cross in the centre sits inside the open space beneath the two sweeping legs and does not touch either leg.
    - The central vertical of the small cross ends in a plain point just above the long bottom line across, with a small gap between them.
    - Two lower vertical strokes cross the long bottom line across and do not touch the small cross above them; the left one curves down to the bottom left, while the right one runs straight down to a plain point with no hook.
  strokes:
    - where: a line across the upper part, rising slightly to the right, about two thirds as long as the bottom line across
      part: the running person's outstretched arms, from hand to hand
    - where: a long sweep from the top centre down through the upper line across and curving out to the middle left
      part: the person's head, torso and left leg striding out to the left
    - where: a sweeping falling stroke from the middle of the upper line across down and out to the middle right
      part: the person's right leg striding wide to the right
    - where: a short line across the centre between the spread legs, rising slightly to the right, a little over a third as long as the bottom line across
      part: the spreading leaves of the middle tuft of grass
    - where: a short straight vertical line down the centre, crossing the short line across and stopping above the bottom line across
      part: the upright stem of the middle tuft of grass
    - where: a long line across the lower half, the widest horizontal in the character
      part: a wide ridge of turf running across the field
    - where: a vertical stroke on the left of the lower half, crossing the bottom line across and curving down to the bottom left
      part: the left grass stalk, curving down through the turf
    - where: a straight vertical line on the right of the lower half, crossing the bottom line across and ending in a plain point near the bottom
      part: the right grass stalk, standing straight through the turf

硃:
  checked: argon
  object: a rocky overhang with a block of red cinnabar ore below it on the left, beside a tall tree with its red heartwood core marked on the upper trunk on the right
  history: >-
    朱 first drew a tree 木 with an extra mark on the trunk pointing out its red heartwood core, and
    came to mean vermilion and cinnabar; 硃 adds 石, stone or mineral ore, on the left to show
    cinnabar ore specifically.
  layout: >-
    The left side is narrower and shorter, sitting in the middle-left of the square: a pale grey
    cliff overhang above a square block of soft vermilion-tinted cinnabar ore. The right side is
    much wider and taller, filling the square from near the top to near the bottom: a tree with a
    pale foliage crown behind the upper strokes, a warm pale-red glow on the upper trunk around the
    heartwood mark, and roots spreading wide at the base, with the left root sweeping beneath the
    stone block.
  exact:
    - The left stone part is narrower and much shorter than the right tree part, and its square block stops just short of the tree's main horizontal branch without touching it.
    - In the left part, the sweeping cliff stroke starts at the middle of the top ledge; both the left vertical and the top-and-right turn of the ore block start at the middle of that cliff sweep.
    - The ore block's bottom line starts at the middle of its left vertical, leaving the bottom of the left vertical projecting below, and meets the bottom of the right turn.
    - In the right part, the upper line across the trunk starts at the middle of the short upper-left sweep, crosses the trunk, and is clearly shorter than the main horizontal branch below it, about two thirds as long.
    - The tall vertical trunk is a straight line from top to bottom ending in a plain point, with no hook, crossing both horizontal lines.
    - The left root sweep starts where the main branch crosses the trunk, while the right root sweep starts on the trunk just below that crossing, so the two sweeps do not touch each other at their starts.
  strokes:
    - where: a short line across the upper left, rising slightly to the right, a little over half as long as the tree's main branch
      part: the flat top ledge of the rocky overhang
    - where: a long sweep starting at the middle of the top left ledge and curving down to the middle left
      part: the sloping face of the rocky overhang
    - where: a short line down in the lower left, starting at the middle of the cliff sweep
      part: the left side of the square block of cinnabar ore
    - where: a line in the middle left starting where the block's left side meets the cliff sweep, running across and turning sharply down
      part: the top and right side of the square block of cinnabar ore
    - where: a short line across the bottom of the left block, rising slightly to the right from the middle of its left side to meet the bottom of its right side
      part: the bottom edge of the square block of cinnabar ore
    - where: a short sweep in the upper centre, curving down to the left
      part: the left edge of the bark cut on the upper tree
    - where: a line across the upper right half, starting at the middle of the short upper sweep and rising slightly to the right across the trunk, about two thirds as long as the main branch below it
      part: the upper mark across the tree highlighting its red heartwood core
    - where: a long line across the middle of the right half, rising slightly to the right across the trunk
      part: the tree's main horizontal branches
    - where: a very long straight line down the right half from near the top to near the bottom, ending in a plain point with no hook
      part: the tree's tall straight trunk
    - where: a long sweep from the crossing of the trunk and main branch, curving down and out to the bottom left beneath the stone block
      part: the tree's left root, spreading down to the left
    - where: a long falling stroke starting on the trunk just below the main branch crossing, sweeping down and turning out to the bottom right
      part: the tree's right root, spreading down to the right

