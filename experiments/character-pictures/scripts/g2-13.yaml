    nose and a mouth, wearing simple pale clothes.
  exact:
    - All four strokes of the upper hand stand completely free of one another and do not touch the woman below.
    - The top stroke sweeps down from right to left; below it are two short dots slanting down to the right on the left and in the centre, and a short sweep slanting down to the left on the right.
    - The lower part is much wider than the upper part, with its long line across spanning nearly the full width of the square.
    - In the woman below, the first stroke starts in the centre below the middle dot, runs down to the left, and turns sharply to sweep down to the bottom right.
    - The second stroke of the woman starts at the middle of the long horizontal line and sweeps down to the bottom left, crossing the lower leg of the bent stroke.
    - The long line across crosses the upper leg of the bent stroke and touches the top of the downward-left sweep.
  strokes:
