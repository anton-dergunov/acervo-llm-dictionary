牢:
  checked: argon
  object: an ox's head with horns and ears, kept beneath the roof of a stable
  history: >-
    An ideogrammic compound combining an enclosure or roof (宀) over an ox (牛): cattle shut safe
    inside a pen or stable.
  layout: >-
    At the top, a wide pale wooden or thatched stable roof arches across the upper third of the
    square. Beneath the roof sits an ox's head seen from the front, filling the lower two thirds,
    with pale brown fur, gentle eyes on either side of the bridge of the nose, and a broad pale
    muzzle at the bottom.
  exact:
    - The top dot stands free above the middle of the roof line, with a small gap between them.
    - The long roof line touches the top of the short left eave stroke and ends on the right in a sharp hook down to the left.
    - Below the roof, the ox's upper horizontal line starts at the middle of the short left sweep and is about half as long as the lower horizontal line.
    - The short left sweep stops above the lower horizontal line without touching it.
    - The long central vertical starts just below the roof line without touching it, crosses the middle of both horizontal lines of the ox, and ends at the bottom in a plain point with no hook.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the ridge ornament at the peak of the stable roof
    - where: a short stroke at the upper left, running down and slightly to the left
      part: the left eave of the stable roof
    - where: a long line across the upper part from the top of the left eave to the right, ending in a hook down to the left
      part: the span of the stable roof and its right eave
    - where: a short sweep beneath the left side of the roof, running down and turning to the left
      part: the ox's curved left horn
    - where: a line across the upper middle, about half as long as the lower line across, starting from the middle of the left sweep and rising slightly to the right
      part: the top of the ox's head, the brow between the horns
    - where: a long line across the lower middle, from near the left edge to near the right edge
      part: the ox's ears, held out wide to both sides
    - where: a long straight line down the centre, from just below the roof to the bottom
      part: the ox's right horn at its top, then the long bridge of the nose down to the muzzle

纠:
  checked: argon
  object: a twisted skein of silk thread on the left beside two cords entangling and joining together on the right
  history: >-
    The character was formed by adding silk thread 糸 to 丩, the original pictogram of two vines or
    cords twisting and entangling together, which first wrote this word. The simplified form reduces
    the silk component on the left to a cursive zigzag and a rising stroke.
  layout: >-
    The left half holds a twisted skein of pale silk thread following the two sharp angled turns and
    the rising tie at the bottom. The right half holds two pale cords coming together, the shorter
    left cord bending down and across to join the long upright cord on the right. Soft pale silk
    sheen and twisted cord shading stay close behind their own strokes, leaving the central gap
    clear.
  exact:
    - The left part (the silk skein) and the right part (the entangling cords) do not touch each other.
    - In the left half, the upper angled stroke sweeps down to the left and turns across to the right to touch the middle of the second angled stroke.
    - The second angled stroke in the left half sweeps down to the left and turns sharply to rise to the right.
    - The lowest stroke on the left is a rising stroke slanting up to the right, standing free of every other stroke.
    - In the right half, the shorter left stroke runs down and turns sharply at the bottom to rise to the right, touching the middle of the long vertical stroke.
    - The vertical stroke on the right is the longest stroke in the character (the upper-left stroke is clearly shorter, a little under two thirds as long) and ends in a plain point at the bottom, with no hook.
  strokes:
    - where: a stroke in the upper left half sweeping down to the left and turning sharply across to the right, clearly shorter than the right vertical, a little under two thirds as long
      part: the upper loop of the twisted silk skein
    - where: a stroke in the middle of the left half sweeping down to the left and turning sharply to rise to the right
      part: the lower loop of the twisted silk skein
    - where: a rising stroke at the bottom of the left half, slanting up to the right
      part: the tied lower band of the silk skein
    - where: a stroke in the upper middle of the right half running down and turning sharply to rise to the right into the long vertical
      part: the shorter cord bending across to entangle with the upright cord
    - where: a long straight line down the right side from top to bottom, ending in a plain point
      part: the main upright cord
