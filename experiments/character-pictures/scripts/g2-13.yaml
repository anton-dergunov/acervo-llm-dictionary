      part: the back of the hand reaching down from above
    - where: a short stroke in the upper left, below the left end of the top sweep, slanting down to the right
      part: the hand's left finger reaching down
    - where: a short dot in the upper centre, below the middle of the top sweep, slanting down to the right
      part: the hand's middle finger reaching down
    - where: a short sweep in the upper right, slanting down to the left
      part: the hand's right finger reaching down
    - where: a stroke from the centre down a little to the left, turning sharply to sweep down to the bottom right
      part: the woman's head and back, running down to her hip, then her thigh folded forward
    - where: a sweep from just right of the centre down and out to the bottom left
