恒:
  checked: argon
  object: a human heart on the left, beside the sun held steadily between an upper sky line and a lower ground line on the right
  history: >-
    An ideogrammic and phono-semantic compound of a heart (忄, the side form of 心) on the left and 亘
    on the right. In the older form 恆, the right side 亙 drew a crescent moon between two horizontal
    lines; the variant and simplified form 恒 writes 亘, placing the sun 日 between the two lines to
    express a constant, steadfast heart.
  layout: >-
    The narrow heart occupies the left third of the square, with a soft pale-red heart body drawn
    around its tall vertical spine and two small side strokes. The right two thirds hold a
    rectangular pale-gold sun in the middle, poised between a shorter horizontal sky line floating
    above it and a wide horizontal ground line below it. All colours stay soft and pale behind the
    strokes.
  exact:
    - The left heart component and the right component do not touch; there is a clear gap between the short right dot of the heart and the central sun box.
    - In the left component, the long vertical spine is a straight line ending in a plain point at the bottom, with no hook; the short left stroke stands free to its left, while the short right dot starts on the spine and slants down to the right.
    - On the right, both the top line across and the bottom line across stand completely free above and below the central sun box.
    - The top line across on the right is clearly shorter than the bottom line across, a little over half as long.
    - In the central sun box, the inner line across touches the middle of the left vertical and stops short of the right side, while the bottom line of the box joins the bottom ends of both sides.
  strokes:
    - where: a short line down on the far middle left, standing free
      part: the left edge of the heart
    - where: a short dot-like stroke starting on the upper-middle of the left vertical spine and slanting down to the right
      part: a small vessel branching from the right side of the heart
    - where: a long straight line down the left third, from near the top to near the bottom, ending with no hook
      part: the main vertical vessel and spine of the heart
    - where: a line across the upper right half, rising slightly to the right and clearly shorter, a little over half as long as the bottom line across
      part: the upper horizon line of the sky above the sun
    - where: a line down the left side of the middle right box, slanting slightly to the right
      part: the left edge of the sun
    - where: a line across from the top of the box's left edge to the right, then turning sharply down to form the right side
      part: the top and right edges of the sun
    - where: a short line across the middle of the sun box, touching the left edge and stopping short of the right side
      part: the gleam across the centre of the sun
    - where: a short line across the bottom of the sun box, joining the left and right edges
      part: the lower edge of the sun
    - where: a long line across the lower right two thirds, standing free below the sun box
      part: the wide lower horizon line of the ground beneath the sun

