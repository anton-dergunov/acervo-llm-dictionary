    - The upper box and the lower strokes do not touch each other.
    - In the lower left half, the short line across starts on the middle of the vertical leg stroke and rises slightly to the right; the vertical stroke turns sharply up to the right at its bottom.
    - In the lower right half, the short sweep starts on the right and slants down to the left to touch the middle of the long vertical stroke.
    - The long stroke on the lower right starts higher than the lower left vertical, just below the upper box, runs down, turns wide across to the right at the bottom, and ends in a tall hook pointing straight up.
