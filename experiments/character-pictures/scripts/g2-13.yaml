  history: >-
    An ideogrammic compound combining 小, three small grains of sand meaning small, above 隹, a
    pictogram of a short-tailed bird in profile. In the modern form, the upper left sweep of the
    bird is stretched long under the three top strokes so that the upper part resembles 少.
  layout: >-
    In the upper third sit the three small pale-tan grains of sand of 小, with the elongated middle
    sliver flanked by a short grain on either side. Below them fills a plump little sparrow facing
    left in pale warm brown and buff plumage, with a small eye and beak near the top of its head,
    its outstretched upper wing following the long diagonal sweep down to the middle left, and its
    folded wing feathers, breast, and short tail formed by the grid of strokes in the lower half.
  exact:
    - The three strokes at the top stand completely free of one another and do not touch the long diagonal sweep below them.
    - The top centre vertical ends in a plain point at the bottom, with no hook.
    - The long diagonal sweep runs from the upper right, just below the right top grain, all the way down to the middle left, four times as long as the short left sweep above it.
    - The left vertical starts on the middle of the long diagonal sweep and runs straight down the left side, extending a little below the bottom horizontal line.
    - The short dot in the centre stands free below the long diagonal sweep and above the top horizontal line, touching neither.
    - The three upper horizontal lines of the bird are clearly shorter than the bottom horizontal line, about three fifths to two thirds as long, and their left ends stop just short of the left vertical without touching it.
    - The bottom horizontal line starts on the lower part of the left vertical and runs across to the bottom right.
    - The inner vertical is clearly shorter than the left vertical, a little under two thirds as long; it starts at the middle of the top horizontal line, crosses the two middle horizontal lines, and ends at the middle of the bottom horizontal line.
  strokes:
    - where: a short vertical line down the top centre, ending in a plain point with no hook
      part: the elongated middle grain of sand at the top
    - where: a short sweep in the upper left, slanting down to the left, a quarter as long as the long diagonal sweep below
      part: the left grain of sand
    - where: a short stroke in the upper right, slanting down to the right
      part: the right grain of sand
    - where: a long diagonal sweep from the upper right, below the right grain, down and out to the middle left
      part: the upper edge of the sparrow's lifted wing, sweeping down to the left
    - where: a long vertical line starting at the middle of the long diagonal sweep and running straight down the left side
      part: the front of the sparrow's breast and leg
    - where: a short dot in the centre, below the long diagonal sweep and above the top horizontal line
      part: the small crest feather on top of the sparrow's head
    - where: a horizontal line across the middle, about two thirds as long as the bottom horizontal line
      part: the top edge of the sparrow's folded wing
    - where: a horizontal line across the middle below the top horizontal line, a little under three fifths as long as the bottom horizontal line
      part: the upper row of feathers on the sparrow's wing
    - where: a horizontal line across the lower middle, about two thirds as long as the bottom horizontal line
      part: the lower row of feathers on the sparrow's wing
    - where: a vertical line down the centre of the wing, a little under two thirds as long as the left vertical, from the top horizontal line to the bottom horizontal line
      part: the central shaft dividing the wing feathers
    - where: a long horizontal line across the bottom, from the lower part of the left vertical out to the bottom right
      part: the underside of the sparrow's belly and its short tail extending to the right

糾:
  checked: argon
  object: a twisted skein of silk thread on the left and two cords entangling together on the right
  history: >-
    Originally written as 丩, a drawing of two cords or vines twisting and entangling together; the
    silk component 糹 was added on the left to specify tangled or twisted silk threads.
  layout: >-
    On the left, a twisted skein of pale silk hangs vertically, with its upper coiled loops bound by
    a small knot on the right and three loose tassel fringes hanging below, stepping slightly upward
    from left to right. On the right, two pale cords twist together: the left cord drops down and
    turns sharply up to the right to join the middle of a tall vertical cord that runs from the top
    to the bottom of the frame. Soft pale silk fibres surround the strokes.
  exact:
    - The left silk skein and the right entangled cords do not touch each other.
    - On the left, the upper bent stroke sweeps down to the left and turns across to touch the middle of the lower bent stroke, which sweeps down to the left and turns up to the right to meet the small dot at its tip.
    - Below the coiled loops on the left, three separate short strokes slant down to the right and stand completely free of the upper strokes and of one another, stepping upward from left to right, with the leftmost stroke longer than the other two dots.
    - On the right, the shorter bent stroke starts in the upper middle, drops down, and turns sharply up to the right to touch the middle of the long vertical stroke.
    - The long vertical stroke on the right runs from near the top to near the bottom—about twice as long as the upper bent stroke on the left—making the right side taller than the left, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a stroke in the upper left that sweeps down to the left and turns sharply across, rising slightly to the right
      part: the upper coiled loop of the twisted silk skein
    - where: a stroke below the upper loop that sweeps from the upper left-centre down to the left and turns sharply up to the right
      part: the lower coiled loop of the twisted silk skein
    - where: a short dot slanting down to the right at the right tip of the lower loop's upward turn
      part: the small knot binding the silk skein's loop
    - where: a short stroke at the bottom left, slanting down to the right below the skein
      part: the leftmost loose fringe at the bottom of the silk skein
    - where: a small dot slanting down to the right in the bottom left-centre, beside and slightly higher than the leftmost fringe
      part: the middle loose fringe of the silk skein
    - where: a small dot slanting down to the right near the lower centre, beside and slightly higher than the middle fringe
      part: the rightmost loose fringe of the silk skein
    - where: a stroke in the upper middle of the right half that drops down and turns sharply up to the right
      part: a cord dropping down and angling up to twist into the main vertical cord
    - where: a long straight vertical line down the right side from the top to the bottom, ending in a plain point with no hook
      part: the tall main vertical cord around which the shorter cord entangles

囚:
  checked: argon
  object: a person standing confined inside the walls of a square cell
  history: >-
    An ideogrammic compound that places a standing person 人 inside a walled enclosure 囗 to show a
    prisoner in confinement.
  layout: >-
    A tall rectangular cell frame 囗 fills the square, with pale stone wall texture along its edges.
    Inside the cell stands a person 人 seen from the front, legs apart, with a small head just above
    the top of the inner sweep, a face with eyes, a nose and a mouth, and simple pale clothes, with
    pale arms at the sides.
  exact:
    - The outer enclosure is formed by a left vertical, a top-and-right stroke turning down at the top right, and a bottom horizontal line closing the frame between the two sides.
    - The person inside consists of only two strokes—a sweep down to the left and a shorter stroke slanting down to the right from its middle—with no horizontal cross-stroke.
    - The person inside does not touch any side of the outer enclosure.
  strokes:
    - where: a long vertical line down the left side, from top left to bottom left
      part: the left wall of the cell
    - where: a line across the top from the top of the left wall, turning sharply down at the top right to run down the right side
      part: the roof and right wall of the cell
    - where: a sweep inside the enclosure, from the upper centre down and out to the lower left
      part: the prisoner's body, running down into the left leg
    - where: a shorter stroke inside the enclosure, from the middle of the inner sweep down to the lower right
      part: the prisoner's right leg
    - where: a horizontal line across the bottom, joining the lower part of the left wall to the lower part of the right wall
      part: the floor of the cell

朱:
  checked: argon
  object: a tree with its vermilion heartwood marked across the core of the trunk, branches spreading wide and roots below
  history: >-
    The oldest forms drew a tree with a thick mark on the middle of the trunk to point out its red
    heartwood. As the branches and mark straightened into lines, the upper part became a short left
    sweep and an upper bar across the trunk above the main branches.
  layout: >-
    One tall tree fills the frame from top to bottom along the central trunk. A soft pale vermilion
    patch of exposed heartwood glows around the middle of the upper trunk where the upper bar
    crosses it, framed by a pale green leafy crown behind the branches and spreading roots at the
    bottom.
  exact:
    - The short sweep on the upper left angles down to the left and stops above the lower line across, leaving a clear gap between them.
    - The upper line across starts from the middle of the upper-left sweep and is clearly shorter, a little over half as long as the lower line across.
    - The trunk is a long straight vertical line from top to bottom ending in a plain point, with no hook, and crosses both lines across.
    - The two lower sweeps both start where the trunk crosses the lower line across, and do not touch each other.
  strokes:
    - where: a short sweep on the upper left, angling down to the left and stopping above the lower line across
      part: a short hanging bough on the upper left of the crown
    - where: a line across the upper part, clearly shorter, a little over half as long as the lower line across, starting from the middle of the upper-left sweep and rising slightly to the right
      part: the mark across the upper trunk exposing the vermilion heartwood
    - where: a long line across the middle, from left to right
      part: the main branches spreading out to both sides
    - where: a long straight line down the middle, from the top to the bottom, with no hook
      part: the trunk of the tree
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the root spreading out to the left
    - where: a sweep from the centre of the trunk down and out to the bottom right
      part: the root spreading out to the right

帕:
  checked: argon
  object: a scarf hanging over a rod on a stand on the left, beside an upright white acorn with its short stem and cap on the right
  history: >-
    An ideogrammic compound combining a cloth or scarf (巾) on the left with white (白, drawn in its
    oldest form as an acorn with a stem and cap) on the right, for a white head-scarf or veil.
  layout: >-
    The picture is split into two halves that do not touch. On the left, a soft pale scarf hangs
    over a horizontal rod supported by a tall upright stand that runs from near the top to the
    bottom. On the right, a pale cream-white acorn stands upright with a short stem at the top, a
    lightly textured cap in the upper part of its frame, and the smooth nut below.
  exact:
    - The left part (the scarf on its stand) and the right part (the acorn) do not touch; the left part is taller, reaching higher at the top and lower at the bottom.
    - On the left, the short left vertical starts where the horizontal rod stroke begins, and is about a third as long as the tall central stand; the rod stroke turns down on the right and ends in a hook to the left toward the stand.
    - The tall central stand on the left is a straight vertical line crossing the rod and ending in a plain point at the bottom, with no hook.
    - On the right, the top sweep slants down to the left to meet the top left corner where the left vertical and top-and-right frame stroke begin.
    - The right half's left vertical is about half as long as the tall stand on the left, and its right side ends at the bottom in a small hook to the left.
    - Inside the right frame, the middle line across starts on the left vertical and stops clearly short of the right side, about two thirds of the way across, while the bottom line across connects the left vertical to the bottom of the right side.
  strokes:
    - where: a short line down the left side of the left half, about a third as long as the tall central line
      part: the left edge of the scarf, hanging down
    - where: a line across the middle of the left half from the top of the short left line, turning down and ending in a hook to the left
      part: the rod with the scarf over it, and the scarf's right edge curling at its hem
    - where: a long straight line down the centre of the left half, from near the top to the bottom, with no hook
      part: the upright stand that holds the rod
    - where: a short sweep at the top of the right half, slanting down to the left to touch the top left corner of the frame below
      part: the acorn's stem
    - where: a line down the left side of the right half, about half as long as the tall stand on the left
      part: the acorn's left side
    - where: a line across the upper part of the right half, turning down at the right to run down the right side and ending in a small hook to the left
      part: the acorn's top and right side
    - where: a short line across the middle of the right half, touching the left side and stopping short of the right side
      part: the lower rim of the acorn's cap
    - where: a line across the bottom of the right half, from the left side to the bottom end of the right side
      part: the base of the acorn

