仓:
  checked: argon
  object: a granary with a pitched roof, a door and a foundation
  history: >-
    The oldest forms drew a granary with a pitched roof at the top, a door in the middle and a
    storage pit or foundation at the bottom. This simplified form comes from an ancient variant that
    abbreviated the door and foundation beneath the roof into two hooked strokes.
  layout: >-
    One granary fills the square. The two wide strokes at the top form a pitched thatched or tiled
    roof overhanging the building. Below the roof, the inner hooked stroke frames the small upper
    door where grain is poured in, while the outer curving stroke forms the left wall, the broad
    base of the foundation, and the upturned right corner. Pale wooden walls and a soft golden hint
    of grain inside the opening sit behind the strokes.
  exact:
    - The wide pitched roof at the top does not touch the lower part of the granary.
    - The right roof stroke starts on the upper part of the left roof sweep, just below its top.
    - In the lower part, the inner stroke and the outer stroke meet at their top-left corner.
    - The inner stroke runs across, turns down, and ends in a hook to the left inside the curve of the outer stroke.
    - The outer stroke runs down the left side, curves smoothly across the bottom well past the inner stroke, and ends in a sharp upward hook on the right.
  strokes:
    - where: a long sweep from the top centre down and out to the middle left
      part: the left slope of the granary's pitched roof
    - where: a falling stroke from near the top of the left sweep down and out to the middle right
      part: the right slope of the granary's pitched roof
    - where: a stroke below the roof running across from the centre-left, turning down and ending in a hook to the left
      part: the upper door frame of the granary
    - where: a long stroke from the top-left of the door frame running down, curving across the bottom, and ending in an upward hook on the right
      part: the granary's left wall and bottom foundation

