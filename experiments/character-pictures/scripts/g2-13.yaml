挖:
  checked: argon
  object: a hand on the left digging out a deep hollow beneath an arched cave opening on the right
  history: >-
    An ideographic compound combining a hand (扌) on the left with a hollow cave pit (穵) on the
    right, showing a hand scooping and excavating a pit in the earth.
  layout: >-
    The left side is narrower and holds an open hand seen from the side, its fingers reaching right
    toward the earth. The wider right side shows an arched earthen cave opening at the top and a
    deep curved pit scooped out below it. Pale sandy soil and soft warm tan earth surround the cave
    arch and the bottom pit behind the strokes, with a pale skin tone on the hand.
  exact:
    - The narrower left component (the hand) and the wider right component (the hollow) stand side by side and do not touch; the upper horizontal of the hand stops just short of the cave roof's left edge.
    - In the left component, the long vertical line ends in a hook to the left at the bottom, and both cross-strokes cross it; the upper cross-stroke is about three quarters as long as the lower rising stroke.
    - At the top of the right component, the short slanting dot stands free above the roof, and the long roof stroke starts on the middle of the short left vertical and turns at the right into a hook pointing down and left.
    - Beneath the roof arch, the left sweep and the right slanting stroke stand completely free of the roof and of each other.
    - The large winding stroke at the bottom of the right half stands free below the inner sweeps; it runs short across to the right, sweeps diagonally down to the left, and curves wide across the bottom to end in an upward hook at the bottom right.
  strokes:
    - where: a short line across the upper part of the left side, rising slightly to the right
      part: the upper fingers of the hand, reaching right to dig
    - where: a long vertical line down the left side from top to bottom, ending in a hook to the left
      part: the back of the hand and wrist, with the hook at the base of the palm
    - where: a rising stroke across the middle of the left side, slanting up to the right
      part: the lower fingers scooping upward toward the pit
    - where: a short dot at the top of the right half, slanting down to the right
      part: the cap of earth at the crest of the cave arch
    - where: a short vertical stroke on the upper left of the right half, slanting slightly to the left
      part: the left lip of the cave arch
    - where: a line from the middle of the short left vertical running across to the right, then turning down into a hook to the left
      part: the vaulted roof and overhanging right eave of the cave opening
    - where: a short sweep under the left side of the roof arch, curving down to the left
      part: the left inner wall of the hollow
    - where: a short slanting stroke under the right side of the roof arch, running down to the right
      part: the right inner wall of the hollow
    - where: a long winding stroke in the lower right half that runs across to the right, sweeps down to the left, curves across the bottom, and ends in an upward hook on the right
      part: the deep curved pit scooped out of the ground, its bottom rim turning up on the right

