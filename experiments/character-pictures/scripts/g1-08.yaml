# Full run, group g1, batch 08. Written from the fact sheets, following scripts/GUIDE.md.

肉:
  object: a piece of meat on the ribs of an animal, a rack of ribs with meat on it
  history: >-
    The oldest forms drew a slab of meat with the lines of its ribs and muscle marked inside. The
    modern form kept the outline and turned the inner lines into two small stacked marks.
  layout: >-
    One upright slab of meat fills the frame, its outline following the two outer strokes, the left side
    and the top turning down the right side. Inside it, two ribs curve down one above the other in the
    middle, each with a short rib branching to the right. The meat is pale pink with paler fat, the
    bones pale cream.
  exact:
    - The top line starts touching the top of the left side and turns down at the right, ending in a small hook to the left.
    - The upper rib starts above the top line and crosses it, so it sticks up past the top edge of the meat.
    - The upper rib is a long stroke; the lower rib is clearly shorter, a little over half as long.
    - The two short side ribs are small and about equal, each about a third to two fifths as long as the upper rib; the upper one starts on the upper rib and does not touch the top line.
    - The inner ribs do not touch the left side.
  strokes:
    - where: a line down the left side, from the top to near the bottom
      part: the left edge of the meat
    - where: a line across the top from the top of the left side, turning down at the right and ending in a small hook to the left
      part: the top and the right edge of the meat
    - where: a stroke in the middle starting above the top line, running down to the right and then turning down to the left, ending left of the middle
      part: the upper rib, curving
    - where: a short stroke slanting down to the right, starting on the upper rib in the middle
      part: the short rib branching from the upper rib
    - where: a shorter stroke below the middle, running down and turning to the lower left
      part: the lower rib, curving
    - where: a short stroke slanting down to the right, starting on the lower rib
      part: the short rib branching from the lower rib

危:
  object: a person crouching at the edge of a high cliff
  history: >-
    The oldest forms drew a person on top of a cliff, with a second small figure kneeling below,
    because the edge of a high place is dangerous.
  layout: >-
    A tall pale-grey cliff fills the left and upper part of the frame, its face falling to the lower
    left. A small overhanging crag sits at its top. At the lower right, a kneeling person crouches near
    the edge, facing left, with a worried face with eyes, a nose and a mouth, and simple pale clothes.
  exact:
    - The short stroke at the top and the one crossing under it form the crag, and the crag's second stroke ends on the line across below.
    - The line across rises slightly to the right and starts exactly where the cliff face begins at the left.
    - The cliff face is clearly longer than the crag's first stroke, about twice as long.
    - The kneeling person is separate from the cliff face; the person's two strokes touch each other at the start.
    - The kneeler's second stroke is the longest stroke of the picture and ends turning upward at the lower right.
  strokes:
    - where: a short stroke at the top centre running down and turning to the lower left
      part: the crag's slanting top, a rock leaning out over the drop
    - where: a short stroke starting on the middle of the first stroke, running across to the right and turning down to the lower left
      part: the crag's lower edge, hanging over the drop
    - where: a line across in the upper middle, rising slightly to the right
      part: the flat top of the cliff, the edge
    - where: a long stroke from the left end of that line, running down and turning to a sweep to the bottom left
      part: the cliff face, falling away
    - where: a stroke at the centre running across to the right, turning down and ending in a small hook to the left
      part: the kneeler's head and shoulders, bowed
    - where: a long stroke starting at the same point, running down, then across to the right and rising at the end, turning up
      part: the kneeler's back, lap and bent legs

血:
  object: a chalice filled with blood, one drop above it
  history: >-
    The oldest forms drew a bowl with a drop or a stroke of blood inside it. The modern form lifted the
    drop above the vessel.
  layout: >-
    A wide stemmed cup stands across the lower part of the frame with a broad flat base, and a small
    drop of pale red blood hangs above it. The cup is filled with pale red liquid, shown between its
    sides, and has two pale grooves down its front.
  exact:
    - The drop does not touch the cup's left side or the two grooves; its end touches the cup's top line.
    - The cup's top line starts at the top of the left side, runs across and turns down on the right.
    - The base line is as long as the cup's top line, a little wider than the cup, and everything below the top line stands on it.
    - The left side and the two grooves all end on the base line.
    - The left groove is a little shorter than the left side, about four fifths as long.
    - The right groove curves a little to the right and is about four fifths as long as the drop.
  strokes:
    - where: a short sweep at the top centre, running down to the right and then turning down to the left
      part: the drop of blood falling into the cup
    - where: a line down the left side of the cup, from its top to the base
      part: the cup's left wall
    - where: a line across the cup's top from the left wall, turning down on the right
      part: the cup's rim and its right wall
    - where: a short line down inside the cup, left of its middle
      part: the left groove on the cup's front
    - where: a short line down inside the cup, right of its middle, slanting a little to the right
      part: the right groove on the cup's front
    - where: a long line across the bottom, wider than the cup on both sides
      part: the cup's broad base

仲:
  object: a person standing beside a tall post that passes through the middle of a box
  history: >-
    The oldest forms drew a post through the middle of a box, marking the middle. With a person added,
    the character means the one in the middle, a go-between.
  layout: >-
    A person fills the left of the frame, standing and facing right, with a friendly face with eyes, a
    nose and a mouth, and simple pale clothes. At the right a tall pale wooden post stands upright,
    passing through a small square box in its middle, the box drawn in pale cream.
  exact:
    - The person's body sweeps down to the lower left; the second stroke is a straight vertical starting on it.
    - The person and the box do not touch.
    - The post is the longest stroke and passes through the box, crossing its top and its bottom line, ending in a plain point at the bottom with no hook.
    - The box's top line ends in a small hook down to the left on the right side.
    - The box's bottom line is clearly shorter than its top, about two thirds as long.
    - The box's left side is a short vertical, less than half as long as the post.
  strokes:
    - where: a long sweep from the top left down and out to the left, ending in the middle of the left part
      part: the person's head and body, leaning left
    - where: a straight line down on the left, starting from the middle of the first stroke
      part: the person's leg, standing straight
    - where: a short line down at the centre, left of the post
      part: the left side of the box
    - where: a line across the upper middle, ending in a small hook down to the left
      part: the top of the box and its right side
    - where: a shorter line across the middle of the box
      part: the box's bottom edge
    - where: a long straight line down the right part, from the top to the bottom
      part: the post through the middle

压:
  object: a heavy cliff overhang pressing down on soil
  history: >-
    The oldest forms drew a rock overhang over a mound of soil; the modern form shows earth crushed
    beneath a cliff.
  layout: >-
    A heavy pale-grey rock overhang covers the left and top, its face falling to the lower left. Under it,
    a mound of pale brown soil is pressed flat, with a small crumb of soil squeezed out at the right.
    The earth keeps clear of the rock.
  exact:
    - The line across the top rises slightly to the right and starts exactly at the top of the rock's face.
    - The line across the earth's middle is about as long as the top line.
    - The earth's vertical crosses the middle line and ends on the base line, in a plain point with no hook.
    - The earth does not touch the rock's face, and there is a small gap between them.
    - The crumb at the lower right stands free and does not touch the base line.
    - The base line is the longest stroke across, about one and a half times the top line.
  strokes:
    - where: a line across the top, rising slightly to the right, starting at the top of the rock's face
      part: the flat underside of the overhang, pressing down
    - where: a long stroke from the top left, running down and turning to a sweep to the bottom left
      part: the rock's face, falling to the left
    - where: a line across in the middle, rising slightly to the right, right of the rock face
      part: a layer across the middle of the soil
    - where: a stroke from the upper centre running down to the right and turning straight down, crossing the middle line
      part: the soil's ridge, pressed down
    - where: a long line across the bottom, rising slightly to the right
      part: the flattened ground the soil is pressed onto
    - where: a short stroke at the lower right, slanting down to the right
      part: a crumb of soil squeezed out

壓:
  object: a heavy cliff overhang pressing down on soil
  history: >-
    The oldest forms drew a rock overhang over a mound of soil; the modern form shows earth crushed
    beneath a cliff.
  layout: >-
    A heavy pale-grey rock overhang covers the top and left, its face falling to the lower left. Under
    its roof, from left to right, hang a small round pale sun, a small pale crescent moon, curved to
    open on the left, and a crouching dog facing left, all pressed under the rock. Below them, a mound
    of pale brown soil lies flat across the bottom.
  exact:
    - The line across the top rises slightly to the right and starts at the top of the rock's face.
    - The sun is a small box made of its left side and a line across turning down; two small marks sit inside it, one a dot and one a stroke rising to the right.
    - The moon is a narrower box, with its left side and a line across turning down with a small hook to the left, and two dots inside it.
    - The dog's line across is shorter than the rock's top line, a little over half as long, and its long body stroke crosses it.
    - The dog's last stroke, a leg, reaches to the right past the body, and the dot at the top right stands free as its ear.
    - The soil's vertical crosses its short line and ends on the long base line, in a plain point with no hook.
    - The base line is clearly the longest line across the soil; the short line is about half as long.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the flat underside of the overhang
    - where: a long stroke from the top left, running down and turning to a sweep to the bottom left
      part: the rock's face, falling to the left
    - where: a short line down at the upper left, under the overhang
      part: the sun's left edge
    - where: a line across the top of the sun, rising slightly to the right, turning down on the right
      part: the sun's top and right edge
    - where: a small dot-like stroke inside the sun, near its top, rising slightly to the right
      part: the sun's mark inside
    - where: a small stroke rising to the right at the sun's lower right
      part: the sun's lower mark
    - where: a short line down below the sun, on the left
      part: the moon's left edge
    - where: a line across the top of the moon turning down on the right and ending in a small hook to the left
      part: the moon's top, its right edge and its tip
    - where: a small dot-like stroke inside the moon, in its upper part
      part: a small crater on the moon
    - where: a small dot-like stroke inside the moon, in its lower part
      part: a second small crater on the moon
    - where: a line across in the centre right, rising slightly to the right
      part: the dog's back
    - where: a stroke from the top of the dog, running down and turning to the lower left, crossing the back
      part: the dog's neck and body, curving down to its front leg
    - where: a stroke from the middle of the back, running down to the right and then turning across to the right
      part: the dog's hind leg, reaching back
    - where: a small dot at the top right, slanting down to the right, standing free
      part: the dog's ear
    - where: a line across the soil, rising slightly to the right, in the lower middle
      part: the top of the soil mound
    - where: a short vertical line down from the middle of that line to the base
      part: the soil's ridge
    - where: a long line across the bottom
      part: the flat ground the soil lies on

執:
  object: a hand clutching a pebble
  history: >-
    The oldest forms drew a kneeling person with the hands held out in front. The modern form kept a
    hand on the left and a pebble on the right, so that the hand grasps the stone.
  layout: >-
    A hand fills the left half, reaching right, its fingers closed round a smooth round pebble that fills
    the right half. The sleeve is pale blue. The pebble is pale grey with a lighter patch, round and
    plain, with no face.
  exact:
    - The pointing finger crosses the short line across the top and ends on the long line across below it.
    - The small dot on the left stands free of every other stroke.
    - The cuff line and the long line across the back of the hand are about equally long, and the two other short lines are about a quarter as long as the pebble's rim.
    - The forearm crosses the cuff line, and its top touches the palm edge.
    - The pebble's left curve crosses its rim at the start of the rim, and its inner crack crosses the left curve.
    - The pebble's rim ends in a small hook upward at the lower right.
    - The hand and the pebble do not touch; a small gap separates the back of the hand from the pebble's rim.
  strokes:
    - where: a short line across the top left, rising slightly to the right
      part: the fingers laid across, held out
    - where: a stroke at the top left running down to the right and then straight down, crossing the first line
      part: the pointing finger, bending down
    - where: a long line across below, rising slightly to the right, reaching from the left edge to the middle
      part: the back of the hand
    - where: a small dot, down to the right, on the left under the long line
      part: a fingernail
    - where: a short stroke from the middle running down to the right and turning to the lower left
      part: the thumb curling over the pebble
    - where: a shorter line across the lower left, rising slightly to the right
      part: the edge of the palm
    - where: a long line across near the bottom left, rising slightly to the right
      part: the cuff of the sleeve at the wrist
    - where: a short vertical line down from the palm edge, crossing the cuff and ending at the bottom
      part: the forearm
    - where: a long stroke on the right of the middle, running down and turning to a sweep to the lower left
      part: the pebble's left curve, bulging
    - where: a long stroke starting in the middle, running across to the right and rising, turning down, curving at the bottom right and ending in a hook upward
      part: the pebble's top, its right curve and its base
    - where: a short stroke inside the pebble, slanting down to the right
      part: the pebble's crack

执:
  object: a hand clutching a pebble
  history: >-
    The oldest forms drew a kneeling person with the hands held out in front. The modern form kept a
    hand on the left and a pebble on the right, so that the hand grasps the stone.
  layout: >-
    An open hand fills the left side, seen from the palm side with the wrist below, reaching right to
    close its fingers round a smooth round pebble that fills the right side. The pebble is pale grey with
    a lighter patch, round and plain, with no face.
  exact:
    - The hand's vertical is the longest stroke on the left, ends in a small hook up to the left, and is crossed by both of the lines across.
    - The upper line across is short, about a quarter as long as the pebble's rim; the thumb line below rises clearly to the right and is about a third longer than the upper line.
    - The hand's vertical and the pebble's long sweep do not touch; there is a small gap between them.
    - The pebble's long sweep crosses the rim stroke at its start and the short stroke inside.
    - The pebble's rim ends in a small hook upward at the lower right.
  strokes:
    - where: a short line across the upper left, rising slightly to the right
      part: the fingers spreading out
    - where: a long line down the left part, from the top, ending in a small hook up to the left, crossing the other two
      part: the middle finger, running down through the palm to the wrist
    - where: a line rising to the right across the lower left
      part: the thumb, spread wide
    - where: a long stroke on the right of the middle, running down and turning to a sweep to the lower left
      part: the pebble's left curve
    - where: a long stroke starting in the middle, across to the right and rising, turning down, curving at the bottom right, ending in a hook upward
      part: the pebble's top, right curve and base
    - where: a short stroke inside the pebble, slanting down to the right
      part: the pebble's crack

阳:
  object: a sun rising above a hill
  history: >-
    The oldest forms drew a sun with rays above a stepped hill, the sunny side of a hill, bright and warm.
  layout: >-
    A pale stepped hill fills the left side. The sun, a round warm yellow disc, hangs at the right with a
    pale band of light across its middle, in front of a pale sky. The sun is not black and has no face.
  exact:
    - The hill's top stroke starts at the top of the left side, touching it, and ends in a small hook to the left.
    - The hill's left side is a straight vertical, longer than the sun is tall, and ends in a plain point.
    - The sun's top and right side are one stroke, ending in a small hook upward to the left.
    - The sun's left side starts at the sun's top, and the two stroke starts touch.
    - The band across the middle is short, about a quarter of the hill's top line, and stays clear of the sun's right edge.
    - The sun's bottom line starts on the sun's left side and ends on its right edge.
  strokes:
    - where: a stroke across the top left, rising a little to the right, then turning down to the lower left and then down, ending in a small hook to the left
      part: the hill's summit and its slope, stepped
    - where: a long straight line down the left side
      part: the hill's steep side
    - where: a straight line down the left of the sun, from the top
      part: the left rim of the sun
    - where: a line across the top of the sun, turning down on the right and ending in a small hook upward to the left
      part: the top and right rim of the sun
    - where: a short line across the middle of the sun, rising slightly to the right
      part: the band of light across the sun's heart
    - where: a line across the bottom of the sun, rising slightly to the right
      part: the bottom rim of the sun

陽:
  object: a sun rising above a hill
  history: >-
    The oldest forms drew a sun with rays above a stepped hill, the sunny side of a hill, bright and warm.
  layout: >-
    A pale stepped hill fills the left side. At the upper right, a round warm yellow sun hangs above a
    long line of horizon, and streaks of pale light run from it down to the lower left over the pale sky.
    The sun has no face and is not black.
  exact:
    - The hill's top stroke starts at the top of the left side, touching it, and ends in a small hook to the left.
    - The hill's left side is a straight vertical, longer than the sun is tall, and ends in a plain point.
    - The sun's short left side starts where its top stroke starts; the top stroke turns down on the right, and the sun's bottom line joins the ends of both sides.
    - The small mark inside the sun starts on the left side and stands clear of the right.
    - The horizon line starts near the hill but does not touch it; it is about two thirds as long as the longest ray.
    - The longest ray ends in a small hook up to the left; the two shortest rays are about a third as long as it, and the middle ray is a little over half as long.
    - The first ray crosses the horizon at the horizon's start.
  strokes:
    - where: a stroke across the top left, rising a little to the right, then turning down and ending in a small hook to the left
      part: the hill's summit and its slope
    - where: a long straight line down the left side
      part: the hill's steep side
    - where: a short line down at the top of the sun, left of its middle
      part: the left rim of the sun
    - where: a line across the top of the sun, turning down on the right
      part: the top and right rim of the sun
    - where: a small dot-like stroke inside the sun, rising slightly to the right
      part: the band of light at the sun's heart
    - where: a small stroke at the bottom of the sun, rising to the right
      part: the bottom rim of the sun
    - where: a long line across, below the sun, from the left of the middle to the far right
      part: the line of the horizon
    - where: a short stroke from the horizon's left end, running down to the left
      part: a ray of light at the left
    - where: a long stroke across to the right from the centre, then turning down to the lower left and ending in a small hook upward to the left
      part: the longest ray of light, falling to the lower left
    - where: a short stroke from the start of that ray, running down and out to the lower left
      part: a short ray of light
    - where: a stroke from the middle of that ray, running down and out to the lower left, longer than the short ray
      part: a middle ray of light

吉:
  object: a scholar standing above his speaking mouth, his good words
  history: >-
    An ideogram: the words of a scholar. Good and lucky words, spoken by a learned man.
  layout: >-
    In the upper part, a scholar stands facing us in a long pale robe, with a friendly face with eyes, a
    nose and a mouth, and arms held out wide. Below him, a mouth, wide open, speaks. The scholar's
    robe is pale blue, the mouth pale red lips.
  exact:
    - The scholar's upper line is the longest across, and the line under it is shorter, about three fifths as long.
    - The scholar's vertical crosses the upper line and ends on the lower line, in a plain point with no hook.
    - The mouth is clearly smaller than the scholar and is separate from him.
    - The mouth's left side slants slightly, and its top line ends in a small hook down to the left.
    - The mouth's bottom line is shorter than its top line, about two thirds as long, and starts on the left side and ends where the top line ends.
  strokes:
    - where: a long line across the upper part
      part: the scholar's arms, held out wide
    - where: a vertical stroke from the top centre, running down to the right a little and straight down, crossing the arms
      part: the scholar's head and body, standing tall
    - where: a shorter line across below the arms, ending where the vertical ends
      part: the scholar's long robe's hem
    - where: a short stroke down the left side of the mouth, slanting to the lower right
      part: the mouth's left corner
    - where: a line across from the top of the left side, ending in a small hook down to the left
      part: the upper lip, curving down into the right corner
    - where: a line across the bottom, starting on the left side
      part: the lower lip

刑:
  object: a man standing beside a jail with bars
  history: >-
    The oldest forms drew a man shut in a jail with bars, a punishment. The modern form splits into a
    barred frame on the left and an upright figure on the right.
  layout: >-
    A jail cell with pale grey bars fills the left half. A man stands upright on the right, facing
    left toward the jail, with a sad face with eyes, a nose and a mouth, and a plain pale robe. His body is
    a long straight line.
  exact:
    - The jail's two lines across both rise slightly to the right; the upper is shorter, about seven tenths as long as the lower.
    - The jail's two bars cross the lower line across; the left bar starts at the start of the top line and sweeps down to the left, and the right bar starts on the middle of the top line.
    - The right bar is a straight vertical with a plain end and no hook.
    - The man's short stroke stands free, and so does his body; both stay clear of the jail.
    - The man's body ends in a small hook upward to the left.
  strokes:
    - where: a line across the top of the jail, rising slightly to the right
      part: the jail's roof beam
    - where: a longer line across the jail's middle, rising slightly to the right
      part: the jail's crossbar
    - where: a stroke on the left running down and turning to a sweep to the bottom left, starting at the left end of the roof beam
      part: the jail's left bar
    - where: a straight line down the middle of the jail from the roof beam
      part: the jail's right bar
    - where: a short line down at the right, in the upper middle
      part: the man's hanging arm
    - where: a long line down the right edge, ending in a small hook up to the left
      part: the man's body, the hook his foot

妇:
  object: a woman with a broom
  history: >-
    The oldest forms drew a woman beside a broom, the housekeeper of the family: a married woman.
  layout: >-
    A woman kneels on the left, seen from the side and facing left, her arms crossed in front of her,
    with a calm face with eyes, a nose and a mouth, and a simple pale dress. At her back, on the right
    side, a short pale broom leans, its straw head made of three layers.
  exact:
    - The woman's long first stroke turns to the right at the bottom; the second sweep starts where the line across ends.
    - The woman's line across rises to the right and crosses her first stroke.
    - The broom's top stroke turns down at the right, and its end touches the end of the bottom layer.
    - The broom's middle layer is short, a little under half as long as the top, and stands free.
    - The broom's bottom layer is a little over half as long as the top, longer than the middle layer.
    - The woman and the broom do not touch.
  strokes:
    - where: a long stroke from the top left, running down and a little to the left, turning at the lower left to a sweep down to the bottom right
      part: the woman's head and back, then her thigh folded forward to the knee
    - where: a sweep from the right of the middle down to the bottom left
      part: one arm, reaching down across her body
    - where: a line across on the left, below the middle, rising to the right
      part: her other arm, held across in front of her
    - where: a line across from the middle right, turning down on the right
      part: the broom's top band and its right edge
    - where: a short line across in the middle of the broom, standing free
      part: the broom's middle layer of straw
    - where: a line across at the bottom of the broom, ending at the end of the top band's turn
      part: the broom's lowest layer of straw

婦:
  object: a woman with a broom
  history: >-
    The oldest forms drew a woman beside a broom, the housekeeper of the family: a married woman.
  layout: >-
    A woman kneels on the left, seen from the side and facing left, her arms crossed in front of her,
    with a calm face with eyes, a nose and a mouth, and a simple pale dress. At her back, on the right
    side, a tall pale broom stands with a long handle and a wide straw head tied with bands.
  exact:
    - The woman's long first stroke turns to the right at the bottom; the second sweep starts where the line across ends.
    - The woman and the broom do not touch.
    - The broom's two upper bands are short; the top band turns down at the right and its end meets the end of the lower band.
    - The wide band across the broom's head and the head's lower edge are the two longest lines across, about equally long; the wide band ends in a small hook down.
    - The handle is a long straight vertical starting on that wide band and ending in a plain point at the bottom, with no hook.
    - The two short straw bundles under the wide band stand apart from each other and do not touch the woman.
    - The head's lowest stroke ends in a small hook to the left.
  strokes:
    - where: a long stroke from the top left, running down and a little to the left, then curving to the lower right
      part: the woman's head and back, then her thigh folded forward to the knee
    - where: a sweep from the right of the middle down to the bottom left
      part: one arm, reaching down across her body
    - where: a line across on the left, below the middle, rising to the right
      part: her other arm, held across in front of her
    - where: a line across the upper right, rising slightly to the right, turning down at the right
      part: the top binding band of the broom and its right edge
    - where: a short line across in the upper right, rising slightly to the right
      part: a thin band tied below the top
    - where: a line across below those, rising slightly to the right
      part: a third band, tied over the handle
    - where: a short line down at the left of the middle
      part: the left straw bundle of the head
    - where: a long line across the middle, rising slightly to the right, ending in a small hook down at the right
      part: the wide band across the broom's head
    - where: a short line down in the lower middle, under the wide band
      part: the middle straw bundle
    - where: a line across in the lower right, rising slightly to the right, turning down and ending in a small hook to the left
      part: the head's lower edge, the right straw bundle
    - where: a long straight vertical line down the right of the middle, starting at the wide band
      part: the broom's long handle

頁:
  object: a person's head, large, seen from the front, on a small body
  history: >-
    The oldest forms drew a kneeling person with a head made very large, to mean the head. The modern
    form kept the head on top and the two legs of the person below.
  layout: >-
    A big round head fills the upper two thirds, with hair on top and a face with two eyes, a nose and
    a mouth, and a small body in a pale robe below it with two short legs. The skin is warm pale peach, the
    hair soft brown.
  exact:
    - The line across the top is long, nearly as long as the face's top and right side together, about nine tenths as long.
    - The small stroke under it starts on its middle and stays clear of the face's left side, and ends touching the start of the face's top.
    - The face's left side and top meet at their start; the right side turns down and ends on the bottom line.
    - The three lines across the face rise slightly to the right; the bottom one is the longest, and the upper two are about four fifths as long.
    - The face's left side ends where the bottom line starts.
    - The two legs stand free of every other stroke and do not touch each other.
    - The right leg is a little shorter than the left, about four fifths as long.
  strokes:
    - where: a long line across the top
      part: the hair across the top of the head
    - where: a short stroke from the middle of the hair running down to the right and then down to the left
      part: the forelock hanging down
    - where: a straight line down the left side of the face
      part: the left cheek
    - where: a line across the top of the face, turning down at the right to run down the right cheek
      part: the brow and right cheek
    - where: a short line across the face in the upper middle, rising slightly to the right
      part: the eyes
    - where: a short line across the face below it, rising slightly to the right
      part: the nose and its shadow
    - where: a slightly longer line across the face's bottom, rising slightly to the right
      part: the mouth and chin
    - where: a sweep from the lower middle down to the bottom left
      part: the left leg
    - where: a stroke from the lower middle down to the bottom right
      part: the right leg

页:
  object: a person's head, large, seen from the front, on a small body
  history: >-
    The oldest forms drew a kneeling person with a head made very large, to mean the head. The modern
    form kept the head on top and the person's body below.
  layout: >-
    A big round head fills the upper two thirds, with hair on top and a face with two eyes, a nose and
    a mouth, and a small body in a pale robe below, one leg sweeping to the lower left and one to the
    lower right. The skin is warm pale peach, the hair soft brown.
  exact:
    - The line across the top is about as long as the face's top and right side together.
    - The small vertical stroke under it is short, a little over a fifth of the long sweep, and ends touching the face's top, not its left side.
    - The face's left side and top start together; the right side turns down, and its bottom stays open.
    - The long sweep stands free of the face; there is a small gap between them.
    - The right leg is clearly shorter than the long sweep, less than half as long.
  strokes:
    - where: a long line across the top
      part: the hair across the top of the head
    - where: a short vertical stroke under the hair's middle
      part: the forelock hanging down
    - where: a stroke down the left of the face, slanting a little to the right
      part: the left cheek
    - where: a line across the top of the face, turning down at the right
      part: the brow and right cheek
    - where: a long sweep from the middle of the face down and out to the bottom left
      part: the body, running down into the left leg
    - where: a short stroke at the lower right slanting down to the right
      part: the right leg

托:
  object: a young sprout held up by what it relies on
  history: >-
    To support and to rely on: the thing relied on is drawn as a sprout, held up by a hand in one form
    and by a spoken word in the other.
  layout: >-
    An open hand fills the left side, seen from the palm side with the wrist below, reaching to the
    right to hold up a young green sprout with pale leaves, whose roots curve at the lower right. The leaf
    is pale green.
  exact:
    - The hand's vertical is the longest stroke on the left, ending in a small hook to the left.
    - The hand's upper line across rises to the right and crosses the vertical; it is about four fifths as long as the lower line across.
    - The sprout's top leaf is a short stroke going left, not touching the hand; the stalk starts on its middle.
    - The sprout's line across rises to the right and does not touch the hand; it crosses the stalk near its start.
    - The sprout's stalk ends in a curve across to the right, rising at the end.
  strokes:
    - where: a short line on the left rising to the right, above the middle
      part: the fingers spreading out
    - where: a long line down the left part, from the top, ending in a small hook to the left
      part: the middle finger running down through the palm to the wrist, the hook where the wrist turns
    - where: a long line low on the left rising to the right
      part: the thumb, spread wide
    - where: a short stroke at the top right, running left and then down to the left
      part: the sprout's top leaf, bending over
    - where: a line across the middle, rising slightly to the right
      part: the sprout's pair of leaves, spreading
    - where: a long stroke from the upper middle, running straight down, then turning across to the right, curving up at the end
      part: the sprout's stalk, bending into its root

託:
  object: a young sprout held up by what it relies on
  history: >-
    To support and to rely on: the thing relied on is drawn as a sprout, held up by a hand in one form
    and by a spoken word in the other.
  layout: >-
    A small open mouth sits at the lower left, with lines of speech floating above it and a small spark of
    sound. At the right, a young green sprout with pale leaves rises, its stalk curving to the lower right.
    The leaf is pale green, the lips pale red.
  exact:
    - The topmost line of speech is the longest, and the two under it are about half as long as it.
    - The spark at the top is a short stroke that stands free of the speech lines.
    - All four speech marks stand free of every other stroke.
    - The mouth is a small box; its top and right side are one stroke, and its bottom line ends where that stroke ends.
    - The sprout's line across crosses the stalk and does not touch the mouth.
    - The stalk ends curving across to the right and rising at the end.
  strokes:
    - where: a short stroke at the top left, slanting down to the right
      part: the spark of sound
    - where: a line across in the upper left, rising slightly to the right
      part: the longest line of speech, floating out
    - where: a shorter line across below it, rising slightly to the right
      part: a second line of speech
    - where: a line of the same length below it, rising slightly to the right
      part: a third line of speech
    - where: a short stroke in the lower left, slanting down to the right
      part: the mouth's left side
    - where: a stroke from the left side, rising to the right and turning down
      part: the mouth's top and right side
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip
    - where: a stroke at the top right, running left and then down to the left
      part: the sprout's top leaf, bending over
    - where: a long line across the middle, rising to the right
      part: the sprout's pair of leaves, spreading
    - where: a long stroke from the upper middle running down, then turning to the right and curving up at the end
      part: the sprout's stalk, bending into its root

伦:
  object: a person beside a neat bundle of bamboo slips laid in order
  history: >-
    The oldest forms drew a person near a bundle of slips arranged in order; the order of people's
    dealings is what holds society together.
  layout: >-
    A person stands on the left, with a friendly face with eyes, a nose and a mouth, and simple pale
    clothes. Beside, a neat bundle of pale bamboo slips stands tied at the right, with a pale cloth wrapper
    folded over its top. The slips are pale yellow.
  exact:
    - The person's body sweeps down to the lower left; the second stroke is a straight vertical starting on it.
    - The wrapper's two strokes start together and fan apart, one sweeping left, the other right and turning across.
    - The small knot under the wrapper's right side ends touching the long stroke's start.
    - The long front stroke is the longest of the bundle and ends in a small hook upward at the right.
    - The long front stroke does not touch the wrapper's left stroke; there is a small gap.
  strokes:
    - where: a long sweep from the top left down and out to the bottom left
      part: the person's head and body, leaning left
    - where: a straight line down on the left, starting from the middle of the first stroke
      part: the person's leg, standing straight
    - where: a sweep from the top of the bundle down and out to the left
      part: the wrapper's left fold
    - where: a stroke at the upper right running down to the right and then across to the right
      part: the wrapper's right fold
    - where: a short stroke below the wrapper at the right, running down to the left
      part: the knot of the cord
    - where: a long stroke in the lower middle running down, turning across to the right and ending in a small hook upward
      part: the bundle's front slip and its base

倫:
  object: a person beside a neat bundle of bamboo slips laid in order
  history: >-
    The oldest forms drew a person near a bundle of slips arranged in order; the order of people's
    dealings is what holds society together.
  layout: >-
    A person stands on the left, with a friendly face with eyes, a nose and a mouth, and simple pale
    clothes. Beside, a neat bundle of pale yellow bamboo slips stands upright at the right under a
    folded cloth wrapper, tied around the middle with a cord.
  exact:
    - The person's body sweeps down to the lower left; the second stroke is a straight vertical starting on it.
    - The wrapper's two strokes start together and fan apart, one sweeping left, the other right and turning across.
    - The short line under the wrapper stands free, and is the cord's knot.
    - The bundle's three slips are plain verticals with no hooks; the left and the two right ones are about half as long as the bundle's outline.
    - The cord crosses the two right slips and does not touch the left slip.
    - The outline starts at the left slip's start, runs across and turns down on the right, ending in a small hook to the left.
  strokes:
    - where: a long sweep from the top left down and out to the bottom left
      part: the person's head and body, leaning left
    - where: a straight line down on the left, starting from the middle of the first stroke
      part: the person's leg, standing straight
    - where: a sweep from the top of the bundle down and out to the left
      part: the wrapper's left fold
    - where: a stroke at the upper right running down to the right and then across to the right
      part: the wrapper's right fold
    - where: a short line across under the wrapper, rising slightly to the right, standing free
      part: the knot of the cord
    - where: a short vertical line in the lower left
      part: the left bamboo slip
    - where: a stroke from the top of the left slip, across to the right, then turning down and ending in a small hook to the left
      part: the bundle's top edge and right side
    - where: a short line across in the lower middle, rising slightly to the right
      part: the cord binding the slips
    - where: a short vertical line in the middle of the bundle, crossing the cord
      part: the middle bamboo slip
    - where: a short vertical line at the right of the bundle, crossing the cord
      part: the right bamboo slip

亦:
  object: a man standing with arms out, and an arrow pointing at each armpit
  history: >-
    The oldest forms drew a standing man with a dot marking each armpit, to mean the armpit. The word
    is used for also.
  layout: >-
    A man stands facing us with his arms out wide, with a friendly face with eyes, a nose and a mouth, in a
    simple pale tunic. A small pale arrow points in at each armpit, one on each side. The man's head
    sits round the topmost dot.
  exact:
    - The arms are one long line across, rising slightly to the right.
    - The body is a long vertical starting from the middle of the arms, ending in a small hook up to the left.
    - The left leg starts below the arms and does not touch them; it is shorter than the body, about three quarters as long.
    - The two arrows stand free of every other stroke; the right one is a little longer than the left.
    - The dot at the top stands free.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the topknot on the man's head
    - where: a long line across the upper part, rising slightly to the right
      part: the man's arms, held out wide
    - where: a stroke from the upper left of the body running down and out to the lower left
      part: the man's left leg, striding
    - where: a long vertical stroke from the middle of the arms, slightly right of the centre, ending in a small hook up to the left
      part: the man's body and right leg, the hook his foot
    - where: a short stroke on the left, slanting down to the left
      part: the arrow pointing at the left armpit
    - where: a short stroke on the right, slanting down to the right and a little longer
      part: the arrow pointing at the right armpit

庆:
  object: a celebration in a house, with a joyful person taking part
  history: >-
    An ideogram: a house with a celebration in it and a person coming in to take part.
  layout: >-
    A house with a pale sloped roof covers the top and left of the frame. Inside it, a grown person
    stands facing us, arms stretched wide, legs apart, celebrating, with a joyful face with eyes, a nose
    and a mouth, and simple pale festive clothes.
  exact:
    - The roof's top dot stands free and does not touch the eave.
    - The eave rises slightly to the right and starts exactly where the left wall starts.
    - The left wall is the longest stroke, falling to the lower left.
    - The person stands apart from the left wall and the eave, with a small gap.
    - The person's arms and the right leg are about equal, about as long as the eave.
    - The person's body starts above the arms and crosses them, and the right leg starts on the arms where the body crosses.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the roof's peak ornament
    - where: a line across the top, rising slightly to the right
      part: the roof's eave
    - where: a long stroke from the left end of the eave running down and turning to a sweep to the bottom left
      part: the house's left wall and its slope
    - where: a long straight line across the middle, rising slightly to the right
      part: both arms, stretched straight out to the sides from hand to hand
    - where: a long sweep from the top centre, straight down through the arms, then curving out to the bottom left
      part: the neck and body, running down into the left leg
    - where: a long sweep from the centre of the arms down to the right and then across to the right
      part: the right leg, striding

慶:
  object: a celebration in a house, with a joyful person taking part
  history: >-
    An ideogram: a house with a celebration in it and a person coming in to take part.
  layout: >-
    A house with a pale sloped roof covers the top and left. Inside, a festive decoration hangs from
    the roof above a long table, and a pale red heart is painted on the cloth hanging below the table
    top. Below, a guest strides in through the door: only the legs, in pale trousers and shoes, are in
    the frame, and the guest's upper body is out of it.
  exact:
    - The roof's top dot stands free of the eave.
    - The eave rises slightly to the right and starts at the left wall's start; the left wall is the longest stroke.
    - The decoration is made of two lines across joined by two short verticals; the upper line ends in a small hook down to the left, and its end meets the end of the lower line.
    - The long line below, the table, is longer than the decoration, ends in a small hook down to the left, and stands free of the walls.
    - The heart is made of a small stroke on the left, a curved bowl and two dots above it; the bowl ends in a small hook up to the left.
    - The two dots of the heart stand free, and so does its left stroke; none of them touches the table.
    - The three strokes of the guest's legs all start together at the top centre of the foot, the first sweeping to the lower left and the last running down to the right and then across.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the roof's peak ornament
    - where: a line across the top, rising slightly to the right
      part: the roof's eave
    - where: a long stroke from the left end of the eave running down and turning to a sweep to the bottom left
      part: the house's left wall and its slope
    - where: a line across in the upper middle, ending in a small hook down to the left
      part: the decoration's upper string
    - where: a short vertical line crossing the upper string, left of the middle
      part: a left hanging tassel
    - where: a short vertical line crossing the upper string, right of it
      part: a right hanging tassel
    - where: a line across below the upper string, rising slightly to the right, meeting its end
      part: the decoration's lower string
    - where: a long line across the middle, ending in a small hook down to the left
      part: the long table
    - where: a short stroke below the table at the left, slanting down to the left
      part: the heart's left curve
    - where: a stroke below the table's middle, running down to the right, then across and rising, ending in a small hook up to the left
      part: the heart's bowl
    - where: a small dot above the bowl, slanting down to the right
      part: a left spark of the heart
    - where: a small dot above the bowl at the right, slanting down to the right
      part: a right spark of the heart
    - where: a stroke sweeping down to the left from the centre of the lower part
      part: the guest's left leg, striding in
    - where: a stroke across, rising to the right, then turning down and curving to the lower left, from the lower centre
      part: the guest's upper leg, folding forward into the foot
    - where: a stroke from the lower centre running down to the right and then across to the right
      part: the guest's right leg, striding out

寺:
  object: a hand holding up a little mound of earth as an offering
  history: >-
    An ideogram: an offering of earth in a hand, as in a temple or court.
  layout: >-
    A small pale brown mound of earth sits above, in layers, and under it an open hand holds it up, seen
    from the palm side with the thumb on the lower left, in a pale sleeve. The mound is clear of the hand's
    palm line.
  exact:
    - The earth's top layer is short, and the base layer below is long; the base is more than twice as long as the top layer, about two and a quarter times.
    - The mound's vertical crosses the top layer and ends on the base layer, in a plain point with no hook.
    - The hand's long vertical starts on the base and ends in a small hook up to the left; it does not touch the base layer, with a small gap.
    - The hand's line across is clearly shorter than the base, about three quarters as long.
    - The thumb dot stands free of every stroke.
  strokes:
    - where: a short line across the upper middle, rising slightly to the right
      part: the top layer of the mound
    - where: a stroke from the top centre running down to the right and then straight down, crossing the top layer
      part: the mound's central ridge
    - where: a long line across, below the middle of the earth, rising slightly to the right, spanning the whole width
      part: the base of the mound
    - where: a line across below it, shorter than the base
      part: the palm held flat
    - where: a long line down from above the palm line, crossing it, ending in a small hook up to the left
      part: the forearm, with the wrist turning
    - where: a small dot on the lower left, slanting down to the right
      part: the thumb

延:
  object: a foot stopped on a road by a bar across its way
  history: >-
    An ideogram: a foot stopped on the road, so that it delays and drags on.
  layout: >-
    A pale road winds down the left and runs out to the right across the bottom. A bare foot stands on the
    right of the road, in the middle, stopped by a pale slanting wooden bar across its path at the
    top. The road is pale tan, the foot warm pale peach.
  exact:
    - The bar slopes down to the left and its middle sits on the foot's first stroke; the foot is below it.
    - The ankle is a short stroke, with a small toe stroke across to the right starting at its middle.
    - The ankle's end touches the middle of the foot's long stroke, which starts to the left of the ankle and runs down, then turns across to the right as the sole.
    - The road's first stroke is long and has three bends; it is the longest stroke of the picture.
    - The road's second stroke crosses the first at its middle and sweeps to the lower right, a little shorter than the first, about five sixths as long.
    - The foot and the road's long tail do not touch; there is a small gap.
  strokes:
    - where: a short stroke at the top, running left and then turning down to the left
      part: the bar across the foot's way, a wooden barrier
    - where: a stroke from the middle of the bar, running down to the right and then straight down
      part: the foot's upright heel and ankle
    - where: a short line across to the right, from the middle of the ankle, rising slightly
      part: the foot's toes
    - where: a stroke starting left of the ankle, running down and turning across to the right, meeting the ankle's end in the middle
      part: the foot's long stroke and its sole
    - where: a long stroke from the top left across and rising to the right, turning down, turning across, then curving down to the lower left
      part: the first stretch of the road
    - where: a long stroke from the middle left running down to the right and then across to the right
      part: the road's long way out, to the right
