    - where: a long line across the middle, from the far left to the far right
      part: the staff line, the whole piece of music
    - where: a short line down at the left of the lower middle
      part: the left corner of the singing mouth
    - where: a line across the top of the mouth, turning down at its right end
      part: the upper lip and the right corner
    - where: a short line across inside the mouth, rising slightly to the right
      part: the tongue
    - where: a line across at the mouth's bottom, rising to the right
      part: the lower lip
    - where: a stroke at the bottom left going down to the left
      part: the person's left leg
    - where: a stroke starting at the mouth's lower corner going down to the right, then across and rising at its end
