竟:
  object: a person singing a piece of music to its end, with notes above
  history: 'An ideogram: a person 儿 finishing a piece of music 音, at last.'
  layout: >-
    A person stands at the bottom, facing front, with a friendly face, a cap and simple pale clothes,
    singing; the wide-open mouth is the middle square of the strokes. Above, pale musical notes on a
    long staff line float up. Pale colours, nothing dark.
  exact:
    - The small dot and the line across at the top do not touch each other; the line across is more than half as long as the staff line.
    - The two small note marks hang under the top line across and do not touch the staff line; the right one touches the top line and ends on the staff line.
    - The staff line across is the longest line, about twice as long as the line across at the top.
    - The mouth is a square; the line across inside it is shorter than the top of the square, about half as long.
    - The person's two legs start at the mouth's lower corner; the left leg is short and the right leg is longer and ends in a rising hook; a small gap separates the left leg from the mouth's left side.
  strokes:
