    mouth). At the right a brave person with a friendly face and simple pale clothes raises a stick
    and swings it toward the beast. Pale colours; the stick is a pale brown rod.
  exact:
    - The horn is a short stroke across rising to the right then turning down; its end touches the beast's back line without touching the long vertical.
    - The beast's back is the longest line across; the beast's long vertical starts on it and is clearly longer than the front line down.
    - The two small marks on the beast's front touch it and stand clear of the long vertical.
    - The rising line at the bottom crosses the long vertical and ends where the front line ends.
    - The stick's stroke comes down to the left and ends near the beast; the person's two sweeps cross each other.
