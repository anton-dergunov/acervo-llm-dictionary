    servant stands facing left with a friendly face, a pale cap and simple clothes, holding out one
    hand. The house is pale cream; the clothes pale blue.
  exact:
    - The small dot at the roof's top stands free; the roof starts at the top of the wall.
    - The servant's line across the middle is the longest line across, clearly longer than the shorter line above and below it, and crosses the long vertical.
    - The servant's vertical runs from the roof down to the bottom and ends in a hook to the left; it starts on the middle of the roof.
    - The wall does not touch the servant's long line across; there is a small gap.
    - The servant's two small strokes at the lower left stand free and do not touch each other.
    - The servant's right leg starts on the vertical, and the short stroke from the right touches it.
