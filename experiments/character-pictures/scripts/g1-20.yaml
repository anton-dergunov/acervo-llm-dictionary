      part: the left leaf's upper hinge
    - where: a small dot rising to the right on the left leaf, lower down
      part: the left leaf's lower hinge
    - where: a short line down at the top of the right half
      part: the right leaf's inner edge
    - where: a long stroke starting together with it, across the top and turning down the right side, ending in a hook up to the left
      part: the right leaf's top and the door's right post
    - where: a small dot at the upper right of the right leaf, rising slightly
      part: the right leaf's handle
    - where: a short line across below the inner edge, rising slightly to the right, ending on the top line's side
      part: the right leaf's panel line
    - where: a line across the middle of the door, rising slightly to the right, longer than any other line across
      part: the bar laid across both leaves
    - where: a vertical line down the middle, crossing the bar, ending in a small hook up to the left
