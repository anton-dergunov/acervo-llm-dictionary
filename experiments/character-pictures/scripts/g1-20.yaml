閉:
  object: a door shut with a bar across it
  history: 'An ideogram: a double door 門 blocked by a bar 才, shut.'
  layout: >-
    A double door fills the frame, its two leaves standing side by side as a pale wooden gate, with
    a pale brown bar laid across both leaves at the middle and a second bar crossing it, held by a
    brace slanting down to the left. Nothing grows from the bars.
  exact:
    - The left post of the door is a plain straight line down; the line across and turning down at its top starts at the post's top.
    - The two small dots on the left leaf touch the post and do not touch the leaf's top line.
    - The right leaf's inner line starts together with the right leaf's top line; the top line turns down on the right and ends in a hook up to the left at the bottom.
    - The bar across the middle is the longest line across, much longer than any line across in the door's top.
    - The vertical bar crosses the bar across at its middle and ends in a small hook up to the left; it is clearly shorter than the left post, a little over half as long.
    - The brace starts on the vertical bar and does not touch the bar across.
  strokes:
