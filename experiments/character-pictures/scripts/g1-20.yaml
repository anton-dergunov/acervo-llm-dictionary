# Full run, group g1, batch 20. Written from the fact sheets, following scripts/GUIDE.md.

鹿:
  object: a deer standing with an antlered head, its body, two legs and a tail
  history: >-
    The oldest forms drew a deer in profile with branching antlers, a body, two legs and a short
    tail. The modern form turned the antlers into a roof-like top and the legs into two side-by-side
    strokes.
  layout: >-
    The deer fills the square and faces left. Its antlers spread across the top, its back and body lie
    in the middle, and its two legs and short tail fill the lower part. The coat is pale tan with a
    cream belly; the deer has a gentle face with two eyes, a nose and a mouth, drawn behind the strokes.
  exact:
    - The small dot at the top stands free of every other stroke.
    - The long stroke down the left side starts at the left end of the line across the top and curves down to the bottom left.
    - The line across the top rises very slightly to the right and does not touch the two short verticals below it; there is a small gap.
    - The line across the middle starts on the long left stroke, turns down to the left at its right end, and crosses both short verticals.
    - The two short verticals both end on the short line across below them.
    - The short rising stroke touches the back leg in its middle and stands clear of the front leg; the belly line does not touch the back leg's start.
    - The long right leg is clearly longer than the short sweep above it, and a small gap separates it from the line across above.
  strokes:
    - where: a small slanting dot at the top centre, standing free
      part: the tip of the highest antler
    - where: a line across the upper part, rising very slightly to the right, starting at the top of the left stroke
      part: the main beam of the antlers, spreading across the head
    - where: a long stroke down the left side from the left end of the line across, curving down to the bottom left
      part: the deer's neck and back, running down into its hindquarters
    - where: a line across the middle, from the left stroke to the right, turning down to the left at its right end
      part: the deer's back and rump
    - where: a short line down in the middle, crossing the line across
      part: the deer's neck
    - where: a short line down, a little to the right of the neck, crossing the line across
      part: the deer's shoulder
    - where: a short line across below, rising slightly to the right, meeting the end of the line across above
      part: the deer's belly
    - where: a short stroke rising to the right at the lower left, touching the long left leg
      part: the hoof of the back leg, stepping forward
    - where: a longer stroke down in the left half, turning up to the right at its end
      part: the deer's back leg, the rising end its hoof
    - where: a short sweep down to the left at the right, ending at the start of the long right stroke
      part: the deer's short tail
    - where: a long stroke starting from the tail, going down to the right, then across to the right and turning up at its end
      part: the deer's front leg, the rising end its hoof

宿:
  object: a person sleeping in a bed under a roof
  history: 'An ideogram: a person 亻 sleeping in a bed 百 under a roof 宀, to lodge for the night.'
  layout: >-
    A pitched roof covers the top. Under it, at the left, a person with a peaceful face, closed eyes
    and a simple pale night robe lies tucked in; at the right a bed with a pale blue blanket and a
    pillow. The roof is pale terracotta; the bedding is pale.
  exact:
    - The small dot at the roof's top stands free; it does not touch the line across below it.
    - The roof's left edge touches the start of the line across, which ends in a small hook down to the left; its right end does not touch the bed.
    - The person's second stroke is a plain straight line down, much longer than the first stroke's first leg, and starts on the middle of the first stroke.
    - The bed's top line across does not touch the roof or the person.
    - The short stroke under the bed's top line touches it; a small gap separates it from the long vertical below.
    - The long vertical down the bed's middle is almost as long as the person's straight line, and has no hook.
    - The line across the bed, ending in a hook to the left, starts where the short stroke ends and meets the bottom line at its end; the two short lines across touch the long vertical.
  strokes:
    - where: a small slanting dot at the top centre
      part: the roof's peak
    - where: a short line down at the left, under the peak
      part: the roof's left eave
    - where: a line across, starting at the left eave, ending in a small hook down to the left at its right end
      part: the roof's ridge and right eave
    - where: a stroke down at the left, turning down to the left at its end
      part: the sleeping person's back and head
    - where: a long straight line down from the middle of the first stroke, with no hook
      part: the sleeping person's body and legs
    - where: a line across the top of the right half, rising slightly to the right
      part: the bed's headboard
    - where: a short line down just under the headboard, touching it
      part: the pillow
    - where: a long straight line down the bed's middle, with a small gap under the pillow
      part: the bed's left post
    - where: a line across, turning down at its right end and ending in a small hook to the left
      part: the bed's frame, the right post
    - where: a short line across in the middle, rising slightly to the right
      part: the blanket's fold
    - where: a short line across at the bottom, rising slightly to the right, ending where the frame ends
      part: the bed's base

您:
  object: a person speaking kindly to you, with a heart below
  history: 'An ideogram: the word for you 你 with a heart 心 under it, you said with affection.'
  layout: >-
    At the top left a person stands facing right, with a friendly face, eyes, a nose and a smiling
    mouth, and simple pale clothes. At the top right, beside the person, a small plain knife with a
    little sprout of three tiny sparks under it, drawn small and simple. Below, filling the width, a
    soft pale red heart.
  exact:
    - The person's second stroke starts on the middle of the first stroke and is a plain straight line down, a little shorter than the first stroke plus its turn.
    - The small knife's blade is a line across rising to the right, ending in a hook down to the left; it starts on the small sweep above it.
    - The blade and the sprout's stem do not touch; the stem is a sweep ending in a hook up to the left, and the two tiny sparks beside it are short and stand free.
    - The heart's four strokes stand free of each other and of the upper part.
    - The heart's long curve runs from the upper left down, along the bottom to the right and up, ending in a hook up to the left.
  strokes:
    - where: a stroke at the top left going down, turning down to the left
      part: the person's head, back and body
    - where: a straight line down from the middle of the first stroke
      part: the person's legs
    - where: a short stroke at the top centre, down and turning to the left
      part: the small knife's handle
    - where: a line across, rising slightly to the right, starting on the handle and ending in a small hook down to the left
      part: the small knife's blade
    - where: a sweep from the upper middle going down to the right, then down, ending in a small hook up to the left
      part: the little sprout's stem
    - where: a short stroke down to the left, beside the stem on its left
      part: the sprout's left spark
    - where: a short stroke down to the right, beside the stem on its right
      part: the sprout's right spark
    - where: a short stroke on the left of the lower part, down and a little to the left
      part: the heart's left edge
    - where: a long curve from left of centre down to the bottom, along the bottom to the right and up, ending in a hook up to the left
      part: the heart's rounded lower body
    - where: a short dot near the top centre, slanting down to the right
      part: a vessel rising from the heart
    - where: a short dot at the upper right, slanting down to the right
      part: a second vessel at the heart's upper right

鳥:
  object: a bird, with its head, eye, body and tail, standing on its feet
  history: >-
    The oldest forms drew a bird in profile, with a beak, an eye, a body, a tail and legs. In the
    modern form the legs became four dots.
  layout: >-
    The bird stands facing left, filling the square from the crest to the feet. Its head and eye are
    at the top, its body and long tail run down on the right, and its four feet stand at the bottom.
    The plumage is pale blue-grey with cream, and it has a small yellow beak and a friendly round eye.
  exact:
    - The head's first stroke ends on the head's left line; the line across the top of the head starts at the same place and ends in a turn down to the left.
    - The three short lines across inside the head touch the head's left line and do not reach its right side; they are the shortest at the top and nearly as long as each other below.
    - The long stroke of the body starts at the lower end of the head's left line, goes across to the right, turns down and ends in a small hook up to the left; its first leg is the longest line in the bird.
    - The four feet stand free of the body and of each other; the first is a short vertical, the other three are short slanting strokes.
  strokes:
    - where: a small stroke at the top, down to the right and turning down to the left
      part: the bird's crest
    - where: a long stroke down the left side of the head, down to the right at its top and then straight down
      part: the front of the bird's head and its breast
    - where: a line across from the top of the head to the right, then turning down to the left
      part: the top of the bird's head and its back
    - where: a short line across rising to the right, in the upper head, touching the left line
      part: the bird's eye line
    - where: a longer line across rising to the right, under it
      part: the bird's cheek feathers
    - where: a line across, rising slightly to the right, under it, starting on the left line
      part: the bird's neck feathers
    - where: a long line across to the right from the bottom of the left line, turning down and ending in a small hook up to the left
      part: the bird's body and tail
    - where: a short straight vertical at the bottom left, standing free
      part: the bird's back toe
    - where: a short dot at the bottom, slanting down to the right
      part: the bird's front toe
    - where: a short dot at the bottom centre, slanting down to the right
      part: the bird's second front toe
    - where: a short stroke slanting down to the right at the bottom, to the right of the toes
      part: the bird's last toe

康:
