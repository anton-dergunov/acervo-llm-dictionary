      part: the hand's thumb and wrist

等:
  object: bamboo strips laid before a hand holding up a mound of earth
  history: 'An ideogram: bamboo strips ⺮ laid out before a court 寺, to wait and be in order.'
  layout: >-
    Two bamboo stalks with leaves hang at the top. Beneath them, a hand holds up a little mound of
    earth as an offering. The bamboo is pale green; the earth pale brown.
  exact:
    - The bamboo's strokes stand free of the mound's, except the second stalk's end near the mound's ridge.
    - The mound's line across the upper middle is short and rises slightly to the right, crossing the ridge stroke.
    - The base line across is the longest line across; the palm line is about three quarters as long as the base.
    - The forearm is a long line down ending in a hook up to the left, crossing the palm line, and is the longest vertical.
    - The thumb is a small dot at the lower left and does not touch the palm line; there is a small gap.
  strokes:
    - where: a short stroke at the top left going down to the left
      part: a leaf hanging from the left stalk
    - where: a short line across below it, rising slightly to the right
      part: a twig on the left stalk
    - where: a small dot below it, slanting down to the right
      part: a second leaf of the left stalk
    - where: a short stroke at the top of the right half, going down to the left
      part: a leaf hanging from the right stalk
    - where: a short line across below it, rising slightly to the right
      part: a twig on the right stalk
    - where: a small dot below it, slanting down to the right
      part: a second leaf of the right stalk
    - where: a line across the upper middle, rising slightly to the right
      part: the mound's top layer
    - where: a short stroke from the top centre, going down to the right then straight down, crossing the top layer
      part: the mound's central ridge
    - where: a long line across below the middle, rising slightly to the right, spanning the width
      part: the mound's base
    - where: a line across below it, a little shorter than the base
      part: the hand's flat palm
    - where: a long line down from above the palm, crossing it, ending in a small hook up to the left
      part: the forearm, the hook the wrist
    - where: a small dot at the lower left, slanting down to the right
      part: the hand's thumb

番:
  object: seeds scattered from a bag onto a field
  history: 'An ideogram: sowing seeds 米 on a farm 田, to take turns, to sow.'
  layout: >-
    At the top, the mouth of a seed sack tips to the left. A spray of rice seeds falls from it,
    fanning out in the middle, and lands on a rice paddy at the bottom, a square field divided into
    four plots by raised banks. Pale yellow seeds, pale green paddy.
  exact:
    - The sack's mouth is a long stroke tilting down to the left; it does not touch the left seed.
    - The seed spray's line across is the longest line across and crosses the vertical; the vertical starts on the sack's mouth and ends above the field.
    - The two sweeps start on the line across and do not touch each other; the left one goes down to the left, the right one down to the right.
    - The field's left bank, bottom bank and the vertical bank inside are all inside the box formed by the top and right banks; the bottom bank ends on the top bank's end.
    - The field's middle bank across crosses the vertical bank.
  strokes:
    - where: a stroke at the top, tilting from the right to the left, then turning down to the left
      part: the mouth of the seed sack
    - where: a small dot at the left, slanting down to the right, standing free
      part: a seed falling to the left
    - where: a short stroke at the upper right, going down to the right, turning down to the left, standing free
      part: a seed falling to the right
    - where: a long line across the upper middle
      part: the line of scattered seeds
    - where: a line down from the sack's mouth, down to the right then straight down, crossing the line of seeds
      part: the stream of seeds falling
    - where: a sweep from the middle of the line of seeds down to the left
      part: the seeds fanning to the left
    - where: a stroke from the middle of the line of seeds, going down to the right and then across to the right
      part: the seeds fanning to the right
    - where: a straight line down the left side of the field
      part: the bank along the left edge
    - where: a line across the top of the field, turning down at the top right to run down the right side
      part: the banks along the top and the right edge
    - where: a short line across the middle of the field, rising slightly to the right
      part: the bank dividing upper from lower plots
    - where: a short line down the middle of the field
      part: the bank dividing the left plots from the right
    - where: a line across the bottom of the field, rising slightly to the right
      part: the bank along the bottom edge

集:
  object: birds flocking on a tree
  history: 'An ideogram: birds 隹 gathering on a tree 木, to gather, a collection.'
  layout: >-
    A tree with a plain trunk stands in the lower half, with branches spreading out. On its branches
    a bird sits in the upper half, with a few small pale birds behind it, all with beaks and round
    eyes. The birds are pale blue-grey; the tree is pale green and brown.
  exact:
    - The small dot at the top stands free; the bird's wing line below it does not touch the bird's back.
    - The bird's breast line is clearly shorter than the tree's trunk, a little over half as long.
    - The bird's three short lines across are all about the same length, clearly shorter than the line across at its bottom.
    - The tree's branches line across is the longest line across; its trunk is a straight vertical ending in a plain point with no hook.
    - The tree's two roots start on the trunk where it crosses the branches and do not touch each other.
  strokes:
    - where: a stroke at the top left, down and turning down to the left
      part: the bird's back and tail
    - where: a straight line down in the left half, starting on the first stroke
      part: the bird's breast
    - where: a small dot at the top centre, slanting down to the right, standing free
      part: the bird's head tuft
    - where: a line across at the top, rising slightly to the right
      part: the bird's wing top
    - where: a shorter line across below it, rising slightly to the right
      part: the bird's wing feathers
    - where: a line across just below, rising slightly to the right
      part: the bird's lower wing feathers
    - where: a stroke from the wing top, down to the right then straight down, crossing the two lines above
      part: the bird's neck
    - where: a longer line across at the bottom of the bird, starting at the end of the breast
      part: the branch the bird perches on
    - where: a long line across the upper part of the lower half
      part: the tree's branches, spreading out to both sides
    - where: a long straight line down the middle, crossing the branches and ending in a plain point
      part: the tree's trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the tree's root, spreading left
    - where: a sweep from the centre of the trunk down and out to the bottom right
      part: the tree's root, spreading right

游:
  object: a child swimming freely in the sea under a pennant
  history: 'An ideogram: to swim freely 斿 through the seas 氵, a child under a pennant roaming the waters.'
  layout: >-
    Pale blue sea water fills the left side, with waves. In the middle a small pennant flies from a
    pole. At the right a child swims, with a happy face, eyes, a nose and a smile, simple pale
    swimwear, arms stretched out. Streamers float above the child.
  exact:
    - The three water strokes stand free of every other stroke; the rising one at the bottom is the longest of them.
    - The pennant's top is a line across, rising slightly to the right, and the pole sweeping down to the left starts on its middle.
    - The pennant's hanging stroke starts on the pole and turns down, then to the left, ending in a hook up to the left.
    - The streamers hang from the top right and the rising stroke starts on the middle of the first.
    - The child's body is a long vertical with a hook up to the left, crossing the longest line across, which is clearly shorter than the body.
    - The child's head stroke ends where the body starts.
  strokes:
    - where: a small slanting stroke at the top left
      part: a drop of spray at the top of the water
    - where: a small dot slanting down to the right, lower on the left
      part: a second drop of spray
    - where: a longer stroke at the bottom left, rising upward to the right
      part: a curling wave in the sea
    - where: a small dot at the top centre, slanting down to the right
      part: the top of the pennant's pole
    - where: a line across in the upper middle, rising slightly to the right
      part: the pennant's top edge
    - where: a long stroke starting in the middle, going down to the right then down, then turning down to the left with a small hook up to the left
      part: the hanging pennant, fluttering
    - where: a stroke from the middle of the top edge, going down and turning down to the left
      part: the pennant's pole
    - where: a stroke at the top right, going down and turning down to the left
      part: a streamer hanging
    - where: a line rising to the right across the streamer
      part: a second streamer blowing
    - where: a line across, rising slightly to the right, then turning down to the left at its right end
      part: the child's head and shoulder
    - where: a long line down from the child's neck, ending in a hook up to the left
      part: the child's body and kicking leg
    - where: a line across the middle of the child's body to the right
      part: the child's outstretched arms

普:
  object: two people sitting together on a bench under the sun
  history: 'An ideogram: everyone 並, two people side by side, under the sun 日.'
  layout: >-
    Two people sit side by side on a long bench, both with friendly faces, hair and simple pale
    clothes, the one on the left slightly smaller. Under the bench, at the bottom, a round pale
    yellow sun shines, a glow reaching up to them. Pale colours.
  exact:
    - The bench is the longest line across, spanning the whole width; the shoulders line is shorter than the bench, about half as long.
    - The two bodies are long verticals down from the shoulders line; the right body is straight, and the left body goes down slightly to the right at its top.
    - The left hand is a small dot that stands free; the right arm stands free and ends near the right body.
    - The sun's left rim and the line across its top start together; the sun is narrower than half the width.
    - The sun's two inner lines across rise slightly to the right and are clearly shorter than its top; the bottom one is a little longer than the middle one.
  strokes:
    - where: a small dot at the upper left, slanting down to the right
      part: the left person's hair
    - where: a stroke at the upper middle-right, going down to the right and turning down to the left
      part: the right person's hair
    - where: a line across, rising slightly to the right, from left to right
      part: the two people's shoulders
    - where: a line down from the shoulders, left of centre, slanting slightly right at the top
      part: the left person's body
    - where: a straight line down from the shoulders, in the middle
      part: the right person's body
    - where: a small dot at the left, slanting down to the right, standing free
      part: the left person's hand resting on the bench
    - where: a short stroke on the right, sloping down to the left, standing free
      part: the right person's arm
    - where: a long line across the middle, from the far left to the far right
      part: the bench they share
    - where: a long straight line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, rising slightly to the right, turning down at the right and ending in a hook to the left
      part: the sun's top and right rim
    - where: a short line across the middle of the sun
      part: the band of light at its heart
    - where: a line across the bottom of the sun
      part: the sun's bottom rim

喜:
  object: a drum on a stand above a singing mouth
  history: 'An ideogram: a drum 壴 being beaten above a singing mouth 口, joy.'
  layout: >-
    A festive drum with a crossed ornament on top stands on a table in the upper part. Below it,
    a wide singing mouth with friendly lips; pale musical notes float up from it. The drum is pale
    red with cream trim.
  exact:
    - The ornament on top is a line across crossed by a vertical, with a shorter line across below it touching the vertical's end.
    - The drum's body is a square frame; its left side is a short stroke and its top is a line across turning down at the right, ending in a small hook down to the left.
    - The line across inside the drum is about as long as the ornament's lower line; it is shorter than the table.
    - The small dot at the lower left of the drum stands free.
    - The table is the longest line across; the singing mouth under it stands clear of the table, with small gaps.
    - The mouth's left side and the top lip start together; the bottom lip meets the left side's end.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the crossbar of the drum's ornament
    - where: a vertical stroke crossing it, down to the right and then straight down
      part: the ornament's post
    - where: a shorter line across below, touching the post's end
      part: the ornament's base
    - where: a short stroke on the left of the drum, slanting down to the right
      part: the drum's left side
    - where: a line across the top of the drum, rising slightly to the right, turning down at the right and ending in a small hook down to the left
      part: the drum's top and right side
    - where: a shorter line across inside the drum
      part: the drum's middle band
    - where: a small dot below the drum's left side, standing free
      part: the drum's left stud
    - where: a short stroke on the right, down and turning down to the left
      part: the drum's right stud and hanging tassel
    - where: a long line across, rising slightly to the right, spanning the width
      part: the table the drum stands on
    - where: a short straight line down on the left of the lower part
      part: the left corner of the singing mouth
    - where: a line across the top from the left, ending in a small hook down to the left
      part: the upper lip, curving down into the right corner
    - where: a line across the bottom, rising slightly to the right
      part: the lower lip

援:
  object: a hand leading another hand, a helping hand
  history: 'An ideogram: to lead 爰 by the hand 扌, a hand held out to help.'
  layout: >-
    At the left, an open hand seen from the palm side, its wrist below, reaches toward the right.
    At the right, a second hand reaches down from the top, its three fingers hanging, and below it a
    sleeve and forearm. Pale skin tones; plain pale sleeves.
  exact:
    - The hand's long vertical crosses both lines across and ends in a hook up to the left at the bottom; it is the longest vertical.
    - The lower line across on the left is the longest and rises to the right; the upper one is about two thirds as long.
    - The right hand's top stroke runs across and turns down to the left; its three fingers stand free of each other.
    - The upper line across on the right is about two thirds as long as the lower one, which crosses the sweep.
    - The sweep ends near, but does not touch, the left hand's wrist.
  strokes:
    - where: a line across in the upper middle of the left hand, rising to the right
      part: the fingers spreading out
    - where: a long line down the centre of the left hand, ending in a small hook up to the left, crossing the lines across
      part: the middle finger down through the palm to the wrist
    - where: a longer line across below the middle of the left hand, rising to the right
      part: the thumb and little finger, spread wide
    - where: a stroke at the top of the right hand going left, turning down to the left
      part: the back of the right hand
    - where: a small dot slanting down to the right, under it
      part: the right hand's left finger
    - where: a small dot slanting down to the right, to the right of it
      part: the right hand's middle finger
    - where: a short stroke at the right, going down to the right then down to the left
      part: the right hand's right finger
    - where: a line across the middle of the right side, rising to the right
      part: the cuff of the sleeve
    - where: a longer line across below it, rising to the right, crossing the sweep
      part: the sleeve's lower edge
    - where: a sweep from the cuff down to the left
      part: the forearm leading across
    - where: a stroke rising to the right from the middle of the sweep, turning down, then down to the left
      part: the second hand's thumb
    - where: a stroke from the sweep going down to the right, then across to the right
      part: the second hand's palm and wrist

曾:
  object: a rice cooker over heat, steam rising and letting off
  history: 'An ideogram: a rice cooker on heat 日, building up steam 丷 and letting it off.'
  layout: >-
    Two puffs of pale steam rise at the top. Below them a round-lidded pot sits with small vents on
    the lid, and under it a little stove glows pale orange. The pot is pale grey; the glow soft.
  exact:
    - The two steam marks stand free of each other and of the pot; the right one is longer.
    - The pot's left handle starts where the lid's line across starts; the lid's line across is much longer than the pot's base, and turns down to the left at its end.
    - The pot's vertical vent line starts on the lid and ends on the base; the two small vents on either side stand free.
    - The base line across begins at the end of the handle and ends where the lid's end ends.
    - The stove's two vertical lines and the bottom line enclose it; the middle bar of the stove touches the left side only.
  strokes:
    - where: a small slanting dot at the top left
      part: a puff of steam rising
    - where: a stroke at the top right, going down to the right and then turning down to the left
      part: a second, longer puff of steam
    - where: a stroke at the left, going down to the right
      part: the pot's left handle
    - where: a very long line across from the top of the handle, turning down to the left at its right end
      part: the pot's lid and its right side
    - where: a short line down in the middle, from the lid
      part: the lid's vent
    - where: a small dot at the left, slanting down to the right, standing free
      part: a small vent on the left
    - where: a short stroke on the right, sloping down to the left, standing free
      part: a small vent on the right
    - where: a line across the lower part, from the end of the handle to the end of the lid
      part: the pot's base
    - where: a short straight line down on the left of the stove
      part: the stove's left wall
    - where: a line across the top of the stove, turning down at the right to run down the right side
      part: the stove's top and right wall
    - where: a short line across the middle of the stove, rising slightly to the right
      part: the glowing grate
    - where: a line across the bottom of the stove, rising slightly to the right
      part: the stove's floor

黑:
  object: a man's face blackened by soot from a fire
  history: 'An ideogram: a man blackened by the soot of a fire 灬, black.'
  layout: >-
    At the top, a man's face with a friendly expression, a pale grey smudge of soot on his cheeks and
    forehead; he has a cap, eyes, a nose and a mouth, and simple pale clothes. Below him, at the
    bottom, a row of four small flames, a pale orange fire. The soot is light grey, never dark.
  exact:
    - The two eyes are separate dots at the top of the face; the right eye is a short vertical, the left a dot.
    - The face's left side and the forehead line start together; the mouth line starts at the end of the left side and ends where the forehead's right side ends.
    - The long vertical down the middle crosses the mouth line and the line below it, and ends on the shoulders line.
    - The shoulders line across is the longest line across.
    - The four flames stand free of every other stroke; the right one is the longest, the left one is a plain vertical.
  strokes:
    - where: a straight line down the face's left side
      part: the man's left cheek
    - where: a line across the top of the face from the left, turning down at its right end
      part: the man's forehead and right cheek
    - where: a small dot at the upper left, slanting down to the right
      part: the man's left eye
    - where: a short stroke down at the upper right
      part: the man's right eye
    - where: a short line across the lower face, rising slightly to the right, from the end of the left cheek
      part: the man's mouth
    - where: a long line down the middle from the forehead, down to the right then straight down
      part: the man's nose, running down to his neck
    - where: a line across lower down, rising slightly to the right, crossing the nose line
      part: the man's chin
    - where: a long line across at the bottom of the figure, longer than any other
      part: the man's shoulders
    - where: a short vertical at the bottom left
      part: the left flame
    - where: a small dot at the bottom, slanting down to the right
      part: the second flame
    - where: a short stroke at the bottom centre, down to the right
      part: the third flame
    - where: a longer stroke at the bottom right, down to the right
      part: the right flame, flaring out

絕:
  object: a knife cutting a thread
  history: 'An ideogram: a knife 刀 cutting a skein of silk thread 糹, to cut off; 巴 gives the sound.'
  layout: >-
    At the left, a pale silk thread hangs in loops with its cut ends frayed at the bottom. At the
    upper right a small knife with a pale steel blade cuts it. Below the knife, a small coiled
    snake rests, drawn small and simple. Pale colours.
  exact:
    - The thread's first stroke ends in a small hook across to the right and touches the second; the second is a plain loop ending in a hook up to the right.
    - The thread's three frayed ends are short and stand free of the loops and of each other.
    - The knife's blade is a line across rising slightly to the right, turning down and ending in a hook to the left; its inner stroke starts at its start.
    - The snake's head stroke ends in a hook down to the left; the small dot touches it; its lower line across is shorter than the head stroke.
    - The snake's long coil starts at the thread's end and goes down, across, and up at its end; it is the longest line in the snake.
  strokes:
    - where: a stroke at the upper left, going down, ending in a hook across to the right
      part: the thread's upper loop
    - where: a stroke below it going down to the left, ending in a hook up to the right
      part: the thread's lower loop
    - where: a small dot below the loops, slanting down to the right
      part: the thread's cut end
    - where: a short stroke at the bottom left, down to the right
      part: the first frayed end
    - where: a small dot beside it, slanting down to the right
      part: the second frayed end
    - where: a small dot nearer the loops, slanting down to the right
      part: the third frayed end
    - where: a line across the top of the right half, rising slightly to the right, turning down and ending in a hook to the left
      part: the knife's back and handle
    - where: a short stroke from the start of the knife's back, going down and turning down to the left
      part: the knife's blade edge
    - where: a line across below, rising slightly to the right, ending in a small hook down to the left
      part: the snake's head and back
    - where: a small dot, down, touching the head
      part: the snake's eye
    - where: a line across lower, rising slightly to the right, shorter than the first
      part: the snake's middle coil
    - where: a long stroke starting at the head, going down, then down to the right, then across and rising, turning up at the end
      part: the snake's tail coil, the end curling up

甦:
  object: a young shoot growing from a pot, brought back to life
  history: 'An ideogram: granting an additional 更 life 生, to come back to life.'
  layout: >-
    At the left a small pot with a lid and a stand sits on a bank of earth that sweeps out to the
    right. At the right a young shoot grows from the soil, its stem straight, with leaves in pairs.
    Pale green leaves, pale brown pot and soil.
  exact:
    - The line across the pot's top is shorter than the pot's top rim; the pot's side starts at its middle.
    - The pot's two inner lines across stand clear of its rim, one above the other; the lower one is a little longer.
    - The stand's sweep crosses the pot's inner lines and ends at the bank.
    - The bank is the longest curve; it starts at the left, goes down and across and ends at the right.
    - The shoot's stem is a straight vertical, longer than the pot's side; its leaves cross it and the upper pair is slightly longer than the lower pair.
    - The ground line is the longest line across and is touched by the stem's end.
  strokes:
    - where: a short line across at the top left, rising slightly to the right
      part: the pot's lid
    - where: a short line down at the left of the middle
      part: the pot's left side
    - where: a line across, rising slightly to the right, then turning down at its right end
      part: the pot's top rim and right side
    - where: a short line across inside the pot, rising slightly to the right
      part: the pot's upper band
    - where: a line across below it, a little longer, rising slightly to the right
      part: the pot's lower band
    - where: a long stroke from the lid down to the left, crossing the pot
      part: the pot's stand, its left leg
    - where: a stroke from the left going down to the right, then across to the right
      part: the bank of earth under the pot, sweeping out
    - where: a small stroke at the upper right, going down and turning down to the left
      part: a young leaf at the left
    - where: an upper line across, rising slightly to the right, crossing the stem
      part: the upper pair of leaves
    - where: a shorter line across below it, crossing the stem
      part: the lower pair of leaves
    - where: a straight vertical line down from the top to the ground, crossing the leaves
      part: the shoot's stem
    - where: a long line across the bottom, the stem ending on it
      part: the ground line

替:
  object: one man replacing another
  history: 'An ideogram: one man 夫 replacing another 夫; the sun 日 gives the sound.'
  layout: >-
    Two men stand side by side with arms stretched out, both with friendly faces and simple pale
    clothes; the right man is wider and taller and steps in, replacing the left. A small plain
    sun glows below. Pale colours.
  exact:
    - The left man is narrower and a little shorter than the right man; the men do not touch each other.
    - Each man's lower line across is longer than his upper line across; both rise slightly to the right.
    - The left man's sweep crosses both lines across; his last stroke is a short dot touching the sweep.
    - The right man's last stroke is long, starting where his two sweeps meet, and sweeping out to the right.
    - The sun's vertical is the longest vertical; its top line across turns down at the right and ends in a hook to the left.
    - The sun's two inner lines across rise slightly to the right; the lower one is a little longer.
  strokes:
    - where: a short line across the upper part of the left man, rising slightly to the right
      part: the left man's shoulders
    - where: a longer line across below it, rising slightly to the right
      part: the left man's outstretched arms
    - where: a long stroke from the top, going down and turning down to the left, crossing both lines
      part: the left man's body and left leg
    - where: a short stroke from the body, down to the right
      part: the left man's right leg
    - where: a short line across the upper part of the right man, rising slightly to the right
      part: the right man's shoulders
    - where: a longer line across below it, rising slightly to the right
      part: the right man's outstretched arms
    - where: a long stroke from the top, going down and turning down to the left, crossing both lines
      part: the right man's body and left leg
    - where: a stroke from the arms going down to the right, then across to the right
      part: the right man's right leg, striding out
    - where: a straight line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the right and ending in a hook to the left
      part: the sun's top and right rim
    - where: a short line across the middle of the sun, rising slightly to the right
      part: the band of light at its heart
    - where: a line across the bottom of the sun, rising slightly to the right
      part: the sun's bottom rim
