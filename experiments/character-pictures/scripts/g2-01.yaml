# Full run, group g2, batch 01. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

冬:
  checked: argon
  object: a person bundled up and walking across two blocks of ice in winter
  history: >-
    The ancient origin is uncertain, with hypotheses linking the early graph to the upper part of a
    katydid or a knotted thread-end alongside two marks of ice. In its modern form, the top part is
    a walking figure and the bottom two strokes are ice, picturing someone walking on ice in winter.
  layout: >-
    A person in simple pale winter clothes fills the upper two-thirds of the frame, facing left as
    they stride across the ice. Their head, with eyes, a nose and a mouth, sits near the top centre
    above the first sweep, while the crossing strokes of the upper component form their leaning body
    and striding legs. Below their feet in the bottom centre sit two stacked, slanted blocks of pale
    blue ice on the two lower dots.
  exact:
    - The second stroke starts on the middle of the upper-left sweep, runs across rising slightly to the right, and turns sharply to sweep long and low to the left.
    - The long falling stroke starts on the upper-left sweep below the second stroke's start, crosses the second stroke in the middle, and sweeps out wide to the right.
    - The two short slanted strokes at the bottom centre stand completely free of the upper strokes and of each other, with a clear gap between the long left sweep and the upper ice stroke.
    - Both bottom strokes slant down to the right in the lower centre, and the upper one is slightly shorter than the lower one.
  strokes:
    - where: a sweep from the top centre down and out to the middle left
      part: the walking person's leaning shoulder and front arm
    - where: a stroke starting on the middle of the first sweep, running across to the right and turning sharply down into a long sweep to the lower left
      part: the back of the coat turning down into the person's forward leg striding left
    - where: a long falling stroke starting lower on the first sweep, crossing the long left sweep, and opening out to the middle right
      part: the person's trailing leg stretching out to the right
    - where: a short stroke slanting down to the right in the lower centre, below the crossing legs
      part: the upper ridge of ice beneath the walker
    - where: a slightly longer short stroke slanting down to the right at the bottom centre, below the upper ice stroke
      part: the lower ridge of ice at the bottom

幅:
  checked: argon
  dropped: Because 畐 serves purely as a phonetic component and the origin gives no ideographic reading, picturing the two components together would teach a false etymology.

奪:
  checked: argon
  object: a person in wide robes at the top, a short-tailed bird sheltered in the middle, and a hand below reaching up to snatch the bird
  history: >-
    The oldest forms combined clothing at the top, a bird in the middle, and a hand at the bottom,
    showing a hand seizing a bird from inside someone's garments. In the modern form the clothing at
    the top became the spreading figure of a person, the bird remains in the middle, and the hand at
    the bottom is written as the inch-hand component.
  layout: >-
    The scene stacks three parts from top to bottom. At the top, a person with a face (eyes, nose
    and mouth) and simple pale robes spreads their arms and wide sleeves out to the left and right,
    arching over the middle. Nestled beneath those spreading sides sits a small bird facing left,
    with a pale feathered body. At the bottom, a large hand and wrist reach across and up to seize
    the bird from below. All colours are pale and soft.
  exact:
    - In the top part, the line across is about three-quarters as long as the wide bottom line; the long left sweep crosses the middle of the top line across, while the right sweep starts on that line just to the right of the crossing.
    - The middle bird sits inside the open space beneath the top part's two sweeps and does not touch either of them.
    - On the left of the bird, the short sweep down to the left is touched at its middle by both the bird's left vertical and the top horizontal of the bird's body.
    - The short dot above the bird stands completely free above the bird's top horizontal.
    - Inside the bird, the two middle horizontal lines cross the central vertical but stop short of the left vertical, leaving a clear gap on the left.
    - The central vertical of the bird starts on the middle of the bird's top horizontal, crosses the two middle horizontals, and ends on the middle of the bird's bottom horizontal.
    - The bird's bottom horizontal starts at the bottom end of the left vertical and is longer than the three horizontals above it.
    - The bottom hand part does not touch the bird above it; its long line across is the widest horizontal in the character, crossed near its middle by the vertical line ending in a hook to the left, while the dot below the left side of the long line stands free.
  strokes:
    - where: a line across the upper part, about three-quarters as wide as the bottom horizontal line
      part: the shoulders and outstretched arms of the person at the top
    - where: a long sweep from the top centre down through the upper line and out to the middle left
      part: the person's head and upper body, sweeping down into the wide left robe sleeve
    - where: a long sweep starting on the upper line across and running down and out to the middle right
      part: the person's wide right robe sleeve, sweeping out to the right
    - where: a short sweep in the upper middle, running down to the left below the person's left sweep
      part: the bird's head and neck, facing left
    - where: a short vertical line going straight down from the middle of the bird's left sweep
      part: the front of the bird's breast
    - where: a short dot slanting down to the right above the middle of the bird
      part: the small crest feather atop the bird's back
    - where: a short line across the upper part of the bird, starting at the middle of the bird's left sweep and rising slightly to the right
      part: the upper edge of the bird's folded wing
    - where: a short line across the middle of the bird, rising slightly to the right
      part: the upper feather stripe across the bird's wing
    - where: a short line across the lower middle of the bird, rising slightly to the right
      part: the lower feather stripe across the bird's wing
    - where: a short vertical line down the middle of the bird, from the top wing line to the bottom body line
      part: the central shaft dividing the bird's wing feathers
    - where: a line across the bottom of the bird, starting at the bottom of the bird's front vertical and running to the right
      part: the underside of the bird's body and its short tail
    - where: a very long line across the lower part of the square, from near the left edge to near the right edge
      part: the outstretched fingers and palm of the seizing hand below
    - where: a vertical line in the lower half, crossing the long bottom line across and ending at the bottom centre in a hook to the left
      part: the wrist and forearm of the seizing hand, with the cuff hooked at the bottom
    - where: a short dot slanting down to the right beneath the left half of the long bottom line
      part: the thumb of the seizing hand

丰:
  checked: argon
  object: a lush plant with a tall upright stalk and three tiers of spreading leaves
  history: >-
    Originally a pictogram of a luxuriant plant growing on the ground; in the modern form the lowest
    ground stroke was lost, leaving the central stalk crossed by three horizontal lines. It also
    serves as the simplified form of 豐, which showed a ceremonial vessel brimming with such plants.
  layout: >-
    One tall, lush plant stands upright in the centre, filling the square from top to bottom. The
    long vertical stroke forms the straight central stalk, and the three lines across form three
    tiers of leaves spreading to the left and right, with the lowest tier spreading widest. Soft
    pale green leaf shapes and a pale golden-green ear of grass around the top of the stalk are
    drawn behind the strokes.
  exact:
    - The three lines across are stacked one above another and do not touch each other.
    - The upper and middle lines across are the same length, each clearly shorter—a little over half as long—as the wide lower line across.
    - All three lines across slant slightly upward to the right.
    - The long vertical line runs straight down the centre from well above the top line to well below the bottom line, crossing all three lines at their middles, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a short line across the upper part, centred, rising slightly to the right, a little over half as long as the lowest line across
      part: the upper pair of leaves spreading left and right
    - where: a short line across the middle, centred, rising slightly to the right, a little over half as long as the lowest line across
      part: the middle pair of leaves spreading left and right
    - where: a long line across the lower part, nearly the full width, rising slightly to the right
      part: the wide lower pair of leaves spreading far to the left and right
    - where: a long straight line down the centre from near the top to near the bottom, ending in a plain point with no hook
      part: the plant's upright central stalk

