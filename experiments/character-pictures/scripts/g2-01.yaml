    - where: a short line across the middle of the fish's body, rising slightly to the right and touching neither side wall
      part: the line of scales across the middle of the fish
    - where: a short straight vertical down the middle of the fish's body
      part: the fish's backbone
    - where: a line across the bottom of the fish's body, joining the bottom of the left side to the bottom of the right side
      part: the underside of the fish's body
    - where: a long line across the middle of the character, standing free from left to right
      part: the wide flat tail fin of the fish
    - where: a straight line down the left side of the lower half
      part: the left corner of the open mouth
    - where: a line across the top of the lower box, rising slightly to the right, then turning down to form the right side
      part: the upper lip and right corner of the open mouth
    - where: a short line across the middle of the lower box, touching the left side and stopping short of the right side
