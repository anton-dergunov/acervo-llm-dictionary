      part: the outer hanging leaf of the left bamboo cluster
    - where: a short line across in the upper left, starting at the middle of the first sweep and rising slightly to the right
      part: a side twig reaching right on the left bamboo cluster
    - where: a short dot below the left line across, slanting down to the right
      part: a small inner leaf below the left bamboo cluster
    - where: a short stroke at the top centre, running down and sweeping to the left
      part: the outer hanging leaf of the right bamboo cluster
    - where: a short line across in the upper right, starting at the middle of the right sweep and rising slightly to the right
      part: a side twig reaching right on the right bamboo cluster
    - where: a short stroke below the right line across, slanting down to the right
      part: a small inner leaf below the right bamboo cluster
    - where: a sweep below the bamboo, running from near the centre down and out to the middle left
      part: the top layer of hairs at the crown of the brush tuft
    - where: a line across the middle, rising slightly to the right, clearly shorter and a little over half as long as the line across below it
      part: a middle band of bristles across the brush tuft
    - where: a long line across the lower middle, rising slightly to the right
      part: a wide lower band of bristles across the brush tuft
    - where: a long stroke starting at the middle of the hair part's top sweep, running down through both lines across, turning across to the bottom right, and ending in an upward hook
      part: the central spine of the brush tuft, sweeping along the lower edge to its upturned tip

筆:
  checked: argon
  object: two small bamboo sprigs at the top above a hand gripping an upright bamboo writing brush
  history: >-
    The lower part 聿 was the original character for a writing brush, drawing a hand in profile
    holding an upright brush. The bamboo top ⺮ was added later to show that the brush handle is made
    of bamboo.
  layout: >-
    At the top sit two small pale-green bamboo sprigs with hanging leaves, left and right. Below
    them, a long upright bamboo brush runs straight down the centre to a pointed bristle tip at the
    bottom. A pale hand in profile grips the upper middle of the shaft where the turned stroke and
    cross-lines form the fingers, while the lower cross-lines mark the binding ring and wide collar
    above the brush tip.
  exact:
    - The two small bamboo sprigs at the top do not touch each other and do not touch the vertical brush shaft below.
    - In each bamboo sprig, the short line across starts from the middle of the left slanting sweep, while the small dot below stands free without touching any stroke.
    - The right bamboo sprig sits slightly higher than the left one, and its left sweep is shorter than the left sprig's sweep.
    - The upper horizontal stroke of the lower part turns sharply down and slightly left on the right side, crosses the long middle line across, and meets the right end of the short line below it.
    - The middle line across is by far the widest stroke, extending well past the hand frame on both the left and the right.
    - The two short lines across below the widest line are equal in length, each a little under half as long as the widest line, while the bottom line across is wider, about three quarters as long as the widest line.
    - The long central vertical line starts just below the gap between the bamboo sprigs, crosses all five horizontal lines of the lower part, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a short sweep at the top left, running down and out to the left
      part: the left bamboo sprig's stem and hanging left leaf
    - where: a short line across in the upper left, starting from the middle of the left sweep and rising slightly to the right
      part: a twig branching right from the left bamboo sprig
    - where: a short dot in the upper left below the twig, slanting down to the right
      part: a lower leaf hanging from the left bamboo sprig
    - where: a short sweep in the upper right, running down to the left
      part: the right bamboo sprig's stem and hanging left leaf
    - where: a short line across in the upper right, starting from the middle of the right sweep and rising slightly to the right
      part: a twig branching right from the right bamboo sprig
    - where: a short dot in the upper right below the twig, slanting down to the right
      part: a lower leaf hanging from the right bamboo sprig
    - where: a line across the upper middle, turning sharply down and slightly left on the right side
      part: the top of the hand and the curled back of the fingers gripping the brush
    - where: a very long line across the middle, running from the far left to the far right
      part: the outstretched middle finger and knuckle line across the brush
    - where: a short line across below the long middle line, meeting the bottom of the turned-down stroke on the right
      part: the lower finger curled around the brush shaft
    - where: a short line across the lower middle, below the hand, rising slightly to the right
      part: a narrow binding ring around the lower bamboo shaft
    - where: a wider line across near the bottom, below the binding ring
      part: the wide collar at the base of the brush handle, above the bristles
    - where: a long straight line down the centre from just below the bamboo sprigs to the very bottom, ending in a plain point
      part: the upright bamboo brush shaft running down into the pointed brush tip at the bottom

