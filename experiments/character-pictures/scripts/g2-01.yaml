    - where: a short sweep in the upper left half, slanting down to the left to touch the long flame stroke
      part: a small tongue of flame flickering on the upper right of the fire
    - where: a long line from the top of the left half running straight down and then sweeping out to the bottom left
      part: the main body and left edge of the tall leaping flame, from its tip to its base
    - where: a short stroke from the lower middle of the left flame's main sweep, slanting down to the right
      part: the right base of the flame, flaring toward the centre
    - where: a sweep from the top centre down and left toward the middle of the square
      part: the upper-left edge of the sudden explosive burst flaring up beside the fire
    - where: a long line across the upper right half, starting on the middle of the upper sweep and rising slightly to the right
      part: the top crest of the sudden burst shooting out to the right
    - where: a long straight line down the middle of the right half, from the underside of the top line across to the bottom
