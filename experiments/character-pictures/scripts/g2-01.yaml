智:
  checked: argon
  object: an adult elder on the top left and a speaking mouth on the top right transmitting knowledge, above the bright sun at the bottom
  history: >-
    The oldest forms were an ideogrammic compound of an adult (大), a mouth (口) and a child (子),
    showing an elder speaking to pass on knowledge, with a lower mouth (甘) added in bronze
    inscriptions. Over time the child was dropped, the standing adult corrupted into the
    arrow-shaped component (矢) beside the mouth to form 知, and the bottom part became the sun (日),
    shining clearly.
  layout: >-
    The upper half holds two parts side by side: on the top left, a standing adult facing forward
    with a friendly face (eyes, nose and mouth), a cap on the head, and simple pale robes; on the
    top right, an open speaking mouth in soft pale rose. Centered below them in the bottom half sits
    a tall rectangular sun with a pale warm yellow glow, narrower than the pair above.
  exact:
    - In the top left, the upper line across starts at the middle of the short top-left sweep and is a little over half as long as the lower line across below it.
    - The long central sweep in the top left starts at the middle of the upper line across and crosses the middle of the lower line across.
    - The short dot-like stroke below the lower line across in the top left stands completely free and does not touch the long sweep or the line above it.
    - The top-left figure and the top-right mouth do not touch each other; a small gap separates the lower line across on the left from the mouth's left side.
    - In the top-right mouth, the top stroke turns down on the right and lands on the middle of the bottom line across, which extends slightly past it to the right.
    - The sun at the bottom sits below the upper components without touching them; its top-and-right stroke ends in a small hook to the left at the bottom right.
    - Inside the sun, the middle line across touches the left vertical and stops short of the right side, while the bottom line across connects both sides.
  strokes:
    - where: a short sweep in the top left from near the top down and out to the left
      part: the left brim of the elder's cap
    - where: a short line across in the top left, starting from the middle of the top-left sweep and rising slightly to the right, a little over half as long as the line below it
      part: the top of the elder's cap and head
    - where: a longer line across the middle of the upper-left quarter, rising slightly to the right
      part: the elder's outstretched arms
    - where: a long sweep starting from the middle of the upper line across, crossing the longer line across and curving down to the middle left
      part: the elder's torso and left leg
    - where: a short dot slanting down to the right below the longer line across, standing free of the long sweep
      part: the elder's right leg
    - where: a short line down on the left side of the upper-right quarter, slanting slightly to the right
      part: the left corner of the speaking mouth
    - where: a line across the top of the upper-right quarter, turning down on the right side
      part: the upper lip and right corner of the speaking mouth
    - where: a short line across the bottom of the upper-right quarter, rising slightly to the right
      part: the lower lip of the speaking mouth
    - where: a long vertical line down the left side of the lower half
      part: the left rim of the sun
    - where: a line across the top of the lower half, turning down on the right side to run to the bottom and ending in a hook to the left
      part: the top and the right rim of the sun
    - where: a short line across the middle of the lower half, touching the left vertical and stopping short of the right side
      part: the bright spot at the sun's heart, a band of light across its centre
    - where: a short line across the bottom of the lower half, joining the left and right sides
      part: the bottom rim of the sun

