豐:
  checked: argon
  object: a tall ceremonial serving vessel on a stand at the bottom, topped with a wide open bowl overflowing with lush, leafy plant stalks
  history: >-
    The character combines an upper container full of luxuriant plants with a tall footed serving
    vessel below, depicting a bountiful offering of plenty at a feast.
  layout: >-
    The scene is stacked vertically in two halves. In the upper half, a wide open bowl cradles three
    tall plant stalks standing side by side, with the left and right stalks each crossed by three
    tiers of leaves; soft pale green foliage fills the space behind the stalks. In the lower half
    sits the footed serving dish, with a flat lid line above a rectangular bowl, two short stem
    legs, and a wide flat foot at the bottom, coloured in pale warm bronze or terracotta tones.
  exact:
    - In the upper half, three vertical stems (left, centre, and right) stand side by side, and their bottom ends all touch the long bottom bar of the upper bowl.
    - The left vertical stem is crossed by three short horizontal strokes and the right vertical stem is crossed by three short horizontal strokes; none of those short horizontal strokes touch the central vertical stem or the outer walls of the bowl.
    - The upper bowl's left wall and bottom bar are one L-shaped stroke that goes down on the far left and turns across to the right to meet the middle of the short right vertical wall.
    - At the top of the lower half, a short horizontal line about two fifths as long as the bottom base stands free between the upper bowl and the rectangular box below it.
    - The rectangular box in the lower half is closed at the bottom by a horizontal stroke where the left vertical side and the right turning side meet it.
    - Below the rectangular box, a short dot on the left slants down to the right without touching the box or the bottom base, while a short stroke on the right slants down to the left from the bottom of the box to touch the long bottom base line.
  strokes:
    - where: a vertical line down the top centre, stopping on the bottom bar of the upper half
      part: the tall central plant stalk rising from the middle of the upper bowl
    - where: a short line across the upper left, near the top, rising slightly to the right
      part: the top pair of leaves on the left stalk
    - where: a short line across the upper left, below the top line, rising slightly to the right
      part: the middle pair of leaves on the left stalk
    - where: a short line across the upper left, below the middle line, rising slightly to the right
      part: the bottom pair of leaves on the left stalk
    - where: a vertical line down the upper left, crossing the three short lines across and touching the bottom bar of the upper half
      part: the left plant stalk
    - where: a short line across the upper right, near the top, rising slightly to the right
      part: the top pair of leaves on the right stalk
    - where: a short line across the upper right, below the top line, rising slightly to the right
      part: the middle pair of leaves on the right stalk
    - where: a short line across the upper right, below the middle line, rising slightly to the right
      part: the bottom pair of leaves on the right stalk
    - where: a vertical line down the upper right, crossing the three short lines across and touching the bottom bar of the upper half
      part: the right plant stalk
    - where: a line down the far left of the upper half, turning sharply across to run all the way to the right side, rising slightly
      part: the left wall and broad bottom base of the upper bowl holding the plants
    - where: a short vertical line down the far right of the upper half, meeting the right end of the upper bowl's bottom bar
      part: the right wall of the upper bowl
    - where: a short line across the middle of the character, below the upper bowl
      part: the lid of the lower serving vessel
    - where: a short line down the left side of the lower vessel's box
      part: the left side of the lower vessel's bowl
    - where: a line across the top of the lower vessel's box, turning down to run along its right side
      part: the rim and the right side of the lower vessel's bowl
    - where: a line across the bottom of the lower vessel's box, closing it
