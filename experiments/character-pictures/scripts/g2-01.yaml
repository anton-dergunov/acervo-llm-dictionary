  history: >-
    Traditional Chinese writing brushes were made with a bamboo shaft and a tip of animal hair. This
    form joins bamboo at the top with hair at the bottom as a direct ideogram of a brush.
  layout: >-
    The picture is divided between the bamboo top in the upper third and the large brush tuft of
    hair in the lower two thirds. At the top sit two side-by-side clusters of pale green bamboo
    leaves and short stems, with the right cluster sitting slightly higher than the left. Below
    them, a soft, pale brown tuft of brush hair spreads across the lower half and sweeps out to a
    pointed tip curving up on the right, held together by a pale bamboo collar where the two parts
    meet.
  exact:
    - Two bamboo clusters sit side by side across the top third, with the right cluster slightly higher than the left, and neither touches the hair part below.
    - In each bamboo cluster, the short line across starts at the middle of the left-slanting sweep, while the short dot-like stroke below it stands completely free.
    - In the lower hair part, the upper line across is clearly shorter, a little over half as long as the lower line across, and both rise slightly to the right.
    - The long final stroke starts at the middle of the hair part's top sweep, runs down to cross both lines across, turns wide to the right at the bottom, and ends in an upward hook at the far right.
  strokes:
