炸:
  checked: argon
  object: a leaping fire on the left bursting into a sudden explosive flare shooting out to the right
  history: >-
    Combined from 火 (fire, flame) on the left and 乍 (sudden) on the right to depict a sudden burst
    of flame, and thus to explode or to fry in hot oil.
  layout: >-
    The scene fills the square with two side-by-side parts that come close in the middle without
    touching. On the left, a narrow tall flame leaps upward with sparks at its sides. On the right,
    a wider and slightly taller sudden burst flares up from the top and shoots rays out to the
    right. Pale yellow and soft orange-red fire glows behind and around the strokes.
  exact:
    - The left fire and the right burst do not touch; the right part's upper sweep reaches down into the gap between the left fire's upper and lower right strokes.
    - In the left fire, the short leftmost stroke stands completely free to the left of the long central sweep.
    - In the left fire, the upper-right short sweep slants down to the left to touch the long central sweep, and the lower-right short stroke starts on the long sweep and slants down to the right as a short dot.
    - In the right part, the top line across starts at the middle of the upper-left sweep and rises slightly to the right.
    - The right part's long vertical line starts from the underside of the top line across, a little to the right of the sweep, and runs straight down to a plain point at the bottom with no hook.
    - The two lower lines across on the right both start on the right side of the long vertical line without crossing it, and each is about half as long as the top line across.
  strokes:
