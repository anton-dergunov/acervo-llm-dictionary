奏:
  checked: argon
  object: two hands holding up a wooden ritual musical instrument with tiered crossbars at the top and a two-legged stand at the bottom
  history: >-
    An ideogrammic compound originally written with two hands in the middle holding up a ritual
    musical instrument above a lower base. In the modern form, the upper object and the two hands
    merged into the three horizontal bars and wide left and right sweeps at the top, while the lower
    part of the instrument took the shape of 天 at the bottom.
  layout: >-
    A symmetrical wooden ritual instrument fills the square, held up from both sides. At the top,
    three horizontal bars sit across a central post that curves down into the left supporting arm,
    while the right supporting arm sweeps out from the widest middle bar; two pale hands clasp the
    frame along the left and right sweeps. Tucked beneath the wide middle bar, between the two
    sweeping arms, is the lower body and two-legged stand of the instrument. The wood is painted in
    pale warm amber and soft ochre, with pale skin tones on the two hands.
  exact:
    - The top has three lines across, all rising slightly to the right; the first is a little over two thirds as long as the third, the second is slightly shorter than the first, and the third is the widest horizontal in the character.
    - The long left sweep starts at the top centre above the top line, crosses all three upper lines across near their middles, and curves far down to the bottom left.
    - The right falling stroke starts on the third, widest line across just to the right of the crossing and sweeps down and out to a wide foot on the right.
    - Below the third line across sits a short fourth line across in the centre, with clear gaps separating it from the left sweep and the right falling stroke.
    - The fifth line across, below the fourth, is nearly twice as long as the fourth line across above it and about four fifths as long as the widest middle line.
    - The lower left sweep starts at the middle of the short fourth line across, crosses the fifth line across, and curves down to the bottom left.
    - The final stroke at the bottom right is a short falling stroke below the fifth line across that stands completely free, touching neither the line above it nor the sweep beside it.
  strokes:
    - where: a line across near the top, rising slightly to the right, a little over two thirds as long as the third line across
      part: the top crossbar of the ritual musical instrument
    - where: a line across below the top line, slightly shorter than the top line and rising slightly to the right
      part: the second crossbar of the instrument's upper rack
    - where: a wide line across the middle, the longest horizontal in the character, rising slightly to the right
      part: the main horizontal beam of the instrument, where the two hands hold it
    - where: a very long sweep starting at the top centre, crossing all three upper horizontal lines and curving out to the bottom left
      part: the central post at the top, curving down into the left arm and hand supporting the instrument
    - where: a long falling stroke starting near the middle of the third line across and sweeping down and out to the middle right
      part: the right arm and hand reaching out to hold the instrument
    - where: a short line across in the centre below the main beam, about half as long as the line below it and touching neither side sweep
      part: the upper rim of the instrument's lower stand
    - where: a wider line across in the lower half, nearly twice as long as the short line above it
      part: the lower crossbeam of the instrument's stand
    - where: a sweep starting from the middle of the short fourth line across, crossing the fifth line across and curving down to the bottom left
      part: the curved left leg of the instrument's stand
    - where: a short falling stroke in the bottom right below the fifth line across, standing completely free of the other strokes
      part: the right foot of the instrument's stand

鲁:
  checked: argon
  object: a fish swimming upwards at the top, above an open mouth at the bottom
  history: >-
    Originally an ideogrammic compound of a fish above a mouth. Over time, part of the fish's tail
    merged with the mouth below, giving the mouth an inner horizontal line so that it came to look
    like the sun component, while the fish on top was simplified in the modern form.
  layout: >-
    The upper half holds a fish pointing upwards, with its pointed head at the top, its boxy scaled
    body in the upper middle, and its wide flat tail fin stretching across the middle of the square.
    Below the tail fin sits a narrower boxy open mouth with lips and a tongue inside. Soft pale
    silvery-blue shading fills the fish and pale warm pink tints the lips and mouth behind the
    strokes.
  exact:
    - At the top, the second stroke starts at the middle of the first sweep, runs across to the right and turns down to the left to touch the middle of the fish body's top line; the first sweep's lower end does not touch the body below it.
    - The fish's body is an enclosed box whose left and right sides slant slightly inward toward the bottom, divided down the middle by a short vertical that runs from the top line to the bottom line.
    - Inside the fish's body, the short horizontal line crosses the central vertical and stops short of both the left and right sides of the body.
    - The long horizontal line across the middle is the widest stroke in the character and stands completely free, with a clear gap below the fish's body and a clear gap above the lower box.
    - The lower box is narrower than the fish's body and about half as wide as the long middle line above it.
    - Inside the lower box, the middle horizontal line touches the left vertical and stops short of the right vertical, while the bottom line closes the box from the left vertical to the right vertical.
  strokes:
    - where: a sweep at the top, from the top centre down and out to the left
