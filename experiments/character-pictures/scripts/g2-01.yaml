  history: >-
    The oldest forms drew a person with a wide-open mouth above the body to show yawning or
    breathing out. In the modern form, the top two strokes are the tilted head and gaping mouth, and
    the bottom two strokes are the person's body and legs.
  layout: >-
    One person fills the square from top to bottom, facing right with head tilted back in a big
    yawn. The upper two strokes form the back of the tilted head and the wide-open yawning mouth at
    the top, with a closed yawning eye and nose drawn on the face. The lower two strokes form the
    torso and legs below, dressed in simple pale clothes with pale arms at the sides.
  exact:
    - The upper left sweep starts near the top centre and curves down to the middle left.
    - The upper line across starts at the middle of the upper left sweep, rises slightly to the right, and ends in a sharp hook down to the left.
    - The upper part and the lower part do not touch; the lower left sweep starts at the centre just below the upper line across.
    - The lower right falling stroke starts at the middle of the lower left sweep and sweeps down to the bottom right.
  strokes:
    - where: a sweep from near the top centre down and out to the middle left
      part: the back of the tilted head and neck
    - where: a line from the middle of the upper sweep across and slightly up to the right, ending in a hook down to the left
      part: the wide-open yawning mouth, hooking down at the open jaw
    - where: a long sweep from the centre down and out to the bottom left
      part: the body, running down into the left leg
    - where: a falling stroke from the middle of the body sweep down and out to the bottom right
      part: the right leg

