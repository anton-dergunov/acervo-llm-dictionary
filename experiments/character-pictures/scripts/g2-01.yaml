賀:
  checked: argon
  dropped: Because the character is purely a phono-semantic compound with no pictographic or ideographic reading in the origin, drawing a scene from its components would teach a false etymology.

胸:
  checked: argon
  dropped: Because both 胸 and its original form 匈 are given only as phono-semantic compounds with no pictographic or ideographic reading, drawing a scene from their components would teach a false etymology.

句:
  checked: argon
  dropped: Because 口 is a phonetic component and 勹 is a graphical corruption of 丩 in a phono-semantic compound with no ideographic or pictographic reading, drawing it as a phrase coming from a mouth would teach a false etymology.

弃:
  checked: argon
  object: a swaddled child in a cloth bundle above, held up on a crossbar by two hands and arms below
  history: >-
    The oldest forms drew two hands holding a basket to cast away an inverted child. In the modern
    simplified form the basket is omitted, leaving the child's bundle at the top and middle above
    the two hands at the bottom.
  layout: >-
    The upper half holds the swaddled child wrapped in pale cloth, with a small head showing a face
    (eyes, nose and mouth) nestled inside the triangular middle wrap. Below a small gap, the lower
    half shows two pale arms reaching up from the bottom to lift a wide horizontal bar, with pale
    hands at the top of the two vertical strokes. All colours stay soft and pale.
  exact:
    - The short top stroke slants down to the right and stands completely free above the upper line across, without touching it.
    - The upper line across is clearly shorter than the lower line across, a little over half as long.
    - The bent middle stroke starts touching the middle of the upper line across, sweeps down to the left, turns sharply across to the right, and ends touching the middle of the short right-hand slanted stroke.
    - The middle triangular part and the lower part do not touch each other; there is a clear gap above the tops of the two lower vertical strokes.
    - The long lower line across crosses both lower vertical strokes near their middles.
    - In the lower half, the left vertical stroke curves out to the bottom left, while the right vertical stroke runs straight down and ends in a plain point, with no hook.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right and standing free
      part: the top knot of the swaddling cloth
    - where: a line across the upper part, clearly shorter than the lower line across, a little over half as long
      part: the upper fold of the swaddling wrap
    - where: a stroke starting at the middle of the upper line across, sweeping down to the left and turning sharply across to rise slightly to the right
      part: the left side and bottom fold of the swaddling cloth cradling the child
    - where: a short stroke in the middle right, slanting down to the right, about as long as the top knot stroke
      part: the right tuck of the swaddling cloth closing the bundle
    - where: a long line across the lower half from left to right
      part: the wide carrying bar held across the two hands
    - where: a vertical stroke on the left of the lower half, crossing the long line across and curving down to the bottom left
      part: the left forearm reaching up, curving down to the left
    - where: a straight vertical line on the right of the lower half, crossing the long line across and ending in a plain point at the bottom
      part: the right forearm reaching straight up

魯:
  checked: argon
  object: a fish swimming upwards at the top, above an open mouth at the bottom
  history: >-
    Originally an ideogrammic compound of a fish (魚) above a mouth (口); the mouth component later
    merged with the fish's tail to resemble 白 and became 日 in the modern form.
  layout: >-
    In the upper two thirds, a pale silvery-blue fish swims straight upwards, its pointed head at
    the top, its rectangular scaled body in the middle, and its broad tail fin fanning out across
    the four separate strokes below the body. Below the tail sits a square open mouth with pale lips
    and a soft pink tongue along the middle stroke. The fish is much wider than the mouth below it.
  exact:
    - The upper fish is much wider and taller than the lower mouth box, and the two parts do not touch.
    - In the fish's head, the top-right bent stroke starts at the middle of the left sweep and ends on the middle of the body's top line.
    - Inside the fish's body, the central vertical touches the top and bottom lines of the body and crosses the middle line, while the middle line stops short of both the left and right sides.
    - Below the fish's body, the row of tail strokes stands completely free of both the body and the lower box; the leftmost slants down to the left while the others slant down to the right.
    - In the lower box, the middle horizontal touches the left vertical and stops short of the right side, while the bottom horizontal joins the left and right sides.
  strokes:
    - where: a sweep at the top left, from the top centre down and out to the left
      part: the left curve of the fish's head
    - where: a line across the top right, from the middle of the head curve, turning down to the left
      part: the top and right side of the fish's head
    - where: a straight line down the left side of the upper body, slanting slightly to the right
      part: the left side of the fish's body
    - where: a wide line across the top of the body, turning down at the right to run along the right side
      part: the top and right side of the fish's body
    - where: a short line across the middle of the body, rising slightly to the right and touching neither side
      part: the line of scales across the middle of the fish
    - where: a short upright line down the middle of the body
      part: the fish's backbone
    - where: a line across the bottom of the body, rising slightly to the right to meet the right side
      part: the underside of the fish's body
    - where: a short stroke at the middle left below the body, slanting down to the left and standing free
      part: the outer-left tail ray
    - where: a small dot below the left side of the body, slanting down to the right and standing free
      part: the inner-left tail ray
    - where: a small dot below the right side of the body, slanting down to the right and standing free
      part: the inner-right tail ray
    - where: a short stroke at the middle right below the body, slanting down to the right and standing free
      part: the outer-right tail ray
    - where: a straight line down the left side of the lower half
      part: the left corner of the open mouth
    - where: a line across the top of the lower half, turning down at the right to run down the right side
      part: the upper lip and right corner of the open mouth
    - where: a short line across the middle of the lower box, rising slightly to the right
      part: the tongue inside the open mouth
    - where: a line across the bottom of the lower box, rising slightly to the right
      part: the lower lip of the open mouth

臭:
  checked: argon
  object: a large nose at the top above a friendly dog standing on its hind legs with front paws stretched wide and one ear pricked up, sniffing the air
  history: >-
    An ideogrammic compound combining 自, a front-facing nose at the top, and 犬, a dog at the bottom,
    originally depicting a dog using its keen nose to track a scent.
  layout: >-
    The upper half holds a large front-facing nose framed by the rectangular box, softly shaded in
    pale peach with gentle nostrils at its base. Below it, filling the wider lower half, a friendly
    pale-brown dog stands upright on its hind legs with its front paws stretched wide along the long
    horizontal stroke, its head just below the nose and a pricked-up ear at the right.
  exact:
    - The upper nose component is narrower than the lower dog component and sits in the top half, with a small gap between the bottom of the nose's box and the top of the dog's central sweep.
    - At the very top, the short sweep slants down to the left and meets the top-left corner of the nose's box where the top horizontal line begins.
    - Inside the nose's box, the two inner lines across touch the left vertical side and stop short of the right vertical side, while the bottom line connects both sides to close the box.
    - In the lower half, the central sweep starts just below the nose's box, crosses the long horizontal line near its middle, and curves out to the bottom left.
    - The lower right falling stroke starts where the central sweep crosses the long horizontal line and sweeps down to the bottom right.
    - The short dot sits to the upper right of the long horizontal line, beside the lower right of the nose's box, standing free of every other stroke.
  strokes:
    - where: a short sweep at the top centre, slanting down to the left onto the top-left corner of the upper box
      part: the top of the nose's bridge
    - where: a straight line down the left side of the upper box
      part: the left side of the nose
    - where: a line across the top of the upper box, turning down at the right corner to run down its right side
      part: the upper bridge and right side of the nose
    - where: a short line across the upper middle of the upper box, rising slightly to the right
      part: an upper crease across the nose's bridge
    - where: a short line across the lower middle of the upper box, rising slightly to the right
      part: a second crease lower down the nose's bridge
    - where: a line across the bottom of the upper box, connecting the left and right sides
      part: the base of the nose, between the nostrils
    - where: a long line across the lower half, rising slightly to the right
      part: the dog's front legs, stretched out wide to both sides
    - where: a long sweep starting just below the middle of the upper box, crossing the long horizontal line and curving down to the bottom left
      part: the dog's head and neck at the top, running down into its body and left hind leg
    - where: a long falling stroke from the crossing in the lower half, sweeping down and out to the bottom right
      part: the dog's right hind leg
    - where: a short dot at the middle right, above the right end of the long horizontal line, slanting down to the right
      part: the dog's pricked-up ear
