  object: two hands rolling rice into a ball in the upper part above a kneeling person bent low in the lower part
  history: >-
    The ancient form combined a kneeling, bending person at the bottom with an upper component
    showing two hands rolling rice grains into round balls, expressing the act of rolling and
    bending. In the modern form the rice and hands merged into the canopy-like top strokes above the
    kneeling figure.
  layout: >-
    The upper two thirds show a cluster of pale rice grains at the top centre being rolled into a
    ball by two pale hands and arms sweeping out to the left and right along the upper strokes.
    Nestled beneath this canopy, the lower centre holds a kneeling person in profile facing right,
    bent low with legs tucked under and curling up at the bottom right. The kneeling person has a
    clear face with eyes, a nose and a mouth, and wears simple pale clothes.
  exact:
    - The small dot on the upper left and the short sweep on the upper right both stand completely free, touching no other stroke.
    - The upper line across is clearly shorter, a little over half as long as the lower line across.
    - The long sweep from the top centre runs down between the two top strokes, crosses the middle of both lines across, and sweeps out to the bottom left.
    - The right-hand sweep starts on the lower line across, to the right of the central crossing, and sweeps down and out to the bottom right without touching the bottom component.
    - Both strokes of the bottom part start together at the same point against the middle of the long left sweep.
    - In the bottom part, the inner stroke runs short across to the right, turns down, and ends in a hook up to the left inside the outer bend.
    - The outer bottom stroke runs down, turns wide across the bottom to the right, and ends in an upward hook at the bottom right without touching the inner hook or the right sweep above it.
  strokes:
