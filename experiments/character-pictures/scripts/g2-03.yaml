熊:
  checked: argon
  dropped: Because the character is a phono-semantic compound rather than an ideogrammic scene, depicting the bottom component as footprints or fire under a bear would teach a false etymology.

链:
  checked: argon
  dropped: Because the character is purely a phono-semantic compound with 連 serving as the phonetic component, drawing a combined scene would teach a false etymology.

烏:
  checked: argon
  object: a crow standing in profile facing left, with a crest on top, an uninked eye inside the head box, a folded wing and long tail curving down on the right, and a row of four short strokes for its feet and under-feathers below
  history: >-
    The oldest forms drew a standing bird in profile with a crest, a folded wing, a dangling tail,
    and feet underneath, just like 鳥. Because a crow's dark eye cannot be seen against its dark head
    feathers, the inner eye stroke inside the head was left out.
  layout: >-
    One crow stands in profile facing left, filling the frame from its crest at the top to its
    hooked tail at the bottom right. A pale beak juts to the left from the upper head box, and soft
    pale slate-grey plumage fills the head, body, wing, and tail behind the strokes, with a pale
    grey eye drawn inside the empty head box. The long right-hand stroke sweeps down into the
    dangling tail, curling around the four short strokes of the feet at the bottom.
  exact:
    - The short sweep at the very top slants down to the left and touches the top of the left vertical line where the upper horizontal line begins.
    - The upper horizontal line runs to the right and turns down to meet the right end of the upper middle horizontal line, forming a closed rectangular head box with no stroke inside it.
    - Below the closed head box, the next horizontal line touches the middle of the left vertical line and ends open on the right, with both middle horizontal lines clearly shorter, a little over half as long as the wide body line below them.
    - The left vertical line ends at the start of the long lower body line, which runs wide to the right, turns down along the far right side, and ends at the bottom in a hook up to the left.
    - Beneath the horizontal part of the long lower body line, a row of four short strokes stands completely free of every other stroke, with the leftmost stroke slanting down to the left and the other three slanting down to the right.
  strokes:
    - where: a short sweep from the top centre slanting down to the left
      part: the crest atop the crow's head
    - where: a vertical line down the left side of the upper half, from the base of the crest to the lower body
      part: the front of the crow's head and breast
    - where: a line across the top of the head to the right, turning down and inward at the right end
      part: the crown and back of the crow's head
    - where: a shorter line across below the crown, rising slightly to the right from the left vertical to close the head box
      part: the lower edge of the crow's head
    - where: a shorter line across the middle, rising slightly to the right from the left vertical and ending open on the right
      part: the upper edge of the crow's folded wing
    - where: a long line across from the bottom of the left vertical to the far right, turning down and ending at the bottom in a hook up to the left
      part: the lower wing and body curving down into the long dangling tail
    - where: a short stroke at the bottom left, slanting down to the left outside the breast line
      part: the crow's leftmost foot claw
    - where: a short dot in the lower left-centre, slanting down to the right
      part: the crow's second foot claw
    - where: a short dot in the lower centre, slanting down to the right
      part: the crow's third foot claw
    - where: a short stroke in the lower right-centre inside the curve of the tail, slanting down to the right
      part: the crow's rightmost foot claw and under-tail feather

拜:
  checked: argon
  object: an open hand on the left holding up a tall stalk of herbs on the right as a respectful offering
  history: >-
    The oldest forms were an ideogrammic compound of a hand 手 on the left holding a stalk of herbs 𠦪
    on the right as a gift of respect. In the modern form the plant on the right came to resemble a
    second hand alongside the first.
  layout: >-
    The left half is an open hand seen from the palm side, reaching slightly toward the right,
    shaded in a pale warm skin tone behind its strokes. The right half is a tall upright herb stalk
    with four tiers of horizontal leaf blades crossed by a long straight central stem, shaded in
    soft pale green behind the strokes. The right part is wider and reaches a little lower than the
    left.
  exact:
    - The left part and the right part stand side by side and do not touch each other.
    - On the left, the long vertical sweep starts at the middle of the top slanting stroke, crosses the two lines across, and curves down to a plain point at the bottom left with no hook.
    - On the left, the upper line across is about half as long as the longest line across on the right, and the lower line across is about three quarters as long.
    - On the right, four lines across are stacked one above another, and the top three are each about half as long as the wide bottom line across.
    - On the right, the long straight vertical line starts at the middle of the top line across, crosses the three lower lines across, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a short stroke slanting down to the left at the top of the left half
      part: the bent fingertips at the top of the hand
    - where: a short line across the upper middle of the left half, rising slightly to the right, about half as long as the longest line on the right
      part: the upper fingers of the hand spreading out to both sides
    - where: a wider line across the middle of the left half, rising slightly to the right, about three quarters as long as the longest line on the right
      part: the thumb and little finger of the hand spread wide
    - where: a long stroke starting at the middle of the top slanting stroke on the left, running down across the two lines across and sweeping out to the bottom left
      part: the middle of the palm running down through the wrist and forearm
    - where: a short line across the top of the right half, rising slightly to the right, about half as long as the bottom line on the right
      part: the top pair of leaf blades on the herb stalk
    - where: a short line across the upper middle of the right half, rising slightly to the right, about half as long as the bottom line on the right
      part: the upper-middle pair of leaf blades on the herb stalk
    - where: a short line across the middle of the right half, rising slightly to the right, about half as long as the bottom line on the right
      part: the lower-middle pair of leaf blades on the herb stalk
    - where: a long line across the lower middle of the right half, the widest horizontal stroke in the character
      part: the wide bottom pair of leaf blades on the herb stalk
    - where: a long straight line down the middle of the right half, starting at the middle of the top line across and ending in a plain point at the bottom
      part: the straight central stem of the herb stalk

尊:
  checked: argon
  object: an upright hand and forearm at the bottom lifting and offering a ceramic wine vessel with aged wine inside and two wisps of fragrant vapour rising from its top
  history: >-
    Ancient bronze and seal forms drew two hands or a single hand holding up a ritual wine jar with
    fragrant spirit inside to make a respectful offering. The modern character places the wine
    vessel with its rising aroma on top and the offering hand with its wrist mark underneath.
  layout: >-
    The upper half holds a pale terracotta wine jar with a wide flat rim, an inner neck, pale amber
    wine inside its belly, and two pale wisps of vapour floating above the rim. The lower half shows
    a pale-skinned upright hand and forearm rising from the bottom to support the base of the jar,
    with a wide horizontal wrist and thumb line stretching across the lower middle and a small pulse
    mark on the left side of the wrist.
  exact:
    - The two short strokes at the very top stand free above the top rim line and do not touch it.
    - The two inner neck strokes both start on the middle of the top rim line, cross the jar's upper horizontal edge, and hang inside the upper belly without touching the side walls; the left one curves down to the left and the right one turns sharply across to the right.
    - The short horizontal line inside the lower half of the jar is only a fifth as long as the widest lower line and stands completely free without touching the side walls.
    - The jar's bottom line connects the bottom of the left wall to the bottom of the right wall.
    - The long horizontal line in the lower half is the widest stroke in the character, while the wine vessel's top rim is about four fifths as long.
    - The lower vertical line starts against the middle of the jar's bottom line, crosses the wide lower horizontal line, and ends at the bottom in a hook up to the left.
    - The short dot in the lower left stands free below the wide lower horizontal line and to the left of the hooked vertical line.
  strokes:
    - where: a short dot in the top left-centre, slanting down to the right
      part: the left wisp of fragrant vapour rising above the wine vessel
    - where: a short sweep in the top right-centre, slanting down to the left
      part: the right wisp of fragrant vapour rising above the wine vessel
    - where: a long horizontal line across the upper part, about four fifths as long as the widest lower line
      part: the wide flat rim across the top of the wine vessel
    - where: a straight vertical line down the left side of the upper middle
      part: the left wall of the wine jar
    - where: a line across the upper middle that turns down on the right side
      part: the shoulder and right wall of the wine jar
    - where: a downward stroke starting at the middle of the top rim line, crossing the jar's upper edge and sweeping slightly left inside the upper belly
      part: the left side of the vessel's neck extending down into the jar
    - where: a downward stroke to the right of the previous one, starting at the middle of the top rim line, crossing the jar's upper edge and turning across to the right inside the upper belly
      part: the right side of the vessel's neck extending down and flaring inside the jar
    - where: a short horizontal line floating in the lower part of the jar, a fifth as long as the widest lower line
      part: the level surface of the aged wine inside the belly of the jar
    - where: a horizontal line across the bottom of the jar, rising slightly to the right from the left wall to the right wall
      part: the flat base of the wine jar
    - where: a very long horizontal line across the lower middle from far left to far right, the longest horizontal stroke
      part: the spread thumb and wrist line of the offering hand
    - where: a vertical line starting from the middle of the jar's base, running straight down through the lower half and ending at the bottom in a hook up to the left
      part: the upright hand and forearm lifting the vessel, with the bottom hook as the base of the arm
    - where: a short dot in the lower left, slanting down to the right below the long lower line and to the left of the hooked vertical
      part: the pulse mark on the inner wrist
