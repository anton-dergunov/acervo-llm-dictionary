泰:
  checked: argon
  object: a large person with outstretched arms and two hands reaching out above a stream of flowing water
  history: >-
    The character combines a large figure and two hands at the top—later fused into one canopy-like
    form—above water at the bottom, depicting hands scooping or holding abundant flowing water.
  layout: >-
    A tall figure in simple pale robes fills the upper part, seen from the front with a friendly
    face (eyes, nose and mouth) on a small head just above the top central stroke. The तीन tiered
    horizontal strokes form the figure's shoulders, forearms and wide-spread hands, while the two
    long outer sweeps form the flaring sides of the robe arching to the left and right. Nestled
    beneath this wide arch in the lower half is pale blue flowing water surrounding the central
    hooked stream and the four side ripples.
  exact:
    - The three horizontal lines in the upper half all rise slightly to the right; the top horizontal is about two thirds as long as the bottom horizontal, and the middle horizontal is the shortest, a little over half as long as the bottom horizontal.
    - The long left sweep starts at the top centre above the first horizontal, crosses the middles of all three horizontal lines, and curves far out to the lower left.
    - The right falling stroke starts on the third horizontal line to the right of the central crossing, without touching the left sweep or the upper two horizontals, and sweeps down and out to the right.
    - The five water strokes in the lower half sit beneath the arch of the two outer sweeps and stand completely free of one another and of the upper part.
    - The central water stroke is a vertical line down the lower middle ending in a distinct hook to the left at the bottom.
    - To the left of the central vertical sit a short dot slanting down to the right above a rising stroke slanting up to the right; to the right sit a short sweep slanting down to the left above a stroke slanting down to the right.
  strokes:
    - where: a horizontal line across the upper part, rising slightly to the right, about two thirds as long as the third horizontal line
      part: the figure's shoulder line across the chest
    - where: a shorter horizontal line across the upper middle, below the first and a little over half as long as the third horizontal line
      part: the figure's forearms held across the body
    - where: a long horizontal line across the middle, the widest of the three horizontal lines
      part: the figure's wide-spread arms and two open hands reaching out to both sides
    - where: a long stroke from the top centre running down through all three horizontal lines and sweeping out to the lower left
      part: the figure's body and the left side of the robe arching over the water
    - where: a falling stroke starting on the third horizontal line to the right of the crossing, sweeping down and out to the middle right
      part: the right side of the figure's robe sweeping out over the water
    - where: a vertical line down the lower centre, ending at the bottom in a hook to the left
