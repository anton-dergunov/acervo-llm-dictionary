      part: a loose grain of rice on the left
    - where: a short stroke in the upper right, turning down to the left
      part: a loose grain of rice on the right
    - where: a shorter line across the upper middle, rising slightly to the right
      part: the top of the rice ball being rolled
    - where: a longer line across the middle, rising slightly to the right
      part: the wrists and palms joined across the middle
    - where: a long sweep from the top centre down through both lines across and out to the bottom left
      part: the central mound of rice running down into the left arm sweeping out
    - where: a sweep from the middle of the lower line across down and out to the bottom right
      part: the right arm sweeping out to roll the rice
    - where: a stroke from the middle of the left sweep running across to the right, turning down, and ending in a hook up to the left
