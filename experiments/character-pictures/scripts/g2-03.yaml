    In the upper half, a person faces the viewer with arms stretched wide and legs spread apart like
    a canopy, with a friendly face showing eyes, a nose and a mouth, and simple pale clothes. Tucked
    beneath the open space between the person's legs in the lower half is a grasping hand reaching
    up to seize a small pale bird held against the palm. All colours are soft and pale.
  exact:
    - The upper line across and the lower line across are about the same length, each spanning roughly the middle half of the width, while the two sweeping legs of the upper part spread much wider to near the left and right edges.
    - In the upper part, the left-going sweep starts at the top centre and crosses the middle of the upper line across.
    - The right-going sweep starts on the underside of the upper line across just to the right of the left-going sweep, leaving a small gap so the two sweeps do not touch each other.
    - The upper part and the lower part do not touch each other at all.
    - In the lower part, the vertical stroke starts in the open space below the two upper sweeps, crosses the middle of the lower line across, and ends at the bottom in a hook up to the left.
    - The short slanting dot in the lower left stands completely free below the lower line across and to the left of the hooked vertical, touching neither.
  strokes:
    - where: a line across the upper middle, rising slightly to the right
