帘:
  checked: argon
  object: a cloth curtain hanging over a rod on a central stand at the mouth of a cave under an overhanging rock roof
  history: >-
    An ideogrammic compound combining the mouth of a cave (穴) at the top with a hanging cloth (巾)
    below, depicting a curtain hung across an opening.
  layout: >-
    The upper part shows the wide mouth of a cave in a pale stone hillside under an overhanging
    ledge of rock. Below the cave mouth, centred in the opening, hangs a narrower pale cloth curtain
    draped over a horizontal rod supported by a tall central stand. The upper cave roof spans almost
    the full width of the square, while the curtain below is much narrower.
  exact:
    - The short dot at the top centre stands free above the wide roof line and does not touch it.
    - The wide upper roof line starts at the middle of the upper-left stroke and ends on the far right in a hook down to the left.
    - The two slanting strokes under the roof (the sweep down to the left and the short stroke down to the right) stand completely free, touching neither the roof above nor the curtain below.
    - The horizontal top of the curtain is about half as wide as the upper roof line; it starts at the top of the curtain's left vertical stroke, turns down at the right, and ends in a hook to the left.
    - The long central vertical starts in the space between the two inner cave strokes, crosses the middle of the curtain's horizontal line, and extends straight down far below the curtain's sides to end in a plain point with no hook.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: a stone at the top of the hill above the cave
    - where: a short stroke at the upper left, slanting down to the left
      part: the left end of the overhanging rock roof
    - where: a wide line across the upper part from the middle of the upper-left stroke to the far right, ending in a hook down to the left
      part: the overhanging roof of rock above the cave
    - where: a short sweep under the left side of the roof line, running down to the lower left
      part: the left side of the cave's mouth
    - where: a short stroke under the right side of the roof line, slanting down to the right
      part: the right side of the cave's mouth
    - where: a vertical line down the left side of the lower half
      part: the left edge of the hanging curtain
    - where: a line across the middle, about half as wide as the upper roof line, turning down at the right and ending in a hook to the left
      part: the curtain rod and the right edge of the curtain, curling inward at its hem
    - where: a long straight vertical line down the centre, starting between the two inner cave strokes and reaching near the bottom
      part: the central stand holding up the curtain rod

艸:
  checked: argon
  object: two grass sprouts standing side by side, each with a tall central stem and two shorter side blades
  history: >-
    The oldest forms drew two grass sprouts side by side to mean grass and herbs; when used as a
    component at the top of another character, it was later shortened to the modern grass crown.
  layout: >-
    Two grass sprouts stand side by side, filling the square. As in the character, the left sprout
    is a little narrower and shorter, with its stem curving out to the bottom left, while the right
    sprout is wider and taller, with a straight stem starting higher at the top and reaching lower
    at the bottom. Soft pale green blades and shoots surround the strokes of each sprout.
  exact:
    - The left sprout and the right sprout do not touch each other in the middle.
    - The right sprout is wider and taller than the left sprout, reaching higher at the top and lower at the bottom.
    - In the left sprout, the first stroke goes down on the left and turns sharply up to the right, crossing the central stem and touching the middle of the short right vertical.
    - The left sprout's central stem starts at the top of the left half, crosses the rising line, and sweeps out to the bottom left.
    - In the right sprout, the left stroke goes down and turns sharply across and slightly up to the right, crossing the central stem and touching the lower end of the short right vertical.
    - The right sprout's central stem is a long straight vertical line ending in a plain point at the bottom, with no hook.
  strokes:
    - where: in the left half, a stroke going down on the left, then turning sharply up to the right
      part: the left sprout's left blade and base
    - where: in the left half, a short line down near the centre of the square
      part: the left sprout's right blade
    - where: in the left half, a long stroke from the upper left going down through the middle of the sprout and sweeping out to the bottom left
      part: the left sprout's central stem
    - where: in the right half, a stroke going down near the centre, then turning sharply across and slightly up to the right
      part: the right sprout's left blade and base
    - where: in the right half, a short line down on the far right
      part: the right sprout's right blade
    - where: in the right half, a long straight vertical line from near the top to the bottom, ending in a plain point
      part: the right sprout's central stem

