    - The upper middle silk thread and the lower middle flesh component sit one above the other in the centre and do not touch each other.
    - In the lower middle flesh component, the left vertical and the top-and-right stroke meet at the top left corner; the left vertical is about half as long as the right flanking stroke's vertical leg and ends in a plain point, while the right side reaches lower and ends in a hook up to the left.
