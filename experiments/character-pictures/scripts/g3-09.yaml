  history: >-
    An ideogrammic compound originally made of hair 毛 above a person 儿, depicting sparse hair on a
    person's head; the hair component later shifted into a stalk of grain 禾, and in the simplified
    form the person at the bottom took the joined shape 几.
  layout: >-
    The upper half is a stalk of grain 禾 growing from the crown of a smooth bald head as a sparse
    tuft of hair, with its heavy ear drooping to the left and pale golden husks behind the strokes.
    Around the middle gap sits the person's round bald head with a friendly face (eyes, nose and
    mouth), facing slightly left. The lower half 几 forms the person's torso in simple pale clothes
    and two legs striding apart, the right leg curving out to the bottom right with its foot hooked
    up.
  exact:
    - The top stroke is a short sweep running from right to left and slightly down.
    - The upper vertical stalk starts at the middle of the top sweep, crosses the long horizontal line, and ends at the centre in a plain point with no hook.
    - The two side sweeps of the grain stalk both start where the vertical stalk crosses the horizontal line and spread wide to the left and right.
    - The upper grain component and the lower person component do not touch; a small gap separates the bottom of the vertical stalk from the top of the lower part.
    - In the lower part, the right-hand stroke starts at the top of the left leg, runs a short way across (less than a third as long as the upper horizontal line), turns down, and curves flat to the bottom right, ending in a sharp hook pointing up.
