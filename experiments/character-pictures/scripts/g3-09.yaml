羁:
  checked: argon
  object: a net across the top above a stretched leather hide on the lower left and a horse on the lower right, together forming a horse's halter
  history: >-
    An ideogrammic compound combining a net (罒) at the top, a stretched animal hide for leather (革)
    on the lower left, and a horse (马) on the lower right: a leather halter and net used to hold and
    control a horse. The simplified form replaces the traditional horse component with its
    three-stroke simplified shape.
  layout: >-
    A wide rectangular net spans the top of the square, with pale mesh cords behind its frame. Below
    the net, the lower half splits into two side-by-side parts: on the left, a stretched tan leather
    hide with halter straps; on the right, a pale brown horse in profile facing left toward the
    leather halter, with a small eye, ear and flowing mane. All colours stay soft and pale behind
    the ink strokes.
  exact:
    - The top net forms a wide closed rectangle whose left side, top-and-right turned stroke, and bottom line across meet at the corners, with two short inner verticals hanging from the top bar to the bottom bar.
    - Below the net on the left, the leather component's right upper vertical touches the middle of the net's bottom bar, while its left upper vertical starts just below the net without touching it.
    - In the upper part of the leather component on the left, a line across crosses both short upper verticals, and a short horizontal line joins their bottom ends.
    - In the middle of the leather component, a short left vertical, a top line across that turns down on the right, and a bottom line across form a closed rectangular box.
    - A long straight vertical spine runs from the bottom of the leather component's upper neck down through the middle box and crosses the wide lower line across, ending in a plain point at the bottom with no hook.
    - The leather component on the lower left and the horse on the lower right do not touch each other.
    - In the horse on the lower right, the upper stroke runs across and turns down to touch the horizontal middle section of the main body stroke, which goes down, turns across to the right, and turns down to end in a hook to the left.
    - The horse's bottom line across sits inside the lower opening and stands completely free, touching neither the leather component on the left nor the horse's leg on the right.
  strokes:
    - where: a short line slanting down to the right on the left side of the top frame
      part: the left side of the net's frame
    - where: a line across the top, turning down to the left at the top right
      part: the top bar and right side of the net's frame
    - where: a short vertical line inside the left part of the top frame
      part: the left inner mesh cord of the net
    - where: a short vertical line inside the right part of the top frame
      part: the right inner mesh cord of the net
    - where: a line across the bottom of the top frame, rising slightly to the right to close the box
      part: the bottom bar of the net's frame
    - where: a line across the upper part of the lower-left half, rising slightly to the right
      part: the upper cross-strap across the head of the leather hide
    - where: a short vertical line on the left of the upper section in the lower-left half, crossing the upper line across
      part: the left ear of the leather hide
    - where: a short vertical line on the right of the upper section in the lower-left half, touching the net above and crossing the upper line across
      part: the right ear of the leather hide
    - where: a short line across joining the bottoms of the two short upper verticals in the lower-left half
      part: the neck band of the leather hide
    - where: a short line slanting down to the right on the left side of the middle box in the lower-left half
      part: the left edge of the stretched leather body
    - where: a line across the top of the middle box in the lower-left half, turning down on the right
      part: the upper edge and right side of the stretched leather body
    - where: a line across the bottom of the middle box in the lower-left half, closing it
      part: the lower edge of the stretched leather body
    - where: a wide line across the lower part of the lower-left half, below the middle box
      part: the lower stretcher bar across the bottom of the leather hide
    - where: a long straight vertical line down the centre of the lower-left half, from the neck band through the middle box and the lower bar to a plain point at the bottom
      part: the central vertical strap running down the spine of the leather hide
    - where: in the lower-right half, a line across the top that turns down on the right
      part: the horse's head and neck
    - where: in the lower-right half, a line going down on the left, turning across to the right, and turning down on the right to end in a hook to the left at the bottom
      part: the horse's chest, back, hindquarters and hind leg, the hook its hoof
    - where: a horizontal line across the lower part of the lower-right half, standing free of the surrounding strokes
      part: the horse's forelegs stretched beneath its body

仄:
  checked: argon
  object: a person standing with tilted head under the low overhang of a cliff
  history: >-
    The oldest forms placed a man with a tilted head beneath an overhanging cliff, forced to stoop
    in the cramped space. The modern form simplifies the figure under the cliff to a person 人.
  layout: >-
    A pale stone cliff fills the top and left, its overhanging ledge along the top stroke and its
    steep rock face sweeping down the left stroke. Tucked beneath the overhang in the lower right, a
    person stands facing slightly left with head tilted beneath the low rock ceiling, a friendly
    face with eyes, a nose and a mouth just above the upper sweep, and simple pale clothes.
  exact:
    - The top line of the cliff starts at the top of the left sweep, where the two cliff strokes touch, and rises slightly to the right.
    - The left cliff stroke sweeps down from that top-left corner and curves out to the bottom left.
    - The person sits tucked beneath the cliff and does not touch either cliff stroke.
    - The person's right-leg stroke starts from the middle of the body sweep and reaches further right than the cliff's top line.
  strokes:
    - where: a line across the upper part from left-centre to right, rising slightly to the right
      part: the overhanging top ledge of the cliff
    - where: a long sweep from the left end of the top line down the left side, curving out to the bottom left
      part: the steep rock wall of the cliff
    - where: a sweep from the upper centre, below the cliff ledge, down and out to the lower left
      part: the stooping person's body, running down into the left leg
    - where: a falling stroke from the middle of the person's body sweep down and out to the bottom right
      part: the person's braced right leg

羈:
  checked: argon
  object: a woven halter net at the top, above a stretched leather harness on the bottom left and a horse in profile on the bottom right
  history: >-
    An ideogrammic compound combining a net at the top, a stretched animal hide for leather on the
    bottom left, and a horse on the bottom right: a leather halter used to restrain and control a
    horse.
  layout: >-
    A wide rectangular net frame spans the top, pale rope mesh filling its three cells. Below it on
    the left sits a tan leather hide stretched flat as a harness, and on the right stands a pale
    brown horse in profile facing left toward the leather harness, with a flowing mane, a curved
    rump and tail on the far right, and four legs in a row underneath.
  exact:
    - The top net frame is wide and flat, divided inside by two short vertical strokes that touch both the top line and the bottom line.
    - The top net does not touch the leather hide or the horse below it, and the leather hide on the left and the horse on the right do not touch each other.
    - In the leather hide on the bottom left, two short vertical strokes cross the upper horizontal line and are joined at their bottoms by a short horizontal bar.
    - A long straight vertical line runs down the centre of the leather hide from the short joining bar through the middle box and the lower horizontal line, ending in a plain point at the bottom with no hook.
    - In the horse on the bottom right, the two short horizontal mane lines cross the inner vertical line but stop short of the left vertical neck line, leaving a small gap.
    - The horse's long back line meets the bottom of the left neck vertical, runs right, turns down at the far right, and ends in a prominent hook to the left.
    - Four short leg strokes sit in a row beneath the horse's body and stand free of every other stroke, the leftmost slanting slightly left and the other three slanting down to the right.
  strokes:
    - where: a short line slanting down to the right on the left side of the top part
      part: the left side of the halter net frame
    - where: a wide line across the top, turning down at the top right and ending in a small hook to the left
      part: the top and right edge of the halter net frame
    - where: a short vertical stroke inside the left part of the top box
      part: the left inner cord of the halter net
    - where: a short vertical stroke inside the right part of the top box
      part: the right inner cord of the halter net
    - where: a line across the bottom of the top box, rising slightly to the right
      part: the bottom bar of the halter net frame
    - where: a line across the upper part of the bottom-left half, rising slightly to the right
      part: the upper cross-bar of the leather harness
    - where: a short line down on the left of the upper part of the bottom-left half, crossing the upper line across
      part: the upper-left strap of the leather harness
    - where: a short line down on the right of the upper part of the bottom-left half, crossing the upper line across
      part: the upper-right strap of the leather harness
    - where: a short line across joining the bottoms of the two upper vertical strokes in the bottom-left half
      part: the neck bar of the leather harness
    - where: a short line slanting down to the right on the outer left of the middle of the bottom-left half
      part: the left edge of the middle leather panel
    - where: a line across the middle of the bottom-left half, turning down on the right with a small hook
      part: the top and right edge of the middle leather panel
    - where: a line across the bottom of the middle box in the bottom-left half
      part: the bottom edge of the middle leather panel
    - where: a wide line across the lower part of the bottom-left half, rising slightly to the right
      part: the lower cross-strap of the leather harness
    - where: a long straight line down the centre of the bottom-left half, from the neck bar down to a plain point at the bottom
      part: the central vertical spine strap of the leather harness
    - where: a line across the top of the bottom-right half, rising slightly to the right
      part: the top of the horse's head and crest
    - where: a line down the left side of the bottom-right half
      part: the front of the horse's neck
    - where: a short line across the upper middle of the bottom-right half, rising slightly to the right
      part: the upper lock of the horse's mane
    - where: a short line across the middle of the bottom-right half, below the upper one
      part: the lower lock of the horse's mane
    - where: a line down the middle of the horse's neck in the bottom-right half, crossing the two short mane lines
      part: the centre line of the horse's neck and mane
    - where: a long line across the lower middle of the bottom-right half, turning down on the far right and ending in a hook to the left
      part: the horse's back, rump, and curving tail
    - where: a short stroke slanting down to the left under the front of the horse
      part: the horse's front leg
    - where: a short dot slanting down to the right beside the front leg
      part: the horse's second leg
    - where: a short dot slanting down to the right under the middle of the horse
      part: the horse's third leg
    - where: a short dot slanting down to the right under the back of the horse
      part: the horse's hind leg

洽:
  checked: argon
  dropped: Because the character is purely phono-semantic with 合 serving only for its sound, picturing the components together would teach a false etymology.

丫:
  checked: argon
  object: a forked wooden branch, with an upright stem below splitting into two prongs at the top
  history: >-
    A pictogram of a fork in a branch, showing a single upright stem dividing into two prongs at the
    top.
  layout: >-
    An upright forked branch fills the square from bottom to top, with pale brown wood drawn around
    and behind the strokes and a soft pale green leafy crown behind the upper fork. The vertical
    stroke down the middle is the main stem, and the two upper strokes are the left and right prongs
    branching out at the top.
  exact:
    - The upper-left stroke slants down to the right and stops short of the vertical stem, standing free with a small gap.
    - The upper-right sweep starts higher than the upper-left stroke and runs down to the left to touch the top of the vertical stem.
    - The vertical stem runs straight down the middle and ends in a plain point at the bottom, with no hook.
  strokes:
    - where: a short stroke in the upper left, slanting down to the right toward the centre
      part: the left prong of the forked branch
    - where: a sweep in the upper right, running down to the left to meet the top of the centre line
      part: the right prong of the forked branch
    - where: a straight line down the middle, from the fork to the bottom
      part: the upright stem of the branch

冑:
  checked: argon
  dropped: Because 由 is solely phonetic in this phono-semantic compound, picturing it as part of a helmet scene would teach a false etymology.

凿:
  checked: argon
  object: a notched chisel or drill boring straight down into a sunken stone hollow or mortar open at the top
  history: >-
    The oldest oracle bone forms drew a notched chisel or drill above a mortar or cavity being bored
    out. Later forms added a hand with a striker and a metal component to create the complex form,
    while the modern simplified form returned to the notched chisel descending into an open hollow
    at the bottom.
  layout: >-
    A tall vertical chisel with a wide flanged collar and notched head fills the upper and central
    part of the frame, driving straight down into an open-topped rectangular stone hollow or mortar
    at the bottom. The upper head of the chisel is framed by the two inner vertical prongs and two
    outer slanting notches resting above the wide horizontal collar. Below the collar, the tapered
    neck leads to the banded lower shaft and vertical cutting blade, whose tip presses directly into
    the floor of the stone hollow. The chisel is shaded in pale cool grey-blue and the stone hollow
    in pale warm tan.
  exact:
    - The two inner vertical strokes at the top both touch the wide horizontal line across the upper middle, while the two outer slanting strokes on the left and right stand completely free.
    - The wide horizontal line across the upper middle is the widest stroke of the character, more than twice as long as the two shorter horizontal lines below it.
    - Below the wide horizontal line, the left dot stands free, while the right slanting stroke starts on the wide horizontal line and runs down to touch the middle horizontal line.
    - Of the two shorter horizontal lines in the middle, the lower one is slightly shorter than the upper one.
    - The lower central vertical stroke starts on the upper of the two short horizontal lines, crosses the lower one, and runs straight down to touch the floor of the bottom hollow.
    - The hollow at the bottom is open at the top, with its left wall and floor formed by one stroke that turns sharply at the bottom left and rises slightly to touch the middle of the right vertical wall.
  strokes:
    - where: a vertical line in the upper centre, just left of the middle, running down to touch the wide horizontal line
      part: the left inner prong of the chisel's notched head
    - where: a vertical line in the upper centre, just right of the middle, starting slightly higher and running down to touch the wide horizontal line
      part: the right inner prong of the chisel's notched head
    - where: a short stroke on the upper left, slanting down to the right and standing free
      part: the left outer notch at the top of the chisel head
    - where: a short sweep on the upper right, slanting down to the left and standing free
      part: the right outer notch at the top of the chisel head
    - where: a long horizontal line running across the upper middle from the far left to the far right, rising slightly
      part: the wide horizontal guard collar of the chisel
    - where: a short dot below the left side of the wide horizontal line, slanting down to the right and standing free
      part: the left bevel of the chisel's tapered neck
    - where: a short slanting line below the right side of the wide horizontal line, running down and slightly left to touch the middle horizontal line
      part: the right side of the chisel's tapered neck
    - where: a medium horizontal line across the centre, about half as long as the wide upper line
      part: the upper reinforcing band on the chisel's shaft
    - where: a slightly shorter horizontal line across the lower centre, below the upper band
      part: the lower reinforcing band on the chisel's shaft
    - where: a straight vertical line running down the centre from the upper band, crossing the lower band, to touch the bottom floor
      part: the central cutting blade of the chisel boring down into the stone
    - where: a vertical line down the lower left that turns sharply at the bottom left to run across as the floor, rising slightly to the right
      part: the left rock wall and floor of the sunken hollow being chiselled
    - where: a vertical line down the lower right, extending slightly below the floor stroke
      part: the right rock wall of the sunken hollow
