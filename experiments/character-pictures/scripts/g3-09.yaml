    thread (幺, above) for its continuous line, and two dividing strokes (八, now written like 儿 on
    the left and right) for the branching out of posterity.
  layout: >-
    In the narrow central column, a pale cream twisted skein of silk thread occupies the upper half
    above a soft pale pink slice of meat with ribs in the lower half. Flanking this central column
    on the left and right are the two long parting strokes, shaded with a soft pale wash to show the
