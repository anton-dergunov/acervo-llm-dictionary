    - where: a falling stroke from the central crossing down and out to the middle right
      part: the right lower leaf of the grain stalk, draping down to the right
    - where: a sweep from below the centre down and out to the bottom left
      part: the bald person's left leg
    - where: a stroke starting at the top of the left leg, running briefly across, turning down, and curving out to the bottom right to end in an upward hook
