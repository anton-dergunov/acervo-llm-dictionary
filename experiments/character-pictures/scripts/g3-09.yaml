歹:
  checked: argon
  object: a broken piece of bone from human remains, with a wide top joint and a curved, tapering shaft below
  history: >-
    The oldest forms drew a fragment of broken bone, representing human skeletal remains. A later
    word meaning bad or wicked was merged into this form from a Tibetan letter.
  layout: >-
    A single pale ivory bone fragment fills the square. A wide top joint stretches across near the
    top, and a curved, splintered bone shaft hangs from its middle, sweeping toward the bottom left
    with a small hollow mark inside the shaft. Soft cream and pale beige shading gives the bone
    gentle volume behind the strokes.
  exact:
    - The top line across is long, spanning most of the width near the top.
    - The upper sweep starts at the middle of the top line and curves down to the middle left without crossing the top line.
    - The lower turning stroke starts at the middle of the upper sweep, runs across to the right for a little over a third of the top line's length, and turns into a long sweep down to the bottom left.
    - The short dot inside the shaft slants down to the right and stands free, with a small gap between its start and the upper sweep.
  strokes:
    - where: a long line across near the top, from the upper left to the upper right
      part: the wide top joint of the bone
    - where: a sweep starting at the middle of the top line and curving down to the middle left
      part: the upper left edge of the broken bone shaft
    - where: a stroke starting at the middle of the upper sweep, running a short way across to the right and turning into a long sweep down to the bottom left
      part: the notched shoulder and long tapering right edge of the bone shaft
    - where: a short dot inside the shaft, slanting down to the right just below the middle of the upper sweep
      part: a hollow mark on the inside of the bone

彪:
  checked: argon
  object: a tiger on the left with its long tail curving under to the right, and three bold stripes across its flank on the right
  history: >-
    An ideogrammic compound combining a tiger (虎) on the left and bottom with three slanted strokes
    (彡) on the right depicting the stripes on a tiger's coat.
  layout: >-
    A pale ochre tiger stands on the left and wraps around the bottom of the frame, facing right.
    Its upright ear and head sit at the top left, its arched back sweeps down the far left, its
    foreleg is tucked in the middle, and its hind legs and long tail stretch from the lower left
    wide across the bottom to curl up at the far bottom right. Above the curving tail on the right
    side, the three parallel sweeps form three bold stripes across the tiger's flank.
  exact:
    - At the top of the left side, the short rising line starts at the middle of the top vertical, and the bottom of that vertical touches the middle of the upper hooked horizontal.
    - The long left sweep starts at the left end of the upper hooked horizontal and runs all the way to the bottom left.
    - Inside the middle of the tiger component, the shorter horizontal is a little over half as long as the upper hooked horizontal; the L-shaped hooked stroke crosses the middle of this shorter horizontal, and neither stroke touches the surrounding strokes.
    - In the lower section, the wide bottom stroke starts at the top of the lower-left sweep, turns down, and stretches across the bottom to the far right, ending in a tall upward hook beneath the stripes.
    - The three slanted sweeps on the right stand completely free of one another and of the tiger strokes, stacked from top to bottom with the lowest sweep the longest.
  strokes:
    - where: a short vertical line near the top left-centre
      part: the back of the tiger's upright ear
    - where: a short line from the middle of the top vertical, rising slightly to the right
      part: the tip of the tiger's ear
    - where: a line across the upper left below the top vertical, ending in a short hook down to the left
      part: the top of the tiger's head and snout
    - where: a long sweep from the left end of the upper horizontal down along the far left side to the bottom left
      part: the tiger's arched back
    - where: a shorter line across the middle left inside the enclosure, rising slightly to the right, a little over half as long as the upper horizontal
      part: the tiger's lower jaw
    - where: a stroke starting below the upper horizontal, going down to cross the shorter horizontal, then turning right across the middle and ending in an upward hook
      part: the tiger's chest and bent foreleg
    - where: a sweep in the lower left from below the middle section down and out to the bottom left
      part: the tiger's left hind leg
    - where: a long stroke starting at the top of the lower-left sweep, going shortly right, turning down, and curving wide across the bottom to the far bottom right, ending in a tall upward hook
      part: the tiger's right hind leg and long curving tail
    - where: a sweep in the upper right, slanting down and to the left
      part: the top stripe on the tiger's flank
    - where: a sweep in the middle right below the upper sweep, slanting down and to the left
      part: the middle stripe on the tiger's flank
    - where: a longer sweep in the lower right below the middle sweep, slanting down and to the left above the wide bottom tail stroke
      part: the bottom stripe on the tiger's flank

