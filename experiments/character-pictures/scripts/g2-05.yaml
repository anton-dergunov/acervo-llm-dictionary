    - The altar's top and right side are one stroke that starts at the top of the left vertical, runs across, and turns down to meet the base slab without a hook.
    - Both inner shelf lines touch the altar's left side and stop short of its right side.
    - Both sides of the narrow altar block stand on the middle of the wide base line, which is about as long as the roof above.
