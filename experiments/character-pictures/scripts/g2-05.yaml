曼:
  checked: argon
  object: two hands pulling an eye wide open, with an upper hand at the top, a wide horizontal eye in the middle, and a lower hand below
  history: >-
    The ancient form combined an eye lying horizontally in the middle with hands above and below
    holding or pulling the eyelids wide open to gaze far out. Over time the upper part became the
    box of 日, the middle remained the sideways eye 罒, and the lower part remained the hand 又.
  layout: >-
    Three parts stack from top to bottom without touching. At the top is a narrower boxy upper hand
    reaching down toward the brow; across the middle is a wide horizontal almond eye with a pale
    brown or blue iris framed between its two inner vertical lines; at the bottom is a large lower
    hand with crossed strokes reaching from below to pull the lower lid down. All skin tones and
    iris shading are kept pale and soft behind the strokes.
  exact:
    - The three stacked parts (top box, middle eye box, and bottom crossed hand) are separated by small gaps and do not touch one another.
    - In the top box, the left side slants slightly down to the right, the top runs across and turns down on the right, the bottom line closes the box, and the inner line touches the left side but stops short of the right side.
    - The middle box is much wider and shallower than the top box; its top line is the widest horizontal in the character, while the top box's top leg is about half as wide.
    - Inside the middle box, two short strokes run from the top line down to the bottom line without touching each other, dividing the eye into three compartments.
    - In the bottom part, the first stroke runs across and turns sharply at the right to sweep down and out to the bottom left, and the second stroke falls from upper left to bottom right, crossing the sweep in the middle.
  strokes:
    - where: a short line in the upper centre-left, slanting slightly down to the right
      part: the left side of the upper hand
    - where: a line across the top, turning down on the right to close the right side of the upper box
      part: the back and right edge of the upper hand
    - where: a short line across the middle of the upper box, rising slightly to the right
      part: a knuckle crease across the upper hand
    - where: a short line across the bottom of the upper box, closing it
      part: the fingertips of the upper hand resting above the eye
    - where: a short line on the middle left, slanting down to the right
      part: the left corner of the wide eye
    - where: a wide line across the middle, turning down and inward at the right
      part: the upper eyelid and right corner of the eye
    - where: a short dot-like stroke inside the left-centre of the middle box, slanting down to the right
      part: the left edge of the iris
    - where: a short line inside the right-centre of the middle box, slanting slightly down to the left
      part: the right edge of the iris
    - where: a line across the bottom of the middle box, a little over half as wide as its top line, closing the eye
