冰:
  checked: argon
  object: two shards of ice on the left beside a stream of water flowing down and splashing out to both sides
  history: >-
    The left part 冫 (originally written 仌) was the oldest pictogram for ice, drawing two angled
    shards or crystals of frost. The water component 水 was added on the right to make clear that the
    character means frozen water.
  layout: >-
    The narrow ice component sits on the far left as two pale-blue crystalline shards of ice, while
    the much wider and taller water component fills the centre and right as a cold stream flowing
    down from top to bottom and splashing out to both sides. Soft pale blue and icy aqua washes
    surround the ice shards and the flowing water behind the strokes.
  exact:
    - The left ice part is narrow and shorter, while the right water part is much wider and taller, reaching from near the top to the bottom.
    - The two strokes on the far left (an upper dot slanting down to the right and a lower stroke rising up to the right) stand completely free of each other and of the water part.
    - The long central vertical runs straight down from the top and ends at the bottom in a hook to the left.
    - The bent stroke to the left of the central vertical runs across toward the centre and turns sharply to sweep down to the bottom left; it stands completely free, stopping just short of the central vertical and not touching the two ice strokes to its left.
    - On the right side, the short upper sweep runs down to the left to meet the start of the long lower-right falling stroke at the middle of the central vertical.
  strokes:
    - where: a short dot at the upper left, slanting down to the right
      part: an upper shard of ice beside the stream
    - where: a rising stroke at the lower left, running from the bottom left up and to the right
      part: a lower shard of ice tilted upward along the frozen bank
    - where: a long line straight down the centre from the top to the bottom, ending in a hook to the left
      part: the main stream flowing down, curling into a small eddy at the bottom
    - where: a stroke in the middle left running across toward the centre, then turning sharply to sweep down to the bottom left
      part: a side current branching off to the left and splashing down
    - where: a short sweep at the upper right, slanting down and to the left toward the middle of the central vertical
      part: a spray of water splashing in from the upper right
    - where: a long falling stroke from the middle of the central vertical down and out to the bottom right
      part: a current flowing out to the lower right

