奋:
  checked: argon
  object: a bird spreading its great wings wide at the top as it rises in flight above a square field divided into four plots at the bottom
  history: >-
    The traditional form 奮 is an ideogrammic compound of a bird spreading its wings (奞) above a
    field (田), showing a bird rising in flight from the fields. The simplified form 奋 omits the
    inner bird component (隹), leaving the wide outstretched wings (大) above the field (田).
  layout: >-
    The wide figure of the bird fills the upper part of the square, facing the viewer as it rises in
    flight with pale feathers, a small head with eyes and a beak at the top centre, great wings
    stretched wide across the upper half, and its tail and trailing feathers sweeping wide out to
    the left and right like a roof. Nestled beneath the bird between the two sweeping strokes sits
    the smaller squarish rice paddy, about half as wide as the outstretched wings above it, with
    four pale green-and-tan plots inside its banks.
  exact:
    - The upper figure is nearly twice as wide as the field tucked beneath it.
    - The long sweep from the top centre crosses the upper line across and runs down to the middle left; the top-left corner of the field touches the underside of this sweep.
    - The right-hand sweep starts on the underside of the upper line across, a little to the right of the left sweep so that the two sweeps do not touch each other, and sweeps out to the middle right without touching the field.
    - The field's top edge is about two thirds as long as the upper wing line across, turns down at the top right to form the right side, and ends at the bottom right in a hook up to the left.
    - Inside the field, the vertical dividing line touches both the top edge and the bottom edge, while the horizontal dividing line crosses it in the middle and stops just short of both the left and right sides.
    - The bottom edge of the field connects the bottom of the left side to the right side just above its hook.
  strokes:
    - where: a long line across the upper part, rising slightly to the right
      part: the bird's great wings, stretched wide from tip to tip
    - where: a long sweep from the top centre, crossing the arm line and curving down and out to the middle left
      part: the bird's head and body, sweeping down into the left side of its spread tail
    - where: a long sweep starting on the arm line to the right of the body, running down and out to the middle right
      part: the right side of the bird's spread tail and trailing wing edge, sweeping wide to the right
    - where: a line down the left side of the lower field, slanting slightly inward to the bottom
      part: the bank along the left edge of the rice paddy
    - where: a line across the top of the field, about two thirds as long as the arm line, turning down at the top right to run down the right side and ending in a hook up to the left
      part: the banks along the top and the right edge of the rice paddy
    - where: a short line across the middle of the field, stopping just short of the left and right sides
      part: the inner bank dividing the upper plots from the lower plots
    - where: a straight line down the middle of the field, from the top edge to the bottom edge
      part: the inner bank dividing the left plots from the right plots
    - where: a short line across the bottom of the field, joining the left side to the right side above its hook
      part: the bank along the bottom edge of the rice paddy

