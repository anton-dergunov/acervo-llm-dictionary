奮:
  checked: argon
  object: a bird spreading its great wings wide at the top as it rises in flight above a square field divided into four plots at the bottom
  history: >-
    An ideogrammic compound combining a bird spreading its big wings (奞, made of 大 above and 隹 in
    the middle) with a field (田) below: a bird flinging its wings open to take off from the fields,
    and by extension to rouse oneself and strive.
  layout: >-
    Three parts stack from top to bottom. Across the upper half, the great outspread wings (大) arch
    wide to the left and right. Tucked beneath them in the middle sits the compact body of the bird
    (隹), facing left, with its small head at the top and tiered feathers across its back. At the
    bottom sits a flat rice paddy (田) seen from above, divided into four pale green and tan plots by
    raised earth banks. Colours are soft pale browns, greys, and muted greens.
  exact:
    - The top part's long line across is crossed near its middle by the long left sweep, while the right sweep starts on that line across to the right of the crossing and sweeps down and out to the right.
    - The middle bird component does not touch the wide wings above it or the field below it.
    - The short dot at the top of the middle bird stands completely free between the upper line across and the bird's top horizontal line.
    - On the left of the middle bird, a short sweep runs down to the left, and a straight vertical line starts from the middle of that sweep and runs down without touching the field below.
    - On the right of the middle bird, four horizontal lines stack one above another; the bottom one is clearly longer than the three above it, Starts on the left vertical line, and a central vertical line runs from the middle of the top horizontal through the middle two to end on the bottom horizontal.
    - In the bottom field, the outer frame narrows slightly toward the bottom, its right side ends in a hook at the bottom right, the inner vertical connects the top and bottom edges, and the inner horizontal crosses the inner vertical without touching the left or right sides.
