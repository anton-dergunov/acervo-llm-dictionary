# Full run, group g1, batch 14. Written from the fact sheets, following scripts/GUIDE.md.

幸:
  object: a clay mound standing above a tall dry pole with two crossbars, the living one above and the lifeless one below, the lucky one being the living
  history: >-
    An ideogram: two figures, one alive and one dead, and the one who lives is lucky. The upper
    part is earth, the lower part is a dry pole.
  layout: >-
    The mound of clay sits in the upper part of the frame on a flat pale disk. Below it a tall dry
    wooden pole with two crossbars fills the lower part, a short pale tassel hanging at each side of
    its top. Everything is in soft pale earth and wood colours, with a pale warm sky behind.
  exact:
    - The long line across the bottom of the mound is the longest line across in the character, and the short line across the top of the mound is less than half as long.
    - The upright of the mound crosses the short line across and ends on the long line across the bottom of the mound.
    - The left tassel is a small dot that stands free; it touches nothing and stops short of both the disk and the upper crossbar.
    - The right tassel hangs from the middle of the disk's line and ends on the upper crossbar, turning back down to the left at its end.
    - The upper crossbar is a little over half as long as the disk's line; the lower crossbar is nearly as long as the disk's line.
    - The pole starts on the middle of the upper crossbar, runs down, crosses the lower crossbar and ends in a plain point with no hook.
  strokes:
    - where: a short line across the top of the upper half, rising very slightly to the right
      part: the flat top of the clay mound
    - where: a short stroke down through the middle of the short line across, slanting a little to the right, ending on the long line below
      part: the spindle running through the clay
    - where: a long line across the upper half, below the short line and almost the full width of the frame, rising slightly to the right
      part: the flat disk the clay mound stands on
    - where: a small dot in the middle left, down to the right, standing free
      part: the left tassel hanging at the top of the pole
    - where: a short stroke from the middle of the long line down to the right, then curving back down to the left
      part: the right tassel, hanging from the disk and ending on the upper crossbar
    - where: a medium line across the middle of the frame, a little over half as long as the disk's line
      part: the pole's upper crossbar
    - where: a long line across the lower part of the frame, nearly as long as the disk's line
      part: the pole's lower crossbar
    - where: a long straight line down from the middle of the upper crossbar, crossing the lower crossbar, to the bottom
      part: the dry pole itself

倖:
  object: a person standing at the left beside a clay mound above a tall dry pole with two crossbars, the lucky pair of the living and the lifeless, the lucky one being the living
  history: >-
    An ideogram: two figures, one alive and one dead, and the one who lives is lucky. The upper
    part is earth, the lower part is a dry pole; the person on the left makes it a lucky person.
  layout: >-
    A person fills the left third of the frame from head to feet, facing right toward the lucky
    scene, with a friendly face and simple pale clothes. In the right two thirds a clay mound sits in
    the upper part on a flat pale disk, and below it a tall dry wooden pole with two crossbars fills the
    lower part, a short pale tassel hanging at each side of its top. Soft pale earth and wood colours.
  exact:
    - The person's second stroke starts on the middle of the first and runs straight down, a plain vertical with no hook.
    - The person does not touch the mound or the pole.
    - The long line across the bottom of the mound is the longest line across, and the short line across the top of the mound is a little under half as long.
    - The upright of the mound crosses the short line across and ends on the long line across the bottom of the mound.
    - The small dot below the mound stands free and touches neither the long line above it nor the crossbar below.
    - The right tassel hangs from the middle of the long line and ends on the upper crossbar, turning back down to the left at its end.
    - The upper crossbar is about half as long as the long line above it; the lower crossbar is a little over three quarters as long.
    - The pole starts on the middle of the upper crossbar, crosses the lower crossbar and ends in a plain point with no hook.
  strokes:
    - where: a stroke on the left from the top down to the bottom left, ending turned a little out to the left
      part: the person's head and back, sweeping down to the left foot
    - where: a straight line down from the middle of the first stroke to near the bottom, on the left
      part: the person's body and legs, standing upright
    - where: a short line across the top of the right part, rising slightly to the right
      part: the flat top of the clay mound
    - where: a short stroke down through the middle of the short line across, slanting a little to the right, ending on the long line below
      part: the spindle running through the clay
    - where: a long line across the upper part of the right two thirds, below the short line, rising slightly to the right
      part: the flat disk the clay mound stands on
    - where: a small dot in the middle of the right part, down to the right, standing free
      part: the left tassel hanging at the top of the pole
    - where: a short stroke from the middle of the long line down to the right, then curving back down to the left
      part: the right tassel, hanging from the disk and ending on the upper crossbar
    - where: a medium line across the middle, about half as long as the disk's line
      part: the pole's upper crossbar
    - where: a long line across the lower part, a little over three quarters as long as the disk's line
      part: the pole's lower crossbar
    - where: a long straight line down from the middle of the upper crossbar, crossing the lower crossbar, to the bottom
      part: the dry pole itself

朋:
  object: two crescent moons standing side by side, close companions walking together
  history: >-
    An ideogram: two companions walking together, written as two moons side by side. The oldest
    forms drew two strings of shells; the modern form shows two crescents.
  layout: >-
    Two upright crescent moons stand side by side, both lit and curved on their right sides, like
    friends walking together. The right moon is a little wider and taller than the left. Both are pale
    gold with a soft glow, and a pale evening sky is behind them.
  exact:
    - The two moons do not touch each other; there is a clear gap between the left moon's right side and the right moon's left line.
    - Each moon's long left line is straight and ends curving slightly out to the bottom left.
    - Each moon's top line turns down at the top right and runs down its right side, ending in a small hook to the left.
    - The two short craters in each moon touch its left line and stop short of its right side.
    - The right moon is wider and a little taller than the left moon.
    - The left moon's top line starts at the top of its left line; the right moon's top line starts at the top of its left line too.
  strokes:
    - where: a long line down the left side of the left moon, curving slightly out to the bottom left at its foot
      part: the left moon's inner edge, its foot sweeping out into the lower horn
    - where: a line across the top of the left moon, turning down at the top right and running down its right side, ending in a small hook to the left
      part: the left moon's upper horn and its rounded back
    - where: a short dot-like stroke in the upper middle of the left moon, rising slightly to the right, touching the left line
      part: a crater on the left moon's face
    - where: a short dot-like stroke in the lower middle of the left moon, rising slightly to the right, touching the left line
      part: a second crater on the left moon's face
    - where: a long line down the left side of the right moon, curving slightly out to the bottom left at its foot
      part: the right moon's inner edge, its foot sweeping out into the lower horn
    - where: a line across the top of the right moon, turning down at the top right and running down its right side, ending in a small hook to the left
      part: the right moon's upper horn and its rounded back
    - where: a short dot-like stroke in the upper middle of the right moon, rising slightly to the right, touching the left line
      part: a crater on the right moon's face
    - where: a short line across in the lower middle of the right moon, rising slightly to the right, touching the left line
      part: a second crater on the right moon's face

承:
  object: a limp, sleeping person held up high on three hands
  history: >-
    An ideogram: three hands lifting a lifeless body. The modern form keeps the body and three bars
    for the hands.
  layout: >-
    A small person stands upright in the middle of the frame, limp, with closed eyes, a calm face and
    simple pale clothes, held up by three hands. Three flat hands cross the body one under another in
    its middle, and two arms reach in from the sides: a long one from the left, a short one from the
    right. Soft pale colours.
  exact:
    - The person's top stroke runs across and ends in a hook turning down to the left, and the body line starts exactly at its end.
    - The body line is a vertical turning down to the left and ending in a small hook up to the left, with no touching of the left arm.
    - The three short bars all cross the body line; the top two are short and about the same length, the lowest is longer, about half as long as the left arm.
    - None of the three bars touches the left arm or the right arm.
    - The left arm is the longest line across; it stands free of every other stroke.
    - The right arm's short stroke ends exactly where its long stroke starts.
  strokes:
    - where: a line across the upper part, ending in a hook turning down to the left
      part: the person's head and shoulders, bowed
    - where: a long line down from the end of the first line, through the middle, turning down to the left and ending in a small hook up to the left
      part: the person's body and legs, the hook the feet
    - where: a short line across the body in the upper middle, rising slightly to the right
      part: the first hand, held flat under the shoulders
    - where: a short line across the body in the middle, rising slightly to the right, about as long as the one above
      part: the second hand, held flat under the hips
    - where: a longer line across the body in the lower middle, rising slightly to the right
      part: the third hand, held flat under the knees
    - where: a long line across the left side, turning down to the left at its end, standing free
      part: the arm of the lifter on the left, bending down
    - where: a short stroke at the upper right, down to the right and then turning back down to the left
      part: the raised hand of the lifter on the right
    - where: a stroke from the middle of the right side down to the right, then turning across to the right at its end
      part: the lifter's arm on the right, running out to its forearm

昔:
  object: a tally rack of two upright sticks and a crossbar, standing on a long base board, with the sun below it
  history: >-
    An ideogram: twenty days ago, written as the sign for twenty above the sun. The upper part is
    two tally posts crossed by a bar; the lower part is the sun.
  layout: >-
    A tally rack with two slim upright posts crossed by one bar stands in the upper half on a long
    base board that spans almost the full width of the frame. Below it, a smaller round sun fills the
    middle of the lower half, in soft gold, with a pale sky behind. The sun is much narrower than the
    base board.
  exact:
    - The two posts cross the bar and their ends rest on the long base board.
    - The bar across is a little over half as long as the base board.
    - The long base board is the longest line across; the sun is much narrower than it.
    - The sun's left side and the base board do not touch; there is a clear gap between them.
    - The sun's top-and-right stroke starts at the top of its left side and ends in a small hook to the left that meets the end of the bottom line.
    - The sun's middle line stands free, touching only the left side.
  strokes:
    - where: a line across the upper part, in the middle of the two posts, rising slightly to the right
      part: the tally rack's crossbar
    - where: a short stroke in the upper left, slanting a little to the right, ending on the base board
      part: the left post
    - where: a stroke in the upper right, slanting a little to the right, ending on the base board
      part: the right post
    - where: a very long line across the middle of the frame, almost the full width
      part: the base board of the rack
    - where: a short line down the left side of the lower half, slanting a little to the right
      part: the sun's left rim
    - where: a line across the top of the lower half, turning down at the top right and running down the right side, ending in a hook to the left
      part: the sun's top and right rim
    - where: a short line across the middle of the sun, rising slightly to the right
      part: the bright band of light at the sun's heart
    - where: a short line across the bottom of the sun, rising slightly to the right, meeting the end of the right rim
      part: the sun's bottom rim

昇:
  object: the sun rising above a long horizon bar that is held up by two stout poles
  history: >-
    An ideogram: the rising sun. The sun is written on top, the sign for rising below it.
  layout: >-
    A round sun sits in the upper part of the frame in soft gold, a little left of centre, lifted up
    over the horizon. Below it a long horizon bar spans almost the full width and rests on two stout
    pale wooden poles that pass through it; a small brace stands at the top of the left pole. A pale
    dawn sky is behind.
  exact:
    - The sun is small and sits in the upper half; its left side is a short vertical stroke.
    - The sun's top line turns down at the right and ends in a hook that meets the end of the bottom line.
    - The sun's middle line does not touch the sun's right rim.
    - The left brace is a short sweep down to the left and does not touch the sun.
    - The horizon bar is the longest line across; the sun's top line is a little over half as long as the bar, and the two short lines inside the sun are only about a quarter as long.
    - The left pole is a little under the right pole in length, about four fifths; the right pole is the longest line down and stands clear of the sun.
    - The left pole starts on the brace, crosses the horizon bar and ends turned to the left; the right pole crosses the horizon bar and ends in a plain point with no hook.
  strokes:
    - where: a short line down the left side of the sun, slanting slightly to the right
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the right and ending in a hook to the left
      part: the sun's top and right rim
    - where: a short line across the upper middle of the sun
      part: the bright band of light at the sun's heart
    - where: a short line across the lower sun, meeting the end of the right rim
      part: the sun's bottom rim
    - where: a short sweep below the sun, down to the left
      part: the brace at the top of the left pole
    - where: a long line across the lower half, almost the full width
      part: the horizon bar
    - where: a long stroke down on the left, starting on the brace, crossing the horizon bar and ending turned to the left
      part: the left pole
    - where: a long straight line down on the right, crossing the horizon bar, to the bottom
      part: the right pole

奇:
  object: a rider sitting on a horse, the rider with arms wide and the horse standing in profile facing left
  history: >-
    An ideogram: a person riding a horse, a strange sight. The upper part is a person with arms wide,
    the lower part is the horse.
  layout: >-
    The rider sits on the horse's back in the upper part of the frame, facing us with arms stretched
    wide, a friendly face and simple pale clothes. The horse stands under the rider in the lower part,
    in profile, facing left, in a soft brown. Its head hangs low at the left, its back is the long line
    across, and one long foreleg reaches down at the middle.
  exact:
    - The rider's arm line crosses the body line near its middle; the rider's right leg is a short separate stroke that touches nothing.
    - The rider's arm line is about half as long as the horse's back.
    - The horse's back is the longest line across, spanning almost the whole frame.
    - The horse's head is a small box at the left, under the back; it touches nothing above it.
    - The head's top-and-right stroke starts at the top of the head's left side and meets the end of the bottom line; the bottom line starts on the left side.
    - The foreleg starts on the middle of the back, runs down and ends in a hook up to the left.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the rider's arms, stretched wide
    - where: a long sweep from the top centre down through the middle, then turning down to the left
      part: the rider's head and body, running down into the left leg
    - where: a very short stroke down to the right below the arms, standing free
      part: the rider's right leg, tucked against the horse
    - where: a very long line across the middle of the frame, from near the left edge to near the right edge
      part: the horse's back, the rider sitting on it
    - where: a short line down at the left, under the back, slanting a little to the right
      part: the left side of the horse's head
    - where: a short line from the top of the head's left side, rising to the right and then turning down
      part: the top and the far side of the horse's head
    - where: a short line across at the bottom of the head, rising slightly to the right
      part: the horse's chin
    - where: a long line down from the middle of the back to near the bottom, ending in a small hook up to the left
      part: the horse's foreleg, the hook its hoof

妻:
  object: a woman kneeling at the left, facing left, holding a broom upright in her hand
  history: >-
    An ideogram: a woman with a broom in her hand, the wife who keeps the house. The upper part is a
    hand holding the handle, the lower part is the woman.
  layout: >-
    The woman kneels in the lower half, in profile, facing left, with a friendly face and simple
    pale clothes. Above her head a hand holds a broom upright by its long handle; the pale bundle of
    twigs hangs behind the strokes at the lower end of the handle. Soft pale colours.
  exact:
    - The broom handle is a straight vertical with a plain end, crossing the top short line across and the hand's upper strokes.
    - The hand's top stroke turns down at its right end and ends on the long line across the middle of the hand.
    - The long line across the hand is the longest line of the hand; the lowest short line of the hand is about as long as the top short line.
    - The broom handle's lower end touches the hand's lowest line and stops short of the woman's head.
    - The woman's lap line starts on the hand's lowest line.
    - The woman's long line across is the longest line across in the character; the hand's long line is a little under it.
  strokes:
    - where: a short line across the top of the handle, rising slightly to the right
      part: the broom handle's knob at its top
    - where: a line across in the upper middle, turning down to the left at its right end
      part: the sleeve and cuff of the raised arm
    - where: a long line across the middle of the upper half, crossing the handle
      part: the forearm held out, gripping the handle
    - where: a short line across below the long one, touching the lower end of the handle
      part: the fingers closed round the handle
    - where: a long straight line down the centre of the upper half, crossing the lines across
      part: the broom's handle
    - where: a stroke from just under the fingers down and turning sharply to sweep down to the lower right
      part: the woman's head and back, then her thigh folded forward
    - where: a sweep from the middle of the lower half down to the bottom left
      part: one of the woman's arms, reaching down
    - where: a long line across the lower half, just below its middle, from the left edge to the right edge
      part: the woman's other arm, held across in front of her

奈:
  object: a man with arms wide standing behind a stone altar
  history: >-
    An ideogram: a man with spirit, bearing it. The upper part is a person with arms wide, the lower
    part is an altar.
  layout: >-
    A grown man stands in the upper part of the frame, facing us, with arms stretched wide, a friendly
    face and simple pale clothes. In front of him, in the lower half, a stone altar holds an offering
    slab above its table, with two braces at the sides of the post. Soft pale colours.
  exact:
    - The man's arm line is the longest line across, and the right leg starts on its middle.
    - The man's body line crosses the arm line, then sweeps down and out to the left; the right leg sweeps out to the right and ends turning across.
    - The small slab at the top of the altar stands free; it touches neither the man nor the table.
    - The table top is about as long as the man's arm line and clearly wider than the slab, which is half as long.
    - The post starts on the middle of the table top and ends in a small hook up to the left.
    - The two braces stand free of every other stroke and of the post.
  strokes:
    - where: a long line across the upper part, rising slightly to the right
      part: both arms, stretched wide
    - where: a long sweep from the top centre down through the middle, then curving out to the bottom left
      part: the neck and body, running down into the left leg
    - where: a sweep from the middle of the arm line down and out to the lower right, turning across at its end
      part: the right leg
    - where: a short line across below the man's middle, rising a little to the right, standing free
      part: the offering slab lying above the altar
    - where: a long line across below it, about as long as the arm line
      part: the altar's table top
    - where: a line down from the middle of the table, ending in a small hook up to the left
      part: the post holding the table
    - where: a short stroke at the lower left, slanting down to the left, standing free
      part: the altar's left brace
    - where: a short stroke at the lower right, slanting down to the right, standing free
      part: the altar's right brace

享:
  object: a baby under a roof, with a wide-open eating mouth above it
  history: >-
    An ideogram: children living and eating in a house. The top is the roof, the middle is a mouth,
    the bottom is a child.
  layout: >-
    A small roof with a tiny knob sits at the top of the frame. Below it, in the middle, a wide-open
    mouth, and under that a baby wrapped in swaddling cloth, its arms stretched out wide, with a
    friendly face. Soft pale colours.
  exact:
    - The roof's two strokes stand free of each other and of everything below.
    - The mouth is a closed shape; its left side, top and bottom all meet at their ends, and it stands clear of the baby.
    - The mouth's top line ends in a small hook down to the left.
    - The baby's head stroke runs across and ends in a hook turning back down to the left; the body line starts at its end and crosses the arms line.
    - The arms line is the longest line across, clearly wider than the roof, which is about three quarters as long.
    - The body line ends in a small hook up to the left.
  strokes:
    - where: a tiny stroke at the top centre, down to the right
      part: the knob on top of the roof
    - where: a long line across below it, rising slightly to the right
      part: the roof
    - where: a short stroke in the upper left of the middle, down to the right
      part: the mouth's left corner and left side
    - where: a line across the top of the mouth, ending in a small hook down to the left
      part: the mouth's upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip
    - where: a line across at the top of the lower part, ending in a hook turning back down to the left
      part: the baby's head, closing at the chin
    - where: a line down from the end of the head line, turning and ending in a small hook up to the left
      part: the baby's body in its wrap, the hook its bundled feet
    - where: a long line across the lower part, crossing the body line
      part: the baby's arms, stretched out wide

卒:
  object: a soldier in armour, with a helmet, shoulder plates and a cross of belt over his chest
  history: >-
    A pictogram: a soldier in armour. The oldest forms show a coat marked with a cross.
  layout: >-
    A soldier stands upright, facing us, with a friendly face, wearing a pale helmet, two round
    shoulder plates and a pale tunic. The helmet is at the top with a small knob. The face sits
    between the helmet and the shoulders. Soft pale steel and cloth colours.
  exact:
    - The helmet's knob and brim stand free of every other stroke.
    - The helmet's brim is about half as long as the belt line.
    - The belt line is the longest line across, spanning almost the whole frame, and it crosses the body line.
    - The body line is the longest line down; it starts at the end of the right shoulder plate.
    - The left shoulder plate has a small rivet touching its middle that stops short of the right plate and the body.
    - The right shoulder plate has a small rivet starting on its middle that stops short of the belt.
  strokes:
    - where: a tiny stroke at the top centre, down to the right
      part: the knob on top of the helmet
    - where: a short line across below it, rising slightly to the right
      part: the helmet's brim
    - where: a short stroke at the left, turning down to the left
      part: the left shoulder plate
    - where: a small dot on the left plate, down to the right
      part: the rivet on the left shoulder plate
    - where: a short stroke at the right, turning down to the left
      part: the right shoulder plate
    - where: a small stroke from the middle of the right plate, down to the right
      part: the rivet on the right shoulder plate
    - where: a long line across the middle of the frame, rising slightly to the right
      part: the belt over the chest
    - where: a long line down from the end of the right plate through the middle, to the bottom
      part: the soldier's body and legs

宝:
  object: treasures kept safe in a house, jade pieces on a cord under a roof, in the traditional form with a jar and shell money besides
  history: >-
    An ideogram: jade kept in a house. The traditional form also keeps a jar and shell money, the
    valuables of old.
  layout: >-
    A house roof with a small knob on top spans the upper part of the frame. Under it hangs a
    necklace cord with three pieces of pale green jade, the lowest widest, and a small round bead at the
    right. Soft pale colours.
  exact:
    - The roof's knob stands free and does not touch the roof line.
    - The left wall is a short stroke down from the roof's left end; the roof line starts at its top and ends in a small hook down to the left.
    - The top jade piece and the middle jade piece are about the same length, each about half as long as the lowest piece.
    - The cord starts on the middle of the top piece, crosses the middle piece and ends on the middle of the lowest piece.
    - The bead stands free; it touches neither the middle piece nor the lowest piece.
    - The lowest piece is the longest line across, about as long as the roof line.
  strokes:
    - where: a small stroke at the top centre, down to the right, standing free
      part: the knob on the roof
    - where: a short stroke down at the upper left
      part: the roof's left eave
    - where: a long line across below the knob, starting at the top of the left eave and ending in a hook down to the left
      part: the roof's ridge and right eave
    - where: a line across the upper part under the roof, rising slightly to the right, about half as long as the roof line
      part: the upper jade piece
    - where: a line across the middle, about half as long as the roof line and about as long as the upper piece
      part: the middle jade piece
    - where: a straight line down from the middle of the upper piece, crossing the middle piece, to the bottom piece
      part: the necklace cord
    - where: a long line across the bottom, about as long as the roof line
      part: the lowest, widest jade piece
    - where: a small dot at the right, below the middle piece and above the bottom piece, slanting down to the right
      part: the small jade bead

寶:
  object: treasures kept safe in a house, jade pieces on a cord under a roof, in the traditional form with a jar and shell money besides
  history: >-
    An ideogram: jade kept in a house. The traditional form also keeps a jar and shell money, the
    valuables of old.
  layout: >-
    A house roof with a small knob spans the top of the frame. Under it, at the left, a short cord
    hangs three pale green jade bars, the lowest widest; at the right stands a small round pottery jar;
    below them, in the lower half, a large cowrie shell with two small legs, the shell money. Soft pale colours.
  exact:
    - The roof's knob stands free and does not touch the roof line.
    - The roof line starts at the top of the left eave and ends in a small hook down to the left.
    - The jade bars are small, at the left; the lowest bar is the longest of the three and rises slightly to the right.
    - The jade cord starts on the middle of the top bar, crosses the middle bar and ends on the lowest bar.
    - The jar's right wall touches the end of the jar's belly line and the jar's two top strokes meet at the rim.
    - The jar's upright line crosses its shoulder line.
    - The shell's left line starts at the same point as its top line; the shell's bottom line ends where the top-and-right line ends.
    - The shell's two inner lines touch the left line and stop short of the right side.
    - The shell's two legs stand free, do not touch the shell, and are about the same size; the right leg is a little shorter.
    - The shell is the largest part, and its top-and-right line is about three quarters as long as the roof line.
  strokes:
    - where: a small stroke at the top centre, down to the right, standing free
      part: the knob on the roof
    - where: a short stroke down at the upper left
      part: the roof's left eave
    - where: a long line across below the knob, starting at the top of the left eave and ending in a hook down to the left
      part: the roof's ridge and right eave
    - where: a short line across in the left, rising slightly to the right
      part: the top jade bar
    - where: a short line across below it, rising slightly to the right
      part: the middle jade bar
    - where: a short line down from the middle of the top bar, crossing the middle bar
      part: the cord holding the jade
    - where: a line across the bottom of the jade group, rising to the right, longer than the other two
      part: the lowest, widest jade bar
    - where: a short stroke at the top left of the jar, slanting down to the left
      part: the jar's left lip
    - where: a short line across the top of the jar, rising slightly to the right
      part: the jar's rim
    - where: a longer line across below the rim, rising slightly to the right
      part: the jar's shoulder
    - where: a short straight line down through the middle of the shoulder
      part: the jar's centre seam
    - where: a stroke from the jar's left, down to the right and then across, rising to the right
      part: the jar's belly and base
    - where: a short stroke at the jar's right, slanting down to the right
      part: the jar's right wall
    - where: a straight line down the left side of the shell
      part: the shell's left rim
    - where: a line across the top of the shell, turning down at the right
      part: the shell's top and right rim
    - where: a short line across inside the shell, rising slightly to the right, touching the left rim
      part: the shell's upper ridge
    - where: a short line across below it, rising slightly to the right, touching the left rim
      part: the shell's lower ridge
    - where: a line across the bottom of the shell, rising slightly to the right, meeting the end of the right rim
      part: the shell's base
    - where: a stroke below the shell on the left, slanting down to the left, standing free
      part: the shell's left leg
    - where: a stroke below the shell on the right, slanting down to the right, standing free
      part: the shell's right leg

典:
  object: a bound book of bamboo slips held up in two hands
  history: >-
    An ideogram: two hands holding a book. The book is a row of slips bound with cord; the modern form
    keeps the slips and the hands.
  layout: >-
    A bound book of bamboo slips stands upright in the upper part of the frame, its two longest slips
    rising out above the top. Below it two open hands, the left on the left, the right on the right,
    hold it from beneath. Pale bamboo and warm skin colours.
  exact:
    - The base of the book is the longest line across; the book's top line is nearly as long.
    - The cord across the middle is about a third as long as the base.
    - The left slip and the right slip both pass through the book's top line and end on its base.
    - The right slip is the longest line down; the left slip is a little shorter.
    - The two hands stand free of everything, of the book and of each other.
    - The book's left edge is a short stroke that touches the top line's start and ends on the base.
  strokes:
    - where: a short stroke on the left edge of the book, slanting down to the right
      part: the book's left edge
    - where: a long line across the top, then turning down at the right
      part: the book's top and right edge
    - where: a short line across the middle, rising slightly to the right
      part: the cord binding the slips
    - where: a long stroke down on the left of the middle, starting above the book and ending on the base
      part: the left slip, rising above the top
    - where: a long stroke down in the middle, starting higher than the left slip and ending on the base
      part: the right slip, rising above the top
    - where: a long line across the base, rising slightly to the right
      part: the book's base
    - where: a short sweep below at the left, down and out to the bottom left
      part: the left hand, cupped under the book
    - where: a short stroke below at the right, slanting down to the right
      part: the right hand, cupped under the book

析:
  object: an axe chopping at a tree
  history: >-
    An ideogram: chopping wood with an axe. The wood is a tree at the left, the axe stands at the
    right.
  layout: >-
    A tree with a plain trunk stands at the left, narrow and tall, with a pale leafy crown. At the
    right an axe leans toward it, its handle running from the upper right down to the left, its blade
    edge facing the tree. Soft pale colours.
  exact:
    - The tree's trunk is a straight vertical with a plain end, no hook; its branches cross it in the middle of its height.
    - The tree's left root and short right root both start at the trunk and do not touch each other.
    - The tree's short right root is a small stroke and does not reach the axe.
    - The tree's branches are a little shorter than the axe's blade edge across.
    - The axe handle's lower end stops short of the tree's trunk.
    - The axe blade's edge starts on the middle of the handle and the straight edge below it starts on the middle of the blade.
  strokes:
    - where: a line across the middle of the tree, rising slightly to the right, crossing the trunk
      part: the tree's branches
    - where: a long straight line down the middle of the left part, from the top to near the bottom
      part: the tree's trunk
    - where: a sweep from the middle of the trunk down and out to the bottom left
      part: the tree's root, spreading left
    - where: a short stroke from the trunk just below, down to the right
      part: the tree's short right root
    - where: a short stroke across at the top right, running to the left and turning down to the left
      part: the axe's head, its top
    - where: a long stroke starting at the end of the head, running down to the lower left
      part: the axe's handle
    - where: a line across at the right, starting on the middle of the handle, rising slightly to the right
      part: the axe blade's edge
    - where: a straight line down from the middle of the blade's edge, to the bottom
      part: the axe blade, hanging straight down

抱:
  object: a mother's hand and arm wrapping a swaddled baby in her embrace
  history: >-
    An ideogram: to wrap a baby in one's arms. The hand is on the left, the wrapped baby on the right.
  layout: >-
    A mother stands at the far left, her friendly face turned toward the baby, simple pale clothes,
    her arm reaching round in front. The baby, with a face, lies swaddled in a blanket that wraps
    round it from the top, on the right. Soft pale colours.
  exact:
    - The arm is a long straight vertical ending in a small hook up to the left; the cuff line crosses it.
    - The thumb is a stroke rising to the right that crosses the arm and stops short of the baby.
    - The cuff line stops short of the baby's blanket; there is a small gap.
    - The blanket's top line starts on the blanket's left fold and ends in a small hook up to the left.
    - The baby's brow and cheek stand inside the blanket and touch nothing else.
    - The baby's long curved body is the longest line down, starting where the brow starts.
    - The body line does not touch the thumb or the blanket's left fold.
  strokes:
    - where: a short line across on the left, rising slightly to the right
      part: the mother's cuff, the sleeve edge
    - where: a long line down the left, crossing the cuff, ending in a small hook up to the left
      part: the mother's arm, the hook her hand
    - where: a stroke rising to the right from the bottom left across the arm
      part: the mother's thumb, reaching toward the baby
    - where: a stroke at the upper left of the right half, going down and bending down to the left
      part: the blanket's left fold
    - where: a long line across the top of the right half, rising slightly to the right, turning down at the right end and ending in a small hook up to the left
      part: the blanket's top and right fold
    - where: a short stroke in the middle left of the right half, rising to the right and turning down to the left
      part: the baby's brow
    - where: a short line across below it, rising slightly to the right
      part: the baby's cheek and chin
    - where: a long stroke down the left side of the lower half of the right part, curling across the bottom to the right and turning up at its end
      part: the baby's curled body and legs

宗:
  object: an altar of the ancestor spirits under the roof of the house
  history: >-
    An ideogram: an altar to the ancestors found in one's home. The upper part is the roof of a house,
    the lower part is the altar.
  layout: >-
    A house roof with a small knob spans the top of the frame. Under it a stone altar stands in the
    lower half, with an offering slab above a table on a post and two braces at its sides. Soft pale
    colours, a warm pale glow around the altar.
  exact:
    - The knob on the roof stands free and does not touch the roof line.
    - The roof line starts at the top of the left eave and ends in a small hook down to the left.
    - The offering slab stands free of the roof and the table; it is about half as long as the table top.
    - The table top is the longest line across below the roof; it is about four fifths as long as the roof line.
    - The post starts on the middle of the table top, runs down and ends in a small hook to the left.
    - The two braces stand free of every other stroke and of the table.
  strokes:
    - where: a small stroke at the top centre, down to the right, standing free
      part: the knob on the roof
    - where: a short stroke down at the upper left
      part: the roof's left eave
    - where: a long line across below the knob, starting at the top of the left eave and ending in a hook down to the left
      part: the roof's ridge and right eave
    - where: a short line across under the roof, rising a little to the right, standing free
      part: the offering slab above the altar
    - where: a long line across below it, rising slightly to the right
      part: the altar's table top
    - where: a line down from the middle of the table, ending in a small hook to the left
      part: the post that holds the table
    - where: a short stroke at the lower left, slanting down to the left, standing free
      part: the altar's left brace
    - where: a short stroke at the lower right, slanting down to the right, standing free
      part: the altar's right brace

季:
  object: a stalk of grain above a swaddled baby sitting in the field, with arms wide
  history: >-
    An ideogram: the time for planting the seeds of grain, the season. The grain is above, the child
    is below.
  layout: >-
    A tall grain stalk with a drooping ear stands in the upper half, in soft gold. Below it, in the
    lower half, a baby wrapped in swaddling cloth sits with its arms stretched out wide, friendly
    face turned up toward the stalk. Pale warm field colours.
  exact:
    - The grain's ear droops to the left; the stalk starts on the ear's middle.
    - The leaf line is the longest line across of the grain, about three quarters as long as the baby's arms.
    - The stalk crosses the leaf line and stops just above the baby's head, almost touching it.
    - The left root and right root both start where the stalk crosses the leaf line, and do not touch each other.
    - The right root turns across to the right at its end.
    - The baby's arms line is the longest line across; the baby's head is a little over half as long.
    - The baby's body line starts at the end of the head and crosses the arms line, ending in a small hook up to the left.
  strokes:
    - where: a short slanting stroke across the top, running down from right to left
      part: the ear of grain, drooping over to the left
    - where: a line across, a little above the middle of the upper half
      part: the leaves, spreading to both sides
    - where: a long straight line down the middle, from the ear to just above the baby
      part: the stalk
    - where: a sweep from the stalk down and out to the bottom left
      part: the root spreading to the left
    - where: a sweep from the stalk down and out to the bottom right, turning across to the right
      part: the root spreading to the right
    - where: a line across the top of the lower half, ending in a hook turning back down to the left
      part: the baby's head, closing at the chin
    - where: a long line down from the end of the head line, ending in a small hook up to the left
      part: the baby's body in its wrap, the hook its bundled feet
    - where: a long line across the lower half, crossing the body line
      part: the baby's arms, stretched out wide

肯:
  object: a bare foot standing on a shelf, with a plump piece of meat hanging beneath
  history: >-
    An ideogram: to stop flexing the muscles. The upper part is a foot that stops, the lower part is
    flesh, the muscle.
  layout: >-
    A bare foot, toes up, stands on a long shelf in the upper part of the frame. Beneath the shelf,
    on the left of the middle, a plump piece of pale pink meat hangs. Soft pale colours.
  exact:
    - The big toe is the longest down-right stroke of the foot; it ends on the shelf.
    - The second toe starts on the middle of the big toe and is tiny, about a quarter as long as the shelf.
    - The small toe at the left starts above the shelf and ends on it.
    - The shelf is the longest line across, spanning almost the whole frame.
    - The meat's left edge stops short of the shelf; there is a small gap.
    - The meat's top line starts at the top of the left edge, turns down at the right and ends in a small hook up to the left, and it also stops short of the shelf.
    - The two inner lines of the meat touch the left edge and are short, about a fifth as long as the shelf.
  strokes:
    - where: a stroke in the middle from the top, slanting a little to the right and then straight down to the shelf
      part: the big toe and the foot's main axis
    - where: a short line from the middle of the big toe out to the right, rising slightly
      part: the second toe, held out
    - where: a shorter stroke on the left, slanting down to the right, ending on the shelf
      part: the small toe and the edge of the foot
    - where: a long line across the middle, rising slightly to the right
      part: the shelf under the foot
    - where: a line down the left side of the lower half, from the top to near the bottom
      part: the meat's left edge
    - where: a line across the top from the top of the left edge, turning down at the right and ending in a small hook up to the left
      part: the meat's top and right edge
    - where: a short line across inside the meat, touching the left edge
      part: the upper grain of the meat
    - where: a short line across below it, rising slightly to the right, touching the left edge
      part: the lower grain of the meat

魚:
  object: a fish swimming upwards, its head at the top and its tail fanning out at the bottom
  history: >-
    A pictogram: a fish swimming upwards. The oldest forms drew its head, its scaled body and its tail.
    The modern traditional form splits the tail into four strokes.
  layout: >-
    A fish swims straight up, its head at the top and its scaled body below it, in soft pale blue
    and silver. The body is divided into four scale plots. At the bottom the tail fans out into
    separate pale fin rays. A pale water background. The head has one round eye.
  exact:
    - The head's first stroke sweeps down to the left; the second stroke starts on its middle, runs across and ends on the body's top line.
    - The body's top-and-right line is the longest line across; the head's second stroke is a little over half as long.
    - The body's inner line across is short, about a third as long as the top line, and does not touch the body's left side.
    - The body's inner upright starts on the top line, crosses the short line across and ends on the bottom line.
    - The body's bottom line rises to the right and ends where the top line ends.
    - The four tail rays stand free of the body and of each other; the right ray is long, the left ray is about two thirds of it, the two between are small.
  strokes:
    - where: a long sweep at the top left, from the top centre down and out to the left
      part: the fish's head, its left curve
    - where: a line across the top right, from the middle of the head curve, turning down to the left
      part: the fish's head, its top and right side
    - where: a straight line down the left side of the body
      part: the left side of the body
    - where: a line across the top of the body, from the top of the left side, turning down at the right
      part: the body's top and right side
    - where: a short line across the middle of the body, rising slightly to the right, touching nothing at the left
      part: the line of scales across the middle
    - where: a short upright in the middle of the body
      part: the fish's backbone
    - where: a line across the bottom of the body, rising to the right, ending at the end of the right side
      part: the underside of the body
    - where: a short vertical stroke at the bottom left, standing free
      part: the left tail ray
    - where: a small dot at the bottom, left of centre, down to the right, standing free
      part: the second tail ray
    - where: a short stroke at the bottom centre, down to the right, standing free
      part: the third tail ray
    - where: a long stroke at the bottom right, down to the right, standing free
      part: the right tail ray

鱼:
  object: a fish swimming upwards, its head at the top and its tail fanning out at the bottom
  history: >-
    A pictogram: a fish swimming upwards. The oldest forms drew its head, its scaled body and its tail.
    The modern traditional form splits the tail into four strokes.
  layout: >-
    A fish swims straight up, its head at the top and its scaled body below it, in soft pale blue
    and silver. The body is divided into four scale plots. At the bottom a single wide flat tail fin
    spreads straight across. A pale water background. The head has one round eye.
  exact:
    - The head's first stroke sweeps down to the left; the second stroke starts on its middle, runs across and ends on the body's top line.
    - The body's top-and-right line is almost as long as the tail; the head's second stroke is about half as long as the tail.
    - The body's inner line across is short, about a third as long as the tail, and does not touch the body's left side.
    - The body's inner upright starts on the top line, crosses the short line across and ends on the bottom line.
    - The body's bottom line rises to the right and ends where the top line ends.
    - The tail is the longest line across, and it stands free of the body.
  strokes:
    - where: a long sweep at the top left, from the top centre down and out to the left
      part: the fish's head, its left curve
    - where: a line across the top right, from the middle of the head curve, turning down to the left
      part: the fish's head, its top and right side
    - where: a straight line down the left side of the body
      part: the left side of the body
    - where: a line across the top of the body, from the top of the left side, turning down at the right
      part: the body's top and right side
    - where: a short line across the middle of the body, rising slightly to the right, touching nothing at the left
      part: the line of scales across the middle
    - where: a short upright in the middle of the body
      part: the fish's backbone
    - where: a line across the bottom of the body, rising to the right, ending at the end of the right side
      part: the underside of the body
    - where: a long straight line across the bottom of the frame, standing free
      part: the wide flat tail fin

招:
  object: a hand beckoning, with a knife above a mouth that calls
  history: >-
    An ideogram: a call to arms. A hand on the left, a knife and a calling mouth on the right.
  layout: >-
    A hand with its arm stands at the left edge of the frame. At the right a knife hangs in the
    upper half, its blade pointing down, and under it, in the lower half, a large mouth wide open as if
    calling out. Soft pale colours.
  exact:
    - The arm is a long straight vertical ending in a small hook up to the left; the cuff line crosses it.
    - The thumb rises to the right and crosses the arm; it stops short of the knife.
    - The knife's back is the longest line across; the mouth's top-and-right line is a little over half as long.
    - The knife's edge starts at the knife's back start and ends above the mouth, with a small gap.
    - The knife's back ends in a small hook up to the left.
    - The mouth's left side, top-and-right line and bottom line form a closed shape; the bottom line starts on the left side and ends at the end of the top-and-right line.
  strokes:
    - where: a short line across on the left, rising slightly to the right
      part: the cuff of the sleeve
    - where: a long line down the left, crossing the cuff, ending in a small hook up to the left
      part: the arm, the hook the hand
    - where: a stroke rising to the right from the bottom left across the arm
      part: the thumb
    - where: a long line across the upper right, rising slightly, then turning down at the right and ending in a small hook up to the left
      part: the knife's back and its point
    - where: a sweep from the start of the back down to the left
      part: the knife's cutting edge
    - where: a short line down at the left of the lower right
      part: the mouth's left side
    - where: a line across the top of the mouth, turning down at the right and ending in a hook down to the left
      part: the mouth's upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip

是:
  object: the sun above a person standing in trousers on straight legs
  history: >-
    An ideogram: to speak directly. The upper part is the sun, the lower part is the legs of the one
    who stands straight.
  layout: >-
    The sun is a round sun in the upper part of the frame, soft gold. Below it a person stands
    straight, small friendly face and pale tunic in the narrow band between the sun and the belt, and
    pale trousers over the strokes. Soft pale colours.
  exact:
    - The sun's left side is a short vertical stroke; its top-and-right line starts at the same point as the left side and the bottom line meets the end of the right line.
    - The sun's two inner lines do not reach the sides.
    - The belt line is the longest line across, about one and a half times as long as the sun's top line.
    - The centre seam starts on the belt line and ends on the right trouser leg.
    - The pocket flap starts on the centre seam and stops short of the right leg.
    - The left trouser leg is the longest line down; it stops short of the belt line, with a small gap.
    - The right leg starts on the middle of the left leg and ends turning across to the right, a long foot.
  strokes:
    - where: a short line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, from the top of the left rim, turning down at the right
      part: the sun's top and right rim
    - where: a short line across the middle of the sun, rising slightly to the right
      part: the bright band of light at the sun's heart
    - where: a short line rising to the right at the bottom of the sun, meeting the end of the right rim
      part: the sun's bottom rim
    - where: a long line across the middle of the frame
      part: the person's belt
    - where: a short line down from the middle of the belt
      part: the centre seam of the trousers
    - where: a short line across rising slightly, right of the seam
      part: a small pocket flap
    - where: a long sweep from the left of the belt line down and out to the bottom left
      part: the left trouser leg
    - where: a stroke from the middle of the left leg down to the right, then turning across to the right at its end
      part: the right trouser leg and its foot

思:
  object: a head that thinks, divided into four parts, above a heart
  history: >-
    An ideogram: weighing something with the mind and the heart. The upper part is the mind, a head
    with a seamed skull; the lower part is the heart.
  layout: >-
    In the upper half a small round head-shape with a pale brain, its seams dividing it into four
    parts. Below it, in the lower half, a human heart drawn simply, wider than the head, with two small
    vessels rising from the top. Soft pale colours.
  exact:
    - The head's top-and-right line starts at the top of the left side and is the longest line across of the head; it turns down at the right.
    - The head's inner line across is short, about a quarter as long as the top line, and is crossed by the inner upright.
    - The head's bottom line ends where the top-and-right line ends.
    - The inner upright starts on the top line and ends on the bottom line.
    - The heart's four strokes stand free of the head and of each other.
    - The heart's long curve runs down, along the bottom and up, ending in a hook up to the left; the heart is wider than the head.
  strokes:
    - where: a stroke down the left side of the head, slanting a little to the right
      part: the left side of the head
    - where: a line across the top of the head, from the top of the left side, turning down at the right
      part: the top and right side of the head
    - where: a short line across the middle of the head, rising slightly to the right
      part: the seam across the brain
    - where: a short line down the middle of the head, crossing the short line across, ending on the bottom line
      part: the seam down the brain
    - where: a line across the bottom of the head, rising slightly to the right, ending at the end of the right side
      part: the base of the head
    - where: a short stroke on the left of the lower half, down a little to the left
      part: the left edge of the heart
    - where: a long curve from left of centre down to the bottom, along the bottom to the right and up, ending in a hook up to the left
      part: the rounded lower body of the heart, its tip turning in at the right
    - where: a short dot near the top centre of the heart, slanting down to the right
      part: a vessel rising from the top of the heart
    - where: a short dot at the upper right of the heart, slanting down to the right
      part: a second vessel at the heart's upper right
