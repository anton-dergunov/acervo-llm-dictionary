    - In the middle of the right side, the wide collar starts at the top of its short left vertical and runs across to end in a hook down to the left.
    - At the bottom right, the two strokes of the hand cross each other in the middle and do not touch the collar above or the bed plank to the left.
    - The wooden bed on the lower left and the broom-and-hand on the lower right sit side by side under the roof and do not touch each other.
