屌:
  object: a bending person's body wrapping around a cloth and tassel hanging down beneath it
  history: >-
    An ideogrammic and phono-semantic compound combining a crouching body on the top and left with
    the character for hanging underneath, showing something suspended from the body.
  layout: >-
    A person bends forward across the top and down the left side, facing right, with a friendly face
    (eyes, nose and mouth) near the upper right and simple pale clothes along the torso and leg.
    Tucked beneath the torso is the hanging piece: a small square loop above a wider draped cloth
    with a long central cord hanging straight down to the bottom. Colours are pale beige, soft blue
    and warm grey.
  exact:
    - The upper box of the body is closed by the top-and-right turned stroke, the lower line across, and the upper part of the long left sweep.
    - The long sweep on the left starts at the top-left corner and curves out to the bottom left, wrapping around the inner hanging part.
    - Beneath the upper body sits a small closed rectangular box whose bottom line is a little over half as long as the body's lower line across.
    - Below the small box sits a wider frame whose left vertical meets its top-and-right stroke at the top left, and whose right side turns down and ends in a hook to the left.
    - The long central vertical starts at the bottom of the small box, crosses the horizontal part of the lower frame, and runs straight down past the frame to end in a plain point with no hook.
  strokes:
    - where: a line across the top from the upper left to the right, turning down to the left at the top right
      part: the top and front of the bending person's torso
    - where: a line across below the top stroke, rising slightly to the right to close the upper box
      part: the underside of the person's torso
    - where: a long stroke from the top-left corner running down and sweeping out to the bottom left
      part: the person's back and leg, stretching down on the left
    - where: a short line down in the middle, just below the torso box
      part: the left side of the small hanging loop
    - where: a line across from the top of the short vertical to the right, turning down to the left
      part: the top and right side of the small hanging loop
    - where: a shorter line across closing the bottom of the small loop
      part: the bottom edge of the small hanging loop
    - where: a vertical line down in the lower middle, inside the sweep of the leg
      part: the left edge of the hanging cloth
    - where: a wide line across from the top of the lower vertical to the right, turning down and ending in a hook to the left
      part: the top fold and right edge of the hanging cloth
    - where: a long straight vertical line from the bottom of the small loop down through the middle of the cloth to the very bottom
      part: the central cord hanging straight down through the cloth

寢:
