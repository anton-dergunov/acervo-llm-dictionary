薛:
  object: marsh grass growing across the top above a stylised moon on the bottom left and an upright sickle on the bottom right
  history: >-
    The oracle bone form combined a sickle (䇂, now 辛) with the moon (月) to depict cutting plants by
    moonlight. In bronze inscriptions the moon on the left became a stepped vertical spine with two
    chambers, and the grass radical (艹) was added across the top for wormwood or marsh grass.
  layout: >-
    Across the top sits a wide band of pale green marsh grass on the three strokes of 艹. The lower
    three quarters are split side by side: on the left, the ancient moon (⿱丿㠯) glows pale yellow
    around its long left spine and two stacked rectangular chambers; on the right, an upright sickle
    (辛) stands in pale grey metal and light wood, reaching further down than the left side.
  exact:
    - At the top, the two short upright grass strokes both cross the wide horizontal line; the right upright does not touch the top dot of the right side below it.
    - On the bottom left, the short top sweep touches the top of the long left vertical, which runs straight down to a plain point with no hook.
    - The two turned strokes on the bottom left both start on the long left vertical and are each closed at the bottom by a short rising line across, forming two stacked closed chambers.
    - On the bottom right, the top dot stands free above the upper horizontal line, and the lower-left dot stands free between the upper and middle horizontal lines; the lower-right short stroke touches both the upper and middle horizontal lines.
    - In the right component, the middle horizontal line is clearly longer than the upper and lower horizontal lines, which are both about two thirds of its length; it does not touch the bottom-left component.
    - The long vertical at the bottom right starts at the middle horizontal line, crosses the lower horizontal line, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a long line across the upper part of the square
      part: the main horizontal runner of the marsh grass
    - where: a short vertical line down the left side of the top part, crossing the long line across
      part: the left grass shoot
    - where: a short slanting line down the right side of the top part, crossing the long line across
      part: the right grass shoot
    - where: a short sweep from below the left grass shoot down to the left
      part: the upper horn of the stylised moon
    - where: a long vertical line down the left side, starting where the short sweep ends
      part: the straight left spine of the stylised moon
    - where: a line from the top of the left vertical rising to the right, then turning down with a small hook to the left
      part: the upper chamber's top and right rim on the moon
    - where: a short line across from the left vertical, rising slightly to meet the bottom of the upper turned stroke
      part: the lower bar closing the moon's upper chamber
    - where: a line from the middle of the left vertical rising to the right, then turning down
      part: the lower chamber's top and right rim on the moon
    - where: a short line across from the lower part of the left vertical, rising slightly to meet the bottom of the lower turned stroke
      part: the lower bar closing the moon's lower chamber
    - where: a short dot slanting down to the right at the top of the lower right half
      part: the top knob of the sickle's head
    - where: a line across the upper part of the lower right half, rising slightly to the right, about half as long as the top grass line
      part: the upper crossbar of the sickle's head
    - where: a short dot slanting down to the right below the left side of the upper crossbar
      part: the left prong of the sickle's mount
    - where: a short slanting line down from the right side of the upper crossbar to the middle crossbar
      part: the right strut of the sickle's mount
    - where: a long line across the middle of the lower right half, about two thirds as long as the top grass line
      part: the wide guard across the sickle
    - where: a line across the lower part of the right half, about as long as the upper crossbar
      part: the lower crossbar on the sickle's shaft
    - where: a long vertical line from the centre of the wide guard straight down through the lower crossbar to the bottom
      part: the long handle of the sickle

枣:
  object: a thorny jujube tree with thorns on its middle branches and two fallen jujube dates beneath its trunk
  history: >-
    The traditional form 棗 stacked two thorny trees (朿, a tree 木 bearing thorns 冂) one above the
    other to depict a tall, prickly jujube tree. The simplified form 枣 keeps the upper thorny tree
    and reduces the lower one to two dots beneath the trunk, like two jujube fruits fallen from the
    branches.
  layout: >-
    A jujube tree fills the upper two thirds of the frame, with a pale green leafy crown behind the
    upper branches and thorny middle boughs, and wide spreading roots or lower boughs reaching out
    to the left and right. Directly beneath the bottom of the trunk sit two pale red-brown oval
    jujube fruits, one above the other, following the slant of the two bottom dots.
  exact:
    - The central vertical trunk starts at the very top above the upper line across, crosses both the upper line across and the middle arch, and ends in a plain point above the two bottom dots, with no hook.
    - The upper line across and the horizontal top of the middle arch are almost the same width and have a clear gap between them.
    - Below the upper line across, a short downward stroke on the left (about a third as long as the trunk) meets the start of the middle stroke, which runs across the trunk and turns sharply down on the right, leaving the bottom of the arch open.
    - The two wide lower sweeps both start together on the trunk below the middle arch and spread far to the left and right; the short left stroke and the right leg of the arch stop clear above them without touching.
    - The two dots at the bottom sit vertically aligned beneath the trunk, standing completely free of the trunk and of each other; both slant down to the right, and the upper dot is about two thirds as long as the lower dot.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the upper branch of the jujube tree
    - where: a short line down on the left, below the upper branch
      part: the left thorn hanging from the middle branch
    - where: a line from the top of the short left stroke across to the right, then turning sharply down and slightly to the left
      part: the middle thorny branch and its right-hand thorn pointing down
    - where: a straight vertical line down the upper centre, from above the top branch to the middle of the frame
      part: the main trunk of the jujube tree
    - where: a long sweep from the middle of the trunk down and out to the left
      part: the left spreading root of the tree
    - where: a long falling stroke from the middle of the trunk down and out to the right
      part: the right spreading root of the tree
    - where: a short dot-like stroke in the lower centre just below the trunk, slanting down to the right
      part: the upper fallen jujube date beneath the tree
    - where: a slightly longer dot-like stroke at the bottom centre below the first dot, slanting down to the right
      part: the lower fallen jujube date beneath the tree

