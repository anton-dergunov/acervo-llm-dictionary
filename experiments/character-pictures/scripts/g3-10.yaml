饉:
  object: a covered food vessel on a stand on the left with little food inside, beside parched yellow earth on the right in a time of famine
  history: >-
    An ideogrammic and phono-semantic compound combining food (飠) on the left with scarcity and
    parched yellow earth (堇) on the right, depicting a time of crop failure and little food.
  layout: >-
    The left side holds a tall covered food vessel on a stand, narrower than the right side, with
    only a scant layer at the bottom of its bowl and a tiny wisp above. The right side is wider and
    shows parched yellow earth (堇), with two dry stalks bound at the top, a dry clod in the middle,
    and layered earth on the wide ground line at the bottom, split down the middle by a deep
    vertical crack. Soft pale ochre and muted tan tones wash the vessel and the dry earth behind the
    strokes.
  exact:
    - The left part (food) and the right part (parched earth) do not touch each other.
    - In the left part, the upper right slope of the lid starts at the top of the long left sweep, while the small dot just below it stands completely free.
    - The upper short line inside the vessel touches the left wall and stops short of the right wall, while the lower short line touches both walls.
    - The vessel's long left vertical starts at the middle of the upper left sweep, and at the bottom it turns sharply up to the right to touch the middle of the short lower-right foot stroke.
    - In the right part, the two upper verticals cross the long upper horizontal line (which is about four fifths as long as the bottom ground line) and are joined at their bottoms by a very short horizontal about a quarter as long as the bottom ground line.
    - The long central vertical in the right half starts at the bottom of the upper-left vertical, crosses through the middle rectangular box and both horizontal lines below it, and ends on the middle of the bottom ground line.
    - The bottom of the middle box and the two horizontal lines below it are each about half as long as the wide bottom ground line.
