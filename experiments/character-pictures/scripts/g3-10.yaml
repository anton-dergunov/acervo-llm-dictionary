泵:
  object: water gushing and streaming down from beneath an overhanging stone ledge and square stone block
  history: >-
    An ideogrammic compound combining stone (石) at the top with water (水) at the bottom, depicting
    water forced out from rock.
  layout: >-
    The stone fills the upper half and the flowing water fills the wider lower half. At the top, a
    pale grey stone ledge overhangs a square stone block tucked beneath its left slope. Directly
    from the bottom of the stone block, pale blue water pours straight down the centre and splashes
    out to both sides in curving currents.
  exact:
