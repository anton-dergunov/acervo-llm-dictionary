犀:
  checked: argon
  dropped: The character is a purely phono-semantic compound with 尾 serving only for sound and no pictographic or ideographic reading given in the origin, so drawing it as an ideograph would teach a false etymology.

抉:
  object: a hand on the left reaching out to choose and pluck one side of a cord parting in two through a notched clasp on the right
  history: >-
    Formed from a hand 扌 on the left and 夬 on the right, which means to part or choose and also
    gives the sound. The component 夬 originally drew a hand with a notched archer's ring parting a
    string, which in the modern character became a notched bracket crossed by a central line that
    parts in two below.
  layout: >-
    The left side is narrower and holds an open hand in pale skin tones facing right, its fingers
    reaching toward the centre and its wrist hooked at the bottom. The wider right side holds a pale
    wooden or jade notched clasp around a central cord that runs down from the top and splits into
    two diverging strands at the bottom. The hand's lower fingers rise toward the left strand as it
    chooses between the two parted sides.
  exact:
    - The left hand component is narrower than the right component, which is nearly twice as wide.
    - The left hand and the right component do not touch anywhere; there are small gaps between the upper fingers and the upper bracket, between the vertical palm line and the long crossbar, and between the bottom of the palm line and the lower-left sweep.
    - In the left hand, the long vertical line ends in a sharp hook up to the left at the bottom, and both the upper line across and the lower rising stroke cross it.
    - In the right part, the upper stroke runs across and turns sharply down on the right to touch the middle of the long lower line across, leaving the bracket open on the left.
    - The long lower line across in the right part is the longest horizontal stroke, while the left hand's upper line across and the top leg of the right bracket are each just over half as long.
    - The central vertical in the right part starts as high as the left vertical, crosses straight down through both horizontal lines of the bracket, and sweeps out to the bottom left without a hook.
    - The final falling stroke starts where the right vertical crosses the long line across and sweeps down and out to a wide foot at the bottom right.
  strokes:
    - where: a short line across the upper part of the left side, rising slightly to the right
      part: the upper fingers of the hand, reaching right
    - where: a long straight line down the left side from top to bottom, ending in a hook up to the left
      part: the middle of the palm running down to the wrist, the hook where the wrist turns
    - where: a stroke in the middle of the left side rising from the lower left up to the right across the vertical
      part: the thumb and lower fingers, reaching up to pluck and choose
    - where: a line across the upper middle of the right part that turns sharply down on the right to meet the line below it
      part: the top rim and right wall of the notched clasp
    - where: a long line across the middle of the right part, extending past the upper turn on both sides
      part: the long lower bar of the clasp
    - where: a long line from the top centre running straight down through both horizontal bars of the right part, then sweeping out to the bottom left
      part: the main cord running down through the clasp and parting to the bottom left
    - where: a falling stroke starting where the right vertical and the long crossbar meet, sweeping down and out to the bottom right
      part: the second parted strand, diverging down to the right

