    hands 廾 holding up a halberd 戈 to stand on guard: words spoken to warn and admonish.
  layout: >-
    The left third holds the mouth and protruding tongue of 言, coloured in pale rose and soft coral.
    The wider right two thirds hold the tall halberd 戈 reaching from the top centre down to the
    bottom right in pale bronze and light wood tones, with the two raised hands 廾 in the lower
    middle, drawn in pale skin tones as two upright forearms and hands braced beside the shaft.
