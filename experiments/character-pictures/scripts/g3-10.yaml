丐:
  object: an ancient curved knife with a flat top bar, a notched upper stem, and a hooked lower blade
  history: >-
    丐 is a corruption of 匄, which combined a knife (刀) with a mark for the tip of a blade (亡),
    perhaps originally meaning to damage before being borrowed to mean begging. The modern strokes
    keep the hooked curve of the knife blade below and the straight lines of the upper blade and
    notch above.
  layout: >-
    One upright knife fills the frame from top to bottom. The top horizontal and upper vertical with
    its short side bar form the flat pommel and notched upper tang in pale warm wood and bronze,
    while the long twice-bent lower stroke forms the stepped back and sweeping curved blade in pale
    steel-blue, tapering down to a hooked point at the bottom.
  exact:
    - The top line across is long, while the short inner line across on the right is only about a third as long.
    - The upper vertical line starts at the middle of the top line across and ends squarely on the horizontal part of the lower bent stroke, without crossing through it.
    - The short inner line across starts at the middle of the upper vertical line and runs to the right into open space.
    - The lower bent stroke starts on the left well below the top line across, leaving a clear gap between them.
    - The lower bent stroke runs down on the left, turns sharply across to the right, and turns down again on the right, curving inward to end in a hook up to the left at the bottom.
  strokes:
    - where: a long line across the top, rising slightly to the right
      part: the flat top bar of the knife's hilt
    - where: a short vertical line down the upper centre, from the middle of the top line to the middle horizontal segment below
      part: the upper stem of the knife, joining the hilt to the blade
    - where: a short line across to the right from the middle of the upper vertical line
      part: the side notch jutting out from the upper stem
    - where: a long stroke starting on the left below the top line, running down, turning across the middle to the right, and turning down on the right to end in a hook up to the left at the bottom
      part: the stepped back and curved cutting edge of the knife blade, ending in its hooked tip

窑:
  object: an earthen kiln hollowed like a cave at the top, with a clay pot sitting inside the chamber below to be fired
  history: >-
    The traditional form 窯 combined a cave or hole 穴 with a bottom phonetic part to mean a hole dug
    for firing pottery. The simplified form 窑 replaces the bottom part with an earthenware jar 缶,
    turning the character into a direct scene of a clay pot 缶 inside a kiln chamber 穴.
  layout: >-
    The picture is stacked top to bottom, with both halves spanning almost the same width across the
    frame and the lower half taller than the upper half. At the top, the arched mouth of an earthen
    kiln cave opens under an overhanging roof of rock and baked earth. Directly below, inside the
    warm pale-ochre and soft terracotta glow of the kiln chamber, sits a round-bellied clay pot
    drawn on the lower strokes.
  exact:
    - The upper kiln roof and the lower clay pot have almost the same width, while the pot at the bottom is taller than the roof above it.
    - The short stroke at the top centre stands free above the roof, and the two short strokes inside the cave mouth stand free below the roof without touching it or each other.
    - The roof's long horizontal starts at the top of the short upper-left vertical and ends at the right in a hook down to the left.
    - The upper-left sweep under the roof and the lower sweep of the pot's lip just below it do not touch each other.
    - In the pot, the short upper horizontal starts at the middle of the sweep on its left and is clearly shorter than the wide horizontal below it, a little less than half as long.
    - The central vertical starts at the middle of the short upper horizontal, crosses the middle of the wide horizontal, and ends straight on the middle of the pot's bottom line with no hook.
    - The lower-left stroke starts just below the wide horizontal without touching it, goes down and turns sharply across to touch the middle of the lower-right vertical, which also does not touch the wide horizontal above it and extends slightly below the base.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right
      part: the capstone above the kiln's earthen roof
    - where: a short stroke at the upper left, slanting slightly down to the left
      part: the left edge of the overhanging kiln roof
    - where: a wide line across the upper part from the top of the upper-left stroke, ending in a hook down to the left at the right
      part: the overhanging roof of the kiln chamber
    - where: a short sweep inside the upper left, below the roof, curving down to the left
      part: the left side of the kiln cave's arched opening
    - where: a short stroke inside the upper right, below the roof, slanting down to the right
      part: the right side of the kiln cave's arched opening
    - where: a sweep in the middle left, below the left side of the kiln arch, curving down to the left
      part: the flared left lip at the top of the clay pot
    - where: a short line across the middle, clearly shorter than the wide line below and a little less than half as long, starting from the middle of the left sweep and rising slightly to the right
      part: the narrow top rim of the clay pot
    - where: a long line across the lower middle from the far left to the far right, rising slightly to the right
      part: the wide shoulder band across the belly of the clay pot
    - where: a straight vertical line down the lower centre, from the middle of the top rim through the wide shoulder line to the middle of the base
      part: the central vertical ridge down the front of the clay pot
    - where: a stroke at the bottom left starting just below the wide shoulder line, going down and turning sharply across to rise slightly to the right
      part: the left wall and flat base of the clay pot
    - where: a short vertical line down the bottom right, starting below the wide shoulder line and extending slightly below the base line
      part: the right wall and foot of the clay pot

諺:
  object: a speaking mouth with its tongue sticking out on the left, beside an ornate emblem of a crossed crest, a sweeping frame and three flowing plumes on the right
  history: >-
    An ideogrammic compound combining words (言, a mouth with a tongue sticking out above it) on the
    left with elegance (彦, fine decorative markings and plumes under a brow or frame) on the right:
    refined, elegant words handed down as a proverb.
  layout: >-
    The speaking mouth and tongue fill the left part, narrower and shorter than the right; a pale
    pink tongue rises above a soft-lipped mouth. The emblem of elegance fills the wider, taller
    right part, with a crossed ribbon crest at the top, a sweeping banner frame in the middle, and
    three pale golden-brown decorative plumes sweeping down to the left below.
  exact:
    - The left part is narrower and shorter than the right part, and the two parts do not touch each other.
    - In the left part, the top dot and the three lines across above the mouth all stand free of one another; the two inner bars across are each a little under half as long as the long line above them.
    - In the lower left mouth, the left vertical meets the start of the upper turning stroke at the top left, and the bottom line touches the middle of the left vertical and the bottom of the right vertical turn.
    - In the upper right crest, the top dot stands free; the sweep down to the left starts on the middle of the upper line across and crosses the stroke slanting down to the right, and neither touches the line across below them.
    - In the middle of the right part, the left end of the line across touches the top of the long sweep down to the left, which passes close to the mouth without touching it.
    - The three sweeps stacked in the lower right part stand free of the frame and of one another, with the lowest sweep reaching much further down to the left than the two above it.
  strokes:
    - where: a short dot at the top of the left half, slanting down to the right, above the long line and not touching it
      part: the tip of the tongue
    - where: a long line across the upper part of the left half, rising slightly to the right
      part: the tongue's broad base, laid across
    - where: a short bar across the middle of the left half, a little under half as long as the long line above it
      part: the upper fold of the tongue
    - where: a short bar across below it in the left half, about the same length
      part: the lower fold of the tongue
    - where: a short line down the left side of the lower left part
      part: the mouth's left lip
    - where: a line across the top of the lower left part, rising to the right and turning down at the right side
      part: the mouth's upper lip and its right corner
    - where: a short line across the bottom of the lower left part, rising slightly to the right
      part: the mouth's lower lip
    - where: a short dot at the top of the right half, slanting down to the right
      part: the top ornament of the elegant crest
    - where: a line across the upper part of the right half, rising slightly to the right
      part: the upper bar of the elegant crest
    - where: a stroke in the upper right half slanting down to the right, below the upper bar
      part: the crest's ribbon slanting down to the right
    - where: a sweep in the upper right half from the middle of the upper bar down to the left, crossing the slanting stroke
      part: the crest's ribbon sweeping down to the left
    - where: a line across the middle of the right half, rising slightly to the right
      part: the top ledge of the banner frame
    - where: a long sweep from the left end of the middle line down and out to the lower centre-left
      part: the long curved side of the banner frame
    - where: a short sweep in the middle of the right half, slanting down to the left below the middle line
      part: the upper decorative plume
    - where: a sweep in the lower right half below the upper plume, slanting down to the left
      part: the middle decorative plume
    - where: a long sweep at the bottom of the right half, curving down and out to the bottom centre
      part: the long lower decorative plume

妾:
  object: a kneeling woman facing left, her arms crossed in front of her, wearing a tall tiered headdress on her head
  history: >-
    The oldest forms drew a kneeling woman 女 with 辛 above her head, read either as a pictogram of a
    woman wearing a tall headdress or as an ideogrammic compound of a woman marked with a branding
    tool as a captive. In the modern character, the upper part has simplified to the five strokes of
    立 resting directly on the woman's head.
  layout: >-
    The kneeling woman fills the lower half of the frame, seen in profile facing left with a face
    (eyes, nose and mouth) below the base of the headdress and wearing simple pale robes. Centered
    directly on her head in the narrower upper half sits a tall tiered ceremonial headdress, pale
    gold and jade behind the upper five strokes.
  exact:
    - The upper part (the headdress) is narrower than the lower part (the woman), sitting centred directly on top of her head.
    - Of the three horizontal lines, the top line across is the shortest (a little under half as long as the bottom line across), the middle line across at the base of the headdress is slightly wider (a little over half as long as the bottom line), and the woman's outstretched arm across the lower half is the widest, spanning nearly the full width of the frame.
    - The top slanting dot stands free above the upper line across and does not touch it.
    - Between the upper and middle lines across, the short left dot stands free without touching either line, while the right slanting stroke starts on the upper line across and reaches down to touch the middle line across.
    - The woman's head-and-back stroke starts directly on the middle line across, runs down a little to the left, and turns sharply to sweep to the bottom right.
    - In the lower half, the right-to-left sweep crosses both the long horizontal line and the lower leg of the bent stroke.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right
      part: the top crest ornament of the headdress
    - where: a short line across the upper part, rising slightly to the right, a little under half as long as the widest lower line
      part: the upper rim of the headdress
    - where: a short dot on the left below the upper line across, slanting down to the right
      part: the left inner jewel of the headdress
    - where: a short stroke on the right below the upper line across, slanting down to the left to meet the middle line
      part: the right side strut of the headdress
    - where: a medium line across the middle, rising slightly to the right, a little wider than the upper line across
      part: the base band of the headdress resting on the woman's head
    - where: a stroke starting on the middle line across, running down a little to the left and turning sharply to sweep down to the bottom right
      part: the woman's head and back, then her folded thigh and knee
    - where: a sweep in the lower half from just above the long horizontal line down and out to the bottom left
      part: one of the woman's arms, reaching down across her body
    - where: a very long line across the lower half, rising slightly from the far left to the far right
      part: the woman's other arm and sleeve, held across in front of her

姥:
  object: a woman kneeling on the left beside an old person bent over with a crutch and long streaming hair on the right, depicting an elderly woman
  history: >-
    An ideogrammic compound combining a kneeling woman 女 on the left with an old person bent over a
    crutch 老 on the right to depict an elderly woman or maternal grandmother.
  layout: >-
    Two figures stand side by side without touching: the kneeling woman fills the narrower left half
    and faces left with her arms crossed, while the wider, taller figure of the old person fills the
    right half, bent forward to the left over a crutch with long pale hair streaming down and legs
    below. Both figures have faces with eyes, a nose and a mouth, and wear simple pale clothes.
  exact:
    - The left part (the woman) and the right part (the old person) do not touch; there are small gaps between the woman's lower right tip and the old person's long sweep, and between the woman's arm and the old person's long middle line across.
    - The right part is wider and taller than the left part, reaching higher at the top and lower at the bottom.
    - In the left part, the first stroke runs down and turns sharply to sweep down to the lower right; the second sweep starts where the rising line across ends and crosses the lower leg of the first stroke.
    - In the right part, the upper line across is a little under half as long as the lower line across; the top vertical crosses the upper line across and ends on the middle of the lower line across.
    - The long diagonal sweep on the right starts high on the upper right, passes to the right of the upper line across without touching it, and crosses the lower line across down to the lower centre.
    - The bottom stroke on the right starts on the middle of the long diagonal sweep, goes down, turns across to the right, and ends in an upward hook; the short sweep in the lower right goes down to the left and ends on the middle of that bottom stroke.
  strokes:
    - where: a stroke in the left half from the upper left down a little to the left, turning sharply to sweep down to the lower right
      part: the kneeling woman's head and back, then her thigh folded forward to the knee
    - where: a sweep in the left half from just above the middle down to the bottom left
      part: the woman's arm, reaching down across her body
    - where: a line across the middle of the left half, rising slightly to the right and about three fifths as long as the long line across on the right
      part: the woman's other arm, held out across her body
    - where: a short line across the upper middle of the right half, rising slightly to the right and a little under half as long as the line across below it
      part: the handle of the old person's crutch
    - where: a vertical stroke from the top of the right half straight down to the middle
      part: the shaft of the crutch
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the bent back of the old person
    - where: a long sweep from the upper right down to the lower centre
      part: the old person's long hair streaming down
    - where: a short sweep in the lower right from the middle right down to the left
      part: the old person's thigh
    - where: a stroke starting on the long sweep below the middle, going down, then turning across to the right and ending in an upward hook
      part: the old person's shin and upturned foot

戟:
  object: a Chinese halberd with a branched side-blade pole and central mounting box on the left, paired with a tall dagger-axe on the right
  history: >-
    An ideogrammic compound combining a branched stem on the left (originally 榦, reduced to 龺) with
    a dagger-axe on the right (戈): a halberd fitted with side blades as well as its main axe blade.
  layout: >-
    The weapon assembly fills the square in two halves side by side. The left half is a vertical
    side-blade pole with a cross-blade near the top, a rectangular bronze mounting box in the
    middle, and a wider cross-guard near the bottom, shaded in pale bronze and soft tan wood. The
    right half is the tall dagger-axe with a long curving wooden shaft reaching from top centre to a
    hooked point at the bottom right, a horizontal axe blade, a sweeping lower blade in pale
    grey-blue metal, and a small decorative tassel or rivet at the top right.
  exact:
    - The left assembly and the right dagger-axe do not touch; a small gap separates the right side of the middle box from the start of the right cross-blade.
    - In the upper left, the short vertical crosses the upper line across and its bottom rests on the middle of the box's top edge.
    - The upper line across on the left is about two thirds as long as the wide lower line across.
    - Inside the middle box on the left, the inner line across touches the left vertical and stops short of the right side, while the bottom line closes the box.
    - The lower vertical on the left starts at the middle of the box's bottom edge, crosses the wide lower line across, and ends in a plain point with no hook.
    - On the right, the long curving shaft crosses the rising line across in the middle, is crossed lower down by the sweep down to the left, and ends at the bottom right in a sharp upward hook.
    - The short slanting stroke in the top right corner stands free of every other stroke.
  strokes:
    - where: a line across the upper part of the left half, rising slightly to the right
      part: the upper cross-blade on the left pole
    - where: a short vertical line down the upper left half, crossing the upper line across and ending on the top of the middle box
      part: the upper spear tip rising above the mounting box
    - where: a short line down the left side of the middle of the left half
      part: the left side of the central bronze mounting box
    - where: a line across the middle of the left half, rising slightly to the right and turning down to form the right side of the box
      part: the top and right sides of the central mounting box
    - where: a short line across the inside of the middle box, rising slightly to the right
      part: the inner bar across the central mounting box
    - where: a short line across the bottom of the middle box, rising slightly to the right
      part: the bottom edge of the central mounting box
    - where: a wide line across the lower part of the left half, rising slightly to the right
      part: the wide lower cross-guard on the left pole
    - where: a straight line down the lower left half from the bottom of the middle box, crossing the wide lower line across
      part: the lower shaft of the left pole
    - where: a line across the middle of the right half, rising to the right
      part: the horizontal blade of the dagger-axe on the right
    - where: a long line from the top centre curving down and out to the bottom right, ending in a sharp hook upward
      part: the long curving shaft of the dagger-axe, hooked at its butt end
    - where: a sweep from the middle of the right half down and out to the bottom centre, crossing the long curving shaft
      part: the lower sweeping blade of the dagger-axe
    - where: a short stroke slanting down to the right in the upper right corner
      part: a small metal rivet or tassel near the top of the dagger-axe

诫:
  object: a speaking mouth with its tongue on the left, uttering a warning beside two hands holding up a halberd on the right
  history: >-
    An ideogrammic and phono-semantic compound combining speech (言, simplified on the left to 讠 from
    its cursive form) with guarding (戒, two hands 廾 holding a dagger-axe 戈 at the ready): speaking
    words to warn and put someone on guard.
  layout: >-
    The speaking mouth and tongue occupy the narrower left third, facing right toward the weapon.
    The right two thirds hold the tall halberd with its long shaft curving from top centre to bottom
    right, its crossbar near the top, and two pale hands raised side by side in the lower middle to
    stand guard. Pale bronze and soft skin tones colour the halberd and hands behind the strokes.
  exact:
    - The left part and the right part do not touch; a small gap separates the upward hook of the left part from the lower line across in the right part.
    - In the left part, the top dot stands free above a stroke that rises to the right, turns sharply down, and ends at the bottom in a hook rising to the right.
    - In the right part, the upper line across crosses the long curving shaft, while the lower line across is about three quarters as long and stops short of the shaft with a small gap.
    - Two vertical strokes cross the lower line across side by side; the left one sweeps slightly left at the bottom and the right one is straight with a plain point and no hook.
    - The long shaft starts near the top centre, curves down to the bottom right with an upward hook, and is crossed in its lower half by a sweep down to the left.
    - The short dot in the upper right stands free above the upper line across and to the right of the shaft, about the same length as the dot in the upper left.
  strokes:
    - where: a short dot in the upper left, slanting down to the right
      part: the tip of the tongue above the speaking mouth
    - where: a stroke on the left that rises to the right, turns sharply down, and ends in a hook rising to the right
      part: the side profile of the speaking mouth and lower lip, open toward the right
    - where: a line across the upper middle of the right part, rising slightly to the right
      part: the horizontal blade and crossbar of the halberd
    - where: a shorter line across the lower middle of the right part, about three quarters as long as the upper line across and rising slightly to the right
      part: the pair of forearms held across together on guard
    - where: a vertical stroke in the lower middle, curving slightly down to the left at the bottom
      part: the raised left hand and wrist
    - where: a straight line down just to the right of the left hand's stroke, with no hook
      part: the raised right hand and wrist
    - where: a long sweeping curve from near the top centre down and out to the bottom right, ending in an upward hook
      part: the long shaft of the halberd, curving down to its butt spike
    - where: a sweep on the lower right from below the crossbar down and to the left across the shaft
      part: the lower brace sweeping back across the halberd shaft
    - where: a short dot in the upper right, slanting down to the right above the crossbar
      part: the upper tang of the halberd head

