    clean for rest.
  layout: >-
    A wide pale-tiled house roof spans the top third of the square. Below it on the left stands a
    narrow wooden bed frame turned upright on its side, painted in pale warm wood tones. Below the
    roof on the right, a pale straw broom with a bound head and wide collar is held at the bottom by
    a hand reaching in from the lower right. The roof, bed, and broom-and-hand stay clearly
    separated in their own regions.
  exact:
