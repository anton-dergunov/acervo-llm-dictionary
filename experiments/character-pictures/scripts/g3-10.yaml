棗:
  object: a tall jujube date tree with two stacked tiers of branches and sharp downward-pointing thorns
  history: >-
    An ideogrammic compound made by stacking two 朿 (a tree 木 with thorns 冂 on its branches) one
    above the other to depict the tall, heavily thorned jujube tree.
  layout: >-
    One tall jujube tree fills the square vertically in two stacked tiers corresponding to the upper
    and lower halves of the character. The upper tier is narrower and shorter, forming the thorny
    upper crown; the lower tier is wider and taller, forming the thorny lower boughs, main trunk,
    and wide roots. Soft pale green foliage and small pale reddish-brown jujube dates sit behind the
    branches in both tiers.
  exact:
    - Both vertical trunks (upper and lower) are straight vertical lines ending in a plain point at the bottom, with no hook, and separated by a small gap in the centre so they do not touch.
    - In both tiers, the top horizontal line is about half as long as the hooked horizontal stroke below it, and the vertical trunk crosses both.
    - In both tiers, the wider middle stroke starts on the short left downward slant, runs across the vertical trunk, and turns down on the right into a hook pointing down and left.
    - In the upper tier, the left sweep and the short right slanting stroke start on the upper trunk below the hooked cross-stroke; they do not touch each other and do not touch the hooked frame above them.
    - The lower tier is wider and taller than the upper tier; its bottom right stroke is a long falling sweep that flattens out to the right, whereas the upper tier's corresponding stroke is a short slant.
    - In the lower tier, the two bottom sweeps start on the lower trunk below the hooked cross-stroke and do not touch each other.
  strokes:
    - where: a short line across the top centre, rising slightly to the right
      part: the top cross-branch of the upper crown
    - where: a short stroke in the upper left, slanting down to the right
      part: the left downward thorn of the upper crown
    - where: a wider line across the upper half from the middle of the upper-left slant, turning down on the right into a hook to the left
      part: the thorny bough of the upper crown, hooking down into a right thorn
    - where: a straight line down the middle of the upper half, crossing both upper horizontal lines and ending in a plain point
      part: the upper trunk of the jujube tree
    - where: a sweep from the lower part of the upper trunk down and out to the middle left
      part: the left lower branch of the upper crown
    - where: a short stroke from the bottom of the upper trunk, slanting down to the right
      part: the short right lower branch of the upper crown
    - where: a short line across the centre, just below the upper trunk
      part: the upper cross-branch of the lower tier
    - where: a short stroke in the middle left, slanting down to the right
      part: the left downward thorn of the lower tier
    - where: a wider line across the lower half from the top of the middle-left slant, turning down on the right into a hook to the left
      part: the thorny bough of the lower tier, hooking down into a right thorn
    - where: a long straight line down the middle of the lower half, crossing both lower horizontal lines and ending in a plain point at the bottom
      part: the main lower trunk of the jujube tree
