鑿:
  object: a notched chisel boring down into a mortar on the upper left, a hand gripping a striker on the upper right, and a cast-metal bell with bands and studs at the bottom
  history: >-
    The oracle-bone form was an ideogrammic compound drawing a jagged chisel or drill bit cutting
    down into a mortar. A hand holding a striker on the right and the metal sign (a cast bronze
    bell) at the bottom were added later to show a metal chisel driven into stone.
  layout: >-
    The upper half is split between the chisel-and-mortar on the left and the striker-and-hand on
    the right; the lower half is filled by the wide-shouldered cast-metal bell. On the upper left,
    the notched chisel head sits at the top and sends its central vertical shaft straight down into
    the stone mortar below it. On the upper right, a pale hand grips a curved striker above it.
    Across the bottom, the pale bronze bell spreads its sloping shoulders below the mortar and
    striker, with two horizontal bands, a central vertical clapper, two side studs, and a wide
    bottom rim.
  exact:
    - At the top left, the two inner vertical prongs touch the long upper cross-line, while the outer left dot and outer right dot stand completely free above it.
    - The long upper cross-line of the chisel is nearly twice as long as the two shorter cross-lines beneath it; two short vertical struts connect the long upper cross-line to the middle cross-line.
    - The chisel's central vertical shaft starts on the middle cross-line, crosses the lower cross-line, and runs straight down between the two sides of the mortar to touch the middle of the mortar's bottom line.
    - Inside the mortar, the left inner stroke touches only the left wall and the right inner stroke touches only the right wall; neither touches the central vertical shaft.
    - The upper-right component does not touch the left side or the bottom bell; its upper part (the striker) and lower part (the hand whose two strokes cross in the middle) do not touch each other.
    - At the bottom, the bell's two long shoulder sweeps meet at the top centre right against the bottom-right corner of the mortar.
    - Inside the bell, the central vertical line starts at the middle of the upper band, crosses the slightly longer lower band, and ends on the long bottom rim; the two side studs below the lower band stand completely free.
