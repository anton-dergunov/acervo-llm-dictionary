歪:
  checked: argon
  object: a tilted flower calyx above a bare foot stepping up to a mark on the ground
  history: >-
    An ideogrammic compound placing 不 (a flower calyx, borrowed to mean "not") above 正 (a foot
    stepping up to a straight line, meaning "straight" or "proper"): not straight, and therefore
    slanted or askew.
  layout: >-
    The upper half holds the flower calyx of 不, tilted slightly askew, with a pale blossom rim at
    the top and pale green sepals and stem hanging down. The lower half holds the bare foot of 正 in
    pale skin tones, seen from above, stepping forward toward the horizontal mark in the middle and
    standing on the wide ground line at the bottom. The lower part is wider than the upper part, and
    a small gap separates the stem of the calyx from the mark below it.
  exact:
    - The top line is about two thirds as long as the bottom ground line, the middle line is just under half as long as the bottom line, and the short side line on the right of the lower half is the shortest of all.
    - In the upper half, the long left sweep starts at the middle of the top line, the central vertical starts on that sweep just below the top, and the short right stroke stands completely free.
    - The central vertical of the upper half ends in a plain point and does not touch the middle horizontal line below it, leaving a small gap between the two halves.
    - In the lower half, the middle vertical starts at the middle of the middle horizontal line and runs down to touch the middle of the bottom ground line.
    - The short horizontal in the lower half starts at the middle of the lower central vertical and rises slightly to the right.
    - The short vertical on the lower left starts free below the left end of the middle line, slants slightly down to the right, and ends on the bottom ground line.
  strokes:
    - where: a line across the top, about two thirds as long as the bottom line and rising slightly to the right
      part: the top rim of the blossom
    - where: a long sweep starting at the middle of the top line and running down and out to the middle left
      part: the calyx's left sepal
    - where: a straight vertical line starting on the upper part of the left sweep and running down to the centre, ending in a plain point above the middle line
      part: the central stem of the calyx
    - where: a short stroke in the upper right, slanting down to the right and standing free
      part: the calyx's right sepal
    - where: a line across the middle, just under half as long as the bottom line and rising slightly to the right
      part: the straight mark the foot steps up to
    - where: a vertical line down the middle of the lower half, from the middle line to the bottom line
      part: the foot's long middle line, from the toes to the heel
    - where: a very short line across the right side of the lower half, starting from the middle vertical and rising slightly to the right
      part: the foot's inner toe
    - where: a short line on the left side of the lower half, slanting slightly down to the right and ending on the bottom line
      part: the foot's outer edge
    - where: a very long line across the bottom, from the far left to the far right
      part: the ground the foot stands on

呆:
  checked: argon
  object: a wide-open mouth above a wooden tree, depicting wooden speech
  history: >-
    An ideogrammic compound combining a mouth 口 at the top with a tree or wood 木 below, evoking
    speech as stiff and dull as wood. The form also served as a variant of 保, a person carrying a
    child.
  layout: >-
    A wide-open mouth sits in the upper centre, perched directly on the top of a broad tree that
    fills the middle and bottom of the square. The mouth has soft pale pink lips around a light
    interior. Below it, the tree has pale brown wood along its trunk, branches and roots, with a
    soft pale green leafy crown behind the branch line.
  exact:
    - The mouth at the top is compact and narrow, about half as wide as the tree below it.
    - In the mouth, the left vertical stroke and the top stroke meet at the top left corner, the top stroke turns down at the top right to form the right side, and the bottom line closes the mouth between the two sides.
    - The tree's vertical trunk starts at the middle of the mouth's bottom line and does not cross up into the mouth.
    - The tree's branch line across the middle is the widest stroke of the character, while the mouth's bottom line is a little over a third as long.
    - The tree's trunk is a straight vertical line crossing the middle of the branch line and ending in a plain point at the bottom, with no hook.
    - The two lower sweeps both start where the trunk crosses the branch line and spread out to the bottom left and bottom right without touching each other.
  strokes:
    - where: a short line down the left side of the upper box, slanting slightly inward and a little over a third as long as the trunk below
      part: the left corner and left side of the open lips
    - where: a line across the top of the upper box from left to right, turning down at the top right to run down the right side
      part: the upper lip, curving down into the right corner of the mouth
    - where: a short line across the bottom of the upper box, rising slightly to the right and a little over a third as long as the branch line below
      part: the lower lip, closing the bottom of the mouth
    - where: a long line across the middle from far left to far right, rising slightly to the right
      part: the tree's main branches, spreading wide to both sides
    - where: a long straight line down the middle, from the underside of the lower lip to the bottom, with no hook
      part: the tree's wooden trunk
    - where: a sweep from where the trunk crosses the branches down and out to the bottom left
      part: the tree's left root, spreading out to the left
    - where: a falling stroke from where the trunk crosses the branches down and out to the bottom right
      part: the tree's right root, spreading out to the right

厄:
  checked: argon
  object: a kneeling person in side view crouched beneath an overhanging cliff face
  history: >-
    In the oldest forms, this character was a simple ideogram of a kneeling person in profile with a
    mark pointing to the knee. In the modern form, that outer mark became the overhanging cliff
    component wrapping over the kneeling figure from the top left, picturing a person pressed down
    in tight quarters.
  layout: >-
    A pale stone cliff face wraps around the top and left side of the square, formed by the outer
    top line and long left sweep. Tucked underneath the overhang on the lower right is a kneeling
    person in side view facing right, with a small head just below the cliff's roof, a face with
    eyes, a nose and a mouth, and simple pale clothes. The inner upper stroke forms the hunched
    shoulders and bent arm, while the long lower L-shaped stroke forms the back, legs resting along
    the bottom, and upturned foot at the right.
  exact:
    - The outer top line starts at the top of the long left sweep, forming a corner at the upper left.
    - The outer cliff strokes and the inner kneeling figure do not touch; there is a clear gap between the left sweep and the inner vertical.
    - The inner upper stroke starts at the top of the inner vertical, runs across to the right for about half the length of the outer top line, turns down, and ends in a hook to the left.
    - The inner vertical runs straight down, turns into a wide horizontal base extending further right than the outer top line, and turns sharply upward at its right end into a tall pointed hook.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the overhanging top ledge of the cliff
    - where: a long stroke from the left end of the top line, running down and sweeping out to the bottom left
      part: the steep left wall of the cliff
    - where: a shorter line inside the cliff from the upper middle across to the right, turning down and ending in a hook to the left
      part: the kneeling person's hunched shoulder and bent arm
    - where: a long stroke starting at the left end of the inner upper stroke, running down, turning across to the right along the bottom, and hooking sharply upward at the right end
      part: the kneeling person's back, lower legs along the ground, and upturned foot

綿:
