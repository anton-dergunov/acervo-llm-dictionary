桑:
  checked: argon
  object: a mulberry tree with a trunk, wide branches and roots below, and three clusters of berry-laden twigs and foliage in its crown above
  history: >-
    The oldest forms drew a mulberry tree with thick, branching tufts of foliage at the top. In the
    modern character those upper tufts became three small hand-like shapes 叒 above the tree 木.
  layout: >-
    One full mulberry tree fills the square from top to bottom. The lower half is the woody base of
    the tree, with a straight central trunk, wide main branches spreading across the middle, and two
    roots spreading out at the bottom. The upper half holds three separate clusters of crossed
    twigs—one at the top centre and two side by side below it—surrounded behind the strokes by a
    soft pale green leafy crown dotted with small pale purple-pink mulberries.
  exact:
    - The upper half is made of three separate two-stroke clusters arranged in a triangle, one at the top centre and two side by side below it, with the right cluster sitting slightly higher than the left.
    - In each of the three upper clusters, the first stroke runs short across to the right and turns sharply down to sweep to the left, and the second stroke slants down to the right across the middle of the first.
    - The three upper clusters do not touch one another, and none of them touches the tree below.
    - The horizontal branch line of the lower tree is much wider than the upper crown, more than three times as long as the top leg of any upper cluster.
    - The vertical trunk crosses the middle of the long horizontal branch line and ends at the bottom in a plain point, with no hook.
    - The two lower sweeps both start where the trunk crosses the horizontal branch line, and spread down to the left and right without touching each other at their starts.
  strokes:
    - where: a short line across the top centre that turns sharply at the right to sweep down and to the left
      part: the main curving twig of the top foliage cluster
    - where: a short stroke in the top centre slanting down and to the right across the middle of the top curving stroke
      part: the crossing twig of the top foliage cluster
    - where: a short line across the upper-middle left that turns sharply at the right to sweep down and to the left
      part: the main curving twig of the middle-left foliage cluster
    - where: a short stroke in the middle left slanting down and to the right across the middle-left curving stroke
      part: the crossing twig of the middle-left foliage cluster
    - where: a short line across the upper-middle right, slightly higher than the left cluster, turning sharply to sweep down toward the centre
      part: the main curving twig of the middle-right foliage cluster
    - where: a short stroke in the middle right slanting down and to the right across the middle-right curving stroke
      part: the crossing twig of the middle-right foliage cluster
    - where: a long line across the lower middle from far left to far right, rising slightly to the right
      part: the mulberry tree's main branches, spreading wide to both sides
    - where: a straight vertical line down the middle of the lower half, ending in a plain point at the bottom
      part: the mulberry tree's trunk
    - where: a long sweep from the crossing of the trunk and main branch down and out to the bottom left
      part: the root spreading out to the left
    - where: a long falling stroke from the crossing of the trunk and main branch down and out to the bottom right
      part: the root spreading out to the right

捧:
  checked: argon
  object: a hand on the left holding up a tall tiered ceremonial offering on a stand on the right
  history: >-
    An ideographic compound combining a hand 扌 on the left with 奉 on the right, which originally
    drew hands holding up a flourishing branch as a ritual offering. Together they mean to hold or
    present with both hands.
  layout: >-
    The left third of the square holds an open hand in pale skin tones, seen from the side with the
    wrist at the bottom hook and fingers reaching right toward the offering. The wider right two
    thirds hold a tall ceremonial offering stand in pale jade, soft gold, and warm wood tones: three
    stacked horizontal tiers at the top pierced by a central stem that sweeps down into a left
    drape, a matching right drape sweeping out from the wide middle tray, and a straight lower
    pedestal post crossed by two horizontal bars below.
  exact:
    - The left hand component is narrower than the right offering component, and the rising stroke of the hand stops just short of the wide middle tray line on the right without touching it.
    - The long vertical on the left crosses both the short upper line across and the lower rising stroke, and ends at the bottom in a hook up to the left.
    - In the upper right, three lines across are stacked one above the other; the top two are a little over half to two thirds as long as the wide third line at the bottom of the stack.
    - A long downward sweep starts above the top right line across, crosses all three upper lines across down their middle, and curves out to the lower left.
    - The falling stroke on the right starts on the wide third line across, to the right of the central crossing, and sweeps down and out to the far right.
    - In the lower right, a straight vertical starts below the wide third line across without touching it, crosses two lower lines across, and ends in a plain point at the bottom with no hook.
    - Of the two lower lines across, the upper one is short, about half as long as the wide middle line and not touching the left sweep beside it, while the lower one is nearly as long as the wide middle line.
  strokes:
    - where: a short line across the upper part of the left side, rising slightly to the right
      part: the upper fingers of the hand, reaching right
    - where: a long line down the left side from top to bottom, ending in a hook up to the left
      part: the upright palm and wrist of the hand, turning at the heel of the wrist
    - where: a rising stroke across the middle of the left side, slanting up to the right across the vertical
      part: the thumb and lower fingers, angled up to support the offering
    - where: a line across the top of the right half, about two thirds as long as the wide middle line below it
      part: the top crossbar of the ceremonial offering
    - where: a line across the upper part of the right half just below the top line, slightly shorter than it
      part: the second crossbar of the ceremonial offering
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the wide main tray rim of the offering
    - where: a long stroke from the top peak of the right half down through the three upper lines across, sweeping out to the lower left
      part: the central spire of the offering curving down into the left side-drape
    - where: a falling stroke starting on the wide middle line to the right of the centre, sweeping down and out to the right
      part: the right side-drape of the offering, sweeping out to the right
    - where: a short line across the lower middle of the right half, about half as long as the wide middle line
      part: the upper collar bar of the pedestal stand
    - where: a long line across the lower part of the right half, nearly as long as the wide middle line
      part: the wide base bar of the pedestal stand
    - where: a straight line down the middle of the lower right half, crossing the two lower bars and ending in a plain point
      part: the central post of the pedestal stand

兑:
  checked: argon
  object: a person standing and speaking joyfully, with an open mouth as the head on two legs and puffs of breath rising above
  history: >-
    In oracle bone script, this character is an ideogrammic compound of a person with an open mouth
    (兄) below two diverging strokes (八) that show breath or words rising from the mouth, or smile
    lines of pleasure. It served as the original form of the characters for speaking (說) and feeling
    pleased (悅).
  layout: >-
    A cheerful person fills the lower portion of the square, facing forward with a friendly face
    (eyes, a nose, and an open smiling mouth framed by the middle box) and simple pale clothes over
    the body and legs. The box in the middle forms the head and open speaking mouth, the two lower
    strokes form the standing legs, and the two short strokes at the top are pale puffs of breath
    and sound rising into the air above the head.
  exact:
    - The two top strokes stand completely free above the middle box, touching neither each other nor the box below.
    - At the top, the left stroke slants down to the right, while the right stroke starts higher up and sweeps down to the left.
    - The middle box is widest at the top and narrows slightly toward the bottom; its top and right side are one stroke turning at the top right, and its bottom line rises slightly to the right to close the box.
    - The lower-left sweep starts at the bottom-left corner of the middle box and sweeps out to the bottom left.
    - The lower-right stroke starts from the middle of the box's bottom line, drops straight down, turns wide across to the right, and rises sharply at its end.
  strokes:
    - where: a short stroke at the top left, slanting down toward the centre
      part: the left puff of breath rising from the mouth
    - where: a short sweep at the top right, starting higher than the left stroke and slanting down toward the centre
      part: the right puff of breath rising from the mouth
    - where: a short line down the left side of the middle box, slanting slightly inward
      part: the left cheek and corner of the speaking mouth
    - where: a line across the top of the middle box, turning at its right end to slant down to the left
      part: the top of the head and right cheek
    - where: a line across the bottom of the middle box, rising a little to the right
      part: the chin and lower lip
    - where: a sweep from the bottom-left corner of the middle box down and out to the bottom left
      part: the speaker's left leg
    - where: a long stroke from the middle of the box's bottom line going straight down, then turning wide across to the right and rising at its end
      part: the speaker's right leg, ending in a raised foot

