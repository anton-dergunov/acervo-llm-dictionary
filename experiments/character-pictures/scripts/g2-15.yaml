曇:
  checked: argon
  object: the sun high in the sky above a rain-bearing cloud and a curling cloud below, an overcast sky
  history: >-
    An ideogrammic compound placing the sun 日 above a cloud 雲 (itself formed of rain 雨 over a
    curling cloud 云) to show the sun overcast by heavy clouds.
  layout: >-
    The sun sits centred near the top, narrower and smaller, glowing pale warm yellow. Below it,
    without touching, the cloud component fills the lower two thirds of the square: first the wide
    canopy of a pale grey-blue rain cloud with four falling raindrops on either side of its central
    rain streak, and beneath that a soft pale billowing cloud with a curled underside at the bottom.
  exact:
    - The top sun box is smaller and narrower than the cloud below it, and the two components do not touch.
    - Inside the sun box, the middle line across touches the left vertical and stops short of the right side, while the bottom line closes the box from left to right.
    - In the middle rain section, the central vertical starts at the middle of the short top line, crosses the wide hooked canopy line, and stops just above the lower cloud without touching it.
    - The wide canopy line starts at the top of the short left vertical and runs all the way across to the far right, where it turns into a hook pointing down and to the left.
    - The four short slanting raindrop dots — two stacked on the left and two stacked on the right — stand completely free inside the canopy.
    - Below the raindrops, the upper horizontal line of the bottom cloud stands free and is about half as long as the long horizontal line beneath it.
    - At the bottom, the angled stroke starts from the middle of the long horizontal line, sweeps down to the left and turns across to touch the middle of the final falling stroke on the right; that final stroke starts just below the long horizontal line without touching it.
  strokes:
    - where: a short line down the left side of the top box, slanting slightly inward
      part: the left rim of the sun
    - where: a line across the top, turning down at the top right to run down the right side of the top box
      part: the top and the right rim of the sun
    - where: a short line across the middle of the top box, rising slightly to the right
      part: the bright band of light across the sun's heart
    - where: a short line across the bottom of the top box, rising slightly to the right
      part: the bottom rim of the sun
    - where: a line across the upper middle just below the sun, rising slightly to the right
      part: the flat top of the rain cloud
    - where: a short line down the far left of the middle section, slanting slightly to the left
      part: the rain cloud's left edge
    - where: a very wide line across from the top of the left edge to the far right, ending in a hook down to the left
      part: the rain cloud's lower canopy and hooked right side
    - where: a straight line down the centre from the rain cloud's top line, crossing the wide canopy line
      part: a long streak of rain in the middle
    - where: a short dot in the left half below the canopy line, slanting down to the right
      part: an upper left raindrop
    - where: a short dot on the left below the upper left dot, slanting down to the right
      part: a lower left raindrop
    - where: a short dot in the right half below the canopy line, slanting down to the right
      part: an upper right raindrop
    - where: a short dot on the right below the upper right dot, slanting down to the right
      part: a lower right raindrop
    - where: a line across the centre below the raindrops, rising slightly to the right, about half as long as the line below it
      part: the soft top ridge of the lower cloud
    - where: a long line across the lower part, below the shorter ridge line
      part: the long flat back of the lower cloud
    - where: a stroke from the middle of the long lower line sweeping down to the bottom left, then turning sharply across and rising slightly to the right
      part: the curled underside of the cloud
    - where: a short falling stroke at the bottom right, slanting down to the right
      part: the cloud's wisp, trailing off to the lower right

陵:
  checked: argon
  object: a steep terraced hill on the left, a high tiered earthen mound at the top right, and a person at the bottom right climbing up the slope
  history: >-
    Originally written as the right-hand part alone, which combined an upper mound or tree and
    person with a striding foot at the bottom to mean climbing a high hill; the left-hand terraced
    mound radical was later added to denote a great hill or burial mound.
  layout: >-
    On the left, a tall narrow terraced cliff runs from near the top to the bottom, shaded in pale
    ochre and soft grey-brown. On the right, the upper half holds a tiered earthen mound with a
    central ridge, a wide base ledge, and two sloping earthen flanks beneath it. In the lower right
    half, a climber seen in profile facing left strides up the hillside; a small head with eyes, a
    nose and a mouth sits just above the lower strokes, and the climber wears simple pale tunic
    clothes.
  exact:
    - The left cliff's vertical line starts where the stepped stroke starts and runs straight down to a plain point at the bottom, with no hook.
    - The left cliff's stepped stroke turns twice down the right side of the cliff and ends in a small hook to the left; it does not touch the wide horizontal line or the short left sweep beside it.
    - At the top right, the upper horizontal line is clearly shorter than the lower horizontal line, a little over half as long.
    - The top-right vertical line crosses the upper horizontal line and stops on the middle of the lower horizontal line without crossing below it.
    - Below the wide lower horizontal line, the short sweep down to the left and the short stroke down to the right both stand completely free, touching no other strokes.
    - In the bottom right, the upper sweep down to the left is almost twice as long as the short left sweep above it; the turned stroke starts near the top of that sweep, and the long falling stroke down to the right starts on the middle of that sweep and crosses the turned stroke.
  strokes:
    - where: a stroke at the top left running across to the right, turning down to the left, then curving down again and ending in a small hook to the left
      part: the two stepped ledges of the left-hand hill
    - where: a long straight line down the far left, from the start of the stepped stroke to the bottom left
      part: the tall vertical face of the left-hand hill
    - where: a short line across the upper part of the right half, rising slightly to the right
      part: the upper terrace of the high earthen mound
    - where: a vertical line down the upper middle of the right half, crossing the upper line across and stopping on the longer line below
      part: the central earthen ridge of the mound
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the wide base ledge of the upper mound
    - where: a short sweep down to the left below the left side of the wide ledge, standing free
      part: the left sloping flank under the mound
    - where: a short stroke slanting down to the right below the right side of the wide ledge, standing free
      part: the right sloping flank under the mound
    - where: a sweep from the centre of the box down and out to the lower left
      part: the climber's chest and forward arm reaching toward the slope
    - where: a stroke starting on the upper part of the lower-left sweep, running shortly across to the right and turning down to sweep to the bottom centre
      part: the climber's back and forward-stepping left leg
    - where: a long falling stroke starting on the middle of the lower-left sweep, crossing the turned stroke and sweeping down and out to the bottom right
      part: the climber's trailing right leg bracing against the ground

函:
  checked: argon
  object: an upside-down arrow stored upright inside an open-topped wooden box
  history: >-
    The oldest forms were a pictogram of an arrow placed upside down inside a container or quiver
    with side loops. In the modern form, the outer bottom frame is the open box, the central hooked
    line and its top cap are the arrow shaft, and the four flanking strokes are the parts and
    feathers beside the shaft inside the case.
  layout: >-
    A wide, open-topped wooden box fills the lower half and sides of the frame, painted in pale warm
    wood tones. Standing down the middle into the box is an upside-down arrow with its notch at the
    top, its shaft running down the centre, and two pairs of pale feathers flanking the left and
    right of the shaft inside the box.
  exact:
    - The top stroke runs across to the right and turns sharply down to the left, touching the top of the central shaft.
    - The central shaft curves slightly down the middle and ends in a hook up to the left, stopping short of the bottom floor of the box without touching it.
    - To the left of the central shaft sit two free-standing strokes that touch nothing else, with a short stroke slanting down to the right above a longer stroke rising up to the right.
    - To the right of the central shaft sit two free-standing strokes that touch nothing else, with a short sweep down to the left above a short stroke slanting down to the right.
    - The outer box is open at the top, its left wall and floor formed by one stroke that turns at the bottom left and rises slightly to the right to touch the right vertical wall above its bottom end.
  strokes:
    - where: a stroke across the top centre that turns sharply at the right to slant down to the left
      part: the top tail cap of the upside-down arrow
    - where: a vertical stroke curving slightly down the centre from the end of the top stroke, ending in a hook to the left
      part: the central shaft of the arrow, ending in its hooked point inside the box
    - where: a short stroke in the middle left, slanting down to the right beside the upper shaft
      part: the upper-left feather beside the arrow shaft
    - where: a short rising stroke below it on the left, slanting up to the right toward the shaft
      part: the lower-left feather beside the arrow shaft
    - where: a short sweep in the upper right, slanting down and left toward the shaft
      part: the upper-right feather beside the arrow shaft
    - where: a short stroke below it on the right, slanting down to the right away from the shaft
      part: the lower-right feather beside the arrow shaft
    - where: a line down the lower left side that turns sharply at the bottom left to run across the bottom, rising slightly to the right
      part: the left wall and bottom floor of the open wooden box
    - where: a vertical line down the lower right side, from the middle right to the bottom right
      part: the right wall of the open wooden box
