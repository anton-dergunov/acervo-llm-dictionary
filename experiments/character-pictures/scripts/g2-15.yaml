  history: >-
    Originally written 緜, this ideogram combines 糸 (a twisted skein of silk thread, narrowed to 糹 on
    the left) with 帛 (white silk textile, formed from 白 white at the top and 巾 a hanging cloth
    below) to show soft, continuous silk floss and fabric.
  layout: >-
    The picture is split into left and right halves that do not touch. On the left, narrower and
    shorter, hangs a pale cream skein of twisted silk thread with two angled loops above and three
    short loose fringe threads in a row below. On the right, wider and taller, sits a bright white
    oval silk cocoon in the upper half directly above a pale ivory silk cloth draped over a wide
    horizontal bar in the lower half, with a long central vertical fold running down through the
    middle of the cloth to the bottom of the frame.
  exact:
    - The left silk skein is narrower and shorter than the right silk textile, and the two sides do not touch.
    - In the upper left skein, the first bent loop turns across to touch the middle of the second bent loop, and the second loop turns up to meet the short side dot on its right.
    - Below the left skein, the three short fringe strokes slant down to the right in a rising row and stand completely free of the loops and of one another.
    - In the upper right box, the short top sweep meets the top-left corner; the middle inner line touches the left vertical and stops short of the right side; the bottom line closes the box.
    - In the lower right cloth, the horizontal top bar is slightly wider than the upper box and turns down on the right to end in a small hook to the left, while the short left vertical has a plain end.
    - The long central vertical starts at the bottom of the upper right box, crosses the horizontal bar of the lower cloth, and runs straight down far below the cloth's side edges, ending in a plain point with no hook; the left verticals of the upper box and lower cloth are each less than half as long.
