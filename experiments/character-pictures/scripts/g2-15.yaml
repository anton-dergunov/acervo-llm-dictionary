兌:
  checked: argon
  object: a person standing on two legs with a wide-open mouth and two puffs of breath or speech rising above the head
  history: >-
    In oracle bone script, an ideogrammic compound of a person at the bottom, an open mouth in the
    middle, and two strokes above for breath, speech, or smile lines rising from the mouth: the
    original character for speaking and being pleased.
  layout: >-
    A person seen from the front fills the frame from top to bottom. The middle box is the person's
    wide-open smiling mouth set in a round pale head with friendly eyes and a nose, while the two
    short strokes at the top sit in pale puffs of breath or sound rising above the head. The two
    lower strokes are the person's legs, dressed in simple pale clothes around the torso and hips.
  exact:
    - The two short strokes at the top stand completely free of each other and of the mouth below; the left one slants down to the right, and the right one starts higher and sweeps down to the left, stopping just above the middle of the mouth's top line.
    - The mouth in the middle narrows slightly toward the bottom, with its left side slanting down to the right and its right side slanting down to the left to meet the bottom line.
    - The left leg starts right where the bottom of the mouth's left side meets the left end of the lower lip, and sweeps out to the bottom left.
    - The right leg starts touching the middle of the mouth's bottom line, leaving the right end of that bottom line extending past it, and runs straight down before turning across to the right and hooking sharply upward at the bottom right.
  strokes:
    - where: a short dot-like stroke in the upper left, slanting down to the right
      part: the left puff of breath rising above the head
    - where: a short sweep in the upper right, starting higher and slanting down to the left
      part: the right puff of breath rising above the head
    - where: a short line on the left side of the middle box, slanting slightly down to the right
      part: the left side of the wide-open mouth
    - where: a line across the top of the middle box from left to right, turning down at the top right to slant down to the left
      part: the upper lip and right side of the open mouth
    - where: a line across the bottom of the middle box from left to right
      part: the lower lip of the open mouth
    - where: a sweep from the bottom-left corner of the mouth down and out to the bottom left
      part: the person's left leg
    - where: a long stroke starting at the middle of the lower lip, running straight down, turning across to the right at the bottom, and hooking sharply up at the right end
      part: the person's right leg, the upward hook at the end its upturned foot

