妃:
  checked: argon
  object: a kneeling woman on the left paired with a kneeling man on the right, side by side as spouses
  history: >-
    An ideogrammic compound of a woman 女 on the left and a kneeling person 卩 on the right, placed
    side by side as a married couple. In the modern form the kneeling figure on the right came to be
    written as 己.
  layout: >-
    Two kneeling figures in profile, both facing left, sit side by side in the square. The woman
    fills the left half, taller and narrower, with her arms crossed in front of her. The kneeling
    man fills the right half, slightly shorter and wider, his head and shoulders formed by the upper
    loop and his torso, bent legs and upturned feet following the long bottom curve. Both have
    friendly faces with eyes, a nose and a mouth, and wear simple pale traditional robes.
  exact:
    - The left part (the woman 女) and the right part (the kneeling man 己) do not touch each other.
    - The left part starts higher than the right part, while the right part is wider and reaches slightly lower at the bottom.
    - In the left part, the tall stroke runs down and slightly left before turning sharply down to the right; the curved sweep to the bottom left crosses that lower leg; the line across the middle rises slightly to the right, crosses the tall stroke, and ends where the curved sweep begins.
    - In the right part, the top stroke runs across to the right and turns sharply down and slightly left; the middle line across is almost as long as the top line and meets the bottom of that turn.
    - The long bottom stroke of the right part starts where the middle line begins, leaving the upper left side completely open between the top and middle lines, then runs straight down about three quarters as far as the woman's upper leg before curving wide to the right and turning sharply up in a tall hook.
  strokes:
    - where: a long stroke in the left half from near the top down and slightly left, turning sharply in the lower half to sweep down to the right
      part: the kneeling woman's head and back, then her thigh folded forward to her knee
    - where: a curved sweep in the left half from the middle down to the bottom left, crossing the bent stroke's lower leg
      part: the woman's arm, reaching down across her body
    - where: a shorter line across the middle of the left half, rising slightly to the right, crossing the tall bent stroke and ending at the top of the downward sweep
      part: the woman's other arm, held across in front of her
    - where: a stroke in the upper part of the right half running across to the right, then turning sharply down and slightly left
      part: the top and back of the kneeling man's head and shoulders
    - where: a line across the middle of the right half, almost as long as the top line, rising slightly to the right to meet the bottom of the upper stroke's turn
      part: the man's chin and chest, closing the upper fold
    - where: a long stroke starting at the left end of the middle line, running straight down about three quarters as far as the woman's upper leg, curving wide to the right along the bottom, and turning sharply up at the right end
      part: the man's back running down into his kneeling legs along the ground, with the upward hook at the right as his upturned feet

鼠:
  checked: argon
  object: a mouse standing upright, with its head and toothy mouth at the top, its two legs and claws on the lower left and centre, and its long curved tail sweeping out to the bottom right
  history: >-
    The oldest forms drew a side view of a rat with a sharp toothy snout at the top, paws in front,
    a curved back, and a long tail at the bottom. In the modern form, the top part (臼) is the head
    and open mouth showing teeth, the two hooked verticals with dots are the feet and claws, and the
    long curved stroke on the right is the back and tail.
  layout: >-
    A pale grey-brown mouse stands upright filling the square, facing left. Its head forms the upper
    part, with small round ears and an eye drawn softly around the strokes, and its open mouth and
    teeth formed by the box-like upper strokes. Its body stretches down the lower part, with its
    front and hind legs on the left and centre, small claw marks beside the legs, and its back
    curving into a long tail that hooks up at the bottom right.
  exact:
    - The upper part (臼) is open at the top middle between the left sweep and the right top corner, and closed at the bottom by a single line across joining the left and right sides.
    - Inside the upper part, the two short inner lines touch their outer walls on the left and right, leaving a clear gap between their inner ends in the middle.
    - All strokes in the lower half stand completely free of the upper part and of one another, with no touches or crossings.
    - The left and middle verticals in the lower half both end at the bottom in sharp upward flicks to the right.
    - Between the left vertical and the middle vertical sit two short dots stacked one above the other, and between the middle vertical and the right curved stroke sit another two short dots stacked one above the other.
    - The long rightmost stroke starts below the bottom right of the upper part, curves down and far out to the bottom right, and ends in a tall hook pointing straight up.
  strokes:
    - where: a short sweep from near the top centre down and out to the upper left, touching the top of the upper-left vertical
      part: the top left of the mouse's snout
    - where: a line down the left side of the upper half, slanting slightly inward toward the bottom
      part: the left side of the mouse's head and jaw
    - where: a short line inside the upper left, starting from the middle of the left wall and rising slightly to the right, stopping before the centre
      part: the left tooth inside the open mouth
    - where: a line across the top right of the upper half, turning sharply at the corner to run down the right side, slanting slightly inward
      part: the top right of the head and the right cheek
    - where: a short line across inside the upper right, starting to the right of the centre and touching the middle of the right wall
      part: the right tooth inside the open mouth
    - where: a line across the bottom of the upper half, rising slightly to the right to join the bottom of the left wall to the bottom of the right wall
      part: the lower jaw closing the bottom of the head
    - where: a vertical line down the lower left, turning sharply at the bottom into an upward flick to the right
      part: the front leg and paw
    - where: a short dot slanting down to the right, in the upper space between the left vertical and the middle vertical
      part: an upper claw mark beside the front leg
    - where: a short dot slanting down to the right, below the upper dot in the space between the left vertical and the middle vertical
      part: a lower claw mark beside the front leg
    - where: a vertical line down the lower centre, turning sharply at the bottom into an upward flick to the right
      part: the hind leg and paw
    - where: a short dot slanting down to the right, in the upper space between the middle vertical and the right curved stroke
      part: an upper claw mark beside the hind leg
    - where: a short dot slanting down to the right, below the upper dot in the space between the middle vertical and the right curved stroke
      part: a lower claw mark beside the hind leg
    - where: a long stroke starting below the bottom right of the upper part, curving down and out to the bottom right and ending in an upward hook
      part: the mouse's back sweeping out into its long curved tail

