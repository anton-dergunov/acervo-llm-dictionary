    - The long sweep down to the left and the long falling stroke down to the right both start from the long middle line across and flare outward without touching the lower horizontal line between them.
    - At the bottom, the central vertical line starts below the middle line across without touching it, crosses the lower horizontal line, and ends in a hook to the left; the two short bottom side strokes stand completely free on the left and right.
