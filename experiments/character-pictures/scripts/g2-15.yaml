    - In the lower right part, the three vertical stream strokes stand completely free of one another and of the strokes above them.
    - Of the three lower right strokes, the left one sweeps down and out to the bottom left beneath the tip of the left foot, the middle one is a straight vertical ending in a plain point with no hook, and the right one drops down, turns flat across to the right, and ends in a tall hook pointing straight up.
