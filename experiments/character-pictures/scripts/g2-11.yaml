傘:
  checked: argon
  object: an open umbrella seen from the side, its ribs under the canopy and its shaft down the middle
  history: >-
    The character is a pictogram of an open umbrella, with a wide peaked canopy at the top, inner
    forked ribs and struts under the canopy on either side, a horizontal stretcher bar across, and a
    central shaft running down the middle.
  layout: >-
    An open umbrella fills the square, seen from the side. The wide peaked canopy arches across the
    top half, with pale fabric stretched behind the inner forked ribs on the left and right of the
    central pole and down to the horizontal stretcher bar across the lower part. The central shaft
    runs straight down the middle, extending below the canopy into a plain handle at the bottom.
  exact:
    - The two long sweeps at the top meet at the peak to form a wide inverted V covering the top of the character.
    - Beneath the canopy sit an upper and a lower small forked rib on the left of the central vertical, and an upper and a lower small forked rib on the right; each small sweep down to the left is about a third as long as the top left canopy sweep, with a short dot touching its middle and slanting down to the right.
    - None of the small inner ribs touch the top canopy sweeps, the central vertical, the lower line across, or each other.
    - The long vertical down the centre starts below the top peak without touching it, passes between the left and right ribs, crosses the long line across the lower part, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a long sweep from the top centre down and out to the middle left
      part: the left slope of the umbrella's canopy
    - where: a long sweep from just below the top peak down and out to the middle right
      part: the right slope of the umbrella's canopy
    - where: a short sweep down to the left in the upper left space under the canopy, about a third as long as the top left sweep
      part: the upper left inner rib under the canopy
    - where: a short dot slanting down to the right from the middle of the upper left sweep
      part: the small strut branching off the upper left rib
    - where: a short sweep turning down to the left in the lower left space below the upper left rib
      part: the lower left inner rib under the canopy
    - where: a short dot slanting down to the right from the middle of the lower left sweep
      part: the small strut branching off the lower left rib
    - where: a short sweep down to the left in the upper right space under the canopy, about a third as long as the top left sweep
      part: the upper right inner rib under the canopy
    - where: a short dot slanting down to the right from the middle of the upper right sweep
      part: the small strut branching off the upper right rib
    - where: a short sweep down to the left in the lower right space below the upper right rib
      part: the lower right inner rib under the canopy
    - where: a short dot slanting down to the right from the middle of the lower right sweep
      part: the small strut branching off the lower right rib
    - where: a long line across the lower part from left to right
      part: the horizontal stretcher bar across the underside of the umbrella
    - where: a long straight line down the middle from below the peak to the bottom centre, with no hook
      part: the umbrella's central shaft, running straight down into the handle

邁:
  checked: argon
  object: a winding footpath and long road of steps wrapping around the scorpion emblem of ten thousand
  history: >-
    An ideogrammic compound combining walking on a road (辶) with ten thousand (萬): taking ten
    thousand steps, striding far ahead. In the oldest forms, 萬 drew a scorpion seen from above, with
    two raised pincers at the top (later stylized as grass 艹), a segmented carapace in the middle
    (日), and wide hind legs and a curved stinger tail below (禸), borrowed for the number ten
    thousand.
  layout: >-
    The scorpion of 萬 fills the upper right and centre of the square, facing upward, with its two
    raised pincers at the top, its segmented carapace in the middle, and its wide lower body and
    hooked tail below, tinted in pale warm ochre and sand tones. The walking radical 辶 wraps around
    it on the left and bottom as a stepping track at the top left, a winding footpath down the left
    side, and a long pale dusty road sweeping from the bottom left to the bottom right.
  exact:
    - The top part consists of two separate pincer crosses side by side that do not touch each other and do not touch the carapace box below them.
    - On the top left, the short line across crosses the middle of the slanting down-right stroke; on the top right, the short line across starts at the middle of the angled stroke without crossing to its left.
    - In the middle box, the upper inner line across touches neither the left nor the right side, while the lower inner line across meets the bottom of the left side and touches the bottom of the right side.
    - A long straight central vertical starts at the middle of the upper box's top edge, crosses both inner lines of the box and the wide lower frame's top edge, and ends on the middle of the rising line inside the lower enclosure.
    - The lower enclosure is wider than the middle box; its top-and-right stroke starts on the middle of its short left vertical, turns down on the far right, and ends in a hook to the left.
    - Inside the lower enclosure, the rising line across does not touch the left vertical, and its right end meets the start of the short falling dot, which stops clear of the hooked right side.
    - On the left, the top-left dot stands completely free above the zig-zag path stroke.
    - The zig-zag path stroke on the middle left touches the start of the long bottom road stroke, and the long bottom road stroke sweeps all the way under the right part without touching it.
  strokes:
    - where: a short stroke slanting down to the right in the upper centre
      part: the inner claw of the left pincer
    - where: a short line across in the upper centre, rising slightly to the right and crossing the left claw stroke
      part: the outer arm of the left pincer
    - where: a short stroke in the upper right, slanting down to the right and then turning down to the left
      part: the inner claw of the right pincer
    - where: a short line across in the upper right, starting on the middle of the right claw stroke and running right
      part: the outer arm of the right pincer
    - where: a vertical stroke slanting slightly down to the right on the left side of the upper middle box, a little over half as long as the central vertical
      part: the left side of the upper carapace
    - where: a line across from the top of the upper box's left vertical, rising slightly to the right and turning down on the right side
      part: the front and right edge of the upper carapace
    - where: a short line across inside the upper middle box, rising slightly to the right without touching either side
      part: the upper segment line across the carapace
    - where: a short line across closing the bottom of the upper middle box, from the bottom of the left side to the bottom of the right side
      part: the lower segment line closing the upper carapace
    - where: a vertical stroke on the lower left of the inner component, a little over half as long as the central vertical
      part: the left side of the lower body
    - where: a wide line across starting on the middle of the lower-left vertical, running far to the right, turning down, and ending in a hook to the left
      part: the wide lower shell and curved tail ending in a stinger hook
    - where: a long straight line down the middle, from the top edge of the upper box straight down to the rising stroke inside the lower frame
      part: the central spine running down the body
    - where: a short line across inside the lower enclosure, rising slightly to the right without touching the left side
      part: the inner lower ridge at the base of the spine
    - where: a short dot slanting down to the right inside the lower enclosure, starting where the rising ridge ends
      part: the inner barb at the end of the ridge
    - where: a short falling dot at the top left, about three quarters as long as the first pincer stroke and standing free
      part: a stepping footprint at the top of the path
    - where: a zig-zag stroke on the middle left, running across, turning down, turning down to the right, and turning down again
      part: the winding footpath of steps descending on the left
    - where: a very long sweeping stroke across the bottom, from the bottom of the zig-zag path on the left all the way to the bottom right
      part: the long road sweeping beneath the whole scene

轟:
  checked: argon
  object: three old wooden carts seen from straight above, one centred at the top and two side by side below, each with a central shaft running from top to bottom
  history: >-
    An ideogrammic compound tripling the character for a cart or chariot (車) to evoke the thunderous
    rumble of many carts rolling together. Each cart is drawn from straight above, with its central
    carriage box between two wheels seen edge on and a long shaft running down the middle.
  layout: >-
    Three carts seen from straight above fill the square in a triangular formation: one cart centred
    in the upper half, and two carts side by side in the lower half. The bottom-right cart is
    slightly wider and reaches a little lower than the bottom-left cart. Each cart has a pale
    warm-brown wooden carriage box in the middle, two wheels seen edge on as horizontal bars above
    and below the box, and a straight vertical shaft running through the centre from top to bottom.
  exact:
    - The three carts do not touch one another; there is a clear gap between the top cart's lower wheel and the two lower shafts, and between the two lower carts.
    - In each cart, the central vertical shaft is a straight line ending in a plain point at the bottom with no hook, crossing the horizontal strokes of its cart from top to bottom.
    - In each cart, the upper wheel line is clearly shorter, a little over half as long as the wide lower wheel line, and neither wheel line touches the central box.
    - In each cart's box, the left side slants down to the right to meet the top-and-right frame at the top left and the bottom edge at the bottom left, while the bottom edge meets the right side of the frame at the bottom right.
    - The short inner slat inside each cart's box touches or crosses the central vertical shaft but stops short of both the left and right sides of the box.
    - The bottom-right cart is slightly taller and wider than the bottom-left cart, with its vertical shaft starting slightly higher and reaching lower.
