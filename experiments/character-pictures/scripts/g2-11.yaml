迈:
  checked: argon
  object: a traveller taking a wide stride of ten thousand steps (万) along a winding footpath and road (辶)
  history: >-
    The simplified form combines 万, ten thousand, with 辶, the walking radical of a footpath and
    footprints, to show taking a long stride of ten thousand steps.
  layout: >-
    In the upper right half, a traveller faces left in mid-stride, with a small head above the top
    bar showing eyes, a nose and a mouth, and wearing simple pale clothes; the strokes of 万 form the
    outstretched arms and the two wide-spread legs. Wrapping around the left and bottom, the strokes
    of 辶 form a high footprint mark, a winding side trail on the left, and a long pale road sweeping
    across the bottom underneath the walker. All fills use soft pale earth and sky tones.
  exact:
    - The sweep in the upper right starts at the middle of the top line across and curves down to the left.
    - The bent stroke on the right starts at the middle of that sweep, runs a short way to the right (about a third as long as the top line across), turns down and slightly left, and ends in a hook up to the left.
    - The short falling dot at the top left stands completely free and does not touch the top line across.
    - The turning stroke on the middle left touches the long bottom stroke with its lower end, and leaves a clear gap before the inner sweep.
    - The hooked stroke on the right stops just above the long bottom stroke and does not touch it.
  strokes:
    - where: a line across the upper right part, rising slightly to the right
      part: the striding traveller's outstretched arms and shoulders
    - where: a stroke from the middle of the right part that runs a short way to the right, about a third as long as the top line, then turns down and slightly left, ending in a hook up to the left
      part: the traveller's bent back leg, from knee down to the hooked foot
    - where: a sweep starting at the middle of the top line across and curving down to the left
      part: the traveller's torso and front leg striding forward to the left
    - where: a short falling dot at the top left, slanting down to the right
      part: a footprint mark high above the footpath
    - where: a stroke on the middle left that runs across to the right and turns down to the lower left
      part: the winding footpath descending along the left side to meet the road
    - where: a long wave-like stroke from the bottom left across and slightly down to the bottom right
      part: the long road stretching across the bottom beneath the striding traveller

帥:
  checked: argon
  object: two hands extending from a sleeve on the left beside a scarf hanging over a rod on a tall stand on the right
  history: >-
    Early forms combined two hands on the left with a cloth or scarf on the right, depicting hands
    putting on or holding a scarf of office; the left side later settled into the stacked shape of 𠂤
    beside the cloth 巾.
  layout: >-
    The scene is split between the narrower left half and the wider, taller right half. On the left,
    a pale sleeve slants down from the top into a vertical cuff from which two blocky hands reach
    right, one above the other. On the right, a pale woven scarf hangs over a horizontal rod mounted
    on a tall upright post that rises high above the rod and reaches the bottom of the frame.
  exact:
    - The left part and the right part sit side by side with a small gap between them and do not touch.
    - The right part is wider and taller than the left part, its central vertical reaching higher at the top and lower at the bottom.
    - At the top left, the short sweep slants down to the left and touches the top of the left vertical where the first line across begins.
    - Along the right side of the left vertical sit two closed rectangular boxes stacked one above the other with a clear space between them; in each box, the upper stroke runs across and turns down, and the lower stroke runs across to meet the bottom of that turn.
    - The left vertical is about three fifths as long as the right side's central vertical, and both verticals are straight lines ending in plain points at the bottom, with no hook.
    - In the right part, the line across starts at the top of the short left vertical, crosses the long central vertical, turns down the right side, and ends in a hook to the left.
  strokes:
    - where: a short sweep at the top of the left half, slanting down to the left
