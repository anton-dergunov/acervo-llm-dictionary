諮:
  checked: argon
  object: a speaking mouth with its tongue sticking out on the left (言), conferring with a leaning person breathing out puffs of speech above an open mouth on the right (咨)
  history: >-
    An ideogrammic and phono-semantic compound combining 言 (words, a mouth with a tongue sticking
    out above it) on the left and 咨 (to consult, a person leaning with an open mouth and breath
    above another mouth) on the right, depicting conferring and taking counsel.
  layout: >-
    The left side (a little over a third of the width) holds 言: a small mouth at the bottom with a
    broad tongue rising above it. The wider right side holds 咨 stacked in two parts: in the upper
    right (次), a person in simple pale clothes with a clear face (eyes, nose and open mouth) leans
    left with two small puffs of breath in front of them; in the lower right (口), a larger open
    mouth sits directly below the person. Pale soft pinks and blues tint the mouths, breath and
    clothes behind the strokes.
  exact:
    - The left side (言) and the right side (咨) do not touch each other.
    - On the left, the top dot, the long line across, and the two shorter bars below it (each about half as long as the long line) all stand free of one another above the small mouth.
    - In the small left mouth, the top-and-right stroke meets the top of the left vertical and the right end of the bottom bar, while the bottom bar touches the middle of the left vertical.
    - In the upper middle (the left side of 次), the upper dot slants down to the right and the lower stroke rises sharply to the right; both stand free.
    - In the upper right (欠), the hooked horizontal stroke starts at the middle of the upper sweep and turns sharply down to the left; the lower sweep starts below it, and the long falling stroke starts at the middle of the lower sweep and sweeps out to the far right.
    - The lower right mouth (口) is wider than the lower left mouth; its top-and-right stroke meets the top of its left vertical and the right end of its bottom bar.
  strokes:
    - where: a short dot near the top of the left half, slanting down to the right
      part: the tip of the speaking tongue on the left
    - where: a long line across the upper part of the left half, rising slightly to the right
      part: the broad base of the tongue on the left
    - where: a short bar across the middle of the left half, about half as long as the long line above it
      part: the upper fold of the tongue
    - where: a short bar across the left half below the upper fold, about the same length
      part: the lower fold of the tongue
    - where: a short line down the left side of the lower left quarter
      part: the left lip of the speaking mouth on the left
    - where: a line across the top of the lower left mouth, turning down on the right
      part: the upper lip and right corner of the speaking mouth on the left
    - where: a short line across the bottom of the lower left mouth, from the middle of the left vertical to the bottom of the right turn
      part: the lower lip of the speaking mouth on the left
    - where: a short dot in the upper middle, slanting down to the right
      part: the upper puff of speech breath in front of the person
    - where: a short stroke below that dot in the middle, rising sharply to the right
      part: the lower puff of speech breath in front of the person
    - where: a sweep from the top of the right half down and out to the left
      part: the front of the leaning person's head and neck
    - where: a line across from the middle of the upper sweep to the right, turning sharply back down to the left
      part: the person's open upper jaw and the back of the head
    - where: a sweep from the centre of the right half down and out to the lower left
      part: the leaning person's body and front leg
    - where: a long falling stroke from the middle of the body sweep down and out to the far right
      part: the leaning person's back leg
    - where: a line down the left side of the lower right half
      part: the left lip of the consulting mouth on the right
    - where: a wide line across the top of the lower right mouth, turning down to the left at its right side
      part: the upper lip and right corner of the consulting mouth on the right
    - where: a line across the bottom of the lower right mouth, joining the left vertical to the bottom of the right side
      part: the lower lip of the consulting mouth on the right

甜:
  checked: argon
  object: a tongue sticking up from a small mouth on the left beside a wide open mouth with a sweet mark on its tongue on the right
  history: >-
    An ideogrammic compound combining 舌, a tongue emerging from a mouth, on the left with 甘, a mouth
    holding something sweet on the tongue, on the right. Together they mean sweet to the tongue.
  layout: >-
    The picture is split into two halves side by side, with the left part narrower and slightly
    shorter than the right. On the left, a pale pink tongue rises upward from a small open mouth at
    its base, its tip curving down to the left at the top. On the right, a wider open mouth is
    framed by soft pale lips, with a pale pink tongue inside and a warm golden-yellow sweet spot at
    its centre around the short inner horizontal stroke.
  exact:
    - The left component and the right component do not touch; there is a small gap between the horizontal line across the middle of the left half and the long top line of the right half.
    - In the upper left, the vertical line starts touching the middle of the top sweep down to the left, crosses the middle horizontal line, and ends touching the middle of the top edge of the lower-left mouth box.
    - The lower-left mouth box closes cleanly at the bottom right where its bottom line meets the end of the turned right side.
    - In the right half, both long vertical lines cross the wide top horizontal line and end in plain points with no hook; the right vertical starts higher and reaches lower than the left vertical, which is about four fifths as tall.
    - The short middle horizontal line inside the right half starts on the left vertical and stops short of the right vertical, leaving a clear gap.
    - The short bottom line of the right half rises slightly to the right and joins the lower part of the left vertical to the lower part of the right vertical.
  strokes:
    - where: a short sweep in the left half from the top centre down to the upper left
      part: the curved tip of the tongue on the left
    - where: a line across the middle of the left half, rising slightly to the right, about seven tenths as long as the right half's wide top line
      part: the wide crease across the tongue
    - where: a straight vertical line down the middle of the upper left half, from the middle of the top sweep across the horizontal crease to the top of the small mouth below
      part: the centre groove of the tongue
    - where: a short vertical line down the lower left, slanting slightly inward
      part: the left side of the small mouth at the base of the tongue
    - where: a line from the top of the lower-left vertical, running across and turning down on the right
      part: the upper lip and right side of the small mouth
    - where: a short line across the bottom of the left half, from the middle of the lower-left vertical to the bottom of the right turn
      part: the lower lip closing the small mouth
    - where: a long line across the upper part of the right half, rising slightly to the right
      part: the top lip of the wide mouth on the right, extending to both corners
    - where: a long vertical line down the left side of the right half, crossing the top lip, about four fifths as tall as the rightmost vertical
      part: the left side of the wide mouth
    - where: the tallest vertical line down the right side of the right half, starting higher and reaching lower than its left neighbour and crossing the top lip
      part: the right side of the wide mouth
    - where: a very short line across the middle of the right half, about a quarter as long as the top lip, starting on the left vertical and stopping short of the right vertical
      part: the sweet spot on the tongue inside the wide mouth
    - where: a short line across the bottom of the right half, rising slightly to the right from near the bottom of the left vertical to near the bottom of the right vertical
      part: the bottom lip of the wide mouth

帅:
  checked: argon
  object: two hands and arms on the left beside a scarf or cloth hanging over a rod on a stand on the right
  history: >-
    The traditional form 帥 combined two hands on the left with a cloth or scarf 巾 on the right,
    showing hands holding or wearing a commander's scarf. The simplified form 帅 reduced the left
    side from cursive script into two vertical strokes, a short line and a long sweep.
  layout: >-
    The left side holds two pale arms and hands reaching right, drawn around the short vertical line
    on the far left and the long sweeping stroke beside it. The right side is wider and slightly
    taller, holding a pale folded scarf or cloth draped over a horizontal rod on a tall central
    stand. The left and right parts stand side by side with a clear gap between them.
  exact:
    - The first stroke on the far left is a short vertical line in the upper-middle part, about two fifths as long as the tall stand on the right, and touches nothing.
    - The second stroke starts higher and to the right of the first, runs down and sweeps out to the bottom left, and stands completely free of every other stroke.
    - The left part and the right part do not touch each other.
    - In the right part, the short left vertical is a little over a third as long as the tall central vertical, and its top meets the start of the line across.
    - The line across rises slightly to the right, turns sharply down the right side, and ends in a hook to the left at about the same level as the bottom of the short left vertical.
    - The long vertical down the middle of the right half starts near the top, crosses the horizontal line, and runs straight to the bottom to end in a plain point with no hook.
  strokes:
    - where: a short line down the upper-middle part of the far left
      part: the outer raised forearm on the left
    - where: a long stroke in the left half starting near the top, running down and sweeping out to the bottom left
      part: the inner arm and long draped sleeve sweeping down to the left
    - where: a short line down the left side of the right half
      part: the left edge of the scarf, hanging down
    - where: a line across the upper part of the right half, rising slightly to the right, turning down the right side and ending in a hook to the left
      part: the rod with the scarf over it, and the scarf's right edge curling at its hem
    - where: a long straight line down the middle of the right half, from near the top to the bottom
      part: the tall stand that holds the rod

栗:
  checked: argon
  object: a chestnut tree 木 bearing a large chestnut bur 覀 at its top
  history: >-
    The oldest forms drew a tree with bristling chestnut burs growing in its crown. In the modern
    form the bur sits above the tree 木 as the boxy component 覀.
  layout: >-
    A chestnut tree fills the lower half, wider than the bur above it, with spreading branches, a
    central trunk and roots below, backed by a pale green leafy crown. Resting atop the trunk in the
    upper half is a large chestnut bur, its pale tan prickly husk framed by the rectangular box and
    split by the two inner verticals to show pale warm-brown chestnuts nestled inside.
  exact:
    - The upper part is narrower than the tree below; its top line across and its bottom closing line are each a little over half as long as the tree's wide branch line across the lower half.
    - In the upper part, the two inner lines run straight down from the top line across, cross right through the upper edge of the rectangular frame, and end on the frame's bottom closing line without curving outward.
    - The rectangular frame's left side slants slightly inward toward the bottom, and its upper edge and right side are one stroke that turns down at the right and slants inward to meet the bottom closing line.
    - The tree's trunk starts at the middle of the upper frame's bottom closing line, crosses the wide branch line, and runs straight down to a plain point at the bottom with no hook.
    - The tree's two lower sweeps both start where the trunk crosses the branch line and do not touch each other.
  strokes:
    - where: a line across the top centre, a little over half as long as the tree's branch line below
      part: the top crest of the chestnut bur
    - where: a short line on the left of the upper half, slanting down and slightly to the right
      part: the left side of the chestnut bur's husk
    - where: a line across the middle of the upper half from the top of the left side, turning down at the right to slant slightly inward
      part: the upper rim and right side of the chestnut bur's husk
    - where: a straight vertical line left of centre in the upper half, from the top line down through the upper rim to the bottom of the frame
      part: the left inner seam dividing the chestnuts inside the bur
    - where: a straight vertical line right of centre in the upper half, from the top line down through the upper rim to the bottom of the frame
      part: the right inner seam dividing the chestnuts inside the bur
    - where: a line across the bottom of the upper half, closing the frame from left to right and a little over half as long as the branch line below
      part: the base of the chestnut bur
    - where: a long line across the upper part of the lower half, from left to right, the widest line in the character
      part: the main branches, spreading out to both sides
    - where: a long straight line down the middle of the lower half, from the base of the bur to the bottom, with no hook
      part: the trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the root spreading out to the left
    - where: a falling stroke from the centre of the trunk down and out to the bottom right
      part: the root spreading out to the right

