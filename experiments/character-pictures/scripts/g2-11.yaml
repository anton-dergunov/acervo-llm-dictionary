逸:
  checked: argon
  object: a rabbit bounding away along a winding footpath that wraps beneath it
  history: >-
    Originally written in oracle bone script with a foot and manacles, the character was later
    reformed as an ideogrammic compound of a rabbit (兔) and walking along a path (辶): to flee as
    swiftly as a hare.
  layout: >-
    A pale cream and soft grey rabbit fills the upper right, facing right with its long ears up and
    its legs stretched as it springs away. A pale sandy footpath curves down the left side and
    sweeps all the way across the bottom beneath the rabbit.
  exact:
    - The rabbit in the upper right and the footpath wrapping around the left and bottom do not touch each other.
    - At the top of the rabbit, the second ear stroke starts at the middle of the first sweep, runs across and turns down to the left, touching the top of the rectangular head box.
    - The rectangular head box is closed at the bottom by a line meeting both vertical sides.
    - The long sweep for the hind leg starts at the middle of the top line of the head box, crosses the bottom line of the box, and sweeps down to the left without touching the path below.
    - The hooked stroke at the lower right and the short dot tucked inside its bend both stand free of every other stroke.
    - On the left, the top dot of the path stands free, while the middle winding stroke touches the long bottom stroke that sweeps across beneath the rabbit.
  strokes:
    - where: a short sweep at the top centre, slanting down to the left
      part: one long ear of the rabbit
    - where: a short line across from the middle of the first sweep, turning sharply to slant down to the left and touch the box below
      part: the rabbit's other ear, folding forward
    - where: a short line down the left side of the middle box, slanting slightly to the right
      part: the back of the rabbit's head
    - where: a line across the top of the middle box, turning down to run along its right side
      part: the top of the rabbit's head and its face
    - where: a line across the bottom of the middle box, joining both sides
      part: the rabbit's chin and neck
    - where: a long sweep starting from the top line of the middle box, crossing its bottom line and sweeping down to the lower left
      part: the rabbit's back and hind leg, stretched out behind as it flees
    - where: a stroke starting just below the middle box, running down, turning across to the right, and ending in an upward hook
      part: the rabbit's front leg and upturned paw
    - where: a short dot above the horizontal part of the hooked stroke, slanting down to the right
      part: the rabbit's short round tail
    - where: a short dot at the top left, slanting down to the right
      part: a stepping stone beside the upper path
    - where: a stroke at the middle left running briefly across and turning down in a curve to meet the bottom stroke
      part: the winding side edge of the footpath
    - where: a long stroke starting at the bottom left, rising slightly and sweeping down and across to the bottom right
      part: the footpath running beneath the fleeing rabbit

卑:
  checked: argon
  object: a woven fan at the top with a curved central handle, held from below by an outstretched hand and upright forearm
  history: >-
    An ideogrammic compound of a fan above and a hand below, showing a servant's hand holding a fan
    aloft. In the modern form, the fan's blade is the box at the top with a short plume above it and
    a central spine sweeping down to the left, while the hand and forearm below have straightened
    into a wide cross.
  layout: >-
    The fan blade fills the upper half of the square, coloured pale cream and soft ochre, with a
    small pale plume at the top and a central bamboo spine sweeping down through the middle of the
    blade to the lower left. Below the fan, a pale skin-toned hand spreads horizontally along the
    wide lower line to support the handle, with an upright wrist and forearm rising along the lower
    vertical stroke.
  exact:
    - The short sweep at the very top slants down to the left to meet the top-left corner of the upper box.
    - The upper box is wider at the top than at the bottom, with its left side slanting down to the right and its right side slanting down to the left.
    - The short inner line across the middle of the upper box is a little over a quarter as long as the wide lower horizontal, and stops short of both the left and right sides of the box.
    - The lower line of the upper box connects the bottom of the left side to the bottom of the right side, rising slightly to the right.
    - The central sweep starts at the middle of the box's top edge, crosses both the inner line and the bottom line of the box, and curves down to the left to end on the wide lower horizontal line.
    - The wide horizontal line in the lower half is the longest across stroke, about twice as wide as the top of the box.
    - The lower vertical stroke starts just below the bottom of the upper box after a small gap, crosses the wide horizontal line near its middle, and runs straight down to a plain point with no hook.
  strokes:
    - where: a short sweep near the top centre, slanting down to the left to meet the top-left corner of the upper box
      part: a small decorative plume at the top of the fan
    - where: a line down the left side of the upper box, slanting slightly to the right and about two thirds as long as the lower vertical
      part: the left rim of the fan blade
    - where: a line across the top of the upper box, about half as long as the wide lower horizontal, turning down at the right and slanting slightly to the left
      part: the top and right rim of the fan blade
    - where: a short line across the middle of the upper box, rising slightly to the right and stopping short of both sides
      part: a woven cross-rib inside the fan blade
    - where: a line across the bottom of the upper box, rising slightly to the right from the left side to the right side
      part: the lower rim of the fan blade
    - where: a sweep starting at the middle of the upper box's top line, running down through the box and curving to the lower left to touch the wide lower line
      part: the fan's central bamboo spine and curved handle
    - where: a long line across the lower half, spanning almost the full width of the square
