    - where: a straight line down the left side, from the bottom of the top sweep to the lower left
      part: the outer edge of the sleeve and wrists along the left side
    - where: a line across the upper part of the left half, rising slightly to the right and turning down
      part: the top and outer knuckles of the upper hand
    - where: a short line across the upper middle of the left half, rising slightly to the right to close the upper box
      part: the lower edge of the upper hand
    - where: a line across the lower middle of the left half, rising slightly to the right and turning down
      part: the top and outer knuckles of the lower hand
    - where: a short line across the lower part of the left half, rising slightly to the right to close the lower box
      part: the lower edge of the lower hand
    - where: a short line down the left side of the right half
      part: the left edge of the scarf, hanging down
    - where: a line across the upper part of the right half, turning down to run down the right side and ending in a hook to the left
      part: the rod with the scarf over it, and the scarf's right edge, curling at its hem
    - where: a long straight line down the centre of the right half, from near the top to the bottom
