昌:
  checked: argon
  object: the rising sun above an open mouth speaking or singing at dawn
  history: >-
    An ideogrammic compound combining the sun 日 at the top and a mouth 口 at the bottom, representing
    shouts or songs at daybreak. During the Warring States period, the mouth component developed
    into 曰, a mouth with a line inside representing speech or the tongue.
  layout: >-
    The picture is stacked in two parts, one above the other, with a clear gap between them. In the
    upper half sits the narrower sun, filled with a pale warm yellow glow and soft rays behind its
    frame. In the lower half sits a wider open mouth seen from the front, with pale coral lips
    around the outer frame and a soft pink tongue along the middle line, singing in the daylight.
  exact:
    - The upper box and the lower box do not touch each other.
    - The upper box is narrower and shorter than the lower box; its top horizontal leg is about three quarters as long as the lower box's top horizontal leg.
    - In both boxes, the left side slants slightly down to the right, and the top and right side are a single stroke turning down at the top right corner.
    - In both boxes, the middle line across touches the left side and stops short of the right side, leaving a clear gap.
    - In both boxes, the bottom line across connects the bottom of the left side to the right side to close the box.
  strokes:
    - where: a line down the left side of the upper half, slanting slightly to the right
      part: the left rim of the sun
    - where: a line across the top of the upper half, turning down at the top right to run down the right side
      part: the top and right rim of the sun
    - where: a short line across the middle of the upper box, touching the left side and stopping short of the right side
      part: the bright band of light across the sun's centre
    - where: a short line across the bottom of the upper box, closing the frame from left to right
      part: the bottom rim of the sun
    - where: a line down the left side of the lower half, slanting slightly to the right
      part: the left corner of the open mouth
    - where: a wide line across the top of the lower half, turning down at the top right to run down the right side
      part: the upper lip and right corner of the open mouth
    - where: a line across the middle of the lower box, touching the left side and stopping short of the right side
      part: the tongue inside the speaking mouth
    - where: a line across the bottom of the lower box, closing the frame from left to right
      part: the lower lip of the open mouth

晉:
  checked: argon
  object: a platform of two horizontal bars raised on two triangular stilts above the sun
  history: >-
    An ideogrammic compound of 臸 (to arrive) above 日 (the sun), signifying advancing like the rising
    sun. In the modern form, the top part is contracted into an upper bar and a wide lower bar held
    apart by two triangular stilts.
  layout: >-
    The upper half holds the raised platform: a short horizontal bar at the top centre, two small
    triangular stilts sitting side by side beneath it, and a long wide base bar spanning almost the
    full width across the middle. Centred below the wide base bar in the lower half sits the
    rectangular sun, about as wide as the top bar. Pale warm wood tones tint the bars and stilts,
    and a soft pale yellow glow fills the sun.
  exact:
    - The top line across and the wide middle line across both stand completely free and do not touch any other stroke.
    - The top line across is about half as long as the wide middle line across.
    - Between the two horizontal lines sit two triangular stilt shapes side by side that do not touch each other; in each, an angled stroke sweeps down to the left and turns across to the right to touch the middle of a short stroke slanting down to the right.
    - The sun in the lower half sits centred below the wide middle line without touching it, and is about as wide as the top line.
    - In the sun, the top-and-right stroke starts at the top of the left vertical; the inner middle line touches the middle of the left vertical and stops short of the right side; the bottom line touches both vertical sides to close the frame.
  strokes:
    - where: a line across the top centre, about half as long as the wide line across the middle
      part: the upper plank of the platform
    - where: a stroke in the upper left that sweeps down to the left from just below the top line and turns sharply to run across, rising slightly to the right
      part: the angled frame of the left stilt
    - where: a short dot slanting down to the right at the right end of the left stilt
      part: the right strut of the left stilt
    - where: a stroke in the upper right that sweeps down to the left from just below the top line and turns sharply to run across, rising slightly to the right
      part: the angled frame of the right stilt
    - where: a short stroke slanting down to the right at the right end of the right stilt
      part: the right strut of the right stilt
    - where: a long wide line across the middle from far left to far right, rising slightly to the right
      part: the wide lower base of the platform
    - where: a straight line down the left side of the lower half
      part: the left rim of the sun
    - where: a line across the top of the lower half, turning down at the right to run down the right side
      part: the top and the right rim of the sun
    - where: a short line across the middle of the lower half, rising slightly to the right
      part: the band of light across the centre of the sun
    - where: a line across the bottom of the lower half, rising slightly to the right to close the frame
      part: the bottom rim of the sun

牵:
  checked: argon
  dropped: The character is a phono-semantic compound whose simplified form 牵 replaced part of the phonetic 玄 with 大, so picturing a person pulling an ox would teach a folk etymology.

轰:
  checked: argon
  object: an old two-wheeled cart seen from straight above at the top, with two hands side by side below it standing for a pair
  history: >-
    The traditional form 轟 drew three carts rumbling together to depict a thunderous rumble. The
    simplified form 轰 keeps one cart 车 at the top and replaces the bottom pair of carts with 双, two
    hands side by side meaning a pair.
  layout: >-
    The upper half holds a wooden two-wheeled cart seen from straight above, its axle running from
    top to bottom and its wheels seen edge on at the top and bottom of the cart. The lower half
    holds two pale hands side by side, the left hand slightly narrower with tucked fingers and the
    right hand wider with its fingers and thumb reaching out to the bottom right. Warm pale wood
    tones colour the cart and soft pale skin tones colour the two hands.
  exact:
    - In the upper cart, the top line across is clearly shorter than the lower line across, a little over half as long.
    - The upper cart's second stroke starts at the very top above the first line, slants down to the left across the first line, and turns sharply to run across to the right.
    - The upper cart's vertical line starts below the top line across without touching it, crosses the middle horizontal leg and the long lower line across, and ends in a plain point with no hook.
    - The upper cart and the two hands below do not touch each other.
    - In the lower half, each hand is made of a stroke running across and turning down to the left, crossed by a stroke slanting down to the right.
    - The left hand's crossing stroke is short and stops before the right hand, while the right hand's crossing stroke sweeps long and out to the bottom right; the two hands do not touch.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the cart's near wheel, seen edge on from above
    - where: a stroke from the top centre slanting down to the left across the top line, then turning sharply to run right across the upper middle
      part: the side and front of the cart's box
    - where: a long line across the middle of the character
      part: the cart's far wheel, seen edge on from above
    - where: a straight vertical line down the upper centre, from below the top line to just below the long middle line
      part: the cart's axle and shaft
    - where: a stroke across the lower left half, rising slightly to the right and turning sharply down to sweep to the bottom left
      part: the left hand's back and wrist
    - where: a short stroke in the lower left half, slanting down to the right across the left hand's sweep
      part: the left hand's fingers
    - where: a stroke across the lower right half, rising slightly to the right and turning sharply down to sweep to the bottom centre
      part: the right hand's back and wrist
    - where: a long stroke in the lower right half, slanting down to the right across the right hand's sweep and turning out to the bottom right
      part: the right hand's fingers, ending in the thumb

锦:
  checked: argon
  dropped: The origin gives only a phono-semantic compound reading with 金 as pure sound and 帛 as meaning, so drawing an ideographic scene would teach a false etymology.

寸:
  checked: argon
  object: an upright hand and forearm with a short mark on the inner wrist showing where the pulse is felt
  history: >-
    The oldest forms drew a right hand and forearm in profile, like 又, with a short stroke added
    just below the wrist to mark the spot where the pulse is felt, one inch from the wrist crease,
    or lower on the arm for the elbow. In the modern form the hand and forearm straighten into a
    cross-shaped frame with a bottom hook, and the indicator becomes a short dot on the left.
  layout: >-
    A pale hand and forearm stand upright in the centre of the frame, palm facing the viewer's left.
    The fingers rise to the top of the vertical stroke, the spread thumb and palm span the upper
    line across, and the forearm runs down the vertical stem to the bottom hook. In the hollow below
    the line across and to the left of the forearm stem, the short dot marks the pulse point on the
    inner wrist, highlighted with a soft pale blush behind the stroke.
  exact:
    - The line across sits above the middle and rises slightly from left to right.
    - The long vertical line starts at the top centre, crosses the line across near the middle of both strokes, and ends at the bottom in a clear hook up to the left.
    - The short dot slants down to the right below the left half of the line across and to the left of the vertical line, standing completely free without touching either stroke.
  strokes:
    - where: a long line across the upper middle, rising slightly to the right
      part: the spread thumb and wrist line of the hand
    - where: a long line from the top centre straight down through the middle, ending at the bottom in a hook up to the left
      part: the upright hand and forearm, with the bottom hook as the base of the arm
    - where: a short dot in the middle left, slanting down to the right below the line across and to the left of the vertical line
      part: the mark on the inner wrist showing where the pulse is felt

