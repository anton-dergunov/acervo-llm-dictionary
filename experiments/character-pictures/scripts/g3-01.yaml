釘:
  checked: argon
  object: two blocks of metal in a peaked frame on the left for metal, beside a large metal nail with a flat head and long shaft on the right
  history: >-
    丁 originally drew a nail or peg; when 丁 came to be used for other meanings, the metal component
    金—formed from a peaked top over a central frame with two blocks of metal on either side—was
    added on the left to show a metal nail. In the modern character, the nail on the right shows its
    flat head across the top and its long shaft running down.
  layout: >-
    The left half holds the metal component, starting high near the top of the box, with its sloped
    peaked cover at the top, two horizontal bands, central vertical stem, two small blocks of metal
    flanking the stem, and rising bottom base. The right half holds a large, sturdy metal nail seen
    from the side, starting lower than the left component's top and reaching lower at the bottom,
    with a wide flat head across the top and a thick shaft running down to a hooked point. Both
    sides are shaded in pale grey-blue and soft bronze tones behind the strokes.
  exact:
    - The left component (the metal frame) and the right component (the nail) do not touch; the left component sits higher at the top, while the nail reaches lower at the bottom.
    - At the top of the left half, the short right-slanting stroke starts near the top of the long left sweep, not below it.
    - The upper horizontal band on the left does not touch the long left sweep; there is a small gap between them.
    - The lower horizontal band on the left is slightly longer than the upper band, and the vertical line down the middle starts at the middle of the upper band, crosses the lower band, and ends on the middle of the rising bottom stroke.
    - The two small strokes below the lower band on the left (a dot on the left slanting down to the right, and a short sweep on the right slanting down to the left) stand completely free and touch no other strokes.
    - On the right, the top horizontal line is the longest horizontal stroke in the character, about twice as long as the bands on the left.
    - The long vertical shaft on the right starts at the middle of the top horizontal line, is more than twice as long as the left vertical line, and ends at the bottom in a sharp hook up and to the left.
  strokes:
    - where: a long sweep in the left half from near the top down and out to the middle left
      part: the left slope of the peaked top cover
    - where: a short stroke in the upper left half, starting near the top of the left sweep and slanting down to the right
      part: the right slope of the peaked top cover
    - where: a short line across the upper middle of the left half, rising slightly to the right
      part: the upper band of the metal frame
    - where: a line across the middle of the left half below the upper band, a little longer and rising slightly to the right
      part: the lower band of the metal frame
    - where: a straight vertical line down the middle of the left half, from the upper band through the lower band to the bottom rim
      part: the central vertical stem of the metal frame
    - where: a small dot in the lower left, below the lower band, slanting down to the right
      part: the left block of metal
    - where: a short sweep in the lower right of the left half, below the lower band, slanting down to the left
      part: the right block of metal
    - where: a rising stroke across the bottom of the left half, running from the bottom left up to the right
      part: the rising bottom base of the metal frame
    - where: a long line across the upper part of the right half
      part: the flat head of the nail
    - where: a long vertical line down the middle of the right half from the middle of the top line, ending at the bottom in a hook up to the left
      part: the shaft of the nail, with its bent point at the bottom

