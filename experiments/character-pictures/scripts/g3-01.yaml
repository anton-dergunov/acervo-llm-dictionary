竊:
  checked: argon
  dropped: The character is a phono-semantic compound whose right-hand component 禼 is purely phonetic, so depicting it as termites taking grain to a nest would teach a false etymology.

曰:
  checked: argon
  object: a wide-open mouth seen from the front, with a wisp of breath and speech coming out from inside it
  history: >-
    The oldest forms drew an open mouth with a short horizontal mark at or just above the opening to
    show breath and words coming out. In the modern form, the wide mouth frame encloses that inner
    stroke, which sits attached to the left side and stops short of the right.
  layout: >-
    One wide, squat open mouth fills the middle of the square, wider than it is tall and tapering
    slightly toward the bottom. Soft pale pink lips follow the outer frame, with a pale warm
    interior and a soft pale blue wisp of breath curling around the inner horizontal stroke as sound
    leaves the mouth.
  exact:
    - The outer frame is wider than it is tall and tapers slightly inward toward the bottom, unlike the tall narrow frame of 日.
    - The inner line across is clearly shorter than the top edge, a little over half as long; it touches the middle of the left side and stops near the centre, well short of the right side.
    - The top and right side are one stroke, running across from the top of the left side, turning down at the top right, and slanting slightly inward to the bottom right.
    - The bottom line across is about two thirds as long as the top edge, joining the bottom of the left side to the bottom of the right side.
  strokes:
    - where: a line down the left side, slanting slightly inward toward the bottom
      part: the left corner and left side of the open lips
    - where: a long line across the top, turning sharply down at the top right to run down the right side
      part: the upper lip, curving down into the right side of the open mouth
    - where: a line across the middle inside the frame, clearly shorter than the top edge and a little over half as long, from the middle of the left side to the centre
      part: the stream of breath and speech issuing from inside the mouth
    - where: a line across the bottom, about two thirds as long as the top edge, rising slightly from the bottom left to meet the bottom of the right side
      part: the lower lip closing the bottom of the mouth

