    - where: a sweep from near the top left-centre down and out to the middle left
      part: the servant's tilting shoulders and leaning back
    - where: a straight line from the middle of the first sweep down to the bottom left
      part: the servant's standing body and legs
    - where: a long line in the middle-left from the upper part down, curving gently out toward the bottom left
      part: the left side of the wooden bucket
    - where: a line from the top of the bucket's left side across to the right, turning sharply down to run along the right side and ending at the bottom right in a hook to the left
      part: the bucket's top rim and right side, hooked at the base
    - where: a short line across the upper middle of the bucket, rising slightly to the right
      part: the upper wooden hoop binding the staves
    - where: a short line across the lower middle of the bucket, parallel to the upper hoop and rising slightly to the right
      part: the lower wooden hoop binding the staves
    - where: a long straight line from the top rim down the middle of the bucket, crossing both hoops
      part: the central wooden stave running down the front of the bucket
