    - where: a short line on the upper left, running down and slightly to the left
      part: the left eave of the roof, hanging down
    - where: a wide line across the upper part from the left eave to the right, ending in a hook down to the left
      part: the main roof beam and its right eave hooking inward
    - where: a short dot in the upper centre just under the roof beam, slanting down to the right
      part: the top knob at the tip of the governing tool's head
    - where: a line across the upper middle, rising slightly to the right, a little over half as long as the widest line
