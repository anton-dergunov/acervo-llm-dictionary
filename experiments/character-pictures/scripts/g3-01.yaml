    right dot.
  exact:
    - The line across the upper middle rises slightly to the right and crosses the upper part of the long diagonal stroke.
    - The long diagonal stroke curves from the top left down to the bottom right and ends in a sharp upward hook.
    - The lower sweep starts near the centre below the right end of the line across, crosses the lower middle of the long diagonal stroke, and runs out to the bottom left without touching the line across.
    - The short dot at the top right slants down to the right, is about a third as long as the main diagonal's downward run, and stands completely free of every other stroke.
  strokes:
