弔:
  checked: argon
  object: an upright person bound down the centre with the cord of a corded arrow winding back and forth around the body
  history: >-
    In oracle bone script, the character drew a standing person with the line of a corded arrow
    wound around the body, an ideogram for binding or tying. In the modern form, the upright body
    became the central vertical stroke and the winding cord became the bow shape wrapping across it.
  layout: >-
    A tall slender person stands upright in the centre along the long vertical stroke, with the head
    just above the top line and the feet at the bottom of the vertical. The person faces forward
    with a calm face showing eyes, a nose and a mouth, and wears simple pale clothes. The bow-shaped
    strokes form a thick pale-tan cord that winds back and forth across the shoulders, chest and
    waist, with its loose hooked end hanging down on the right.
  exact:
    - The top line runs across and turns down on the right to touch the right end of the second line across.
    - The second line across is about three quarters as long as the top line, and its left end touches the top of the third stroke.
    - The third stroke goes briefly down on the left, turns wide across to the right, and turns down on the right to end in a hook to the left.
    - The long straight vertical down the centre starts at the middle of the top line, crosses the middle of both lower horizontal lines, and reaches well below the rest of the character to end in a plain point with no hook.
  strokes:
    - where: a line across the top, turning down at the right
      part: the upper turn of the cord passing across the shoulders and bending down on the right
    - where: a shorter line across the upper middle, rising slightly from left to right to meet the first stroke's end
      part: the middle turn of the cord wrapping across the chest
    - where: a stroke going briefly down on the left from the second stroke's start, turning wide across to the right below the middle, then turning down on the right and ending in a hook to the left
      part: the lower loop of the cord passing down the left side, across the waist, and hanging down on the right with a hooked end
    - where: a long straight line down the centre, from the middle of the top stroke to the bottom
      part: the upright body of the standing person, from the shoulders down to the feet

