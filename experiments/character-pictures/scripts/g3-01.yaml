壺:
  checked: argon
  object: a lidded wine jar seen from the front, with a knobbed lid on top, a wide overhanging shoulder, a stepped body, and a flat base
  history: >-
    The oldest forms drew a tall wine jar with a fitted cover on top, loop handles at the shoulders,
    and a rounded belly on a flat foot. In the modern form, the lid at the top looks like the
    character for a scholar, the shoulders form a wide hooked rim, and the belly and foot form a
    symmetrical stepped frame.
  layout: >-
    One tall ceramic or bronze wine jar fills the frame from top to bottom, seen from the front. The
    top strokes form the jar's fitted lid and central knob, sitting just above the wide hooked
    shoulder rim. Beneath the shoulder, the two stepped sides trace the patterned neck, belly and
    foot of the vessel down to the broad flat base at the bottom. The jar is filled with pale
    terracotta and soft celadon tones behind the strokes.
  exact:
    - At the top, the vertical stroke crosses the upper line across at its middle and stops on the middle of the lower line across without crossing it.
    - In the lid at the top, the lower line across is about three quarters as long as the upper line across, and both are clearly narrower than the wide shoulder below.
    - The lid at the top does not touch the wide shoulder stroke below it.
    - On the middle left, a short stroke slants down to the left, and the very long shoulder stroke starts at its middle, runs all the way across to the right, and ends in a sharp hook down to the left.
    - Beneath the shoulder stroke, two vertical segments hang down near the middle with a clear gap between them, and the left and right stepped sides never touch each other.
    - On the left side of the belly, the short upper vertical ends on the middle of a short rising line across; from the left end of that line, a stroke runs down, turns across to the right, and turns down again to touch the bottom base line.
    - On the right side of the belly, a stroke drops from the shoulder, turns across to the right, and turns down to meet the right end of a short lower line across; from the left end of that short line, a vertical drops to touch the bottom base line.
    - The bottom base line is very long, about as wide as the shoulder stroke above, and supports both lower verticals near its middle.
  strokes:
    - where: a line across near the top, rising slightly to the right
      part: the top flange of the jar's lid
    - where: a vertical line down through the middle of the top line across, stopping on the line below it
      part: the central knob and stem of the lid
    - where: a shorter line across below the top line, about three quarters as long
      part: the lower rim of the lid
    - where: a short stroke on the middle left, slanting down to the left
      part: the left edge of the jar's overhanging shoulder
    - where: a very long line across from the middle of the left shoulder stroke to the far right, ending in a hook down to the left
      part: the broad shoulder rim of the jar, hooking down on the right
    - where: a short vertical line hanging down from the left-of-centre of the shoulder stroke
      part: the upper left side of the jar's neck
    - where: a short line across below the left neck vertical, rising slightly to the right
      part: the upper ledge on the left side of the jar's belly
    - where: a stroke starting at the left end of the left ledge, running down, turning across to the right, and turning down to the bottom line
      part: the stepped left wall of the jar's belly and foot
    - where: a stroke hanging from the right-of-centre of the shoulder stroke, running down, turning across to the right, and turning down at its right end
      part: the upper right side of the jar's neck, turning out into the right belly wall
    - where: a short line across on the lower right, meeting the bottom end of the right belly stroke
      part: the lower ledge on the right side of the jar's belly
    - where: a short vertical line from the left end of the right ledge down to the bottom line
      part: the lower right wall of the jar's foot
    - where: a very long line across the bottom from left to right, about as wide as the shoulder
      part: the broad flat base of the jar

