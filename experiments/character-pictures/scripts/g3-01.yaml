    house of government. In oracle bone script the lower part resembled an upright chisel or
    standard (䇂), which became 辛 in the modern character.
  layout: >-
    A broad tiled house roof arches across the top third of the frame, with a top finial, a hanging
    left eave, and a right eave hooking inward. Directly beneath the roof stands a tall, symmetrical
    governing standard and chisel-like tool of office filling the middle and lower parts, with a
