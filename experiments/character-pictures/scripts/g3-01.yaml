    - The long middle line across is the widest stroke; the roof beam is nearly as wide, the lower crossbar is about three quarters as long, and the upper crossbar is clearly shorter, a little over half as long as the middle line.
    - The central vertical line starts at the middle of the long middle line across, crosses the middle of the lower crossbar, and ends at the bottom in a plain point with no hook.
  strokes:
