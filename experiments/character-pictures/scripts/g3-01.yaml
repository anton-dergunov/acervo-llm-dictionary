郭:
  checked: argon
  object: a tall tiered watchtower on the left standing beside a curved outer city wall and gate post on the right
  history: >-
    Oracle bone forms drew tall watchtowers rising at opposite sides of a walled city enclosure.
    Later, the city sign 邑 (now 阝) was added on the right and the tower on the left became written
    like 享, forming an ideogrammic compound for the outer walls and towers of a city.
  layout: >-
    The left half is a tall tiered watchtower with a pointed roof, an upper window chamber, lower
    eaves and a timber base. The right half is the outer city rampart: a tall straight wall post
    reaching near the bottom of the frame, with a double-curved bastion wall bulging out to the
    right. Pale stone and timber textures in soft grey, ochre and terracotta fill the tower and
    rampart behind the strokes.
  exact:
    - The left part (the watchtower) and the right part (the city wall) do not touch each other.
    - At the top of the left part, the short dot and the upper line across below it stand free and do not touch any stroke.
    - Below the upper line across is a small closed rectangular chamber made of a short left side, a top-and-right corner stroke, and a short bottom sill.
    - Below the chamber, a line runs across and hooks sharply down to the left to meet the top of a curved vertical post, which ends in a hook up to the left.
    - The lower cross-stroke of the left part is a rising stroke slanting up from the bottom left to the right, crossing the middle of the curved vertical post.
    - On the right, the double-curved ear stroke starts at the top of the long straight vertical line, turns down to the left, then curves out and down to the right and ends in a hook to the left.
    - The right vertical line is straight and ends in a plain point at the bottom with no hook, reaching lower than the tower on the left.
  strokes:
    - where: a short dot at the top of the left half, slanting down to the right
      part: the finial knob on top of the watchtower's roof
    - where: a line across below the top dot on the left, rising slightly to the right
      part: the watchtower's upper roof eaves
    - where: a short stroke in the upper middle of the left half, slanting down to the right
      part: the left wall of the upper lookout chamber
    - where: a line across from the top of that short stroke, turning down to the left at the right side
      part: the lintel and right wall of the upper lookout chamber
    - where: a short line across closing the bottom of the upper chamber
      part: the floor sill of the upper lookout chamber
    - where: a line across below the chamber in the left half, ending in a sharp hook down to the left
      part: the lower eaves and bracket under the lookout chamber
    - where: a curved line down from the hook of the lower eaves, bowing slightly right and ending in a hook up to the left
      part: the central timber pillar of the tower's base, the hook its foot
    - where: a long rising stroke in the lower left half, slanting up from bottom left to the right across the central pillar
      part: the wide crossbeam of the tower's lower terrace
    - where: a stroke in the right half running across from the top of the right vertical, turning sharply down to the left, then curving out and down to the right to end in a hook to the left
      part: the double-curved outer bastion of the city wall
    - where: a long straight line down the left side of the right half, from the top of the bastion to the bottom
      part: the tall inner wall post of the outer city rampart

辟:
  checked: argon
  object: a kneeling person bending forward on the left above a square wooden restraint block, beside a tall upright chisel-like law tool on the right
  history: >-
    Oracle bone forms drew a kneeling person beside a sickle-like or chisel-like tool used for
    punishment and regulation, together with a small round restraint mark. In later scripts the
    kneeling figure became the corpse-like body frame on the left, the round mark became the small
    mouth-like square below it, and the tool became the upright seven-stroke component on the right.
  layout: >-
    The left half holds the kneeling person in profile facing right, occupying the upper and middle
    left, with a small head showing a face (eyes, nose, mouth) above the bent shoulders and simple
    pale clothes drapes sweeping down to the bottom left. Tucked beneath the bent torso inside the
    sweep of the robe sits a small square wooden restraint block in pale warm brown. The right half
    is filled from top to bottom by the tall upright law tool with a broad two-pronged head above
    and a long straight shaft below, shaded in pale grey and soft ochre. The left and right halves
    stand close together without touching.
  exact:
    - The left half and the right half do not touch each other.
    - At the top of the left half, the first stroke runs across and turns down, starting at the top of the long left sweep and ending on the lower horizontal bar to form a closed upper box.
    - The long sweep on the far left starts at the top left corner of the upper box and curves down to the bottom left.
    - Beneath the upper box on the left, the small square enclosure touches the middle of the long left sweep at its top left corner, and its bottom bar closes the square between the left vertical and the right vertical turn.
    - The right component is much taller than the left component, reaching higher at the top and lower at the bottom.
    - At the top of the right half, the short slanted dot and the upper horizontal line below it both stand free of every other stroke.
    - Between the upper horizontal line and the wide middle horizontal line on the right, the left dot stands free while the right downward-left stroke touches the wide middle line at its bottom end.
    - The wide middle horizontal line on the right is the longest horizontal stroke; the upper horizontal line is about three quarters as long, and the lower horizontal line is almost as long as the middle one.
    - The long vertical shaft on the right starts at the middle of the wide middle horizontal line, crosses the lower horizontal line, and ends in a plain point at the bottom with no hook.
  strokes:
    - where: a line across the top of the left half, rising slightly to the right and turning down
      part: the bent back and shoulder edge of the kneeling person's torso
    - where: a short line across the upper middle of the left half, rising slightly to the right
      part: the underside of the kneeling person's bent torso
    - where: a long stroke from the top left down and sweeping out to the bottom left
      part: the kneeling person's back and trailing robe
    - where: a short vertical line down the lower middle of the left half, starting on the long sweep
      part: the left side of the square wooden restraint block
    - where: a line across the lower middle of the left half, turning down on the right
      part: the top and right side of the square wooden restraint block
    - where: a short line across the bottom of the left enclosure, closing the square
      part: the bottom bar of the square wooden restraint block
    - where: a short stroke at the top of the right half, slanting down to the right
      part: the top finial cap of the upright tool
    - where: a line across the upper part of the right half, rising slightly to the right, about three quarters as long as the wide middle line
      part: the upper crossbar of the tool's blade head
    - where: a short dot below the left side of the upper crossbar on the right, slanting down to the right
      part: the left inner prong of the tool head
    - where: a short stroke below the right side of the upper crossbar on the right, slanting down to the left to touch the wide middle line
      part: the right inner prong of the tool head
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the wide main guard plate of the tool
    - where: a long line across the lower part of the right half, rising slightly to the right, almost as long as the wide middle line
      part: the lower crossbar across the tool's shaft
    - where: a long straight vertical line from the middle of the wide guard plate down to the bottom of the right half, with no hook
      part: the long upright shaft of the tool

