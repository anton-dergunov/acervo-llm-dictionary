# Full run, group g1, batch 05. Written from the fact sheets, following scripts/GUIDE.md.

功:
  object: a craftsman's tool on the left and a strong flexed arm on the right, the good work that strength and tool produce
  history: >-
    An ideogram: the worker's tool 工 together with strong labour 力; the tool also gives the sound.
  layout: >-
    The tool fills the left, a small carpenter's square lying on a pale plank, lower and smaller than
    the arm. The arm fills the right and is taller, a bare flexed arm with a round muscle, a hand
    clenched at its lower end. Pale wood and skin colours, nothing dark.
  exact:
    - The left tool is small, in the middle of the left half; the arm is much taller and reaches nearly the full height.
    - The tool's upright touches the top bar and the bottom bar in the middle of each.
    - The tool's top bar is shorter than its bottom bar, about three quarters as long; the bottom bar rises a little to the right.
    - The arm's first stroke starts in the tool's right side, runs across, turns down and ends in a small hook up to the left.
    - The long sweep of the arm starts high above, crosses the first stroke near its start and runs down to the bottom left.
  strokes:
    - where: a short line across the upper part of the left half, rising a little to the right
      part: the top of the tool, the upper edge of the square
    - where: a short line down from the middle of the top line to the middle of the bottom line, slanting a little to the right
      part: the upright of the tool, joining its two edges
    - where: a line across the lower part of the left half, longer than the top line (the top line is about three quarters as long), rising to the right
      part: the tool's long base
    - where: a line across the middle of the right half from its left edge, turning down at the right and ending in a small hook up to the left
      part: the upper arm and the bend of the elbow, the hook the clenched fist
    - where: a long sweep from the top of the right half down to the bottom left, crossing the line across near its left end
      part: the forearm, running down toward the hand

兰:
  object: an orchid in bloom, two petals above and three long arching leaves below
  history: >-
    A pictograph of an orchid in bloom; the modern form is a simplified shape of the flower over its
    leaves.
  layout: >-
    A single orchid fills the square. The two small marks at the top are the bloom's petals, pale
    violet, the left one small and the right one longer. Under them three long leaves lie one above the
    other, soft green, the lowest the longest. A slim pale stem is hidden behind the strokes.
  exact:
    - The two petals at the top do not touch the top leaf; a small gap lies below each.
    - The right petal is clearly longer than the left, about two thirds longer, and ends turning down to the left.
    - The three leaves do not touch each other.
    - The top leaf is longer than the middle one, a little over three fifths as long as the bottom leaf, and the middle leaf about half as long as the bottom leaf.
    - The bottom leaf is the longest, nearly the whole width of the frame.
  strokes:
    - where: a short stroke at the top, slanting down to the right
      part: the bloom's left petal
    - where: a stroke at the top right of the first, slanting down to the right then turning down to the left
      part: the bloom's right petal, bending as it opens
    - where: a line across the upper part, a little shorter than the bottom line, nearly level
      part: the upper leaf of the orchid
    - where: a short line across the middle, shorter than the other two lines
      part: the middle leaf
    - where: a long line across the bottom, the full width
      part: the lowest leaf, the longest

申:
  object: a bolt of lightning striking straight down through a pale box-shaped flash of light
  history: >-
    The oldest forms drew a forked bolt of lightning crossing the sky; later forms straightened the
    bolt into the single stroke running through a box.
  layout: >-
    The bolt is a pale yellow straight shaft of light running from the top edge of the picture
    to the bottom edge. Around its middle a soft rounded box of bright white and pale yellow light
    glows, as if the sky were lit by the flash. The sky behind is pale blue-grey.
  exact:
    - The vertical stroke is long, about nine tenths of the height, straight, with a plain point at the bottom and no hook.
    - The vertical crosses the top of the box, the middle bar and the bottom bar of the box.
    - The box is small compared with the vertical; it sits in the middle, wider than it is tall.
    - The middle bar is short, less than a third of the box's top, and lies free, touching neither side of the box but crossed by the vertical.
    - The bottom bar rises a little to the right, meets the left side at its start and ends touching the right side.
    - The middle bar and the bottom bar are both short; the bottom bar is a little over a third as long as the box's top, a little longer than the middle bar.
    - The left side starts at the top left corner of the box where the top line begins.
  strokes:
    - where: a short line down the left side of the box, slanting a little to the right
      part: the left edge of the flash of light
    - where: a line across the top of the box, turning down at the right and running down the right side
      part: the top and right edge of the flash
    - where: a short line across the middle of the box, about a third as long as the box's top, crossing the vertical
      part: the bright band at the heart of the flash
    - where: a line across the lower part of the box, rising a little to the right, a little over a third as long as the box's top
      part: the bottom edge of the flash
    - where: a long straight line down the middle, from near the top to near the bottom, crossing the box
      part: the lightning bolt itself, running straight down

令:
  object: a master standing above and a person kneeling before him to receive his command
  history: >-
    An ideogram: a person kneeling before a master, taking an order.
  layout: >-
    The master fills the upper half, standing, facing the viewer, in a long pale robe, with a stern face
    with eyes, a nose and a mouth, his arms spread in a gesture of command. Below him a person kneels
    on the lower left, facing right, small, in simple pale clothes, with a face looking up toward the
    master. The ground is a pale strip below.
  exact:
    - The master's two strokes meet at the top; the right one starts at the top of the left one.
    - The kneeling person's head, a short slanting dot, lies free of every stroke.
    - The kneeling person's long stroke runs across and then turns down to the left; it does not touch the head.
    - The last short stroke slants down to the right and touches the end of the kneeling person's long stroke.
    - The master's body stroke is longer than his right arm stroke.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left of the upper half
      part: the master's body, running down into his left leg and sleeve
    - where: a sweep from the top of the first stroke down to the right and turning across to the right
      part: the master's right arm, held out in command
    - where: a short slanting dot in the middle of the picture, below the master's body, down to the right
      part: the kneeling person's head, bowed
    - where: a line from the lower left going across and turning down to the left at the right end, below the dot
      part: the kneeling person's back and bent knees
    - where: a short stroke at the bottom centre, slanting down to the right, meeting the end of the previous stroke
      part: the kneeling person's folded lower leg

卡:
  object: a flat card held edge-on between a marker above it and a marker below it
  history: >-
    A modern ideograph: a card pressed between the characters for above and below.
  layout: >-
    A long flat pale card lies edge-on across the middle, seen as a thin slab. Above it stands a small
    pale pin with a little flag to the right, pointing down at the card. Below it a longer pale pin
    stands with a small flag on its right, pointing up at the card from beneath. Both pins are
    pale grey and the card is cream.
  exact:
    - The upper stem runs down and ends on the long line across, touching it.
    - The small flag on the upper stem rises slightly to the right and starts from the middle of the stem.
    - The lower stem starts at the long line, almost where the upper stem ends, with only a hairline gap between them.
    - The lower stem is longer than the upper one, about one and a half times as long.
    - The lower flag slants down to the right and does not touch the lower stem; a small gap lies between them.
    - The long line across is the widest stroke, nearly the full width.
  strokes:
    - where: a short line down from near the top, slightly slanting to the right, ending on the long line
      part: the stem of the upper pin
    - where: a short line from the middle of the upper stem out to the right, rising a little
      part: the upper pin's small flag
    - where: a long line across the middle, rising slightly to the right, nearly the full width
      part: the card, edge-on
    - where: a straight line down from the long line to the bottom, about one and a half times as long as the upper stem
      part: the stem of the lower pin
    - where: a short stroke to the right of the lower stem, slanting down to the right, free of the stem
      part: the lower pin's small flag

印:
  object: a hand on the left pressing a stamp seal down on the right
  history: >-
    The oldest forms drew a hand pushing down on a kneeling figure, the seal; the seal later shrank to
    the two strokes at the right.
  layout: >-
    The hand fills the left half, a bare right hand seen from the side, reaching right with its
    fingers pressing down. The stamp stands on the right half, a pale brown seal with a flat head and a
    straight handle, pressed onto a pale sheet below. Soft skin and wood colours.
  exact:
    - The first short stroke ends where the long curved stroke begins.
    - The short bar on the left is short, less than a third as long as the seal's line across the top.
    - The short bar on the left starts on the middle of the long curved stroke and rises a little to the right.
    - The seal's first stroke starts at the top of its handle.
    - The seal's handle is the longest stroke, about as long as the hand's long curved stroke, a little longer.
    - The seal's first stroke turns down at its right end and ends in a small hook to the left.
    - The hand and the seal do not touch each other.
  strokes:
    - where: a short stroke at the top of the left half, slanting down to the left
      part: the hand's raised finger
    - where: a long stroke from the left going down, curving along the bottom and turning up to the right
      part: the hand's palm and thumb, curving under the seal
    - where: a short line across the middle of the left half, rising a little to the right, starting on the long stroke, less than a third as long as the seal's line across the top
      part: the hand's middle finger pressing across
    - where: a line across the top of the right half, turning down at its right end into a small hook to the left
      part: the head of the seal and its right shoulder
    - where: a long straight line down the right half from the top left of the head to the bottom
      part: the seal's handle and stem

兄:
  object: an older brother standing tall, his head an open mouth speaking to his younger siblings
  history: >-
    The oldest forms drew a person with an exaggerated large mouth: the elder one who speaks, who
    gives the instructions.
  layout: >-
    A tall boy fills the frame. His head is a wide face on top, with eyes, a nose and a big open
    mouth speaking. Below him his body and two legs stand apart, in simple pale clothes. The left leg
    is shorter and the right leg is long and ends in a foot turned up.
  exact:
    - The head's left side and top meet at the top left.
    - The head's bottom line is short and rises slightly to the right; it touches the left side of the head and the end of the top line.
    - The head's bottom line is about half as long as its top line.
    - The two legs do not touch the head except for the right leg, whose start touches the bottom line of the head.
    - The left leg is a plain sweep down to the left and is shorter than the right, about half as long.
    - The right leg is the longest stroke, going down, turning across to the right, then turning up at its end.
  strokes:
    - where: a short line down the left side of the head
      part: the left cheek and corner of the mouth
    - where: a line across the top of the head, turning at its right end to sweep down to the left
      part: the top of the head and right cheek
    - where: a short line across the bottom of the head, about half as long as the top line, rising a little to the right
      part: the chin and the lower lip
    - where: a sweep from below the head's left side down to the bottom left
      part: the brother's left leg
    - where: a long stroke from below the head's centre going down, then turning across to the right and rising at its end
      part: the brother's right leg, ending in a raised foot

弁:
  object: a pointed cap being put on a person's head by two hands from below
  history: >-
    The oldest forms drew two hands lifting a cap onto a head; the cap is the small angular shape at
    the top and the hands are the strokes below.
  layout: >-
    A person's friendly face with eyes, a nose and a mouth fills the middle of the picture, simple pale
    collar below. A soft cone-shaped cap sits on top of the head, and two bare hands come up from the
    lower left and the lower right and hold it at its edge. Pale blue cap, pale skin.
  exact:
    - The cap's first stroke goes down to the left, then turns across and rises slightly to the right; the small dot touches its end.
    - The left hand's sweep and the right hand's vertical do not touch the cap, a small gap lies between them.
    - The long line across crosses both the left hand and the right hand.
    - The left hand turns to sweep down to the left, the right hand is a straight vertical with no hook.
    - The line across is long, nearly the full width of the frame.
  strokes:
    - where: a stroke at the top, starting from the upper centre, sweeping down to the left and then turning across to the right, rising a little
      part: the cap's left edge and its brim
    - where: a short stroke at the top right, slanting down to the right, touching the end of the first stroke
      part: the cap's tip, bending to the right
    - where: a long line across the lower half, nearly the full width
      part: the wrists and forearms of the two hands, held out wide
    - where: a stroke down from above the line across on the left, turning to sweep down to the left
      part: the left hand, lifting the cap
    - where: a straight line down on the right, from above the line across to near the bottom
      part: the right hand, holding the cap, straight

左:
  object: a left hand on the left holding a craftsman's tool below it
  history: >-
    The oldest forms drew a left hand with its fingers spread; later forms added the worker's tool
    beneath it.
  layout: >-
    A bare left hand fills the upper left, seen from the back, its thumb and forearm sweeping down
    to the left. Beneath it a small craftsman's square rests on a pale plank, the hand's helper.
    Skin pale, wood pale brown.
  exact:
    - The line across the top of the hand and the long sweep cross each other near the middle of both.
    - The long sweep is the longest stroke and runs down to the bottom left.
    - The tool's top bar leaves a small gap from the long sweep.
    - The tool's top bar is clearly shorter than the hand's line across, about two thirds as long.
    - The tool's upright is short and joins the top bar and the base in the middle of each.
    - The tool's base lies below the tool and is the longest line in the tool, about twice its top bar.
  strokes:
    - where: a line across the upper part, rising a little to the right
      part: the back of the hand, with the fingers
    - where: a long stroke from the top centre down, turning to sweep down to the bottom left, crossing the line across
      part: the thumb and forearm, reaching down
    - where: a line across the middle, shorter than the first, rising a little to the right, free of the sweep
      part: the top of the tool
    - where: a short line down from the middle of the top bar to the base
      part: the upright of the tool
    - where: a line across the bottom, longer than the top bar
      part: the base of the tool

占:
  object: a cracked turtle-shell with an omen crack above and a mouth below speaking the omen
  history: >-
    The oldest forms drew a crack in heated bone, the omen, and the mouth telling what it meant.
  layout: >-
    A pale turtle-shell or bone with a single crack runs down the upper half, with a smaller branch
    of the crack to the right. Below it a wide open mouth speaks, seen from the front, lips pale
    pink. A faint face with eyes and a nose sits behind it.
  exact:
    - The long crack runs down and ends on the mouth's top lip, touching it in the middle.
    - The crack's branch starts at the middle of the crack and rises a little to the right.
    - The mouth's left side, top lip and bottom lip all meet at the left corner.
    - The mouth's left side and top lip start at the same place on the left.
    - The bottom lip is clearly shorter than the top lip, a little over half as long, and rises slightly to the right.
    - The top lip turns down at its right end, sweeping down to the left.
  strokes:
    - where: a long line down from the top, slanting a little to the right, ending on the mouth
      part: the main crack in the shell
    - where: a short line from the middle of the crack out to the right, rising a little
      part: the crack's side branch
    - where: a short line down the left side of the mouth
      part: the left corner and side of the lips
    - where: a line across the top of the mouth from the left, turning down at the right end and sweeping down to the left
      part: the upper lip, curving down into the right corner
    - where: a line across the bottom of the mouth, a little over half as long as the top lip, rising a little to the right
      part: the lower lip

玉:
  object: a necklace string hung with three pieces of jade
  history: >-
    The oldest forms drew three pieces of jade on a string. The modern form adds a dot to tell it
    from the king 王.
  layout: >-
    A fine pale cord hangs straight down the middle. Three smooth pale green jade bars are
    threaded on it, one high, one in the middle and the widest at the bottom. A tiny round jade bead
    hangs near the lower right, apart from the rest. Soft green, white and cream.
  exact:
    - The top bar and the middle bar are about the same length; the bottom bar is clearly longer, nearly twice the top bar.
    - The cord starts on the top bar, crosses the middle bar and ends on the middle of the bottom bar.
    - The cord is a straight vertical, with a plain point at the end and no hook.
    - The dot is small and stands apart; a small gap separates it from the middle bar and from the bottom bar.
    - The dot slants down to the right and sits at the lower right of the middle bar's end.
  strokes:
    - where: a line across the upper part, rising a little to the right
      part: the upper jade piece
    - where: a line across the middle, rising a little to the right, almost as long as the top line
      part: the middle jade piece
    - where: a vertical line down the middle from the top line to the bottom line, crossing the middle line
      part: the necklace cord
    - where: a line across the bottom, clearly longer than the top two, nearly twice as long
      part: the lowest, widest jade piece
    - where: a small dot at the right, below the middle line and above the bottom line, slanting down to the right
      part: the small jade bead

汉:
  object: the Han river flowing down on the left beside its bank on the right
  history: >-
    A river name. The water 氵 is the river and the hand 又 beside it sits on its bank; the
    traditional form wrote the bank with a larger sign.
  layout: >-
    A broad river fills the left side from top to bottom, pale blue with small ripples. On the right a
    sloping grassy bank rises above it, pale green and cream, one bank edge crossing another, going
    down to the water at the lower left.
  exact:
    - The two dots at the upper left and the rising stroke below them do not touch each other or the bank.
    - The rising stroke runs from the bottom up toward the right and ends at the middle left.
    - The bank's long stroke is the longest in the picture; it crosses the bank's second stroke near its middle.
    - The bank's second stroke ends turning across to the right, nearly to the right edge.
    - The first stroke of the bank starts at the top, runs across, then turns down to sweep to the bottom left.
  strokes:
    - where: a short dot at the upper left, slanting down to the right
      part: the first ripple of the river
    - where: a short dot below it, further left, slanting down to the right
      part: the second ripple
    - where: a longer stroke from the bottom left rising to the right, up toward the middle
      part: the river's current, flowing up the left side
    - where: a stroke across from the top centre to the right, then turning to sweep down to the bottom left, as long as the whole frame
      part: the bank's upper edge, curving steeply down to the water
    - where: a stroke from the middle down to the right, then turning across to the right
      part: the bank's slope, reaching the far right

漢:
  object: the Han river flowing down on the left beside its bank on the right
  history: >-
    A river name. The water 氵 is the river; the traditional form wrote the bank with a larger sign
    of clay and grass.
  layout: >-
    A broad river fills the left edge from top to bottom, pale blue with small ripples. On the right a
    clay bank stands, tall and wide, pale cream and brown, with pale green grass along its top.
    A few paths of stones cross its face. A small slope runs out into the water at the lower right.
  exact:
    - The three water strokes stand free of every other stroke; the two dots slant down to the right and the third runs up.
    - The grass line across the top rises a little to the right; it is long, about three quarters as long as the lowest line across, which is the longest line across in the character.
    - Two short grass strokes cross it, the right one a little higher and longer.
    - The long sweep in the bank starts near the grass and goes down to the bottom left, crossing the face's lines.
    - The face has one hooked line, ending in a small hook down to the left, and three further lines across that rise a little to the right.
    - The lowest line across crosses the long sweep and is the longest line across of all; the two lines across above it are each about half as long.
    - The last stroke starts where the lowest line meets the long sweep and runs down and out to the right.
  strokes:
    - where: a short dot at the upper left, slanting down to the right
      part: the first ripple of the river
    - where: a short dot below it, further left, slanting down to the right
      part: the second ripple
    - where: a stroke from the bottom left rising to the right, up toward the middle
      part: the river's current along the bank
    - where: a long line across the top of the right part, rising slightly to the right, about three quarters as long as the lowest line
      part: the grass along the top of the bank
    - where: a short stroke down from the middle of the grass line, slanting a little to the right
      part: the grass's left blade
    - where: a short stroke down through the right end of the grass line, slanting a little to the right
      part: the grass's right blade
    - where: a short line across below the grass, rising slightly to the right, joining the long sweep's top
      part: the bank's upper ledge
    - where: a short stroke in the middle of the bank on the left, slanting down to the right
      part: a stone on the face
    - where: a line from the stone's middle rising to the right, then turning down to the right, ending in a small hook down to the left
      part: a ridge of clay across the face
    - where: a line across the middle of the bank, rising slightly to the right, about half as long as the lowest line
      part: a path across the face
    - where: a line across below it, rising slightly to the right, about half as long as the lowest line
      part: a second path
    - where: a long line across the lower part of the right side, nearly horizontal, the longest line across in the character
      part: the foot of the bank, the longest line below the grass
    - where: a long stroke from the middle at the top down through the face, turning to sweep down to the bottom left
      part: the bank's steep side
    - where: a stroke at the bottom right from the middle of the lowest line, slanting down to the right then turning across
      part: the slope running out into the water

討:
  object: a person asking, a mouth speaking with sound lines on the left and an outstretched hand on the right asking for a small thing
  history: >-
    An ideogram: speech 言 with the hand 寸, asking for something by words and by an open hand.
  layout: >-
    The left half is a friendly face with eyes and a nose, its wide mouth at the lower left speaking,
    with four short lines of sound rising above the mouth. The right half is a long arm hanging down
    with an open hand at the bottom; a small pale round pearl sits at the hand's left. Pale colours.
  exact:
    - The four sound lines above the mouth stand free of each other; the top one is a short slanting mark.
    - The second line is the longest of the four, about twice the third or fourth.
    - The mouth is three strokes, the left side, the top lip turning down at the right, and the bottom lip.
    - The mouth's top lip is longer than the bottom lip, about twice as long, and ends where the bottom lip ends.
    - The long arm crosses the long line across the right half; the line across rises to the right.
    - The arm is straight down and ends in a small hook to the left, with no other bend.
    - The small dot lies free, at the left of the arm, below the line across.
  strokes:
    - where: a short stroke at the top of the left half, slanting down to the right
      part: the first sound line
    - where: a long line across the left half, rising a little to the right
      part: the longest line of sound
    - where: a short line below it, rising a little to the right
      part: a shorter line of sound
    - where: a short line below that, rising a little to the right
      part: another short line of sound
    - where: a short line down on the lower left of the left half
      part: the mouth's left corner
    - where: a line across from the top of the mouth's left side, rising a little, then turning down at the right
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the left half, rising a little, meeting the end of the lip
      part: the lower lip
    - where: a long line across the middle of the right half, rising slightly to the right
      part: the asking hand's wrist, held out
    - where: a long straight line down the right half, crossing the wrist, ending in a small hook to the left
      part: the arm and the hand's thumb
    - where: a small dot on the left of the arm, below the line across, slanting down to the right
      part: the small thing asked for

