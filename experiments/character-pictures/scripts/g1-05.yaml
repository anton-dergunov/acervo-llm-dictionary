    - The line across the right half rises to the right and is a little over half as long as the mouth's line.
    - The long arm crosses the line across the right half and ends in a small hook to the left.
    - The small dot lies free at the left of the arm, below the line across.
  strokes:
    - where: a small stroke at the top of the left half, slanting down to the right
      part: a spark of sound
    - where: a long line across the lower left, rising a little, then turning down and turning up to the right
      part: the wide mouth, the lower lip curving up at the right
    - where: a line across the right half, rising slightly to the right, over half the width
      part: the asking hand's wrist, held out
    - where: a long straight line down the right half, crossing the wrist, ending in a small hook to the left
      part: the arm and the hand's thumb
    - where: a small dot on the left of the arm, below the line across, slanting down to the right
      part: the small thing asked for

龍:
  object: a dragon facing left and bending downwards
  history: >-
    The oldest forms drew a dragon with a crested head, open jaws and a long coiled body; the
    modern forms cut it into strokes.
  layout: >-
    The dragon fills the square, its head on the left facing left, with horns on top, a round eye and
    open jaws with teeth; its long body falls from behind the head along the right half, bends down
    and flicks its tail up at the lower right. The body has pale belly scales. Pale green and cream,
    friendly face.
  exact:
    - The head's first dot lies free of the horn line; a small gap lies below it.
    - The horn line is about half as long as the jaw line, and the line across the left half is about three quarters as long as the jaw line.
    - The eye is a small dot that lies free and does not touch the horn line.
    - The second horn starts on the horn line and ends on the long jaw line.
    - The long jaw line is the longest line across in the head, reaching nearly the left and right edge of the head.
    - The jaw's left side is straight; the right side turns and ends in a small hook up to the left.
    - The two jaw dots touch the left side of the jaw and stay clear of its right side.
    - The body's long stroke is the longest stroke; it goes down, turns across to the right and ends turning up.
    - The three belly lines start on the body, rise a little to the right and do not reach the right edge.
    - The body's top line starts from the middle of a small curve above it, and ends meeting the middle line.
  strokes:
    - where: a small dot at the top of the left half, slanting down to the right
      part: the tip of the left horn
    - where: a short line across the upper left half, rising slightly to the right, about half as long as the jaw line
      part: the horn line, across the top of the head
    - where: a small dot below the left end of the horn line, slanting down to the right and free of it
      part: the dragon's eye
    - where: a short stroke from the middle of the horn line going down to the right, turning down to the left
      part: the second horn, curving back to the jaw
    - where: a long line across the left half, rising slightly to the right, from the left edge to the right edge of the left half, about three quarters as long as the jaw line
      part: the upper jaw, the long mouth line
    - where: a vertical line down the left of the left half
      part: the left side of the lower jaw
    - where: a line from the top of the jaw's left side, going across and turning down, ending in a small hook up to the left
      part: the lower jaw's right side and the throat
    - where: a small dot inside the jaw, touching the left side and rising to the right
      part: the upper tooth
    - where: a small dot below it, touching the left side and rising to the right
      part: the lower tooth
    - where: a short line across the top of the right half, rising slightly to the right
      part: the spine ridge at the neck's top
    - where: a long stroke from the top of the right half going down, turning across and rising to the right, ending in a small hook down
      part: the back of the neck and the back, curving
    - where: a short line across the middle of the upper right half, rising a little, meeting the end of the previous stroke
      part: the dragon's shoulder
    - where: a very long stroke from the shoulder going down, turning across to the right and turning up at the end
      part: the dragon's body, bending down and flicking its tail up
    - where: a short line across the body, rising slightly to the right, near the upper body
      part: the first belly scale
    - where: a short line across the body below it, rising slightly to the right
      part: the second belly scale
    - where: a short line across the body below that, level
      part: the third belly scale

龙:
  object: a dragon facing left and bending downwards
  history: >-
    The oldest forms drew a dragon with a crested head, open jaws and a long coiled body; the
    modern forms cut it into strokes.
  layout: >-
    The dragon fills the square. Its head is at the upper left, facing left, with a round eye and
    open jaws, and its long body bends down through the centre and flicks its tail up at the lower
    right. Pale green and cream, friendly face.
  exact:
    - The line across rises slightly to the right; the long sweep crosses it near the middle of each.
    - The long bend starts at the middle of the line across and also touches the long sweep.
    - The long bend goes down, turns across to the right and ends turning up.
    - The short sweep at the middle crosses the long bend near the middle of each and goes down to the bottom left.
    - The dot at the top right lies free of every stroke.
    - The long sweep is nearly as long as the long bend, about nine tenths as long.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the dragon's back and upper jaw, facing left
    - where: a long stroke from the top centre going down, turning to sweep down to the bottom left, crossing the line across
      part: the neck, curving down into the front claw
    - where: a long stroke from the middle of the line across going down, turning across to the right, ending in a hook up
      part: the body, bending downward, the tail flicking up
    - where: a shorter sweep from the right side of the body's bend down and out to the bottom centre
      part: the hind leg
    - where: a small dot at the top right, slanting down to the right and free of the strokes
      part: a spine ridge on the dragon's back

聖:
  object: a sage-king who listens and speaks, a large ear and a speaking mouth above his crowned figure
  history: >-
    An ideogram: a ruler 王 who listens with the ear 耳 and speaks with the mouth 口.
  layout: >-
    A wise king sits in the lower half, facing the viewer, a friendly face with eyes, a nose and a
    mouth, pale robe and a crown. Above him on the left a large ear, listening, and on the right a
    wide open mouth, speaking. Pale gold, cream and soft pink.
  exact:
    - The ear is taller and wider than the mouth; the mouth is smaller and stands to the right of the ear.
    - The ear's top line is longer than its bottom line, which is about three quarters as long. The mouth's bottom line is about half as long as its top line. The king's middle bar is about half as long as the bottom bar.
    - The ear's long vertical in the middle is the longest of its verticals; the left vertical is shorter, three quarters as long.
    - The two small dots stand inside the ear at the left and do not touch the middle vertical.
    - The ear's bottom line turns up at its right end and touches the middle vertical.
    - The mouth is made of three strokes; its top line turns down at the right and ends meeting the middle line.
    - The king's top bar leans to the left, the middle bar is longer than the crown, and the bottom bar is the longest of all.
    - The king's vertical starts on the top bar, crosses the middle bar and ends on the bottom bar.
  strokes:
    - where: a line across the top of the ear, rising slightly to the right
      part: the top rim of the ear
    - where: a line down the left side of the ear, ending on the bottom line
      part: the ear's outer rim at the left
    - where: a long line down the middle of the ear, ending on the bottom line
      part: the ear's inner fold
    - where: a small dot inside the ear at the upper left, rising to the right
      part: the upper curl of the ear
    - where: a small dot below it inside the ear, rising to the right
      part: the lower curl of the ear
    - where: a line across the bottom of the ear, turning up to the right at its end, shorter than the top line of the ear
      part: the ear's lobe and base
    - where: a short line down the left side of the mouth on the right
      part: the left corner of the lips
    - where: a line across the top of the mouth, turning down at the right
      part: the upper lip curving into the right corner
    - where: a short line across the bottom of the mouth, rising a little, about half as long as its top line
      part: the lower lip
    - where: a line across the top of the king, leaning from the right to the left
      part: the crown's band
    - where: a line across the king's middle, longer than the crown's band, about half as long as the bottom bar
      part: the king's outstretched arms
    - where: a short straight line down the middle, from the crown down to the hem, crossing the arms
      part: the king's body and robe
    - where: a long line across the bottom, the longest
      part: the hem of the robe, resting on the floor

圣:
  object: a sage-king who listens and speaks, a large ear and a speaking mouth above his crowned figure
  history: >-
    An ideogram: a ruler 王 who listens with the ear 耳 and speaks with the mouth 口.
  layout: >-
    The upper half is a listening sage: his head with a face, eyes, a nose and a mouth, and a hand
    cupped behind his ear. The lower half is the sage's robe and body on the ground, a pale robe with
    a belt, the ground a pale line below. Pale gold, cream and soft pink.
  exact:
    - The two strokes of the hand cross each other near their middles.
    - The first stroke goes across, rises a little, turns down, then turns down to the left and ends turning left.
    - The second stroke goes down to the right and then turns across to the right; it is the longest of the upper pair on the right.
    - The robe's short bar crosses the vertical and does not touch the right-hand stroke above.
    - The vertical goes down to the bottom bar, touching it in the middle, and does not touch the hand's first stroke.
    - The bottom bar is the longest bar of the lower pair, about twice the upper bar.
  strokes:
    - where: a stroke from the upper left going across and rising a little, then turning down, down to the left, and curling back to the left
      part: the sage's head and the curl of his ear
    - where: a stroke from the upper left going down to the right, then turning across to the right
      part: the sage's cupped hand and forearm, reaching out
    - where: a line across the middle of the lower half, rising slightly to the right, free of the upper strokes
      part: the sage's belt
    - where: a short vertical down from the upper middle of the lower half, slanting a little to the right
      part: the sage's robe, hanging
    - where: a long line across the bottom, about twice the belt
      part: the sage's hem on the ground

甘:
  object: a wide open mouth with its tongue, a mark on the tongue where it tastes sweet
  history: >-
    The oldest forms drew a mouth with a bar inside it, the sweet taste held in the mouth.
  layout: >-
    A wide open mouth seen from the front fills the square, lips pale pink, the tongue a soft rose
    colour in the middle. A small band of paler rose lies across the tongue at the sweet spot.
    Behind the mouth a faint face with eyes and a nose.
  exact:
    - The top lip is the longest stroke, the full width, and it extends past both sides.
    - The two sides cross the top lip; the right side is longer, from the top to the bottom, the left side is shorter, about three quarters as long.
    - The tongue's mark is short, about a fifth of the top lip, and touches the left side at its start.
    - The tongue's mark does not touch the right side; a small gap lies between them.
    - The bottom lip is also short, begins at the end of the left side and ends touching the right side's end.
    - The bottom lip rises slightly to the right.
  strokes:
    - where: a long line across the upper part, the full width
      part: the top lip, extending to both corners
    - where: a vertical line down the left, crossing the top lip, shorter than the right
      part: the left side of the mouth
    - where: a vertical line down the right, crossing the top lip, reaching the bottom
      part: the right side of the mouth
    - where: a very short line across the middle, starting on the left side
      part: the sweet spot on the tongue
    - where: a short line across the bottom, about a fifth as long as the top lip, rising slightly to the right, from the left side's end to the right side's end
      part: the bottom lip

旧:
  object: an old standing post beside the sun, older than the sun
  history: >-
    An ideogram: an upright line beside the sun 日, the older thing.
  layout: >-
    An old weathered stone post, pale grey, stands at the left as tall as the sun is. At the right
    a sun, round and pale gold, with a friendly look, shines with a pale yellow glow.
  exact:
    - The post stands apart from the sun; they do not touch each other.
    - The post is a plain vertical that slants slightly, with a plain point at the bottom and no hook.
    - The sun's left side and top line meet at the top left.
    - The sun's top line turns down at the right and runs down the right side, ending at the bottom bar.
    - The sun's middle bar starts on the left side but stops short of the right side.
    - The sun's bottom bar starts at the left side's bottom and ends touching the right side's end.
    - The middle bar and the bottom bar are about as long as each other, each about a quarter as long as the sun's top line.
  strokes:
    - where: a straight vertical line down the left, slanting a little to the right
      part: the old post
    - where: a straight line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the right and running down the right side
      part: the sun's top and right rim
    - where: a short line across the middle of the sun, rising slightly to the right, starting on the left rim
      part: the bright band across the sun's heart
    - where: a short line across the bottom of the sun, rising slightly to the right, as long as the middle line
      part: the sun's bottom rim

幼:
  object: a small skein of thread on the left beside a small child's weak arm on the right
  history: >-
    An ideogram: the little 幺, a tiny twist of silk, and the strength 力, little strength: a young child.
  layout: >-
    A little skein of thread, twisted in two loops, stands on the left, soft pink. At the right a
    toddler holds up a thin little arm, his face friendly with eyes, a nose and a mouth, in a pale shirt.
    The arm is a thin flexed arm reaching from his shoulder at the upper right.
  exact:
    - The thread's second loop starts on the first loop's end, in its middle.
    - The thread's loops end in a small dot below, which touches the second loop.
    - The thread's dot does not touch the child's arm; a small gap lies between them.
    - The arm's first stroke starts in the thread's right side without touching the second loop, runs across, turns down and ends in a small hook up to the left.
    - The arm's long sweep crosses the first stroke near its start and runs down to the bottom left.
    - The arm and the long sweep are about the same length.
  strokes:
    - where: a stroke at the top of the left half going down, turning across to the right
      part: the thread's first loop
    - where: a stroke below it starting at the right, going down to the left, then turning across, rising slightly to the right
      part: the thread's second loop
    - where: a short stroke below the second loop's middle, slanting down to the right
      part: the end of the thread
    - where: a line from the middle of the right half going across, turning down, ending in a small hook up to the left
      part: the child's small flexed arm, the hook his tiny fist
    - where: a long sweep from the top of the right half down to the bottom left, crossing the arm's first stroke
      part: the child's shoulder, side and leg

皮:
  object: a hand using a knife to strip the hide from a carcass
  history: >-
    The oldest forms drew a hand with a tool pulling off an animal's hide; the hide hangs at the left
    and the hand with the tool at the right.
  layout: >-
    A stretched pale animal hide hangs on the left, its top edge folded over with a small hook at the
    right, and its left edge falling down to the bottom left. On the right a bare hand holds a small
    curved knife and strips the hide, the forearm coming down from the upper right. Pale brown hide,
    pale skin.
  exact:
    - The hide's top edge has a hook down to the left at its right end.
    - The hide's top edge is shorter than the hand's first stroke, about three quarters as long.
    - The hide's left edge starts at the left end of the top edge and sweeps down to the bottom left.
    - The knife crosses the hide's top edge near the middle of the edge.
    - The hand's first stroke starts where the knife ends and goes across, then turns down to the left.
    - The hand's second stroke crosses the first one and goes down to the right, turning across at the end.
    - The hide's left edge and the hand's second stroke do not touch; a small gap lies between them.
  strokes:
    - where: a line across the upper left half, rising slightly to the right, ending in a small hook down to the left, about three quarters as long as the hand's line across
      part: the hide's top edge
    - where: a long stroke from the left end of the top edge down, sweeping down to the bottom left
      part: the hide's left edge, hanging
    - where: a short stroke at the top centre going down, slanting a little to the right, crossing the hide's top edge
      part: the knife's blade, cutting
    - where: a stroke from the knife's end going across to the right, turning down to the left, longer than the hide's top edge
      part: the hand's back and fingers, gripping
    - where: a long stroke from the middle crossing the previous stroke, going down to the right, then turning across to the right
      part: the forearm and the pulling hand

归:
  object: a wife returning home with her broom, walking toward her doorway
  history: >-
    The oldest forms drew a woman with her broom and a place to stop: a woman coming home.
  layout: >-
    A woman fills the left half, walking to the right, a friendly face with eyes, a nose and a mouth,
    simple pale clothes, her feet apart. The broom on the right is a pale straw broom, with a pale
    cottage door faint behind it. Pale brown and cream.
  exact:
    - The woman's short stroke and her long sweep stand free of the broom.
    - The woman's short stroke is a plain vertical, with no hook, and lies free of her long sweep.
    - The broom's first stroke goes across, rising a little, turns down to the right, then turns down; it is the longest on the right.
    - The broom's middle bar is about two fifths and its bottom bar about half as long as the broom's first stroke.
    - The broom's middle bar is shorter than the bottom bar, about three quarters as long, and does not touch the first stroke or the woman.
    - The bottom bar's right end touches the first stroke's lower end.
    - The long sweep is the longest stroke of the picture and goes down to the left.
  strokes:
    - where: a short vertical line down the left edge of the left half
      part: the woman's arm, hanging
    - where: a long stroke from the top centre going down, then sweeping down to the bottom left
      part: the woman's back and legs, walking
    - where: a line across the upper right, rising slightly to the right, turning down to the right and turning down
      part: the broom's handle top and its bound side
    - where: a short line across the middle of the right half, free of the other strokes
      part: the broom's middle binding
    - where: a line across the lower right half, longer than the middle line, ending touching the end of the first stroke
      part: the broom's straw head

行:
  object: a walker taking small steps, seen from the side facing right, his feet stepping one after the other
  history: >-
    The oldest forms drew a crossroads; later it was read as the left step 彳 and the right step 亍.
  layout: >-
    A walker with a friendly face with eyes, a nose and a mouth, in simple pale clothes, stands in the
    middle facing right, mid-stride. His back leg fills the left, and his front leg and foot
    fill the right. Pale ground below.
  exact:
    - The two upper sweeps on the left do not touch each other; a small gap lies between them.
    - The left vertical starts on the middle of the lower sweep and ends in a plain point at the bottom.
    - The right half's top bar is free and about half as long as the bar below it.
    - The long right bar is the longest of the bars, nearly the whole width of the right half.
    - The right leg starts on the middle of the long bar and ends in a small hook up to the left.
    - The right leg is the longest of the verticals, nearly twice the left vertical.
  strokes:
    - where: a short sweep at the top of the left half, down to the left
      part: the back thigh, bent
    - where: a longer sweep below it, down to the left, with a gap from the first
      part: the back knee and shin, bending
    - where: a straight vertical line down from the middle of the lower sweep to the bottom
      part: the back foot, planted straight
    - where: a short line across the upper part of the right half, rising slightly to the right
      part: the hem of his coat
    - where: a long line across the middle of the right half, rising slightly to the right
      part: his stride line, hips and knee
    - where: a long line down from the middle of the long bar, ending in a small hook up to the left
      part: the front leg, the hook his toes

年:
  object: a harvester carrying a bundle of grain on his shoulders, the year's harvest
  history: >-
    The oldest forms drew a person carrying a bundle of grain: the yearly harvest.
  layout: >-
    A farmer fills the lower part, facing the viewer, a friendly face with eyes, a nose and a mouth,
    simple pale clothes, his arms stretched wide. He carries a pale golden bundle of grain on his
    shoulders, the bundle filling the upper part, its ears bowing to the left. Pale gold and cream.
  exact:
    - The bundle's sweep touches the shoulder bar at its middle; a small gap separates it from the bundle's vertical.
    - The bundle's bar is about half as long as the arms' line, a little under half; the shoulder bar is about as long as the bundle's bar.
    - The bundle's short vertical starts on the bar and ends on the arms' line.
    - The farmer's vertical starts at the shoulder bar, crosses the bundle's bar and the arms' line, and ends in a plain point, with no hook.
    - The farmer's vertical is about three times as long as the bundle's short vertical.
    - The arms' line is the longest stroke across, nearly the full width.
  strokes:
    - where: a short sweep at the upper left of the centre, down to the left
      part: the bundle's bowing ears
    - where: a short line across the top of the farmer, rising slightly to the right
      part: the farmer's shoulders
    - where: a line across the middle of the bundle, level
      part: the band tied around the bundle
    - where: a short vertical down from the band's left, ending on the arms' line
      part: a stalk hanging from the bundle
    - where: a long line across the lower middle, almost the full width
      part: the farmer's arms, stretched wide
    - where: a long straight vertical line down the middle from the shoulders to the bottom
      part: the farmer's body and legs

会:
  object: people gathered for a meeting, one standing speaking, his words rising as a cloud
  history: >-
    An ideogram: people 人 and speech 云, a gathering where people talk together.
  layout: >-
    A speaker stands in the upper half, facing the viewer, a friendly face with eyes, a nose and a
    mouth, in simple pale clothes, arms open. Below him his words gather as a soft pale cloud that
    curls at the bottom. Pale blue sky behind.
  exact:
    - The speaker's two strokes meet at the top; the right one starts at the top of the left one.
    - The small wisp above the cloud lies free of every stroke.
    - The cloud's top line is long, over twice as long as the wisp.
    - The cloud's billow starts on the middle of the top line, goes down to the left and turns across, rising slightly to the right.
    - The cloud's dot at the lower right touches the billow's end and slants down to the right.
    - The speaker's right arm does not touch the cloud's top line; a small gap lies between them.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left of the upper half
      part: the speaker's body, running down into his left leg
    - where: a sweep from the top of the first stroke down to the right and turning across to the right
      part: the speaker's right arm and leg
    - where: a short line across the middle, below the speaker, rising slightly to the right, free, about half as long as the line below
      part: a thin wisp of cloud high up
    - where: a long line across the middle of the lower half, nearly level
      part: the long flat top of the cloud
    - where: a stroke from the middle of the long line going down to the left, then turning across, rising slightly to the right
      part: the cloud's billow curling along its base
    - where: a short dot at the lower right, slanting down to the right, touching the billow's end
      part: the end of the billow, curling up

會:
  object: people gathered for a meeting, one standing speaking, his words rising as a cloud
  history: >-
    An ideogram: people 人 and speech, a gathering where people talk together.
  layout: >-
    A speaker stands in the upper part, facing the viewer, a friendly face with eyes, a nose and a
    mouth, in simple pale clothes, arms open. Under him stands a small hall with a roof, a pale
    meeting house with two small windows. Below the hall, at the bottom, a small wide open mouth
    speaks. Pale gold and cream.
  exact:
    - The speaker's two strokes meet at the top; the small bar under him lies free of both.
    - The hall's left wall starts on the speaker's body sweep and ends on the floor line.
    - The hall's roof starts on the left wall's top and goes across, then turns down and ends in a small hook to the left.
    - The hall's floor line is shorter than the roof, a little under half as long.
    - The hall's middle post and the two small windows lie inside the hall; the windows stand free of the post and the roof.
    - The floor line touches the left wall's end and the roof's end.
    - The mouth below has its left side and its top line starting at the same place; its top line is nearly as long as the hall's roof, about nine tenths.
    - The mouth's middle bar and bottom bar rise slightly to the right; the bottom bar is a little longer.
  strokes:
    - where: a long sweep from the top centre down and out to the bottom left of the upper part
      part: the speaker's body, running down into his left leg
    - where: a sweep from the top of the first stroke down to the right and turning across to the right
      part: the speaker's right arm
    - where: a short line across the middle of the upper part, free of the sweeps
      part: the speaker's collar
    - where: a short vertical line on the left of the hall, starting on the speaker's sweep
      part: the hall's left wall
    - where: a line across the top of the hall from the wall's top, turning down at the right end and ending in a small hook to the left
      part: the hall's roof, curving into its right wall
    - where: a short vertical line in the centre of the hall
      part: the hall's middle post
    - where: a small dot in the hall at the left, slanting down to the right
      part: the left window
    - where: a small dot in the hall at the right, slanting down to the left
      part: the right window
    - where: a short line across the bottom of the hall, a little under half as long as the roof, ending touching the post and the roof's end
      part: the hall's floor
    - where: a short vertical line down the left side of the small mouth
      part: the mouth's left corner
    - where: a line across the top of the mouth, turning down at the right end, nearly as long as the hall's roof
      part: the upper lip, curving into the right corner
    - where: a short line across the middle of the mouth, rising a little to the right
      part: the tongue
    - where: a line across the bottom of the mouth, rising slightly to the right, a little longer than the tongue
      part: the lower lip

全:
  object: jade pieces put away under a cover for safe-keeping
  history: >-
    An ideogram: jade 玉 put away 入 into a cover, a store kept whole.
  layout: >-
    A pale tent-shaped cover fills the upper part, a soft cloth slanting down to both sides. Under it
    a cord hangs, threaded with three smooth pale green jade bars, the bottom bar the widest, sitting
    on a pale wooden shelf. Pale green, cream, soft grey.
  exact:
    - The cover's two slopes meet at the top; the left slope is longer than the right, about one and a seventh as long.
    - The cover does not touch the jade; a small gap lies below each slope.
    - The top bar and the middle bar are about as long as each other.
    - The bottom bar is clearly longer, nearly twice the top bar.
    - The cord starts on the top bar, crosses the middle bar and ends on the bottom bar.
    - The cord is a straight vertical with a plain point and no hook.
  strokes:
    - where: a long sweep from the top centre down to the bottom left of the upper half
      part: the cover's left slope
    - where: a sweep from the top of the first down to the right and turning across to the right
      part: the cover's right slope, turning out at the hem
    - where: a line across the upper middle, rising slightly to the right, below the cover
      part: the upper jade piece
    - where: a line across the middle of the lower half, rising slightly to the right, as long as the upper line
      part: the middle jade piece
    - where: a straight vertical line down from the upper jade piece, crossing the middle one, ending on the bottom one
      part: the cord threading the jade
    - where: a long line across the bottom, nearly twice as long as the upper two
      part: the lowest jade piece, resting on the shelf

多:
  object: two crescent moons, one above the other, many nights piled up
  history: >-
    The oldest forms drew two crescents of the evening moon 夕, one over the other: many nights.
  layout: >-
    Two pale gold crescent moons hang in a pale dusk sky, waxing on the right, with the open hollow
    on the right. The upper one is smaller and the lower one is bigger and sits a little to the left,
    overlapping it. A small pale crater lies in each hollow.
  exact:
    - Each moon is three strokes, a short sweep, a long crescent line and a small dot.
    - The upper moon is smaller; its crescent line is about four fifths as long as the lower moon's.
    - The upper moon's dot lies free, on the left, and does not touch the crescent line; a small gap lies between them.
    - The lower moon's dot stands free of its crescent line, a small gap between them.
    - The lower moon's crescent line is the longest stroke and ends in a long sweep to the bottom left.
    - The upper moon's crescent line and the lower moon's first sweep stand close but do not touch.
  strokes:
    - where: a short sweep at the top of the upper moon, from the top centre down to the left
      part: the upper moon's upper tip
    - where: a line from the middle of the short sweep going across to the right, then turning down and sweeping to the left
      part: the upper moon's curving belly
    - where: a small dot inside the upper moon at the left, slanting down to the right
      part: the upper moon's crater
    - where: a sweep from the centre of the lower half down to the left, starting just below the upper moon
      part: the lower moon's upper tip
    - where: a long line from the middle of the lower sweep going across to the right, then turning down and sweeping to the bottom left
      part: the lower moon's curving belly
    - where: a small dot inside the lower moon at the left, slanting down to the right and free of the belly
      part: the lower moon's crater
