  object: a person asking, a mouth speaking with sound lines on the left and an outstretched hand on the right asking for a small thing
  history: >-
    An ideogram: speech 言 with the hand 寸, asking for something by words and by an open hand.
  layout: >-
    The left half is a friendly face with eyes and a nose, its mouth at the lower left speaking, a
    little mark of sound above it. The right half is a long arm hanging down with an open hand at
    the bottom; a small pale round pearl sits at the hand's left. Pale colours.
  exact:
