# Full run, group g1, batch 23. Written from the fact sheets, following scripts/GUIDE.md.

暴:
  object: a brutal man whose round bright head is the sun-like top, his hands spread wide, tormenting a deer beneath him
  history: >-
    An ideogram: a head 日 and two hands 共 above a deer, drawn with the strokes of 水 in the modern form.
    The deer's shape wore away until only the strokes of water remain.
  layout: >-
    A man stands over a small deer, seen from the front, filling the width of the square. His round
    head is a bright, sun-like face with eyes, a nose and a scowling mouth, and he wears a simple pale
    tunic. His shoulders and arms spread wide, his hands open and grasping, and his legs are planted
    apart on both sides. Between his feet, in the lower middle, a small pale deer cowers with its head
    turned up toward him, its ears pricked. Pastel colours, a pale ground below.
  exact:
    - The head is a small closed box in the top middle, narrower than the body; its middle line stops short of the left and right rims.
    - The line across the shoulders is clearly shorter than the long line of the arms below, about two thirds as long.
    - The two short downward strokes cross the shoulder line and end on the long arm line.
    - The left leg is a long sweep, about three times as long as the right leg's first part; both legs start on the arm line, and the right leg runs down to the right and turns across.
    - The deer's strokes stand free of every other stroke and do not touch the man.
    - The deer's body stroke is long and ends in a small hook up to the left; the rising stroke at the lower left and the small dots do not touch it.
  strokes:
    - where: a long straight line down the left side of the head box
      part: the left side of the man's round head
    - where: a line across the top of the head box, turning down at the top right to run down the right side
      part: the top of his head and the right side of his face
    - where: a short line across the middle of the head box, rising slightly to the right
      part: the band across his face carrying the eyes
    - where: a short line across the bottom of the head box, rising slightly to the right
      part: his chin
    - where: a line across just below the head, rising slightly to the right, a little over two thirds as long as the long line of the arms
      part: his shoulders
    - where: a short stroke slanting down to the right from the left of the shoulders, crossing the shoulder line
      part: his left upper arm and chest side
    - where: a short stroke down from the middle of the shoulder line, turning slightly to the right, crossing it
      part: his right upper arm and chest side
    - where: the longest line across, below the shoulders, spanning almost the whole width
      part: his two arms flung wide, the hands at the ends
    - where: a long sweep from the middle of the arm line down and out to the bottom left
      part: his left leg
    - where: a stroke from the middle of the arm line down to the right, then turning across to the right
      part: his right leg, the foot flat on the ground
    - where: a long stroke below the centre, sloping down to the right then down, ending in a small hook up to the left
      part: the deer's neck and body, the hook its hoof
    - where: a small dot to the left of the deer's body, slanting down to the right
      part: the deer's left ear
    - where: a short stroke at the bottom left rising to the right
      part: the deer's front leg, stretched out
    - where: a small stroke to the right of the body, slanting down to the left
      part: the deer's right ear
    - where: a stroke at the lower right of the body, falling to the right
      part: the deer's back leg

餘:
  object: a covered dish of leftover food beside a small hut, the surplus set aside
  history: >-
    An ideogram: food 飠 with 余, which also gives the sound. The leftover is what remains beyond what
    is eaten.
  layout: >-
    On the left stands a tall bowl of food with a lid on top, a few round morsels in it. On the right
    stands a small hut with a sloping roof, a floor beam and a central pole, set on little props. The
    two are side by side and close; soft pale colours, a warm light on the food.
  exact:
    - The bowl and the hut overlap a little at the middle of the square but their strokes do not cross.
    - The lid is two strokes, a long sweep to the left and a short one to the right, meeting at the top.
    - The bowl's left wall hangs from the middle of the lid's long sweep, runs straight down and ends in a small hook up to the right.
    - The bowl's right wall stops short of the two dots inside it, which do not touch it.
    - The hut's pole is a long vertical ending in a small hook to the left, starting on the short upper beam; it crosses the longer lower beam.
    - The longer lower beam is the longest across stroke; the short upper beam is a little over half as long.
    - The two props under the hut stand free, a short one on the left sweeping down to the left, a longer one on the right falling to the right, about four fifths as long as the roof's right slope.
  strokes:
    - where: a sweep from the top of the left half down and out to the left, then turning down to the left
      part: the left slope of the bowl's lid
    - where: a short stroke from the top of the lid falling to the right
      part: the right slope of the bowl's lid
    - where: a small dot below the lid on the left, slanting down to the right
      part: a morsel hanging under the lid
    - where: a line across in the middle of the left half, turning down at the right to a point at its end
      part: the bowl's rim and its right wall
    - where: a small dot inside the left half, rising slightly to the right
      part: a round dumpling in the bowl
    - where: a small dot below the dumpling, rising slightly to the right
      part: a second dumpling in the bowl
    - where: a long straight line down the left half from the middle of the lid's sweep, ending in a small hook up to the right
      part: the bowl's left wall, the hook its foot
    - where: a small dot at the bottom of the left half, slanting down to the right
      part: the bowl's base crumb
    - where: a stroke from the top of the right half down, turning down to the left
      part: the hut's roof, its left slope
    - where: a stroke from the middle of the roof falling to the right, then turning across to the right
      part: the hut's roof, its right slope
    - where: a short line across the middle of the right half, rising slightly to the right
      part: the hut's upper beam
    - where: a longer line across below it, rising slightly to the right, the longest across stroke
      part: the hut's lower beam
    - where: a vertical from the middle of the upper beam down to the bottom, crossing the lower beam, ending in a small hook up to the left
      part: the hut's central pole
    - where: a short sweep at the bottom centre down to the left
      part: the hut's left prop
    - where: a stroke at the lower right falling to the right
      part: the hut's right prop

器:
  object: four cooking pots, two above and two below, guarded by a dog standing up between them
  history: >-
    An ideogram: four vessels 口 around a dog 犬 guarding them. The dog is the one large shape in the
    middle of the four mouths.
  layout: >-
    Two round-mouthed pots sit side by side at the top and two at the bottom, each a small open pot
    with a rim, a left wall and a base. A friendly dog stands up on its hind legs between the pot rows,
    front paws stretched out wide, one ear up, with eyes, a nose and a smiling mouth. Pale clay
    colours for the pots, a pale warm coat for the dog.
  exact:
    - Each pot is three strokes, a left wall, a rim with the right wall, and a base; the walls touch the rim and the base, so each pot is closed.
    - The two top pots sit close together without touching; the left one is a little larger than the right.
    - The two bottom pots sit close together without touching; the left one is a little smaller than the right.
    - The dog's line across the paws is the longest across stroke, about three times as long as the rim of any pot.
    - The dog's long sweep crosses the line across; the other hind leg starts where they cross.
    - The dog's ear is a small dot standing free at the upper right.
    - The dog's hind leg on the right does not touch the lower right pot.
  strokes:
    - where: a short line down at the left of the upper left pot
      part: the upper left pot's left wall
    - where: a line across the top of the upper left pot, rising slightly, turning down at the right
      part: the upper left pot's rim and right wall
    - where: a short line across the bottom of the upper left pot
      part: the upper left pot's base
    - where: a short line down at the left of the upper right pot
      part: the upper right pot's left wall
    - where: a line across the top of the upper right pot, rising slightly, turning down at the right
      part: the upper right pot's rim and right wall
    - where: a short line across the bottom of the upper right pot
      part: the upper right pot's base
    - where: a long line across the middle of the square, rising slightly to the right
      part: the dog's front legs, stretched out wide
    - where: a long sweep from the top centre down to the right, then turning down to the bottom left, crossing the line across
      part: the dog's head and neck at the top, then its body and one hind leg
    - where: a stroke from the crossing down to the right, then turning across to the right
      part: the dog's other hind leg
    - where: a small dot at the upper right of the dog
      part: the dog's pricked-up ear
    - where: a short line down at the left of the lower left pot
      part: the lower left pot's left wall
    - where: a line across the top of the lower left pot, rising slightly, turning down at the right
      part: the lower left pot's rim and right wall
    - where: a short line across the bottom of the lower left pot
      part: the lower left pot's base
    - where: a short line down at the left of the lower right pot
      part: the lower right pot's left wall
    - where: a line across the top of the lower right pot, rising slightly, turning down at the right
      part: the lower right pot's rim and right wall
    - where: a short line across the bottom of the lower right pot
      part: the lower right pot's base

縣:
  object: a district, a watch post with an eye-like window beside a hank of silk thread hanging down
  history: >-
    An ideogram: 県, the district, bordering 系, the silk; 県 also gives the sound. The oldest form of
    县 drew a head hung up on a cord.
  layout: >-
    On the left stands a district post: a boxy watch window with an open eye in it, a long boundary
    line running down and across under it, and a small post with two little boundary stones below.
    On the right, close beside it, hangs a hank of twisted silk thread from a rod, with loops and a
    long hanging strand and two short ends. The two do not touch; pale colours.
  exact:
    - The window box is closed at the top left corner, where its first two strokes meet; its right side runs down and ends just short of the bottom corner of the boundary line.
    - The three small strokes inside the window are short and rise slightly to the right; the first two touch the window's left side and stop short of the right side.
    - The boundary line is long, runs down at the far left, then turns across and ends beyond the window's right edge, without touching the window.
    - The small post under the window hangs from the middle of the boundary line and ends in a small hook up to the left.
    - The two stones under the line stand free; the left one is a short vertical, the right one a small dot, and neither touches the post.
    - In the silk, the long hanging strand ends in a small hook up to the left and starts on the loop above; the two short ends stand free.
    - The silk's top rod is a stroke running to the left; the first loop hangs from its middle and touches the second loop.
  strokes:
    - where: a long line down the left side of the window box
      part: the window's left frame
    - where: a line across the top of the window box, turning down at the right and running down its right side
      part: the window's top and right frame
    - where: a small dot inside the box at the upper left, rising to the right
      part: the eye's upper lid
    - where: a small dot inside the box in the middle left, rising slightly to the right
      part: the eye's iris
    - where: a small dot inside the box at the bottom left, rising slightly to the right
      part: the eye's lower lid
    - where: a long stroke starting beside the window's top left, running down the far left and then turning across to the right below the window, rising slightly
      part: the boundary line, passing under the window
    - where: a vertical dropping from the middle of the boundary line, ending in a small hook up to the left
      part: the boundary post
    - where: a short vertical to the left of the post, lower down
      part: the left boundary stone
    - where: a small dot to the right of the post, slanting down to the right
      part: the right boundary stone
    - where: a stroke running to the left along the top of the right half
      part: the rod the silk hangs from
    - where: a stroke from the middle of the rod sweeping down to the left, then turning across to the right
      part: the first loop of silk
    - where: a longer stroke below it, sweeping down to the left, then turning across and rising slightly to the right
      part: the second loop of silk, touching the first
    - where: a small stroke at the right, falling to the right
      part: the silk's knot
    - where: a long vertical in the lower middle, starting on the second loop, ending in a small hook up to the left
      part: the long hanging strand of silk
    - where: a short vertical to the left of the strand at the bottom
      part: the silk's left short end
    - where: a short stroke at the lower right falling to the right
      part: the silk's right short end

緻:
  object: a messenger delivering a skein of silk, an arrow arriving at the earth beside him
  history: >-
    An ideogram: silk 糹 together with 致, to bring something to its place; 致 also gives the sound.
    The oldest 至 drew an arrow landing on the ground.
  layout: >-
    On the left hangs a twisted skein of pale silk thread, two loops with a knot and three loose ends
    below. On the right a messenger walks to the left, toward the silk, holding out his hands to give
    it, with a friendly face, eyes, a nose and a mouth, and a simple pale tunic. Beside him on the
    left of that half an arrow has just landed in a patch of earth. Soft pale colours.
  exact:
    - The silk's second loop is the longer; the first loop ends on its middle.
    - The silk's three loose ends are low at the bottom and stand free of the loops.
    - The arrow's top bar is the longest across stroke of the arrow; the earth's top bar is a little shorter, about four fifths as long.
    - The arrow's shaft crosses the earth's top bar, and the earth's upright ends on its long base line, which rises to the right.
    - The arrow's last dot stays beside its shaft and does not touch the messenger.
    - The messenger's long right leg is the longest stroke of the figure and crosses his body stroke; his arm line is about the same length as the arrow's top bar.
    - The silk and the arrow do not touch.
  strokes:
    - where: a long stroke in the upper left, sweeping down to the right then turning down to the left, ending in a small hook across to the right
      part: the first loop of the silk
    - where: a longer stroke below it, sweeping down to the left and ending in a small hook across to the right
      part: the second loop of the silk
    - where: a small dot at the end of the second loop, slanting down to the right
      part: the silk's knot
    - where: a short vertical at the bottom left
      part: the silk's left loose end
    - where: a small dot at the bottom, slanting down to the right
      part: the silk's middle loose end
    - where: a small dot to the right of it, slanting down to the right
      part: the silk's right loose end
    - where: a line across the top of the middle area, rising slightly to the right
      part: the arrow's feathered end
    - where: a stroke from under the left of that line, running down and turning across to the right, rising slightly
      part: the arrow's shaft and its tip
    - where: a small dot beside the shaft, slanting down to the right
      part: the arrow's loose feather
    - where: a short line across the lower middle, rising slightly to the right, crossing the shaft
      part: the top of the patch of earth
    - where: a vertical in the middle, ending on the base line
      part: the earth's post
    - where: a line across the bottom of the middle, rising to the right
      part: the ground the arrow arrives at
    - where: a stroke in the upper right running down to the right, then turning down
      part: the messenger's head and back
    - where: a line across the upper right, rising slightly to the right
      part: the messenger's arms, held out
    - where: a stroke from the middle of the arm line down to the right, turning down and then down to the left
      part: the messenger's body and front leg
    - where: a long stroke from the middle of his body down to the right, then turning across to the right
      part: the messenger's back leg, a long step

錄:
  object: a pile of metal ingots beside a brush that writes a record on a scroll
  history: >-
    An ideogram: metal 釒 together with a brush 彔 used to write things down; 彔 also gives the sound.
    The brush is drawn with a hair tip above and a long handle.
  layout: >-
    On the left a pile of pale metal ingots, a stack with sloping sides, two layers, an upright rod
    through it, two small nuggets beside it and a base plate. On the right a writing brush stands
    upright, its tip curved at the top, a band below the tip and a long handle, with a drop of ink
    beside it and a short written line; a record scroll unrolls beside the handle. Pale metallic greys
    and warm paper colours.
  exact:
    - The ingot pile's two sloping sides come down from the top, the left one long; the layer lines cross the upright rod.
    - The upright rod ends on the base plate; the two nuggets stand free of the rod.
    - The base plate runs across and turns up at its right end.
    - The brush's band across is the longest across stroke; the brush tip's two strokes meet and the second ends on the band.
    - The handle starts on the band and is the longest vertical, ending in a small hook up to the left.
    - The handle and the tip's second stroke do not touch; there is a small gap between the end of the tip and the handle.
    - The scroll's two edges meet at the left; the lower edge starts on the handle and runs out to the right, longer than the upper edge.
    - The ink drop and the written line stand free.
  strokes:
    - where: a sweep from the top of the left half down and out to the left, then turning down to the left
      part: the ingot pile's left side
    - where: a small dot at the upper left, slanting down to the right
      part: the pile's top ingot
    - where: a short stroke rising to the right across the middle of the left half
      part: the pile's upper layer
    - where: a longer line across the lower middle, rising slightly to the right, crossing the rod
      part: the pile's lower layer
    - where: a vertical in the left half from the upper layer to near the bottom, crossing the lower layer
      part: the upright rod through the pile
    - where: a small dot at the lower left, slanting down to the right
      part: a small nugget on the left
    - where: a small dot at the middle right of the half, slanting down to the left
      part: a small nugget on the right
    - where: a stroke across the bottom of the left half, turning up at its right end
      part: the base plate under the pile
    - where: a stroke from the top of the right half, sweeping down to the right, then down, then across with a small rise
      part: the brush's tip, curved
    - where: a stroke across the upper right, turning down to the left at its end
      part: the second edge of the brush's tip
    - where: a long line across the middle of the right half
      part: the band around the brush
    - where: a long vertical from the middle of the band down to the bottom, ending in a small hook up to the left
      part: the brush's handle
    - where: a small dot to the left of the handle, slanting down to the right
      part: a drop of ink
    - where: a stroke at the bottom left, rising to the right
      part: the line the brush has written
    - where: a short sweep at the right, falling to the left
      part: the scroll's upper edge, curling
    - where: a stroke from the end of the upper edge down to the right and then across to the right, starting on the handle
      part: the scroll's lower edge, unrolling to the right

嚮:
  object: a house with a window facing toward a country village of curling smoke, a granary and a walled gate
  history: >-
    An ideogram: facing toward 向 the country 鄉; 鄉 also gives the sound. 向 drew a house with a
    window in its wall.
  layout: >-
    In the upper half, a country village: three curling wisps of smoke rise at the left, a round
    granary or bowl of grain stands in the middle, and a walled gate with a tall post stands at the
    right. In the lower half a house stands facing the village, the front wall open to the viewer with
    a square window in its middle. Pale greens and creams, soft light.
  exact:
    - The three wisps of smoke are separate curls; the first curl's end touches the second and the second's end touches the third.
    - The grain bowl's left lid dot stands free; its roof-and-wall stroke touches the first lid line; two small dots sit on the left inside it, rising to the right.
    - The bowl's long left stroke ends in a small hook up to the right and is the longest stroke of the bowl.
    - The village gate's wall stroke is long, the post is a straight vertical beside it, and they start at the same point.
    - The house's roof stroke is the longest of the house, running across and turning down at the right into the right wall, ending in a small hook to the left.
    - The house's left wall is a vertical about two thirds as long as the roof stroke, starting where the roof starts.
    - The window is a small closed box; its left side and the sill touch at the bottom.
  strokes:
    - where: a stroke in the upper left sweeping down to the right, then turning down to the left, ending in a small hook across to the right
      part: the first curl of smoke
    - where: a stroke below it sweeping down to the left, ending in a small hook up to the right
      part: the second curl of smoke
    - where: a stroke below it running down, then turning down to the left
      part: the third curl of smoke
    - where: a small dot at the top of the middle
      part: the granary's lid knob
    - where: a stroke across the upper middle, turning down at its right
      part: the granary's lid and its right wall
    - where: a small dot inside on the left, rising to the right
      part: a grain of rice on the left
    - where: a small dot below it, rising slightly to the right
      part: a grain of rice below
    - where: a long stroke from the upper left of the granary down to the middle, ending in a small hook up to the right
      part: the granary's left wall and base
    - where: a small dot at the lower right of the granary, slanting down to the right
      part: a spilled grain
    - where: a stroke at the upper right running across with a small rise, then down to the left, then down to the right, ending in a small hook to the left
      part: the walled gate's top, its wall and its tower
    - where: a long vertical at the right, starting where the gate's wall starts
      part: the gate post
    - where: a short stroke at the top of the lower half, slanting down to the left
      part: the house's roof ridge tip
    - where: a vertical on the left of the lower half
      part: the house's left wall
    - where: a long stroke across the top of the lower half, turning down at the right, ending in a small hook to the left
      part: the house's roof and its right wall
    - where: a short vertical inside the house, at the left
      part: the window's left frame
    - where: a stroke across the upper window, rising slightly, turning down at the right
      part: the window's top and right frame
    - where: a short line across the bottom of the window
      part: the window sill

闆:
  object: a double door with a doorway of three stacked crates of boards inside
  history: >-
    An ideogram: a door 門 with material 品 stacked behind it; 品 also gives the sound. 門 drew the
    two leaves of a gate.
  layout: >-
    A two-leaved wooden door stands open, filling the square. In the doorway, in the middle of the
    square, three pale wooden crates are stacked: one on top and two side by side below it. Soft browns
    and creams, a pale floor at the bottom edge.
  exact:
    - The left leaf is a post along the left edge, with a top bar and inner edge turning down at the right; the right leaf is a short post at the top and a top bar with the right post running to the bottom.
    - The right post is the longest stroke, running the whole height and ending in a small hook up to the left.
    - The left leaf's two small studs are separate short dots rising to the right, standing on the leaf.
    - The right leaf's two panel marks are short and rise slightly to the right; the first touches the short post and the second touches the right post.
    - Each crate is three strokes, a left side, a top with the right side, and a bottom; the top crate's bottom is shorter than its top.
    - The top crate's left side does not touch the left leaf; the lower two crates touch their own strokes but not each other.
    - The top crate does not touch the left leaf's top bar.
