      part: the left leaf's top bar and inner edge
    - where: a small dot on the left leaf, rising to the right
      part: the left leaf's upper stud
    - where: a small dot below it at the end of the inner edge, rising to the right
      part: the left leaf's lower stud
    - where: a short vertical at the top middle
      part: the right leaf's inner post
    - where: a stroke from the top of that post across and down the whole right side, ending in a small hook up to the left
      part: the right leaf's top bar and outer post
    - where: a small dot on the right leaf, rising slightly to the right
      part: the right leaf's upper panel mark
    - where: a short line across the right leaf, below it
      part: the right leaf's lower panel mark
    - where: a short stroke at the left of the top crate, slanting down to the right
