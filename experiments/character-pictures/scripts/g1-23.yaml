檯:
  object: a tree beside a wooden watch platform, a canopy over it and an arrow landing on the earth at its foot
  history: >-
    An ideogram: wood 木 with 臺, the platform; 臺 also gives the sound. 臺 drew a tall tower with a
    roof, standing on the ground.
  layout: >-
    On the left stands a tree with a plain trunk, branches across the upper part and a root on each
    side. On the right stands a tall wooden platform: a pole with two crossbars at the top, a small
    doorway under it, a broad canopy over the middle, and at the foot an arrow that has landed in a
    patch of earth. Pale greens, browns and creams.
  exact:
    - The tree's trunk is a straight vertical ending in a plain point at the bottom, with no hook; the line across crosses it.
    - The tree's left root and the small right root both start on the trunk and do not touch each other.
    - The tree's line across rises a little to the right.
    - The platform's upper crossbar is a little longer than the lower one; the pole crosses both.
    - The doorway is a small closed box, with the doorway's right side ending in a hook down to the left; its lower line stands free of the canopy.
    - The canopy's hooked line is the longest across stroke of the platform; its short left post hangs from its left end.
    - The arrow's line across is about four fifths as long as the earth's base line, which is the longest across stroke of the foot.
    - The arrow's shaft touches the earth's post and the earth's post ends on the base line.
  strokes:
    - where: a line across the upper left, rising to the right, crossing the trunk
      part: the tree's branches
    - where: a long straight vertical down the middle of the left, from the top to the bottom
      part: the tree's trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the tree's left root
    - where: a short dot beside the trunk, slanting down to the right
      part: the tree's right root, short
    - where: a line across at the top of the right half, rising slightly, a little longer than the next one
      part: the platform's upper crossbar
    - where: a stroke down from the top, turning down to the right, crossing the crossbar
      part: the platform's pole
    - where: a line across below it, rising slightly, crossing the pole
      part: the platform's lower crossbar
    - where: a short stroke inside the middle, slanting down to the right
      part: the doorway's left side
    - where: a stroke across the top of the doorway, rising slightly, turning down to the right, ending in a hook down to the left
      part: the doorway's lintel and right side
    - where: a short line across the bottom of the doorway
      part: the doorway's step
    - where: a short vertical at the left of the canopy, hanging from its left end
      part: the canopy's left post
    - where: a long line across below the doorway, ending in a hook down to the left
      part: the canopy
    - where: a line across the upper foot, rising slightly to the right
      part: the arrow's feathered end
    - where: a stroke from below the middle of the arrow's line down to the left, then turning across and rising to the right
      part: the arrow's shaft and its tip
    - where: a small dot at the lower right of the arrow, slanting down to the right
      part: a loose feather of the arrow
    - where: a short line across the lower foot, rising slightly
      part: the top of the earth patch
    - where: a short vertical in the middle of the lower foot, from the shaft to the base line
      part: the earth's post
    - where: a long line across the bottom, the longest at the foot
      part: the ground the arrow arrives at

曜:
  object: the sun beside a spectacular pheasant with splendid plumes
  history: >-
    An ideogram: the sun 日, a heavenly body, with 翟, a bird with brilliant feathers; 翟 also gives
    the sound.
  layout: >-
    On the left glows the sun, a small round bright disc seen in a frame. On the right a splendid
    pheasant stands facing left, with an eye, a beak and a crest, and above it two broad plumes spread
    like fans, bright and many-coloured but pale. A branch under its feet. Soft warm colours.
  exact:
    - The sun's left side is the long stroke; the middle line is a short dot-like bar that does not touch the top-right turn.
    - The two small dots inside the sun rise to the right; the lower one touches the bottom of the sun's frame.
    - The two plumes are separate from each other and from the bird; each is a stroke across and down, with a small dot and a small rising stroke beside it.
    - The bird's body vertical is about three quarters as long as the sun's left rim.
    - The bird's body vertical starts on the head sweep and the branch under it starts on the vertical.
    - The three feather bars cross the wing edge; the bars are of similar lengths, the topmost a little longer.
    - The wing edge touches the middle bar and the top bar and ends on the branch.
  strokes:
    - where: a long straight vertical on the left of the left half
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the right and running down its right side
      part: the sun's top and right rim
    - where: a small dot inside the sun, rising to the right, at the middle
      part: the bright spot at the sun's heart
    - where: a small dot inside the sun near the bottom, rising to the right
      part: the sun's lower glow
    - where: a stroke across the top of the plumes' left half, turning down at its right
      part: the left plume's spine
    - where: a small dot at the upper left of the left plume
      part: the left plume's colour spot
    - where: a small stroke at the lower left of the left plume, rising to the right
      part: the left plume's lower tip
    - where: a stroke across the top of the plumes' right half, turning down
      part: the right plume's spine
    - where: a small dot at the upper left of the right plume
      part: the right plume's colour spot
    - where: a small stroke at the lower left of the right plume, rising to the right
      part: the right plume's lower tip
    - where: a sweep at the centre, falling to the left
      part: the bird's head and neck, turned left
    - where: a long vertical running from the middle of the head sweep to the bottom
      part: the bird's body and legs
    - where: a small dot at the upper right of the bird, slanting down to the right
      part: the tuft of the bird's crest
    - where: a line across at the upper body, rising slightly to the right
      part: the bird's upper wing feather bar
    - where: a line across at the middle of the body, rising slightly to the right, a little shorter
      part: the bird's middle wing feather bar
    - where: a line across at the lower body, rising slightly to the right
      part: the bird's lower wing feather bar
    - where: a vertical on the right, from the upper bar down to the branch
      part: the bird's wing edge
    - where: a long line across the bottom of the right half
      part: the branch the bird stands on

羅:
  object: a silk net held open to catch a bird, a skein of silk thread beside it
  history: >-
    An ideogram: a net 罒 made of silk 糹 to catch a bird 隹. The net is drawn as a closed frame with
    cords inside.
  layout: >-
    At the top of the square a net is held open on a frame of rope, two cords hanging inside it. Below
    on the left hangs a twisted skein of pale silk thread, and on the right a small bird stands
    underneath the net, facing left, with an eye, a beak and a crest, on a perch. Soft blues and
    creams, pale threads.
  exact:
    - The net's frame is a short slanting left post, a long top rope that turns down to the left at the right end, and a bottom cord closing it.
    - The two hanging cords inside touch the top rope and the bottom cord; the left one is a small dot-like stroke.
    - The net's top rope is the longest across stroke of the net, about one third wider than the bottom cord.
    - The silk's three small strokes at the bottom stand free, a falling stroke at the left, a dot in the middle and a dot at the right.
    - The silk's first loop ends on the middle of the second loop, and the second loop ends where the knot dot ends.
    - The bird's tall vertical is the longest vertical stroke; its feather bars are similar in length; the wing edge crosses the two lower bars.
    - The perch touches the middle of the bird's tall vertical and the wing edge.
  strokes:
    - where: a short stroke at the top left slanting down to the right
      part: the net frame's left post
    - where: a long line across the top, starting at the post, turning down to the left at the right end
      part: the net's top rope and its right post
    - where: a small dot in the upper middle, slanting down
      part: the net's left cord
    - where: a short vertical to the right of it
      part: the net's right cord
    - where: a line across the bottom of the net, rising slightly to the right
      part: the net's bottom cord
    - where: a stroke in the left half under the net, sweeping down to the right then down to the left, then turning across rising slightly to the right
      part: the first loop of the silk skein
    - where: a longer stroke below it, sweeping down to the left, then turning up to the right
      part: the second loop of the silk skein
    - where: a small dot at the end of the second loop, slanting down to the right
      part: the silk's knot
    - where: a short falling stroke at the bottom left, down to the right
      part: the silk's left loose end
    - where: a small dot beside it, slanting down to the right
      part: the silk's middle loose end
    - where: a small dot beside that, slanting down to the right
      part: the silk's right loose end
    - where: a stroke at the upper left of the bird, falling to the right and then to the left
      part: the bird's head and neck
    - where: a long vertical down the bird's middle, starting on the neck
      part: the bird's body and legs
    - where: a small dot at the upper right of the bird, slanting down to the right
      part: the bird's crest tuft
    - where: a line across at the upper body, rising slightly to the right
      part: the bird's upper wing bar
    - where: a line across at the middle body, rising slightly to the right
      part: the bird's middle wing bar
    - where: a line across at the lower body, rising slightly to the right
      part: the bird's lower wing bar
    - where: a vertical on the right, from the upper bar down to the perch
      part: the bird's wing edge
    - where: a long line across the bottom of the right half
      part: the perch

爆:
  object: a violent man who sets off a leaping flame that bursts
  history: >-
    An ideogram: a violent man 暴 and fire 火; 暴 also gives the sound. The first 暴 drew a man
    tormenting a deer.
  layout: >-
    On the left a big flame leaps up with a spark flying off at each side. On the right a brutal man
    stands over a small deer, his round bright head with a scowling face, his arms flung wide, his legs
    planted apart and the cowering deer between his feet. The man wears a simple pale tunic. Warm
    pale oranges for the flame, soft colours for the man.
  exact:
    - The flame's long sweep is the longest stroke of the left half; the short falling stroke starts at its middle.
    - The flame's two sparks stand free of each other; the right spark is a short sweep ending on the flame.
    - The man's head is a closed box with a short middle bar; its top bar turns down at the right.
    - The line across the shoulders is about two thirds of the long arm line below it, and the two short downward strokes cross the shoulder line and end on the arm line.
    - The arm line is the longest across stroke; the left leg sweeps down and out to the left, the right leg turns across at its end.
    - The deer's body stroke is long and ends in a small hook up to the left, free of the man.
    - The deer's two small strokes at the left are a dot and a rising stroke; they do not touch the body.
  strokes:
    - where: a short vertical at the middle left of the flame
      part: the left spark of the flame
    - where: a short stroke falling to the left at the upper right of the left half
      part: the right spark of the flame
    - where: a long sweep from the top centre of the left half down to the bottom left, turning down to the left
      part: the left edge of the big flame, from tip to base
    - where: a short stroke falling to the right from the middle of the long sweep
      part: the right edge of the flame
    - where: a short vertical on the left of the head box
      part: the left side of the man's head
    - where: a line across the top of the head, rising, turning down at the right
      part: the top of the head and the right side of the face
    - where: a short line across the middle of the head, rising slightly to the right
      part: the band across the face
    - where: a short line across the bottom of the head, rising slightly to the right
      part: the man's chin
    - where: a line across just below the head, rising slightly to the right
      part: the man's shoulders
    - where: a short vertical on the left, crossing the shoulder line
      part: the man's left upper arm
    - where: a short vertical on the right, crossing the shoulder line
      part: the man's right upper arm
    - where: the longest line across, below the shoulders
      part: the man's arms flung wide
    - where: a sweep from the middle of the arm line down and out to the left
      part: the man's left leg
    - where: a stroke from the arm line down to the right, then turning across to the right
      part: the man's right leg
    - where: a long stroke below the centre, sloping down to the right then down, ending in a small hook up to the left
      part: the deer's neck and body
    - where: a small dot to the left of the deer's body, slanting down to the right
      part: the deer's left ear
    - where: a short stroke at the bottom left rising to the right
      part: the deer's front leg
    - where: a small stroke to the right of the body, slanting down to the left
      part: the deer's right ear
    - where: a stroke at the lower right falling to the right
      part: the deer's back leg

蘇:
  object: grass above, a fish and a stalk of grain below, plants and animals that revive each year
  history: >-
    An ideogram: grass 艹 over 穌, a fish 魚 and a stalk of grain 禾; 穌 also gives the sound. The
    fish and the grain are the things that come back each year.
  layout: >-
    Two tufts of grass lie across the top. Below on the left a fish swims upright with its head up and
    its tail down, scales on its body. Below on the right a tall stalk of grain stands with its heavy
    ear drooping to the left, a plain stalk, leaves across and two leaves low. Soft pale greens, blues
    and golds.
  exact:
    - The left grass tuft is a short slanting stalk crossing a longer bar; the bar is a little longer than the slanting stalk.
    - The right grass tuft is a stalk turning down from the top, with a bar touching its middle; the bar is a little shorter than the left tuft's bar.
    - The two grass tufts do not touch.
    - The fish's head is a short sweep with a hat-shaped stroke over it; its body is a closed box with a cross inside.
    - The fish's body is closed at the bottom; the vertical inside it crosses the band across.
    - The four tail dots stand free of the body and of each other; the first is a short vertical, the others dots.
    - The grain stalk is the longest vertical stroke of the square; the leaf bar across it is the longest across stroke; the left leaf starts where the stalk and the bar cross and does not touch the right leaf.
    - The grain's stalk is a straight vertical ending in a plain point, with no hook.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: the left grass tuft's stalk
    - where: a line across the upper left, rising slightly, crossing the stalk
      part: the left grass tuft's blade bar
    - where: a short stroke at the upper right turning down
      part: the right grass tuft's stalk
    - where: a line across the upper right, touching the middle of that stalk
      part: the right grass tuft's blade bar
    - where: a short stroke at the top of the fish, sweeping down then down to the left
      part: the fish's left cheek
    - where: a stroke across the top of the fish, turning down to the left at its end
      part: the fish's head and gill
    - where: a short vertical at the fish's body, down the left
      part: the fish body's left side
    - where: a stroke across the top of the body, rising slightly to the right, turning down at the right
      part: the fish body's top and right side
    - where: a short line across the middle of the body, rising slightly to the right
      part: a band across the fish's scales
    - where: a short vertical in the middle of the body
      part: the fish's backbone line
    - where: a short line at the bottom of the body, rising to the right
      part: the fish body's base
    - where: a vertical at the bottom left
      part: the fish's tail fin on the left
    - where: a small dot beside it
      part: the fish's lower fin on the left
    - where: a small dot beside that, slanting down to the right
      part: the fish's lower fin in the middle
    - where: a small dot at the right, slanting down to the right
      part: the fish's tail fin on the right
    - where: a stroke at the top of the right half, running to the left then turning down to the left
      part: the grain's heavy ear, drooping
    - where: a line across the middle of the right half, rising slightly to the right, crossing the stalk
      part: the grain's leaf bar
    - where: a long straight vertical down the middle of the right half, the longest vertical of the square
      part: the grain's stalk
    - where: a sweep from the centre of the stalk down to the lower left
      part: the grain's left low leaf
    - where: a stroke from the stalk down to the right, then across to the right
      part: the grain's right low leaf

變:
  object: a man stirring up rebellion, with a shouting mouth amid tangled threads
  history: >-
    An ideogram: rebellion 䜌 stirred up by a hand with a stick 攵, to change things. 䜌 drew words
    tangled among silk threads.
  layout: >-
    In the upper half, in the middle, a shouting mouth with lines of speech above it; on each side a
    twisted skein of tangled silk thread hangs. In the lower half a man with a friendly but bold face,
    eyes, a nose and a mouth, wearing a simple pale tunic, raises one arm and strides out to the
    right, stirring things up. Pale reds and creams.
  exact:
    - The speech's two lines are short and rise slightly to the right; the first is the shortest, the second a little longer.
    - The mouth is three strokes, a left side, a top with the right side, and a small base dot; the base dot ends on the right side.
    - The two skeins stand free of the mouth and of each other.
    - Each skein has a long hooked loop, a second loop crossing down, and three dots; the left skein's first loop ends on the middle of its second.
    - The man's arm line is the longest across stroke; the body stroke starts on the arm line and is the longest vertical.
    - The man's right leg crosses the body stroke and is the longest stroke of all.
    - The man's raised arm and the arm line touch.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: a spark of speech
    - where: a line across under it, rising slightly to the right
      part: the first line of speech
    - where: a shorter line across below it, rising slightly to the right
      part: the second line of speech
    - where: a short line across below that, rising slightly to the right
      part: the third line of speech
    - where: a short stroke at the left of the mouth, slanting down to the right
      part: the mouth's left side
    - where: a stroke across the top of the mouth, rising slightly, turning down at the right
      part: the mouth's top and right side
    - where: a small dot across the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip
    - where: a stroke at the upper left, sweeping down to the right then down to the left, ending in a small hook to the right
      part: the left skein's first loop
    - where: a longer stroke below it, sweeping down to the left, then turning up to the right
      part: the left skein's second loop
    - where: a small dot at the end of the loops, slanting down to the right
      part: the left skein's knot
    - where: a small dot at the lower left of the skein, slanting down to the right
      part: the left skein's first loose end
    - where: a small dot beside it, slanting down to the right
      part: the left skein's second loose end
    - where: a small dot beside that, slanting down to the right
      part: the left skein's third loose end
    - where: a stroke at the upper right, running down, then turning across to the right
      part: the right skein's first loop
    - where: a longer stroke below it, sweeping down to the left, then turning across, rising slightly to the right
      part: the right skein's second loop
    - where: a small dot at the upper right of the skein, slanting down to the right
      part: the right skein's knot
    - where: a small dot at the lower middle of the skein, slanting down to the right
      part: the right skein's first loose end
    - where: a small dot beside it, slanting down to the right
      part: the right skein's second loose end
    - where: a short stroke at the right of the skein, slanting down to the right
      part: the right skein's third loose end
    - where: a sweep at the upper left of the lower half, falling to the left
      part: the man's raised arm
    - where: the longest line across the lower half, rising slightly to the right
      part: the man's shoulders and arm line
    - where: a long stroke from the middle of the arm line down, then turning down to the left
      part: the man's body and left leg
    - where: a long stroke from the left of the arm line down to the right, then across to the right
      part: the man's right leg, striding out
