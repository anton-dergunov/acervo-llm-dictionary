# Full run, group g1, batch 19. Written from the fact sheets, following scripts/GUIDE.md.

断:
  object: an axe cutting a bundle of grain, the stalks of the grain on the left and the axe on the right
  history: >-
    An ideogram: an axe 斤 and grain 米 beside it; the axe cuts the grain through, so to sever. The
    old forms drew threads cut by the axe, and the modern simplified form keeps the grain.
  layout: >-
    The left half holds a bundle of grain: pale golden ears on stalks, tied with a band that wraps
    round its left side and its bottom. The right half holds an upright axe with a long straight
    handle, its blade turned toward the grain, as if about to cut it. Colours are pale: straw yellow
    for the grain, light grey for the blade, light brown for the handle.
  exact:
    - The grain has a line across and a long line down that cross; the sweep to the lower left and the dot to the lower right both start on that crossing, and they do not touch each other.
    - The two small strokes at the top of the grain, the dot at the upper left and the short sweep at the upper right, stand free of every other stroke, with small gaps.
    - The band round the bundle stands free of every stroke of the grain, with a small gap all along its left and bottom.
    - The axe's top stroke ends exactly where the long sweeping stroke begins; the stroke across starts on the long sweeping stroke, and the handle starts on the middle of the stroke across.
    - The axe handle is a straight line down with a plain point at the bottom, no hook, about as long as the long vertical of the grain.
    - The short sweep at the upper right of the grain is about half as long as the sweep to the lower left.
  strokes:
    - where: a dot at the upper left of the left half, slanting down to the right
      part: a grain of the bundle's upper left ear
    - where: a short stroke at the top centre of the left half, slanting down to the left
      part: a grain of the bundle's upper right ear
    - where: a line across the middle of the left half, rising a little to the right
      part: the bundle's crossbar of stalks
    - where: a long straight line down the middle of the left half, from the top to the bottom, crossing the line across
      part: the bundle's central stalk
    - where: a sweep from the centre of the central stalk down to the bottom left
      part: the grain's stalk spreading to the lower left
    - where: a short dot-like stroke at the centre, to the right of the central stalk, slanting down to the right
      part: the grain's stalk spreading to the lower right
    - where: a long stroke starting at the upper left, running down the left edge and turning to run across the bottom, rising a little to the right
      part: the band wrapped round the bundle's left and bottom
    - where: a short stroke across the top of the right half, running left, then turning down to the left
      part: the axe head's top edge
    - where: a long stroke from the top centre of the right half, running down and turning to sweep down to the bottom left
      part: the axe's long cutting edge, facing the grain
    - where: a line across the right half, rising a little to the right, starting on the long sweeping stroke
      part: the axe head's neck, where it joins the handle
    - where: a long straight line down the right half, from the middle of the line across to the bottom
      part: the axe's handle

斷:
  object: an axe cutting a bundle of grain, the stalks of the grain on the left and the axe on the right
  history: >-
    An ideogram: an axe 斤 and grain 米 beside it; the axe cuts the grain through, so to sever. The
    old forms drew threads cut by the axe, and the modern simplified form keeps the grain.
  layout: >-
    The left half holds two rows of small twisted skeins of thread, two skeins in each row, with a
    straight cut line across between the rows, and a long cord looping down the left side and along
    the bottom beneath them. The right half holds an upright axe with a long straight handle, its
    blade turned toward the threads, as if about to cut them. Colours are pale: soft cream for the
    thread, light grey for the blade, light brown for the handle.
  exact:
    - Each skein is a small loop of thread, made of a stroke down ending in a short hook to the right, a stroke down to the left ending in a short hook to the right, and a small dot; the two skeins of a row stand close side by side and do not touch each other.
    - In the upper row the first stroke of the left skein ends on the middle of its second stroke, and the second stroke ends where the dot ends; in the right skein the first stroke ends on the middle of the second stroke, and the second stroke ends where the dot begins.
    - The cut line across is the longest line on the left; the two lower skeins hang from it, the right one starting on its middle, the left one starting at its left end.
    - The long cord stands free of every other stroke, with a small gap to the skeins and the cut line all along the left and the bottom.
    - The axe's top stroke ends exactly where the long sweeping stroke begins; the stroke across starts on the long sweeping stroke, and the handle starts on the middle of the stroke across.
    - The axe handle is a straight line down with a plain point at the bottom, no hook; it is clearly longer than the strokes of the skeins.
  strokes:
    - where: a short line down at the upper left of the left half, ending in a small hook to the right
      part: the upper left skein's first twist of thread
    - where: a short sweep down to the left at the upper left, starting beside the first stroke and ending in a small hook to the right
      part: the upper left skein's second twist of thread
    - where: a small dot beside the lower end of the second twist, slanting down to the right
      part: the upper left skein's loose end
    - where: a short line down at the upper centre of the left half, ending in a small hook to the right
      part: the upper right skein's first twist of thread
    - where: a short sweep down to the left beside it, ending in a small hook to the right
      part: the upper right skein's second twist of thread
    - where: a small dot at the lower end of the second twist, slanting down to the right
      part: the upper right skein's loose end
    - where: a long line across the middle of the left half, rising a little to the right
      part: the cut line the axe makes
    - where: a short stroke from the left end of the cut line, running down and turning to the right
      part: the lower left skein's first twist of thread
    - where: a short sweep down to the left starting on the middle of the first twist, ending in a small hook to the right
      part: the lower left skein's second twist of thread
    - where: a small dot at the lower end of the second twist, slanting down to the right
      part: the lower left skein's loose end
    - where: a short stroke from the middle of the cut line, running down and turning to the right
      part: the lower right skein's first twist of thread
    - where: a short sweep down to the left starting at the end of the first twist, ending in a small hook to the right
      part: the lower right skein's second twist of thread
    - where: a small dot at the lower end of the second twist, slanting down to the right
      part: the lower right skein's loose end
    - where: a long stroke starting at the upper left, running down the left edge and turning to run across the bottom, rising a little to the right
      part: the long cord looping round the threads' left side and bottom
    - where: a short stroke across the top of the right half, running left, then turning down to the left
      part: the axe head's top edge
    - where: a long stroke from the top centre of the right half, running down and turning to sweep down to the bottom left
      part: the axe's long cutting edge, facing the threads
    - where: a line across the right half, rising a little to the right, starting on the long sweeping stroke
      part: the axe head's neck, where it joins the handle
    - where: a long straight line down the right half, from the middle of the line across to the bottom
      part: the axe's handle

條:
  object: a person on the left holding up a tally stick to count, beside a slender young tree
  history: >-
    An ideogram: a person 亻 counting with a stick 丨, giving a clause or a list; the tree-like part 条 gives
    the sound and means a twig or strip.
  layout: >-
    A friendly person with a face (eyes, nose, mouth) and simple pale clothes stands at the left,
    facing right, looking at a short upright tally stick that floats in the middle. At the right
    stands a slender young tree with a few drooping boughs, its pale green crown behind the strokes.
    Colours are pale: light blue clothes, pale wood for the stick.
  exact:
    - The person is two strokes, namely the long sweep, and a straight line down that starts on the middle of that sweep and ends in a plain point at the bottom.
    - The tally stick stands free of every other stroke and is a little over half as long as the person's straight line down.
    - The tree's two upper boughs both start on the first bough; the sweep hanging down crosses the long stroke reaching to the right.
    - The tree's trunk crosses the line across and ends in a small hook to the left.
    - The two short strokes at the foot of the tree stand free of every other stroke; the left one slants down to the left, the right one slants down to the right.
    - The line across the lower tree is about the same length as the long stroke reaching to the right; the upper line across is a little shorter, about four fifths as long.
  strokes:
    - where: a long stroke from the top, running down and turning into a sweep down to the bottom left
      part: the person's head and back, running down into one leg
    - where: a straight line down in the left part, starting on the middle of the sweep
      part: the person's other leg, standing straight
    - where: a short straight line down in the middle, shorter than the person
      part: the tally stick
    - where: a short stroke at the top of the right part, running down and turning to sweep down to the left
      part: the tree's first drooping bough
    - where: a line across the upper right, rising a little to the right, starting on the middle of the first bough
      part: the tree's upper bough, reaching right
    - where: a stroke starting on the upper bough, running down and turning to sweep down to the left
      part: the tree's bough hanging down in the middle
    - where: a long stroke from the first bough, falling down to the right and turning to run out across to the right
      part: the tree's long bough reaching out to the right
    - where: a line across the lower middle of the right part, rising a little to the right
      part: the tree's lower line of branches
    - where: a long line down from the middle of the right part, crossing the line across and ending in a small hook to the left
      part: the tree's trunk
    - where: a short stroke at the foot of the tree, slanting down to the left
      part: a small root on the left
    - where: a short stroke at the foot of the tree, slanting down to the right
      part: a small root on the right

望:
  object: a king standing on the ground and gazing up at the moon, with a small shelter beside the moon
  history: >-
    An ideogram: a king 王 gazing at the moon 月. The oldest forms drew a person standing on the
    ground with raised eyes; the part 亡 gives the sound.
  layout: >-
    The king stands at the bottom, facing up and to the right, with a face (eyes, nose, mouth), a
    pale crown and a simple long robe; his arms are stretched out. In the upper right a pale
    crescent moon, curved on its right side, hangs in the sky. At the upper left stands a small
    pale shelter with a lid-like roof. Colours are pale: soft gold for the crown, light blue for the
    robe, pale yellow for the moon.
  exact:
    - The king is the bottom four strokes, namely a short line across the top, a middle line across, a straight line down from the top line to the bottom line, and the longest line across at the bottom.
    - The top line and the middle line are each about half as long as the bottom line, the middle one very slightly longer.
    - The straight line down starts on the top line, crosses the middle line and ends on the bottom line.
    - The moon's left side is the longest vertical stroke; the moon's outer stroke starts at its top, runs across and turns down, ending in a small hook to the left.
    - The two short lines inside the moon start on its left side and stop short of its right side; they do not touch the outer stroke.
    - The shelter's last stroke starts on the middle of the roof line and turns up to the right at its end.
    - The dot at the top of the shelter stands free of every other stroke.
  strokes:
    - where: a small dot at the top of the upper left, slanting down to the right
      part: the peak of the shelter's roof
    - where: a line across the upper left, rising a little to the right
      part: the shelter's roof line
    - where: a stroke starting on the middle of the roof line, running down and then turning up to the right at the bottom
      part: the shelter's wall, ending in its floor
    - where: a long straight line down in the upper right, on the left side of the moon
      part: the moon's left edge
    - where: a stroke starting at the top of the moon's left edge, running across to the right then turning down, ending in a small hook to the left
      part: the moon's top and its right edge, the crescent
    - where: a short line across the moon, starting on its left edge and rising a little to the right
      part: the moon's upper glow band
    - where: a short line across the moon below it, starting on its left edge and rising a little to the right
      part: the moon's lower glow band
    - where: a line across the top of the lower half, rising a little to the right
      part: the sky overhead the king
    - where: a line across the middle of the lower half, to the right, a little longer than the line above
      part: the king's arms, stretched out
    - where: a straight line down from the middle of the top line to the bottom line
      part: the king's body, standing
    - where: a long line across the bottom, the longest line of the figure
      part: the earth under the king's feet

族:
  object: a group of people standing together under one flag, swearing by an arrow
  history: >-
    An ideogram: a flag 方 and an arrow 矢; people who swear by one flag and one arrow are one clan.
    The oldest forms drew an arrow beneath a banner.
  layout: >-
    The left half shows a banner on a pole, with its cloth hanging down. At the upper right a small
    pennant flies. At the lower right stands a person with a friendly face (eyes, nose, mouth) and
    simple pale clothes, facing left toward the banner, holding an arrow upright over the head and
    arms stretched wide. Colours are pale: light red for the banner, light blue for the clothes.
  exact:
    - The banner is separate from the person; the small pennant at the upper right does not touch the person, with a small gap.
    - The banner's first dot stands free of every other stroke, at the top of the pole.
    - The banner's sweep to the lower left starts on the middle of the line across; the cloth stroke starts at the start of that sweep.
    - The cloth stroke runs across to the right, turns down, and ends in a small hook up to the left.
    - The pennant's lower line starts on the middle of its first stroke.
    - The person's two short strokes at the top (the arrow's tip and its barb) touch, namely the barb starts on the middle of the tip stroke.
    - The long line across the person (the arms) is crossed by the person's long sweep to the lower left; the stroke to the lower right starts on both the arms and that sweep.
    - The line across of the banner is about three quarters as long as the person's arms; the person's arms are the longest line across.
  strokes:
    - where: a dot at the top of the left half, slanting down to the right
      part: the top of the banner's pole
    - where: a line across the middle of the left half, rising a little to the right, shorter than the arms of the person
      part: the banner's top edge
    - where: a stroke starting low in the left half, running across to the right then turning down, and ending in a small hook up to the left
      part: the banner's cloth, hanging with a folded border on its right
    - where: a sweep from the middle of the line across down to the bottom left
      part: the banner's trailing tail
    - where: a stroke at the top of the right half, running down and turning to sweep down to the left
      part: the pennant's pole and its streamer
    - where: a line across the upper right, rising a little to the right, starting on the middle of the pennant's stroke
      part: the pennant's flag, flying to the right
    - where: a short sweep down to the left, in the centre of the right half
      part: the tip of the arrow held above the person's head
    - where: a short line across, rising a little to the right, starting on the middle of the tip
      part: the barb of the arrow
    - where: a long line across the lower half of the right side, the longest line across
      part: the person's arms, stretched wide
    - where: a long stroke from the middle of the barb, running down and turning to sweep out to the bottom left, crossing the arms
      part: the person's body and left leg
    - where: a stroke from the crossing of the arms and the sweep, falling to the lower right, then turning out to the right
      part: the person's right leg

率:
  object: a string pulled tight on a cross-shaped instrument, vibrating, under a lid-like top bar
  history: >-
    An ideogram: a string 幺 stretched on an instrument 亠十. The oldest forms drew a string with
    little marks on both sides for its vibration.
  layout: >-
    A pale wooden instrument fills the lower half: a long crosspiece and a post. Above it a lid-like
    top bar with a peg on top. A thin pale string hangs from the top bar and is stretched to the
    post, and small marks of vibration quiver to its left and its right. Colours are pale: warm
    wood for the instrument, cream for the string.
  exact:
    - The peg above the top bar stands free of it, with a small gap.
    - The string is made of three strokes, namely a short stroke down turning right (starting on the middle of the top bar), a longer sweep to the lower left turning to run across (starting on the end of the first stroke's turn), and a short stroke to the lower right ending on the sweep.
    - The post starts on the middle of the string's sweep, crosses the long crosspiece, and ends in a plain point at the bottom, no hook.
    - The four small vibration marks stand free of every stroke, namely two on the left, two on the right.
    - The top bar is about half as long as the long crosspiece, which is the longest line.
    - The post is the longest vertical stroke, much longer than the string's first stroke.
  strokes:
    - where: a small dot at the very top centre, slanting down to the right
      part: the peg on the instrument's top
    - where: a line across the top, rising a little to the right, about half as long as the crosspiece below
      part: the instrument's top bar
    - where: a short stroke from the middle of the top bar, running down then turning to the right
      part: the string leaving the top bar
    - where: a long stroke starting at the top centre, sweeping down to the left and then turning to run across, rising a little to the right
      part: the string stretched taut
    - where: a short stroke to the lower right, ending on the string
      part: the string's loose end
    - where: a small dot at the upper left, slanting down to the right
      part: a vibration mark at the upper left of the string
    - where: a short stroke at the left, rising to the right
      part: a vibration mark at the lower left of the string
    - where: a short sweep down to the left at the upper right
      part: a vibration mark at the upper right of the string
    - where: a short stroke falling down to the right at the right
      part: a vibration mark at the lower right of the string
    - where: a long line across the lower part, the longest line
      part: the instrument's crosspiece
    - where: a straight line down from the middle of the string's sweep, crossing the crosspiece to the bottom
      part: the instrument's post

深:
  object: a deep pit on the right, with a tree standing in its depths under a rocky cover, and water beside it on the left
  history: >-
    An ideogram: deep 罙 water 氵. The oldest forms drew water with a cave or pit that goes far
    down; the modern form puts the water beside the deep part.
  layout: >-
    The left strip shows deep pale blue water with two splashes and a swelling current. The right
    shows a deep rocky pit: its cover arches across the top, under it two small stones hang, and far
    below stands a tree on the pit's floor. Colours are pale: blue for the water, light grey for the
    rock, soft green for the tree.
  exact:
    - The three water strokes stand free of every other stroke, namely two short strokes slanting down to the right at the upper left, and one long stroke rising from the bottom left.
    - The cover is two strokes whose tops start at the same point, namely a short stroke down, and a line across that turns down at its right end with a small hook to the left.
    - The two stones stand free of every stroke, namely a short stroke turning to the left, and a short stroke slanting down to the right.
    - The tree's line across and its trunk cross; its two branches start on that crossing, side by side, and do not touch each other.
    - The trunk is a straight vertical ending in a plain point, no hook, and is the longest vertical; the line across is the longest line across.
    - The right branch of the tree turns out to the right at its end.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: a splash of water, upper
    - where: a dot lower in the left strip, slanting down to the right
      part: a splash of water, lower
    - where: a long stroke at the bottom left, rising up to the right
      part: the swelling current
    - where: a short stroke down at the upper left of the right half
      part: the cover's left edge
    - where: a line across the top of the right half, starting where the cover's left edge starts, turning down at the right with a small hook to the left
      part: the rocky cover's top and its right edge
    - where: a short stroke below the cover, down and turning to the left
      part: a small stone hanging under the cover, left
    - where: a short stroke below the cover, slanting down to the right
      part: a small stone hanging under the cover, right
    - where: a long line across the middle of the right half
      part: the tree's branches
    - where: a long straight line down the middle of the right half, from above the line across to the bottom
      part: the tree's trunk
    - where: a sweep from the crossing down and out to the bottom left
      part: the tree's root, spreading left
    - where: a stroke from the crossing, falling down to the right and then turning out to the right
      part: the tree's root, spreading right

夢:
  object: a sleeper at night, the two eyes shut, a blanket over, and a crescent moon outside
  history: >-
    An ideogram: eyes shut at night. The oldest forms drew a person lying in bed with a large eye
    and a night moon.
  layout: >-
    A sleeping person lies at the centre, with a round pale face (a nose, a calm mouth) and a
    simple night-shirt. Above the face two closed eyes; below them the closed lids as a frame. A
    pale blanket is drawn over the person, and below it hangs a crescent moon, curved on its right,
    with a small star in its hollow. Colours are pale: blue night colours, pale yellow moon.
  exact:
    - The two eyes at the top are two small crosses, each a short line down crossed by a line across; the left one crosses its line across in the middle; the right one stands at the right, with its line across starting on its stroke.
    - The lid frame is a left side, a top that turns down to the left at the right end, two small marks inside, and a bottom line that joins the end of the left side and the end of the top.
    - The blanket has a short line down on the left and a long line across that ends in a small hook to the left; the line across starts on the line down.
    - The moon is two strokes, namely a sweep that starts on the blanket and a stroke across that turns into a long sweep down to the left; the star dot touches the long sweep and stands apart from the first.
    - The blanket's line across is the longest line.
  strokes:
    - where: a short line down at the upper left
      part: the left eye's lid line
    - where: a short line across at the upper left, crossing the line down
      part: the left eye's lashes across
    - where: a short stroke down at the upper right, slanting a little down to the right
      part: the right eye's lid line
    - where: a short line across at the upper right, starting on the middle of the line down
      part: the right eye's lashes across
    - where: a short stroke at the left side of the lids, slanting down to the right
      part: the frame of the lids, left side
    - where: a stroke from the upper left of the frame, running across and turning down to the left
      part: the frame of the lids, top and right side
    - where: a small dot inside the frame, slanting down to the right
      part: a lash mark inside the lids, left
    - where: a short line down inside the frame
      part: a lash mark inside the lids, right
    - where: a short line across at the bottom of the frame
      part: the frame of the lids, bottom
    - where: a short line down at the left, below the lids
      part: the blanket's left edge
    - where: a long line across below the lids, ending in a small hook to the left, starting on the blanket's edge
      part: the blanket's top and its right edge
    - where: a sweep from the middle of the blanket down to the lower left
      part: the moon's upper horn
    - where: a stroke starting at the middle, running across to the right then sweeping down to the lower left
      part: the moon's curve
    - where: a small dot inside the moon, slanting down to the right
      part: a small star in the moon's hollow

