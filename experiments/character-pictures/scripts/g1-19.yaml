    - where: a long straight line down the left half
      part: the left eye's long central lash
    - where: a sweep from the centre of the left line down to the bottom left
      part: the left eye's lash, spreading left
    - where: a short dot-like stroke beside the left line, slanting down to the right
      part: the left eye's short lash
    - where: a line across the upper part of the right half
      part: the right shut eye's lid
    - where: a long straight line down the right half
      part: the right eye's long central lash
    - where: a sweep from the centre of the right line down to the left
      part: the right eye's lash, spreading left
    - where: a sweep from the centre of the right line down and out to the bottom right
      part: the right eye's lash, spreading right
    - where: a stroke starting at the middle, running down and then sweeping to the lower left
      part: the moon's upper horn
    - where: a stroke starting on the first, running across to the right and then sweeping down to the lower left
      part: the moon's curve
    - where: a small dot inside the moon, slanting down to the right
      part: a small star in the moon's hollow

習:
  object: two birds flying together in the daytime, with a bright sun below them
  history: >-
    An ideogram: birds' wings 羽 over the bright day 白. The oldest forms drew a young bird beating
    its wings in the sun, learning to fly.
  layout: >-
    Two small birds fly side by side across the upper part of the square, each with a round body, an
    eye and a beak drawn behind its wing. Below them hangs a bright round sun with a small ray at the
    top. Colours are pale: soft blue sky glow, pale golden sun, cream and light brown for the birds.
  exact:
    - Each bird has a wing made of a long stroke across turning down, a dot and a short stroke rising to the right; all stand free of each other with small gaps.
    - The sun's ray stands separate from the sun's left side with a small gap; its end meets the start of the sun's top.
    - The sun's top starts at the top of its left side, runs across and turns down on the right, and ends where the bottom line ends.
    - The sun has an upper glow band that starts on its left side and stops short of the right side, and a bottom line that starts on the left side and ends on the right side.
    - The bottom line is longer than the upper band, about four fifths of the sun's top line.
  strokes:
    - where: a stroke across the upper left, running across to the right then turning down
      part: the left bird's wing
    - where: a small dot in the left wing, slanting down to the right
      part: a feather of the left wing
    - where: a short stroke at the lower left of the left wing, rising to the right
      part: the left bird's lower feather
    - where: a stroke across the upper right, running across to the right then turning down
      part: the right bird's wing
