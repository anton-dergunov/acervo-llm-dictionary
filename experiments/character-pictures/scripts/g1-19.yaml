      part: the stack's left side
    - where: a long stroke starting at the left corner, running across to the right and turning down
      part: the stack's outline, top and right side
    - where: a straight line down in the left of the stack, crossing the outline
      part: a crease of the stack, left
    - where: a stroke from the top line, slanting down to the right and then down, crossing the outline
      part: a crease of the stack, right
    - where: a line across at the bottom of the stack, rising a little to the right
      part: the stack's lower edge, where it sits on the altar
    - where: a short line across, in the upper altar
      part: the offering slab
    - where: a long line across, the longest line
      part: the altar's table
    - where: a stroke from the middle of the table, running down and turning to the left
      part: the altar's post
    - where: a short stroke slanting down to the left, at the lower left
      part: the altar's left foot
    - where: a short stroke slanting down to the right, at the lower right
      part: the altar's right foot

堅:
  object: a stern guard behind a rampart of earth, one eye wide open and a hand on the wall
  history: >-
    An ideogram: a stern 臤 fortification 土; the oldest forms drew a watching eye and a hand, over
    earth.
  layout: >-
    At the top a stern guard's face with a frown, a nose and a firm mouth, with simple pale armour.
    The left of his face is a large upright eye; at the right his hand rests on the wall. Below him
    rises the rampart: a mound of earth with a ridge. Colours are pale: warm grey for the armour,
    light brown for the earth.
  exact:
    - The eye is made of a long outline, running down the left and along the bottom, a top lid line starting on it, two inner lines meeting at the right, and two small ticks.
    - The two inner lines of the eye start on the outline and meet at their right ends; the upper tick ends on the first inner line and the lower tick starts on the second.
    - The hand is two strokes that cross, namely a stroke across turning down to the left, and a stroke falling to the lower right and turning out to the right.
    - The rampart is a ridge line across, a short post down, and a long ground line; the post crosses the ridge and ends on the ground.
    - The ridge is about half as long as the ground line; the ground line is the longest line.
    - The post stands apart from the eye's outline, with a small gap.
  strokes:
    - where: a short line across the top of the eye, rising a little to the right
      part: the eye's upper lid
    - where: a small tick down, on the eye's lid
      part: the eye's upper crease
    - where: a line across, ending in a small hook down to the left
      part: the eye's iris frame, upper line
    - where: a shorter line across below, rising a little to the right
      part: the eye's iris frame, lower line
    - where: a small tick down below
      part: the eye's lower crease
    - where: a long stroke down the left and turning across along the bottom, rising a little to the right
      part: the eye's outline, left and lower lid
    - where: a stroke across the upper right, rising a little to the right and turning down to the left
      part: the hand's back and fingers, resting on the wall
    - where: a stroke falling to the lower right and turning out to the right
      part: the hand's thumb and palm
    - where: a line across the upper rampart, rising a little to the right
      part: the ridge of the mound
    - where: a short post from the middle, running down to the right and then down
      part: the post of the rampart
    - where: a long line across the bottom
      part: the ground of the rampart

章:
  object: a musician with arms stretched wide behind a drum on a cross-shaped stand
  history: >-
    An ideogram: a piece of music 音 of ten 十 movements; the oldest forms drew a voice with marks
    on a stand.
  layout: >-
    A musician with a friendly face (eyes, nose, mouth) and simple pale clothes stands at the top,
    arms stretched wide, a cap on his head. A round drum hangs in front of his chest. Below, a cross-
    shaped stand: a post under the drum and a crossbar at its foot. Colours are pale: soft blue
    clothes, cream drum, pale wood for the stand.
  exact:
    - The head is a dot, a line across, a dot and a short hooked stroke; the dots stand free of every other stroke.
    - The arms are the longest line across of the musician, much longer than the cap line; the head's last stroke ends on the arms.
    - The drum is a frame, namely a sweep down to the right, a stroke across turning down, and a lower line meeting its end; the sweep meets the frame's start.
    - The two drum bars start on the drum's left side and stop short of the right side.
    - The post starts on the drum's lower edge, crosses the crossbar and ends in a plain point at the bottom, no hook.
    - The crossbar is a little shorter than the arms, about six sevenths as long.
  strokes:
    - where: a dot at the top centre, slanting down to the right
      part: the musician's cap knob
    - where: a line across under the knob
      part: the cap's brim
    - where: a small dot at the left of the head
      part: the musician's left ear
    - where: a short stroke slanting down to the right and then to the left, at the right of the head
      part: the musician's right ear
    - where: a very long line across, the longest line across
      part: the musician's arms, stretched wide
    - where: a short stroke down to the right at the upper left of the drum
      part: the drum's left side
    - where: a stroke starting beside it, running across then turning down
      part: the drum's top and right side
    - where: a short bar across the middle of the drum, rising a little to the right
      part: the drum's upper band
    - where: a short bar lower across the drum, rising a little to the right
      part: the drum's lower band
    - where: a line across the lower part, nearly as long as the arms
      part: the stand's crossbar
    - where: a straight line down, from the drum's lower edge to the bottom
      part: the stand's post

鄉:
  object: two people hunched over a meal, a bowl of rice between them
  history: >-
    An ideogram: two people 乡 and 阝 hunched over a meal 良. The oldest forms drew two people
    kneeling face to face at a vessel of food.
  layout: >-
    A left person bows toward the middle, facing right, and a right person bows toward the middle,
    facing left. Both have friendly faces (eyes, nose, mouth) and simple pale clothes. Between them
    stands a bowl of rice with a few grains. Colours are pale: blue and light green clothes, cream
    rice.
  exact:
    - The left person is three strokes, each ending in a small hook up to the right except the last, which sweeps out to the lower left.
    - The left person's first stroke ends on the middle of the second stroke; the second stroke ends where the third begins.
    - The bowl's top dot stands free of every other stroke.
    - The bowl's two dots stand apart from the rim with small gaps; the rim and the bowl's left wall start at the same point.
    - The bowl's left wall runs down and ends in a hook up to the right; the foot dot touches the wall's middle from below.
    - The right person's long vertical starts at the start of the bent stroke; the bent stroke is the longer first leg and ends in a hook up to the left.
    - The right person's straight back is the longest vertical, as long as the bowl's wall and a little more.
  strokes:
    - where: a stroke down at the upper left, ending in a small hook up to the right
      part: the left person's head and neck, bowed
    - where: a stroke starting below it, sweeping down to the left and ending in a small hook up to the right
      part: the left person's hunched back
    - where: a long stroke starting at the middle, running down and then sweeping out to the bottom left
      part: the left person's body, kneeling
    - where: a small dot at the top centre, slanting down to the right
      part: a grain of rice, piled on top of the bowl
    - where: a stroke across the upper middle, turning down
      part: the bowl's rim and right wall
    - where: a small dot inside the bowl, rising a little to the right
      part: a grain of rice
    - where: a small dot inside the bowl, rising to the right, below it
      part: another grain of rice
    - where: a long stroke starting at the bowl's rim, running down and ending in a hook up to the right
      part: the bowl's left wall and base
    - where: a small dot at the lower right of the bowl, slanting down to the right
      part: the bowl's foot
    - where: a stroke across the upper right, turning down to the left, down to the right, and down to the left, ending in a hook up to the left
      part: the right person's bowed head and arms
    - where: a long straight line down on the right, starting on the first stroke
      part: the right person's straight back
