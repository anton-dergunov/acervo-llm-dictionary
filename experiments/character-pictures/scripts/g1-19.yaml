    - Both vertical lines are long and end in a plain point at the bottom, with no hook; the right one starts higher than the left.
    - The left eye's last stroke is a short dot just beside its vertical line, not a long sweep.
    - The right eye's two lower strokes both start where its vertical line crosses its line across, and they do not touch each other.
    - The two eyes do not touch each other.
    - The moon is two strokes, namely the first is a stroke down turning into a sweep down to the left; the second runs across and turns into a long sweep down to the left; the star dot starts on the first stroke.
  strokes:
    - where: a line across the upper part of the left half
