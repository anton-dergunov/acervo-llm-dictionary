# Full run, group g1 (the 1,000 most used characters). Written from the fact sheets
# (`run.py facts`), following scripts/GUIDE.md.

目:
  object: an eye, stood upright as the character stands it, with its lids as the frame and its iris between the two inner lines
  history: >-
    The oldest forms drew an eye lying on its side, with the iris in the middle. The modern form
    stood it upright, so the eye's corners are at the top and the bottom, and the iris became the
    two short lines inside.
  layout: >-
    One tall almond-shaped eye fills the frame from top to bottom. Its lids follow the frame's
    strokes, with thin, pale lashes along the outside of the left and right lids. The iris is a
    soft round shape, pale brown or blue, sitting between the two inner lines, with a mid-grey
    pupil and a white glint; nothing in it is black. Around the eye there is only white.
  exact:
    - The left side and the line across the bottom are separate strokes that meet at the bottom left corner.
    - The top and right side are one stroke, turning down at the top right corner and ending in a small hook to the left at the bottom.
    - The two inner lines touch the left side and stop short of the right side.
    - The three lines across are about the same length; the bottom one is a little longer than the two inside.
  strokes:
    - where: a line down the left side, from the top to the bottom
      part: the eye's left lid
    - where: a line across the top, turning down at the top right corner to run down the right side
      part: the eye's top corner and its right lid
    - where: a short line across the upper middle, from the left side
      part: the upper edge of the iris
    - where: a short line across the lower middle, from the left side
      part: the lower edge of the iris
    - where: a line across the bottom, closing the frame
      part: the eye's bottom corner, where the lids meet
