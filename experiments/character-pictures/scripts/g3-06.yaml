    bottom gripping them as a broom. Because a comet trails a bright tail across the sky like a
    sweeping broom, the character also came to mean a comet.
  layout: >-
    The upper half holds the two bushy bamboo stalks of the broom head standing side by side,
    surrounded by pale straw and soft yellow-green bamboo bristles behind the strokes. The lower
    half is a hand seen in profile, fingers curled to the left around the bound base of the broom,
    in pale skin tones.
  exact:
