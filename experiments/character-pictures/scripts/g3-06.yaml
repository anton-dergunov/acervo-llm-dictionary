巢:
  checked: argon
  object: three baby birds in a woven nest sitting at the top of a tree
  history: >-
    The oldest forms drew three young birds peeking above a woven basket-like nest set in the
    branches of a tree. In the modern form, the birds are the three angled strokes at the top, and
    the nest and tree below have merged so that the tree's trunk runs up through the middle of the
    nest.
  layout: >-
    At the top, three small pale yellow baby birds face left in a row, each formed by one of the
    three angled chevron strokes. Directly below them sits a pale brown woven twig nest in the upper
    middle of the frame. Below and behind the nest stands a tree with a pale green leafy crown, its
    central trunk rising straight through the nest to hold it up, its wide branches spreading out
    underneath the nest, and its roots spreading left and right at the base.
  exact:
    - The three angled strokes at the top stand side by side and do not touch one another or the nest below them; each slants down to the left and turns sharply to slant down to the right.
    - The nest's enclosure has a left side slanting slightly inward, a single stroke for its top rim and right side turning down at the top right, and a bottom line closing the box.
    - The short horizontal line inside the nest crosses the central vertical trunk and stops short of both the left and right sides of the nest.
    - The long horizontal branch line below the nest is the widest stroke, whereas the nest's top rim is about three fifths as wide.
    - The central vertical trunk starts at the middle of the nest's top rim, crosses the inner nest line, the nest base, and the long branch line, and ends at the bottom in a plain point with no hook.
    - The two lower sweeps start where the trunk crosses the long branch line and spread out to the bottom left and bottom right with a small gap between their starts.
  strokes:
