柊:
  checked: argon
  object: a holly tree on the left beside the winter sign of a knotted cord above two chunks of ice on the right
  history: >-
    An ideographic compound uniting a tree 木 on the left with winter 冬 on the right to name the
    holly, an evergreen tree of winter. The winter component 冬 originally drew a cord tied at the
    top to mark the end of the year, with two strokes of ice added below.
  layout: >-
    The tree stands in the narrower left third of the square, with a pale green crown of holly
    leaves behind its upper branches. The wider right two thirds hold the winter component: a pale
    tan knotted cord looped and crossed in the upper part, and two pale icy blue chunks of ice
    floating one above the other below it. The left and right components stand close beside each
    other without touching.
  exact:
    - The left part (the tree) is narrower than the right part (winter), which fills the right two thirds of the width.
    - The tree's trunk is a long straight vertical line ending in a plain point at the bottom, with no hook, and crosses the short line across.
    - The tree's left sweep starts where the trunk crosses the line across; the short dot on the right touches the trunk just below the crossing, leaving a tiny gap between the two lower strokes.
    - In the upper right part, the horizontal-and-sweep stroke and the long falling stroke below it both start on the middle of the top-left sweep, and cross each other in the middle.
    - The horizontal leg of the turning stroke on the right is a little under two thirds as long as the tree's line across.
    - The two slanted ice strokes at the bottom right stand completely free of the strokes above them and of each other, with the upper one shorter than the lower one, about two thirds as long.
  strokes:
    - where: a short line across the upper part of the left third, rising slightly to the right
      part: the holly tree's branches
    - where: a long straight line down the middle of the left third, ending in a plain point
      part: the holly tree's trunk
    - where: a sweep from the crossing of the trunk down and out to the bottom left
      part: the holly tree's left root
    - where: a short dot beside the trunk just below the crossing, slanting down to the right
      part: the holly tree's short right root
    - where: a sweep in the upper middle from the top down to the left
