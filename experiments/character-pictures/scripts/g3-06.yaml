侖:
  checked: argon
  object: a bound book of vertical bamboo slips gathered in order beneath a peaked roof cover
  history: >-
    An ideogrammic compound combining 亼 above, meaning to gather together under one cover, and 冊
    below, a bundle of bamboo slips tied together into a book. Gathering and ordering the bamboo
    slips gave the meaning of logical order and argument.
  layout: >-
    The upper half is a wide, peaked shelter roof with a short crossbeam tucked under its peak,
    spanning nearly the full width of the square. Beneath it in the lower half sits a narrower
    rectangular book made of vertical pale yellow-green bamboo slips held upright in a frame and
    bound across the middle by a cord. The colours are soft warm tan and pale bamboo green.
  exact:
    - The upper roof part and the lower bamboo-book part do not touch each other.
    - At the top, the right sweep starts near the top of the left sweep, and the two slopes spread much wider than the book below.
    - The short line across under the peak stands completely free, touching neither slope, and is a little over half as long as the top bar of the lower frame.
    - In the lower part, the frame stroke starts at the top of the left vertical, runs across, turns down on the right, and ends at the bottom in a hook to the left.
    - The two inner vertical slips start on the top bar of the lower frame, cross the middle cord, and end above the bottom of the outer frame with plain tips.
    - The horizontal cord across the middle of the book crosses both inner verticals but stops short of touching the left vertical and the right side of the frame.
  strokes:
    - where: a long sweep from the top centre down and out to the middle left
      part: the left slope of the gathering roof
    - where: a long sweep from near the top of the left slope down and out to the middle right
      part: the right slope of the gathering roof
    - where: a short line across the middle of the upper half, rising slightly to the right and standing free between the two slopes
      part: the crossbeam under the roof's peak
    - where: a straight line down the left side of the lower half
      part: the leftmost bamboo slip of the book
    - where: a line across from the top of the left slip to the right, turning sharply down the right side and ending in a hook to the left
      part: the top binding bar and the rightmost bamboo slip of the book
    - where: a line across the middle of the lower frame, about three quarters as long as the top bar
      part: the horizontal cord tying the bamboo slips together
    - where: a line down the left-centre of the lower frame, from the top bar across the middle cord
      part: the left inner bamboo slip
    - where: a line down the right-centre of the lower frame, from the top bar across the middle cord
      part: the right inner bamboo slip

