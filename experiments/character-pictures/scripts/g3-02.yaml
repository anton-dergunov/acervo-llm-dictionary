肘:
  checked: argon
  object: a strip of flesh with ribs on the left (⺼) beside an arm and hand with an indicator mark at the bend of the elbow on the right (寸)
  history: >-
    Originally written as 寸 alone, an ideogram of a hand and arm (又) with a short stroke marking the
    elbow. Because 寸 also came to mean a unit of measurement, the flesh radical 肉 (written ⺼ on the
    side) was added on the left to show that the character refers to a part of the body.
  layout: >-
    The left side is narrower and shorter, showing a tall pale-pink strip of flesh framed by the
    left sweep and the hooked right vertical, with two short inner ribs. The right side is wider and
    taller, showing a pale arm and hand in profile: the long vertical runs from the hand at the top
    down to the bent elbow at the bottom hook, the horizontal crosses the forearm, and the short dot
    sits in the hollow below the crossing as the mark pointing to the elbow.
  exact:
    - The left part (⺼) is narrower and shorter than the right part (寸), which reaches higher at the top and lower at the bottom.
    - The left part and the right part do not touch; the horizontal of 寸 starts just to the right of ⺼'s right vertical, leaving a small gap.
    - In the left part, the top-and-right stroke starts touching the top of the left sweep, runs only about a quarter as far across as the right part's horizontal, and turns down to end in a hook up to the left.
    - The two short inner strokes in the left part both touch the left sweep and stop just short of the right vertical, leaving a small gap.
    - In the right part, the long vertical crosses the horizontal line and ends at the bottom in a hook up to the left.
