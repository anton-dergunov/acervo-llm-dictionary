闖:
  checked: argon
  object: a horse galloping to the left, charging through an open wooden gateway of two door leaves
  history: >-
    An ideogrammic compound combining a gate (門) with a horse (馬) in the doorway, depicting a horse
    bursting through an open gate. In the horse inside the archway, the head and flowing mane sit at
    the top, the arched back and hooked tail frame the lower right, and the four strokes below are
    its four hooves.
  layout: >-
    A tall wooden gateway of two open door leaves frames the left, top and right of the square, with
    its panelled upper leaves at the top left and top right. Inside the open lower archway between
    the two tall gateposts, a pale brown horse charges to the left, its head and mane in the centre
    and its four hooves running across the doorway below its body. Keep the wood of the gate and the
    horse's coat in soft, pale warm tones behind the strokes.
  exact:
    - The gate's left outer vertical is straight and ends in a plain point at the bottom with no hook, while the right outer vertical starts higher, reaches lower, and ends in a hook up to the left.
    - In the gate's upper left panel, the upper inner stroke touches the left vertical and stops short of the inner vertical edge, while the lower stroke connects the left vertical to the foot of the inner vertical edge.
    - In the gate's upper right panel, the upper inner stroke touches the short inner vertical and stops short of the right outer vertical, while the lower crossbar connects the foot of the short inner vertical to the right outer vertical.
    - The horse sits completely inside the lower opening between the two gateposts without touching the gate anywhere.
    - In the horse, the top horizontal and the left vertical meet at the top left, and the foot of the left vertical meets the start of the long body stroke, which runs across, turns down, and ends in a hook up to the left.
    - The horse's middle vertical runs from the middle of the top horizontal down to the body stroke, crossing the two shorter middle horizontals; those two middle horizontals do not touch the left vertical.
    - The four hoof strokes at the bottom stand completely free in a row below the horse's body, touching neither the body nor one another.
