      part: the left gate leaf's upper stud
    - where: a short stroke below it inside the upper left leaf, rising slightly from the left outer line to meet the foot of the inner edge
      part: the left gate leaf's lower crossbar
    - where: a short vertical line down in the upper right, just right of the top centre
      part: the right gate leaf's inner edge
    - where: a very long stroke starting at the top of that short vertical, running across the top right, turning down along the right side all the way to the bottom, and ending in a hook up to the left
      part: the right gate leaf's top and outer edge
    - where: a short stroke inside the upper right leaf, starting on the short inner vertical and rising slightly to the right without reaching the outer edge
      part: the right gate leaf's stud
    - where: a short line across the bottom of the upper right leaf, from the foot of the short inner vertical to the right outer line
      part: the right gate leaf's lower crossbar
    - where: a short line across the middle of the doorway, rising slightly to the right
