    - In the upper-right part, the middle bent stroke and the short line across below it both start on the vertical leg of the L-shaped stroke, and the bent stroke's downward leg ends on the short line across.
    - In the lower tree, the line across for the branches is the widest horizontal in the character, and the vertical trunk crosses its middle and ends in a plain point at the bottom with no hook.
    - The tree's two lower sweeps start where the trunk crosses the branches, with a small gap between their starts.
