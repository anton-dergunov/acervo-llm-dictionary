    - where: a long stroke starting at the left end of the head line, going down, curving wide to the right along the bottom, and turning sharply up at the end
      part: the kneeling person's back and folded legs, the upturned tip the toes

冥:
  checked: argon
  object: the sun covered by a cloth shroud at the top, with a wide hem and two hands below pulling the cover down
  history: >-
    Originally an ideogrammic compound of a cloth cover (冖) over the sun (日) and two hands (廾) below
    pulling the cover over the sun to represent darkness and night. In the modern form, the two
    hands at the bottom have been reshaped into 六.
  layout: >-
    Three parts stack from top to bottom. At the top, a pale indigo cloth cover drapes over the
    upper part of the square. Tucked beneath it in the middle is a small pale yellow sun with a soft
    band of light across its centre. Below the sun, a central knot meets a wide horizontal hem
    stretching across the lower half, and beneath that bar two pale arms and hands on the left and
    right reach up to pull the shroud down.
  exact:
    - The top cover's horizontal stroke starts at the middle of the short left vertical stroke, runs across to the right, and ends in a hook down to the left, about four fifths as wide as the long horizontal line in the lower half.
    - The top cover does not touch the sun below it.
    - The sun in the middle is narrower than both the top cover and the lower horizontal line, and its left and right sides slant slightly inward toward the bottom.
    - Inside the sun, the middle line across touches the left side and stops short of the right side, while the bottom line connects both sides.
    - The short slanting dot below the sun does not touch the sun's bottom, and its lower tip touches the middle of the long horizontal line.
    - The long horizontal line across the lower half is the widest stroke in the character.
    - The two lower strokes below the long horizontal line stand completely free, touching neither the horizontal line nor each other.
  strokes:
    - where: a short line slanting down to the left at the top left
      part: the left hanging edge of the cloth cover
    - where: a long line from the middle of the top-left stroke across to the top right, ending in a hook down to the left
      part: the top ridge and hooked right corner of the cloth cover
    - where: a line down the left side of the middle box, slanting slightly inward
      part: the left rim of the sun
    - where: a line across the top of the middle box, turning down at the right to run along the right side
      part: the top and right rim of the sun
    - where: a short line across the middle of the sun, rising slightly to the right
      part: the band of light across the sun's heart
    - where: a short line across the bottom of the sun, joining the left and right rims
      part: the bottom rim of the sun
    - where: a short dot below the sun in the centre, slanting down to the right
      part: the gathered knot of the cover beneath the sun
    - where: a very long line across the lower middle from far left to far right
      part: the wide lower hem and rod of the cover
    - where: a sweep below the long line, running from left of centre down to the bottom left
      part: the left arm and hand pulling the cover down to the left
    - where: a falling stroke below the long line, running from right of centre down to the bottom right
      part: the right arm and hand pulling the cover down to the right

