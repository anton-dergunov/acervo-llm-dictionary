    the left changed into the shape of an arrow component, and the square on the right became a
    framed L-shape with a central handle. The tree component was added underneath to show that the
    carpenter's square is made of wood.
  layout: >-
    The scene is stacked in two halves. In the upper half, a craftsman stands on the left facing
    right, with a friendly face (eyes, nose, and mouth) and simple pale clothes, reaching toward a
    pale tan wooden carpenter's square with an inner grip on the right. In the lower half, a tree
    with a pale green leafy crown behind its branches stands centred beneath them.
