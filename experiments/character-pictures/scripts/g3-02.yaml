    - where: a shorter line across the upper middle of the horse, rising slightly to the right and crossing the neck vertical without touching the face line
      part: the upper part of the horse's mane
    - where: a shorter line across the middle of the horse just below that, rising slightly to the right and crossing the neck vertical without touching the face line
