妳:
  checked: argon
  object: a kneeling woman 女 on the left beside a hanging spindle ornament 尔 on the right — an angled top clasp over a central hooked shaft with two small side drops, indicating "you (female)"
  history: >-
    Formed from 你 ("you") by replacing the standing person 亻 on the left with a woman 女, alongside 尔
    on the right (originally a small spindle or hanging tassel, borrowed for the pronoun "you").
  layout: >-
    The kneeling woman fills the left half, seen in profile facing left with a friendly face (eyes,
    nose and mouth) and simple pale clothes, her arms crossed in front of her. The hanging spindle
    ornament fills the right half and is slightly wider and taller than the woman, reaching a little
    higher at the top and lower at the bottom: its angled clasp sits at the top right, and its
    central hooked shaft hangs below between two small pale side drops. Colours are pale and soft
    throughout.
  exact:
    - The left part (the woman) and the right part (the ornament) do not touch each other; the right part is wider and taller than the left.
    - In the left half, the first stroke runs down and slightly left before turning sharply to sweep down to the lower right; the second sweep is a little over half as long, starts near the middle and crosses the first stroke's lower leg; the rising line across crosses the first stroke's upper leg and ends on the top of the second sweep.
    - At the top of the right half, the left sweep runs down to the left, and the hooked cross-stroke starts from the middle of that sweep, rises slightly to the right, and turns sharply down to the left.
    - The central vertical shaft in the lower right half starts clearly below the top clasp without touching it, runs straight down, and ends at the bottom in a sharp hook up to the left.
    - The two short side strokes flanking the central vertical shaft are much shorter (about a third of the upper vertical's length) and stand completely free, touching neither the central shaft nor the woman on the left.
  strokes:
    - where: a long stroke in the left half from the top down and slightly left, turning sharply at the lower left to sweep down to the lower right
      part: the kneeling woman's head and back, then her thigh folded forward to the knee
    - where: a sweep in the left half, a little over half as long, from near the middle down to the bottom left
      part: the woman's front arm, reaching down across her body
    - where: a line across the middle of the left half, rising slightly to the right
      part: the woman's other arm, held across in front of her
    - where: a sweep in the upper right half from the top down to the left
      part: the left side of the ornament's top clasp
    - where: a stroke starting on the middle of the upper right sweep, running across and slightly up to the right before turning sharply down to the left
      part: the top bar and right hook of the clasp
    - where: a vertical line down the middle of the lower right half, ending at the bottom in a hook up to the left
      part: the central hanging shaft of the spindle ornament, the bottom hook its tip
    - where: a short stroke to the left of the central shaft, slanting slightly down to the left
      part: the small hanging drop on the left side of the shaft
    - where: a short stroke to the right of the central shaft, slanting down to the right
