  object: a spine with pairs of small ribs on either side at the top, above a cut of meat and ribs below
  history: >-
    Originally a pictogram of a fish spine with ribs branching out on either side; the flesh
    component ⺼ (from 肉, meat) was later added underneath to show a backbone in the flesh.
  layout: >-
    The upper half shows a pale ivory backbone and its branching ribs: the central arch of the spine
    spreads wide across the middle, flanked by two short rib bones on the upper left and two on the
    upper right. Tucked beneath the arch in the lower half is a tall cut of pale pink meat, with its
    two inner lines as pale ribs inside the cut.
  exact:
    - The four short strokes at the upper left and upper right all stand free and do not touch the central sweeps or each other.
    - On the upper left, the top short stroke slants down to the right and the lower one rises to the right; on the upper right, the top short stroke sweeps down to the left and the lower one slants down to the right.
    - The long right-falling stroke starts on the upper middle of the long left sweep, forming a wide arch across the middle.
    - The lower frame's left vertical starts against the lower part of the long left sweep, where it meets the start of the top-and-right frame stroke.
    - The top-and-right frame stroke of the lower part turns down on the right and ends at the bottom in a hook to the left, without touching the wide right-falling stroke above it.
    - The two inner lines of the lower part touch the left vertical and stop short of the right vertical, each about two thirds as long as the top of the frame.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: the upper left rib bone of the spine
    - where: a short stroke below the upper left one, rising to the right
      part: the lower left rib bone of the spine
    - where: a short sweep at the upper right, slanting down to the left
      part: the upper right rib bone of the spine
    - where: a short stroke below the upper right sweep, slanting down to the right
      part: the lower right rib bone of the spine
    - where: a long sweep from the top centre down and out to the middle left
      part: the main ridge of the spine, curving down to the left
    - where: a long falling stroke from the upper middle of the main sweep down and out to the middle right
      part: the right side of the spine's arch, spreading out to the right
    - where: a line down the left side of the lower half, starting against the main sweep and curving slightly left at the bottom
      part: the left edge of the cut of meat
    - where: a line across from the top of the lower left vertical, turning down on the right side and ending at the bottom in a hook to the left
      part: the top and right edge of the cut of meat
    - where: a short line across the upper middle of the lower frame, rising slightly to the right
      part: the upper rib inside the meat
    - where: a short line across the lower middle of the lower frame, rising slightly to the right
