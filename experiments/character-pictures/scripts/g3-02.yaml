艳:
  checked: argon
  object: a lush plant with three tiers of spreading boughs on the left, beside a hand reaching down from above to press upon a kneeling person on the right
  history: >-
    An ideogrammic compound combining abundance and colour to mean radiant beauty. The traditional
    form wrote a ritual vessel overflowing with lush plants on the left, which the simplified form
    replaced with a lush three-tiered bush, beside the figure of a hand pressing upon a kneeling
    person on the right.
  layout: >-
    The lush plant fills the narrower left side, with pale green leaves and soft pink blossoms
    behind its upright stem and three cross-boughs. The wider right side holds a pale hand reaching
    down from the top to press on the head of a kneeling person facing right, who has a face with
    eyes, a nose and a mouth, a soft rosy flush on the cheek, and simple pale clothes.
  exact:
    - The left part (the lush plant) is narrower than the right part (the hand and kneeling person), and the two parts do not touch.
    - In the left part, three lines across rise slightly to the right and are all crossed at their middles by a long straight vertical line that ends in a plain point at the bottom, with no hook.
    - Of the three lines across on the left, the upper two are about the same length, while the lowest one is longer and starts further to the left.
    - At the top of the right part, the second stroke starts at the middle of the top sweep, runs across to the right, and turns sharply down to the left to touch the middle of the head line below it.
    - In the middle of the right part, the head line turns down on the right to meet the right end of the lower line across, a short vertical line divides the space between them in the middle, and the long bottom stroke starts at the left end of the head line.
    - The long stroke of the right part goes straight down from the left of the head line, curves wide to the right along the bottom, and turns sharply up at its right end.
  strokes:
    - where: a short line across the upper part of the left side, rising slightly to the right
      part: the top tier of branches on the lush plant
    - where: a short line across the middle of the left side, rising slightly to the right, about as long as the top line
      part: the middle tier of branches on the lush plant
    - where: a wider line across the lower middle of the left side, starting further left and rising to the right
      part: the lowest, widest tier of branches on the lush plant
    - where: a long straight line down the middle of the left side, from near the top to near the bottom, ending in a plain point with no hook
      part: the upright main stem of the lush plant
    - where: a sweep at the top of the right side, going down and turning down to the left
      part: the wrist and thumb of the hand reaching down from above
    - where: a line starting at the middle of the top sweep on the right side, going across to the right, then turning sharply down to the left to touch the line below
      part: the fingers of the hand, pressing down on the kneeling person's head
    - where: a line across the middle of the right side, going to the right and turning down to the left at the end
      part: the kneeling person's head and shoulders
    - where: a short vertical line down from the middle of the head line on the right side
      part: the kneeling person's neck
    - where: a line across the lower middle of the right side, rising slightly to the right to meet the turned-down end of the head line
