# Full run, group g3, batch 02. Written by Argon (argon.py) from the fact sheets, following scripts/GUIDE.md.

闯:
  checked: argon
  object: a horse galloping to the left, charging through a tall wooden gateway
  history: >-
    An ideogrammic compound combining a gate (门) and a horse (马): a horse bursting through an open
    doorway. The simplified form replaces the traditional gate and horse with their cursive-derived
    outlines while keeping the horse framed inside the doorway.
  layout: >-
    A tall wooden gateway frames the scene on the left, top and right, open at the bottom. Inside
    the doorway, a pale brown horse charges toward the left, with its head and neck above, its
    arched back, rump and tail in the middle, and its outstretched forelegs below. Pale timber grain
    marks the gateposts and crossbeam behind the outer strokes, and the horse's head, mane and body
    are softly shaded in pale ochre behind the inner strokes.
  exact:
    - The outer strokes of the gate stand completely free of one another and do not touch the inner horse.
    - The left gatepost is a straight vertical line ending in a plain point at the bottom, with no hook, while the right gatepost turns down from the top crossbeam, reaches lower than the left post, and ends in a hook to the left.
    - Inside the gate, the upper stroke of the horse runs across and turns down so that its bottom tip touches the horizontal middle section of the stroke below it.
    - The middle stroke of the horse starts just below the left end of the upper inner stroke without touching it, runs briefly down, turns across to the right, and turns down to end in a hook to the left.
    - The lowest inner line rises slightly to the right underneath the horse's body and stands completely free, touching neither the left gatepost nor the horse's tail.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: an iron latch above the left gatepost
    - where: a long straight line down the left side
      part: the left gatepost
    - where: a line across the top right, turning down at the top right corner to run all the way down the right side, ending in a hook up to the left
      part: the crossbeam and the right gatepost, its foot set in the ground
    - where: inside the upper middle of the gate, a line across to the right, turning down at its right end
      part: the horse's head and neck, bending down
    - where: inside the middle of the gate, a stroke starting just below the left end of the upper inner stroke, running briefly down, then turning across to the right, then turning down and ending in a hook to the left
      part: the horse's back, rump and tail, the hook its tail tip
    - where: inside the lower part of the gate, a line across from the lower left toward the middle, rising slightly to the right
      part: the horse's outstretched forelegs

