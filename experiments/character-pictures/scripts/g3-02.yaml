冈:
  checked: argon
  object: a net stretched on a tall frame, with crossed cords forming the mesh inside
  history: >-
    Originally a pictogram of a net with an outer frame and crossed mesh cords inside, a variant of
    网; it was later adopted as the simplified form of 岡.
  layout: >-
    A tall arch-like net frame fills the square, open across the bottom. Pale tan wooden poles
    follow the left, top and right strokes of the outer frame, while soft pale beige webbing hangs
    inside behind the two crossed cords at the centre.
  exact:
    - The top-and-right stroke starts touching the top of the left vertical, rises slightly to the top right corner, turns down the right side, and ends in a hook to the left at the bottom right.
    - The left vertical runs straight down the left side and ends in a plain point with no hook, stopping a little higher than the hooked right side.
    - The frame is completely open across the bottom.
    - Inside the frame, the sweep down to the left and the diagonal stroke down to the right cross each other at their middles.
    - The inner crossed strokes do not touch the outer frame on either the left or the right.
  strokes:
    - where: a straight line down the left side from top left to bottom left, ending in a plain point
      part: the left side of the net frame
    - where: a line from the top of the left vertical across the top, turning down the right side and ending in a hook to the left at the bottom right
      part: the top bar and right side of the net frame
    - where: a sweep inside the frame from upper right-of-centre down and left toward the lower left
      part: the net cord slanting down to the left
    - where: a diagonal stroke inside the frame from left-of-centre down to the lower right, crossing the sweep
      part: the net cord slanting down to the right

卧:
  checked: argon
  object: a vertical eye pointing downward on the left, beside a person leaning on the right, showing someone bowing or lying down
  history: >-
    An ideogrammic compound of 臣, an eye stood vertically and pointing down as when a person bows or
    lies prostrate, and 人, a person beside it. In the form 卧, the person on the right was reshaped
    into the two strokes of 卜.
  layout: >-
    The left half holds a large eye stood vertically and looking downward: the long left stroke and
    the top and bottom lines frame the eyelids, the small middle rectangle holds a pale iris and
    mid-grey pupil, and the two short inner verticals are the inner folds of the eye. The right half
    holds a taller person in profile facing left, with a head at the top of the long vertical body
    and a sleeve or bent back slanting down to the right. The person has a clear face with eyes, a
    nose and a mouth, and wears simple pale clothes.
  exact:
    - The left part and the right part do not touch each other.
    - On the left, the long vertical down the left edge starts at the left end of the top horizontal and turns sharply at the bottom to run across to the right.
    - Inside the left part, the upper-middle horizontal starts on the left vertical and turns down at its right end to meet the right end of the lower-middle horizontal, forming a closed rectangular box in the middle.
    - One short vertical runs from the middle of the top horizontal to the top of the middle box, and another short vertical runs from the middle of the bottom of the box to the bottom horizontal; the two short verticals are separated by the box and do not touch.
    - On the right, the long straight vertical starts higher and reaches lower than the left part, ending at the bottom in a plain point with no hook.
    - A short falling stroke starts at the middle of the right vertical and slants down to the right.
  strokes:
    - where: a line across the top of the left half, rising slightly to the right
      part: the top corner rim of the vertical eye
    - where: a short line down from the middle of the top line to the middle of the upper-middle line
      part: the upper inner fold of the eye above the iris
    - where: a line across the upper middle of the left half, turning down at the right end
      part: the upper and outer rim of the central iris
    - where: a line across the lower middle of the left half, closing the small middle box
      part: the lower rim of the central iris
    - where: a short line down from the middle of the lower-middle line to the bottom line
      part: the lower inner fold of the eye below the iris
    - where: a long line down the left edge from the top line, turning sharply at the bottom to run across to the right
      part: the main eyelid down the left side and the bottom corner rim of the eye
    - where: a tall straight line down the right half, from near the top to near the bottom, with no hook
      part: the person's upright body and leg
    - where: a short falling stroke from the middle of the right vertical down to the right
      part: the person's bent back and hanging sleeve slanting to the right

