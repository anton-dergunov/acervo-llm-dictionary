  exact:
    - Each of the four upper strokes slants down to the left and turns at a sharp angle at the bottom to run across and slightly up to the right.
    - In the left skein, the upper angled stroke ends touching the middle of the lower angled stroke's downward slant.
    - In the right skein, the upper angled stroke likewise ends touching the middle of the lower angled stroke's downward slant.
    - In both skeins, the second angled stroke starts lower and further right than the first, and reaches lower down.
    - The left skein and the right skein do not touch each other.
    - The long horizontal line across the bottom stands completely free below both skeins, touching neither.
  strokes:
