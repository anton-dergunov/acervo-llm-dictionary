厚:
  checked: argon
  object: a stout clay jug standing beneath an overhanging rock cliff
  history: >-
    An ideogrammic compound combining an overhanging cliff 厂 with a thick-walled vessel or jug 𣆪
    (explained in the Shuowen as an inverted ancestral shrine 亯). In the modern character, the upper
    neck and lower body of the jug have drifted into the shapes of 日 above 子.
  layout: >-
    A pale grey stone cliff wraps over the top and down the left side, following the outer strokes.
    Tucked beneath the overhang on the right sits a wide-bellied pale terracotta jug: the small
    rectangular box forms its square neck and rim, while the lower strokes sit over its wide rounded
    belly and curved foot. All stone and clay tones are soft and pale behind the strokes.
  exact:
    - The cliff's top line touches the top of the long left sweep, and neither stroke touches the jug inside.
    - The upper box tilts slightly inward toward the bottom; its middle line touches the left wall and stops short of the right wall, while its bottom line closes the box from wall to wall.
    - There is a clear gap between the bottom of the upper box and the angled stroke below it.
    - Below the box, the angled stroke turns sharply down to the left and meets the top of the curved vertical stroke, which ends at the bottom in a hook up to the left.
    - The lowest line across is the longest horizontal stroke in the character—about a third longer than the cliff's top line—and crosses right through the middle of the lower hooked vertical.
  strokes:
    - where: a line across the top, from left of centre to the upper right
      part: the flat overhanging ledge of the cliff
    - where: a long stroke from the left end of the top line down the left side, sweeping out to the bottom left
      part: the steep rock wall of the cliff
    - where: a short line down in the upper middle, slanting slightly inward
      part: the left wall of the jug's square neck
    - where: a line across from the top of the neck's left wall to the right, turning down to form the right wall
      part: the rim and right wall of the jug's neck
    - where: a short line across the middle of the upper box, rising slightly to the right
      part: a decorative band across the jug's neck
    - where: a short line across the bottom of the upper box, closing it from left to right
      part: the collar seam at the base of the jug's neck
    - where: a line across just below the box, turning sharply back down to the left to reach the centre
      part: the moulded shoulder of the jug, tapering in toward the middle
    - where: a curved stroke from the end of the shoulder down the middle, ending at the bottom in a hook up to the left
      part: the central ridge of the jug's belly and its curved foot at the base
    - where: a long line across the lower half from left to right, crossing the curved vertical stroke
      part: a wide band running across the fullest part of the jug's belly

