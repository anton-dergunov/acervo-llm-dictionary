      part: the horn on top of the ghost's mask
    - where: a line down the upper left, slanting slightly inward
      part: the left side of the square mask
    - where: a line across from the top of the left side to the right, turning down to form the right side of the upper box
      part: the top rim and right side of the square mask
    - where: a short line across the middle of the upper box, about half as wide as the box, rising slightly to the right
      part: the brow ridge across the middle of the mask
    - where: a line across the bottom of the upper box, rising slightly to the right to close the box
      part: the lower jaw rim of the mask
    - where: a long stroke starting at the middle of the mask's top rim, running straight down through the mask and sweeping out to the bottom left
      part: the centre line of the mask continuing down into the ghost's body and outstretched left leg
    - where: a stroke starting just below the mask, running down the centre, turning wide across the bottom to the right, and hooking straight up at the right end
      part: the ghost's kneeling right leg and upturned foot
    - where: a stroke in the lower right hollow, sweeping down to the left and turning sharply to rise across to the right
