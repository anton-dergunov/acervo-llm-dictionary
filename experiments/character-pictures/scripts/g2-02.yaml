  object: a kneeling ghost figure wearing a large square mask with a horn on top, one leg sweeping out to the left, the other kneeling to the right, and a small tail curled above the kneeling leg
  history: >-
    A pictogram of a kneeling figure with a large, frightening head or ritual mask at the top, a
    bent body and legs below, and a small tail-like mark added in the lower right corner.
  layout: >-
    The ghost figure fills the square, facing slightly left. The upper half is a wide boxy mask with
    a single horn on top and a scary face with pale eyes, a nose and a grimacing mouth drawn inside
    it. Below the mask, the figure wears simple pale robes, with its left leg sweeping out to the
    bottom left, its right leg bent in a wide kneeling posture across the bottom right, and a small
    curled tail floating in the space above the kneeling leg.
  exact:
    - The short sweep at the very top touches the top bar of the mask near its left corner and does not touch the left side stroke.
    - The inner horizontal line of the mask is about half as wide as the top bar and stops short of both the left and right sides.
    - The bottom line of the mask joins the bottom of the left side to the bottom of the right side.
    - One long continuous stroke starts at the middle of the mask's top bar, crosses both horizontal lines of the mask, and sweeps all the way down to the bottom left.
    - The bent kneeling stroke at the lower right stands completely free of every other stroke, running down, turning wide across the bottom, and hooking straight up at the right end.
    - In the hollow above the kneeling stroke, a small angled stroke sweeps down to the left and turns across to the right, with a short falling stroke crossing its right end.
  strokes:
