絲:
  checked: argon
  object: two twisted skeins of fine silk thread hanging side by side, each wound in angled loops at the top with loose tassel ends at the bottom
  history: >-
    An ideogrammic compound of two skeins of silk (糸) side by side, originally drawing two twisted
    bundles of raw silk fibres with knotted loops above and loose strands below to represent fine
    silk thread.
  layout: >-
    Two vertical skeins of pale golden-cream silk thread hang side by side, filling the square. Each
    skein is wound into upper angled loops cinched by a small knot on the right, with loose tassel
    strands at the bottom. The left skein is narrower and shorter, ending in a row of short
    right-slanting tassel tufts, while the right skein is wider and reaches lower, ending in a
    central hooked cord flanked by loose side strands. Soft pale silk fibres follow behind the
    strokes without hiding their sharp turns and gaps.
  exact:
    - The left skein and the right skein do not touch each other; the right skein is wider and reaches lower than the left.
    - In both the left and right upper parts, the top angled stroke slants down to the left and turns across to touch the middle of the lower angled stroke's downward leg.
    - In both the left and right upper parts, the lower angled stroke turns across and its right end touches the middle of the short right-slanting knot stroke.
    - Below the left skein's loops sit a row of short strokes slanting down to the right, stepping slightly upward from left to right, standing free of the loops above and of each other.
    - Below the right skein's loops, the central vertical starts by touching the middle of the lower horizontal turn and runs down to a hook to the left, flanked by a left-slanting stroke on the left and a right-slanting stroke on the right that stand free.
  strokes:
    - where: in the upper left, a stroke slanting down to the left and turning sharply across, rising slightly to the right
      part: the top twisted loop of the left silk skein
    - where: below the top left loop, a stroke slanting down to the left and turning sharply across, rising slightly to the right
      part: the lower twisted loop of the left silk skein
    - where: a short dot slanting down to the right across the right tip of the left skein's lower turn
      part: the small knot binding the left silk skein
    - where: at the bottom far left, a short stroke slanting down to the right
      part: the leftmost loose tassel tip of the left skein
    - where: at the bottom left, beside the far-left tassel, a short dot slanting down to the right
      part: the middle loose tassel tip of the left skein
    - where: near the lower centre, to the right of the middle-left tassel, a short dot slanting down to the right
      part: the rightmost loose tassel tip of the left skein
    - where: in the upper right, a stroke slanting down to the left and turning sharply across, rising slightly to the right
      part: the top twisted loop of the right silk skein
    - where: below the top right loop, a stroke slanting down to the left from the upper right and turning sharply across, rising slightly to the right
      part: the lower twisted loop of the right silk skein
    - where: in the middle right, a short stroke slanting down to the right across the right tip of the right skein's lower turn
      part: the small knot binding the right silk skein
    - where: in the lower right half, a vertical line from the middle of the lower turn straight down, ending in a hook up to the left
      part: the main hanging cord at the bottom of the right skein
    - where: in the lower centre, to the left of the right skein's vertical cord, a short stroke slanting down to the left
      part: the left loose strand at the bottom of the right skein
    - where: at the bottom right, to the right of the vertical cord, a short stroke slanting down to the right
      part: the right loose strand at the bottom of the right skein

鬼:
