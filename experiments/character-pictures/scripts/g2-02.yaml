  history: >-
    Originally a compound of a heart (心) at the bottom and an upper sign (𡩜) made of a roof (宀), a
    sharp marking tool or notched law tally (龶), and a sideways eye (罒), representing penal law held
    in awe by the heart.
  layout: >-
    Four stacked elements fill the square from top to bottom. At the top, a wide pale-tiled roof
    spans the upper third. Tucked beneath the roof sits a pale wooden law tally with three crossbars
    on a central vertical shaft. Below the tally lies a wide rectangular eye turned horizontally,
    with a pale iris between its two inner vertical lines. At the bottom sits a soft pale-coral
    heart cradled by the sweeping bottom curve and flanked by its outer strokes.
  exact:
    - The top dot of the roof stands free above the middle of the long roof stroke, with a small gap.
    - The roof's left downward stroke meets the left start of the long horizontal roof stroke, which ends on the right in a hook down to the left.
    - In the three-barred tally under the roof, the central vertical shaft starts just below the roof without touching it, crosses the top and middle horizontal bars, and ends on the middle of the bottom horizontal bar.
    - Of the three horizontal bars of the tally, the middle one is the shortest, the top one is slightly longer, and the bottom one is clearly the widest, about two thirds as wide as the roof.
    - Below the tally, the horizontal eye is a closed rectangular frame whose left side and top-and-right corner stroke are closed at the bottom by a horizontal line, with two short inner vertical strokes connecting the top and bottom lines.
    - At the bottom, all four strokes of the heart stand free of one another and of the eye box above.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right
      part: the ridge ornament at the peak of the roof
    - where: a short stroke on the upper left, running down and slightly left
      part: the left eave of the roof
    - where: a long line across the upper part from the top of the left eave to the right, ending in a hook down to the left
      part: the main beam of the roof and its hooked right eave
    - where: a short line across the upper middle, below the roof, rising slightly to the right
      part: the upper crossbar of the law tally
    - where: a slightly shorter line across the upper middle, below the first crossbar, rising slightly to the right
      part: the middle crossbar of the law tally
    - where: a vertical stroke down the upper centre, crossing both upper crossbars and ending on the wide bar below
      part: the central upright shaft of the law tally
    - where: a wider line across the middle, rising slightly to the right beneath the vertical shaft
      part: the wide base bar of the law tally
    - where: a short stroke on the middle left, slanting down and slightly to the right
      part: the left corner of the horizontal eye frame
    - where: a line from the top of the left eye stroke across the middle, turning down and slightly left at the right side
      part: the upper lid and right corner of the horizontal eye frame
    - where: a short vertical stroke inside the left third of the eye frame, slanting slightly right from top to bottom
      part: the left edge of the iris inside the horizontal eye
    - where: a short vertical stroke inside the right third of the eye frame, slanting slightly left from top to bottom
      part: the right edge of the iris inside the horizontal eye
    - where: a line across the bottom of the eye frame, joining the bottom of the left side to the bottom of the right side
      part: the lower lid closing the horizontal eye frame
    - where: a short stroke on the lower left, slanting down to the left
      part: the left outer lobe of the heart
    - where: a long sweeping curve from the lower left down and across the bottom to the lower right, ending in an upward hook to the left
      part: the rounded lower chamber of the heart
    - where: a short dot in the lower centre above the sweeping curve, slanting down to the right
      part: the central valve at the top of the heart
    - where: a short stroke on the lower right outside the curve, slanting down to the right
      part: the right outer lobe of the heart

砂:
  checked: argon
  dropped: The character is a phono-semantic compound with no pictographic or ideographic reading of its own form, so picturing it would teach a false etymology.

闭:
  checked: argon
  object: a door shut with a bar across it
  history: >-
    The character is an ideogrammic compound combining a doorway with timber set inside it, showing
    a gate barred shut from within. The simplified form replaces the double-leaf gate with the
    single-frame gateway while keeping the wooden crossbar and brace in the opening.
  layout: >-
    A tall gateway frame fills the outer square, with pale wooden planks of the shut door leaves
    visible behind the strokes. Centered inside the doorway sits a pale timber locking assembly — a
    horizontal crossbar held by a vertical post and a diagonal strut slanting down to the left —
    blocking the passage.
  exact:
    - The three strokes of the outer gateway (the top-left dot, the left post, and the top-and-right frame) stand completely free of one another and do not touch.
    - The left gatepost is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The top-and-right gate frame runs across from the top centre, turns down at the top right, and ends at the bottom in a hook to the left.
    - The inner timber bar assembly sits inside the gateway with clear gaps separating it from both the left gatepost and the right gatepost.
    - Inside the doorway, the vertical shaft crosses the middle of the horizontal crossbar and ends at the bottom in a hook up to the left.
    - The inner diagonal sweep starts at the crossing of the horizontal crossbar and the vertical shaft, slanting down to the lower left without touching the left gatepost.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: an iron latch at the top of the gateway
    - where: a long straight line down the left side
      part: the left gatepost
    - where: a line across the top from the centre to the right, turning down to run along the right side and ending in a hook to the left at the bottom
      part: the top crossbeam and the right gatepost
    - where: a line across the middle inside the gateway, rising slightly to the right
      part: the horizontal wooden crossbar blocking the door
    - where: a vertical line down the centre inside the gateway, crossing the horizontal bar and ending in a hook up to the left at the bottom
      part: the upright timber post holding the crossbar in place
    - where: a sweep from the crossing of the inner crossbar and upright post down to the lower left
      part: the diagonal wooden strut bracing the bar

鳴:
  checked: argon
  object: a bird standing on the right and calling out, with a wide-open mouth on the left
  history: >-
    An ideogrammic compound combining a mouth (口) on the left and a bird (鳥) on the right, depicting
    a bird crying out or singing.
  layout: >-
    The bird fills the right two-thirds of the square from top to bottom, facing left with its crest
    at the top, its feathered head and breast down the middle, its long tail curving down at the
    bottom right, and its toes along the bottom. In the upper-middle left, in front of the bird's
    head, sits a small wide-open mouth representing its call. Pale plumage and soft pink inside the
    open mouth stay behind the strokes.
  exact:
    - The small mouth sits high on the left and does not touch the tall bird on the right.
    - In the mouth on the left, the top stroke starts at the top of the left vertical and turns down on the right, and the bottom line starts on the middle of the left vertical and meets the bottom of the right turn.
    - At the top of the bird, the short crest sweep meets the start of the head's top-and-right stroke, which meets the top of the long front vertical line.
    - The upper inner line of the head touches the front vertical on the left and stops short of the right side of the head.
    - The lower inner line of the head starts on the front vertical and meets the bottom end of the head's right side.
    - Below the head, the neck line starts on the front vertical and reaches out to the right with its right end free, wider than the two head lines above it.
    - The long body-and-tail stroke starts at the bottom end of the front vertical, runs far to the right, turns down, and ends at the bottom right in a hook up to the left.
    - Along the bottom, the row of toe strokes stands completely free of the bird's body and of the mouth above.
  strokes:
    - where: a short line down the upper left, slanting slightly to the right
      part: the left corner and left side of the open mouth
    - where: a line across the top of the left part, rising slightly to the right and turning down on the right side
      part: the upper lip, curving down into the right side of the mouth
    - where: a short line across the bottom of the left part, rising slightly to the right
      part: the lower lip of the open mouth
    - where: a short sweep at the top centre, slanting down to the left
      part: the bird's crest
    - where: a long straight line down the left side of the right half
      part: the front of the bird's head and its breast
    - where: a line across from the top of the bird's front line, rising slightly to the right and turning down to the left
      part: the top and back of the bird's head
    - where: a short line across in the upper head, rising slightly to the right from the front vertical line
      part: the bird's eye line
    - where: a line across under the eye line, rising slightly to the right from the front vertical line to meet the back of the head
      part: the bird's cheek feathers
    - where: a longer line across below the head, rising slightly to the right from the front vertical line
      part: the bird's neck feathers
    - where: a long line across from the bottom of the front vertical line to the far right, turning down and ending at the bottom right in a hook up to the left
      part: the bird's body and long curving tail
    - where: a short vertical stroke at the lower left, below the space between the mouth and the bird, standing free
      part: the bird's back toe on the left
    - where: a short dot at the bottom centre, slanting down to the right, standing free
      part: the bird's inner left toe
    - where: a short dot at the bottom, to the right of the previous dot, slanting down to the right
      part: the bird's inner right toe
    - where: a short dot under the bird's body on the right, slanting down to the right
      part: the bird's rightmost front toe

盖:
  checked: argon
  dropped: The character is a graphical variant of a phono-semantic compound with no pictographic or ideographic reading in the scholarship, so illustrating the folk reading of a ram 羊 as a lid over a dish 皿 would teach a false etymology.

毁:
  checked: argon
  object: a hand on the right (又) wielding a heavy mallet or club (几) to strike and crack a clay mortar vessel (臼) resting on a work-block tool (工) on the left
  history: >-
    In the older form, a hand holding a pestle or club (殳) stood beside a mortar (臼) over earth or
    clay (土), showing a clay vessel being pounded to pieces. In the simplified form, the earth at
    the bottom left became the tool (工), beside the striking hand and club (殳).
  layout: >-
    The scene is split between the vessel on its block in the left half and the striking club and
    hand in the right half. In the upper left, a pale terracotta mortar (臼) has a notched open rim
    at the top and cracks across its inner walls. Directly below it sits a pale grey stone or wood
    work-block (工), tilted slightly upward toward the right. In the upper right, the heavy wooden
    head of a club or mallet (几) swings toward the vessel, gripped from below by a pale hand and
    forearm (又) in the lower right.
  exact:
    - The left half and the right half do not touch each other, and the upper and lower parts on each side do not touch.
    - In the mortar at the top left, the top-left sweep touches the top of the left vertical wall, leaving an open gap at the top middle before the right side's top turn.
    - The two short inner strokes of the mortar touch the middles of the left and right walls and stop with a clear gap between them.
    - The bottom stroke of the mortar connects the bottom of the left wall to the bottom of the right wall, slanting slightly up to the right.
    - In the tool at the bottom left, the middle vertical is very short—about half as long as the mortar's left wall—and connects the middle of the top bar to the middle of the bottom stroke, which slants sharply up to the right.
    - In the club head at the top right, the left downward sweep and the right stroke meet at the top left; the right stroke turns down and then turns flat to the right at its foot, with no upward hook.
    - In the hand at the bottom right, the two strokes cross in the middle.
  strokes:
    - where: a short sweep at the top left, slanting down to the left
      part: the left lip of the clay mortar's rim
    - where: a line down the upper left side, slanting slightly inward, about four fifths as long as the upper-right vertical sweep
      part: the left outer wall of the mortar
    - where: a short stroke inside the upper left, rising slightly to the right from the middle of the left wall
      part: a crack inside the left wall of the mortar
    - where: a stroke in the upper left-centre that runs across to the right and turns down to form the right side
      part: the right rim and right outer wall of the mortar
    - where: a short stroke inside the mortar, rising slightly to the right to touch the middle of the right wall
      part: a crack inside the right wall of the mortar
    - where: a line across the bottom of the mortar, rising slightly to the right from the bottom of the left wall to the bottom of the right wall
      part: the base of the clay mortar
    - where: a line across the lower left, below the mortar, rising slightly to the right
      part: the top face of the work-block tool
    - where: a very short line down the middle of the lower-left tool, less than half as long as the upper-right vertical sweep
      part: the central shaft of the work-block tool
    - where: a stroke across the bottom left, slanting up to the right
      part: the tilted base of the work-block tool
    - where: a vertical sweep in the upper right, running down and slightly to the left
      part: the left striking face of the club head
    - where: a stroke from the top of the upper-right sweep that runs across to the right, turns down, and turns flat to the right at the bottom
      part: the top and curved back of the club head
    - where: a stroke in the lower right that runs across to the right, turns sharply down, and sweeps out to the bottom centre
      part: the bent wrist and lower forearm gripping the club
    - where: a long falling stroke in the lower right, starting near the centre and crossing the previous stroke to sweep down to the bottom right
      part: the upper forearm and hand swinging the club

启:
  checked: argon
  object: a single wooden door in its frame swinging open on its pivot at the top left, above a wide-open mouth calling out in the doorway below
  history: >-
    Shu-ta Yang explains the character as an ideogrammic compound originally combining a single-leaf
    door and a hand opening it, to which a mouth was added to mean opening or explaining. The
    simplified form 启 keeps the wooden door 户 wrapping from the top left around the open mouth 口
    below.
  layout: >-
    The wooden door 户 fills the top and left of the square, its upper leaf framed by the closed box
    under the top pivot dot and its long left edge sweeping open toward the bottom left. Tucked into
    the open doorway in the lower centre and right sits a wide-open mouth 口 seen from the front. The
    door has pale warm wood grain behind its strokes, and the mouth has soft pale pink lips and a
    pale interior, with nothing dark next to the strokes.
  exact:
    - The short top dot stands completely free above the middle of the door's upper line across, with a clear gap between them.
    - The door's upper line across starts at the top of the long left sweep, runs across and turns down at the right; the crossbar below it starts from the middle of the long left sweep and meets the bottom of that right turn.
    - The long left stroke starts at the upper left of the door panel and sweeps smoothly down and out to the bottom left corner, ending in a plain point with no hook.
    - The mouth sits in the lower right under the door panel and does not touch the long left sweep or the door panel above it.
    - The mouth's upper stroke starts at the top of its left vertical and turns down on the right, and its bottom line closes the mouth from the left vertical to the bottom of the right turn, about four fifths as wide as the door panel above.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the pivot at the top of the door
    - where: a line across the upper part, rising slightly to the right and turning down at the right
      part: the top of the door frame and its short right post
    - where: a line across the middle, rising slightly from the left sweep to the bottom of the right post
      part: the lower crossbar of the door panel
    - where: a long sweep from the top left of the door panel down and out to the bottom left
      part: the outer edge of the wooden door, swinging open
    - where: a short line down the left side of the lower part, slanting slightly to the right
      part: the left corner and left side of the open lips
    - where: a line across the top of the lower part, turning down at the right to run down the right side
      part: the upper lip, curving down into the right corner of the mouth
    - where: a line across the bottom of the lower part, from the left side to the bottom of the right side
      part: the lower lip
