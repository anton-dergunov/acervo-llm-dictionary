# Full run, group g1, batch 06. Written from the fact sheets, following scripts/GUIDE.md.

回:
  object: a spiral of water turning round on itself and coming back to where it began, drawn as nested square rings
  history: >-
    The oldest forms drew a spiral, a thing that turns and returns. The modern form squared the
    spiral into a small ring set inside a larger ring.
  layout: >-
    A pale whirlpool fills the frame, its water winding round and in toward a small still pool at the
    centre. The big outer ring is the outer turn of the current; the small inner ring is the last turn
    around the still centre. Soft blue and pale green water, with a few light ripples behind the strokes.
  exact:
    - The small inner ring sits in the middle of the large outer ring and touches nothing; it is a little under half as wide as the outer ring.
    - The outer ring's top and right side are one stroke turning down at the top right, with a plain corner and no hook.
    - The outer ring's left side starts where the top stroke starts, and the bottom line meets the end of the left side and runs across to touch the end of the right side.
    - The inner ring is closed the same way, with a left side, a top turning down the right side, and a bottom line that is shorter than the outer bottom, a little under half as long.
  strokes:
    - where: a line down the left side of the large frame, slanting a little to the right, from the top to the bottom
      part: the outer turn of the current, its left bank
    - where: a line across the top of the large frame, turning down at the top right and running down the whole right side
      part: the outer turn of the current, its top and right bank
    - where: a short line down the left side of the small inner ring
      part: the inner ring's left edge
    - where: a short line across the top of the small inner ring, turning down at the right and ending in a plain point
      part: the inner ring's top and right edge
    - where: a short line across the bottom of the small inner ring, rising slightly to the right
      part: the inner ring's bottom edge
    - where: a long line across the bottom of the large frame, rising slightly to the right, from the foot of the left side to the foot of the right side
      part: the outer turn of the current, its bottom bank

迴:
  object: a spiral of water turning round on itself and coming back to where it began, drawn as nested square rings
  history: >-
    The oldest forms drew a spiral, a thing that turns and returns. The modern form squared the
    spiral into a small ring set inside a larger ring, and added the walking radical for a road
    walked in circles.
  layout: >-
    A pale whirlpool fills the upper right, its water winding round and in toward a small still pool
    at the centre. A winding road wraps the whole left and bottom of the frame; a friendly traveller
    with a face and simple pale clothes walks along the road, which circles round the whirlpool. Soft
    blue and pale green, with light ripples behind the strokes.
  exact:
    - The whirlpool stands in the upper right and the road wraps it from the left and from below; the road's long bottom line runs the full width of the frame.
    - The small inner ring sits in the middle of the larger ring and touches nothing; it is about half as wide as the outer ring.
    - The outer ring's top and right side are one stroke turning down at the top right, with a plain corner and no hook.
    - The road's short upper dash stands free of every other stroke, high up at the far left.
    - The road's second stroke runs across, turns down to the left and ends on the start of the long bottom line.
  strokes:
    - where: a line down the left side of the large ring in the upper right, slanting a little to the right
      part: the outer turn of the current, its left bank
    - where: a line across the top of the large ring, turning down at the top right and running down the right side
      part: the outer turn of the current, its top and right bank
    - where: a short line down the left side of the small inner ring
      part: the inner ring's left edge
    - where: a short line across the top of the small inner ring, turning down at the right
      part: the inner ring's top and right edge
    - where: a short line across the bottom of the small inner ring, rising slightly to the right
      part: the inner ring's bottom edge
    - where: a line across the bottom of the large ring, rising slightly to the right, from the foot of the left side to the foot of the right side
      part: the outer turn of the current, its bottom bank
    - where: a short dash at the far upper left, sloping down to the right, standing free
      part: a marker post at the start of the road
    - where: a line starting at the middle of the left edge, going across to the right, then turning down to the left and down to the bottom left
      part: the road's first bend, curling round the left of the whirlpool
    - where: a very long line across the bottom of the frame, starting at the foot of the road's bend and rising slightly to the right, almost to the right edge
      part: the long straight stretch of the road under the whirlpool, where the traveller walks

同:
  object: a shared canopy over a speaking mouth, one voice held in common
  history: >-
    The oldest forms drew a mouth speaking under one shared covering. The modern form squared the
    covering into a tall frame open at the bottom.
  layout: >-
    A tall pale canopy fills the frame like a roofed doorway, open at the bottom, with a small open mouth
    speaking in the middle beneath it. A short shelf lies under the roof, above the mouth. Pale warm
    colours: a sand-coloured canopy, a soft pink mouth.
  exact:
    - The left side of the canopy is a straight vertical line with no hook, starting where the roof starts.
    - The roof runs across and turns down on the right side, ending in a small hook to the left.
    - The right side of the canopy reaches a little lower than the left side, and it ends in the hook.
    - The short shelf under the roof stands free; it touches neither the roof nor the mouth, and it is a little under half as wide as the roof.
    - The mouth is small, about half as wide as the canopy, and sits in the middle below the shelf; it touches neither side of the canopy.
    - In the mouth, the upper lip starts at the top of the left side, and the lower lip starts on the left side near its middle, ending where the upper lip's right side ends.
  strokes:
    - where: a long straight line down the left side of the frame, from near the top to near the bottom
      part: the canopy's left post
    - where: a line across the top from the left post, turning down the right side and ending in a small hook to the left
      part: the canopy's roof and right post, the hook its curled hem
    - where: a short line across the upper middle, under the roof, rising slightly to the right, standing free
      part: a small shelf under the roof
    - where: a short line down the left side of the small mouth in the middle
      part: the mouth's left corner and side
    - where: a short line across the top of the mouth, rising slightly to the right and turning down at the right
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the lower lip

衕:
  object: a shared canopy over a speaking mouth, one voice held in common
  history: >-
    The oldest forms drew a mouth speaking under one shared covering. The modern form squared the
    covering into a tall frame open at the bottom; this longer form sets it in the middle of a street.
  layout: >-
    A pale street crossing fills the frame, a road drawn as the two halves of the walking character:
    a left half made of three sloping kerbs and a right half made of two straight kerbs and a lamp-post
    like line. In the middle, over the street, a small sand-coloured canopy stands with a soft pink mouth
    speaking beneath it, and two friendly walkers with faces and simple pale clothes pass by on the street.
  exact:
    - The canopy in the middle is small and narrow, its left side a straight vertical line with no hook, its roof running across and turning down the right side, ending in a small hook to the left.
    - The little shelf under the canopy's roof stands free of everything.
    - The mouth under the canopy is tiny; its left side and the canopy's left side do not touch.
    - The mouth's bottom is just a short stroke, shorter than its top, and it lies at the end of the mouth's right side.
    - On the left half of the street, the first sloping kerb at the top stands free and does not touch the second one below it; the straight vertical kerb starts from the middle of the second.
    - On the right half, the top dash stands free. The long cross line below it is clearly longer, about one and a half times as long. The tall vertical line starts at the middle of the long cross line and ends in a small hook up to the left.
  strokes:
    - where: a sloping line at the upper left, from the top going down and out to the left, then turning down to the left, standing free
      part: the upper kerb of the left street, falling away
    - where: a sloping line below it on the left, going down and then turning down to the left, not touching the upper kerb
      part: the lower kerb of the left street
    - where: a straight vertical line down the lower left, starting from the middle of the lower kerb
      part: the left street's long middle line
    - where: a straight vertical line in the middle of the frame, from the upper half down to the lower half
      part: the canopy's left post
    - where: a line across the top of the canopy, turning down the right side and ending in a small hook to the left
      part: the canopy's roof and right post
    - where: a short line across the upper middle, under the roof, rising slightly to the right, standing free
      part: a small shelf under the roof
    - where: a short line down the left side of the little mouth
      part: the mouth's left corner and side
    - where: a short line across the top of the mouth, rising slightly to the right and turning down at the right
      part: the upper lip, curving down into the right corner
    - where: a tiny dash at the bottom of the mouth, going across to the right
      part: the lower lip
    - where: a short line across the upper right, rising slightly to the right, standing free
      part: the right street's upper kerb
    - where: a longer line across the middle right, rising slightly to the right, touching the canopy's right post
      part: the right street's cross road
    - where: a line starting in the middle of the cross road and going down the right side, ending in a small hook up to the left
      part: the right street's far kerb, the hook a turning

名:
  object: a name called out by a mouth under the evening moon
  history: >-
    The oldest forms drew a mouth beneath a crescent moon: in the dark of night one cannot see a
    face, so one calls out a name.
  layout: >-
    A pale night sky in soft blue and lavender fills the upper left, with a crescent moon whose rim
    bulges to the right and whose hollow opens to the left. A wide-open mouth calls out in the lower
    right, drawn friendly and pale pink, with a small speech sound shown as soft curved lines behind it.
  exact:
    - The moon's sweep begins at the middle of the short top stroke, and the small mark inside the crescent also begins on that top stroke, without touching the sweep.
    - The moon is the upper-left shape and the mouth sits below and to the right; the mouth's left side touches the middle of the moon's long sweep.
    - The mouth's top and right side end in a small hook down to the left, not touching the moon's sweep.
    - The mouth's bottom line is short, a little over half the length of its top line.
  strokes:
    - where: a short stroke at the top, going down and turning to the left, sloping down to the left
      part: the moon's upper tip
    - where: a long line across the upper left, from the middle of the top stroke across to the right, then turning into a long sweep down to the bottom left
      part: the moon's outer rim, bulging right
    - where: a small short dash inside the crescent, sloping down to the right, below the top stroke
      part: a small crater on the moon
    - where: a short line down the left side of the mouth in the lower middle, starting on the moon's sweep
      part: the mouth's left corner and side
    - where: a line across the top of the mouth, going to the right and ending in a small hook down to the left
      part: the upper lip and right corner of the mouth
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the lower lip

如:
  object: a wife listening, turned toward a mouth that gives her husband's words, and following them
  history: 'An ideogram: a woman 女 following the spoken words 口 of her husband, so as, like.'
  layout: >-
    The woman fills the left half, kneeling and facing right toward the mouth; she has a friendly face
    with eyes, a nose and a mouth, and simple pale clothes. The mouth is a large pale open mouth on the
    right half, in the middle height, speaking, with soft curved lines of sound coming from it toward
    her. The woman and the mouth do not touch.
  exact:
    - In the woman, the long first stroke and the sweep cross each other near their middles.
    - The short line across the woman crosses the long first stroke and rises to the right, ending where the sweep starts.
    - A small gap separates the woman's sweep from the mouth's left side.
    - The mouth's left side and its top line start at the same point; the mouth's right side comes down onto the bottom line near its middle.
    - The mouth is smaller than the woman, about three quarters as tall as her.
    - The mouth's bottom line is short, about half as long as its top line.
  strokes:
    - where: a long stroke in the left half from the top, down and turning to sweep down to the lower right, ending near the middle bottom
      part: the wife's head and back, running down to her lap
    - where: a sweep from the middle of the long stroke down to the bottom left
      part: her arm, reaching down
    - where: a short line across the left half, below the middle, sloping down from the left and turning up to the right, ending on the start of the sweep
      part: her other arm, held across in front of her
    - where: a short line down the left side of the mouth on the right half
      part: the mouth's left corner and side
    - where: a line across the top of the mouth, from the left side, turning down at the right
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, about half as long as its top line, rising slightly to the right
      part: the lower lip

机:
  object: a small wooden table standing beside a tree
  history: >-
    The oldest forms drew a low table or stand; the wood radical was added to say that it is made of
    timber.
  layout: >-
    A tree fills the left third of the frame and a small low table the right two thirds, standing lower
    than the tree. The tree is narrow and tall, with a pale leafy crown behind its branches. The table is
    plain wood in pale tan, with a flat top and two legs, seen from the side. The tree and table
    do not touch.
  exact:
    - The trunk is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The tree's line across crosses the trunk; it is short, about a third as wide as the whole frame, and rises a little to the right.
    - The tree's left root is a sweep starting on the trunk below the branches; the right root is only a very short dot beside the trunk that does not touch it.
    - The table's left leg starts at the left end of the tabletop and does not touch the tree's branches.
    - The table is shorter than the tree, which reaches nearly from top to bottom while the table's top is much lower down.
    - The table's right leg ends in a small flick up to the right, at its foot.
  strokes:
    - where: a short line across the upper part of the left third, rising a little to the right, crossing the trunk
      part: the tree's branches
    - where: a long straight vertical line down the left third, from near the top to near the bottom
      part: the tree's trunk
    - where: a sweep from the middle of the trunk down and out to the bottom left
      part: the tree's left root
    - where: a tiny dot beside the trunk, slanting down to the right, not touching the trunk
      part: the tree's short right root
    - where: a stroke going down from the upper middle, sloping to the lower left, ending at the bottom just right of the tree
      part: the table's left leg
    - where: a line across the top starting at the top of the left leg, rising slightly to the right, then turning down at the far right and curving out to the right, ending in a small flick up
      part: the tabletop and the right leg, the flick its foot

機:
  object: a small wooden table standing beside a tree
  history: >-
    The oldest forms drew a low table or stand; the wood radical was added to say that it is made of
    timber. The long form adds a frame with two skeins of thread.
  layout: >-
    A tree fills the left third of the frame. On the right a larger wooden table stands, its tall frame post
    slanting through it, with two small pale skeins of thread hanging above the tabletop. The table
    is plain pale tan wood; the skeins are soft cream. The tree and the table do not touch.
  exact:
    - The trunk is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The tree's line across crosses the trunk; it is short, about a quarter as wide as the frame.
    - The tree's right root is only a tiny dot beside the trunk that does not touch it.
    - The table's long tabletop line runs across the middle and is clearly the longest line across, nearly twice as long as the tree's line across.
    - The tall slanting post starts high at the top centre, crosses the tabletop and a short leg-sweep, and ends at the lower right in a small hook up.
    - The two skeins of thread are made of a bent line with a small hook, a bent line returning up, and a dot; the skein dots stand beside them.
    - The small dot on the far right stands free of everything.
  strokes:
    - where: a short line across the upper part of the left third, rising a little to the right, crossing the trunk
      part: the tree's branches
    - where: a long straight vertical line down the left third, from near the top to near the bottom
      part: the tree's trunk
    - where: a sweep from the middle of the trunk down and out to the bottom left
      part: the tree's left root
    - where: a tiny dot beside the trunk, slanting down to the right
      part: the tree's short right root
    - where: a short stroke in the upper centre, going down and ending in a small hook to the right
      part: the first skein's loop, hanging from the frame
    - where: a short stroke below it, going down to the left and turning up to the right
      part: the first skein's bend
    - where: a small dot below and to the right of the first skein, slanting down to the right
      part: the first skein's knot
    - where: a short stroke in the upper right, going down and ending in a small hook across to the right
      part: the second skein's loop, hanging from the frame
    - where: a short stroke below it, going down and turning to the left, then up to the right
      part: the second skein's bend
    - where: a small dot at the right of the second skein, slanting down to the right
      part: the second skein's knot
    - where: a long line across the middle of the right two thirds, rising to the right
      part: the tabletop
    - where: a stroke from the middle of the tabletop going down and turning down to the left
      part: the table's left leg
    - where: a small dot under the tabletop, slanting down to the right
      part: a wooden peg under the table
    - where: a very long stroke starting at the top centre, going down and curving down to the lower right, ending in a small hook up
      part: the table's tall slanting post, crossing the tabletop
    - where: a stroke from the right side of the tabletop going down to the lower left, crossing the post
      part: the table's right brace
    - where: a small dot at the far right, slanting down to the right, standing free
      part: a wooden peg on the right of the table

先:
  object: a person striding forward, one foot stepping ahead, in front of another who follows
  history: >-
    The oldest forms drew a foot above a person: the foot steps ahead, so first.
  layout: >-
    Above, a bare foot steps forward to the right; below, a second person with a friendly face and simple
    pale clothes follows, standing with legs apart, the foot stepping in front of this person. Pale
    colours.
  exact:
    - The top foot's stroke across crosses its vertical near the vertical's upper part; the vertical ends on the long line across.
    - The long line across the middle is about twice as long as the short stroke across above it.
    - The left leg of the lower person is a plain sweep and does not touch the long line across; a small gap separates them.
    - The right leg starts on the long line across, from the other side of where the vertical ends, goes down, then bends across to the right and ends in a small hook up.
    - The right leg is clearly the longest stroke going down.
  strokes:
    - where: a short stroke at the upper left, going down and turning down to the left
      part: the stepping foot's heel
    - where: a short line across the upper middle, rising slightly to the right, starting on the heel and crossing the vertical
      part: the stepping foot's instep
    - where: a vertical line from the top centre, leaning a little to the right, down to the long line across
      part: the stepping leg
    - where: a long line across the middle, rising slightly to the right, from the left to the right
      part: the ground the foot steps on, and the follower's shoulders
    - where: a sweep from below the left of the long line down to the bottom left, not touching it
      part: the follower's left leg
    - where: a long stroke from the middle of the long line going down, then curving to the right and across, ending in a hook up
      part: the follower's right leg, ending at the toes

並:
  object: two people sitting side by side on one bench
  history: 'The oldest forms drew two people standing or sitting side by side: together, also.'
  layout: >-
    Two people sit close side by side across the middle of the frame, their small heads at the top with
    friendly faces, each with a bit of hair on top, both in simple pale clothes. They share one long
    plank bench along the bottom. Pale, soft colours.
  exact:
    - The left little stroke at the top is a short dash standing free; the right one is about twice as long and ends sweeping down to the left, and its end touches the middle of the line across under it.
    - The line across the shoulders is clearly shorter than the bench at the bottom, a little over two thirds as long.
    - Both bodies hang from the line across and reach down to the bench; they are about the same length, and both end on the bench.
    - The small dash at the lower left stands free, and the sweep at the lower right ends on the right body.
  strokes:
    - where: a short dash at the upper left, sloping down to the right
      part: the left person's hair
    - where: a longer stroke at the upper middle-right, sloping down to the right and turning down to the left
      part: the right person's hair
    - where: a line across, under the hair, from the left to the right, almost level
      part: the two people's shoulders
    - where: a long line down from the line across, slightly to the right, ending on the bench
      part: the left person's body
    - where: a long line down from the line across, slightly to the right, ending on the bench
      part: the right person's body
    - where: a short dash at the lower left of the left body, sloping down to the right, standing free
      part: the left person's hand resting on the bench
    - where: a stroke at the right, sloping down to the right then turning down to the left, ending on the right body
      part: the right person's arm
    - where: a long line across the bottom, from the left edge to the right edge
      part: the bench they share

并:
  object: two people sitting side by side on one bench
  history: 'The oldest forms drew two people standing or sitting side by side: together, also.'
  layout: >-
    Two people stand close together in the middle, their small heads at the top with friendly faces and a
    bit of hair on top, both in simple pale clothes. They hold one long rail between them across their
    middles. Pale, soft colours.
  exact:
    - The two little strokes at the top stand free and touch nothing; the left one is short, the right one is clearly longer, about one and a half times as long, and ends sweeping down to the left.
    - The line across the shoulders is short, a little over half as long as the long rail.
    - The left body starts at the start of the line across and sweeps down to the lower left; the right body starts at the middle of the line across and is a straight vertical.
    - Both bodies cross the long rail.
    - The left body is a little shorter than the right, about nine tenths as long, and the right body reaches lower.
  strokes:
    - where: a short dash at the upper left, sloping down to the right
      part: the left person's hair
    - where: a longer stroke at the upper right, sloping down to the right and turning down to the left
      part: the right person's hair
    - where: a line across under the hair, rising slightly to the right, from the left to the right, a little over half as long as the long rail
      part: the two people's shoulders
    - where: a long line across the middle, from the left to the right
      part: the rail both people hold
    - where: a stroke from the left end of the shoulders going down and sweeping to the bottom left, crossing the rail
      part: the left person's body
    - where: a straight line down from the middle of the shoulders to the bottom, crossing the rail
      part: the right person's body

安:
  object: a woman sitting safe inside a house
  history: 'An ideogram: a woman 女 under a roof 宀, calm and safe.'
  layout: >-
    A small pale house with a wide roof fills the upper part of the frame; the woman kneels inside it
    in the lower part, facing left, with a friendly face and simple pale clothes. Her body is lower than
    the roof and her arms reach out to both sides. Soft warm colours: a cream house, a pale blue gown.
  exact:
    - The tiny dash at the top stands free; it does not touch the roof.
    - The roof's left edge is a short vertical line, and the roof line starts at the middle of that edge, runs across to the right and ends in a small hook down to the left.
    - In the woman, the long first stroke and the sweep cross each other, and the long line across crosses both.
    - The long line across is wider than the roof and reaches further both left and right; it is about a quarter longer than the long first stroke.
  strokes:
    - where: a tiny dash at the top centre, sloping down to the right
      part: the ridge ornament at the top of the roof
    - where: a short line down the upper left, from the top to the middle height
      part: the roof's left edge
    - where: a line across the upper part, starting on the left edge, running right and ending in a small hook down to the left
      part: the roof, with its right eave curling down
    - where: a long stroke from the middle of the frame going down, then turning to sweep down to the lower right
      part: the woman's head and back, then her lap
    - where: a sweep from the right of the middle down to the bottom left
      part: her arm, reaching down
    - where: a long line across, just below the middle, from near the left edge to near the right edge
      part: her other arm, held across in front

西:
  object: a bird settling into its nest at sunset
  history: >-
    The oldest forms drew a bird sitting on its nest, as the sun goes down in the west.
  layout: >-
    A pale sunset sky of orange and soft pink fills the frame behind. A bird, a small plain pale bird
    with a face, perches on top and drops its two legs into a woven nest that fills the lower three
    quarters of the frame. The nest is a basket open at the top and closed at the bottom.
  exact:
    - The bird's back is the line across at the top; both its legs hang from the middle of that line.
    - The left leg is a straight vertical line with no hook; the right leg is longer and ends in a small hook to the right.
    - The right leg is clearly longer than the left, about one and a quarter times as long.
    - The nest's left side does not touch the bird's left leg; a small gap separates them.
    - The nest's rim runs across and turns down on the right side, ending in a small hook up to the left; its bottom line is shorter than the rim and ends where the rim ends.
    - The nest's left side starts at the start of the rim and ends where the bottom line starts.
  strokes:
    - where: a line across the top of the frame, rising slightly to the right
      part: the bird's back, wings folded
    - where: a short line down the left side of the lower area, sloping a little to the right, from the middle height to the bottom
      part: the nest's left wall
    - where: a line across the rim of the nest, from the left wall's top, turning down the right side and ending in a small hook up to the left
      part: the nest's rim and right wall
    - where: a straight vertical line down from the middle of the bird's back, passing through the rim, in the left part
      part: the bird's left leg
    - where: a line down from the middle of the bird's back, passing through the rim, in the right part, ending in a small hook to the right
      part: the bird's right leg, the hook its claw
    - where: a line across the bottom of the nest, rising slightly to the right, from the foot of the left wall
      part: the nest's floor

死:
  object: a mourner kneeling beside a dead body, pale bones lying on the ground
  history: >-
    The oldest forms drew a person kneeling beside a corpse or bones laid out: death.
  layout: >-
    On the left lie the pale bones of the dead, laid out calmly; on the right a mourner kneels facing
    left, with a friendly sad face and simple pale clothes, bending toward the dead. Pale, soft colours;
    no blood or gore.
  exact:
    - The line across the top stands free of all other strokes.
    - The long bone starts at the middle of the arm bone; the small bone starts at the arm bone's end and does not touch the long bone.
    - The long line across the bones, turning down to the left, is the longest on the left; the top line is about three quarters as long.
    - The mourner's tall back touches neither the top bone nor the long bone, small gaps separate them.
    - The mourner's short stroke ends at the middle of the tall back; the tall back turns across at the bottom and ends in a small hook up.
  strokes:
    - where: a line across the top left, almost level, standing free
      part: the top bone, lying across
    - where: a short stroke below the left of the top line, going down and sweeping to the left
      part: the arm bone, bent
    - where: a long line starting at the middle of the arm bone, going across to the right, then sweeping down to the bottom left
      part: the spine and leg bones
    - where: a small dash near the end of the arm bone, sloping down to the right
      part: a small bone beside the arm
    - where: a short stroke at the upper right, going down and to the left, ending on the mourner's back
      part: the mourner's bowed head and neck
    - where: a tall stroke at the right, going down from the top, then turning across to the right, ending in a small hook up
      part: the mourner's back, the knees folded on the ground, the toes turned up

次:
  object: a person yawning wide, the breath puffing out in two small clouds
  history: 'An ideogram: a person 欠 yawning with a wide open mouth, again and again 冫.'
  layout: >-
    A friendly person on the right half, with a face, a wide-open yawning mouth and simple pale clothes, faces
    left and covers the yawn with one hand. Two small pale puffs of breath float out to the left, one
    above the other. Pale colours.
  exact:
    - The two little puffs on the left stand free of every other stroke.
    - The upper puff is a short dash sloping down to the right; the lower puff is longer, about twice as long, and rises toward the right.
    - The person's head stroke and the sweeping body stroke do not touch; a gap separates them.
    - The raised arm starts on the head stroke at its middle, and the long right leg starts from the middle of the body sweep.
    - The right leg is a little shorter than the left sweep, about nine tenths as long.
  strokes:
    - where: a short dash at the upper left, sloping down to the right
      part: the upper puff of breath
    - where: a longer stroke at the lower left, going down to the right and turning up
      part: the lower puff of breath
    - where: a stroke from the top centre, going down to the right, then down and turning to the left
      part: the person's head and back, the chin bowed
    - where: a line across from the middle of the head stroke, going to the right and then turning down to the left
      part: the raised arm, the hand over the yawning mouth
    - where: a long stroke from the middle going down to the right, then turning down and sweeping down to the left, to the bottom left
      part: the person's body and left leg
    - where: a stroke from the middle of the body going down to the right, then turning across to the right, to the bottom right
      part: the person's right leg

她:
  object: a woman standing beside you
  history: 'An ideogram: a woman 女 beside someone 也, she.'
  layout: >-
    The woman fills the left part and faces right toward you; the other figure, you, stands at her side
    on the right and faces left. Both have friendly faces with eyes, a nose and a mouth, and wear simple
    pale clothes; the woman wears a pale pink gown, you a pale blue cloak.
  exact:
    - In the woman, the long first stroke and the sweep cross each other, and the short rising line crosses the first stroke and ends where the sweep starts.
    - A small gap separates the woman's sweep from the figure's arm line, so they do not touch.
    - The other figure's body and arm cross each other, and the big outer line starts at the arm's start.
    - The outer line is the longest stroke, longer than the woman's first stroke, and ends rising to the right.
    - The arm line ends in a small hook up to the left.
  strokes:
    - where: a long stroke in the left part from the top down, turning to run down to the lower right
      part: the woman's head and back, then her lap
    - where: a sweep from the middle of the long stroke down to the bottom left
      part: her arm, reaching down
    - where: a short line across the left, rising to the right, ending where the sweep starts
      part: her other arm, held across her
    - where: a line from the middle-left going across and rising to the right, then turning down, ending in a small hook up to the left
      part: the other figure's arms, the hook a sleeve edge
    - where: a stroke from the top of the right part going down to the right and then down, crossing the arm line
      part: the other figure's head and body
    - where: a long line starting at the same point as the arm line, going down, then across to the right and up at the end
      part: the other figure's long cloak, along its back and hem

式:
  object: a craftsman's awl and measuring square, the tools of rule and pattern
  history: >-
    The oldest forms drew a bent awl beside a carpenter's square: tools that fix a pattern or rule.
  layout: >-
    On a bench, a long bent awl stands in the right part, its handle crossed by a short bar; in the lower left
    lies a small carpenter's square. The tools are pale wood and light steel on a pale ground. No person is
    drawn.
  exact:
    - The bar across the awl crosses its shaft in the middle; it is long, nearly half as wide as the frame.
    - The awl's shaft is the longest stroke, starting at the top, curving down to the lower right and ending in a small hook up.
    - The small dash at the upper right stands free.
    - The square's top bar is about half as long as the bar across the awl.
    - The square's base is nearly as long as the bar across the awl, about nine tenths.
    - The square's upright is very short, about an eighth of the awl's length; it joins the top bar and the base.
    - The square's base rises a little to the right at its end and is clearly the longest of the three square lines.
  strokes:
    - where: a line across the upper middle, rising slightly to the right, crossing the long curved stroke
      part: the awl's handle bar
    - where: a short line across the left of the middle height, rising slightly to the right
      part: the square's top arm
    - where: a very short line down from the middle of the square's top arm
      part: the square's inner corner post
    - where: a line across near the bottom left, rising to the right at its end, nearly as long as the bar across the awl
      part: the square's long base arm
    - where: a very long stroke from the top, going down, then curving to the lower right, ending in a hook up
      part: the awl's shaft and point, the hook its curved tip
    - where: a small dash at the upper right, sloping down to the right, standing free
      part: a stud on the awl's handle

军:
  object: soldiers sitting in a war cart under a cloth cover
  history: >-
    The oldest forms drew a cart with a cover over it, and soldiers in the cart: an army.
  layout: >-
    A war cart seen from above fills the lower part of the frame, with a pale cloth cover stretched over
    its top. Under the cover sit helmeted soldiers with friendly faces and simple pale clothes. Colours:
    cream cover, pale wood cart, soft grey helmets.
  exact:
    - The cover's left post is a short vertical stroke; the cover's top starts at the start of that post, runs across and ends turning down to the right in a small hook to the left.
    - The cover's top line is longer than the cart's top wheel, about one and a half times as long.
    - The cart's body stroke goes down, then turns across to the right; it crosses the top wheel and a small gap separates it from the cover.
    - The axle is a vertical line crossing both the body line and the long wheel; it does not touch the top wheel.
    - The long bottom line is the longest line across in the cart, about one and a half times as long as the top wheel.
  strokes:
    - where: a short vertical stroke at the upper left
      part: the cover's left post
    - where: a line across the top, from the post's top, rising slightly to the right, then turning down at the right and ending in a small hook to the left
      part: the cloth cover, its right edge hanging
    - where: a line across the upper middle, rising slightly to the right
      part: the top wheel's rim
    - where: a stroke going down from the upper middle of the top wheel, then turning across to the right
      part: the cart's body, front and floor
    - where: a long line across the lower part, from the left to the right
      part: the bottom wheel's rim
    - where: a vertical line from the middle down to the bottom, crossing the body line and the long wheel
      part: the axle

軍:
  object: soldiers sitting in a war cart under a cloth cover
  history: >-
    The oldest forms drew a cart with a cover over it, and soldiers in the cart: an army.
  layout: >-
    A war cart seen from above fills the lower part of the frame, with a pale cloth cover stretched over
    its top. Under the cover sit helmeted soldiers with friendly faces and simple pale clothes. The
    cart has a body box in the middle, a wheel's rim at the top and a wheel's rim at the bottom, joined
    by one axle. Colours: cream cover, pale wood cart, soft grey helmets.
  exact:
    - The cover's left post is a short vertical stroke; the cover's top starts at the start of that post and ends in a small hook down to the left.
    - The top wheel's rim is short, about a third as long as the bottom wheel's rim.
    - The cover's top line is about three quarters as long as the bottom wheel's rim, and the lower inner line in the body is a little longer than the upper one, about a third longer.
    - The cart's body box is made of a short left side, a top turning down the right side, and two lines across inside it.
    - The body's left side ends where the lower inner line starts, and the lower inner line ends at the end of the body's right side.
    - The axle is the tallest vertical line, about four times as tall as the cover's post; it crosses the top wheel, the body top, both inner lines and the bottom wheel.
    - The axle does not touch the cover, a small gap separates them.
  strokes:
    - where: a short vertical stroke at the upper left
      part: the cover's left post
    - where: a line across the top, starting at the post's top, about three quarters as long as the bottom wheel, ending in a small hook down to the left
      part: the cloth cover
    - where: a short line across the top middle, rising slightly to the right
      part: the top wheel's rim
    - where: a short vertical line down the left of the middle
      part: the cart body's left side
    - where: a line from the top of the left side going across to the right and turning down the right side
      part: the cart body's top and right side
    - where: a short line across inside the body, rising slightly to the right, in the upper part
      part: the body's upper bench
    - where: a longer line across inside the body, a little longer than the upper one, rising slightly to the right, in the lower part, from the foot of the left side to the right side
      part: the body's lower bench
    - where: a long line across the lower part of the frame, from the left edge to near the right edge
      part: the bottom wheel's rim
    - where: a very long vertical line from the top centre down to the bottom
      part: the axle running through the cart

色:
  object: a person bending toward what they desire, a second person kneeling before them
  history: >-
    The oldest forms drew one person bending over another: desire, and so the look and colour of a
    face. Here the bent figure leans toward what it wants.
  layout: >-
    A person stands at the top left and leans forward and down toward the right, with a friendly face and
    simple pale clothes. Below, a second person kneels, facing up and left toward the first, with a
    friendly face and simple pale clothes of a different soft colour. Pale blush colours.
  exact:
    - The standing person's two strokes join, the second starting on the middle of the first and ending on the kneeling person's head line.
    - A small gap separates the standing person's sweep from the kneeling person's long body line, which starts at the same point as the head line.
    - The kneeling person's head line runs across and ends in a small hook down to the left.
    - The short neck line starts on the middle of the head line, and a tiny gap separates it from the standing person's second stroke; the neck ends on the arm line.
    - The arm line starts at the start of the long body line and ends where the head line ends; the arm line is about two thirds as long as the head line.
    - The long body line is the longest stroke, going down, curving out to the right along the ground and ending turning up twice.
  strokes:
    - where: a sweep at the top centre, going down and then turning down to the left
      part: the standing person's head and back, leaning
    - where: a line starting at the middle of the sweep, going across to the right, then turning down to the left, ending on the head line
      part: the standing person's reaching arm
    - where: a line across the middle, going to the right and ending in a small hook down to the left
      part: the kneeling person's head and shoulders
    - where: a short vertical line down from the middle of the head line
      part: the kneeling person's neck
    - where: a short line across lower down, rising slightly to the right, starting at the start of the long body line and ending below the end of the head line
      part: the kneeling person's arms
    - where: a long stroke starting at the left of the head line, going down the left side, then curving out to the right along the bottom and rising up at the end
      part: the kneeling person's back and folded legs, the end the toes

論:
  object: speech from a mouth explaining a neat bundle of bamboo slips, tied in order
  history: >-
    The oldest forms drew a mouth speaking with a bundle of slips of bamboo beneath a cover: a spoken
    account in order.
  layout: >-
    On the left a speaking mouth, pale pink, with short lines of speech above it, one above the other.
    On the right, a roof-like cover over a neat bundle of tied bamboo slips, in pale yellow, standing in the
    middle height. A small speaker with a friendly face and simple pale clothes stands behind the mouth.
    Pale colours.
  exact:
    - The three lines of speech and the dot above them stand free of everything; the top line is longest, about twice as long as the other two.
    - The mouth in the lower left is closed by the bottom line, which touches the left side at its middle and ends with the top-and-right line.
    - The roof's two sweeps are the left one long and sloping down to the left, the right one shorter, running down and turning across to the right.
    - The short rising line under the roof stands free.
    - The bundle's left side and its top-and-right outline start together; the outline ends in a small hook to the left.
    - The two slips hang from the top of the bundle and both cross the cord.
  strokes:
    - where: a small dash at the very top left, sloping down to the right, standing free
      part: a spark of speech
    - where: a line across the upper left, rising slightly to the right
      part: the top line of speech
    - where: a shorter line below it, rising slightly to the right, standing free
      part: the second line of speech
    - where: a shorter line below that, rising slightly to the right, standing free
      part: the third line of speech
    - where: a short line down the lower left
      part: the mouth's left side
    - where: a line across the top of the mouth, going to the right and turning down
      part: the mouth's upper lip and right corner
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip
    - where: a long stroke from the top centre going down and sweeping down to the left
      part: the roof's left slope
    - where: a stroke from the top of the roof going down to the right, then turning across to the right
      part: the roof's right slope and eave
    - where: a short line rising to the right in the middle, below the roof, standing free
      part: a small crossbeam under the roof
    - where: a short vertical line down the left of the lower half, not touching the beam
      part: the bundle's left edge
    - where: a line from the top of the bundle's left edge, going across to the right, rising slightly, then turning down and ending in a small hook to the left
      part: the bundle's top and right side
    - where: a short line across the lower middle, rising slightly to the right, crossing the slips
      part: the cord that ties the slips
    - where: a short vertical line in the lower middle, crossing the cord
      part: the first bamboo slip
    - where: a short vertical line right of it, crossing the cord
      part: the second bamboo slip

论:
  object: speech from a mouth explaining a neat bundle of bamboo slips, tied in order
  history: >-
    The oldest forms drew a mouth speaking with a bundle of slips of bamboo beneath a cover: a spoken
    account in order.
  layout: >-
    On the left a speaking mouth with a single puff of speech above it, pale pink. On the right, a
    roof-like cover over a neat bundle of tied bamboo slips in pale yellow. A small speaker with a face
    and simple pale clothes stands behind the mouth. Pale colours.
  exact:
    - The puff of speech and the mouth's curl stand free of everything; the curl is much longer than the puff, more than four times as long.
    - The roof's left sweep is long and slopes down to the left; the right stroke is shorter and ends turning across to the right.
    - The small tying stroke starts a little below the roof's right stroke without touching it, and ends on the start of the bundle's frame.
    - The bundle's frame goes down, then turns across to the right and ends in a small hook up.
    - A small gap separates the curl from the roof's left sweep and from the bundle's frame.
  strokes:
    - where: a small dash at the top left, sloping down to the right, standing free
      part: a puff of speech
    - where: a long line starting at the middle left, going across and rising slightly to the right, then turning down and curving up to the right at the end
      part: the mouth's lips and the curl of the voice
    - where: a long stroke from the top centre going down and sweeping down to the left
      part: the roof's left slope
    - where: a stroke from the top of the roof going down to the right, then turning across to the right
      part: the roof's right slope and eave
    - where: a short stroke under the right of the roof, going down and turning down to the left
      part: the cord hanging from the roof to the bundle
    - where: a stroke from the middle going down, then turning across to the right and ending in a small hook up
      part: the bundle's left side and base, the hook its tied end

件:
  object: a man dividing up a cow, sharing it out
  history: 'An ideogram: a man 亻 dividing a cow 牛, so one item, one piece.'
  layout: >-
    A man stands on the left, facing right, with a friendly face and simple pale clothes, both hands out
    in a gesture of dividing. The cow's head and horns fill the right, seen from the front, with a face
    (eyes, nose, mouth). Pale warm colours.
  exact:
    - In the man, the leg line starts at the middle of the sweeping body stroke, and the man's leg line is nearly as long as the body stroke, about nine tenths as long.
    - A small gap separates the man's leg from the cow's long line across.
    - In the cow, the right horn starts on the left horn at its middle and rises to the right, and the central stroke crosses it.
    - The horn line is about half as long as the cow's long line across.
    - The cow's long line across and the central stroke cross each other; the central stroke is the longest of the cow.
    - The cow's central stroke is a straight vertical line ending in a plain point at the bottom, with no hook.
  strokes:
    - where: a long stroke at the left, going down and sweeping down to the left
      part: the man's body and arm
    - where: a straight line down from the middle of the body stroke, to the lower left
      part: the man's legs
    - where: a short stroke at the upper middle, going down to the left
      part: the cow's left horn
    - where: a line from the middle of the left horn going across to the right, rising slightly, about half as long as the long line across the middle
      part: the cow's right horn
    - where: a long line across the middle, from the left to the right edge
      part: the cow's broad brow and ears
    - where: a long straight line down from the top centre to the bottom, crossing the horn line and the line across
      part: the cow's face and nose

共:
  object: two hands holding up one object together
  history: 'An ideogram: two hands 八 raising one object 廾, all, together.'
  layout: >-
    Two open pale hands come in from below at the bottom, spread to the left and right, and hold up
    a tall pale tray in the upper part, made of two posts and crossbars. The hands are separate. The
    tray and the hands are in soft warm colours.
  exact:
    - The two posts of the tray both cross the crossbar high up and their feet end on the long platform line; the right post is a little longer than the left, about one and a sixth times as long.
    - The long platform line is wide and almost fills the frame, about one and a half times as wide as the crossbar above it.
    - The two hands stand free of the platform line and of each other, with small gaps between them.
    - The left hand is a sweep down to the left; the right hand is a shorter falling stroke down to the right.
  strokes:
    - where: a line across the upper part, rising slightly to the right, crossing both posts, about two thirds as long as the platform line
      part: the tray's top crossbar
    - where: a stroke in the left of the upper part, going down to the right and then down, to the platform line
      part: the tray's left post
    - where: a stroke from the top of the right of the upper part, going down to the right and then down, to the platform line
      part: the tray's right post
    - where: a long line across the middle-lower part, from the left to the right
      part: the tray's platform
    - where: a short stroke at the lower left, going down to the right then turning down to the left, standing free
      part: the left hand, open and lifting
    - where: a short stroke at the lower right, going down to the right, standing free
      part: the right hand, open and lifting

至:
  object: a bird alighting on the ground, its legs reaching the earth
  history: >-
    The oldest forms drew a bird or an arrow dropping to the ground below it: to arrive.
  layout: >-
    A pale small bird with a face comes down from above, wings spread, facing right, beak at its right end.
    Beneath it is bare earth with a small mound. Soft blue sky, tan earth, pale colours.
  exact:
    - The line across the top is the bird's wing; the body stroke starts at the middle of that line and the beak dot touches the body's end.
    - The short line across the earth crosses the bird's leg, which comes down from just under the body; a small gap separates the leg from the body.
    - The leg ends on the middle of the long ground line.
    - The ground line is clearly the longest across, about one and a half times as long as the wing line.
    - The mound line is a little shorter than the wing line, about five sixths as long.
  strokes:
    - where: a line across the top, from the left to the right
      part: the bird's spread wing
    - where: a stroke from the middle of the wing going down to the left, then turning across and rising slightly to the right
      part: the bird's body and tail, swinging round
    - where: a short stroke at the right, going down to the right, ending on the body
      part: the bird's beak
    - where: a short line across the middle-lower part, rising slightly to the right, crossing the leg
      part: a small mound of earth
    - where: a short stroke from below the body going down to the right and then down
      part: the bird's leg, reaching down to the ground
    - where: a long line across the bottom, from the left to the right
      part: the ground

老:
  object: an old person bent over, walking with a crutch, long hair streaming
  history: >-
    The oldest forms drew an old person, bent over, with long hair and a crutch.
  layout: >-
    An old person with a kind wrinkled face, long pale hair and simple pale clothes bends forward and walks
    with a crutch. The crutch stands in the upper middle and the hair streams across the whole frame
    from the upper right to the lower left. The bent legs are at the bottom right. Pale colours.
  exact:
    - The crutch's handle crosses the top of the crutch's shaft; the shaft ends on the long line across the middle.
    - The long hair stroke starts high at the upper right and does not touch the handle; a small gap separates them.
    - The crutch's handle is short, a little over a third as long as the long line across the middle.
    - The long line across the middle crosses the hair stroke.
    - The old person's thigh is a short sweep and the shin is a longer stroke with a hook up at the end.
    - The short thigh sweep is only a third as long as the hair stroke, and it ends where the shin starts; the shin starts on the middle of the hair stroke.
  strokes:
    - where: a short line across the upper left of the middle, almost level, a little over a third as long as the long line across the middle
      part: the crutch's handle
    - where: a stroke from the top centre going down to the right and then down, ending on the long line across
      part: the crutch's shaft
    - where: a very long line across the middle, rising slightly to the right, from the left edge to near the right edge
      part: the bent back of the old person
    - where: a very long sweep from the upper right down to the bottom left
      part: the long hair streaming down
    - where: a short sweep in the lower right, going down to the left
      part: the old person's thigh
    - where: a stroke starting at the left of the lower right, going down, then across to the right, ending in a hook up
      part: the shin and foot

交:
  object: a person standing with arms out and legs crossed
  history: 'The oldest forms drew a person standing with legs crossed: to cross, to exchange.'
  layout: >-
    A person fills the frame, seen from the front, with a friendly face, a topknot, simple pale clothes
    and arms stretched wide, the sleeves hanging. The legs cross at the knees and the feet point
    apart. Pale colours.
  exact:
    - The topknot dash, the two hanging sleeves and the arm line stand free, and none of them touches another.
    - The line across the arms is long, a little narrower than the spread of the legs, and rises slightly to the right.
    - The two legs cross each other in the middle, the left leg sweeping down to the left and the right leg falling down to the right and ending in a stroke across.
    - The right leg is a little longer than the left, a little over one and a tenth times as long.
    - The two sleeves are short strokes, the left sweeping down to the left, the right a dash sloping down to the right.
  strokes:
    - where: a small dash at the top centre, sloping down to the right
      part: the topknot
    - where: a long line across the upper part, rising slightly to the right
      part: the arms stretched wide
    - where: a short stroke below the left of the arm line, going down and sweeping down to the left, standing free
      part: the left sleeve hanging
    - where: a short dash below the right of the arm line, sloping down to the right, standing free
      part: the right sleeve hanging
    - where: a long stroke from the middle going down and sweeping down to the bottom left
      part: the left leg, crossing in front
    - where: a stroke from the left of the middle going down to the right and then across to the right at the bottom
      part: the right leg, crossing behind, with the foot pointing out

各:
  object: a leg walking and a mouth talking
  history: 'An ideogram: walking 夂 and talking 口, each one.'
  layout: >-
    Above, a leg strides downward and forward to the right, the foot at the right; below, a wide-open
    mouth talks, pink and friendly, with soft curved lines of sound. A friendly walker with a face
    and simple pale clothes is behind the mouth. Pale colours.
  exact:
    - The thigh stroke is the first stroke, and the long leg stroke starts at its middle.
    - The foot stroke also starts at the middle of the thigh stroke, and the leg and the foot cross each other in the middle.
    - The leg stroke is the longest, more than twice as long as the thigh.
    - The mouth's left side is short, and its top-and-right ends in a small hook down to the left, not touching the foot stroke.
    - The mouth's bottom line starts at the end of the left side and ends where the top line ends.
    - The mouth's bottom line is a little over half as long as its top line.
  strokes:
    - where: a stroke from the top centre going down and sweeping down to the left
      part: the walker's thigh
    - where: a long stroke from the middle of the thigh, going across to the right, then sweeping down to the bottom left
      part: the leg, swinging forward
    - where: a stroke from the middle of the thigh going down to the right, then across to the right
      part: the foot stepping out
    - where: a short line down the left side of the mouth in the lower middle
      part: the mouth's left corner and side
    - where: a line across the top of the mouth, going to the right and ending in a small hook down to the left
      part: the upper lip and right corner
    - where: a short line across the bottom of the mouth, a little over half as long as the top line, rising slightly to the right
      part: the lower lip

早:
  object: the sun just risen over the horizon, a ray of first light falling
  history: >-
    The oldest forms drew the sun above a line or a cross of rays: the morning, early.
  layout: >-
    A round pale yellow sun with a streak of cloud across it sits at the top over a long line of the horizon.
    A single straight ray of light shines from the sun down across the horizon. A soft peach sky
    fills the frame; the land is a pale green below the lowest stroke.
  exact:
    - The sun's frame is a left side, and a top turning down the right side; its base rises slightly to the right, and the base starts where the left side ends and ends where the top ends.
    - The cloud streak inside the sun starts on the left side, stops short of the right side, is short, about one third as long as the top, and rises slightly to the right.
    - The sun's top line is clearly shorter than the horizon line, about three quarters as long.
    - The ray starts on the middle of the sun's base and a small gap separates it from the end of the sun's left side.
    - The horizon line is long, nearly the width of the frame, and is about one and a third times as long as the sun's top line is wide; the ray crosses it.
    - The ray is a straight vertical line ending in a plain point at the bottom, with no hook.
  strokes:
    - where: a short line down the left side of the sun in the upper middle
      part: the sun's left edge
    - where: a line across the top of the sun, from the left side's top, turning down the right side, about three quarters as long as the horizon line
      part: the sun's top and right edge
    - where: a short line across inside the sun, rising slightly to the right, starting on the left edge
      part: a streak of cloud across the sun
    - where: a short line across the bottom of the sun, rising slightly to the right
      part: the sun's base, sitting on the horizon
    - where: a long line across the middle, from near the left edge to near the right edge, almost level, longer than the sun's top line
      part: the horizon
    - where: a long straight vertical line from the middle of the sun's base down through the horizon to the bottom
      part: the first ray of light falling to the earth

再:
  object: two fish caught in a net hung on a fishing line
  history: >-
    The oldest forms drew two fish tied together on one line: twice, again.
  layout: >-
    A fishing line hangs from the pole at the top. At its end hangs a small net bag, open at the sides,
    holding two pale silver fish one above the other, a small one above and a bigger one below, their
    heads and tails sticking out of the net. Soft blue water colours behind.
  exact:
    - The pole across the top is level; the hanging line starts on the middle of the pole.
    - The net's left side starts at the left of the net's top, and the net's top runs across and turns down on the right, ending in a small hook to the left.
    - The hanging line crosses the net's top and both fish; it ends on the lower fish's body.
    - The small upper fish is a short line across, only about two fifths as long as the pole's width; it does not touch the net's left side and a small gap separates it from the net's right side.
    - The lower fish is a long line across, crossing the net's left side and right side; it is nearly as long as the net's top.
    - The net's left side is a straight vertical line with no hook.
  strokes:
    - where: a line across the top, rising slightly to the right
      part: the fishing pole
    - where: a long straight vertical line down the left side of the lower area
      part: the net's left side
    - where: a line across the top of the net, starting at the left side, turning down the right side and ending in a small hook to the left
      part: the net's top and right side
    - where: a vertical line from the middle of the pole down to the lower middle
      part: the fishing line
    - where: a short line across the middle of the net, rising slightly to the right, standing across the fishing line
      part: the small fish caught
    - where: a long line across the lower part of the net, extending beyond both sides
      part: the large fish caught
