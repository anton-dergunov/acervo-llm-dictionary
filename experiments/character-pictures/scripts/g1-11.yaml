# Full run, group g1, batch 11. Written from the fact sheets, following scripts/GUIDE.md.

步:
  object: two bare feet, one put down in front of the other, taking a step
  history: >-
    An ideogram: one foot 止 placed in front of the other foot, which trails behind. The modern form
    keeps the front foot on top and the rear foot underneath it.
  layout: >-
    The two feet are drawn as pale bare feet in two rows. The front foot fills the upper part, toes
    up, standing flat on the long line across. The rear foot fills the lower part, a little narrower,
    the toes of its first stroke touching the front foot's ground line. Soft sand or pale skin
    colours; no person, only the feet.
  exact:
    - The front foot's main axis meets the long line across at its middle, and the rear foot's main axis starts from that same place and runs on down.
    - The front foot's short toe line on the right touches the main axis and is only about a quarter as long as the long line across.
    - The front foot's small toe on the left, shorter than the main axis, touches the long line across.
    - The rear foot's small left stroke and long sweeping stroke do not touch the long line across.
    - The long sweeping stroke ends near the rear foot's main axis without touching it.
  strokes:
    - where: a line in the middle of the upper part, running from near the top down and slanting a little to the right, then straight down to the middle of the long line
      part: the front foot's big toe and main axis
    - where: a short line from the middle of the first line out to the right, rising slightly, only about a quarter as long as the long line across
      part: the front foot's second toe, held out
    - where: a shorter line on the left of the upper part, slanting down a little to the right to the long line across
      part: the front foot's small toe and outer edge
    - where: a long line across the full width, just below the middle of the character, rising slightly to the right
      part: the ground line under the front foot
    - where: a line down from the middle of the long line, slanting a little to the right
      part: the rear foot's big toe and main axis
    - where: a short stroke on the left of the lower part, running down and a little to the left, with a small gap below the long line
      part: the rear foot's small toe
    - where: a long sweep from the right side, just below the long line, down and out to the bottom left, passing close to but not touching the rear foot's main axis
      part: the rear foot's long outer edge, trailing back to the heel

赤:
  object: a person standing on a clay ledge, blushing red in the face as flames burn beneath him
  history: >-
    An ideogram: a person 土 whose cheeks burn with fire 火, so the face goes red.
  layout: >-
    A friendly person stands in the upper half, facing us, with a small head, eyes, nose and mouth,
    and bright pale-red cheeks, in simple pale clothes. He stands on a wide pale-brown ledge of earth
    across the middle. Below the ledge a fire burns: a large pale-orange flame with a spark on each
    side. Colours soft; no black.
  exact:
    - The upright body crosses the short line across and ends on the long ledge line; it does not reach the flames.
    - The short line across is clearly shorter than the ledge, a little under half as long.
    - The ledge is the long line across the middle, wider than the person.
    - The two big flame strokes start at the underside of the ledge and do not touch the person.
    - The middle flame stroke ends in a small hook up to the left; the left flame stroke ends in a plain point.
    - The two sparks stand free; the left one is shorter than the right one.
  strokes:
    - where: a short line across the upper part, crossing the upright near the top, rising slightly to the right
      part: the person's arms, held out to both sides
    - where: a line down from the top centre, slanting a little to the right, crossing the short line across and ending on the long line
      part: the person's head and body, standing upright
    - where: a long line across the middle, rising slightly to the right, nearly the full width
      part: the ledge of earth the person stands on
    - where: a stroke from the underside of the ledge on the left, running down and turning to sweep down to the bottom left
      part: the left edge of the big flame
    - where: a stroke from the underside of the ledge just right of centre, running down and ending in a small hook up to the left
      part: the middle tongue of the flame
    - where: a short stroke on the left, slanting down to the left, standing free
      part: a spark flying off to the left
    - where: a stroke on the right, slanting down to the right, longer than the left spark, standing free
      part: a spark flying off to the right

找:
  object: a hand carrying a spear, going out to search
  history: >-
    An ideogram: a hand 扌 holding a spear 戈, going out to look for something.
  layout: >-
    On the left a pale open hand, seen from the palm side with the wrist below, reaches toward the
    right. On the right stands a tall spear, a dagger-axe: a long shaft, a bar across it and a
    small blade tip. The hand and the spear do not touch. Pale skin, wooden pale-brown shaft, pale
    grey metal; a soft pale background.
  exact:
    - The hand's long vertical stroke crosses both the finger line and the thumb line, and ends in a small hook to the left.
    - The hand's thumb line rises to the right and the hand does not touch the spear.
    - The spear's bar across crosses the long shaft; the shaft crosses the bar and the sweep.
    - The shaft turns at the bottom, curving to the right and ending turned up; it is the longest stroke of the spear.
    - The small tip stands free of the shaft, a little way to the right of its top.
  strokes:
    - where: a short line across the upper part of the left half, rising slightly to the right
      part: the hand's fingers, spreading out to both sides
    - where: a long line down the left half, from the top to near the bottom, crossing the finger line, ending in a small hook up to the left
      part: the hand's middle finger and palm running down to the wrist, the hook where the wrist turns
    - where: a longer line across the lower part of the left half, rising to the right and crossing the long vertical
      part: the thumb and little finger, spread wide
    - where: a line across at the middle height, starting at the right edge of the hand without touching it and rising slightly to the right
      part: the spear's bar across, where the blade is fixed
    - where: a long line down the right half starting at the top, curving down to the right near the bottom and ending turned up, crossing the bar
      part: the spear's long shaft, curving up at its foot
    - where: a sweep crossing the shaft from the right of the bar down and out to the bottom left
      part: the spear's long cutting blade
    - where: a short stroke at the top of the right half, slanting down to the right, standing free
      part: the spear's small tip

谷:
  object: a valley between two slopes, where water from a spring flows down and out
  history: >-
    An ideogram: water 人 flowing from a spring 口 down through a valley 八.
  layout: >-
    The valley opens at the top as two slopes of green and pale brown hills, leaning away from each
    other. Below them a pale-blue stream runs down from the top, splitting into two arms that spread
    left and right. At the bottom a small round spring pool of pale blue water sits in its stone rim.
    No people.
  exact:
    - The two slopes at the top are separate; the left slope is a little longer than the right.
    - The stream's two arms start from the same place at the top; the right arm turns across to the right at its end.
    - The pool's left side starts from the left arm of the stream, and the left arm does not touch the pool's top.
    - The pool is a small closed rim, with its top turning down and its bottom line at the lower end.
    - The pool's bottom line is clearly shorter than its top, a little over half as long.
  strokes:
    - where: a short sweep at the top left, down and out to the bottom left
      part: the left slope of the valley
    - where: a shorter stroke at the top right, slanting down to the right
      part: the right slope of the valley
    - where: a long stroke from the top centre, running down and sweeping out to the bottom left
      part: the stream's left arm, running down the valley
    - where: a stroke from the left arm near its top, running down to the right and turning across to the right at its end
      part: the stream's right arm, spreading wide
    - where: a short line down on the left of the lower part, starting from the left arm
      part: the spring pool's left side
    - where: a line across the top of the pool, then turning down and back to the left
      part: the pool's top rim and right side
    - where: a short line across the bottom of the pool, clearly shorter than the top
      part: the pool's bottom rim

兵:
  object: two hands holding out a long-handled axe, the soldier's weapon
  history: >-
    An ideogram: two hands 八 holding an axe 丘, a soldier's weapon.
  layout: >-
    A pale axe fills the upper part: a heavy grey head on the left and a wooden haft laid across the
    middle. Below it two pale hands reach up from the bottom, one on each side, and grip the haft.
    The hands only, no body. Soft pale grey, brown and skin colours.
  exact:
    - The top edge of the axe head turns down to the left and ends on the start of the heavy back edge.
    - The short line across and the short stroke below it both touch the back edge; the short stroke ends on the haft.
    - The haft is the long line across; the back edge of the head ends on it.
    - The short line across is about half as long as the haft.
    - The two hands stand free of the haft and of each other; the right hand is a little shorter than the left.
  strokes:
    - where: a stroke at the top, running to the left and turning down to the left
      part: the top edge of the axe head
    - where: a stroke from the left end of the top edge, running down and a little right, ending on the long line below
      part: the heavy back of the axe head, down to the haft
    - where: a short line across, rising slightly to the right, from the middle of the back edge
      part: the iron collar binding the head to the haft
    - where: a short stroke from the right end of the collar, slanting down to the right and ending on the haft, only about half as long as the back edge
      part: the strap holding the collar
    - where: a long line across the full width, in the middle, below the head
      part: the long wooden haft of the axe
    - where: a stroke below the haft on the left, running down and sweeping out to the bottom left, with a small gap below the haft
      part: the left hand, gripping from underneath
    - where: a stroke below the haft on the right, running down and out to the bottom right
      part: the right hand, gripping from underneath

志:
  object: a scholar, and below him his heart, which is his will and resolve
  history: >-
    An ideogram: the heart 心 of a scholar 士; 士 also gives the sound.
  layout: >-
    A scholar stands in the upper half, facing us, a friendly face with eyes, nose and mouth, in a
    pale robe. Under him, a pale-red heart fills the lower half, with two small vessels rising from
    its top. Soft pale colours.
  exact:
    - The upright of the scholar crosses the long line across and ends on the lower line across.
    - The upper line across is longer than the lower one; the lower is about three quarters as long.
    - In the heart the first stroke is short and stands free; the long curve ends in a small hook up to the left.
    - The two vessel dots stand free; the upper right one is longer than the one at the top centre.
  strokes:
    - where: a long line across the upper part, rising slightly to the right
      part: the scholar's shoulders and out-held sleeves
    - where: a line down from the top, slanting a little to the right, crossing the shoulders and ending on the lower line
      part: the scholar's head and body
    - where: a line across below the shoulders, about three quarters as long as the upper line
      part: the hem of his robe
    - where: a short stroke on the left of the lower part, running down a little to the left
      part: the left edge of the heart
    - where: a long curve from left of centre, down to the bottom, along the bottom to the right and up, ending in a hook up to the left
      part: the rounded lower body of the heart, its tip turning in at the right
    - where: a short dot near the top centre of the heart, slanting down to the right
      part: a vessel rising from the heart
    - where: a longer dot at the upper right, slanting down to the right
      part: a second vessel at the heart's upper right

訴:
  object: a person speaking words of blame, accusing, with an axe as the blame itself
  history: >-
    An ideogram: words 言 of blame 斥; 斥 also gives the sound. The axe-shaped 斥 is the blame.
  layout: >-
    The left part is the words: a mouth in the lower left, lips drawn as a small box, with a speech
    line and two small sound waves rising above it, and a spark above. On the right stands a large
    pale axe, its blade on the left and its haft on the right, with a small chip of wood beside the haft.
    The words and the axe do not touch. Pale colours; no person.
  exact:
    - The words part and the axe do not touch.
    - The upper speech line across is the longest stroke on the left; the two small sound waves below it are short and rise to the right, and they stand free.
    - The mouth's left side and its top-and-right stroke start together; the bottom lip starts on the left side and ends where the top-and-right stroke ends.
    - The bottom lip is clearly shorter than the top, about a third as long.
    - The blade's top edge turns down to the left and ends on the start of the long blade edge.
    - The crossbar of the haft starts on the blade edge, and the haft hangs from the middle of the crossbar.
    - The chip touches the haft and is shorter than the haft by far.
  strokes:
    - where: a short dot at the top of the left part, slanting down to the right
      part: a spark of sound at the top of the words
    - where: a long line across the upper left part, rising slightly to the right
      part: the speech line above the mouth
    - where: a short line rising to the right, in the upper middle of the left part
      part: the upper sound wave
    - where: a short line rising to the right, a little below the first sound wave
      part: the lower sound wave
    - where: a short stroke down on the left of the lower part
      part: the mouth's left side
    - where: a stroke starting at the same point, rising to the right then turning down
      part: the mouth's top lip and right side
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the mouth's bottom lip
    - where: a stroke at the top of the right part, running to the left and turning down to the left
      part: the top edge of the axe blade
    - where: a long stroke from the end of the top edge, running down and curving to the bottom left
      part: the long cutting edge of the axe blade
    - where: a line across the middle of the right part, starting on the blade edge, rising slightly to the right
      part: the crossbar binding the blade to the haft
    - where: a long line down from the middle of the crossbar to the bottom
      part: the axe's haft
    - where: a short stroke to the right of the haft in its middle, slanting down to the right, touching the haft
      part: a small chip of wood lying against the haft

诉:
  object: a person speaking words of blame, accusing, with an axe as the blame itself
  history: >-
    An ideogram: words 讠 of blame 斥; 斥 also gives the sound. The axe-shaped 斥 is the blame.
  layout: >-
    The left part is the words: a small dot of sound at the top and a speech line below it, which
    runs across and turns down and then up to the right like a speaking mouth. On the right stands a
    large pale axe, its blade on the left and its haft on the right, with a small chip of wood beside
    the haft. The words and the axe do not touch. Pale colours; no person.
  exact:
    - The words part and the axe do not touch.
    - The speech line is long, about twice as long as the crossbar of the axe haft, and ends turning up to the right.
    - The sound dot stands free and is about half as long as the chip.
    - The blade's top edge turns down to the left and ends on the start of the long blade edge.
    - The haft hangs from the middle of the crossbar; the chip crosses the haft's middle.
  strokes:
    - where: a short dot at the top of the left part, slanting down to the right
      part: a spark of sound
    - where: a line across the middle of the left part, rising slightly to the right, turning down and then up to the right at its end
      part: the speaker's mouth and rising voice
    - where: a stroke at the top of the right part, running to the left and turning down to the left
      part: the top edge of the axe blade
    - where: a long stroke from the end of the top edge, running down and curving to the bottom left
      part: the long cutting edge of the axe blade
    - where: a line across the middle of the right part, starting on the blade edge, rising slightly to the right
      part: the crossbar binding the blade to the haft
    - where: a long line down from the middle of the crossbar to the bottom
      part: the axe's haft
    - where: a stroke slanting down to the right across the middle of the haft
      part: a small chip of wood at the haft

困:
  object: a tree shut in by a fence
  history: >-
    An ideogram: a fence 囗 built around a tree 木, so that it cannot grow: to be hemmed in.
  layout: >-
    A tall pale-green tree with a plain trunk and spreading branches stands in the middle of a square
    fence made of pale wooden boards. The fence is wider than the tree and does not touch it. Pale
    colours.
  exact:
    - The fence is one closed square made of its left side, its top and right side, and its bottom line.
    - The top-and-right stroke starts on top of the left side, and the bottom line starts at the end of the left side and ends on the end of the right side.
    - The tree does not touch the fence anywhere.
    - The trunk is a straight vertical line ending in a plain point, with no hook; the right root is shorter than the left root.
    - The tree's branches line is clearly shorter than the fence's top, about a quarter as long.
    - The bottom of the fence is a little more than a third as long as the top.
  strokes:
    - where: a long line down the left side of the frame
      part: the fence's left side
    - where: a line across the top, running right and turning down the right side to the bottom
      part: the fence's top rail and right side
    - where: a line across the upper part of the tree, from left to right, rising slightly
      part: the tree's branches, spreading out to both sides
    - where: a long straight line down the middle, crossing the branches, with a plain end
      part: the tree's trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the tree's root, spreading left
    - where: a shorter stroke from the centre of the trunk, down to the right
      part: the tree's root, spreading right
    - where: a line across the bottom of the frame, between the sides, rising slightly to the right
      part: the fence's bottom rail

层:
  object: a building of several storeys, seen from the side, with a small cloud beside it
  history: >-
    A simplified form of a character for a layer or floor of a building; the cloud part only gives the sound.
  layout: >-
    A pale building fills the upper left of the square: its roof and one floor stand above a long
    left wall that runs down to the ground. A small white cloud drifts inside the building's space on
    the lower right, as a small simple wisp. Pale colours.
  exact:
    - The roof's top edge turns down at the right and ends in a small hook down to the left; its end touches the floor line.
    - The floor line starts on the wall and ends on the roof's right side.
    - The wall is the longest stroke and ends with a point sweeping to the left.
    - The cloud's top wisp stands free; the cloud's long flat top is the longest of the cloud's strokes and has a small gap from the wall.
    - The cloud's top wisp is about half as long as the flat top.
  strokes:
    - where: a stroke across the top, rising slightly to the right, turning down at the right and ending in a small hook down to the left
      part: the roof's ridge and its right edge
    - where: a line across below the roof, starting on the wall and ending on the roof's right side
      part: the floor line of the building
    - where: a long stroke from the top left, running down and sweeping out to the bottom left
      part: the building's long left wall
    - where: a short line across, rising slightly to the right, in the middle of the right part, standing free
      part: a thin wisp of cloud high up
    - where: a long line across below the wisp, with a small gap from the wall
      part: the long flat top of the cloud
    - where: a stroke from the middle of the flat top, going down to the left and turning to run right along the bottom, rising slightly
      part: the cloud's billow, curling down and back along its base
    - where: a short dot at the lower right, slanting down to the right
      part: the end of the billow, curling up

抗:
  object: a bare hand fighting a small table with a lid
  history: >-
    An ideogram: fighting 亢 with bare hands 扌; 亢 also gives the sound.
  layout: >-
    On the left a pale open hand, seen from the palm side with the wrist below, is raised and pushes
    toward the right. On the right a small low table, with a flat lid laid over it, stands in the lower
    half. Soft colours; the table is small and plain.
  exact:
    - The hand's long vertical stroke crosses both the finger line and the thumb line, and ends in a small hook up to the left.
    - The thumb line rises to the right and is clearly longer than the finger line; the finger line is about two thirds as long as the thumb line.
    - The lid's dot and the lid's line across stand free of everything else; the lid's line across is clearly longer than the dot.
    - The table's left leg ends close to the hand's wrist without touching it.
    - The table's top-and-right stroke starts at the top of the left leg and ends turned up in a small hook; it is the longest stroke of the table.
  strokes:
    - where: a short line across the upper part of the left half, rising to the right
      part: the hand's fingers, spreading out to both sides
    - where: a long line down the left half, from the top to near the bottom, crossing the finger line, ending in a small hook up to the left
      part: the hand's middle finger and palm running down to the wrist, the hook where the wrist turns
    - where: a longer line across the lower part of the left half, rising to the right and crossing the vertical
      part: the thumb and little finger, spread wide
    - where: a short dot at the top of the right half, slanting down to the right
      part: the small knob on top of the lid
    - where: a line across, rising slightly to the right, below the dot
      part: the flat lid laid over the table
    - where: a stroke down from below the lid on the left, curving a little to the left at its end
      part: the table's left leg
    - where: a long stroke from the top of the left leg, running across to the right, turning down, then down to the right and turning across, rising and ending in a small hook up
      part: the table's top and right leg, with the foot turning out

庫:
  object: a stable shed where carts are parked
  history: >-
    An ideogram: a stable 广 where carriages 車 are parked, hence a storehouse.
  layout: >-
    A lean-to shed on the left and above, its roof against a wall, covers the cart. The cart is seen
    from straight above, its axle running from top to bottom: two wheels seen edge on, one above and
    one below, and a box with two cross-planks between them. Pale wood, grey and soft colours.
  exact:
    - The roof's dot stands free above the roof line.
    - The roof line starts on the wall; the wall is the longest stroke.
    - The axle is a long straight vertical line, longer than the box, and crosses the near wheel, the box planks and the far wheel.
    - The far wheel at the bottom is the longest line across; the near wheel is about half as long as the far wheel, and the roof line is a little under three quarters as long.
    - The box's left side and top-and-right stroke start together at the top.
    - The two cross-planks inside the box are short; the upper one is shorter than the lower, and they stand free of the box's left side.
    - The cart does not touch the wall.
  strokes:
    - where: a small dot at the top centre, slanting down to the right, standing free
      part: the shed roof's small ornament
    - where: a line across the upper part, from the wall to the right, rising slightly, a little under three quarters as long as the far wheel
      part: the shed's roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the shed's wall
    - where: a short line across the upper middle, rising slightly to the right, about half as long as the far wheel
      part: the cart's near wheel, seen edge on
    - where: a short stroke down from the left of the middle part
      part: the left side of the cart's box
    - where: a stroke starting at the same place, running across to the right, then turning down to the left
      part: the front and right side of the cart's box
    - where: a short line across inside the box, rising slightly to the right, shorter than the lower one
      part: the upper cross-plank of the box
    - where: a line across inside the box, near its bottom, a little longer than the upper plank
      part: the lower plank of the box
    - where: a long line across the lower part, nearly the full width of the cart, the longest line across
      part: the cart's far wheel, seen edge on
    - where: a long straight line down the centre, from the top to the bottom, crossing the wheels and planks
      part: the axle and the shaft

库:
  object: a stable shed where carts are parked
  history: >-
    An ideogram: a stable 广 where carriages 车 are parked, hence a storehouse.
  layout: >-
    A lean-to shed on the left and above, its roof against a wall, covers the cart. The cart is seen
    from straight above, its axle running from top to bottom: a near wheel edge on above, a box
    in the middle, a far wheel edge on below. Pale wood, grey and soft colours.
  exact:
    - The roof's dot stands free above the roof line.
    - The roof line starts on the wall; the wall is the longest stroke and does not touch the cart.
    - The near wheel is shorter than the roof line, a little over half as long as the far wheel; the far wheel is the longest line across.
    - The box stroke starts at the near wheel, crossing it, runs down to the left and then turns across to the right; it crosses the axle.
    - The axle is a long straight vertical, starting at the middle of the box and running below it to the bottom, without a hook; it crosses the box and the far wheel.
  strokes:
    - where: a small dot at the top centre, slanting down to the right, standing free
      part: the shed roof's small ornament
    - where: a line across the upper part, from the wall to the right, rising slightly
      part: the shed's roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the shed's wall
    - where: a short line across the upper middle, rising slightly to the right, a little over half as long as the far wheel
      part: the cart's near wheel, seen edge on
    - where: a stroke from the top centre running down to the left, then turning to run across the middle to the right, crossing the near wheel
      part: the side and front of the cart's box
    - where: a long line across the lower part, nearly the full width of the cart, the longest line across
      part: the cart's far wheel, seen edge on
    - where: a long straight line down the centre, from the middle of the box to the bottom, crossing the far wheel
      part: the axle and the shaft

災:
  object: a river on fire
  history: >-
    An ideogram: a river 巛 with fire 火 beneath it; flood and fire together, a disaster.
  layout: >-
    Three pale-blue wavy streams run down side by side across the upper part, joining a river.
    Below them a large pale-orange fire burns, with a spark on each side. Soft pale colours.
  exact:
    - The three streams are the same shape and length, evenly spaced, and stand free of each other.
    - The big flame's long stroke ends close to the streams without touching them.
    - The right edge of the flame starts from the middle of the left stroke and flares out to the right.
    - The left spark is shorter than the right spark; both stand free.
  strokes:
    - where: a wavy line down the upper left, running down to the right, bending back to the left and then down to the right
      part: the river's left stream
    - where: a wavy line down the upper middle, the same as the left one
      part: the river's middle stream
    - where: a wavy line down the upper right, the same as the others
      part: the river's right stream
    - where: a short dot-like stroke in the upper left of the lower part, slanting down to the right
      part: a spark leaping off to the left
    - where: a short stroke in the upper right of the lower part, slanting down to the left
      part: a spark leaping off to the right
    - where: a long stroke from the top centre of the lower part down and out to the bottom left
      part: the left edge of the big flame, from its tip down to its base
    - where: a long sweep from the middle of the left edge down and out to the bottom right, flaring out at its base
      part: the right edge of the big flame

疗:
  object: a sickroom lean-to with a wrapped baby inside, the illness cleared
  history: >-
    An ideogram: to clear 了 an illness 疒; 了 also gives the sound.
  layout: >-
    A lean-to sickroom in pale wood fills the left and top of the square. Two small pale-blue ice
    chips sit on its left, outside the wall, standing for the chill of illness. Inside the room, on the
    lower right, a small baby is wrapped in a pale blanket with only its face showing, with eyes,
    nose and mouth.
  exact:
    - The roof's dot stands free above the roof line.
    - The roof line starts on the wall; the wall is the longest stroke on the left.
    - The upper ice chip stands free of everything; the lower ice chip rises to the right and ends on the wall.
    - The baby's blanket line is a little shorter than the roof line, and turns back down to the left at its end.
    - The baby's long body stroke starts at the end of the blanket line, bends a little to the right, and ends in a small hook up to the left.
    - The baby does not touch the wall.
  strokes:
    - where: a small dot at the top centre, slanting down to the right, standing free
      part: the roof's small ornament
    - where: a line across the upper part from the wall to the right, rising slightly
      part: the sickroom's roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the sickroom's wall
    - where: a short stroke on the left of the middle, slanting down to the right, standing free
      part: the upper ice chip
    - where: a short stroke below it, rising to the right and ending on the wall
      part: the lower ice chip, against the wall
    - where: a line across the upper part of the right half, turning back down to the left at its end
      part: the folded edge of the blanket over the baby's head and shoulders
    - where: a long stroke starting at the end of the blanket line, running down the centre, bending a little to the right, ending in a small hook up to the left
      part: the wrapped body, the hook the tucked end of the blanket at the feet

劳:
  object: a man lifting a heavy load, a bundle under a cloth with grass piled on it
  history: >-
    An ideogram: a man lifting 力 a load 冖 of grass 艹, which is hard labour.
  layout: >-
    A strong man stands in the lower half, facing us, with a friendly face, eyes, nose and mouth,
    in a simple pale tunic, his arms raised over his head. He lifts a pale cloth covering the
    bundle across the middle, and above it three tufts of pale-green grass are piled. Soft colours.
  exact:
    - The two upright blades of grass cross the line across; the line across is about as long as the cloth's top.
    - The left blade is shorter than the right blade, and the right blade leans a little.
    - The cloth's left edge starts below the grass and touches the cloth's top edge.
    - The man's long body stroke crosses the arm stroke and is the longest stroke downward.
    - The arm stroke ends in a small hook up to the left.
    - The cloth stands free of the man's arm stroke, with a small gap.
  strokes:
    - where: a line across the top part, from left to right, a little way down
      part: the heap of grass, lying across
    - where: a short line down on the left, crossing the line across
      part: the left blade of grass
    - where: a line down from the top on the right, leaning a little to the right, crossing the line across
      part: the right blade of grass, the tallest
    - where: a short line down on the left, just below the grass
      part: the cloth's left edge hanging down
    - where: a line across, from the cloth's left edge to the right, ending in a small hook down to the left
      part: the cloth's top, draped over the load, with its right edge hanging
    - where: a line across the lower part, rising slightly to the right, turning down and ending in a hook up to the left
      part: the man's raised arms, lifting the load
    - where: a long stroke from the middle of the cloth, running down and sweeping to the bottom left, crossing the arm stroke
      part: the man's body and leg

勞:
  object: a man lifting a heavy load, a bundle under a cloth with grass piled on it
  history: >-
    An ideogram: a man lifting 力 a load 冖 of grass, which is hard labour. The traditional form
    writes the load as two small fires 炏 side by side.
  layout: >-
    A strong man stands in the lower half, facing us, with a friendly face, eyes, nose and mouth,
    in a simple pale tunic, his arms raised over his head. He lifts a pale cloth covering the
    bundle across the middle. On top of it two small tufts of pale-green grass shaped like little
    flames stand side by side, the right one a little taller. Soft colours.
  exact:
    - The two tufts stand free of each other, and the right tuft is a little taller than the left.
    - In each tuft the two short flames stand free and the long stroke crosses beside them; the right tuft's two small strokes touch its long stroke.
    - The cloth's left edge starts at the cloth's top edge, and the top edge ends in a small hook down to the left.
    - The man's arm stroke and body stroke cross; the arm stroke ends in a small hook up to the left.
    - The cloth's top edge stands free of the arm stroke, with a small gap.
  strokes:
    - where: a small dot at the upper left of the left tuft, slanting down to the right
      part: the left tuft's small left blade
    - where: a short stroke at the top of the left tuft, slanting down to the left
      part: the left tuft's small right blade
    - where: a long stroke on the left tuft, from the top running down and sweeping to the left
      part: the left tuft's tall central blade
    - where: a small dot below it, slanting down to the right
      part: the left tuft's lowest small blade
    - where: a small dot at the upper left of the right tuft, slanting down to the right
      part: the right tuft's small left blade
    - where: a short stroke at the top of the right tuft, slanting down to the left
      part: the right tuft's small right blade
    - where: a long stroke on the right tuft, from the top running down and sweeping to the left
      part: the right tuft's tall central blade
    - where: a short stroke on the right tuft, slanting down to the right
      part: the right tuft's right blade
    - where: a short line down on the left, just below the grass
      part: the cloth's left edge hanging down
    - where: a line across, from the cloth's left edge to the right, ending in a small hook down to the left
      part: the cloth's top, draped over the load, with its right edge hanging
    - where: a line across the lower part, rising slightly to the right, turning down and ending in a hook up to the left
      part: the man's raised arms, lifting the load
    - where: a long stroke from the middle of the cloth, running down and sweeping to the bottom left, crossing the arm stroke
      part: the man's body and leg

束:
  object: a tree trunk with its branches, tied round the middle with a rope loop
  history: >-
    An ideogram: lumber 木 bound by a rope 口.
  layout: >-
    A tree stands upright, with pale branches above and roots below. A pale rope ties it around the
    middle: a small closed loop drawn across the trunk. Pale green and brown; the rope is pale cream.
  exact:
    - The trunk is a straight vertical line ending in a plain point, with no hook.
    - The trunk starts on the branch line and crosses the rope loop.
    - The rope loop is a closed box made of its left side, its top-and-right stroke ending in a small hook down to the left, and its bottom line, which meets the left side and the top-and-right stroke at their ends.
    - The loop's top-and-right stroke is longer than its bottom line.
    - The two roots start on the loop's bottom line and the trunk, and do not touch each other.
    - The left root is a little shorter than the right root.
  strokes:
    - where: a line across the upper part, rising slightly to the right
      part: the tree's main branches, spreading to both sides
    - where: a short line down on the left of the middle
      part: the rope loop's left side
    - where: a line from the top of the left side, running across to the right, then turning down with a small hook to the left
      part: the rope loop's top and right side
    - where: a line across the bottom of the loop, rising slightly to the right
      part: the rope loop's bottom, closing the knot
    - where: a long straight line down the middle, from the branch line to the bottom, crossing the loop, with a plain end
      part: the tree's trunk
    - where: a sweep from the loop's bottom and the trunk down and out to the bottom left
      part: the tree's root, spreading left
    - where: a stroke from the loop's bottom and the trunk, running down and out to the bottom right and turning across
      part: the tree's root, spreading right

麗:
  object: a deer with two branching antlers
  history: >-
    The oldest forms drew the antlers of a deer 鹿; the modern form keeps the antlers on top of the
    deer, and means beautiful.
  layout: >-
    The two antlers fill the upper part: a left antler and a right antler, each a branched loop with
    a small point inside, hanging from a short bar at the top left and a bar at the top right. Under
    them stands a pale deer, facing left, with a friendly face, eyes and nose, its back, belly and
    legs drawn along the strokes below. Soft pale browns.
  exact:
    - The left antler is a downward loop whose left side and top-and-right stroke start together, with a small point inside, which stands free.
    - The right antler is the same shape, the left side shorter than the left antler's; its small point stands free.
    - The bar at the top left and the bar at the top right both stand free, and the left bar is a little longer than the right bar.
    - The deer's long back stroke is the longest stroke downward and ends sweeping to the left.
    - The two small stripes on the deer touch its belly line; the belly line meets the back line.
    - The deer's hind legs differ, the left one turns up to the right, the right one is longer and ends in a small hook up.
  strokes:
    - where: a short line across at the top left
      part: the top of the left antler's mount
    - where: a short stroke down at the left of the upper part
      part: the left antler's main beam
    - where: a line from the top of the beam across to the right, rising slightly, then turning down
      part: the left antler's upper curve and its side
    - where: a small dot inside the left antler, slanting down to the right
      part: the left antler's small point
    - where: a short line across at the top right
      part: the top of the right antler's mount
    - where: a short stroke down in the middle of the upper part
      part: the right antler's main beam
    - where: a line from the top of the beam across to the right, then turning down
      part: the right antler's upper curve and its side
    - where: a small dot inside the right antler, slanting down to the right
      part: the right antler's small point
    - where: a small dot at the top centre of the deer, slanting down to the right
      part: the deer's ear tuft
    - where: a line across the deer's upper body, rising slightly to the right
      part: the deer's brow and head
    - where: a long stroke from the left of the head, running down and sweeping out to the bottom left
      part: the deer's neck and chest
    - where: a line across the middle, ending in a small hook down to the left
      part: the deer's back, ending in its tail
    - where: a short stroke down on the left of the middle
      part: the first stripe of the deer's coat
    - where: a short stroke down in the middle
      part: the second stripe of the deer's coat
    - where: a line across below the stripes, rising slightly to the right
      part: the deer's belly
    - where: a short dot at the bottom left, rising slightly to the right
      part: the deer's front hoof
    - where: a stroke down from the left of the belly, turning up to the right at the bottom
      part: the deer's front leg, with its foot
    - where: a stroke at the right of the belly, running down and out to the left
      part: the deer's rear thigh
    - where: a long stroke from the belly line at the right, running down, turning to the right, then rising and ending in a small hook up
      part: the deer's hind leg, its hook the hoof

丽:
  object: a deer with two branching antlers
  history: >-
    The oldest forms drew the antlers of a deer 鹿; the modern form keeps only the antlers, and means
    beautiful.
  layout: >-
    A long pale bar stretches across the top, a wooden mount. From it hang two matching branched
    antlers, one on the left and one on the right, each an arched loop with a small point inside.
    Soft pale browns on a pale background.
  exact:
    - The bar across the top stands free of the antlers and is nearly as long as the right antler's top.
    - The left antler's main beam is a straight vertical; its top-and-right stroke starts on the beam and ends in a hook to the left; the small point touches the beam.
    - The right antler's main beam leans down to the right; its top-and-right stroke starts on the beam and ends in a hook to the left; the small point touches the beam.
    - The two antlers do not touch each other; the right antler is a little wider than the left one.
    - The right antler's small point is shorter than the right antler's main beam by far.
  strokes:
    - where: a long line across the top of the frame, from the left nearly to the right
      part: the wooden mount the antlers hang from
    - where: a straight line down the left half, from the upper left to the bottom
      part: the left antler's main beam
    - where: a line from the top of the beam across to the right, turning down and ending in a small hook to the left
      part: the left antler's upper curve and its tine
    - where: a small dot inside the left antler, slanting down to the right
      part: the left antler's small point
    - where: a stroke down in the middle of the lower part, leaning to the right, from the upper centre to the bottom
      part: the right antler's main beam
    - where: a line from the top of the beam across to the right, turning down and ending in a small hook to the left
      part: the right antler's upper curve and its tine
    - where: a small dot inside the right antler, slanting down to the right
      part: the right antler's small point

尾:
  object: a seated figure facing left, with a long furry tail behind
  history: >-
    An ideogram: a furry tail 毛 behind a body 尸.
  layout: >-
    A friendly seated figure fills the left and upper part of the square, facing left, with a face,
    eyes, nose and mouth, in simple pale clothes. Behind it, to the lower right, trails a long
    furry tail in pale cream and soft brown. The tail is bigger than a real tail. Soft colours.
  exact:
    - The back stroke ends in a small hook down to the left, its end meeting the seat line.
    - The seat line starts on the long front stroke and ends on the back stroke.
    - The long front stroke is the longest of the figure and ends sweeping to the left.
    - The tail's top fur tuft stands free of the figure; its spine starts on the tuft.
    - The tail's three fur bands cross the spine; the bottom band is the longest and the top is about half as long; the middle band is about two thirds as long as the bottom one.
    - The spine runs down, turns across to the right, and ends turned up; it is the longest stroke of the tail.
  strokes:
    - where: a stroke across the top, ending in a small hook down to the left
      part: the figure's back, bent forward
    - where: a line across below it, rising slightly to the right
      part: the figure's seat
    - where: a long stroke down the left, from the top left, sweeping out to the bottom left
      part: the figure's front and legs
    - where: a stroke at the top of the tail, running to the left and turning down to the left, about half as long as the bottom band
      part: the tail's top tuft of fur
    - where: a line across the tail, rising slightly to the right, below the tuft
      part: the tail's middle band of fur
    - where: a longer line across the lower part, rising slightly to the right, the longest line across
      part: the tail's wide bottom band of fur
    - where: a long stroke from the middle of the tuft, running down, then turning across to the right, then up at its end
      part: the tail's spine, curling up at the tip

折:
  object: a hand swinging an axe to break something
  history: >-
    An ideogram: a hand 扌 wielding an axe 斤, to chop and break.
  layout: >-
    On the left a pale open hand, seen from the palm side with the wrist below, reaches toward the
    right. On the right stands an axe: a heavy grey blade on the left of it and a wooden haft on the
    right. The hand and the axe do not touch. Soft pale colours.
  exact:
    - The hand's long vertical stroke crosses both the finger line and the thumb line, and ends in a small hook to the left.
    - The thumb line turns up to the right at its end and is the longest line across; the finger line is about two thirds as long as the thumb line.
    - The blade's top edge turns down to the left and ends on the start of the long blade edge.
    - The long blade edge does not touch the hand.
    - The crossbar starts on the blade edge, and the haft hangs from the middle of the crossbar.
    - The haft is shorter than the blade edge, about three quarters as long as it.
  strokes:
    - where: a short line across the upper part of the left half, rising slightly to the right
      part: the hand's fingers, spreading out to both sides
    - where: a long line down the left half, from the top to near the bottom, crossing the finger line, ending in a small hook to the left
      part: the hand's middle finger and palm running down to the wrist, the hook where the wrist turns
    - where: a longer line across the lower part of the left half, turning up to the right at its end, crossing the long vertical
      part: the thumb and little finger, spread wide
    - where: a stroke at the top of the right half, running to the left and turning down to the left
      part: the top edge of the axe blade
    - where: a long stroke from the end of the top edge, running down and curving to the bottom left
      part: the axe blade's long cutting edge
    - where: a line across the middle of the right half, starting on the blade edge, rising slightly to the right
      part: the crossbar binding the blade to the haft
    - where: a line down from the middle of the crossbar to the bottom, about three quarters as long as the blade edge
      part: the axe's haft

辛:
  object: a branding iron, glowing hot, with a flat plate on a long handle
  history: >-
    The oldest forms drew a hot iron used to brand prisoners and slaves.
  layout: >-
    A branding iron stands upright. Its head is a wide flat plate in pale grey glowing pale orange,
    held up on two short struts, with a small knob on top. A long wooden handle runs down from the
    plate, with a crossbar grip across it. Soft pale colours; no people.
  exact:
    - The knob and the line above the struts stand free of each other; the knob is much shorter than the line above.
    - The two struts are short and stand free of the line above; the left strut is a dot and the right strut turns to the left at its end; both end on the plate.
    - The plate is the longest line across; the grip is about two thirds as long as the plate and the line above is about half as long as it.
    - The handle starts on the plate, crosses the grip and runs to the bottom.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the knob on top of the iron
    - where: a line across the upper part, rising slightly to the right, about half as long as the plate
      part: the top bar of the iron head
    - where: a short dot on the left below the top bar, slanting down to the right
      part: the left strut of the head
    - where: a short stroke on the right below the top bar, slanting down and turning to the left, ending on the plate
      part: the right strut of the head
    - where: a long line across, rising slightly to the right, the full width of the head
      part: the flat brand plate of the iron
    - where: a line across the lower part, about two thirds as long as the plate
      part: the crossbar grip of the handle
    - where: a long vertical line down from the middle of the plate to the bottom, crossing the grip
      part: the iron's long handle

抓:
  object: a hand clutching with a bird's claws
  history: >-
    An ideogram: a hand 扌 with claws 爪; 爪 also gives the sound.
  layout: >-
    On the left a pale open hand, seen from the palm side with the wrist below. On the right a
    bird's foot reaches down with its claws spread, grasping. The foot's left claw reaches the hand's
    wrist. Pale skin, pale yellow claws, soft colours.
  exact:
    - The hand's long vertical stroke crosses both the finger line and the thumb line, and ends in a small hook up to the left.
    - The thumb line rises to the right and is longer than the finger line.
    - The foot's top stroke slants down from right to left; the middle claw starts on it, and the left claw starts at its left end.
    - The left claw ends touching the end of the hand's wrist.
    - The left claw and the middle claw do not touch; the middle claw is a little longer than the left claw and is a straight vertical.
    - The right claw starts at the top of the middle claw and sweeps down and out to the right, turning across at its end.
  strokes:
    - where: a short line across the upper part of the left half, rising slightly to the right
      part: the hand's fingers, spreading out to both sides
    - where: a long line down the left half, from the top to near the bottom, crossing the finger line, ending in a small hook up to the left
      part: the hand's middle finger and palm running down to the wrist, the hook where the wrist turns
    - where: a longer line across the lower part of the left half, rising to the right and crossing the vertical
      part: the thumb and little finger, spread wide
    - where: a short stroke across the top of the right half, running to the left and turning down to the left
      part: the top of the foot, where the claws join
    - where: a sweep from the left end of the top stroke, running down and out to the bottom left until it touches the wrist
      part: the left claw
    - where: a straight line down the middle of the right half, from the top stroke to the bottom, plain at its end
      part: the middle claw
    - where: a sweep from the top of the middle claw down to the right, turning across to the right at its end
      part: the right claw
