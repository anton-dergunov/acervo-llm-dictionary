# Full run, group g1, batch 13. Written from the fact sheets, following scripts/GUIDE.md.

直:
  object: an eye looking straight ahead along a straight line of sight, with a cross-shaped sight mark above it and a flat line under it
  history: >-
    An ideogram of looking straight at something: the eye 目 with a straight line of sight above it
    and a flat line under it.
  layout: >-
    A tall upright eye fills the middle of the frame, looking straight out at the viewer, its iris
    pale blue between the inner lines and its pupil mid-grey. Above it hangs a small plus-shaped
    sight mark, pale gold, whose vertical line points straight down at the eye. Under the eye lies a
    long flat line, wider than the eye, like the table the eye rests on.
  exact:
    - The sight mark above is a plus sign, its vertical line crossing the middle of its horizontal line, and the vertical line ends touching the top of the eye.
    - The eye's left side starts a little below the sight mark and runs down to the long flat line below, touching it.
    - The eye's top and right side are one stroke, turning down at the top right, and the right side ends touching the long flat line.
    - The three short inner lines start on the eye's left side and stop short of the right side; they do not touch the right side.
    - The long flat line under the eye is the longest stroke; the eye's top and right side is about nine tenths as long, and the sight mark's horizontal line only about two thirds as long.
    - The three inner lines are very short, about a fifth as long as the long flat line.
  strokes:
    - where: a short line across the top left, the upper horizontal of the plus sign
      part: the sight mark's horizontal line
    - where: a short line down from the top centre, crossing the middle of the line across and ending on the top of the eye
      part: the sight mark's vertical line, pointing down into the eye
    - where: a line down the left side of the middle, from just under the sight mark to the long flat line below
      part: the eye's left lid
    - where: a line across the top of the eye, turning down at the top right to run down the right side, ending on the long flat line; about nine tenths as long as the flat line
      part: the eye's top lid and right lid
    - where: a very short line across the upper middle of the eye, from the left side, rising a little to the right
      part: the eye's upper lid crease
    - where: a very short line across the middle of the eye, from the left side, rising a little to the right
      part: the upper edge of the iris
    - where: a very short line across the lower middle of the eye, from the left side, rising a little to the right
      part: the lower edge of the iris
    - where: a long straight line across the bottom, from the far left to nearly the far right, longer than every other stroke
      part: the flat line under the eye, the table it rests on

治:
  object: water running down a channel and being guided through a stone structure that directs its flow
  history: 'An ideogram: water 氵 and a structure 台 that directs it, so to regulate.'
  layout: >-
    The left quarter of the picture is flowing water in pale blue: two drops at the upper left and a
    stream rising from the bottom left. The right three quarters is a pale stone sluice structure:
    a bent pipe at the top and a square opening in its base into which the water is guided. The
    water stands apart from the structure and does not touch it.
  exact:
    - The three water strokes stand free of every other stroke; the end of the rising stroke stops short of the structure's pipe, with a small gap.
    - The pipe stroke runs down from the top and then turns across, rising slightly to the right; its end touches the short stroke slanting down to the right at the upper right.
    - The square opening is closed, its left side and its top-and-right stroke start at the same point, and the bottom line joins the left side at its lower end and the right side at its lower end.
    - The right side of the opening ends turning down to the left.
  strokes:
    - where: a short slanting stroke at the upper left, running down to the right
      part: the upper drop of water
    - where: a short slanting stroke below it on the left, running down to the right
      part: the second drop of water
    - where: a longer stroke rising from the bottom left up to the middle left, standing free
      part: the stream of water flowing in from below
    - where: a stroke from the top centre going down and then turning across, rising slightly to the right
      part: the sluice's bent pipe
    - where: a short stroke at the upper right, slanting down to the right, touched by the end of the pipe
      part: the sluice's outlet spout
    - where: a short line down at the lower left of the right half
      part: the left side of the opening in the base
    - where: a line across from the top of the left side to the right, turning down to the left at the right end
      part: the opening's top and right side
    - where: a short line across the bottom of the opening, joining the foot of the left side to the end of the right side
      part: the opening's lower edge

京:
  object: a capital building with a pointed roof standing on a hill
  history: 'The oldest forms drew a tall building on a mound: the capital on its hill.'
  layout: >-
    A tall pale building stands on a hill. At the top is its pointed roof with a small finial. Under
    the roof is the building's body with one square window. Under it the hill spreads wide: a
    central ridge with a slope on each side. Pale grey stone, soft green hill, pale terracotta roof.
  exact:
    - The roof's finial dot stands free above the long roof line and does not touch it.
    - The window is a closed square, the left side and the top start at the same point; the top ends in a small hook down to the left where it meets the bottom line; the bottom line is short and rises slightly to the right.
    - The central ridge starts from the middle of the window's bottom line and ends in a small hook up to the left.
    - The two slopes stand free, the left one slants down to the left, the right one is a little longer and slants down to the right.
    - The roof line is the widest stroke, wider than the hill; the window is narrower than the hill.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the roof's finial
    - where: a long line across the top, rising slightly to the right, wider than everything below
      part: the roof, with its eaves
    - where: a short stroke on the left of the middle, slanting down to the right
      part: the left side of the window
    - where: a line across the top of the window from the same point, running right and ending in a small hook down to the left
      part: the window's top and right side
    - where: a short line across the bottom of the window, rising slightly to the right
      part: the window's sill
    - where: a long straight line down the centre from the window's sill, ending in a small hook up to the left
      part: the hill's central ridge
    - where: a short stroke at the middle left of the lower part, slanting down to the left
      part: the hill's left slope
    - where: a slightly longer stroke at the middle right of the lower part, slanting down to the right
      part: the hill's right slope

門:
  object: a gateway of two wooden door leaves, standing open
  history: 'The oldest forms drew the two leaves of a door side by side: a gate.'
  layout: >-
    Two tall wooden door leaves stand side by side with a narrow gap between them through which a
    pale path is seen. The left leaf is a little lower than the right; each has small pale studs.
    Warm pale wood, a soft grey stone ground.
  exact:
    - The left leaf's outer edge is a long straight vertical; its top turns down into a short inner edge that is only about two fifths as long as the outer edge.
    - The right leaf's tall outer edge is the longest stroke, it runs across the top, turns down at the right and ends in a small hook up to the left.
    - The right leaf's inner edge is a short vertical, only about two fifths as long as the left leaf's outer edge.
    - The two leaves do not touch, there is a gap between them.
    - The left leaf's two small stud strokes touch its outer edge and stop short of each other.
  strokes:
    - where: a long straight line down the left side, from the top nearly to the bottom
      part: the left leaf's outer edge
    - where: a stroke from the top of the left line running across to the right and then turning down, about two fifths as long as the left line
      part: the left leaf's top and inner edge
    - where: a tiny dot-like stroke just inside the left line, rising to the right
      part: the left leaf's upper stud
    - where: a tiny stroke just below it, inside the left line, rising to the right
      part: the left leaf's lower stud
    - where: a short line down from the top centre of the right half
      part: the right leaf's inner edge
    - where: a long line starting at the top of that short line, running across the top of the right half, turning down at the right and running all the way to the bottom, ending in a small hook up to the left
      part: the right leaf's top and outer edge
    - where: a tiny dot-like stroke inside the right leaf near the top, rising a little to the right
      part: the right leaf's stud
    - where: a short line across the lower part of the right leaf, from the foot of the short inner edge to the outer edge
      part: the right leaf's crossbar

供:
  object: a person standing on the left, holding up an offering stand with both hands
  history: 'An ideogram: a person 亻 and two hands 共 lifting an offering together.'
  layout: >-
    A person stands on the left, facing right, with a friendly face (eyes, nose, mouth) and simple
    pale clothes. In the right two thirds an offering stand is held up: a crossbar across the upper
    part, two posts standing on a long platform, and two open hands below lifting the platform.
    Pale wood, soft pale red cloth.
  exact:
    - The person is a sweeping body stroke with a short vertical leg stroke starting from its middle; the vertical stroke stops just short of the platform's left end, with a small gap.
    - The crossbar crosses both posts; the right post is taller than the left post and starts higher than the crossbar.
    - Both posts end touching the platform.
    - The platform is the longest stroke across; the crossbar is a little over two thirds as long.
    - The two hands stand free of the platform and of each other.
    - The left post is about three quarters as long as the right post; the right hand is about half as long as the right post.
  strokes:
    - where: a sweep from the top of the left part down and out to the lower left
      part: the person's body, running down into the left leg
    - where: a vertical line from the middle of the sweep straight down to the bottom
      part: the person's other leg
    - where: a line across the upper right part, rising slightly to the right, crossing both posts
      part: the stand's crossbar
    - where: a stroke in the left of the upper right part, going down to the right and then straight down, to the platform
      part: the stand's left post
    - where: a taller stroke from the very top of the right part, going down to the right and then straight down, to the platform
      part: the stand's right post
    - where: a long line across the lower right part, from the left to the far right
      part: the platform
    - where: a stroke at the lower middle, slanting down to the left, standing free
      part: the left hand, lifting
    - where: a slightly shorter stroke at the lower right, slanting down to the right, standing free
      part: the right hand, lifting

图:
  object: a map, the borders of a district drawn as a frame with its roads and places marked inside
  history: >-
    The oldest forms drew a district's border as a frame with its houses and fields inside; the
    Simplified form keeps the frame and puts a short winding route inside it.
  layout: >-
    A pale parchment map fills the square, edged by a frame of borders. Inside, a pale brown road
    crosses itself at the middle, and two small round places are marked below the crossing, one over
    the other. The ground along the bottom of the frame is a flat line. No text and no labels.
  exact:
    - The frame is closed, the left side, the top-and-right side and the bottom line meet at both bottom corners, the top-and-right stroke running all the way to the bottom right corner.
    - The long vertical on the left is about seven tenths of the frame's height; the top-and-right stroke is the longest stroke and wraps two sides.
    - The road's first stroke runs down and ends in a turn to the lower left; the second crosses it and also ends turning to the lower left; the third crosses the second and turns across to the right, ending touching the frame's right side.
    - The two small marks stand free, one above the other, and do not touch the road or the bottom line; the lower one is longer than the upper.
    - The bottom line is narrower than the frame.
  strokes:
    - where: a long line down the left side of the frame, from the top almost to the bottom
      part: the map's left border
    - where: a long line across the top, turning down at the top right and running to the bottom right corner
      part: the map's top and right border
    - where: a short stroke in the upper middle, going down and turning to the lower left, not touching the frame
      part: the road's first branch, bending away to the left
    - where: a stroke across the upper middle, going right and turning down to the left at its end, crossing the stroke below it
      part: the road's long branch, running across to the left
    - where: a stroke from the upper middle going down to the right and then turning across to the right, ending on the right border
      part: the road, running down to the right and out across the map
    - where: a tiny dot just below the crossing, slanting down to the right, standing free
      part: a small village mark
    - where: a short stroke below that dot, slanting down to the right, standing free
      part: a second small place mark
    - where: a line across the bottom, from the foot of the left border to the foot of the right border
      part: the map's bottom border

圖:
  object: a map, the borders of a district drawn as a frame with its roads and places marked inside
  history: >-
    The oldest forms drew a district's border as a frame with its houses and fields inside; the
    Simplified form keeps the frame and puts a short winding route inside it.
  layout: >-
    A pale parchment map fills the square, edged by a frame of borders. Inside the frame, at the
    top, a small square plot marks the district's square. Under it stands a storehouse of the
    district: a roof with a small finial on top, and under the roof a boxed building holding a
    small window. Pale parchment, pale terracotta roof, soft grey walls. No text and no labels.
  exact:
    - The frame is closed, its left side, its top-and-right stroke and its bottom line meet at both bottom corners.
    - The top-and-right stroke is the longest stroke; the left side is about three quarters as long as it.
    - The small square plot at the top is closed, its left side and its top-and-right stroke start at the same point; the top ends in a small hook down to the left where it meets the bottom line, which rises slightly to the right.
    - The roof's finial is a tiny dot touching the middle of the plot's bottom line and the roof line below it.
    - The roof line is about a third as long as the frame's top, and it stands apart from the frame sides with a small gap.
    - The storehouse is a closed box; the box and its small inner window are both closed boxes. The inner window is small, about a quarter of the box's width.
    - The storehouse stands free of the frame; its bottom line is a short line, rising slightly to the right.
  strokes:
    - where: a long line down the left side of the frame, from the top almost to the bottom
      part: the map's left border
    - where: a long line across the top, turning down at the top right and running to the bottom right corner
      part: the map's top and right border
    - where: a short stroke at the upper left of the inner area, slanting down to the right
      part: the square plot's left side
    - where: a line across the top of the plot from the same point, running right and ending in a small hook down to the left
      part: the plot's top and right side
    - where: a short line across the bottom of the plot, rising slightly to the right
      part: the plot's bottom edge
    - where: a tiny dot below the plot, slanting down to the left, between the plot and the roof line
      part: the storehouse roof's finial
    - where: a line across the middle of the upper half, rising slightly to the right, about a third as long as the frame's top
      part: the storehouse roof and its eaves
    - where: a stroke down the left of the lower inner area, from under the roof to near the bottom
      part: the storehouse's left wall
    - where: a stroke from the top of the left wall running across and then turning down, ending at the bottom
      part: the storehouse's top and right wall
    - where: a short stroke inside the storehouse at the upper left, going down
      part: the window's left side
    - where: a short stroke from the top of the window's left side across the top and turning down
      part: the window's top and right side
    - where: a short line across the bottom of the window
      part: the window's sill
    - where: a short line across the bottom of the storehouse, rising slightly to the right, joining the left wall to the right wall
      part: the storehouse's floor
    - where: a line across the bottom of the frame, from the foot of the left border to the foot of the right border
      part: the map's bottom border

夜:
  object: a person sneaking along under cover, beneath a night sky with a crescent moon
  history: 'An ideogram: a person 亻 moving under a cover 亠 of night 夕, the evening moon.'
  layout: >-
    The top of the picture is a dark-blue-grey cover of night, pale and soft: a short peg and a
    long cloth stretched across the top. Below it on the left a person tiptoes forward facing
    right, glancing around, with a face (eyes, nose, mouth) and simple pale clothes. On the right a
    pale moon hangs, a long thin cloud sloping across it down to the right. Soft pale blues and
    greys.
  exact:
    - The cover is two strokes, a tiny peg and a long line across the top; they do not touch, and the cover touches neither the person nor the moon.
    - The person's body stroke leans out to the left and its short leg stroke starts from its middle; the leg stroke is almost as long as the body stroke.
    - The moon is made of a short tick at the top, a long curve across the top turning down and then to the lower left, and a small dot inside; the curve crosses the long cloud.
    - The long cloud edge slants down to the right and then runs across to the right; it starts at the moon's top tick, and is the longest slanted stroke.
    - The small dot stands free of the curve.
    - The cover line is a little under nine tenths as long as the moon's curve.
  strokes:
    - where: a tiny dot at the top centre, slanting down to the right
      part: the peg that holds the cover up
    - where: a long line across the top, rising a little to the right
      part: the night cover stretched across the sky
    - where: a sweep from the top of the left part down and out to the bottom left
      part: the person's body, leaning forward, running into the leg
    - where: a vertical line from the middle of the sweep straight down to the bottom
      part: the person's other leg
    - where: a short stroke at the top of the right part, going down and turning to the lower left
      part: the moon's upper tip
    - where: a line from the middle of that stroke, going across and rising to the right, then turning down and curving back to the lower left
      part: the moon's outer curve
    - where: a tiny dot inside the curve, slanting down to the right, standing free
      part: a crater on the moon
    - where: a long stroke from the end of the moon's upper tip, going down to the right and then turning out across to the right, crossing the curve
      part: the long cloud drifting over the moon

録:
  object: a record written with a brush, set down by a hand holding the brush
  history: >-
    An ideogram of copying a record: a hand 彐 holding a brush; the left-hand part adds metal 釒, the
    plate that is carved.
  layout: >-
    On the left stands a small pile of pale metal, as a small shed roof over ingots and two nuggets
    beside them, on a line of earth. On the right a hand holds a brush: the hand across the upper
    part, the brush hanging down from it with its tuft spread. The hand is a pale hand with
    fingers, drawn plainly, and the brush has a pale wooden shaft and a pale grey tuft.
  exact:
    - The two parts do not touch each other.
    - The metal's two bars cross its upright; the upright ends touching the earth line.
    - The two nuggets and the bars stand apart, the left nugget dot stands free of the upright, the right nugget dot stands free of the upper bars.
    - The metal's earth line rises to the right and is the longest stroke on the left.
    - The hand's long wrist line is the longest stroke on the right; the hand's top stroke is about seven tenths as long.
    - The brush's shaft starts on the wrist line and ends in a small hook up to the left; it is the longest downward stroke.
    - The brush's rising stroke at the lower left touches the shaft; the sweep out to the right also starts on the shaft; the little dot at the upper left stands free.
  strokes:
    - where: a sweep from the top of the left part down and out to the lower left
      part: the left slope of the small shed roof
    - where: a short dot at the top of the left part, slanting down to the right, from the top of the sweep
      part: the right slope of the small shed roof
    - where: a short line across the middle of the left part, rising a little to the right, from the sweep
      part: the upper ingot
    - where: a slightly longer short line across the lower middle, rising a little to the right, crossing the upright
      part: the lower ingot
    - where: a short vertical line down from the upper ingot to the earth line
      part: the post that holds the ingots
    - where: a dot at the lower left, slanting down to the right, standing free
      part: a nugget of metal
    - where: a dot at the lower right of the left part, slanting down to the left, standing free
      part: a second nugget of metal
    - where: a long line along the bottom of the left part, rising to the right
      part: the line of the earth
    - where: a stroke at the upper left of the right part, going down and turning across to the right
      part: the hand's thumb
    - where: a stroke across the upper right part, then turning down to the lower left at its end
      part: the hand's back and fingers
    - where: a long line across the middle of the right part, from the left to nearly the far right
      part: the writer's wrist and forearm
    - where: a long straight stroke down from the middle of the wrist line, ending in a small hook up to the left
      part: the brush's shaft
    - where: a dot at the upper left of the shaft, slanting down to the right, standing free
      part: a bristle at the brush's left
    - where: a short stroke rising to the right at the lower left of the shaft, ending on it
      part: the tuft's lower left bristle
    - where: a short stroke at the right of the shaft, slanting down to the left, standing free
      part: a bristle at the brush's right
    - where: a stroke from the shaft's middle going down to the right and then turning out across to the right
      part: the tuft's long right bristle

录:
  object: a record written with a brush, set down by a hand holding the brush
  history: >-
    An ideogram of copying a record: a hand 彐 holding a brush; the left-hand part adds metal 釒, the
    plate that is carved.
  layout: >-
    At the top a pale hand with fingers, drawn plainly, extends across the picture. A brush hangs
    down from the hand: a pale wooden shaft in the centre with a pale grey tuft spread to both
    sides. The shaft is the centre of the picture and the tuft spreads under it.
  exact:
    - The hand's top stroke ends touching the long wrist line below it; the small middle stroke stands free.
    - The brush's shaft starts on the middle of the wrist line and ends in a small hook up to the left.
    - The wrist line is the longest stroke across; the hand's top stroke is four fifths as long; the small middle stroke is only about a third as long.
    - The tuft's lower left stroke runs across and rises to the right, with a small gap from the shaft; the little dot at the upper left stands free.
    - The tuft's long sweep to the right starts on the shaft and is the longest of its strokes.
  strokes:
    - where: a stroke at the top, going across to the right and then turning down to the lower left, ending on the wrist line
      part: the hand's back and fingers
    - where: a short line across below the first, in the upper left, standing free
      part: the hand's thumb
    - where: a long line across the middle of the upper half, from the far left to nearly the far right
      part: the wrist and forearm
    - where: a long straight stroke down from the middle of the wrist line, ending in a small hook up to the left
      part: the brush's shaft
    - where: a short dot at the left of the shaft, slanting down to the right, standing free
      part: a bristle at the brush's left
    - where: a short stroke at the lower left, going across to the right and then turning up to the right, with a gap from the shaft
      part: the tuft's lower left bristle
    - where: a short stroke on the right of the shaft, running to the left and then turning down to the lower left
      part: the tuft's upper right bristle
    - where: a long stroke from the shaft's middle going down to the right and then turning out across to the right
      part: the tuft's long right bristle

非:
  object: a pair of bird's wings spread apart, back to back, their feathers pointing outward
  history: >-
    The oldest forms drew two wings opposed, or two people back to back; the modern form keeps the
    two rows of feathers on either side of a pair of spines.
  layout: >-
    Two pale grey-blue wings stand side by side, turned away from each other, with a gap between the
    spines. The left wing's feathers point to the left, the right wing's feathers point to the
    right; each wing has three feathers. Each spine is a tall pale quill.
  exact:
    - Each of the three left feathers ends touching the left spine, and each of the three right feathers starts on the right spine.
    - The two spines do not touch each other; the right spine is a little taller than the left, about a fifth longer, and starts higher and ends lower.
    - The left feathers are short and level, and the lowest one rises to the right; the right feathers rise slightly to the right, and the lowest is the longest.
    - The three left feathers are about three quarters as long as the lowest right feather.
    - There is a clear gap between the left wing and the right wing.
  strokes:
    - where: a long straight line down the left of the centre, from the upper part nearly to the bottom
      part: the left wing's spine
    - where: a short line across the upper part, ending on the left spine and extending to the left
      part: the left wing's upper feather
    - where: a short line across the middle, ending on the left spine and extending to the left
      part: the left wing's middle feather
    - where: a longer stroke below it, rising to the right, ending on the left spine and extending to the left
      part: the left wing's lower feather
    - where: a longer straight line down the right of the centre, from the very top to the very bottom
      part: the right wing's spine
    - where: a short line starting on the right spine near the top, rising a little to the right
      part: the right wing's upper feather
    - where: a short line starting on the right spine in the middle, rising a little to the right
      part: the right wing's middle feather
    - where: a slightly longer line starting on the right spine in the lower part, running to the right
      part: the right wing's lowest feather

念:
  object: a heart that keeps in mind what is spoken, a mouth-shaped roof over a heart with small things falling into it
  history: 'An ideogram: the present 今 kept in the heart 心, so to think of.'
  layout: >-
    The top of the picture is a roof of lips, a wide-open mouth speaking, with two small things
    falling gently from beneath it. Below sits a human heart, drawn simply and plump, in pale red
    with its two short vessels at the top. The roof is wide, the heart is under it and narrower.
  exact:
    - The roof's two strokes start at the same point at the top centre, one sweeps down and out to the left, the other runs down to the right and turns across to the right.
    - The roof's left sweep is the longer, the right lip is about three quarters as long.
    - The small bent bundle at the left under the roof runs across and then turns down to the left, and stands free of the roof; the tiny dot above it also stands free.
    - The four heart strokes stand free of each other and of the strokes above.
    - The heart's long curve runs down to the right, then across, then rises and ends in a small hook up to the left.
    - The roof is wider than the heart; the heart is about three quarters as wide.
  strokes:
    - where: a long sweep from the top centre down and out to the left
      part: the mouth's left lip, running down to the left
    - where: a stroke from the top of the sweep going down to the right and then turning across to the right
      part: the mouth's right lip
    - where: a very short slanting dot under the roof, in the middle, slanting down to the right
      part: the first small thing spoken of
    - where: a stroke at the lower left of the roof, going across to the right, rising slightly, and turning down to the left at its end
      part: the second thing spoken of, a small bent bundle
    - where: a short stroke at the lower left, going down a little to the left
      part: the left edge of the heart
    - where: a long curve from left of centre going down to the right, then across the bottom and up, ending in a small hook up to the left
      part: the heart's rounded lower body
    - where: a short dot near the top centre of the heart, slanting down to the right
      part: a vessel rising from the heart
    - where: a short dot at the upper right of the heart, slanting down to the right
      part: a second vessel at the heart's upper right

育:
  object: a mother with her baby curled up inside her body
  history: >-
    The oldest forms drew a woman with a small child, upside down, being born; the modern form keeps
    a cover on top and the flesh beneath.
  layout: >-
    A pregnant mother stands facing us, with a gentle face (eyes, nose, mouth) and a simple pale
    dress. A tiny hair knot sits at the top of her head and her arms are held out in a line across
    her shoulders. Inside the upper part of her body a baby curls up, drawn as a pale glow within
    her. Her round body fills the lower part. Pale rose, cream and soft yellow.
  exact:
    - The shoulder line is long and rises a little to the right; the hair knot above it stands free of it.
    - The baby's back is a stroke from the centre of the shoulders going down to the left and then turning across and rising to the right; the baby's knee is a short stroke slanting down to the right, touching it.
    - The baby's back and knee stand apart from the shoulder line only by their top, which touches the shoulder line.
    - The body's left side is a straight vertical; its top-and-right stroke runs across, turns down and ends in a small hook up to the left.
    - The two short strokes inside the body rise a little to the right and start on the left side without touching the right side; the lower one is a little longer.
    - The shoulder line is about as long as the body's top-and-right stroke.
  strokes:
    - where: a tiny dot at the top centre, slanting down to the right
      part: the mother's hair knot
    - where: a long line across the upper part, rising a little to the right
      part: her shoulders and outstretched arms
    - where: a stroke from the middle of the shoulder line going down to the left and then turning across to the right, rising slightly
      part: the baby's curled back
    - where: a short stroke on the right of the baby's back, slanting down to the right
      part: the baby's folded knee
    - where: a long vertical line down the left of the lower part
      part: the left side of the mother's body
    - where: a line starting at the top of the left side, going across to the right and then turning down, ending in a small hook up to the left
      part: the front of her body, her round belly
    - where: a short line across inside the body, rising a little to the right, starting on the left side
      part: the fold of her dress
    - where: a slightly longer line lower down, rising a little to the right, starting on the left side
      part: the second fold of her dress

命:
  object: a master giving an order from his mouth to a person kneeling before him
  history: 'An ideogram: an order 令 given by a mouth 口.'
  layout: >-
    A master stands at the top centre, his robe spreading to both sides, with a face (eyes, nose,
    mouth) and simple pale clothes. Below him on the right a person kneels, bowing to receive the
    order, also with a face and pale clothes. At the lower left a wide-open mouth calls out the
    order, drawn plainly in pale red.
  exact:
    - The master's body sweep is long and slants down to the left; his arm starts at the same point at the top and runs down to the right then across to the right.
    - The kneeling person's two strokes meet at their start, a short line down from the middle with a small hook up; the long vertical is the longest stroke of the kneeler.
    - The mouth is a closed box, the left side and the top-and-right stroke start at the same point, the top turning down at the right, and the bottom line joins the left side's foot to the right side's foot.
    - The mouth stands apart from the master and the kneeler, with small gaps.
    - The kneeler's back-and-sleeve stroke is about half as long as the master's body sweep.
  strokes:
    - where: a long sweep from the top centre down and out to the left
      part: the master's body, running down into his left sleeve
    - where: a stroke from the top of the sweep going down to the right and then turning across to the right
      part: the master's right arm, held out in command
    - where: a short line across the middle, rising a little to the right, standing free
      part: the master's sash
    - where: a short line down on the left, at the lower left
      part: the mouth's left corner
    - where: a line across the top of the mouth from the same point, rising a little to the right and then turning down on the right
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, rising a little to the right
      part: the lower lip
    - where: a line across the middle right, going right and then turning down, ending in a small hook to the left
      part: the kneeling person's bowed back, arms and bent knees
    - where: a long straight line down from the start of that line to the bottom centre
      part: the kneeling person's body, bowed

服:
  object: a person kneeling to put on a coat
  history: 'An ideogram: a person 卩 putting on 又 a coat 月.'
  layout: >-
    The coat hangs on the left, a plain pale blue coat with two small buttons. A person kneels on
    the right facing left, with a friendly face (eyes, nose, mouth) and a simple pale tunic, reaching
    forward with both arms to slip into the coat. Pale blue coat, cream tunic.
  exact:
    - The coat's left edge is a long stroke that curves out to the lower left at its foot; the coat's top-and-right stroke ends in a small hook up to the left.
    - The coat's two small strokes touch its left edge and stop short of the right edge; they are very short.
    - The kneeler's body is a long straight vertical, about as long as the coat's top-and-right stroke; the coat stands apart from the kneeler with a gap.
    - The kneeler's head-and-back stroke starts at the top of the vertical and runs across, then turns down, ending in a small hook to the left.
    - The kneeler's arm stroke starts and ends on the vertical; the second arm stroke crosses it and sweeps out to the far right.
    - The kneeler's arm is about three quarters as long as the coat's top-and-right stroke; the sweeping arm is about half of it.
  strokes:
    - where: a long line down the left side of the coat, curving slightly out to the lower left at its foot
      part: the coat's left edge, and the foot of the coat
    - where: a long line across the top of the coat from the left, turning down at the right and ending in a small hook up to the left at the bottom
      part: the coat's top and right edge
    - where: a tiny dot-like stroke in the upper middle of the coat, rising to the right
      part: the coat's upper button
    - where: a tiny dot-like stroke lower down, level
      part: the coat's lower button
    - where: a line across the top of the right half, running right and turning down, ending in a small hook to the left
      part: the kneeler's head and bent back
    - where: a long straight line down the centre-right, from the top to the bottom
      part: the kneeler's body, upright
    - where: a line from the middle of the vertical going across to the right, turning down and then turning down to the left, ending on the vertical
      part: the kneeler's arm, reaching forward
    - where: a stroke from the middle of the vertical going down to the right and turning across to the far right
      part: the kneeler's other arm, sweeping out

週:
  object: a bordered plot of land with a well in it, walked around
  history: >-
    The oldest forms drew a bordered field with a well inside, and a walker going around it; the
    modern form keeps the border, the earth and the well.
  layout: >-
    A bordered plot of land, drawn as an arch-shaped edge open at the bottom, fills the upper right
    of the picture. Inside it a small mound of pale brown earth and under it a stone well with water.
    Round the lower left a traveller walks along a long road, facing right, with a face (eyes, nose,
    mouth) and simple pale clothes, the road sweeping under the plot. Pale greens, browns and greys.
  exact:
    - The border's left side is a long vertical and the top-and-right stroke starts at its top, runs across and turns down, ending in a small hook to the left; it is the longest stroke across, about twice as wide as the earth mound.
    - The mound's upper line crosses its vertical; the vertical ends touching the ground line below.
    - The mound's upper line and its ground line are about equally long.
    - The well is closed, its left side and its top-and-right stroke start at the same point, and the bottom line joins their feet.
    - The border, the mound and the well stand apart with small gaps; the border's left side stops short of the road.
    - The walker's body stroke ends on the road; the walker's head dot stands free.
  strokes:
    - where: a long line down the left side of the plot, from the top to near the bottom
      part: the plot's left border
    - where: a long line starting at the top of the left border, running across and turning down at the right, ending in a small hook to the left
      part: the plot's top and right border
    - where: a short line across the upper part of the plot, rising a little to the right
      part: the upper layer of the mound of earth
    - where: a short line down the middle of the mound, crossing the upper line
      part: the mound's ridge
    - where: a short line across the foot of the mound, rising a little to the right
      part: the mound's base
    - where: a short line down at the left of the well
      part: the well's left wall
    - where: a line across the top of the well, rising a little to the right and turning down at the right
      part: the well's rim and right wall
    - where: a short line across the foot of the well
      part: the well's lower edge
    - where: a tiny slanting dot at the upper left of the picture
      part: the walker's head
    - where: a short stroke at the left, going across and rising a little to the right and then turning down
      part: the walker's body, striding forward
    - where: a long line along the bottom, rising a little to the right, then turning across and then rising again at the right
      part: the road

周:
  object: a bordered plot of land with a well in it, walked around
  history: >-
    The oldest forms drew a bordered field with a well inside, and a walker going around it; the
    modern form keeps the border, the earth and the well.
  layout: >-
    A bordered plot of land, drawn as an arch-shaped edge open at the bottom, fills the square.
    Inside it a small mound of pale brown earth and under it a stone well with water. The ground
    below is plain. Pale greens, browns and greys.
  exact:
    - The border's left side is a long vertical leaning slightly out to the lower left; the top-and-right stroke starts at its top, runs across and turns down, ending in a small hook up to the left; it is the longest stroke across.
    - The mound's upper line crosses its vertical; the vertical ends touching the ground line.
    - The mound's upper line is clearly shorter than its ground line, about three quarters as long.
    - The well is closed, its left side and its top-and-right stroke start at the same point, and the bottom line joins their feet.
    - The border, the mound and the well stand apart with small gaps; the well is about as wide as the mound.
  strokes:
    - where: a long line down the left side, leaning slightly out to the lower left, from the top to near the bottom
      part: the plot's left border
    - where: a long line starting at the top of the left border, running across and turning down at the right, ending in a small hook up to the left
      part: the plot's top and right border
    - where: a short line across the upper part of the middle, rising a little to the right
      part: the upper layer of the mound of earth
    - where: a short line down the middle of the mound, crossing the upper line
      part: the mound's ridge
    - where: a longer line across the foot of the mound, about a third longer than the upper line
      part: the mound's base
    - where: a short line down at the left of the well
      part: the well's left wall
    - where: a line across the top of the well, rising a little to the right and turning down at the right
      part: the well's rim and right wall
    - where: a short line across the foot of the well
      part: the well's lower edge

备:
  object: a farmer walking to his field to prepare for the harvest
  history: 'An ideogram: going 夂 to the farm 田 to prepare, so ready.'
  layout: >-
    A farmer strides across the upper part of the picture toward the right, with a face (eyes, nose,
    mouth), a pale straw hat and simple pale clothes. Below him lies a rice field seen from above,
    divided into four plots by raised banks. Pale yellow, pale green and light brown.
  exact:
    - The farmer's body stroke is long, runs across rising slightly to the right and then turns down to the left into the back leg; his front leg sweeps down to the right and then across to the right, ending in his foot; the arm's sweep is the shortest of the three, about two thirds as long as the front leg.
    - The field's left side starts at its top-left corner and slants a little down to the right; the top-and-right stroke starts at the same point; the field's bottom line closes it at the lower left and the lower right.
    - The field's cross-line and its centre line cross each other, the cross-line is a short line across the middle that crosses the centre line, which starts on the top bank and ends on the bottom bank.
    - The field's inner cross-line is very short, about a quarter of the farmer's body stroke.
    - The field stands under the farmer with a small gap and does not touch him.
  strokes:
    - where: a short sweep at the top left, going down to the right and then turning down to the lower left
      part: the farmer's swinging arm
    - where: a long line across the top, rising a little to the right and then turning down to the lower left
      part: the farmer's body and back leg
    - where: a stroke from the upper middle going down to the right and then turning across to the right
      part: the farmer's front leg, striding forward, and its foot
    - where: a short stroke on the left of the field, going down to the right, then turning down
      part: the field's left bank
    - where: a long line starting at the top of the left bank, going across and turning down at the right
      part: the field's top and right bank
    - where: a short line across the middle of the field, rising a little to the right, crossing the centre bank
      part: the bank dividing the upper plots from the lower
    - where: a short line down the middle of the field, crossing that line
      part: the bank dividing the left plots from the right
    - where: a line across the bottom of the field, rising a little to the right, from the left bank to the right bank
      part: the field's bottom bank

具:
  object: a writing tablet laid on a table, with two hands under the table
  history: 'An ideogram: two hands 八 writing on a tablet 目.'
  layout: >-
    A tall pale wooden writing tablet stands on the table with three grooves in it. The table is a
    wide flat board under it. Under the table the two hands reach up from the lower left and the
    lower right to hold it, pale and open, wrists showing. Pale wood, cream, soft browns. No text.
  exact:
    - The tablet's left side and its top-and-right stroke start at the same point; both the left side and the right side end touching the table.
    - The three grooves start on the tablet's left side and stop short of the right side with a gap; they are very short, only about a fifth as long as the table.
    - The table is the longest stroke across; the tablet's top-and-right stroke is about three quarters of the table's length.
    - The tablet is clearly narrower than the table; the table extends past it on both sides.
    - The two hands stand free of the table and of each other; the left hand is a little longer than the right hand.
  strokes:
    - where: a long line down the left side of the tablet, from the top to the table
      part: the tablet's left edge
    - where: a line across the top of the tablet from the same point, turning down at the right and ending on the table
      part: the tablet's top and right edge
    - where: a very short line across the upper tablet, from the left edge, rising a little to the right
      part: the tablet's upper groove
    - where: a very short line across the middle of the tablet, from the left edge, rising a little to the right
      part: the tablet's middle groove
    - where: a very short line across the lower tablet, from the left edge, rising a little to the right
      part: the tablet's lower groove
    - where: a long line across below the tablet, from the far left to nearly the far right
      part: the table
    - where: a stroke at the bottom centre, slanting down to the left, standing free
      part: the left hand, reaching up to the table
    - where: a stroke at the bottom right, slanting down to the right, a little shorter, standing free
      part: the right hand, reaching up to the table

岡:
  object: clouds forming over a mountain
  history: 'The oldest forms drew clouds, a net of vapour, over a mountain: the ridge of a hill.'
  layout: >-
    A tall pale mountain of three peaks rises at the bottom centre, the middle peak the tallest. Over
    it a soft round bank of cloud arches and wraps around the sky above, standing open at the bottom.
    A small puff and a wisp of cloud float inside the arch, and a flat cloud floor spreads just
    above the peaks. Pale blue-grey cloud, soft green mountain.
  exact:
    - The cloud arch's left side is a straight vertical; its top-and-right stroke runs across, turns down and ends in a small hook up to the left; it is the longest stroke and wraps the whole picture.
    - The cloud floor line rises a little to the right and is under the little puff and wisp, which stand free of each other and of the arch.
    - The middle peak starts on the cloud floor line; its end touches the mountain's base stroke.
    - The mountain's left side and its base are one stroke, it runs down from the left peak and turns up to the right, touching the right peak.
    - The right peak is a vertical a little shorter than the middle peak and starts lower; the left peak is lower than the right.
    - The mountain stands apart from the arch with a clear gap.
  strokes:
    - where: a long straight line down the left side, from the top to near the bottom
      part: the cloud bank's left edge
    - where: a long line starting at the top of the left edge, running across and turning down at the right, ending in a small hook up to the left
      part: the cloud bank's top and right edge
    - where: a tiny dot at the upper left inside the arch, slanting down to the right
      part: a small puff of cloud
    - where: a short stroke at the upper right inside the arch, slanting down to the left
      part: a wisp of cloud
    - where: a line across below them, rising a little to the right
      part: the flat floor of the clouds
    - where: a short vertical line down the centre from the middle of the cloud floor
      part: the mountain's middle peak
    - where: a stroke from the middle left going down and then turning up to the right
      part: the mountain's left side and base
    - where: a short vertical line at the right, a little lower than the middle peak, ending on the base
      part: the mountain's right peak

責:
  object: a cowrie shell, the money that must be repaid, with a small marker post standing over it
  history: >-
    The oldest forms drew a shell, the first money, under a mark of what is owed: money that must be
    repaid.
  layout: >-
    A small marker post stands at the top on a long flat shelf. Under the shelf hangs a cowrie shell,
    the glossy sea shell once used as money, standing on end, with its two lower ends splaying left
    and right. The marker post is a plain pale wooden post with two crossbars. Pale cream shell,
    pale wood.
  exact:
    - The post is a straight vertical starting high above the crossbars and ending touching the shelf; it crosses both crossbars.
    - The upper crossbar is the longer, about a half as long as the shelf; the lower crossbar is clearly shorter, about three quarters as long as the upper; both rise slightly to the right.
    - The shelf is the longest stroke across.
    - The shell hangs under the shelf with a small gap and does not touch it.
    - The shell's left side and its top-and-right stroke start at the same point; the three short lines inside start on the left side and do not touch the right side; the bottom line closes the shell at the left side's end and the right side's end.
    - The shell's two lower ends stand free, the left end slants down to the left and is longer than the right end, about three quarters; the right end slants down to the right.
  strokes:
    - where: a line across the upper part of the post, rising slightly to the right, crossing the post
      part: the post's upper crossbar
    - where: a shorter line below it, rising slightly to the right, crossing the post
      part: the post's lower crossbar
    - where: a short stroke from the very top going down to the right and then straight down, to the shelf
      part: the marker post
    - where: a long line across, from the far left to the far right
      part: the shelf
    - where: a line down the left side of the shell, from under the shelf
      part: the shell's left side
    - where: a line from the top of the left side going across to the right and turning down
      part: the shell's rounded top and right side
    - where: a short line across the upper middle of the shell, from the left side, rising a little to the right
      part: the upper tooth line of the shell's opening
    - where: a short line across the lower middle of the shell, from the left side, rising a little to the right
      part: the lower tooth line of the shell's opening
    - where: a short line across the bottom of the shell, closing it
      part: the shell's base
    - where: a stroke at the bottom centre, slanting down to the left, standing free
      part: the shell's lower left end
    - where: a shorter stroke at the bottom right, slanting down to the right, standing free
      part: the shell's lower right end

责:
  object: a cowrie shell, the money that must be repaid, with a small marker post standing over it
  history: >-
    The oldest forms drew a shell, the first money, under a mark of what is owed: money that must be
    repaid.
  layout: >-
    A small marker post stands at the top on a long flat shelf. Under the shelf hangs a cowrie shell,
    the glossy sea shell once used as money, standing on end, with an opening that runs down its
    middle and out at its lower left, and a short end at the lower right. The marker post is a plain
    pale wooden post with two crossbars. Pale cream shell, pale wood.
  exact:
    - The post is a straight vertical starting high above the crossbars and ending touching the shelf; it crosses both crossbars.
    - The upper crossbar is the longer, about a half as long as the shelf; the lower crossbar is clearly shorter, about four fifths as long as the upper; both rise slightly to the right.
    - The shelf is the longest stroke across.
    - The shell hangs under the shelf with a small gap and does not touch it.
    - The shell's left side and its top-and-right stroke start at the same point; the long sweep through the shell starts under the top, in the middle, and stands free of both sides.
    - The long sweep is about twice as long as the shell's left side; the short dot at the lower right stands free.
  strokes:
    - where: a line across the upper part of the post, rising slightly to the right, crossing the post
      part: the post's upper crossbar
    - where: a shorter line below it, rising slightly to the right, crossing the post
      part: the post's lower crossbar
    - where: a short stroke from the very top going down to the right and then straight down, to the shelf
      part: the marker post
    - where: a long line across, from the far left to the far right
      part: the shelf
    - where: a line down the left side of the shell, from under the shelf, to below the middle
      part: the shell's left side
    - where: a line from the top of the left side going across to the right and turning down to below the middle
      part: the shell's rounded top and right side
    - where: a long sweep from just under the top of the shell, down the middle and out to the bottom left, standing free
      part: the shell's long toothed opening
    - where: a short dot at the lower right, slanting down to the right, standing free
      part: the shell's short lower right end

武:
  object: a foot stopped by an arrow, with a short barrier plank across the road
  history: 'An ideogram: to stop someone, a foot 止, with an arrow 弋, so martial.'
  layout: >-
    At the lower left stands a bare human foot, a pale ankle and heel, with its toes pointing right.
    An arrow drives down from the sky across the picture from the top to the lower right, curving up
    at its tip. A taut cord crosses it. A short barrier plank lies above the foot at the upper left.
    A small feather sits near the top of the arrow. Pale wood and cream.
  exact:
    - The plank at the upper left stands free, it touches neither the arrow nor the foot, with a small gap from the arrow.
    - The arrow's long shaft runs from the top centre down to the right and curves up at the bottom right; it is the longest stroke of the picture.
    - The cord runs across, rising to the right, and crosses the arrow's shaft; the foot's ankle stroke starts on the cord.
    - The foot's sole stroke runs across the bottom, rising to the right at the end; the ankle stroke ends touching the sole.
    - The foot's toe stroke is short, rising to the right; it starts on the ankle and stops short of the arrow with a gap.
    - The heel stroke at the left ends touching the sole.
    - The small feather near the top right of the arrow stands free.
    - The cord is the longest stroke across the foot, about one and a half times as long as the sole.
  strokes:
    - where: a short line across the upper left, rising slightly to the right
      part: the barrier plank
    - where: a long line across the middle, rising to the right, wider than the foot
      part: the cord stretched across the arrow
    - where: a stroke from the middle of the cord going down to the right and then straight down
      part: the foot's ankle
    - where: a short stroke from the middle of the ankle rising to the right
      part: the foot's toes
    - where: a short stroke at the left, going down to the right, then turning down
      part: the foot's heel
    - where: a line across the bottom left, going to the right and rising at the end
      part: the foot's sole
    - where: a very long stroke from the top centre going down, then turning down to the right and finally curving up at the bottom right
      part: the arrow's shaft
    - where: a small dot at the top right of the shaft, slanting down to the right, standing free
      part: the arrow's feather

郎:
  object: a young gentleman from a good place, with a store of grain and a town beside him
  history: 'An ideogram: a man from a good place, the 良 store of grain and the 阝 town.'
  layout: >-
    A young gentleman stands small at the lower left with a friendly face (eyes, nose, mouth) and a
    simple pale robe. Beside and behind him on the left half stands a neat grain store: a small roof
    peak, a hopper, and grain spilling from a spout. On the right half is a town: a tall straight
    wall on its left and rooftops on its upper right. Pale cream, grey stone and soft terracotta.
  exact:
    - The hopper's top-and-right stroke starts at its left and runs across, then turns down; the two short inner lines rise to the right and stop short of the right wall.
    - The hopper's roof peak is a tiny dot above it that stands free.
    - The spout is a long left stroke from the hopper's top-left, down and curving up to the right at the bottom; the grain dot stands free.
    - The two short inner lines are very short, about as long as the roof peak dot; the lower one is a little longer.
    - The town wall is a long straight vertical, the longest stroke of the right half, with the rooftops starting at its top and ending in a small hook up to the left.
    - The town stands apart from the grain store with a clear gap.
    - The rooftops stroke is about one and a quarter times the wall's width.
  strokes:
    - where: a tiny dot at the top of the left half, slanting down to the right
      part: the grain store's roof peak
    - where: a stroke at the upper left, going across and turning down
      part: the hopper's top and right wall
    - where: a short stroke inside the hopper at the middle left, rising to the right
      part: the hopper's upper plank
    - where: a slightly longer stroke below it, rising to the right
      part: the hopper's lower plank
    - where: a long stroke from the left of the hopper going down and curving up to the right at the bottom
      part: the hopper's left side and spout
    - where: a short dot at the lower middle, slanting down to the right, standing free
      part: grain spilling from the spout
    - where: a stroke at the top of the right half going across, turning down to the left, then down to the right, then down ending in a small hook up to the left
      part: the town's rooftops
    - where: a long straight line down the left side of the right half, from the top to the bottom
      part: the town's tall wall
