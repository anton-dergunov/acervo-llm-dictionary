    - where: a long straight line down the middle of the left third, from the top to the bottom
      part: the rice stalk
    - where: a sweep from the centre of the stalk down and out to the bottom left
      part: a branch of grains drooping to the bottom left
    - where: a short dot beside the stalk, below the branch, slanting down to the right
