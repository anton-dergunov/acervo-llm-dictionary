    - where: a long stroke down the left of the mask, then turning across to the right at its bottom, ending in a hook up
      part: the mask's left cheek, jaw and chin
    - where: a very long line across the middle of the lower part, from near the left edge to near the right edge
      part: the arms, flung wide
    - where: a stroke below the arms line at the left, sweeping down to the bottom left
      part: the left leg
    - where: a long straight vertical stroke from the mask's bottom down to the bottom
      part: the body and the right leg

农:
  object: a farmer tilling a field with a hoe
  history: >-
    The oldest forms drew hands and a hoe working a field in the forest. The modern form keeps the
    roof-like cover of the field and the long sweep of the hoe.
  layout: >-
    A farmer bends forward with a friendly face, a pale hat and simple pale clothes, swinging a long
    hoe down toward the soil on the bottom left. A small plot of field with a short edge lies at the
    upper left. The soil is pale brown, the clothes pale blue, the field pale green.
  exact:
    - The field's short vertical and its long line across start together.
    - The field's line across ends in a small hook down to the left, and the hoe's handle crosses it.
    - The hoe's handle is the longest stroke in the character, running from the top centre to the bottom left.
    - The bend at the bottom is a short stroke from the hoe's handle that turns up to the right, and the farmer's back is a long falling stroke starting from the handle.
    - The farmer's small arm stroke floats free of the handle and stops just short of the back.
    - The farmer's back is long and ends by turning across to the right.
  strokes:
    - where: a short vertical stroke at the upper left, slightly slanting
      part: the field's left edge
    - where: a line across the upper left, ending in a small hook down to the left
      part: the field's top edge, with the hoe's handle crossing it
    - where: a very long stroke from the top centre, down, then turning down to the left, to the lower left
      part: the hoe's long handle
    - where: a stroke starting on the handle in the lower middle, down, then turning up to the right at the end
      part: the hoe's iron blade, curving at the bottom
    - where: a short stroke at the middle right, slanting down to the left toward the farmer's back
      part: the farmer's arm, reaching down to the handle
    - where: a long stroke from the middle of the handle down to the right, then turning across to the right at the bottom
      part: the farmer's back and leg, bent forward

農:
  object: a farmer tilling a field with a hoe
  history: >-
    The oldest forms drew hands and a hoe working a field in the forest. The modern form puts the
    field on top and a hoe, once a clam shell tied to a handle, below.
  layout: >-
    A farmer bends forward with a friendly face, a pale hat and simple pale clothes, swinging a long
    hoe down toward the soil. A field plot lies in the upper part with two furrows rising through its
    top; below it the hoe and the farmer's bent body fill the lower part. The soil is pale brown, the
    clothes pale blue, the field pale green.
  exact:
    - The field plot has a left side, a top-and-right stroke, a base and a middle line; the two furrows rise through its top and end on its base.
    - The field's left side and its top-and-right stroke start together.
    - The field's top-and-right stroke ends where the base ends.
    - The farmer's long back stroke is the longest stroke, falling from the field's bottom left to the bottom left of the character.
    - The hoe's handle is a long falling stroke from the middle to the bottom right and turns across to the right at its end.
    - The three lines across below the field rise slightly to the right; the lowest is the longest, about two thirds as long as the field's top line, the upper one is about half as long, and the middle one is the shortest, about a third.
    - The hoe blade's curve ends rising up to the right, and the small stroke at its right floats free.
  strokes:
    - where: a short stroke at the upper left of the field, slanting down to the right
      part: the field's left edge
    - where: a long line across the top of the field, turning down at the right and slanting down to the left
      part: the field's top and right edge
    - where: a short line across the middle of the field, rising slightly to the right
      part: the middle furrow
    - where: a vertical stroke down the left of the field, rising above its top
      part: the left furrow, rising out of the plot
    - where: a stroke down the right of the field, slanting down to the right then straight down, rising above its top
      part: the right furrow, rising out of the plot
    - where: a line across the bottom of the field, rising slightly to the right
      part: the field's base
    - where: a line across under the field, rising slightly to the right, about half as long as the field's top line
      part: the farmer's shoulders
    - where: a very long stroke from the left of the shoulders, down, then turning down to the left, to the bottom left
      part: the farmer's bent back and left leg
    - where: a short line across the middle of the farmer's body, rising slightly to the right
      part: the farmer's belt
    - where: a longer line across the lower body, rising slightly to the right, the longest cross line
      part: the farmer's arm, holding the hoe
    - where: a stroke from the arm's left end, down, then turning up to the right at the bottom
      part: the hoe's blade, curving at the bottom
    - where: a short stroke at the right of the arm, slanting down to the left
      part: a chip of soil thrown up by the hoe
    - where: a long stroke starting on the arm, slanting down to the right, then turning across to the right at the bottom
      part: the hoe's long handle, swinging out to the right

杀:
  object: two crossed blades laid above a wooden grave marker shaped like a tree
  history: >-
    An ideogram: a cut 乂, a pair of crossing strokes, over wood 木, here a coffin. The picture shows
    the two things without any person.
  layout: >-
    Two crossed swords fill the upper part, pale silver with simple pale handles, one slanting each
    way. Below them a wooden marker with a crossbar and a post stands on a mound of earth. The wood is
    pale brown, the mound pale green.
  exact:
    - The two swords cross at their middles and are about the same length, the one slanting down to the left a little longer.
    - The crossed swords do not touch the wooden marker below them.
    - The marker's crossbar is the longest line, running almost from edge to edge, and the post crosses it.
    - The post ends in a small hook up to the left.
    - The two short supports float free of the post, the right one longer than the left one.
  strokes:
    - where: a long stroke from the top centre down and out to the left, ending at the middle left
      part: the sword slanting down to the left
    - where: a shorter stroke from the upper left of the swords down to the right
      part: the sword slanting down to the right, crossing the first
    - where: a long line across the middle of the lower part, from near the left edge to near the right edge
      part: the marker's crossbar
    - where: a long vertical stroke from the top of the marker down through the crossbar, ending in a hook up to the left
      part: the marker's post
    - where: a short stroke at the lower left, slanting down to the left
      part: the left support, bracing the post
    - where: a short stroke at the lower right, slanting down to the right
      part: the right support, bracing the post

守:
  object: a hand kept safe beneath the roof of a house
  history: 'An ideogram: keeping something, the hand 寸, within the walls of a house 宀.'
  layout: >-
    A house with a roof fills the upper half. Beneath its roof, filling the lower half, a hand holds
    something safe, drawn as a forearm reaching in from the left with the hand closed round it, and a
    small guard with a friendly face (eyes, nose and mouth) and simple pale clothes standing beside it.
    The roof is pale terracotta, the hand pale skin.
  exact:
    - The roof's top dot floats free and does not touch the roof line.
    - The roof's left wall is a short vertical that touches the start of the roof line.
    - The roof line is long and ends in a small hook down to the left.
    - The hand's long vertical crosses the arm line and ends in a hook up to the left; it stops short of the roof.
    - The arm line is about as long as the roof line.
    - The small dot beside the hand floats free of everything.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the roof's chimney
    - where: a short vertical stroke at the left, under the roof's start
      part: the roof's left wall
    - where: a long line across the top, starting at the left wall, ending in a small hook down to the left
      part: the roof's ridge, running across
    - where: a long line across the middle of the square from near the left edge to near the right edge
      part: the guard's forearm, reaching across
    - where: a vertical stroke from the middle of the forearm down to the bottom, ending in a hook up to the left
      part: the hand closed round the thing it keeps, the hook its curled fingers
    - where: a short stroke at the left of the hand, slanting down to the right
      part: the guard's thumb

戏:
  object: a hand juggling a spear for show
  history: 'An ideogram: a hand 又 doing tricks with a spear 戈, play and theatre.'
  layout: >-
    On the left a hand is raised, open, tossing a long spear that fills the right two thirds, from the
    top to the bottom. A small performer with a friendly face (eyes, nose and mouth) and simple pale
    clothes stands behind the hand, watching the spear. The spear shaft is pale wood and the blade pale
    silver.
  exact:
    - The hand's two strokes cross each other.
    - The hand is smaller than the spear and lies in the lower middle of the left side.
    - The spear's short crosspiece rises to the right and crosses the spear's shaft; it does not touch the hand.
    - The spear's shaft starts at the top, runs down, curves to the right at the bottom and rises up at its end.
    - The spear's long blade-guard falls from the right to the left, and crosses the shaft.
    - The small dot at the upper right floats free of the shaft.
  strokes:
    - where: a stroke at the left, across and rising slightly to the right, then turning down, then turning down to the left to the bottom left
      part: the hand's back and wrist
    - where: a stroke from the middle left of the hand down to the right, crossing the first
      part: the hand's spread fingers
    - where: a line across the middle, rising to the right, crossing the shaft
      part: the spear's crosspiece
    - where: a very long stroke from the top centre, down, then turning down to the right, curving along the bottom and rising at the end
      part: the spear's long shaft
    - where: a long stroke from the right of the crosspiece down and out to the left, crossing the shaft
      part: the spear's long side blade
    - where: a short stroke at the upper right, slanting down to the right
      part: the spear's tassel

似:
  object: one person resembling another, standing side by side
  history: 'An ideogram: a person 亻 who resembles another, drawn next to a look-alike.'
  layout: >-
    Two people stand side by side, almost twins. The tall one on the left faces right; the slightly
    shorter one on the right faces left, as if looking in a mirror. Both have friendly faces with
    eyes, a nose and a mouth and wear simple pale clothes, one pale blue and one pale green.
  exact:
    - The left person is made of two strokes, the body and the leg, which start together at the middle.
    - The left person's leg starts on the body and does not touch the right person.
    - The right person is made of four strokes; the first curls down and up to the right, the second is a small dot, the third is a long sweep, the fourth is a short stroke.
    - The right person's curling stroke and the small dot float free of everything.
    - The right person's long sweep is longer than the left person's leg.
    - The right person's short last stroke starts on the long sweep.
  strokes:
    - where: a long stroke from the top, down, then turning down to the left, to the middle left
      part: the left person's body and arm
    - where: a vertical stroke from the middle of the first, straight down to near the bottom
      part: the left person's leg
    - where: a stroke in the middle, going down and then turning up to the right
      part: the right person's arm, swinging up
    - where: a short dot in the upper middle, slanting down to the right
      part: the right person's head
    - where: a long stroke on the right from the upper right, down, then turning down to the left, to the bottom centre
      part: the right person's body and left leg
    - where: a short stroke at the lower right, slanting down to the right from the middle of the long sweep
      part: the right person's right leg

份:
  object: a man receiving his share, a portion handed out to him
  history: 'An ideogram: a man 亻 holding the portion 分 given to him.'
  layout: >-
    A man stands on the left, in simple pale clothes with a friendly face (eyes, nose and mouth), holding out
    both hands. On the right a round loaf is being cut in two and divided: its two pieces fall apart
    for him. The loaf is pale gold, the clothes pale blue.
  exact:
    - The man is made of two strokes, his body and arm sweeping down to the left, and a straight leg starting at the middle of it.
    - The portion's top sweep and its first small sweep float free of the man.
    - The portion's bottom curved stroke starts clearly apart from the small sweep above it and ends in a hook up to the left.
    - The portion's dividing sweep starts at the beginning of the curved stroke and is shorter than the man's body.
    - The portion's first stroke is a short sweep down to the left; its second falls down to the right and turns across at its end.
  strokes:
    - where: a long stroke from the top left, down, then turning down to the left, to the middle left
      part: the man's body and arm
    - where: a vertical stroke from the middle of the first, straight down to near the bottom
      part: the man's leg
    - where: a short sweep at the top of the right part, falling down to the left
      part: the left piece's upper edge, cut off
    - where: a stroke from the top centre of the right part, falling down to the right and turning across to the right at its end
      part: the right piece's upper edge, curving away
    - where: a line across the middle of the right part, rising slightly to the right, turning down and ending in a hook up to the left
      part: the loaf's base, its bottom edge curving up at the end
    - where: a sweep from the middle of the right part, falling down and out to the bottom left
      part: the knife cut that divides the loaf
