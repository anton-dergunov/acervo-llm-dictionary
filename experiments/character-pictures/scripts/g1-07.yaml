    right two thirds a round-cornered rice ball sits as a square enclosure drawn as pale stone;
    inside it a spindle stands upright with a bundle of thread wound on its upper half, and under it a
    hand reaches in to hold it. Rice is warm cream, the stalk pale gold, the hand pale skin.
  exact:
    - The two grains at the top of the stalk float free of every other stroke.
    - The stalk's line across crosses the stalk, and its right end stops short of the rice ball.
    - The stalk's two lower sweeps start at the stalk and do not touch each other; the right one is a short dot.
    - The rice ball's left wall starts and ends at the same points as the floor, and the floor touches the right wall at its end.
    - The ball's left wall and the stalk stand close but apart; they do not touch.
    - The hand's small dots float free of everything.
    - The ball's top-and-right wall is the longest stroke on the right, turning down at the top right.
