    The oldest forms drew an enclosure with something gathered inside it. The inside, 專, was a spindle
    wound with thread, held in a hand, a mark of skill.
  layout: >-
    A tall walled yard fills the frame, its wall drawn as pale stone. Inside it a spindle stands upright
    with a bundle of thread wound on its upper half, and under it a hand reaches in from the left to
    hold it. The thread is pale pink, the spindle pale wood, the hand pale skin.
  exact:
    - The wall is closed; the left wall and the top-and-right wall start together at the top left, and the floor meets the left wall at the bottom left and touches the right wall at its end.
    - The wall is the longest thing; the floor is about as long as the top-and-right wall's width and rises slightly to the right.
    - The spindle stands clear of the wall, but its top touches the top wall.
    - The spindle's shaft crosses the line across at the top, the bundle's three lines, and ends on the whorl line.
    - The hand's wrist line floats free, and does not touch the left wall or the top-and-right wall.
