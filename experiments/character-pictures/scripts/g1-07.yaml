異:
  object: a person in a scary mask, arms flung wide, showing the strange and foreign
  history: >-
    The oldest forms drew a person with a scary face, a mask like a field grid 田, with the arms
    raised. The modern forms keep the face on top and the arms and legs below.
  layout: >-
    The mask fills the upper third, a frightening carved face with wide eyes and a toothy mouth, with a
    person's friendly face behind it peeping at the side. The body below is a person with simple
    pale clothes, arms flung wide and two legs apart. The mask is pale terracotta, the clothes pale blue.
  exact:
    - The mask is a small grid made of a left side, a top-and-right stroke, a cross line and a middle line.
    - The mask's left side and top stroke start together at the top left.
    - The mask's middle line crosses the cross line; the mask's bottom stroke rises to the right and ends on the top-and-right stroke's end.
    - The line across the lower body is the longest line, running almost from edge to edge; the line across the upper body, which the person's upper arms cross, is clearly shorter, about two thirds as long.
    - The upper arms are two strokes sloping down to the right, close to the same length.
    - The two legs float free of everything; the right leg is shorter and straighter than the left leg.
  strokes:
    - where: a vertical stroke down the left side of the mask
      part: the mask's left cheek
    - where: a line across the top of the mask, turning down at the right and running down the right side
      part: the mask's brow and right cheek
    - where: a short line across the middle of the mask, rising slightly to the right
      part: the mask's grimacing mouth
    - where: a short vertical stroke down the middle of the mask, through the mouth line
      part: the mask's nose
    - where: a short stroke rising to the right at the bottom of the mask
      part: the mask's chin
    - where: a line across the upper middle of the body, crossing the two upper-arm strokes, about two thirds as long as the line across the lower body
      part: the shoulders, spread wide
    - where: a short stroke down from the shoulders at the left, slanting down to the right, then turning down
      part: the left raised arm
    - where: a short stroke down from the shoulders at the right, slanting down to the right, then turning down
      part: the right raised arm
    - where: a very long line across the lower part of the body, from near the left edge to near the right edge
      part: the hips and the belt, spread wide
    - where: a stroke below the belt at the left, sweeping down to the bottom left
      part: the left leg
    - where: a stroke below the belt at the right, slanting down to the bottom right
      part: the right leg

异:
  object: a person in a scary mask, arms flung wide, showing the strange and foreign
  history: >-
    The oldest forms drew a person with a scary face, a mask like a field grid 田, with the arms
    raised. The modern forms keep the face on top and the arms and legs below.
  layout: >-
    The mask fills the upper third, a frightening carved face with wide eyes and a toothy mouth, with a
    person's friendly face behind it peeping at the side. The body below is a person with simple
    pale clothes, arms flung wide and two legs apart. The mask is pale terracotta, the clothes pale blue.
  exact:
    - The mask's two short strokes at the top meet at their right ends; the upper one is longer than the lower one, about one and a third times.
    - The mask's long left stroke starts at the top left of the mask and runs down, turning across to the right at its bottom and ending in a small hook up.
    - The arms line is the longest line, running almost from edge to edge.
