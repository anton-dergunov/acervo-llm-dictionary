# Full run, group g1, batch 07. Written from the fact sheets, following scripts/GUIDE.md.

导:
  object: a hand pointing the way to a place, a small house at the end of a winding path
  history: >-
    The oldest forms drew a hand, the later inch-hand 寸, leading someone to a destination. The place
    on top is a coiled shape that stands for the destination.
  layout: >-
    The place fills the upper middle: a small house with a winding path curling to it. The hand fills
    the lower, wider half, an arm reaching in from the left with its finger pointing up toward the
    house. A small friendly traveller with a face and simple pale clothes stands beside the hand,
    looking where it points. Pale colours; the house roof soft red, the path pale sand.
  exact:
    - The two short strokes of the place join at their right ends; the longer of the two is the upper one.
    - The path stroke starts where the upper short stroke starts, and the lower short stroke touches its middle.
    - The path stroke ends in a small hook up at the right.
    - The hand's long vertical crosses the arm line and ends in a hook up to the left; it stops just short of the path above it.
    - The small dot under the arm floats free of everything.
    - The arm line is the longest line in the character, and it rises slightly to the right.
  strokes:
    - where: a short stroke across the top of the upper middle, rising slightly to the right, ending in a small hook down to the left
      part: the house's roof
    - where: a shorter stroke across just below the roof, rising slightly to the right
      part: the house's floor line, under the roof
    - where: a stroke down the left of the upper middle, turning across to the right at the bottom and ending in a small hook up
      part: the winding path that curls round the house to its door
    - where: a long line across the lower half from near the left edge to near the right edge, rising slightly to the right
      part: the arm, reaching across
    - where: a vertical stroke from the middle of the arm line down to the bottom, ending in a hook up to the left
      part: the hand with its pointing finger, the hook its curled thumb
    - where: a very short dot below the arm line on the left, slanting down to the right
      part: the small mark at the wrist

導:
  object: a hand pointing the way to a place, a small house at the end of a winding path
  history: >-
    The oldest forms drew a hand, the later inch-hand 寸, leading someone to a destination. The
    traditional form puts a road, with a head walking along it, in place of the simple place.
  layout: >-
    The road fills the upper two thirds: a person's head with hair and a face, seen from the front,
    stands on a long road that runs across the bottom of that part. The hand fills the lower third,
    an arm reaching in from the left with its finger pointing up toward the head. The head has eyes,
    a nose and a mouth; the road is pale sand; the hair is pale brown.
  exact:
    - The two hair tufts at the top are small and apart from each other and from the head below.
    - The head is a box made by a vertical on the left and a line that goes across the top and turns down on the right.
    - The three short lines inside the head do not reach the long road line under it.
    - The long road line is the longest line of the upper part, and it rises slightly to the right.
    - The road's small dot on the upper left stands free of every other stroke.
    - The hand's long vertical crosses the arm line, ends in a hook up to the left, and does not touch the road line.
    - The small dot under the arm floats free of everything.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: a tuft of hair
    - where: a short stroke at the top right, slanting down to the left
      part: a second tuft of hair
    - where: a line across the top of the head, rising slightly to the right
      part: the brow and the line of the hair
    - where: a short dot just below the brow, slanting down to the left
      part: the middle of the forehead
    - where: a short vertical down the left side of the head
      part: the left side of the face
    - where: a stroke across the head's top, turning down on the right to the middle of the head
      part: the top and the right side of the face
    - where: a short line across inside the head, high up, rising slightly to the right
      part: the eyes
    - where: a short line across inside the head, below the eyes, rising slightly to the right
      part: the cheeks
    - where: a short line across inside the head, near its bottom
      part: the mouth
    - where: a short dot at the upper left of the road, slanting down to the right
      part: a milestone beside the road
    - where: a stroke at the left of the road, across then turning down
      part: the road's near bend, turning toward the viewer
    - where: a very long line across the lower part of the road, rising slightly to the right at its end
      part: the long road, running from the left to the right
    - where: a long line across the lower third, from near the left edge to near the right edge
      part: the arm, reaching across
    - where: a vertical stroke from the middle of the arm line down to the bottom, ending in a hook up to the left
      part: the hand with its pointing finger, the hook its curled thumb
    - where: a very short dot below the arm line on the left, slanting down to the right
      part: the small mark at the wrist

亚:
  object: a house or temple built in the shape of a cross, seen from the front
  history: >-
    The oldest forms drew the plan of a cross-shaped house or temple. The modern forms keep its flat
    roof, two walls and wide floor.
  layout: >-
    A wide, low temple fills the square. Its flat roof is a line across the top, two tall pillars
    stand under it, two small wings or steps stand out on the left and right sides, and a broad floor
    runs along the bottom. The stone is pale grey, the roof pale terracotta, with a soft sky behind it.
  exact:
    - The two pillars both start at the roof line and both reach the floor line.
    - The roof line is clearly shorter than the floor line, a little over half as long.
    - The left wing is a short dot that floats free, and does not touch the pillar beside it.
    - The right wing is a short stroke that touches the right pillar and slants down to the left.
    - The floor line is the longest line and runs across the whole bottom.
  strokes:
    - where: a line across the top, from the left to the right, clearly shorter than the floor
      part: the temple's flat roof
    - where: a long vertical stroke down the middle-left from the roof to the floor, slanting very slightly to the right
      part: the left pillar
    - where: a long vertical stroke down the middle-right from the roof to the floor, slanting very slightly to the right
      part: the right pillar
    - where: a short dot at the left edge in the middle, slanting down to the right
      part: the left wing, a step standing apart
    - where: a short stroke on the right side, starting at the upper right and slanting down to the left until it touches the right pillar
      part: the right wing, leaning on the pillar
    - where: a very long line across the bottom, from the left edge to the right edge
      part: the broad floor of the temple

亞:
  object: a house or temple built in the shape of a cross, seen from the front
  history: >-
    The oldest forms drew the plan of a cross-shaped house or temple. The modern forms keep its flat
    roof, two walls and wide floor.
  layout: >-
    A wide, low temple fills the square. A roof line runs across the top, a floor line across the
    bottom, and between them the cross-shaped hall: a left room and a right room, each with a doorway.
    The stone is pale grey, the roof pale terracotta, with a soft sky behind it.
  exact:
    - The roof line is about half as long as the floor line, clearly shorter.
    - The short left stem and the short left hook meet at their ends; the left room's long stroke touches the floor.
    - The right room's long stroke starts at the roof line and turns across at its bottom, ending in a small hook down to the left.
    - The small stroke under the right room's turn and the short vertical below it meet at their tops; the vertical reaches the floor.
    - The floor line is the longest line and runs across the whole bottom.
  strokes:
    - where: a line across the top, from the left to the right, clearly shorter than the floor
      part: the temple's roof
    - where: a short vertical stroke hanging from the left end of the roof
      part: the left room's upper wall
    - where: a short line across at the middle left, rising slightly to the right
      part: the left room's lintel
    - where: a long stroke starting at the left end of the lintel, down, then turning across to the right, then turning down to the floor
      part: the left room's side wall and doorway, reaching the floor
    - where: a long stroke starting at the middle of the roof, down, then turning across to the right, ending in a small hook down to the left
      part: the right room's wall, turning into its lintel
    - where: a short line across under the right room's lintel
      part: the right room's threshold
    - where: a short vertical stroke down from the threshold's left end to the floor
      part: the right room's doorpost
    - where: a very long line across the bottom, from the left edge to the right edge
      part: the broad floor of the temple

师:
  object: a master skillfully cutting a hanging cloth with a knife
  history: 'An ideogram: a knife 刀 wielded skillfully on a cloth 帀, a master.'
  layout: >-
    A knife stands upright on the left half, its blade pointing up and its edge toward the cloth. A
    cloth hangs on the right half from a beam on a tall pole. Behind the knife, drawn very pale, a
    master in simple clothes with a friendly face (eyes, nose and mouth) holds the knife by its handle.
    The cloth is pale blue, the knife pale silver.
  exact:
    - The knife and the cloth do not touch each other.
    - The knife's two strokes do not touch each other.
    - The pole starts at the middle of the beam and runs far lower than the cloth, nearly to the bottom.
    - The cloth's left stroke and its top-and-right stroke start together, and the cloth's edge crosses the pole.
    - The cloth's top-and-right stroke ends in a small hook to the left.
    - The knife is the tallest on the left, and its blade is taller than the cloth.
  strokes:
    - where: a short vertical stroke on the left, in the upper middle, apart from the long stroke
      part: the knife's bright cutting edge
    - where: a long stroke starting at the upper left, down, then turning down to the left, almost to the bottom
      part: the knife's blade, tapering to its point at the bottom
    - where: a line across the top of the right half, rising slightly to the right
      part: the beam the cloth hangs from
    - where: a short vertical stroke at the left of the right half, in the middle
      part: the cloth's left edge
    - where: a line starting at the top of the cloth's left edge, across to the right, then turning down, ending in a small hook to the left
      part: the cloth's top edge and its right edge, with the hem curling at the end
    - where: a long vertical stroke from the middle of the beam down almost to the bottom
      part: the pole the cloth hangs from, passing through the cloth

師:
  object: a master skillfully cutting a hanging cloth with a knife
  history: 'An ideogram: a knife wielded skillfully on a cloth 帀, a master.'
  layout: >-
    A tall knife with a toothed back stands upright on the left, its blade pointing up. A cloth hangs
    on the right half from a beam on a tall pole. Behind the knife, drawn very pale, a master in
    simple clothes with a friendly face (eyes, nose and mouth) holds it by the handle. The cloth is
    pale blue, the knife pale silver.
  exact:
    - The knife and the cloth do not touch each other.
    - The knife's long left stroke is the tallest stroke on the left; its four teeth lie to its right and all start on it.
    - The pole starts at the middle of the beam and runs far lower than the cloth, nearly to the bottom.
    - The cloth's left stroke and its top-and-right stroke start together, and the cloth's top edge crosses the pole.
    - The cloth's top-and-right stroke ends in a small hook to the left.
    - The cloth's left stroke stops short of the knife's teeth.
  strokes:
    - where: a short stroke at the top of the left part, down to the right then back down to the left
      part: the knife's tip
    - where: a long stroke down the left side of the left part, from just below the tip almost to the bottom
      part: the knife's blade
    - where: a stroke starting on the blade, across and rising to the right, then turning down at the end, in the upper part
      part: the top tooth on the knife's back
    - where: a short stroke across to the right from the blade, a little below the top tooth, rising slightly to the right
      part: the second tooth
    - where: a stroke across from the blade, rising to the right and turning down at its end, in the lower middle
      part: the third tooth
    - where: a short stroke across from the blade near the bottom, rising slightly to the right
      part: the lowest tooth
    - where: a line across the top of the right half, rising slightly to the right
      part: the beam the cloth hangs from
    - where: a short vertical stroke at the left of the right half, in the middle
      part: the cloth's left edge
    - where: a line starting at the top of the cloth's left edge, across to the right, then turning down, ending in a small hook to the left
      part: the cloth's top edge and its right edge, with the hem curling at the end
    - where: a long vertical stroke from the middle of the beam down almost to the bottom
      part: the pole the cloth hangs from, passing through the cloth

团:
  object: a walled yard with a young sprout of talent growing inside it
  history: >-
    The oldest forms drew an enclosure with something gathered inside it. The inside, 才, began as a
    sprout pushing out of the ground, standing for talent.
  layout: >-
    A square walled yard fills the frame, its wall drawn as pale stone. Inside it, on the soil, a
    single young sprout with two small leaves stands in the middle, small against the walls. The
    sprout is pale green, the stone pale grey, the soil pale brown.
  exact:
    - The wall is closed at every corner; the left wall and the top-and-right wall start together at the top left, and the floor meets the left wall at the bottom left and ends touching the right wall.
    - The sprout stands clear of the wall on every side and touches nothing of it.
    - The sprout's stem crosses the sprout's line across, and ends in a small hook up to the left.
    - The sprout's leaf sweeps down to the left from the crossing, shorter than the stem.
    - The floor is clearly shorter than the top-and-right wall.
  strokes:
    - where: a long vertical line down the left side
      part: the yard's left wall
    - where: a line across the top, turning down at the top right and running down the whole right side
      part: the yard's top wall and right wall
    - where: a short line across the middle of the yard, rising slightly to the right
      part: the soil line the sprout grows from
    - where: a vertical stroke down the centre of the yard crossing the soil line, ending in a small hook up to the left
      part: the sprout's stem
    - where: a short sweep from the crossing down to the left
      part: the sprout's leaf
    - where: a line along the bottom of the yard, rising slightly to the right, from the left wall to the right wall
      part: the yard's floor wall

團:
