光:
  object: a person carrying a torch, held up high in both hands
  history: 'An ideogram: a person 儿 with fire 火 above, the light a torch gives.'
  layout: >-
    A person stands facing the viewer with both arms raised to hold a tall torch above the head; the
    torch fills the upper half and the person the lower. The person has a friendly face with eyes, a
    nose and a mouth, and wears simple pale clothes; the head and body are drawn pale between the two
    legs, directly under the arms. The flame is soft yellow and orange, the clothes pale blue.
  exact:
    - The torch's long stroke slants slightly to the right as it goes down, and ends on the arms line.
    - The two flames are small strokes on either side of the torch and do not touch anything.
    - The right flame is longer than the left flame, about twice as long.
    - The arms line is long and runs across, and the torch ends on its middle.
    - The left leg starts just under the arms line and does not touch it.
    - The right leg starts where the torch ends, turns across to the right at the bottom and ends in a small hook up.
  strokes:
    - where: a long stroke from the top centre slanting down to the right, then turning straight down, to the middle of the figure
      part: the torch's shaft
    - where: a short dot at the upper left of the torch, slanting down to the right
      part: the left side of the flame
    - where: a medium stroke at the upper right of the torch, slanting down and back to the left toward the shaft
      part: the right side of the flame
    - where: a line across the middle of the square from near the left to the right
      part: the person's raised arms, gripping the torch
    - where: a stroke from just under the arms line, down, then turning down to the bottom left
      part: the person's left leg
    - where: a long stroke from the torch's end down, then turning across to the right along the bottom, then turning up at the end
      part: the person's right leg and foot

曲:
  object: a folded object, a piece of cloth folded into a square pile
  history: >-
    The oldest forms drew a bent object, a square thing with a fold; the modern form shows the box
    with two folds running through it.
  layout: >-
    A square pile of folded cloth fills the lower two thirds, its two creases rising through the top
    as two ridges. The cloth is pale blue and the creases are soft shadows, with a pale cream
    background.
  exact:
    - The box has a left side, a top, a right side and a base, but its top is open between the two creases.
    - The left side and the top-and-right stroke start together at the upper left.
    - The base touches the bottom of the left side and the end of the right stroke.
    - The two creases both pass through the box's top, and both end on the base; the left crease slants slightly to the right and the right crease is straight.
    - The short line across the middle of the box crosses both creases and stops short of the left side.
    - The right crease is higher and a little shorter than the left crease.
  strokes:
    - where: a short stroke down the left side of the box, slanting a little to the right
      part: the cloth pile's left edge
    - where: a long stroke across the top of the box, turning down at the right and ending in a small hook up to the left
      part: the cloth's top fold and its right edge
    - where: a short line across the middle of the box, from between the left side and the first crease to the right
      part: the middle fold
    - where: a long stroke down on the left of the middle, slanting slightly to the right, starting above the box
      part: the left crease, rising out through the top of the pile
    - where: a long straight stroke down the middle, starting higher than the left crease
      part: the right crease, rising out through the top of the pile
    - where: a line across the base of the box, rising slightly to the right
      part: the base of the pile

企:
  object: a person on tiptoe, standing on the toes of a foot
  history: 'An ideogram: a person 人 on his foot 止, standing on tiptoe to see further.'
  layout: >-
    A person stands on tiptoe in the upper half, facing the viewer, head up as if looking far away.
    The person has a friendly face with eyes, a nose and a mouth and wears simple pale clothes. The
    foot beneath is drawn large, with its toes pointing up, on a line of ground along the bottom.
    The clothes are pale blue, the ground pale sand.
  exact:
    - The person's two strokes start together at the top; the first sweeps down to the left, the second down to the right and turns across at its end.
    - The foot's long stroke slants slightly to the right as it goes down and ends on the ground line.
    - The toes stroke is short, about a quarter as long as the ground line.
    - The small toes stroke touches the middle of the foot's long stroke and rises slightly to the right.
    - The heel is a short vertical on the left; it is about a third as long as the person's body, and ends on the ground.
    - The foot's strokes do not touch the person's strokes.
    - The ground line is the longest of the foot's strokes and runs across the bottom.
  strokes:
    - where: a long stroke from the top centre down, then turning down to the left, to the middle left
      part: the person's body, running down into the left leg
    - where: a stroke from the top of the first stroke down to the right, then turning across to the right
      part: the person's right leg, stretched out
    - where: a stroke from the middle of the square down to the right, then turning straight down to the ground
      part: the foot's main bone, rising on tiptoe
    - where: a short line across from the foot's main bone at its lower middle, rising slightly to the right, about a quarter as long as the ground line
      part: the toes
    - where: a short vertical stroke on the left, running down to the ground
      part: the heel
    - where: a long line across the bottom
      part: the ground the foot stands on

则:
  object: a cowrie shell standing on end, with a knife cutting laws into it
  history: >-
    An ideogram: a shell 贝, once used as money and a slate, with a knife 刀 cutting the laws on it.
  layout: >-
    The cowrie stands on the left, tall, its toothed slit running down its middle; a knife stands upright
    on the right, taller than the shell. A small person stands beside the knife, in simple pale
    clothes, with a friendly face (eyes, nose and mouth), holding it by the handle. The shell is pale
    pink with a pale cream slit, the knife pale silver.
  exact:
    - The shell and the knife do not touch.
    - The shell's left side and its top-and-right stroke start together at the top left.
    - The shell's long slit stroke and its short dot float free of the shell's outline.
    - The short slit stroke on the right of the shell is a short dot, clearly shorter than the long slit.
    - The knife's blade is the tallest stroke of all and ends in a small hook to the left.
    - The knife's short stroke beside it is much shorter than the blade, a little over a third as long.
  strokes:
    - where: a straight stroke down the left side of the shell, from the top to below the middle, slanting very slightly to the right
      part: the left side of the shell
    - where: a line across the top of the shell, turning down at the right to run down to below the middle
      part: the shell's rounded top and right side
    - where: a long sweep from just under the top, down the middle of the shell and out to the bottom left
      part: the shell's long toothed opening, running out at its lower left end
    - where: a short dot at the lower right of the shell, slanting down to the right
      part: the shell's short lower right end
    - where: a short vertical stroke in the middle of the knife part, left of the blade
      part: the knife's bright cutting edge
    - where: a long vertical stroke on the right, from near the top to the bottom, ending in a small hook to the left
      part: the knife's blade

則:
  object: a cowrie shell standing on end, with a knife cutting laws into it
  history: >-
    An ideogram: a shell 貝, once used as money and a slate, with a knife 刀 cutting the laws on it.
  layout: >-
    The cowrie stands on the left, tall, with three notches or teeth down its front and two short
    feet; a knife stands upright on the right, taller than the shell. A small person stands beside the
    knife, in simple pale clothes, with a friendly face (eyes, nose and mouth), holding it by the
    handle. The shell is pale pink, the knife pale silver.
  exact:
    - The shell and the knife do not touch.
    - The shell's left side starts at the top left and ends where the lowest inner line starts.
    - The shell's top-and-right stroke starts at the top of the left side and its end touches the lowest inner line.
    - The three inner lines lie one above the other, rising slightly to the right, and all start on the left side except the lowest, which starts where the left side ends.
    - The lowest inner line is a little longer than the upper two.
    - The two feet at the bottom float free of everything, and the left foot is longer than the right.
    - The knife's blade is the tallest stroke of all and ends in a small hook up to the left.
  strokes:
    - where: a straight vertical stroke down the left side of the shell, from the top to below the middle
      part: the left side of the shell
    - where: a line across the top of the shell, rising slightly to the right, turning down at the right to run down to below the middle
      part: the shell's rounded top and right side
    - where: a short stroke rising to the right, in the upper part of the shell, starting on the left side
      part: the top tooth of the shell's opening
    - where: a short line across the middle of the shell, rising slightly to the right, starting on the left side
      part: the middle tooth
    - where: a line across the lower middle of the shell, rising slightly to the right, from the end of the left side to the right side
      part: the lowest tooth, the shell's lip
    - where: a longer sweep at the bottom left, down to the left, apart from the shell's lip
      part: the shell's left foot
    - where: a short stroke at the bottom centre, slanting down to the right
      part: the shell's right foot
    - where: a short vertical stroke in the middle of the knife part, left of the blade
      part: the knife's bright cutting edge
    - where: a long vertical stroke on the right, from near the top to the bottom, ending in a small hook up to the left
      part: the knife's blade

字:
  object: a child inside a house
  history: 'An ideogram: a child 子 under a roof 宀. The child also gives the sound.'
  layout: >-
    A house with a roof fills the upper part, and in its doorway sits a baby wrapped in swaddling
    cloth, its arms stretched out wide, taking the lower part. The child has a round friendly face
    with eyes, a nose and a mouth, and wears a pale wrap. The roof is pale terracotta, the wrap pale
    yellow.
  exact:
    - The roof's small top dot floats free and does not touch the roof line below it.
    - The roof's left side is a short vertical that touches the start of the roof line.
    - The roof line is long, runs across the top and ends in a small hook down to the left.
    - The child's head stroke runs across and turns back down to the left, ending where the body begins.
    - The body is a long stroke down that ends in a hook up to the left; the arms line crosses it.
    - The arms line is the longest line in the child, and it is long, almost as wide as the whole character.
    - The child's head stroke stops short of the roof line above it and the arms line below it.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the roof's chimney
    - where: a short vertical stroke at the left, under the roof's start
      part: the roof's left wall
    - where: a long line across the top, starting at the left wall, ending in a small hook down to the left
      part: the roof's ridge, running across
    - where: a line across the upper part of the child, turning down to the left to end at the centre
      part: the child's head, its top and right side, closing at the chin
    - where: a long line down from the head's chin, slanting a little to the right, then turning down and ending in a hook up to the left
      part: the body bundled in its wrap, the hook its bundled feet
    - where: a long line across the middle of the child, from near the left edge to near the right edge
      part: both arms, stretched out wide

争:
  object: two hands pulling a hooked pole between them, each trying to win it
  history: 'An ideogram: two hands, 爪 and 彐, struggling over a hooked stick 亅.'
  layout: >-
    A tall pole with a hooked foot stands upright in the middle. One hand reaches down on it from the
    top, the other reaches across it from the left and the right, each gripping the pole. Both hands
    are pale skin; the two arms wear simple pale sleeves, and the pole is pale wood.
  exact:
    - The upper hand's two strokes lie in the top third; the first sweeps down to the left, and the second runs across from its top and turns down to the left; they touch each other.
    - The lower hand's top-and-right stroke runs across, then turns down; its end touches the end of the lowest finger line.
    - The arm line is the longest line, and runs almost the whole width from the left edge to the right edge.
    - The lowest finger line is clearly shorter than the arm line, about half as long.
    - The pole is the tallest stroke, starts under the upper hand and ends in a small hook up to the left.
    - The pole crosses the arm line and the lowest finger line, and almost touches the upper hand.
  strokes:
    - where: a stroke from the top centre, down, then turning down to the left
      part: the upper hand's wrist, coming down from above
    - where: a line from the middle of the wrist across to the right, then turning down to the left
      part: the upper hand's fingers, closing round the pole
    - where: a stroke across the middle left, rising slightly to the right, then turning down at the right
      part: the lower hand's back and fingertips, closing on the pole
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the lower hand's arm, reaching across from the left
    - where: a line across the lower middle, shorter than the arm
      part: the lower hand's thumb, wrapping round the pole
    - where: a tall stroke from the middle of the lower hand's back down to the bottom, ending in a small hook up to the left
      part: the hooked pole

爭:
  object: two hands pulling a hooked pole between them, each trying to win it
  history: 'An ideogram: two hands, 爪 and 彐, struggling over a hooked stick 亅.'
  layout: >-
    A tall pole with a hooked foot stands upright in the middle. One hand reaches down on it from the
    top, with three spread fingers, the other reaches across it from the left, each gripping the pole.
    Both hands are pale skin; the two arms wear simple pale sleeves, and the pole is pale wood.
  exact:
    - The upper hand's four strokes all float free of each other and of everything else.
    - The lower hand's top-and-right stroke is about three quarters as long as the arm line.
    - The upper hand's wrist line leans down to the left; its three fingers are short strokes below it, the right one the longest.
    - The lower hand's top-and-right stroke runs across, then turns down; its end touches the end of the lowest finger line.
    - The arm line is the longest line, and runs almost the whole width from the left edge to the right edge.
    - The lowest finger line is clearly shorter than the arm line, about half as long.
    - The pole is the tallest stroke, starts under the upper hand and ends in a small hook up to the left.
  strokes:
    - where: a line across the top centre, running to the left and then turning down to the left
      part: the upper hand's wrist, coming down from above
    - where: a short stroke on the left, below the wrist, slanting down to the right
      part: the upper hand's left finger
    - where: a short dot below the wrist, in the middle, slanting down to the right
      part: the upper hand's middle finger
    - where: a stroke on the right, below the wrist, slanting down to the right then turning back down to the left
      part: the upper hand's right finger, the longest
    - where: a stroke across the middle left, rising slightly, then turning down at the right, about three quarters as long as the arm line
      part: the lower hand's back and fingertips, closing on the pole
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the lower hand's arm, reaching across from the left
    - where: a line across the lower middle, shorter than the arm, rising slightly to the right
      part: the lower hand's thumb, wrapping round the pole
    - where: a tall stroke from the middle of the lower hand's back, down to the right, then turning down to the bottom, ending in a small hook up to the left
      part: the hooked pole

观:
  object: a hand raised as a visor beside a person with a big eye, looking again
  history: >-
    An ideogram: to see 见 again 又. The right side is an eye 目 standing on two legs 儿, a person
    who is all looking.
  layout: >-
    On the right a person fills the height: a big round eye is the head, with a friendly face around it
    (a nose and a mouth) and simple pale clothes, standing on two legs and gazing left. On the left
    a hand reaches up, held beside the eye as a visor to look again. The eye is pale blue, the
    clothes pale yellow, the hand pale skin.
  exact:
    - The hand's two strokes cross each other.
    - The hand is clearly smaller than the person and lower than the person's eye.
    - The eye's left side and its top-and-right stroke start together at the top.
    - The eye's left side and the leg do not touch each other, and the eye's right side and the leg do not touch each other.
    - The left leg is a long sweep that ends at the bottom left; the right leg turns across at the bottom and rises at its end.
    - The hand and the person do not touch.
  strokes:
    - where: a stroke across at the upper left, then turning down to the left to the bottom left
      part: the hand's back and wrist, held up
    - where: a stroke from the middle left of the hand down to the right, crossing the first
      part: the hand's fingers, spread across
    - where: a short stroke at the top of the person, down to the right, then down
      part: the eye's left edge
    - where: a line across the top of the person, turning down at the right and running down the right side
      part: the eye's top and right edge, the eyelid
    - where: a long stroke starting inside the eye, down, then turning down to the left, to the bottom left
      part: the person's left leg
    - where: a stroke starting under the eye, down, then turning across to the right along the bottom, then up at the end
      part: the person's right leg and foot

州:
  object: three islands lying in a river that runs in three streams
  history: >-
    The oldest forms drew a river with islands in its streams. The three streams are the river, and
    the small strokes are the islands, a state.
  layout: >-
    Three streams of water run down the square from the top to the bottom, side by side, the left
    one curving out to the bottom left. Between and beside them lie three small islands, each a grassy
    mound with a few pale trees. The water is pale blue, the islands pale green.
  exact:
    - All six strokes stand apart; none touches another.
    - The left stream curves out to the left at its bottom, and the middle stream is shorter than the left and the right.
    - The right stream is the longest, reaching from the top to the bottom, a little longer than the left stream.
    - The islands are small; the leftmost is the shortest, a short vertical; the other two are small slanting strokes.
    - The middle island lies between the left and middle streams; the right island lies between the middle and right streams.
  strokes:
    - where: a short vertical stroke at the left, in the middle height
      part: the leftmost island
    - where: a long stroke down the left side, starting at the top, slanting a little and curving out to the bottom left
      part: the left stream, bending away at the bottom
    - where: a short dot between the left and middle streams, slanting down to the right
      part: the middle island
    - where: a straight stroke down the middle, from the top to well above the bottom
      part: the middle stream
    - where: a short stroke between the middle and right streams, slanting down to the right
      part: the right island
    - where: a long straight stroke down the right side, from the top to the bottom
      part: the right stream

負:
  object: a person bent under a load of cowrie money, carried on the back
  history: 'An ideogram: a person bending forward with a load of money 貝 on the back, to bear a burden.'
  layout: >-
    A person bends forward at the top, drawn with a friendly face (eyes, nose and mouth), simple pale
    clothes and a pale hat, and carries a big cowrie shell on the back, which fills the lower two
    thirds. The shell stands on two short feet. The shell is pale pink, the clothes pale blue.
  exact:
    - The person's two strokes lie in the top third and touch each other; the second starts at the middle of the first.
    - The person's second stroke ends on the shell's top-and-right stroke where it begins.
    - The shell's left side is a vertical stroke that ends on the base line.
    - The shell's two inner lines are about as long as each other, and they lie parallel, rising slightly to the right.
    - The base line is clearly shorter than the shell's top-and-right stroke, a little under half as long, and its right end meets the right side near the bottom; the two inner lines are a little shorter than the base line.
    - The two feet float free of the shell and of each other, the left foot longer than the right.
  strokes:
    - where: a stroke from the top centre, down, then turning down to the left
      part: the person's head and bent back
    - where: a line from the middle of the back across to the right, then turning down to the left
      part: the person's arm, holding the load
    - where: a short vertical stroke down the left side of the shell
      part: the left side of the shell
    - where: a line across the top of the shell, rising slightly to the right, turning down at the right to run to near the bottom
      part: the shell's rounded top and right side
    - where: a short line across inside the shell, upper, rising slightly to the right
      part: the upper tooth of the shell's opening
    - where: a short line across inside the shell, below the upper one, rising slightly to the right
      part: the lower tooth of the shell's opening
    - where: a line across the bottom of the shell, from the end of the left side to the right side
      part: the shell's lower lip
    - where: a stroke below the shell's lip at the left, sweeping down to the left
      part: the shell's left foot
    - where: a stroke below the shell's lip at the right, slanting down to the right
      part: the shell's right foot

负:
  object: a person bent under a load of cowrie money, carried on the back
  history: 'An ideogram: a person bending forward with a load of money 贝 on the back, to bear a burden.'
  layout: >-
    A person bends forward at the top, drawn with a friendly face (eyes, nose and mouth), simple pale
