    - where: a short line across near the top, rising slightly to the right
      part: the spindle's top cap
    - where: a short stroke at the upper left of the middle, slanting down to the right
      part: the bundle's left side
    - where: a line across the upper middle, rising slightly to the right, turning down at its right end
      part: the bundle's top and right side
    - where: a short line across inside the bundle, rising slightly to the right
      part: a turn of thread inside the bundle
    - where: a short line across at the bottom of the bundle, rising slightly to the right
      part: the bundle's bottom
    - where: a vertical line from the top wall down to the middle of the yard
      part: the spindle's shaft
    - where: a line across below the bundle, rising slightly to the right
      part: the spindle's whorl
    - where: a small dot at the right end of the whorl, slanting down to the right
