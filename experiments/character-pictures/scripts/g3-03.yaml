  history: >-
    The oldest forms drew two divining rods or carpenter's squares crossed at right angles. In the
    modern form, the vertical rod with its top and bottom bars stands in the centre, while the side
    arms have become two people flanking the shaft.
  layout: >-
    The central divining rod fills the height of the frame, with a short crossbar at the top, a
    straight shaft down the middle, and a wide base across the bottom. Two shamans stand in the open
