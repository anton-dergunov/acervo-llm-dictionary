  object: a battle-axe with an ornate inner mount above a human heart with its vessels rising from the top
  history: >-
    戚 originally drew a notched battle-axe made of an axe frame 戊 and an inner component 尗, and was
    later borrowed to mean a relative or grief. Adding the heart 心 beneath it formed 慼, a heart in
    mourning.
  layout: >-
    The upper two thirds hold the battle-axe 戚: its broad curved blade sweeps down on the left, its
    long shaft runs from the top centre down to the middle right, and its notched inner mount sits
    tucked beneath the top crossbar between the blade and the shaft, tinted in pale bronze and soft
    wood tones. The lower third holds the simple human heart 心 centered beneath the axe, shaded in
    pale rose with its vessels at the top.
  exact:
    - The top crossbar starts at the top of the left blade sweep, and the long shaft crosses the middle of the top crossbar.
    - The short upper vertical of the inner mount does not touch the top crossbar above it; a short rising stroke starts from the middle of this vertical, and the vertical's bottom touches the middle of the shorter inner bar.
    - The inner horizontal bar is clearly shorter than the top crossbar, a little over half as long, and stops short of the left blade sweep without touching it.
    - The lower vertical starts at the middle of the inner bar where the upper vertical ends, runs nearly twice as long as the upper vertical, and ends in a hook to the left.
    - Below the inner bar, the left dot stands free without touching the inner bar or the hooked vertical, whereas the right dot starts on the middle of the hooked vertical.
    - On the right side of the axe, the long shaft ends in a sharp hook up at the middle right and is crossed at its middle by the right-side sweep, while the top-right dot stands free above the top crossbar.
    - The four strokes of the heart at the bottom stand completely free of one another and of the axe above, with the long bottom curve ending in a hook up to the left.
