  object: a crack on a flat oracle bone, with a long vertical split and a shorter side split to the right
  history: >-
    The oldest forms directly traced the vertical fissure and side branch that appeared on an ox
    shoulder blade or turtle shell when heated during ancient divination.
  layout: >-
    A broad, flat piece of pale cream-coloured oracle bone or turtle plastron sits upright in the
    centre of the square behind the strokes, with soft tan shading along its weathered edges. The
    two strokes lie across its smooth face as the divination cracks themselves.
  exact:
    - The long vertical line runs straight down just left of the centre from near the top to near the bottom, ending in a plain point with no hook.
    - The shorter stroke sits on the right, slanting down to the right from just above the middle.
    - The two strokes do not touch each other; a small gap separates the middle of the vertical line from the start of the right-hand stroke.
  strokes:
    - where: a long straight line down the middle, slightly left of centre, from near the top to near the bottom
      part: the main vertical crack in the oracle bone
    - where: a short stroke on the right, slanting down to the right from just above the middle
      part: the side crack on the right of the oracle bone

