    - The top line across is about half as long as the wide bottom line across.
    - The central vertical line starts at the middle of the top line across and ends on the middle of the bottom line across, without crossing either line.
    - In each of the two flanking figures, the short right-slanting leg starts from the middle of the longer left-sweeping stroke.
    - Neither of the two flanking figures touches the central vertical shaft, the top line across, or the bottom line across.
    - The right figure sits slightly higher than the left figure.
  strokes:
