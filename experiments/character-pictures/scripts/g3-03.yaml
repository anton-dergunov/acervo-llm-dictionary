  history: >-
    The right side 桼 was the original character for lacquer sap, drawing a tree 木 at the top with
    resin 氺 dripping from chevron-shaped cuts 人 in its trunk. The water component 氵 was later added
    on the left to show the liquid varnish.
  layout: >-
    On the left, three pale amber drops and splashes of liquid sap follow the three water strokes.
    On the right, a lacquer tree has a pale green leafy crown at the top around the upper tree
    strokes, a wide chevron cut across the middle of its pale brown trunk, and streams and droplets
    of pale golden resin trickling down the bottom around the lower central stream and its four side
    drops.
  exact:
    - The three water strokes on the left stand free of one another and do not touch the right half.
    - In the small tree at the top of the right half, the vertical trunk crosses the line across and ends in a plain point at the bottom, with no hook.
    - The upper left sweep starts where the upper trunk and branch cross, and is about two thirds as long as the wide middle sweep below it.
    - The short upper right stroke of the tree is a detached slanting stroke to the right of the trunk, not a full sweep from the crossing.
    - Just below the upper trunk, with a tiny gap between them, the wide middle left sweep and right-falling stroke meet at their tops and spread out over the bottom part.
    - At the bottom of the right half, the central vertical ends in a hook to the left and stands free of the chevron above it and of the four short side strokes around it.
    - On the left of the lower vertical lie a small downward dot above a short rising stroke, and on its right lie a short inward dot above a short outward falling stroke; none of them touch one another or the vertical.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: a high droplet of liquid sap on the left
    - where: a short dot at the middle left, slanting down to the right
      part: a middle droplet of liquid sap on the left
    - where: a rising stroke at the bottom left, slanting up and to the right
      part: a splash of liquid sap rising on the left
    - where: a line across the upper part of the right half, rising slightly to the right
      part: the main horizontal branch of the lacquer tree's crown
    - where: a short vertical line down the upper centre of the right half, ending in a plain point
      part: the upper trunk of the lacquer tree
    - where: a sweep from the crossing of the upper branch and trunk down to the left
      part: the left lower bough of the crown
    - where: a short stroke to the right of the upper trunk, slanting down to the right
      part: the shorter right bough of the crown
    - where: a long sweep from just below the upper trunk down and out to the lower left
      part: the left slash of the chevron cut in the bark
    - where: a long falling stroke from the top of the middle sweep down and out to the middle right
      part: the right slash of the chevron cut in the bark
    - where: a vertical line down the lower centre of the right half, ending in a hook to the left
      part: the main trickle of resin running down the trunk and curling at the bottom
    - where: a small dot to the left of the lower vertical, slanting down to the right
      part: an upper left bead of resin dripping from the cut
    - where: a short rising stroke below the left dot, slanting up toward the lower vertical
      part: a lower left splash of resin
    - where: a short dot to the right of the lower vertical, slanting down to the left
      part: an upper right bead of resin dripping toward the centre
    - where: a short stroke below the right dot, slanting down to the lower right
      part: a lower right trickle of resin

鸣:
  checked: argon
  object: a bird standing on the right and calling out, with a wide-open mouth on the left
  history: >-
    An ideogrammic compound combining a mouth on the left with a bird on the right to show a bird
    calling out. The simplified form replaces the traditional bird with its simplified five-stroke
    form.
  layout: >-
    A tall bird in profile faces left toward a smaller wide-open mouth floating at middle-left. The
    bird has soft pale plumage, a small beak pointing left toward the mouth, and folded wings
    painted in pale warm tones behind the strokes, while the open mouth has pale pink lips.
  exact:
    - The small mouth sits in the middle-left and does not touch the tall bird on the right.
    - In the mouth, the upper stroke runs across and turns down to form the right side, while the bottom line closes the box from the left vertical to the right side.
    - At the top of the bird, the short top sweep meets both the start of the head stroke and the start of the long body stroke.
    - The bird's head stroke runs across to the right, turns down, and ends in a hook to the left.
    - The short eye dot sits free inside the bird's head space without touching the surrounding strokes.
    - The bird's long body stroke runs straight down the centre, turns across to the right, turns down along the far right side, and ends at the bottom in a hook to the left.
    - The long bottom line across starts beneath the mouth on the lower left and extends under the bird's body, standing completely free of every other stroke.
  strokes:
    - where: a short line down on the middle left
      part: the left corner and left side of the open lips
    - where: a line across from the top of the left vertical, rising slightly to the right and turning down on the right side of the mouth
      part: the upper lip, curving down into the right corner of the mouth
    - where: a short line across the bottom of the mouth on the middle left, rising slightly to the right
      part: the lower lip
    - where: a short sweep at the top centre, slanting down to the left
      part: the crest at the top of the bird's head
    - where: a stroke from the end of the top sweep across to the right, turning down and ending in a small hook to the left
      part: the top and back of the bird's head
    - where: a short dot inside the upper head space, slanting down to the right
      part: the bird's eye
    - where: a long stroke from the upper left of the head straight down to the middle, turning across to the right, then turning down on the right side and ending at the bottom in a hook to the left
      part: the bird's throat, breast, back and dangling tail
    - where: a long line across the lower part, from below the mouth on the bottom left into the open space beneath the bird's body
      part: the bird's feet beneath its body
