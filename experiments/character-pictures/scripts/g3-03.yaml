    stick, inspiring fear and awe. In the modern form the head became the square field shape at the
    top, the middle stroke spans across like the stick, and the lower strokes form the body and
    legs.
  layout: >-
    A single standing ghost fills the square from top to bottom, facing the viewer. The upper square
