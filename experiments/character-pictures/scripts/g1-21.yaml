    - where: a short dot on the left, slanting down to the right
      part: a leaf cluster on the left of the crown
    - where: a short stroke below the crown's top edge, slanting down to the left
      part: a leaf cluster hanging in the middle of the crown
    - where: a long line across the middle of the left half, rising a little to the right
      part: the upper bough
    - where: a line across below it, rising a little to the right
      part: the lower bough
    - where: a stroke from the upper bough down, ending in a hook up to the left
      part: the trunk
    - where: a short stroke on the left of the trunk, slanting down to the left
      part: the short left root
    - where: a short dot beside the trunk, slanting down to the right
      part: the knot where the axe has bitten in
    - where: a short stroke at the top right, slanting down to the left
      part: the axe blade's upper edge
    - where: a long stroke down the left of the axe, slanting to the left
      part: the axe blade's cutting edge
    - where: a line across the right half, rising a little to the right
      part: the axe head
    - where: a long straight line down from the middle of the axe head to the bottom
      part: the axe handle

業:
  object: a wooden bell rack, a musical instrument
  history: >-
    An ideogram: a musical instrument 业 hung on a wooden stand 木, a craft or business.
  layout: >-
    A broad wooden bell rack fills the picture. Its long top beam runs across the upper part with two
    tall posts rising from it, and ornaments at the posts' sides; below the beam hang a small chime
    and a cord down to a crossbar, and the rack stands on a wooden tree-like post with two short
    bars and spreading feet. Pale wood, pale bronze bells.
  exact:
    - The two posts are separate verticals that end on the long beam.
    - The two ornaments stand free of the posts, with small gaps.
    - The long beam is the longest line across; the crossbar below is about half as long.
    - The small chime dot stands free, with a small gap from the beam and the crossbar.
    - The cord starts on the beam and ends on the crossbar.
    - The wooden post's upper bar is a little over half as long as its lower bar; the post crosses both bars and starts on the crossbar.
    - The post is a straight vertical ending in a plain point, with no hook.
    - The two feet both start where the post crosses the lower bar and do not touch each other.
  strokes:
    - where: a short line down on the left, rising from the beam
      part: the left post of the rack
    - where: a line from the top down, slanting a little to the right and then straight down, to the beam
      part: the right post of the rack
    - where: a short dot at the upper left, slanting down to the right
      part: a left ornament on the posts
    - where: a short stroke at the upper right, slanting down to the left
      part: a right ornament on the posts
    - where: a long line across, wider than anything else
      part: the long top beam
    - where: a small dot under the beam on the left, slanting down to the right
      part: a small chime hanging free
    - where: a short stroke from the beam down to the right, then down to the left
      part: the cord hanging from the beam
    - where: a line across below, rising a little to the right
      part: the crossbar that the cord ends on
    - where: a short line across the wooden stand, rising a little to the right
      part: the upper bar of the stand
    - where: a longer line across below it
      part: the lower bar of the stand
    - where: a long straight line down the middle, from the crossbar to the bottom
      part: the stand's post
    - where: a sweep from the centre of the post down and out to the bottom left
      part: the left foot of the stand
    - where: a sweep from the centre of the post down and out to the bottom right, turning across at the end
      part: the right foot of the stand

解:
  object: cutting the horns off an ox with a knife
  history: >-
    An ideogram: a knife 刀 cuts the horns 角 off an ox 牛, so it is to loosen and take apart. The horn also gives the sound.
  layout: >-
    A large cut ox horn lies standing on the left half, point up, with rings across it. On the
    right half a knife with a curved back hangs above the head of an ox that faces us, with two
    horns, a broad shoulder and a long face and body down to the bottom. Pale bone horn, pale grey
    knife, pale brown ox.
  exact:
    - The curl starts on the tip stroke; the right side starts where the left side starts; the centre line starts where the curl ends.
    - The two rings across the horn cross the horn's centre line and stand apart from the horn's sides.
    - The knife does not touch the ox; a small gap separates the knife's end from the ox's long line.
    - The ox's long face line is the longest vertical stroke on the right; the broad shoulder line is the longest line across.
    - The ox's brow line is about three fifths as long as the shoulders.
    - The brow line starts on the ox's left horn.
  strokes:
