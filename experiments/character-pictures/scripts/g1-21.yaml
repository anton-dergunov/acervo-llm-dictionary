裁:
  object: a dagger-axe cutting a robe
  history: >-
    An ideogram: a dagger-axe 戈 cutting cloth 衣, so it is to cut and trim.
  layout: >-
    A pale robe, hanging open and seen from the front, fills the lower left. A small cross-shaped
    tailor's pin stands above the robe at the upper left. A tall dagger-axe fills the right side
    from top to bottom with its shaft curving at the foot, its cross blade high up and its point at
    the top right, cutting toward the robe. Pale cream cloth, pale grey steel.
  exact:
    - The long line across the top of the left half crosses the dagger-axe's shaft.
    - The tailor's pin is a plain cross, its line across crossing the vertical, and the vertical's foot touches the long blade line.
    - The robe's dot touches nothing; a small gap separates it from the long blade line.
    - The robe's collar dot ends on the robe's shoulder line; the robe's left lapel starts on the shoulder line.
    - The inner panel's hem turns up at its foot, and the small fold stroke ends on the right lapel.
    - The point at the top right stands free of every other stroke.
    - The dagger-axe's shaft starts at the top, is the longest stroke, runs down, bends to the right and ends turning up.
  strokes:
    - where: a short line across the upper left, rising a little to the right
      part: the tailor's pin, its arms
    - where: a short stroke from above, slanting down to the right and then straight down, crossing the line across
      part: the tailor's pin, its upright
    - where: a long line across the middle of the picture, rising a little to the right
      part: the dagger-axe's blade, cutting out to both sides
    - where: a short dot below the long line, slanting down to the right
      part: the collar of the robe
    - where: a line across the upper part of the robe, rising a little to the right
      part: the shoulders and sleeves of the robe
    - where: a sweep from the middle of the shoulder line down to the lower left
      part: the left lapel, crossing the chest
    - where: a short line down left of the robe's centre, flicking up to the right at its foot
      part: the inner panel's edge, its hem turning up
    - where: a short dot at the right of the robe, slanting down to the left
      part: the fold of the right lapel
    - where: a short stroke from the middle of the robe down to the right
      part: the right lapel, sweeping out to the hem
    - where: a long stroke from the top centre down the right side, curving to the right and ending turning up
      part: the shaft of the dagger-axe
    - where: a sweep from the right of the blade down to the lower left, crossing the shaft
      part: the curved cutting edge, sweeping down toward the robe
    - where: a short stroke at the top, slanting down to the right
      part: the point of the dagger-axe

惑:
  object: a heart troubled by doubt, with a dagger-axe guarding a walled plot beside it
  history: >-
    An ideogram: an uncertain region 或, guarded by a dagger-axe over a walled plot, above a
    heart 心. The 或 also gives the sound.
  layout: >-
    At the top, a tall dagger-axe leans across the picture with a cross blade high up; beside its
    shaft sits a small walled plot with a ground line under it. At the bottom, a simple pale heart
    fills the lower half with its vessels rising from the top. Pale red heart, pale straw plot.
  exact:
    - The walled plot is small and closed, its left wall and its top-right wall starting together and the rising stroke below joining their ends.
    - The plot's ground line stands apart from the plot, with a small gap.
    - The ground line is long and rises to the right; the plot's lower rising stroke is shorter.
    - The dagger-axe's shaft crosses the cross blade and the sweep crosses the shaft; the dot at the top stands free.
    - The heart's left edge, body, and two vessels all stand free of each other and of the dagger-axe.
    - The heart's right vessel stays clear of the shaft, with a small gap.
  strokes:
    - where: a long line across the top, rising a little to the right
      part: the dagger-axe's cross blade
    - where: a short stroke on the left of the plot, slanting down to the right
      part: the plot's left wall
    - where: a line across from the top of the left wall, rising a little to the right and turning down
      part: the plot's top and right wall
    - where: a short stroke rising to the right, below the plot's walls
      part: the plot's gate sill
    - where: a long line across at the middle left, rising to the right, under the plot
      part: the ground line under the plot
    - where: a long stroke from the top centre down, curving to the right and ending in a hook up
      part: the dagger-axe's shaft
    - where: a sweep from the upper right down to the lower left, crossing the shaft
      part: the dagger-axe's curved edge
    - where: a short stroke at the top right, slanting down to the right
      part: the dagger-axe's point
    - where: a short line down at the lower left
      part: the heart's left edge
    - where: a long curve from the left of centre down and along the bottom to the right, turning up and ending in a small hook to the left
      part: the rounded lower body of the heart, its tip turning in at the right
    - where: a short dot near the top centre, slanting down to the right
      part: a vessel rising from the top of the heart
    - where: a short dot at the upper right, slanting down to the right
      part: a second vessel at the heart's upper right

善:
  object: a ram's head served as food above a table, and below it a mouth in speech
  history: >-
    An ideogram: food 羊 and talk 口 shared across a table, a good thing to give.
  layout: >-
    A small ram's head seen from the front fills the upper middle. A broad table runs across the
    middle of the picture, wider than the head, with two small dishes standing just above it. Below
    the table is a friendly open mouth with lips, speaking. Pale cream wool, pale wood, soft pink lips.
  exact:
    - The ram's two horns are short strokes that stand free of the brow line; small gaps separate them.
    - The face line starts on the brow line and runs down through the eye line and the ear line to the table.
    - The ear line is the longest line across the head; the eye line is the shortest.
    - The table is much wider than the head, about twice as wide as the ear line.
    - The left dish floats just above the table with a small gap; the right dish rests on the table.
    - The mouth's left side and its top line start together; the left side's foot meets the start of the bottom line, and the top line's hooked end meets the end of the bottom line.
    - The mouth's top line ends in a small hook down to the left.
  strokes:
    - where: a short dot at the top left, slanting down to the right
      part: the ram's left horn
    - where: a short stroke at the top right, slanting down to the left
      part: the ram's right horn
    - where: a line across below the horns
      part: the brow, across the top of the face
    - where: a shorter line across the middle of the head
      part: the eyes, as one line across the face
    - where: a longer line across below the middle, wider than the others
      part: the ears, sticking out to both sides
    - where: a long straight line down the centre, from the brow to the table
      part: the long face and nose, down to the chin
    - where: a short dot on the left above the table, slanting down to the right
      part: a dish of food on the left
    - where: a short stroke on the right above the table, slanting down to the left
      part: a dish of food on the right
    - where: a very long line across the middle of the picture
      part: the table
    - where: a short line down at the lower left, slanting a little to the right
      part: the mouth's left lip corner
    - where: a line across from the top of the mouth, ending in a small hook down to the left
      part: the mouth's upper lip and right corner
    - where: a line across the bottom of the mouth, rising a little to the right
      part: the mouth's lower lip

奥:
  object: a person discovering a house full of rice
  history: >-
    An ideogram: a person 大 discovers a house 宀 full of rice 米, a secret hidden place.
  layout: >-
    A small house with a peaked roof fills the upper middle, its roof knob on top; its door is open
    to show a rice plant with grains inside. A friendly person with a face (eyes, nose, mouth) and
    simple pale clothes stands below, facing us with arms stretched out wide and legs apart, head
    tilted up toward the house. Pale straw rice, pale wood house.
  exact:
    - The roof knob on top ends on the start of the roof line; the left wall starts where the roof starts.
    - The right wall is the longer one and ends just above the person's arms with a small gap.
    - The left wall ends a little above the person's arms, a small gap separating it from the lowest rice stroke.
    - The rice plant's two top grains stand free, each with a small gap from the leaf line.
    - The rice plant's leaf line crosses the stalk; the left leaf starts where the leaf line crosses the stalk.
    - The rice plant's stalk ends with a gap above the person's body stroke.
    - The person's arm line is the longest line in the picture and is crossed by the body stroke; the right leg starts where they cross.
    - The rice stays inside the house and touches no wall.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right and turning back down to the left
      part: the knob on top of the roof
    - where: a line down on the left from the roof
      part: the house's left wall
    - where: a line across the top, turning down at the right
      part: the roof and the right wall
    - where: a short dot inside the house at the upper left, slanting down to the right
      part: a grain of rice at the upper left
    - where: a short dot inside the house at the upper right, slanting down to the left
      part: a grain of rice at the upper right
    - where: a short line across inside the house, rising a little to the right
      part: the rice plant's leaves
    - where: a vertical line down the middle of the house
      part: the rice plant's stalk
    - where: a short stroke from the stalk down to the left
      part: the rice plant's lower left leaf
    - where: a short dot at the lower right of the stalk, slanting down to the right
      part: the rice plant's lower grain
    - where: a long straight line across the picture, from near the left edge to near the right
      part: both arms, stretched out wide
    - where: a long stroke from the top centre sloping down to the right, straight down through the centre, then curving to the bottom left
      part: the neck and body, running down into the left leg
    - where: a long stroke from the middle of the arm line down and out to the bottom right, ending turning across
