感:
  object: a heart stirred by a call, with a dagger-axe and a speaking mouth above it
  history: >-
    An ideogram: all 咸 hearts 心 beating together, a feeling stirred in the heart.
  layout: >-
    A simple pale heart fills the lower part. Above it, a dagger-axe leans across the upper right,
    a pale curved sweep hangs at its left, and a small open mouth with lips, calling, sits in the
    middle of the left. Pale arcs around the heart show its beat. Pale red heart, pale grey steel.
  exact:
    - The long line across the top crosses the dagger-axe's shaft, and the left sweep starts at its start.
    - The mouth's bar is above the mouth and stands free, with a small gap.
    - The mouth's left side and the lips' top start together; the left side and the bottom line meet; the lips' top line and the bottom line end together.
    - The mouth's left side and the left sweep are apart by a small gap.
    - The dagger-axe's shaft is the longest stroke; the sweep crosses it.
    - The heart's left edge, body and two vessel dots all stand free of each other and of the mouth.
  strokes:
