    - where: a short stroke below the knife, slanting down to the left
      part: the ox's left horn
    - where: a short line across below the first, rising a little to the right
      part: the ox's brow and right horn
    - where: a long line across below, from near the left to near the right
      part: the ox's broad shoulders
    - where: a long straight line down the middle, from the knife's end to the bottom
      part: the ox's long face and body, down to the ground

葉:
  object: a tree with broad flat leaves
  history: >-
    An ideogram: a plant 艹 with thin flat leaves 枼, so it is a leaf; the lower part also gives the sound.
