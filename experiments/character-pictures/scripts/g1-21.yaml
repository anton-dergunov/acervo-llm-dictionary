    - where: a line from the middle of the forearm down, ending in a small hook to the left
      part: the hanging hand
    - where: a short dot at the lower left, slanting down to the right
      part: the pulse point at the wrist

童:
  object: a child standing on the ground above a village's field
  history: >-
    An ideogram: a child standing 立 in a village 里.
  layout: >-
    A small friendly child with a round face (eyes, nose, mouth) and simple pale clothes stands on
    a long ground line at the top, arms stretched out, facing us. Below, the village fills the
    bottom half: a divided field with a footpath running down through it and a mound of earth
    beneath. Pale green field, pale earth, pale blue sky.
  exact:
    - The topknot dot stands free of the arm line, with a small gap.
    - The arm line is shorter than half the ground line; the ground line is the longest line of the child.
    - The child's left leg dot stands free of the ground line, with a small gap.
    - The child's body stroke starts on the arm line and its foot touches the ground line.
    - The field's left side and its top line start together; the field's bottom line ends where the top line ends.
    - The footpath is the longest vertical stroke, crosses the two inner field lines and the mound's bar, and ends on the earth's base line.
    - The earth's base line is the longest line of the village, wider than the field.
  strokes:
    - where: a short stroke at the top centre, slanting down to the right
