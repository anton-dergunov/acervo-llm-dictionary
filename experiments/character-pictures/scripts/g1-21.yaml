    - where: a stroke from the left of the bough down, then turning across to the right
      part: the broad leaf's curved edge
    - where: a long line across below the leaves, rising a little to the right
      part: the tree's lower branches
    - where: a long straight line down the middle, to the bottom
      part: the trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the root, spreading left
    - where: a sweep from the centre of the trunk down and out to the bottom right, turning across at the end
      part: the root, spreading right

號:
  object: a tiger roaring
  history: >-
    An ideogram: the roar 口 of the tiger 虎, a loud call.
  layout: >-
    A tiger fills the right side, facing left, its head high, roaring toward the left. At the upper
    left is the wide open mouth of the roar, and under it ripples of sound roll away. The tiger has
    friendly eyes and pale stripes. Pale orange, pale cream.
  exact:
    - The mouth's left side and its top line start together; the bottom lip joins the foot of the left side and the end of the top line.
    - The ripple's first line is about two thirds the length of the tiger's head line.
    - The ripple's curved line starts on the first line, turns across and then down, ending in a hook up to the left.
    - The tiger's head line across is the longest line across; its hook points down to the left.
    - The tiger's long left sweep is the longest vertical stroke; it stands apart from the ripples by a small gap.
    - The stripe across the face crosses the face stroke.
    - The tiger's two legs stand free of every other stroke; the right leg is the longer.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: the left side of the open mouth
    - where: a line across the top, rising a little, turning down to the right
      part: the mouth's top lip and right corner
    - where: a short line across the bottom of the mouth, rising a little to the right
      part: the mouth's lower lip
    - where: a line across below the mouth, rising a little to the right
      part: the first ripple of sound
    - where: a stroke from the middle of the first ripple, down, then across to the right, then down, ending in a hook up to the left
      part: the curving ripples of the roar
    - where: a short stroke at the top, slanting down to the right and then down
      part: the tiger's forehead stripe
    - where: a short line across at the top right, rising a little to the right
      part: the tiger's second forehead stripe
    - where: a long line across the head, rising a little to the right, ending in a hook down to the left
      part: the tiger's brow and ear
    - where: a long stroke from the left of the head down, curving to the bottom left
      part: the tiger's open jaw and chest, running down to its front leg
    - where: a short line across, rising a little to the right
      part: a stripe across the face
    - where: a stroke from the head line down and turning across to the right, ending in a hook up
      part: the tiger's back and haunch
    - where: a stroke from the lower middle down to the left
      part: the tiger's front leg
    - where: a long stroke from the right of the lower middle, going down and turning across to the right, ending in a hook up
      part: the tiger's hind leg and paw

幹:
  object: a person with a club in the sunlight, for dry and to invade
  history: >-
    The oldest forms drew a forked club. The modern form joined sunlight 龺, which suggests dry, to a club 干 with a person 人 above.
  layout: >-
    On the left, a small round sun with a bright band across it hangs between two bright crossed
    glints, one above and one below, shining on dry land. On the right, a person with a face (eyes,
    nose, mouth) and simple pale clothes leans over a wooden club planted upright with a crossbar,
    gripping its top. Pale gold sun, pale wood club.
  exact:
    - The upper glint's line across is longer than its vertical; the glint's vertical crosses it.
    - The sun's left side and its top-right turn start together; the sun's inner bar starts on its left side; the sun's bottom line and top-right turn end together.
    - The lower glint's line across is longer than the upper glint's; its vertical crosses it.
    - The lower glint's vertical starts on the sun's bottom line and is longer than the upper glint's.
    - The person is above the club; the person's right-leg stroke is longer than the left-leg stroke and ends turning across.
    - The club's top bar is a little over half as long as the lower bar, and the club's post starts on the top bar and crosses the lower bar.
    - The club's post is a straight vertical, the longest vertical stroke, ending in a plain point.
    - The person's left leg ends just above the club's top bar with a small gap.
  strokes:
    - where: a line across the top of the left half, rising a little to the right
      part: the upper glint's horizontal ray
    - where: a stroke from above, crossing the line across, down and then down
      part: the upper glint's vertical ray
    - where: a short line down on the left of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, rising a little to the right, turning down at the right
      part: the sun's top and right rim
    - where: a short line across the middle of the sun, rising a little to the right
      part: the bright band of light across the sun
    - where: a short line at the bottom of the sun, rising to the right
      part: the sun's bottom rim
    - where: a longer line across below the sun, rising a little to the right
      part: the lower glint's horizontal ray
    - where: a straight line down from the sun's bottom, crossing the lower line
      part: the lower glint's vertical ray
    - where: a long stroke from the top centre of the right half, down and out to the lower left
      part: the person's body, running down into the left leg
    - where: a stroke from the middle of the body down to the right, turning across to the right
      part: the person's right leg
    - where: a short line across below the person, rising a little to the right
      part: the club's top bar
    - where: a long line across below it
      part: the club's lower bar
    - where: a long straight line down the middle of the club
      part: the club's post

準:
  object: a spirit level balanced on a post, with water in it and a small bird perched on top
  history: >-
    An ideogram: a level 十 balanced against water 氵; the bird 隹 gives the sound.
  layout: >-
    At the bottom, a long level bar rests across the top of a post. At the upper left a small clear
    trickle of water shows in the level. At the upper right a small bird, seen from the side facing
    left, perches on the post above the bar. Pale blue water, pale wood, pale grey bird.
  exact:
    - The level bar is the longest line and the post crosses it.
    - The post starts at the bird's foot, runs down through the level bar, and is a straight vertical with a plain foot and no hook.
    - The bird's feet line is the longest line of the bird, wider than the body.
    - The bird's three body lines are about the same length; the right vertical starts on the head line, crosses the other two and ends on the feet line.
    - The two water drops and the rising water line stand free of every other stroke.
    - The body line starts on the tail stroke and ends where the post starts; the feet line starts on the body line.
    - The bird is small compared with the level.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: a first drop of water
    - where: a short dot at the left, slanting down to the right
      part: a second drop of water
    - where: a line rising to the right from the lower left
      part: the water line, rising in the level
    - where: a stroke at the top centre, slanting down to the left
      part: the bird's tail
    - where: a vertical line down from the tail to near the middle
      part: the bird's body line, ending on the post
    - where: a short dot at the top right, slanting down to the right
      part: the bird's eye
    - where: a short line across at the upper right, rising a little to the right
      part: the bird's head
    - where: a short line across below it, rising a little to the right
      part: the bird's back
    - where: a short line across below it, rising a little to the right
      part: the bird's breast
    - where: a short vertical on the right, from the head down, crossing the lines
      part: the bird's wing, folded
    - where: a line across below, rising a little to the right, wider than the bird's body
      part: the bird's feet line, the perch
    - where: a very long line across the picture, near the bottom
      part: the long level bar
    - where: a long stroke from the middle of the bird's feet line down, slanting a little to the right and then straight down
      part: the post that holds the level
