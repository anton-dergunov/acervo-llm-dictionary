      part: the left side of the horn, widening to its base
    - where: a line across the top of the box, turning down to run down the right side, ending in a hook to the left
      part: the right side of the horn, curling in at its base
    - where: a short line across in the middle of the horn, rising a little to the right
      part: a ring across the horn
    - where: a short line across lower down on the horn, rising a little to the right
      part: a second ring across the horn
    - where: a straight line down the middle of the horn
      part: the grain running down the middle of the horn
    - where: a line across at the top of the right half, rising a little, turning down and ending in a hook to the left
      part: the back of the knife and its point
    - where: a short stroke from the middle of the back, down and then down to the left
