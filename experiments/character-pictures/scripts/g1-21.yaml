# Full run, group g1, batch 21. Written from the fact sheets, following scripts/GUIDE.md.

散:
  object: a hand tossing seeds out of a tall basket
  history: >-
    An ideogram: a hand holding a stick (攵) scatters seeds from a woven basket, so the seeds
    spread apart.
  layout: >-
    The tall woven basket fills the left side, from its rim at the top to its base at the bottom,
    standing on the ground. The hand and forearm fill the right side, reaching in from the top and
    swinging out to the lower right, palm up. Pale seeds fly in the air around the hand, behind
    the strokes. Soft straw and pale green colours.
  exact:
    - The basket's top rim is shorter than the broad band below it, about three quarters as long.
    - The two short posts cross the top rim and come down to touch the broad band below it.
    - The two small seeds inside the lower basket start on the basket's left edge and do not touch the basket's curved side.
    - The lower basket's curved side starts where its left edge starts, runs across and turns down, ending in a small hook up to the left.
    - The hand does not touch the basket; a small gap separates them.
    - The hand's long sweep to the lower right is the longest stroke of the hand and crosses the lower finger stroke.
    - The rising palm stroke starts on the forearm stroke, and the finger stroke starts on the palm stroke.
  strokes:
    - where: a short line across the upper left, rising a little to the right
      part: the basket's top rim
    - where: a line down the left of the rim, crossing it
      part: the basket's left post
    - where: a line starting with a small slant to the right and then straight down, crossing the rim near its middle
      part: the basket's right post
    - where: a broad line across below the rim, rising a little to the right, longer than the rim, touching the feet of both posts
      part: the basket's broad middle band
    - where: a line down the left of the lower half, below the band
      part: the lower basket's left edge
    - where: a line across from the top of the left edge, turning down on the right and ending in a small hook up to the left
      part: the lower basket's top rim and curved right side
    - where: a short dot-like stroke inside the lower basket, rising a little to the right
      part: an upper seed seen through the weave
    - where: a short dot-like stroke inside the lower basket, below the other, rising a little to the right
      part: a lower seed seen through the weave
    - where: a line from the top of the right half down to the lower left, ending in a bend to the left
      part: the forearm, reaching down toward the basket
    - where: a line from the middle of the forearm rising to the right
      part: the open palm, held up to toss
    - where: a stroke from the right end of the palm, slanting down to the right, then straight down, then down to the left
      part: the fingers, curling down below the palm
    - where: a long stroke from the centre of the right half sweeping down to the right, turning across at the end
      part: the swing of the arm, flinging the seeds to the right

税:
  object: a person bringing a stalk of grain's yield to be paid as tribute, standing beside the grain
  history: >-
    An ideogram: grain 禾 paid over by a person 兑. The right part also gives the sound.
  layout: >-
    The tall stalk of grain stands on the left side, narrower than the right part. On the right, a
    kind person with a round face (eyes, nose and a mouth) in simple pale clothes faces left toward the
    grain and holds out two small grains above the head as the tribute. Pale golden grain and
    soft pale clothes.
  exact:
    - The stalk is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The line across crosses the stalk, and the stalk touches the short slanting ear at the top.
    - The two lower sweeps of the grain both start on the stalk; the left sweep starts on the line across and the short right stroke starts on the stalk below it.
    - The two grains above the head do not touch the head.
    - The head's left line and its top line start together; the chin line starts where the left line ends, and the end of the top-right turn touches the middle of the chin line.
    - The body stroke starts on the chin line.
    - The right leg is the longer stroke and ends in a hook up; the left leg is short and stands free.
    - The grain is narrower than the person and about as tall as the person.
  strokes:
    - where: a short stroke at the top, slanting down from right to left
      part: the ear of grain, drooping over to the left
    - where: a line across, a little above the middle of the left part, rising a little to the right
      part: the leaves, spreading to both sides
    - where: a long straight line down the middle of the left part
      part: the stalk
    - where: a sweep from the stalk down and out to the bottom left
      part: the root, spreading to the left
    - where: a short stroke from the stalk down to the right
      part: the short root, on the right
    - where: a short stroke at the top of the right part, slanting down to the right
      part: a first grain held up above the head
    - where: a stroke at the top right, slanting down to the left
      part: a second grain held up above the head
    - where: a short line down on the left side of the head
      part: the left side of the head
    - where: a line across the top of the head, turning down at the right to run down the right side
      part: the top and right side of the head
    - where: a short line across in the lower middle of the head, rising a little to the right
      part: the chin line, under the face
    - where: a sweep from the chin down to the lower left
      part: the person's left leg, kneeling
    - where: a long stroke from the body down, turning to run across to the right and ending in a small hook up
      part: the person's body and right leg, with the foot hooked up

景:
  object: the sun rising over a tall city tower
  history: >-
    An ideogram: the sun 日 above a city 京, which also gives the sound. The bright view over a city is scenery.
  layout: >-
    A small round sun with a bright band across its middle rises above the top of the middle of the
    city. The city is one tall, broad tower with a pointed top: a roof with a spire, a gatehouse
    below it with a window, a central pillar and two sloping walls spreading to the bottom corners.
    Pale gold sky, pale stone.
  exact:
    - The sun is small and narrow, much narrower than the city; the city's roof line is the widest line in the whole picture.
    - The sun's bottom rim joins the foot of the left rim and the foot of the right rim.
    - The short spire stroke touches the sun's bottom rim and stands on the roof line.
    - The roof line is the longest line; the gatehouse's top line is about half as long as the roof line, and its window line is about a third as long.
    - The gatehouse's left wall and its top line start together, and their ends meet the window ledge; a small gap separates the top line from the roof.
    - The central pillar starts on the window line and ends in a bend to the left.
    - The two lower wall strokes stand free of every other stroke; the right one is a little longer.
  strokes:
    - where: a line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the top right to run down the right side
      part: the top and right rim of the sun
    - where: a short line across the middle of the sun, rising a little to the right
      part: the bright band of light across the sun's heart
    - where: a short line at the bottom of the sun, rising to the right
      part: the sun's bottom rim
    - where: a short dot under the sun, slanting down to the right
      part: the spire of the tower
    - where: a very long line across the middle, rising a little to the right, wider than everything else
      part: the broad roof of the tower
    - where: a short stroke below the roof on the left, slanting down to the right
      part: the gatehouse's left wall
    - where: a line across below the roof, ending in a small hook down to the left
      part: the gatehouse's top and right wall
    - where: a short line across the gatehouse, rising a little to the right
      part: the gatehouse's window ledge
    - where: a vertical line from the window ledge down, ending in a bend to the left
      part: the central pillar of the gate
    - where: a short stroke at the lower left, slanting down to the left
      part: the left sloping wall
    - where: a stroke at the lower right, slanting down to the right
      part: the right sloping wall

遺:
  object: a traveller walking away along a road, leaving a precious shell behind
  history: >-
    An ideogram: walking away 辶 from something valuable 貴, so it is left behind.
  layout: >-
    On the right, a precious shell stands on a small ground line, with a small pennant on a pole
    above it marking the treasure. On the left, a small traveller with a friendly face (eyes, nose,
    mouth) and simple pale clothes walks away to the left along a long road that runs across the
    bottom of the picture. Pale pink shell, pale blue sky.
  exact:
    - The pole of the pennant runs down through the pennant's two lines and ends on the long ground line.
    - The ground line is the longest line of the shell and the pole; it rises a little to the right.
    - The shell's side lines stand apart from the ground line with a small gap.
    - The shell's two inner ridges are short and separate from each other by a gap; the base line joins the ends of both sides.
    - The two feet of the shell stand free, apart from the shell and the road, with a small gap.
    - The traveller does not touch the shell or the pennant.
    - The traveller's body line ends on the start of the road.
  strokes:
    - where: a short stroke at the top of the pennant, slanting down to the right
      part: the pennant's left edge
    - where: a line across the top, rising a little to the right, turning down at the end and ending in a small hook to the left
      part: the pennant's top and flying edge
    - where: a shorter line across below it, rising a little to the right
      part: the pennant's lower edge
    - where: a line from the top down, crossing the pennant, a little to the right of the pennant's middle
      part: the pennant's pole
    - where: a long line across the middle, rising a little to the right, wider than the shell
      part: the small ground line under the pennant, the shell's resting place
    - where: a line down on the left of the shell
      part: the shell's left side
    - where: a line across the top of the shell, turning down to run down the right side
      part: the shell's top and right side
    - where: a short line across inside the shell, rising a little to the right
      part: the upper ridge of the shell
    - where: a short line across inside the shell, below the first, rising a little to the right
      part: the lower ridge of the shell
    - where: a line across the bottom of the shell, rising a little to the right
      part: the shell's base
    - where: a short stroke below the shell on the left, slanting down to the left
      part: the shell's left foot, flaring out
    - where: a short stroke below the shell on the right, slanting down to the right
      part: the shell's right foot, flaring out
    - where: a short stroke at the top left, slanting down to the right
      part: the traveller's head
    - where: a line across the left side, rising a little to the right, then turning down
      part: the traveller's outstretched arm and then the body down to the foot
    - where: a long line across the bottom, from the left running to the right, rising a little at its end
      part: the long road, the traveller's feet on it

