      part: the child's body and right leg
    - where: a very long line across the bottom of the child, from near the left edge to near the right
      part: the ground the child stands on
    - where: a line down the left of the field, slanting a little to the right
      part: the field's left edge
    - where: a line across from the top of the left edge, turning down at the right to run down the right side
      part: the field's top and right edge
    - where: a short line across the middle of the field, rising a little to the right
