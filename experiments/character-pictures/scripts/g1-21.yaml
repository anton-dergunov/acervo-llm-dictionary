筑:
  object: a strong building raised of bamboo, with a builder's square and a sturdy frame
  history: >-
    An ideogram: a strong frame 巩 raised with bamboo ⺮, a building. The bamboo also gives the sound.
  layout: >-
    Two bamboo stalks with hanging leaves fill the top as the building's tall poles. Below them, on
    the left, stands a builder's square (a flat beam with a post and a base line); on the right a
    sturdy four-legged frame with a peg driven in beneath its crossbar. Pale green bamboo, pale
    wood.
  exact:
    - The two bamboo stalks are about the same length and both bend to the left at the foot.
    - The two leaf dots stand free of the bamboo; the leaf lines start on the stalks.
    - The builder's square has a short top bar, a post that starts on it, and a base line that the post's foot touches.
    - The base line is a little longer than the top bar and turns up a little at its right end.
    - The frame's left leg is a long slanting stroke ending at the bottom left and stands free of the square.
    - The frame's top bar starts together with the left leg, then turns down on the right and ends in a hook up.
    - The peg starts on the frame's left leg and stands apart from the top bar, with a small gap.
  strokes:
    - where: a stroke from the top of the left half down and then down to the left
      part: the left bamboo stalk, its leaves hanging
    - where: a short line across the upper left, rising a little to the right
      part: a twig on the left stalk
    - where: a short dot at the lower left, slanting down to the right
