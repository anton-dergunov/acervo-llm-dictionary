    - where: a line across at the bottom of the hand, rising a little to the right, longer than the upper finger
      part: the lower finger
    - where: a short line across on the left, rising a little to the right
      part: the square's top bar
    - where: a short dot-like stroke down from the middle of the top bar
      part: the square's post
    - where: a line from the lower left rising to the right
      part: the square's base line
    - where: a short stroke down from the top of the box
      part: the box's left side
    - where: a short line rising to the right then turning down to the right and ending in a small hook down to the left
      part: the box's top and right side
    - where: a short line across the bottom of the box, rising a little to the right
      part: the box's bottom, the item inside
    - where: a very long line across the lower part, wider than everything else
