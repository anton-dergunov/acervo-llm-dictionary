    - where: a short line across above the mouth, rising a little to the right
      part: the bar above the mouth, its upper lip
    - where: a short line down at the left of the mouth
      part: the mouth's left side
    - where: a short line across the top of the mouth, rising a little to the right, then turning down
      part: the mouth's top lip and right side
    - where: a short line across the bottom of the mouth, rising a little to the right
      part: the mouth's lower lip
    - where: a long stroke from the top centre sloping down to the right, curving down and ending in a hook up
      part: the shaft of the dagger-axe
    - where: a sweep from the upper right, crossing the shaft, down to the left
      part: the dagger-axe's curved edge
    - where: a short stroke at the top, slanting down to the right
      part: the point of the dagger-axe
    - where: a short stroke on the left
      part: the heart's left edge
    - where: a long curve from left of centre down to the bottom, along the bottom to the right and up, ending in a small hook up to the left
      part: the rounded lower body of the heart, its tip turning in at the right
    - where: a short dot near the top centre, slanting down to the right
      part: a vessel rising from the top of the heart
    - where: a short dot at the upper right, slanting down to the right
      part: a second vessel at the heart's upper right

新:
  object: an axe freshly chopping a tree
  history: >-
    An ideogram: an axe 斤 chopping a tree 亲, so the wood is new and fresh.
  layout: >-
    A tall tree fills the left half, its crown at the top and its trunk standing on the ground, with
    a pale fresh cut on its right side. A tall axe on the right half faces left, its blade turned to
    the tree and its long handle down to the bottom. Pale green crown, pale brown trunk, pale grey
    blade.
  exact:
    - The tuft at the top, the crown's top edge and the left leaf cluster stand free of every other stroke; the small stroke below the crown's top edge ends on the upper bough.
    - The upper bough is the longest line across the tree; the lower bough is a little shorter, about five sixths as long.
    - The trunk starts on the upper bough, crosses the lower bough and ends in a small hook up to the left.
    - The short left root stands free of the trunk; the knot starts on the trunk.
    - The axe's head line starts on the blade's long stroke and the handle starts on the head line.
    - The handle is the longest vertical line of the axe.
    - The tree and the axe do not touch.
  strokes:
    - where: a short stroke at the top, slanting down to the right
      part: the tuft at the very top of the crown
    - where: a line across below it, rising a little to the right
