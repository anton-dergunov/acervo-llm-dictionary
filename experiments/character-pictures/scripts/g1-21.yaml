尋:
  object: a hand reaching out with a carpenter's square to find an item in a box
  history: >-
    An ideogram: a hand 彐 and a measuring tool 工 looking for an item 口; 寸 gives the sound.
  layout: >-
    At the top, an open hand reaches out to the right with fingers spread. In the middle, a
    carpenter's square stands on the left and a small box on the right holds the item. At the bottom
    stretches a small forearm with a pulse dot on the wrist and a hanging hand. Pale skin, pale
    wood.
  exact:
    - The hand's back line turns down at the right and ends touching the lowest finger line.
    - The top finger line stands apart from the back line; a small gap separates them.
    - The lowest finger line is longer than the top finger line.
    - The square's top bar is short; its dot-like post starts on it and ends on the rising base line; the base line is the longest stroke of the square.
    - The box's left side and its top line start together; the top line ends in a small hook down to the left; the bottom line meets the end of the box's right side.
    - The box does not touch the forearm below it; the forearm line crosses the hanging hand line near its start.
    - The pulse dot stands free of every other stroke.
  strokes:
    - where: a line across the top, running to the right, turning down and back to the left at its end
