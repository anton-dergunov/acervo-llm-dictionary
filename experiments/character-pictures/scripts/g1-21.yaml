築:
  object: a strong building raised of bamboo, with a builder's square and a sturdy frame
  history: >-
    An ideogram: a strong frame 巩 raised with bamboo ⺮, a building. The bamboo also gives the sound.
  layout: >-
    Two bamboo stalks with hanging leaves fill the top as the building's tall poles. Below them, on
    the left, stands a builder's square (a flat beam with a post and a base line); on the right a
    sturdy frame with a peg beneath its crossbar. Beneath all stands a plain timber post, a tree
    with spreading roots, as the foundation of the wood. Pale green bamboo, pale wood.
  exact:
    - The two bamboo stalks are about the same length; each twig starts on its stalk.
    - The two leaf dots stand free of the bamboo; the right leaf dot has a small gap from the frame.
    - The builder's square has a short top bar, a dot-like post that starts on it, and a base line that the post's foot touches.
    - The base line rises to the right and ends with a small gap from the frame.
    - The frame's short upright starts together with its top bar; the top bar then turns down and ends in a hook up.
    - The peg starts on the frame's upright and stands apart from the top bar, with a small gap.
    - The timber post is a straight vertical ending in a plain point at the bottom, with no hook; it crosses the long line across.
    - The two timber sweeps both start where the post crosses the long line across and do not touch each other.
    - The timber post is the longest vertical stroke in the picture.
  strokes:
    - where: a stroke from the top of the left half down and then down to the left
      part: the left bamboo stalk, its leaves hanging
    - where: a short line across the upper left, rising a little to the right
      part: a twig on the left stalk
    - where: a short dot at the lower left, slanting down to the right
      part: a hanging leaf of the left stalk
    - where: a stroke from the top of the right half down and then down to the left
      part: the right bamboo stalk, its leaves hanging
    - where: a short line across the upper right, rising a little to the right
      part: a twig on the right stalk
    - where: a short dot below the twig, slanting down to the right
      part: a hanging leaf of the right stalk
    - where: a short line across the left side below the bamboo, rising a little to the right
      part: the builder's square, its top bar
    - where: a short dot-like line down from the middle of the top bar
      part: the builder's square, its post
    - where: a line across the left side below, rising to the right
      part: the builder's square, its base line
    - where: a short line down in the middle of the picture
      part: the frame's upright leg
    - where: a line from the top of the upright, across to the right, rising a little, turning down, then across to the right, ending in a small hook up
      part: the frame's top bar and curved right side
    - where: a short dot under the top bar, slanting down to the right
      part: a peg driven in beneath the crossbar
    - where: a long line across the lower middle, from near the left edge to near the right
      part: the timber's branches
    - where: a long straight line down the middle of the lower half, to the bottom
      part: the timber post, a plain trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the timber's root, spreading left
    - where: a sweep from the centre of the trunk down and out to the bottom right, turning across at the end
      part: the timber's root, spreading right

雲:
  object: rain falling from a cloud
  history: >-
    The oldest forms drew swirling clouds; later 雨 was added above 云 to say it is a rain cloud.
  layout: >-
    A flat pale grey-blue rain cloud fills the top half with four pale raindrops falling inside it.
    A soft white cloud with a curled underside fills the bottom half. Pale colours, no sun.
  exact:
    - The flat top of the rain cloud is much shorter than the long edge below it, which is the longest line of the rain cloud and ends in a small hook down to the left.
    - The rain cloud's left edge and its long edge start together.
    - The middle streak starts on the flat top, crosses the long edge and ends just above the cloud below, with a small gap.
    - The four raindrops are separate short dots and touch nothing.
    - The lower cloud's long line is about twice as long as its short top line.
    - The cloud's curl starts on the long line, runs down to the left and turns across to the right, ending on the right wisp.
    - The curl ends on the middle of the right wisp.
  strokes:
    - where: a short line across the top, rising a little to the right
      part: the flat top of the rain cloud
    - where: a short line down the left, slanting a little to the left
      part: the rain cloud's left edge
    - where: a long line across from the top of the left edge, ending in a small hook down to the left
      part: the rain cloud's lower edge and right side
    - where: a line down the middle from the top line, slanting to the right and then straight down
      part: a long streak of rain in the middle
    - where: a short dot on the left, slanting down to the right
      part: an upper left raindrop
    - where: a short dot on the left below the first, slanting down to the right
      part: a lower left raindrop
    - where: a short dot on the right, slanting down to the right
      part: an upper right raindrop
    - where: a short dot on the right below the first, slanting down to the right
      part: a lower right raindrop
    - where: a line across the upper part of the lower half, rising a little to the right
      part: the soft top of the white cloud
    - where: a long line across below it
      part: the cloud's back, the long flat line
    - where: a stroke from the middle of the long line down to the left, then turning across to the right
      part: the curled underside of the cloud
    - where: a stroke from the long line down to the right
      part: the cloud's wisp, trailing off to the lower right

筋:
  object: strong tendons like bamboo canes in a chest and arm
  history: >-
    An ideogram: tendons 肋 as tough as bamboo ⺮, the cords that give strength.
  layout: >-
    Two bamboo canes with hanging leaves fill the top. Below on the left is a pale side of a chest
    with ribs and two flesh marks; on the right is a bent strong arm with its muscle bulging
    upward. Pale green bamboo, pale pink flesh.
  exact:
    - The two bamboo canes are about the same length and both bend to the left at the foot.
    - The two leaf dots stand free of the canes; the twigs start on the canes.
    - The rib cage's long outer stroke is the longest vertical stroke in the lower part.
    - The inner rib line starts on the outer stroke's top, runs down and hooks left.
    - The two flesh marks start on the outer stroke and do not touch the inner line.
    - The arm's bent forearm line crosses the long sweep of the upper arm.
    - The arm's upper sweep starts above the forearm and ends below it, with a gap from the ribs.
  strokes:
    - where: a stroke from the top of the left half, down and then down to the left
      part: the left bamboo cane
    - where: a short line across the upper left, rising a little to the right
      part: a twig of the left cane
    - where: a short dot below, slanting down to the right
      part: a hanging leaf of the left cane
    - where: a stroke from the top of the right half, down and then down to the left
      part: the right bamboo cane
    - where: a short line across the upper right, rising a little to the right
      part: a twig of the right cane
    - where: a short stroke at the lower right of the bamboo, slanting down to the right
      part: a hanging leaf of the right cane
    - where: a long stroke down the left of the lower half, curving to the bottom left
      part: the chest's outer rib
    - where: a line across from the top of the outer rib, turning down on the right and ending in a small hook to the left
      part: the inner rib line, curving down
    - where: a short dot-like stroke between the ribs, rising a little to the right
      part: an upper flesh mark between the ribs
    - where: a short dot-like stroke between the ribs, below the first, rising a little to the right
      part: a lower flesh mark between the ribs
    - where: a long line across from the middle of the right half, turning down and ending in a hook up to the left
      part: the bent forearm, ending in a fist
    - where: a long sweep from the upper right down to the bottom centre, crossing the forearm
