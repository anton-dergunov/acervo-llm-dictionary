# Full run, group g1, batch 16. Written from the fact sheets, following scripts/GUIDE.md.

首:
  object: a deer's head seen from the front, with its antlers above and its ears out to both sides
  history: >-
    The oldest forms drew a deer's head with antlers; the face became the nose-like box and the
    antlers became the two small strokes on top.
  layout: >-
    The deer's head fills the lower two thirds of the square and looks at the viewer, with a friendly
    face, big pale eyes and a soft nose. Its pale brown antlers rise from the top of its head into the
    top of the square, a small one on the left and a taller one on the right. The wide ears stick out
    to both sides below the antlers. The coat is pale fawn.
  exact:
    - The line across the ears is by far the widest stroke, almost the full width, and rises a little to the right.
    - The right antler is taller and longer than the left antler, and its end touches the ears at the middle.
    - The left antler stands free and does not touch anything.
    - The short stroke at the top of the face touches the ears at the middle but a small gap separates it from the right antler.
    - The face is a box made of a left side, a top turning down the right side with a small hook to the left, and three short bars inside that grow a little longer going down.
    - The three inner bars start at the left side; the lowest one meets the end of the right side at the bottom.
  strokes:
    - where: a short dot-like stroke at the top left, slanting down to the right
      part: the left antler
    - where: a stroke at the top right, slanting down to the right and then turning down to the left, longer than the first
      part: the right antler
    - where: a very long line across the middle of the upper part, the full width and rising a little to the right
      part: the ears, sticking out to both sides
    - where: a short stroke below the ears in the middle, slanting down to the right and then turning down to the left
      part: the tuft of hair on the forehead
    - where: a straight line down the left side of the face, a little slanting to the right
      part: the left cheek
    - where: a line across the top of the face, turning down to run down the right side and ending in a small hook to the left
      part: the brow and the right cheek, the hook the chin
    - where: a short line across, rising slightly to the right, in the upper middle of the face
      part: the eyes
    - where: a short line across, rising slightly to the right, a little longer than the one above and lower down
      part: the nose
    - where: a line across the bottom of the face, rising slightly to the right, the longest of the three inner bars
      part: the mouth and muzzle

亲:
  object: a tree bearing fruit, its fruit hanging in the crown above a plain trunk
  history: >-
    A tree 木 bearing fruit 立; the hazelnut tree, whose nuts are borne close together, hence the
    close relatives. In the modern form the lower part is a tree whose two lower boughs are short dots.
  layout: >-
    The tree fills the square. In the upper half a pale green crown holds the fruit: pale brown
    hazelnuts hanging from short stalks, with a few pale leaves. Below the crown a plain trunk runs
    down to the roots. The ground is pale and stays below the lowest stroke.
  exact:
    - The long line across the crown is the widest stroke of the upper part; the trunk starts at its middle, and the hanging cluster on the right ends on it.
    - The dot at the top stands free, a small gap above the high bough, and the left hanging nut stands free below the bough.
    - The hanging cluster on the right starts a small gap away from the high bough.
    - The trunk is a long stroke down crossing the line across in the lower half, and it ends in a small hook to the left.
    - The two short strokes at the bottom stand free of the trunk, one on each side; the left slants down to the left and the right slants down to the right, and both are short.
    - The line across in the lower half is about three quarters as long as the long line across the crown.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the stalk of the highest nut
    - where: a line across in the upper part, rising slightly to the right, a little over half as long as the crown's widest line
      part: a high bough of the crown
    - where: a short dot below the left end of that bough, slanting down to the right
      part: a hazelnut hanging on the left
    - where: a stroke from the right of the high bough down to the right and then turning down to the left, ending on the long line below
      part: a hanging cluster of nuts on its stalk on the right
    - where: a long line across the middle of the upper half, the widest stroke of the upper part
      part: the crown's lower bough, on which the nuts rest
    - where: a line across the lower half, about three quarters as long as the widest line above, rising slightly to the right
      part: the tree's main branches
    - where: a long stroke down from the middle of the crown's lower bough, crossing the branches and ending in a small hook to the left
      part: the trunk
    - where: a short sweep at the lower left beside the trunk, down to the left
      part: the left root, short
    - where: a short stroke at the lower right beside the trunk, down to the right
      part: the right root, short

律:
  object: a walker stepping toward a tall writing brush that stands upright, the brush that writes down the law
  history: >-
    The left part is the walking step 彳. The right part 聿 is a hand holding a brush, the writing of
    the rule that everyone must follow.
  layout: >-
    The walker is on the left, seen from the side facing right, with a friendly face and simple pale
    clothes; only his back leg is ink. On the right a tall writing brush stands upright, taller than
    the walker, with a pale brown shaft and a soft grey bristle tip at the bottom. A pale hand grips
    the top of the shaft; a pale scroll hangs across the shaft and two pale ribbon ties wrap it. A pale
    inkstone tray lies across the foot of the shaft.
  exact:
    - The walker's two upper strokes are separate, with a small gap between them; the vertical below them starts on the middle of the lower one.
    - The walker's strokes stand apart from the brush.
    - The tall brush shaft is the longest stroke, the full height, and crosses every stroke across on the right.
    - The hand at the top, the scroll under it and the lowest tray all cross the shaft; the hand is a stroke across turning down to the left at its right end.
    - The two short ties between the scroll and the tray are about as long as each other and only a little over half as long as the scroll, and they rise slightly to the right.
    - The tray at the bottom is as long as the hand and the scroll are, or longer, and crosses the shaft near its lower end.
  strokes:
    - where: a short sweep at the top of the left half, down to the left
      part: the walker's back thigh, bent
    - where: a longer sweep below it, down to the left, with a small gap from the first
      part: the walker's back knee and shin
    - where: a straight line down from the middle of the lower sweep to the bottom
      part: the walker's back foot, planted straight
    - where: a line across the top of the right half, running right and then turning down to the left
      part: the hand gripping the shaft, its right end the thumb
    - where: a long line across below it, almost the full width of the right half
      part: the scroll of the law, hung across the shaft
    - where: a shorter line across below it, rising slightly to the right, a little over half as long as the scroll
      part: the upper tie around the shaft
    - where: a line across below that, rising slightly to the right, about as long as the one above
      part: the lower tie around the shaft
    - where: a long line across the lower part of the right half, almost the full width
      part: the inkstone tray lying across the brush's foot
    - where: a very long straight line down the right half, from the very top to the bottom
      part: the brush's shaft and bristle tip

復:
  object: a person who goes out each day beneath the sun, his foot stepping along
  history: >-
    A person who goes somewhere on foot every day, under the sun. The Traditional form adds the
    walking step on the left.
  layout: >-
    On the left a walker is seen from the side facing right with a friendly face and simple pale clothes;
    only his back leg is ink. On the right the upper part is a small person seen from the front, with a
    friendly face and simple clothes, one arm held out to the side. Below him is a round pale yellow
    sun, drawn as a box. Under the sun a walking leg and foot step toward the right: a pale leg with
    pale shoe, the toes pointing right.
  exact:
    - The three left strokes stand free of the right part; the two upper left strokes are separate with a small gap, and the vertical starts on the middle of the lower one.
    - The small person's arm starts on the middle of the body stroke.
    - The sun hangs from the end of the small person's body stroke, where the sun's left side and its top-and-right stroke both start; a short stroke across joins the middle of the left side, and a short stroke rising to the right closes the bottom.
    - A small gap separates the person's body stroke from the middle of the sun's top stroke.
    - The sun's two inner strokes are short and about equal.
    - The leg's thigh starts a little below the sun; the knee stroke and the foot stroke both start on the thigh and cross each other at their middles.
    - The knee stroke is the longest of the lower part and the foot stroke is about half as long; a small gap separates the end of the sun's top stroke from the knee stroke.
  strokes:
    - where: a short sweep at the top of the left half, down to the right and then turning down to the left
      part: the walker's back thigh
    - where: a longer sweep below it, down and then turning down to the left, with a small gap from the first
      part: the walker's back knee and shin
    - where: a straight line down from the middle of the lower sweep to the bottom
      part: the walker's back foot, planted straight
    - where: a short sweep at the top of the right part, down and then turning down to the left
      part: the small person's body, running down into the left leg
    - where: a short line across the person's upper body, rising slightly to the right, starting at the body
      part: the person's arm, held out to the right
    - where: a short straight line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the right
      part: the sun's top and right rim
    - where: a short line across in the middle of the sun, rising slightly to the right
      part: the sun's upper bar
    - where: a short line rising to the right along the bottom of the sun
      part: the sun's lower rim
    - where: a stroke below the sun, starting at its left, down to the left
      part: the leg's thigh, going back
    - where: a long line across below it, rising slightly to the right, then turning down and then turning down to the left, starting at the top of the thigh
      part: the knee and shin, bending
    - where: a stroke from the middle of the thigh down to the right and then across to the right
      part: the foot, stepping out with its toes forward

复:
  object: a person who goes out each day beneath the sun, his foot stepping along
  history: >-
    A person who goes somewhere on foot every day, under the sun. The Traditional form adds the
    walking step on the left.
  layout: >-
    The top is a small person seen from the front, with a friendly face and simple pale clothes, one arm
    held out to the right. Below him is a round pale yellow sun, drawn as a box. Under the sun a walking
    leg and foot step toward the right: a pale leg with a pale shoe, the toes pointing right.
  exact:
    - The person's arm starts on the middle of the body stroke, and the sun does not touch the body.
    - The sun's left side and its top-and-right stroke start at the same point at the top left, and the foot's thigh starts at the bottom of the left side.
    - A short stroke across touches the middle of the left side; the sun's top-and-right stroke ends in a small hook to the left, and a short stroke rising to the right closes the bottom of the sun.
    - The sun's two inner strokes are short and about equal.
    - The foot's knee stroke is the longest stroke of the lower part; the foot stroke starts on the thigh and crosses the knee stroke.
  strokes:
    - where: a short sweep at the top, down and then turning down to the left
      part: the person's body, running down into the left leg
    - where: a line across the person's upper body, rising slightly to the right, starting at the body's middle
      part: the person's arm, held out to the right
    - where: a short straight line down the left side of the sun
      part: the sun's left rim
    - where: a line across the top of the sun, turning down at the right and ending in a small hook to the left
      part: the sun's top and right rim
    - where: a short line across in the upper middle of the sun, rising slightly to the right
      part: the sun's upper bar
    - where: a short line along the bottom of the sun, rising slightly to the right
      part: the sun's lower rim
    - where: a stroke below the sun, down to the left
      part: the leg's thigh, going back
    - where: a long line across below it, then turning down to the left
      part: the knee and shin, bending
    - where: a stroke from the middle of the thigh down to the right and then across to the right
      part: the foot, stepping out with its toes forward

除:
  object: a city wall with a gate on the left and, beside it on the right, a heap of waste swept up with a broom
  history: >-
    The waste 余 produced by a city 阝. The left part is the city; the right part is the leftover
    waste to be cleared away.
  layout: >-
    On the left a pale stone city wall stands tall, with a gate tower at its top. On the right, outside
    the wall, lies a heap of waste scraps, pale and plain, with an old pale broom upright in it. No
    people. Scraps fall beside the broom at the bottom.
  exact:
    - The tall wall stroke is the longest stroke down; the gate stroke starts at its top.
    - The gate stroke ends in a small hook to the left, and a small gap separates it from the heap's left slope.
    - The heap's right slope starts on the middle of the left slope; the short stroke across touches neither of them at its start, with a small gap from the end of the left slope.
    - The broom handle starts on the short stroke across, crosses the long board across below it and ends in a small hook up to the left.
    - The long board across is about twice as long as the short stroke across above it.
    - The two scraps at the bottom stand free of everything; the left one slants down to the left, the right one slants down to the right and is somewhat longer.
  strokes:
    - where: a stroke starting at the top of the wall, rising to the right, turning down to the left, then down and ending in a small hook to the left
      part: the gate tower, curling over at the top of the wall
    - where: a long straight line down the left side, from top to bottom
      part: the city wall
    - where: a stroke from the top of the heap down and then turning down to the left
      part: the heap's left slope
    - where: a stroke from the middle of the left slope down to the right and then across to the right
      part: the heap's right slope, flattening out at the ground
    - where: a short line across, rising slightly to the right, in the middle
      part: a plank lying in the heap
    - where: a longer line across below it, about twice as long
      part: a board lying across the heap
    - where: a stroke down from the middle of the plank, ending in a small hook up to the left
      part: the broom's handle with its hooked end
    - where: a short stroke at the bottom, down to the left
      part: a scrap falling on the left
    - where: a stroke at the bottom right, down to the right, longer than the left one
      part: a scrap falling on the right

突:
  object: a dog rushing out of the mouth of a cave in a hillside
  history: >-
    A dog 犬 rushing out of a cave 穴; the sudden thing.
  layout: >-
    The cave mouth fills the top of the square, a pale grey hillside with an overhanging roof of rock.
    The friendly pale-brown dog, with a face of eyes, a nose and a mouth, leaps out beneath it on its
    hind legs, front paws stretched out wide, one ear pricked up on its right. Nothing dark.
  exact:
    - The small dot at the top stands free of the cave's roof.
    - The short stroke at the upper left and the roof line start at the same point.
    - The roof line ends in a small hook down to the left.
    - The two strokes inside the cave stand free of the roof; the left one turns down to the left and is longer, the right one is a shorter slant down to the right.
    - The dog's front-legs line crosses its long head-and-body sweep, and the other hind leg starts at the crossing.
    - The ear dot stands free of everything, at the upper right of the dog.
    - The cave stays above the dog; the dog's head sits just under the cave's roof.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: a stone at the top of the hill
    - where: a short stroke at the upper left, going down
      part: the left end of the overhanging rock
    - where: a long line across the upper part, ending in a small hook down to the left at its right end
      part: the overhanging roof of rock
    - where: a short sweep under the roof at the left, down and then turning down to the left
      part: the left side of the cave's mouth
    - where: a short stroke under the roof in the middle, slanting down to the right
      part: the right side of the cave's mouth
    - where: a line across the middle, from the left to the right
      part: the dog's front legs, stretched out wide
    - where: a long stroke from the top centre down to the right, then turning down, then sweeping down to the bottom left, crossing the line across
      part: the dog's head and neck, then its body and one hind leg
    - where: a stroke from the long one at the crossing, down to the right and then across to the right
      part: the dog's other hind leg
    - where: a short dot at the upper right, slanting down to the right
      part: the dog's pricked-up ear

洲:
  object: three islands lying in a river that runs in three streams, with water on the left
  history: >-
    The oldest forms drew islands in a river; the character 州 is that, and the water 氵 on its left
    was added when 州 came to mean a district.
  layout: >-
    The right part is a wide river that splits into three long pale blue streams running down, with a
    small pale green island between each pair. The left side is more pale blue water, two drops of
    spray at the top and one long wave rising at the bottom. No people.
  exact:
    - The left water strokes all stand free; the two spray drops are small, the wave below them is long and rises to the right.
    - The little vertical on the left is much shorter than the streams, only about a seventh as long as the right stream.
    - The left stream is about four fifths as long as the right stream, curving out to the bottom left, and the middle stream stops well above the bottom, about three fifths as long as the right stream.
    - The right stream is the longest, from the top to the bottom.
    - The three islands are small and do not touch the streams, with small gaps on each side.
    - The middle stream does not reach the bottom, and the middle and right islands are small slanted dots.
  strokes:
    - where: a short dot at the upper left, slanting down to the right
      part: a drop of spray
    - where: a short dot below it at the far left, slanting down to the right
      part: a second drop of spray
    - where: a long stroke rising from the bottom left up to the right
      part: a wave lifting from the sea
    - where: a very short vertical stroke in the middle height, between the water and the streams
      part: the leftmost island
    - where: a long stroke down the left side of the river, starting near the top, slanting a little and curving out to the bottom left
      part: the left stream
    - where: a short dot between the left and middle streams, slanting down to the right
      part: the middle island
    - where: a straight stroke down the middle, from the top to well above the bottom
      part: the middle stream
    - where: a short stroke between the middle and right streams, slanting down to the right
      part: the right island
    - where: a long straight stroke down the right side, from the top to the bottom
      part: the right stream

須:
  object: a man's face seen from the front, with a long beard of hair growing at its left
  history: >-
    Hair growing on the face; the beard. The right part draws a head with its body, and the three
    strokes on the left are the locks of the beard.
  layout: >-
    A large head seen from the front fills the right part of the square, with a friendly face, eyes, a
    nose and a mouth and simple pale clothes on a small body below. On the left three soft pale grey
    locks of hair hang down in a column, drifting out to the lower left.
  exact:
    - The three locks stand free of each other and of the head, with a small gap between the two upper ones.
    - The lowest lock is the longest; the middle lock is about three quarters as long, and the top lock is a little shorter than the lowest, about four fifths as long.
    - The hair line across the top is about two thirds as long as the brow-and-cheek stroke.
    - The forelock starts on the hair line and ends on the left cheek's top, where the brow stroke also starts.
    - The left cheek is a straight vertical; its end meets the start of the chin line.
    - The three short lines inside the face start on the left cheek; the lowest, the chin, is the longest of the three; the chin line ends on the right cheek's end.
    - A small gap lies between the brow-and-cheek stroke and the nose line.
    - The two legs stand free below the face; the left leg is the longer.
  strokes:
    - where: a stroke at the upper left, down and then turning down to the left, four fifths as long as the lowest
      part: the top lock of the beard
    - where: a stroke below it with a small gap, down and then turning down to the left, about three quarters as long as the lowest
      part: the middle lock of the beard
    - where: the lowest stroke at the left, down and turning down to the left, the longest
      part: the bottom lock of the beard
    - where: a long line across the top of the right part, rising slightly to the right
      part: the hair across the top of the head
    - where: a short stroke from the middle of the hair line, down to the left
      part: the forelock hanging down
    - where: a straight line down the left side of the face
      part: the left cheek
    - where: a line across the top of the face, turning down at the right to run down the right cheek
      part: the brow and right cheek
    - where: a short line across the face in the upper middle, rising slightly to the right
      part: the eyes
    - where: a short line across the face below it, rising slightly to the right, a little longer
      part: the nose
    - where: a slightly longer line across the bottom of the face, rising slightly to the right
      part: the mouth and chin
    - where: a sweep from the lower middle down to the bottom left
      part: the left leg
    - where: a short stroke from the lower middle down to the bottom right, shorter than the left leg
      part: the right leg

须:
  object: a man's face seen from the front, with a long beard of hair growing at its left
  history: >-
    Hair growing on the face; the beard. The right part draws a head with its body, and the three
    strokes on the left are the locks of the beard.
  layout: >-
    A large head seen from the front fills the right part of the square, with a friendly face, eyes, a
    nose and a mouth and simple pale clothes on a small body. On the left three soft pale grey locks of
    hair hang down in a column, drifting out to the lower left.
  exact:
    - The three locks stand free of each other and of the head.
    - The lowest lock is the longest; the two above it are equal and about three quarters as long as it.
    - The hair line across the top is about two thirds as long as the brow-and-cheek stroke.
    - The forelock starts on the middle of the hair line and ends where the left cheek and the brow stroke start; the two meet there.
    - The long body sweep stands free of everything; it runs from the middle of the face down to the bottom left and is the longest stroke down in the right part.
    - The short right leg stands free at the lower right, about half as long as the left cheek.
  strokes:
    - where: a stroke at the upper left, down and then turning down to the left
      part: the top lock of the beard
    - where: a stroke below it, down and then turning down to the left, as long as the first
      part: the middle lock of the beard
    - where: the lowest stroke at the left, down and then turning down to the left, longer than the other two
      part: the bottom lock of the beard
    - where: a line across the top of the right part
      part: the hair across the top of the head
    - where: a short stroke from the middle of the hair line, down to the left
      part: the forelock hanging down
    - where: a stroke down the left of the face, slanting a little to the right
      part: the left cheek
    - where: a line across the top of the face, turning down at the right
      part: the brow and right cheek
    - where: a long sweep from the middle of the face down and out to the bottom left
      part: the body, running down into the left leg
    - where: a short stroke at the lower right, slanting down to the right
      part: the right leg

差:
  object: a ram's head seen from the front, with its horns, and a workman's spade beside its neck
  history: >-
    Work 工 done by a sheep 羊; the mistake, the incompetence. Both parts are drawn plainly: the sheep
    and the work tool.
  layout: >-
    The ram's head fills the upper two thirds of the square and faces the viewer, with big pale horns, a
    friendly face, eyes, a nose and a mouth, and creamy wool. In the lower right a pale metal spade
    stands against the ram's neck, its flat blade resting on the ground. No people.
  exact:
    - The left horn stands free, and a small gap separates the right horn from the brow line.
    - The brow line is a little longer than the eyes line, and the ears line is the longest, much wider than both.
    - The long stroke of the face starts on the middle of the brow, crosses the eyes line and the ears line, and sweeps out to the bottom left.
    - The spade's handle bar starts on the long face stroke at its middle; it is a little under half as long as the ears line.
    - The spade's shaft starts at the middle of the handle bar and ends on the middle of the blade.
    - The spade's blade is long, a little over four fifths as long as the ears line.
  strokes:
    - where: a small dot at the top left, slanting down to the right
      part: the left horn
    - where: a short stroke at the top right, slanting down to the left
      part: the right horn
    - where: a line across, below the horns, rising slightly to the right
      part: the brow, across the top of the face
    - where: a line across the middle, a little shorter than the brow
      part: the eyes, as one line across the face
    - where: a long line across below the middle, wider than the others
      part: the ears, sticking out to both sides
    - where: a long stroke from the middle of the brow, down through both lines across and sweeping out to the bottom left
      part: the long face and neck, down to the chin
    - where: a short line across in the lower right, rising slightly to the right, starting on the face stroke
      part: the spade's handle bar
    - where: a short vertical line from the middle of the handle bar straight down
      part: the spade's shaft
    - where: a long line across the bottom, ending where the shaft ends at its middle
      part: the spade's flat blade, on the ground

客:
  object: a guest stepping in under a roof, greeting aloud
  history: >-
    A person 各 welcomed under one's roof 宀. The lower part draws a foot arriving and a mouth speaking,
    the guest announcing himself.
  layout: >-
    A pale roof with a small ornament at its peak covers the top of the square. Under it a guest
    steps in toward the right: a walking leg with a foot, and a mouth with lips that greets aloud,
    drawn small and simple on the guest, who has a friendly face and simple pale clothes. The roof sits
    above, the guest below.
  exact:
    - The small dot at the roof's peak stands free of the roof line, with a small gap.
    - The roof's left side is short and the roof line starts on its middle; the roof line ends in a small hook down to the left.
    - A small gap separates the roof line's start from the guest's thigh.
    - The leg's long stroke and the stroke of the foot both start on the middle of the thigh and cross each other; the long stroke across is the longest of the lower part, and the foot stroke is about four fifths as long as it.
    - The mouth's left side starts on the middle of the leg's long stroke.
    - The mouth's top line does not touch the leg or the foot, with small gaps from both, and it ends in a small hook down to the left.
    - The mouth's bottom lip is about a third as long as the leg, and the top line ends on its middle.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's ornament at the peak
    - where: a short stroke down on the left of the roof
      part: the roof's left edge
    - where: a line across the roof, from the left edge to the right, ending in a small hook down to the left
      part: the roof, with its right edge hooked
    - where: a stroke from the upper middle down to the left
      part: the guest's thigh
    - where: a long stroke from the middle of the thigh going across to the right and then sweeping down to the bottom left
      part: the leg, swinging forward
    - where: a stroke from the middle of the thigh going down to the right and then across to the right, about four fifths as long as the leg
      part: the foot stepping out
    - where: a short line down the left side of the mouth in the lower middle
      part: the mouth's left corner and side
    - where: a line across the top of the mouth, going to the right and ending in a small hook down to the left
      part: the upper lip and right corner
    - where: a short line across the bottom of the mouth, rising slightly to the right
      part: the lower lip

革:
  object: an animal's hide being skinned, stretched out and pulled by two hands at its top
  history: >-
    The oldest forms drew an animal hide stretched out with the head still on it; the modern form kept
    the tools and hands at the top and the stretched hide below.
  layout: >-
    At the top two pale hands pull the top of the hide apart, and below them a pale brown hide hangs
    stretched, with a darker patch near its belly. A wooden stretching rod lies across the bottom.
    No faces are needed; the hands are plain pale and the hide a soft pale tan.
  exact:
    - The two arms cross the bar at the top, one on each side of its middle, and are about as long as each other; the left arm is straight and the right one slants a little.
    - The short cord joins the lower ends of the two arms; the long vertical starts at the left end of the cord, and a small gap separates it from the left arm's end.
    - The belly patch is a box made of a left side, a top turning down the right side with a small hook to the left, and a bottom line closing it.
    - The long vertical crosses the patch's top line, its bottom line and the rod below.
    - The rod at the bottom is the longest stroke across, about four fifths of the full width; the patch's top line is about two thirds as long as the rod.
  strokes:
    - where: a line across the top, about two thirds as long as the longest line across
      part: the bar held between the two hands
    - where: a short vertical stroke crossing the bar on the left of its middle
      part: the left hand's arm, pulling
    - where: a stroke of about the same length crossing the bar on the right of its middle, slanting down to the right and then turning down
      part: the right hand's arm, pulling
    - where: a short line across, rising slightly to the right, joining the lower ends of the two arms
      part: the cord that binds the hide to the hands
    - where: a short stroke at the left in the upper middle, down to the right
      part: the belly patch's left edge
    - where: a line across to the right from the middle of that left edge, ending in a small hook down to the left
      part: the belly patch's top and right edge
    - where: a shorter line across below it, closing the patch
      part: the belly patch's bottom edge
    - where: a long line across the lower part, nearly the full width
      part: the stretching rod
    - where: a long straight line down from the cord to near the bottom, crossing the patch and the rod
      part: the cut down the hide's middle

宣:
  object: a palace hall under its roof, with a window where proclamations are made, standing on a terrace
  history: >-
    The oldest forms drew a palace, the place where the ruler's proclamations are made.
  layout: >-
    A pale tile roof with a small ornament at its peak covers the top of the palace. Under it, a
    square window glows pale gold like the sun, with a bar across its middle. A rail runs across above
    the window and a long terrace floor lies along the bottom. No people.
  exact:
    - The small dot at the roof's peak stands free of the roof line, with a small gap.
    - The roof's left edge is short, and the roof line starts on its start and ends in a small hook down to the left.
    - The rail under the roof and the terrace floor stand free of the roof and the window.
    - The window's left side and its top-and-right stroke start at the same point at the top left.
    - The window's bottom line starts at the end of the left side and ends on the end of the top-and-right stroke.
    - The middle bar of the window is short, starts on the left side's middle and does not reach the right.
    - The terrace floor is the longest stroke across, much longer than the rail, which is about two fifths as long as the floor.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's ornament
    - where: a short stroke down on the left of the roof
      part: the roof's left edge
    - where: a long line across the roof, ending in a small hook down to the left
      part: the roof, with its right edge hooked
    - where: a short line across below the roof, rising slightly to the right, about two fifths as long as the floor
      part: the rail above the window
    - where: a short line down the left side of the window
      part: the window's left edge
    - where: a line across the top of the window, rising slightly to the right, then turning down at the right
      part: the window's top and right edge
    - where: a short line across the middle of the window, rising slightly to the right
      part: the window's middle bar
    - where: a short line across the bottom of the window, rising slightly to the right
      part: the window's sill
    - where: a long line across the bottom of the square, the full width
      part: the terrace floor

帮:
  object: a flag hung on a pole below the marks of a nation's land
  history: >-
    A nation's flag; the upper part draws the nation and also gives the pronunciation, and the cloth
    below it is the flag.
  layout: >-
    The upper left is a tall boundary post with three signboards across it, the lower ones longer. The
    upper right is a walled city with a gate tower. Below, in the centre, a pale red flag hangs over a
    rod on a tall pole. No people. The colours are pale and soft.
  exact:
    - The middle signboard is the shortest of the three; the lowest is the longest, over one and a half times the middle one.
    - The post crosses all three signboards and ends below them in a small hook; it does not touch the flag.
    - The post is the longest stroke down at the left.
    - The city wall is a short vertical on the left of the gate; the gate stroke starts at the top of the wall and ends in a small hook to the left.
    - The wall stays above the pole, with a small gap between the wall's end and the pole's start.
    - The flag's left edge is short and stands apart from the post with a small gap.
    - The flag's top stroke is the longest stroke across and its right end turns down in a small hook to the left; the pole crosses it in the middle and is much longer than the flag's left edge.
  strokes:
    - where: a short line across in the upper part of the left half, rising slightly to the right
      part: the top signboard
    - where: a line across below it, rising slightly to the right, the shortest of the three
      part: the middle signboard
    - where: a longer line across below it, rising slightly to the right, the longest of the three
      part: the lowest signboard
    - where: a long stroke down the left half from the very top, crossing the signboards, ending in a hook to the left
      part: the boundary post
    - where: a line across the upper right, running right, then turning down to the left, then down to the right, then down, ending in a small hook to the left
      part: the gate tower's roof and the city's wall curling around it
    - where: a short vertical line on the left of the gate tower
      part: the city wall
    - where: a short line down the left side of the flag
      part: the flag's left edge, hanging down
    - where: a line across the upper part of the flag, rising slightly to the right and turning down at the right, ending in a small hook to the left
      part: the rod with the cloth over it, and the cloth's right edge, curling at its hem
    - where: a long straight line down the centre, from above the flag's top line to the bottom
      part: the pole

幫:
  object: a flag hung on a pole below the marks of a nation's land
  history: >-
    A nation's flag; the upper part draws the nation and also gives the pronunciation, and the cloth
    below it is the flag.
  layout: >-
    In the upper left two earth mounds are piled one above the other, the lower one smaller, in pale
    brown. In the upper right a hand reaches out toward them, a pale hand with a hooked finger. Below,
    a white silk banner hangs on a pale pole, a small white square pennant over the cloth, a ring at its
    top, and a pale red flag below it hanging over a rod. No people besides the hand.
  exact:
    - In each mound the vertical crosses the short top line and ends on the long ground line.
    - The upper mound is the larger; its ground line is the longest line across on the left.
    - The lower mound is a little smaller and lies mostly below the upper one; its vertical starts on the upper mound's ground line and crosses its own top line, and its ground line is about three quarters as long as the upper ground line.
    - The hand's forearm crosses the long hand stroke, and the dot beside them stands free with small gaps from both.
    - The hand's long stroke hooks to the left at its end; the hand does not touch the mounds.
    - The white pennant's ring stroke does not touch the mounds, with a small gap, and the pennant's left side touches its top-and-right stroke at its start.
    - The flag's left edge starts at the same point as the flag's top stroke; the flag's top stroke is the longest stroke across, much longer than the pennant's inner bars.
    - The long pole starts at the pennant's bottom bar and crosses the flag's top line; it is the longest stroke down at the bottom.
  strokes:
    - where: a short line across at the top of the left half, in the upper part
      part: the top of the upper mound
    - where: a short vertical stroke crossing it, going down
      part: the upper mound's spine
    - where: a long line across below it, rising slightly to the right, the widest on the left
      part: the upper mound's ground
    - where: a short line across in the middle of the left half, rising slightly to the right
      part: the top of the lower mound
    - where: a short vertical stroke crossing it
      part: the lower mound's spine
    - where: a line across the lower part of the left half, rising slightly to the right, about three quarters as long as the upper ground
      part: the lower mound's ground
    - where: a line across the top of the right half
      part: the hand's forearm
    - where: a stroke from the top right, down to the right and then turning down, ending in a small hook to the left, crossing the forearm
      part: the hand and its hooked finger
    - where: a small dot beside them on the left, slanting down to the right
      part: the thumb
    - where: a short stroke down at the top of the middle, a little left of centre
      part: the ring at the top of the white pennant
    - where: a short stroke below it at the left, down to the right
      part: the white pennant's left edge
    - where: a line across, rising slightly to the right, then turning down at the right
      part: the pennant's top and right edge
    - where: a short line across the pennant's middle, rising slightly to the right
      part: the pennant's upper fold
    - where: a short line across the pennant's bottom, rising slightly to the right
      part: the pennant's bottom edge
    - where: a short line down the left side of the flag
      part: the flag's left edge, hanging down
    - where: a long line across the flag's upper part, rising slightly to the right, turning down at the right and ending in a small hook to the left
      part: the rod with the cloth over it, and the cloth's right edge, curling at its hem
    - where: a long straight line down the centre, from the pennant's bottom bar to the bottom
      part: the pole

逆:
  object: a rebel standing upside down on his hands, going against the road, and a walker on the road below him
  history: >-
    A disobedient 屰 person 辶; 屰 also provides the pronunciation. The oldest form of 屰 drew a man
    upside down, head toward the ground, the one who goes the wrong way.
  layout: >-
    In the middle a man stands upside down on his hands, his feet up in the air and his head down,
    with a friendly face drawn upside down, and simple pale clothes. Below and around him, a small
    walker on the left steps along a long road at the bottom of the square, seen from the side facing
    right, with a friendly face and simple pale clothes. The road is pale.
  exact:
    - The upside-down man's feet are the small dot and the stroke beside it at the top; the right foot stroke is the longer.
    - A small gap separates the right foot from the hips line below it.
    - The hips line across crosses nothing and the long body sweep starts on its middle.
    - The body sweep crosses the bowed arm stroke and ends on the road; it is about as long as the arm stroke.
    - The arm stroke goes down and then turns up to the right and ends on the middle of the straight arm stroke; the straight arm is about half as long as the body.
    - The walker's head dot stands free; the road is the longest stroke of the picture and is a stroke across.
    - The walker's body stroke ends on the middle of the road.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the upside-down man's left foot
    - where: a stroke at the top right, slanting down to the right and then turning down to the left
      part: the upside-down man's right foot
    - where: a line across below them, rising slightly to the right
      part: his hips and belt
    - where: a stroke from the left of the middle going down, then turning up to the right
      part: his left arm, bowed to the ground
    - where: a straight line down on the right side, about half as long as the body
      part: his right arm, bracing
    - where: a long stroke from the middle of the hips line down and then turning down to the left, ending on the road
      part: his body and head, hanging down
    - where: a small dot at the upper left, slanting down to the right
      part: the walker's head
    - where: a stroke from the middle left of the picture, rising slightly to the right, then turning down toward the road
      part: the walker's back and leg, ending on the road
    - where: a long line across the bottom, rising slightly to the right, then turning across to the right, then rising slightly to the right again
      part: the road, running to the right

陞:
  object: a mound of earth being piled up with a scoop, beside a hill
  history: >-
    To pile up 升 earth 土 to form a mound 阝; 升 also provides the pronunciation. The right part is a
    scoop piling up earth above an earth mound.
  layout: >-
    On the left a pale green hill rises with a shoulder at its top. On the right a pale wooden scoop
    with a long handle rises upright, lifting loose earth from the mound below it. The earth mound
    sits at the bottom right, pale brown, with a pale flat ground line beneath it. No people.
  exact:
    - The hill's shoulder starts at the top of the hill's side, rises slightly to the right, then turns down and ends in a small hook to the left.
    - The hill's side is the longest stroke down.
    - A small gap separates the hill's shoulder from the scoop's rim.
    - The scoop's rim crosses both the scoop's bowl stroke and its handle; the rim is as long as the shoulder.
    - The scoop's handle is the longest stroke of the scoop, from the very top of the square, and ends just short of the mound.
    - The mound's short top line is crossed by the mound's vertical, which ends on the middle of the ground line.
    - The ground line is the longest stroke across at the bottom, as long as the rim or longer.
  strokes:
    - where: a stroke at the top of the left part, rising slightly to the right, then turning down and ending in a small hook to the left
      part: the hill's shoulder
    - where: a long straight line down the left side, from top to bottom
      part: the hill's steep side
    - where: a short stroke at the top of the right part, down and then turning down to the left
      part: loose earth falling off the scoop
    - where: a line across in the middle of the right part, rising slightly to the right
      part: the scoop's rim
    - where: a stroke from the loose earth down through the rim and turning down to the left
      part: the scoop's bowl, swinging down
    - where: a long straight line down on the right from the top, crossing the rim
      part: the scoop's handle
    - where: a short line across in the lower part, a little over half as long as the ground
      part: the top of the earth mound
    - where: a stroke starting just under the scoop, crossing the mound's top line and ending on the ground line
      part: the mound's centre
    - where: a long line across the bottom
      part: the ground under the mound

威:
  object: a woman kneeling, facing left, bound under the threat of a halberd
  history: >-
    Dominating a woman 女 by force of arms 戈. The oldest form drew a woman kneeling, with a weapon
    over her.
  layout: >-
    A woman kneels at the lower left, seen from the side and facing left, with a worried face and
    simple pale clothes, her arms crossed in front of her. Over her stands the pale-handled halberd:
    a tall curved shaft on the right, a crossbar at its top and a pale cloth streamer hanging from the
    crossbar's left end down the left side. The woman is pale and the halberd is a soft grey.
  exact:
    - The crossbar and the long streamer start at the same point; the streamer hangs down the left edge and is the long left stroke.
    - The long curved shaft crosses the crossbar and ends in a turn up at its lower right; it is the longest stroke of the picture.
    - The shaft's tassel stroke crosses the shaft in the middle height and slopes down to the left, with a small gap from the woman's back.
    - The tiny dot at the top of the shaft stands free.
    - The woman's headband (a short line across) stands a small gap from the shaft and touches the woman's back stroke at its start.
    - The woman's back stroke turns sharply at the lower right and crosses both her arm strokes; her arm sweep starts where her arm line across ends.
    - The woman's long line across starts on the streamer's middle.
  strokes:
    - where: a long line across in the upper part, rising slightly to the right
      part: the halberd's crossbar
    - where: a long stroke down the left side starting at the left end of the crossbar, and turning down to the left at the bottom
      part: the cloth streamer
    - where: a short line across in the middle of the left, rising slightly to the right
      part: the woman's headband
    - where: a stroke from the headband's start going down a little to the left, turning sharply and sweeping down to the right
      part: the woman's head and back, then her thigh folded forward
    - where: a sweep from the right of the middle down to the bottom left, crossing the stroke before it
      part: one arm, reaching down across her body
    - where: a short line across, just below the middle, rising slightly to the right, from the streamer to the middle of the woman
      part: her other arm, held across in front of her
    - where: a very long stroke down from the top centre, curving down to the lower right and turning up at the end, crossing the crossbar
      part: the halberd's long curved shaft
    - where: a stroke from the shaft's middle height down to the left
      part: the halberd's hanging tassel
    - where: a small dot at the top of the shaft, slanting down to the right
      part: the halberd's spearhead

秋:
  object: a stalk of grain burning in a field fire, the harvest time of year
  history: >-
    The time of year when farmers would burn 禾 crops 火; autumn. The oldest forms drew grain next to a
    fire.
  layout: >-
    On the left a stalk of grain stands with its heavy ear drooping over to the left, yellow and pale.
    On the right a big flame leaps up with two sparks flying off on both sides, in warm pale orange, kept
    well away from the stalk. No people.
  exact:
    - The grain's top stroke goes from the right to the left and the stalk's top touches its middle.
    - The leaves line across crosses the stalk; the left root and the short right root start on the stalk, with a small gap between their starts.
    - The right root is short, only about a third as long as the left root, and the left root is a little longer than the ear.
    - The two sparks stand free of everything; the left spark is a short dot, the right one is a short stroke down to the left.
    - A small gap separates the left spark from the end of the leaves line.
    - The fire's left sweep is the longest stroke of the picture; its right sweep starts at its middle, flares out to the bottom right and is only about half as long.
  strokes:
    - where: a stroke in the top of the left half, running to the left and then turning down to the left
      part: the ear of grain, drooping over to the left
    - where: a line across the left half, rising slightly to the right
      part: the leaves, spreading to both sides
    - where: a long straight line down from the middle of the ear to the bottom
      part: the stalk
    - where: a sweep from the stalk's middle down and out to the bottom left
      part: the root spreading out to the left
    - where: a short stroke from the stalk's middle down to the right
      part: the short root on the right
    - where: a small dot at the left of the fire, slanting down to the right
      part: a spark leaping off to the left
    - where: a short stroke at the upper right, slanting down to the right and then turning down to the left
      part: a spark leaping off to the right
    - where: a long sweep from the top centre of the fire down and out to the bottom left
      part: the left edge of the big flame, from its tip to its base
    - where: a sweep from the middle of the long sweep down and out to the bottom right
      part: the right edge of the big flame, flaring out at its base

庭:
  object: a courtyard in front of a building, with a winding path across it
  history: >-
    A wide 广 courtyard 廷; 廷 also provides the pronunciation. The building stands behind a yard laid
    with stone.
  layout: >-
    A lean-to building with a pale tile roof fills the top and left side of the square, its wall
    running down the left. In front of it, inside the roof's angle, lies a yard with a small stone
    post standing on a paving slab at the right of its middle, and a pale path winding from the upper
    left of the yard down to the right and out toward the lower right. No people.
  exact:
    - The roof's small ornament stands free of everything.
    - The roof line starts at the top of the wall and rises slightly to the right.
    - The wall is the longest stroke down, curving to the bottom left.
    - A small gap separates the path from the wall and from the post's crossbar.
    - The stone post's short vertical crosses its crossbar in the middle and ends on the base slab; the cap stone leans over the post's top and the post starts on the middle of the cap.
    - The path zigzags, starting near the wall rising to the right, then turning down to the left, then down to the right, then down to the left; the long exit stroke crosses it at its last turn.
    - The path's long exit stroke goes down to the right and then across to the right, and is about as long as the wall.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the roof's ornament
    - where: a line across the upper part, rising very slightly to the right
      part: the roof
    - where: a long stroke down the left side from the roof's left end, curving down to the bottom left
      part: the wall of the building
    - where: a short stroke in the upper right, down to the left
      part: the leaning cap stone of the post
    - where: a line across in the middle of the right half, rising slightly to the right
      part: the post's crossbar
    - where: a short vertical line crossing the crossbar, starting at the middle of the cap stone
      part: the post
    - where: a line across in the lower right, ending the post's foot
      part: the paving slab
    - where: a stroke from the middle left of the yard, rising slightly to the right, then turning down to the left, then down to the right, then down to the left
      part: the path, winding across the yard
    - where: a long stroke starting from the path's last turn, down to the right and then across to the right
      part: the path, leading out of the yard toward the lower right

染:
  object: a jar of pale wine being poured into water at the foot of a tree, dyeing the water pale colours
  history: >-
    Water 氵 and wine 九 mixed in a wooden 木 bowl; dye. The tree is the wooden container.
  layout: >-
    In the upper left, two drops of pale blue water splash and a pale blue wave lifts. Beside them a
    pale jar, tilted, pours pale red wine toward a tree below. The tree fills the lower half with a
    plain trunk, branches and roots, the ground pale. No people.
  exact:
    - The water strokes stand free of each other and of the jar; two small drops, and a wave rising to the right.
    - The jar's long left stroke crosses the start of the stroke across at the jar's top; the jar's top stroke is the longest stroke of the upper half.
    - The jar's top stroke rises slightly to the right, turns down, then runs across, rising slightly to the right, and ends in a small hook up.
    - The tree's line across crosses its trunk; the trunk is a straight vertical ending in a plain point at the bottom, with no hook.
    - The two roots start at the trunk, a small gap between their starts, and the right root is a little longer than the left and flattens at its end.
  strokes:
    - where: a short stroke at the upper left, slanting down to the right
      part: a drop of water
    - where: a small dot below it, slanting down to the right
      part: a second drop of water
    - where: a short stroke at the left rising from the bottom left up to the right
      part: a wave lifting
    - where: a long stroke from the top centre of the jar down to the bottom left, crossing the stroke after it
      part: the jar's tilted left side and neck
    - where: a long line across the upper right, rising slightly to the right, then turning down, then across again and ending in a small hook up
      part: the jar's top rim, right side and foot
    - where: a line across the upper part of the tree, nearly as wide as the square
      part: the tree's branches, spreading to both sides
    - where: a straight line down the middle of the tree
      part: the trunk
    - where: a sweep from the centre of the trunk down and out to the bottom left
      part: the root spreading out to the left
    - where: a sweep from the centre of the trunk down to the right and then across to the right
      part: the root spreading out to the right

帝:
  object: an altar on which a sacrifice is being made, with a cloth hanging below its table
  history: >-
    The oldest forms drew an altar with an offering on it; the supreme ruler is the one the sacrifice
    is made to.
  layout: >-
    An altar table stands in the middle of the square, with a pale incense bowl in the middle of its
    top, a small flame above the bowl, and a small fruit offering on its left. A pale cloth hangs from
    a rod below the table, and a tall central pillar of the altar stands behind the cloth. No people.
    The colours are pale.
  exact:
    - The tiny flame at the top and the fruit offering stand free of everything.
    - The bowl's rim and the bowl's stem touch at the middle of the rim; the stem ends on the middle of the table.
    - The bowl's rim is a little over half as long as the table.
    - The table's left end sits on the middle of its left leg; the table is the longest stroke across and its right end ends in a small hook down to the left.
    - The cloth's left edge is short; its rod stroke starts on the left edge and ends in a hook to the left.
    - The central pillar starts on the middle of the table and crosses the cloth's rod; a small gap separates it from the bowl's stem.
  strokes:
    - where: a small dot at the top centre, slanting down to the right
      part: the flame above the bowl
    - where: a line across, rising slightly to the right, a little over half as long as the table
      part: the incense bowl's rim
    - where: a small dot below the rim's left end, slanting down to the right
      part: a fruit offered on the altar
    - where: a short stroke from the middle of the rim, down to the right and then turning down to the left
      part: the bowl's stem
    - where: a short vertical line down the left of the table
      part: the table's left leg
    - where: a long line across, the widest stroke, ending in a small hook down to the left
      part: the altar's table top
    - where: a short line down the left side of the cloth
      part: the cloth's left edge, hanging down
    - where: a line across below the table, turning down at the right and ending in a small hook to the left
      part: the rod with the cloth over it, and the cloth's right edge, curling at its hem
    - where: a long straight line down the centre, from the table's middle to the bottom
      part: the altar's central pillar

某:
  object: a sweet fruit hanging in the top of a certain tree
  history: >-
    The sweet 甘 fruit of a certain tree 木. The oldest forms drew a tree with its fruit above it.
  layout: >-
    A sweet pale-yellow fruit hangs at the top of the square, above the tree. Below it a tree fills the
    lower half, with branches above and roots below. A pale drop of sweet juice sits inside the fruit.
    No people.
  exact:
    - The fruit is a line across crossed by two sides, the left slightly shorter than the right.
    - The line across at the fruit's top is the widest stroke of the fruit and both sides cross it.
    - The sweet mark inside starts on the left side and is very short; the fruit's bottom line starts at the left side's end and ends at the right side's end.
    - A small gap separates the sweet mark from the right side, and the fruit's bottom from the top of the trunk.
