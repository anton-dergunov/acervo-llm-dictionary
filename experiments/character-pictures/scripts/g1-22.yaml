腦:
  object: a piece of flesh on the left, and on the right a skull under a few strands of hair holding a brain
  history: >-
    An ideogram: an organ ⺼ inside the skull 囟. The oldest form of 囟 draws the top of a baby's
    head, a skull with its soft crown.
  layout: >-
    On the left a pale pink piece of meat on its ribs, as the flesh sign is drawn. On the right, three
    wavy strands of pale hair hang over the top of a rounded skull, which holds a pale pink brain with
    two folds crossing. The skull is ivory. No people.
  exact:
    - The three hair strands stand free of each other and of the skull, each a wavy line running down.
    - The strand in the middle is a little longer than the other two.
    - The skull's left side begins at its top and runs down, ending in a plain point at the bottom.
    - The skull's top line starts at the same point as the left side, runs across the top and down the right side, and is the longest line of the right half.
    - The small stroke at the top of the skull ends on the start of the top line and stands apart from the left side.
    - The two brain folds cross each other in the middle; neither touches the skull's left side.
    - The base of the skull starts at the foot of the left side and ends at the foot of the right side.
    - The flesh sign on the left has a long left edge, a top that turns down on the right with a hook, and two short dots that do not touch the right edge.
  strokes:
    - where: a long line down the left of the left half, from the top to near the bottom
      part: the left edge of the piece of flesh
    - where: a line across the top of the left half, turning down at the right and ending in a hook up to the left
      part: the top and right edge of the flesh
    - where: a short dot in the upper middle of the left half, rising slightly to the right
      part: the upper rib
    - where: a short dot below it in the left half, rising slightly to the right
      part: the lower rib
    - where: a short wavy line at the top left of the right half, running down
      part: the first strand of hair
    - where: a short wavy line at the top centre of the right half, running down
      part: the second strand of hair
    - where: a short wavy line at the top right of the right half, running down
      part: the third strand of hair
    - where: a short stroke sweeping down to the left, at the middle of the right half, below the hair
      part: the soft crown of the skull
    - where: a line starting at the left of the skull and running down, ending low in a plain point
      part: the skull's left side
    - where: a line across starting at the top of the left side, running over the top, turning down on the right and ending in the lower right
      part: the skull's top and right side
    - where: a short stroke inside the skull, down from the upper right, turning down to the left
      part: a fold of the brain
    - where: a short stroke inside the skull, slanting down to the right, crossing the first
      part: a second fold of the brain, crossing the first
    - where: a short line across at the bottom of the skull, rising slightly to the right, from the foot of the left side to the foot of the right
      part: the base of the skull

滅:
  object: a small fire pressed out by a flat lid, with water thrown on it from the left and a long curved halberd standing behind
  history: >-
    An ideogram: water 氵 over a flame 烕. The right half already draws a fire under a cover and a
    curved weapon, a halberd, beside it; the water on the left puts the fire out.
  layout: >-
    On the left, three pale blue drops of water fall toward the fire. In the middle of the right
    part, a small pale orange fire sits under a flat grey lid pressed down on it. A long pale grey
    halberd stands behind, with a long curved shaft that bends to the right at the bottom and ends in a
    small hook, a crossbar near its top, and a tassel hanging from the bar. Smoke drifts up, pale grey.
    No people.
  exact:
    - The three water strokes are separate; none touches any other stroke.
    - The two upper ones are short dots slanting down to the right and the lower is a longer stroke rising to the right, about three times as long as a dot.
    - The crossbar of the halberd is the longest across-stroke, about twice as long as the lid.
    - The tassel starts at the left end of the crossbar and sweeps down to the lower left, ending far below the bar.
    - The shaft crosses the crossbar, runs down in a long curve to the lower right and ends in a small hook up.
    - The second long stroke crosses the shaft and sweeps to the lower left.
    - The small dot at the upper right stands free of the shaft.
    - The lid is a short line across; it does not touch the tassel or the shaft.
    - The fire's two outer pieces and middle sweep touch each other; the left dot stands apart from the middle sweep and the right dot touches it.
  strokes:
    - where: a short dot in the upper left, slanting down to the right
      part: the first drop of water
    - where: a short dot in the middle of the left, slanting down to the right
      part: the second drop of water
    - where: a longer stroke rising to the right at the bottom left
      part: the third drop, splashing up
    - where: a long line across the upper part, rising slightly to the right, crossing the shaft
      part: the halberd's crossbar
    - where: a sweep from the left end of the crossbar down to the lower left
      part: the halberd's tassel
    - where: a short line across in the middle, rising slightly to the right
      part: the flat lid pressed on the fire
    - where: a short dot under the lid at the left, slanting down to the right
      part: a flame's left tongue
    - where: a short stroke under the lid on the right, slanting down to the left
      part: a flame's right tongue
    - where: a stroke from under the lid in the middle, running down and turning down to the left
      part: the fire's middle flame
    - where: a short dot at the lower middle, slanting down to the right, touching the middle flame
      part: a spark
    - where: a very long stroke from the top, running down to the lower right and ending in a small hook up, crossing the crossbar
      part: the halberd's long shaft
    - where: a stroke from the right, running down and turning down to the left, crossing the shaft
      part: the halberd's curved blade
    - where: a short dot at the top right, slanting down to the right
      part: the halberd's pointed tip

亂:
  object: a person kneeling on the right, using both hands to unravel a knotted tangle of cord on the left
  history: >-
    An ideogram: a kneeling person 乚 using their hands 爫 to unravel a knot. The oldest form drew
    two hands pulling at a tangled skein of thread.
  layout: >-
    On the left, two hands reach down from the top to a tangle of pale cord. On the right, a kneeling
    person with a friendly face, wearing a pale tunic, faces left toward the tangle, the back upright
    and the shins laid along the floor behind. The cord is pale tan. Soft colours.
  exact:
    - The hands' four strokes stand free of each other and of everything below.
    - The first and fourth hand strokes sweep down to the left; the fourth is about half the length of the first.
    - The short rising stroke under the hands and the dot after it meet at their ends, and the dot ends on the start of the loop strand.
    - The tangle's long strand on the left is a plain vertical; the strand beside it turns across and down, ending in a hook up to the left.
    - The crossing at the bottom of the tangle is a short stroke across and a short stroke down to the right that cross each other.
    - The kneeling person is one long stroke, a straight back down, then the shins turning across to the right and ending in a small hook up. It stands free of everything.
    - It is longer than anything in the tangle.
  strokes:
    - where: a stroke at the top of the left part, sweeping down to the left
      part: the first hand's reaching arm
    - where: a short dot at the upper left, slanting down to the right
      part: the first hand's fingers
    - where: a short dot beside it, slanting down to the right
      part: the second hand's fingers
    - where: a short stroke at the top right of the left part, sweeping down to the left
      part: the second hand's wrist
    - where: a short stroke rising to the right below the hands, turning down at its end
      part: a strand of cord pulled upward
    - where: a short dot at its end, slanting down to the right
      part: the strand's end
    - where: a long straight line down the left of the lower left part
      part: the tangle's long left strand
    - where: a line across from the top of the long strand, turning down in a long curve and ending in a small hook up to the left
      part: a loop of the tangle
    - where: a short stroke down from the loop, turning across to the right
      part: a small loop of the cord
    - where: a short dot beside it, slanting down to the right
      part: the knot itself
    - where: a short line across low in the tangle, turning down to the left
      part: a loose end hanging down
    - where: a short stroke down to the right, crossing the loose end
      part: the cord crossing over it
    - where: one long stroke at the right, starting at the top, running straight down and then turning across to the right with a small hook up at its end
      part: the kneeling person's back and shins on the floor

辞:
  object: a mouth with its tongue stuck out, beside a bitter pointed blade
  history: >-
    An ideogram: bitter 辛 words 舌. The oldest form of 辛 draws a sharp tool, a blade for cutting,
    which stands for pain and bitterness; 舌 is the tongue in the mouth.
  layout: >-
    The left half shows a big open mouth with a pink tongue sticking out of its top, drawn as a
    friendly cartoon mouth with lips. The right half shows a pale grey pointed blade standing with its
    point up, its crossguard in the middle and a plain handle below. The mouth and blade are the same
    height.
  exact:
    - The tongue's long bar is the longest line of the left half, about twice as long as the mouth's bottom line.
    - The tongue's long bar crosses the tongue's upright, which starts on the sweep above it.
    - The mouth's left side stands apart from its top at the start, and the top turns down on the right.
    - The mouth's bottom line is short, about half as long as the tongue's bar, and touches the left side.
    - The blade's top dot stands free; the left notch dot stands free, and the right notch stroke ends on the guard.
    - The two long lines across the blade, the guard and the lower bar, are about as long as each other, and the shorter bar at the top is about three quarters as long.
    - The handle stands on the guard's centre and crosses the lower bar.
  strokes:
    - where: a sweep from the top right of the left half, running left and turning down to the left
      part: the tongue's tip curling down
    - where: a long line across the left half, rising slightly to the right
      part: the tongue's upper edge
    - where: a short stroke down from the sweep, crossing the long line and turning down
      part: the tongue's centre groove
    - where: a short line down at the left of the lower part
      part: the mouth's left lip
    - where: a line across the top of the mouth, turning down at the right
      part: the mouth's upper lip and its right corner
    - where: a short line across at the bottom of the mouth, rising slightly to the right
      part: the mouth's lower lip
    - where: a short dot at the top of the right half, slanting down to the right
      part: the blade's pointed tip
    - where: a line across below the tip, rising slightly to the right, about three quarters as long as the guard
      part: the blade's shoulders
    - where: a small dot in the upper middle, slanting down to the right
      part: a notch cut in the blade, on the left
    - where: a short stroke on the right, down to the right and then down to the left
      part: a notch cut in the blade, on the right
    - where: a long line across at the middle of the right half, rising slightly to the right
      part: the blade's crossguard
    - where: a long line across below the guard, rising slightly to the right
      part: the blade's lower bar
    - where: a long straight line down from the centre of the guard, crossing the lower bar and ending in a plain point
      part: the blade's handle

豊:
  object: a crooked, bent stalk of bean plants resting over an old covered serving dish heaped with beans
  history: >-
    An ideogram: a stalk bent crooked 曲 by the weight of its beans 豆. The oldest form of 豆 draws a
    tall stand with a dish, a vessel for offerings.
  layout: >-
    The top half shows a bent, crooked bundle of pale green bean stalks, drawn as a bundle bound
    in a frame with two stalks rising out through the top. The bottom half shows the old covered
    dish on a tall stand, the dish heaped with pale beans. No people.
  exact:
    - The bundle's left side is a short line that does not reach the top.
    - The top of the bundle turns down at the right and is the longest stroke of the bundle.
    - The two stalks rising through the top start above the bundle; the right one is a little longer and starts higher.
    - The base line of the bundle ends on the end of the top-and-right stroke.
    - The dish's lid is a line across the top, longer than the stroke below that carries its right side.
    - The dish's left side is a short slanting line meeting the start of the rim.
    - The dish's rim line ends in a small hook to the left.
    - The two stand strokes under the dish are short and do not touch each other; the right one touches the foot.
    - The foot is the longest line of the whole picture, about one and three quarters as long as the dish's lid.
  strokes:
    - where: a short line down the left side of the bundle, slanting a little to the right
      part: the bundle's left edge
    - where: a long line across the top of the bundle, turning down at the right end
      part: the bundle's top and right edge
    - where: a short line across the middle of the bundle, rising slightly to the right
      part: the band tying the bundle
    - where: a stalk rising from above the bundle, slanting down to the right, then straight down, on the left of the middle
      part: the left stalk
    - where: a stalk starting higher, a little to the right of the middle, slanting then straight down
      part: the right stalk
    - where: a line across the base of the bundle, rising slightly to the right
      part: the base of the bundle
    - where: a line across at the top of the lower half, rising slightly to the right
      part: the dish's lid
    - where: a short line down the left side of the dish, slanting to the lower right
      part: the dish's left side
    - where: a line across the top of the dish below the lid, ending in a hook down to the left
      part: the dish's rim and right side
    - where: a line across the bottom of the dish, rising slightly to the right
      part: the dish's bottom
    - where: a short dot below the dish on the left, slanting down to the right
      part: the stand's left leg
    - where: a short stroke below the dish on the right, slanting down to the left
      part: the stand's right leg
    - where: a very long line across the bottom of the picture, the full width
      part: the foot of the stand

製:
  object: cloth hung on a rail being cut with a knife, and below it a robe sewn from that cloth
  history: >-
    An ideogram: to manufacture 制 clothes 衣. The upper part shows cloth being cut to size with a
    knife, the lower part the finished garment.
  layout: >-
    The top half shows a piece of pale blue cloth hung from a rail, and at the right a knife held
    upright, cutting down beside it. The bottom half shows a long robe with crossed lapels, hanging
    empty and seen from the front, in pale cream. No people.
  exact:
    - The rail is two bars across, the lower longer than the upper, about one and three quarters as long, and a small hook at the left above them.
    - The cloth's panel on the left is a short line down; the cloth's top turns across, rises, turns down and ends in a hook to the left.
    - The long centre line of the cloth is the longest vertical in the top half, nearly as long as the knife's blade.
    - The knife's handle is a short line, less than half as long as the blade.
    - The blade ends in a hook up to the left.
    - Robe, the dot stands free; the sweep to the lower left starts under the top bar and the long falling stroke starts at the same point.
    - The robe's inner short line starts on the sweep and ends in a flick up to the right.
    - The fold at the right is short and touches the long falling stroke at its end.
    - The long falling stroke is the longest stroke of the robe, about one and a quarter times as long as the line across the shoulders.
  strokes:
    - where: a short stroke at the top left, down to the right and then down to the left
      part: the ring the cloth hangs from
    - where: a short line across the top, rising slightly to the right, starting on the ring
      part: the upper rail
    - where: a longer line across below it, rising slightly to the right
      part: the lower rail
    - where: a short line down at the left, below the rails
      part: the cloth's left edge
    - where: a line rising to the right from the left edge, then turning down and ending in a small hook to the left
      part: the cloth's fold and right edge
    - where: a long line straight down the middle, crossing the rails, from the top to the bottom of the cloth
      part: the cloth's centre seam
    - where: a short line down at the upper right, left of the knife
      part: the knife's handle
    - where: a long line at the right, starting at the top, running down and ending in a hook up to the left
      part: the knife's blade
    - where: a short dot at the top centre of the robe, slanting down to the right
      part: the robe's collar
    - where: a long line across the upper part of the robe, rising slightly to the right
      part: the shoulders and sleeves
    - where: a long sweep from the middle of that line down to the lower left
      part: the left lapel
    - where: a short line down, left of centre, flicking up to the right at its foot
      part: the inner panel and its turned-up hem
    - where: a short stroke at the right, slanting down to the left
      part: the fold of the right lapel
    - where: a long sweep from the left lapel down and out to the bottom right
      part: the right lapel sweeping out to the hem

臺:
  object: a scholar standing and speaking on a raised platform, with a bird alighting on the ground below it
  history: >-
    An ideogram: a man 吉 standing on a raised dais, with 至 the arrival below. 吉 already draws a
    scholar and his speaking mouth, and 至 a bird alighting on the ground.
  layout: >-
    At the top, a scholar with a friendly face and a pale robe, his shoulders across the top and his
    body down the middle, with his open speaking mouth below. The platform is a wide flat cover in
    the middle, its slab a pale stone. Under it, a small pale bird alights on the ground. Soft colours.
  exact:
    - The scholar's shoulder line is longer than the bar below it, about one and a half times as long.
    - The scholar's body crosses the shoulder line and ends on the bar below.
    - The mouth is a small box; its left side and its top do not touch the platform.
    - The platform's left side is a short plain vertical; its top is a long line across that ends in a small hook down to the left.
    - The platform's top is the longest line across of the upper two thirds, nearly three times as long as the mouth's width.
    - The bird's feet line at the bottom is the longest line of the picture, nearly as wide as the platform.
    - The bird's body stroke starts on its upper line, and the short slanting stroke touches the body's end.
    - The bird's long vertical crosses the line above the ground and ends on the ground.
  strokes:
    - where: a line across the top, in the middle
      part: the scholar's shoulders
    - where: a vertical down from above the shoulder line, crossing it and ending on the bar below
      part: the scholar's body
    - where: a shorter line across below, rising slightly to the right
      part: the scholar's belt
    - where: a short stroke down to the right at the lower left of the scholar
      part: the mouth's left side
    - where: a line across, rising slightly to the right, turning down to the right and ending in a hook down to the left
      part: the mouth's top and right side
    - where: a short line across at the bottom of the mouth
      part: the mouth's lower lip
    - where: a short plain vertical at the left of the slab
      part: the platform's left edge
    - where: a long line across the middle, starting at the left edge and ending in a small hook down to the left
      part: the platform's top slab
    - where: a line across the upper part of the bird's area, in the middle
      part: the bird's wings
    - where: a stroke from the centre sweeping down to the left and turning across, rising slightly to the right
      part: the bird's body and tail
    - where: a short stroke down to the right, starting on the wings
      part: the bird's head and beak
    - where: a line across, lower, in the middle
      part: the bird's legs resting on a branch
    - where: a short vertical from the body through the line above, ending on the ground
      part: the bird's tail feather hanging down
    - where: a very long line across the bottom
      part: the ground the bird reaches

颱:
  object: a wind blowing round a small insect in a swirl, beside a raised platform with a flag on it
  history: >-
    An ideogram: news 風 delivered from a platform 台. The oldest form of 風 draws a sail-shaped swirl
    of wind with a small insect inside it.
  layout: >-
    On the left and across the top, a large pale grey swirl of wind curling over and round a small
    insect with a friendly face. On the right, a small raised platform of pale stone, a flag flying
    from its top and a hollow opening in its front. The insect is small and green. No people.
  exact:
    - The swirl is one long line down the left, plus one very long second line that runs across the top, turns down on the right, curves to the right at the bottom and ends turned up.
    - The second line is the longest stroke of the picture, about twice as long as the first.
    - The insect's top sweep touches nothing but the stem below it.
    - The insect's stem crosses its two small bars and ends on its rising base.
    - The base touches the small dot at its right end.
    - The platform's flag line is a long stroke down that ends turned up to the right and touches the small dot beside it.
    - The platform's opening is a small box whose left side, top and base meet at their corners.
    - The swirl does not touch the platform.
  strokes:
    - where: a long line down the left edge, starting at the top and curving to the lower left
      part: the swirl's left edge
    - where: a very long line from the top of the left edge, running across, turning down on the right, curving to the lower right and then turning up
      part: the swirl's top and right side
    - where: a sweep at the top of the swirl's inside, down to the left
      part: the insect's feelers
    - where: a short vertical at the left of the insect's body
      part: the insect's body, left side
    - where: a line across the body's top, rising slightly to the right, then turning down
      part: the insect's back
    - where: a short line across the lower part of the body, rising slightly to the right
      part: the insect's belly
    - where: a long vertical down the middle of the insect, crossing the back and the belly
      part: the insect's centre line
    - where: a long rising stroke at the bottom of the insect
      part: the insect's wing
    - where: a short stroke at the bottom, slanting down to the right
      part: the insect's tail
    - where: a long line at the top of the platform, running down and curving up to the right at its foot
      part: the flag's pole and its curled foot
    - where: a short dot beside it on the right, slanting down to the right
      part: the flag's tip
    - where: a short vertical at the left of the opening
      part: the opening's left side
    - where: a line across the top of the opening, rising slightly to the right, then turning down
      part: the opening's top and right side
    - where: a short line across at the bottom of the opening, rising slightly to the right
      part: the opening's base

需:
  object: rain falling from a cloud onto a small plot of young crops that need it
  history: >-
    An ideogram: rain 雨 needed by the crops. The lower part of the character was once a beard; here
    it draws only the plot of crops that wait for the rain.
  layout: >-
    The upper part shows a pale blue-grey cloud across the sky with rain falling from it. The lower
    part shows a small plot of dark soil with two young pale green plants standing in it, a seed
    resting at the top of the plot. No people.
  exact:
    - The cloud's top is a short line across the upper middle; the line across below it ends in a hook down to the left and is the longest line of the cloud.
    - The long line of the cloud crosses the rain's centre drop.
    - The four small rain strokes are free dots; none touches another stroke.
    - The bar at the top of the plot is clearly shorter than the line carrying the plot's right side, about two thirds as long.
    - The seed under the bar is a small dot slanting down to the left and crosses the bar.
    - The plot's left side and top-and-right line start at the same point; the line ends in a small hook down to the left.
    - The two young plants are plain verticals ending in plain points; the right one is clearly longer, about one and a half times the left.
    - The plot's top line stands apart from the cloud's rain.
  strokes:
    - where: a short line across the top centre
      part: the top of the cloud
    - where: a short line down at the left, under the cloud
      part: the cloud's left edge
    - where: a long line across, from the left edge to the right, ending in a small hook down to the left
      part: the cloud's underside and right edge
    - where: a vertical down the middle of the cloud, crossing the long line
      part: the central raindrop streak
    - where: a short dot to the left of the middle, slanting down to the right
      part: a raindrop
    - where: a short dot below it at the left, slanting down to the right
      part: a second raindrop
    - where: a short dot at the upper right, across to the right
      part: a third raindrop
    - where: a short dot below it at the right, slanting down to the right
      part: a fourth raindrop
    - where: a line across the top of the plot, rising slightly to the right
      part: the top edge of the plot
    - where: a short dot under it, slanting down to the left, crossing the line
      part: a seed
    - where: a short line down on the left, from the plot's top left
      part: the plot's left side
    - where: a long line across from the left side, then turning down at its right end with a small hook to the left
      part: the plot's front edge and right side
    - where: a short vertical inside the plot on the left of the middle
      part: the left young plant
    - where: a vertical a little longer in the middle of the plot
      part: the right young plant

稱:
  object: a stalk of grain on the left, and a scale held up by a hand on the right, weighing it
  history: >-
    An ideogram: grain 禾 measured on a scale 爯. The oldest form of 爯 draws a hand lifting a thing
    to weigh it.
  layout: >-
    On the left, a stalk of pale golden grain with its heavy ear drooping over at the top. On the
    right, a hand reaches down from the top holding a balance by its pole; a long beam runs across
    near the bottom, with a small frame hanging below the pole. The hand is pale. No people.
  exact:
    - The grain's stalk is a long plain vertical; its two roots below the line across are a sweep to the lower left and a dot; the dot does not touch the sweep.
    - The grain's line across is clearly shorter than the stalk, about half as long, and the stalk crosses it.
    - The hand is four strokes standing free of everything.
    - The hand's first stroke runs left and turns down to the left, about as long as the drooping ear on the grain.
    - The scale's long beam is the longest line of the picture and crosses both the left frame side and the centre pole; it extends past the frame to the right.
    - The hanging frame's left side is a plain vertical; the frame's top line turns down at the right, ending in a hook to the left.
    - The inner bar of the frame is short and does not touch the frame's left side.
    - The centre pole starts above the frame, crosses its top, and ends on the beam.
  strokes:
    - where: a stroke at the top of the grain, running left and turning down to the left
      part: the ear drooping over
    - where: a line across the grain, rising slightly to the right
      part: the grain's leaves spreading
    - where: a long vertical down the grain, from the ear to the bottom
      part: the grain's stalk
    - where: a sweep from the middle of the stalk down to the lower left
      part: the grain's left leaf drooping
    - where: a short dot beside the stalk, slanting down to the right
      part: the grain's right leaf
    - where: a stroke at the top of the scale, running left and turning down to the left
      part: the hand's arm reaching down
    - where: a short dot under it, slanting down to the right
      part: the hand's first finger
    - where: a short dot at the upper right, slanting down to the right
      part: the hand's second finger
    - where: a short stroke at the right, down to the right and then down to the left
      part: the hand's thumb
    - where: a vertical down the left of the frame
      part: the frame's left cord
    - where: a line across from the top of the frame, turning down at the right and ending in a small hook to the left
      part: the frame's top and right side
    - where: a short line across inside the frame, rising slightly to the right
      part: the inner bar of the frame holding the grain
    - where: a short vertical starting above the frame, running down through it, ending on the beam
      part: the scale's centre pole
    - where: a long line across the bottom, rising slightly to the right, crossing the left cord and the right side
      part: the scale's long beam

算:
  object: an abacus of bamboo, with its frame, three rods of beads and two legs, standing on a table under two bamboo stalks
  history: >-
    An ideogram: a bamboo 竹 abacus 具. Counting rods and abacus frames were made from bamboo.
  layout: >-
    Two pale green bamboo stalks hang their leaves down at the top. Beneath them, a wooden abacus
    frame with three bead rods, in pale tan, stands on a long table board which has two legs
    spreading apart. No people.
  exact:
    - The two bamboo stalks stand free of each other; each has a short line across and a dot, and the two bars are about the same length.
    - The abacus frame's left side is a straight vertical; its top and right side are one line that turns down at the end.
    - The abacus's three rods are short lines across, rising slightly to the right, the lowest a little longer than the other two.
    - The frame's left side and the bottom rod meet at the bottom; the frame's top starts at the left side.
    - The table board is the longest line of the picture, more than twice as wide as the frame.
    - The left leg sweeps down to the left and crosses the board; the right leg is a long plain vertical and crosses the board too.
    - The right leg and the left sweep are about as long as each other, and the right leg starts where the frame's right side ends.
    - The left leg stands apart from the frame.
  strokes:
    - where: a stroke at the top left, down and then turning down to the left
      part: the left bamboo stalk
    - where: a short line across the stalk, rising slightly to the right
      part: the left stalk's leaves
    - where: a small dot beside it, slanting down to the right
      part: a leaf of the left stalk
    - where: a stroke at the top right, down and then turning down to the left
      part: the right bamboo stalk
    - where: a short line across the stalk, rising slightly to the right
      part: the right stalk's leaves
    - where: a small dot beside it, slanting down to the right
      part: a leaf of the right stalk
    - where: a vertical down the left of the middle, below the bamboo
      part: the abacus frame's left side
    - where: a line across the top of the frame, turning down at the right
      part: the abacus frame's top and right side
    - where: a short line across inside the frame, near the top
      part: the first rod with its beads
    - where: a short line across inside the frame, lower
      part: the second rod with its beads
    - where: a slightly longer line across at the bottom of the frame
      part: the third rod with its beads and the frame's base
    - where: a very long line across the lower part, nearly the full width
      part: the table board
    - where: a stroke from the board's left of the middle, sweeping down to the lower left
      part: the table's left leg
    - where: a long straight vertical from the board down to the bottom, right of the middle
      part: the table's right leg

複:
  object: a person walking back over their steps on a square of patterned cloth, beside a robe with the same pattern
  history: >-
    An ideogram: a cloth 衤 pattern 复. The right half draws a person turning back, retracing their
    steps, which is why it means again.
  layout: >-
    On the left, a long pale robe with crossed lapels, seen from the front. On the right, a person
    with a friendly face and a pale tunic, stepping back toward the left, one arm out to the right,
    standing above a square of pale patterned cloth with their feet stepping on it. Soft colours.
  exact:
    - The robe's collar is a short slanting dot standing free.
    - The robe's long line across starts at the left, rises slightly to the right and turns down to the lower left at the end.
    - The robe's vertical hangs from the middle of the long line.
    - The two small dots at the right of the robe do not touch each other's strokes except that the second starts where the first ends.
    - The person's body is a sweep and the arm line across the head is almost as long as the whole body sweep; they touch.
    - The cloth is a small box, its left side is a vertical and its top turns down on the right; its two inner bars are small.
    - The foot strokes, the first sweeps to the lower left, the second crosses the third, and the third is the longest stroke on the right.
  strokes:
    - where: a short stroke at the top, slanting down to the right
      part: the robe's collar
    - where: a long line across the upper part, rising slightly to the right, turning down to the lower left at its end
      part: the shoulders and the left lapel
    - where: a short vertical down the left-middle
      part: the inner panel of the robe
    - where: a small dot at the right of the robe, slanting down to the left
      part: a pattern spot
    - where: a small dot below it, slanting down to the right, starting where the first ends
      part: another pattern spot
    - where: a short stroke at the top of the right half, down and then turning down to the left
      part: the person's head and body
    - where: a line across from the middle of that stroke, rising slightly to the right
      part: the person's arm stretched out
    - where: a vertical in the middle of the right half, below the person
      part: the cloth square's left side
    - where: a line across the top of the cloth square, rising slightly, turning down to the right and then down
      part: the cloth square's top and right side
    - where: a small dot inside the square, rising to the right
      part: a spot of the pattern
    - where: a small dot below it inside the square, across to the right
      part: another spot of the pattern
    - where: a sweep from below the square on the left, down to the lower left
      part: the person's back foot
    - where: a line across, rising slightly to the right, turning down to the left, starting at the sweep's top
      part: the person's front leg stepping back
    - where: a long stroke from the middle running down to the lower right and then across to the right
      part: the person's long stride

盡:
  object: a hand holding a brush whose last drops of ink fall into an ink dish
  history: >-
    An ideogram: a brush 聿 using the last drops 灬 of ink 皿. The oldest form of 聿 draws a hand
    holding a brush; 皿 is a dish.
  layout: >-
    At the top, a hand holding an upright brush with a bamboo shaft, its pale grey bristles at the
    bottom of the shaft. Under the brush, four small drops fall in a row. At the bottom, a wide
    shallow ink dish in pale stone, with a little ink in it. No people.
  exact:
    - The hand is made of two lines across, one hooked, with one more line across below it; they all cross the brush's shaft.
    - The long line across at the top is the longest of the hand, about one and a half times as long as the line with the hook.
    - The brush's shaft is a long line from the top, slanting a little and then straight, ending on the bristle bar.
    - The bristle bar is shorter than the long hand line, about half its length.
    - The four ink drops stand free of everything, the first is a short sweep to the lower left, the other three are dots slanting down to the right.
    - The dish's left side slants down to the right; its rim turns down on the right and then to the lower left.
    - The two small strokes inside the dish are plain short verticals and stand free of the rim.
    - The dish's base is the longest line across the lower part, nearly as wide as the dish.
  strokes:
    - where: a line across the upper part, ending in a hook down to the left
      part: the hand's thumb and wrist
    - where: a long line across, the longest in the hand, crossing the shaft
      part: the hand's fingers gripping
    - where: a shorter line across below it
      part: the hand's lower edge
    - where: a long line from the top, slanting a little right and then straight down, crossing the three lines
      part: the brush's shaft
    - where: a line across the shaft's base, shorter than the long hand line
      part: the brush's bristles
    - where: a short sweep under the bristles on the left, down to the lower left
      part: the first drop of ink
    - where: a small dot under the bristles, slanting down to the right
      part: the second drop
    - where: a small dot beside it on the right, slanting down to the right
      part: the third drop
    - where: a short stroke on the right, slanting down to the right
      part: the fourth drop
    - where: a short stroke down to the right, in the left part of the dish
      part: the dish's left side
    - where: a line across the top of the dish, turning down to the lower left at its right end
      part: the dish's rim and right side
    - where: a short vertical inside the dish, left of the middle
      part: the ink's left ripple
    - where: a short stroke inside the dish, right of the middle, down to the right and then down
      part: the ink's right ripple
    - where: a very long line across the bottom
      part: the dish's base

疑:
  object: an old man bent over on the left, leaning on a cane, and a walking foot on the right taking a step
  history: >-
    An ideogram: an old man walking 疋 while holding 匕 a cane 矢. The oldest form drew an old man
    leaning on a stick, looking back in doubt.
  layout: >-
    On the left, a bent old man with a friendly lined face, white hair and a pale robe, stooping and
    leaning on a walking stick. On the right, a small hat above a leg and foot stepping to the right,
    pale. Soft colours.
  exact:
    - The old man's head stroke and his back stroke stand apart; the head stroke ends on the back.
    - The back stroke turns across and ends in a hook up.
    - His arm line across is about half as long as the line across below it; the long one is the longest line across of the left part and crosses the long sweep.
    - The long sweep from the arm line down to the lower left is clearly longer than his arm lines.
    - The small dot beside the stick stands free.
    - The hat is one line across that turns down to the left, with a dot that touches it.
    - On the right, the hip line across rises, turns down and ends in a hook down to the left; the long vertical is about as long as the hip line.
    - The small dot on the right touches the long vertical; the long stroke down to the right turns across and ends on the vertical.
  strokes:
    - where: a short stroke at the upper left, down to the left
      part: the old man's bent head
    - where: a stroke down from the top left, then turning across, rising slightly to the right, ending in a hook up
      part: the old man's stooped back and shoulders
    - where: a short stroke below, down and then down to the left
      part: the old man's arm on the stick
    - where: a short line across, left of the middle, rising slightly to the right
      part: the old man's other arm
    - where: a long line across the lower left, rising slightly to the right
      part: the old man's belt and the stick's crossbar
    - where: a long stroke from the middle of the arm line, down and then down to the left
      part: the old man's walking stick
    - where: a small dot at the lower left, slanting down to the right
      part: the stick's rubber tip
    - where: a line across the top of the right part, turning down to the left at its end
      part: the hat's brim
    - where: a small dot under the hat, slanting down to the right, touching the brim
      part: the hat's button
    - where: a line across the middle of the right part, rising slightly, turning down to the right and ending in a hook down to the left
      part: the hip and the front thigh
    - where: a long vertical down from the middle of that line
      part: the front leg
    - where: a small dot at the right, across to the right
      part: the front foot's toe
    - where: a stroke from the middle sweeping down to the lower left
      part: the back leg stepping
    - where: a stroke from the back leg's top, down to the right and then across to the right
      part: the back foot pushing off

舞:
  object: a dancer holding a feather fan on a long handle, her two feet stepping apart on the ground
  history: >-
    An ideogram: a dancer holding a fan of feathers, with her two feet 舛 stepping in opposite
    directions. The oldest form of 無 draws a dancer holding feathers.
  layout: >-
    A pale dancer with a friendly smiling face and a flowing pale dress stands behind a big fan of
    pale feathers, her face looking over the top of the fan. Her two feet step apart at the bottom, one
    to each side of the fan's long handle. Soft colours.
  exact:
    - The fan's top-left sweep ends turned down to the left; the line across it rises to the right and is clearly shorter than the line across below it, about half as long.
    - The four feather ribs cross the long line across and end on the fan's rim; they are about the same length, the right ones a little longer.
    - The fan's rim is the longest line across of the picture, as wide as the fan, and is much longer than the feathers' lines above.
    - The long handle starts under the rim and runs straight down to the bottom, ending in a plain point.
    - The left foot is a sweep with a dot beside it and a line across; the dot and the line do not touch.
    - The right foot's upper line across and its lower hooked turn cross the handle.
    - The left foot and the right foot do not touch each other.
