    - where: a sweep at the top left, down and turning down to the left
      part: the fan's top left feather tip
    - where: a line across the top, rising slightly to the right
      part: the fan's top rail
    - where: a longer line across below it, from the left to the right
      part: the fan's upper rim
    - where: a short vertical on the left, hanging down from the long line
      part: the first feather rib
    - where: a vertical a little right of it, hanging down from the long line
      part: the second feather rib
    - where: a vertical in the middle, hanging down from the long line
      part: the third feather rib
    - where: a stroke on the right, down to the right and then down
      part: the fourth feather rib
    - where: a very long line across the middle of the picture
      part: the fan's lower rim
    - where: a stroke from the rim at the left, down and then down to the left
      part: the left leg of the dancer
    - where: a line across from the leg's middle, then turning down to the lower left
      part: the left foot stepping away
    - where: a short dot beside it, slanting down to the right
      part: the left foot's toe
    - where: a line across on the right, rising slightly to the right
      part: the right leg of the dancer
    - where: a stroke down from the middle, then turning across to the right
      part: the right foot stepping away
    - where: a long straight vertical at the right of the middle, from the rim to the bottom
      part: the fan's long handle

誘:
  object: a mouth speaking elegant words on the left, and on the right a stalk of grain standing in a curved cradle
  history: >-
    An ideogram: to use elegant 秀 words 言. 秀 already draws a graceful stalk of grain; the words come
    out of a mouth.
  layout: >-
    On the left, a smiling open mouth speaking, with two short lines of words floating above it, in
    pale pink. On the right, a stalk of pale golden grain with its heavy ear drooping, standing in a
    pale curved cradle that wraps round its foot. No people.
  exact:
    - The words' top line is long, the two lines below it are short, and the top is about twice as long as either of them.
    - The mouth is a small box; its left side is a short plain vertical; its top turns down at the right; its base rises to the right, meeting the top's end.
    - The mouth's base starts on the left side and ends where the top-and-right stroke ends.
    - The grain's ear is a stroke from the upper right sweeping down to the left.
    - The grain's line across is the longest line across of the right half; the stalk starts under the ear and crosses it.
    - The grain's two lower leaves, a sweep to the lower left and a stroke going down to the right and across, start where the stalk crosses the line across; none of them touches the cradle.
    - The cradle is one long curved line with several turns, ending in a hook up to the left, and a second sweep that starts at its beginning.
  strokes:
    - where: a short stroke at the top of the left part, slanting down to the right
      part: the word-spark above the speaker
    - where: a long line across the upper left, rising slightly to the right
      part: the top line of words
    - where: a short line across below it, rising slightly to the right
      part: the second line of words
    - where: a short line across below that, rising slightly to the right
      part: the third line of words
    - where: a short vertical at the lower left
      part: the mouth's left side
    - where: a line across from the top of the left side, rising slightly, then turning down at its right end
      part: the mouth's top and right side
    - where: a short line rising to the right at the bottom of the mouth, meeting the right side's foot
      part: the mouth's lower lip
    - where: a stroke from the upper right of the right half, sweeping down to the left
      part: the grain's drooping ear
    - where: a line across the upper part of the right half, rising slightly to the right
      part: the grain's leaves
    - where: a stalk down, starting under the ear, slanting a little then straight down
      part: the grain's stalk
    - where: a stroke from the leaves down to the lower left
      part: the grain's left leaf
    - where: a stroke from the leaves down to the right and then across to the right
      part: the grain's right leaf
    - where: one long line starting in the middle of the lower right, running across, turning down, across and down again, and ending in a hook up to the left
      part: the cradle's curved base
    - where: a stroke from the start of the long line, running down and then sweeping down to the lower left
      part: the cradle's left prop

徴:
  object: a king in a mountain-shaped crown giving a command with a raised rod, while a walker on the left marches off
  history: >-
    An ideogram: to march 彳 on the king's 王 orders 攵. The oldest form drew a person setting out
    at a command.
  layout: >-
    On the left, a walker with a friendly face and a pale tunic taking small steps, seen from the
    side facing right. In the middle, a king with a friendly face, a crown shaped like a mountain,
    and a pale robe. On the right, a hand holding a rod and raised to give the order. The king is the
    tallest of the three. Soft colours.
  exact:
    - The walker's two upper strokes do not touch each other; the lower is longer than the upper.
    - The walker's lowest stroke is a plain vertical starting on the second stroke and does not reach the king.
    - The crown has a short centre peak, a bowl-shaped line across and a right peak; the bowl touches the centre peak and the right peak at its end.
    - The king's three bars are about the same length for the top two and the base is clearly longer, about one and three quarters as long.
    - The king's vertical starts on the top bar, crosses the middle bar and ends on the base.
    - The king's top bar and middle bar are both short; the middle bar rises to the right.
    - The rod starts on the commanding arm; the lower sweep starts on the rod and crosses the long falling stroke; the arm's end stands apart from the long falling stroke.
    - The long falling stroke is the longest on the right.
  strokes:
    - where: a stroke at the top left, down and then turning down to the left
      part: the walker's head and front leg
    - where: a longer stroke below it, down and then turning down to the left
      part: the walker's body and back leg
    - where: a long straight vertical at the lower left, starting on the second stroke
      part: the walker's long step
    - where: a short stroke at the top of the middle, slanting down to the right then straight down
      part: the crown's centre peak
    - where: a line down from the left, turning up to the right, ending under the right peak
      part: the crown's bowl
    - where: a short vertical at the top right of the crown
      part: the crown's right peak
    - where: a short line across in the middle, rising slightly to the right
      part: the king's shoulders
    - where: a short line rising to the right, below it
      part: the king's belt
    - where: a short vertical down from the shoulders, crossing the belt
      part: the king's body
    - where: a line rising to the right at the bottom, longer than the others
      part: the ground under the king
    - where: a stroke at the top of the right part, down and then down to the left
      part: the commanding arm
    - where: a line rising to the right, starting on the arm
      part: the rod pointing up
    - where: a stroke from under it, down to the right, down, and then down to the left, crossing the long falling stroke
      part: the forearm swinging
    - where: a long stroke from the middle, down to the right and then across to the right
      part: the long sleeve sweeping out

酸:
  object: a sour old wine jar with sour vapour curling out of it and two drops flung apart, a foot walking slowly past
  history: >-
    An ideogram: wine 酉 aged too long 夋. The oldest form of 酉 draws a wine jar with a narrow neck.
  layout: >-
    On the left, a tall pale ivory wine jar with a narrow neck and a round belly, with some wine
    inside. On the right, a curl of pale yellow-green vapour at the top, two small yellow drops flung
    apart below it, and under them a small bare foot stepping slowly toward the left. No people.
  exact:
    - The jar's lip is the longest line across of the jar, about as long as the line across the base.
    - The two neck strokes hang from the lip and stand free of each other; the left one is longer.
    - The jar's left side is a long plain vertical and the shoulder line leaves it and turns down on the right, ending on the base.
    - The shoulder line touches the jar's base at its end and the base starts at the bottom of the left side.
    - The wine level line is short, about half as long as the base, and stands free.
    - The vapour starts at the top, turns across and rises; the dot touches it.
    - The two flung drops are short, one slanting down to the left and the other down to the right, and do not touch each other.
    - The foot's first stroke sweeps to the lower left; the next stroke crosses the last, which is the longest.
  strokes:
    - where: a line across the top of the jar, rising slightly to the right
      part: the jar's lip
    - where: a long vertical down the left of the jar
      part: the jar's left side
    - where: a line across the jar's shoulder, then turning down along the right, ending at the foot of the jar
      part: the jar's shoulder and right side
    - where: a vertical hanging from the lip, left of the middle
      part: the jar's neck, left side
    - where: a stroke hanging from the lip, right of the middle, then turning down to the right
      part: the jar's neck, right side
    - where: a short line across inside the jar, rising slightly to the right
      part: the wine's surface
    - where: a longer line across the bottom of the jar, rising slightly to the right
      part: the jar's base
    - where: a stroke at the top right, down and then turning across, rising slightly to the right
      part: the curl of vapour
    - where: a short stroke on the vapour's right, slanting down to the right
      part: the vapour's tail
    - where: a short stroke below, slanting down to the left
      part: the left sour drop
    - where: a short stroke on the right, slanting down to the right
      part: the right sour drop
    - where: a stroke from the middle sweeping down to the lower left
      part: the foot's heel
    - where: a line across the lower right, then turning down and then down to the left
      part: the walker's leg bent
    - where: a long stroke from the middle down to the right and then across to the right
      part: the foot stepping slowly away

價:
  object: a merchant standing beside his market stall, which has an awning and a cowrie shell for money on it
  history: >-
    An ideogram: a merchant 亻賈, whose trade is buying and selling at a price. 賈 draws a cover over
    a cowrie shell, the old money.
  layout: >-
    On the left, a merchant with a friendly face and a pale robe, standing and facing right toward
    his stall. On the right, a stall under a pale cloth awning, and below the awning a big cowrie
    shell with ridges in it, standing on two small feet. Soft colours.
  exact:
    - The merchant's body is a long sweep down to the left and his leg a long plain vertical; they do not form one stroke.
    - The awning's top line is about as long as the awning's lower line with the turn, and the awning's outer line crosses two small posts.
    - The awning's three short posts are about the same length; the left one slants down to the right.
    - The shell's two outline strokes start at the same point at the top.
    - The shell's three ridges are short lines across, each shorter than the shell's width; the lowest is a little longer.
    - The shell's right outline ends where the lowest ridge ends.
    - The left foot sweeps down to the left and the right foot slants down to the right; neither touches the other, and the left foot does not touch the shell.
  strokes:
    - where: a long stroke at the left, down and then turning down to the left
      part: the merchant's body and one leg
    - where: a long straight vertical at the lower left
      part: the merchant's other leg
    - where: a line across the top of the right half, rising slightly to the right
      part: the awning's top
    - where: a short stroke at the left of the awning, slanting down to the right
      part: the awning's left post
    - where: a line across under the top, turning down at the right, long
      part: the awning's outer edge
    - where: a short vertical in the middle of the awning
      part: the awning's middle post
    - where: a short stroke on the right of the awning, down to the right and then down
      part: the awning's right post
    - where: a line across at the bottom of the awning, rising slightly to the right
      part: the awning's hem
    - where: a vertical down the left of the shell
      part: the shell's left side
    - where: a line across the top of the shell, then turning down at the right
      part: the shell's top and right side
    - where: a short line across inside the shell, rising slightly to the right
      part: the shell's first ridge
    - where: a similar short line below it
      part: the shell's second ridge
    - where: a longer line across at the bottom of the shell, ending on the right outline
      part: the shell's third ridge and base
    - where: a stroke below the shell, sweeping down to the left
      part: the shell's left foot
    - where: a stroke below the shell on the right, slanting down to the right
      part: the shell's right foot

播:
  object: a hand scattering seeds from the left over a field, a spread-out sheaf of rice standing above the field
  history: >-
    An ideogram: to sow seeds 番 by hand 扌. The oldest form of 番 draws grains scattered over a
    field, with a rice plant above.
  layout: >-
    On the left, an open hand reaching out, with a bare wrist, in a pale sleeve. Small pale seeds fly
    from it to the right. Above the field, a pale rice plant spreads its blades and grains. At the
    bottom right, a square field of dark soil divided into plots by pale furrows. No people.
  exact:
    - The hand's arm is one long plain vertical, ending in a small hook up to the left; it crosses the two short bars.
    - The hand's upper bar rises slightly to the right; the lower stroke rises more steeply to the right, crossing the arm.
    - The two seeds are a dot and a short sweep, free of every other stroke; the rice plant's drooping ear is a long sweep to the lower left.
    - The rice plant's line across is the longest line across of the right half; the plant's centre stalk crosses it.
    - The plant's two lower blades both start at the line across and do not touch each other; the left one is longer.
    - The field's left side and top start at the same point; the top turns down on the right and ends at the field's base.
    - The field's inner bar is short and the inner vertical crosses it.
    - The field's base is a little longer than the inner bar, and its start meets the left side's foot.
  strokes:
    - where: a line across the upper left, rising slightly to the right
      part: the hand's cuff
    - where: a long line down the left, from the top to near the bottom, ending in a small hook up to the left
      part: the arm and wrist
    - where: a stroke rising to the right at the lower left, crossing the arm
      part: the thumb reaching out
    - where: a long stroke at the top of the right half, sweeping down to the left
      part: the rice plant's drooping ear
    - where: a small dot at the upper left of the plant, slanting down to the right
      part: a flying seed
    - where: a short stroke at the top right, down to the left
      part: a second flying seed
    - where: a long line across the upper right, rising slightly to the right
      part: the rice plant's binding
    - where: a stroke down from above the binding, slanting then straight, crossing it
      part: the rice plant's centre stalk
    - where: a long stroke from the binding down to the lower left
      part: the rice plant's left blade
    - where: a stroke from the binding down to the right and then across to the right
      part: the rice plant's right blade
    - where: a vertical at the left of the field, below the plant
      part: the field's left edge
    - where: a line across the top of the field, rising slightly to the right, then turning down to the lower right
      part: the field's top and right edge
    - where: a short line across inside the field, rising slightly to the right
      part: a furrow across
    - where: a short vertical inside the field
      part: a furrow down
    - where: a line across the base of the field, rising slightly to the right
      part: the field's base
