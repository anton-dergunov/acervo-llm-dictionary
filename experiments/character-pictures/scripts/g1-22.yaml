# Full run, group g1, batch 22. Written from the fact sheets, following scripts/GUIDE.md.

寝:
  object: a person lying asleep on a bed under a blanket, inside a house with a roof
  history: >-
    An ideogram: a person lying down on a bed in their home. The roof covers the whole scene, the bed
    stands on the left and the sleeping person lies to its right.
  layout: >-
    A simple house roof covers the top of the square. Beneath it, a bed with a tall headboard on the
    left, and a person lying on it with the head toward the left, a calm sleeping face with closed
    eyes, a small nose and a mouth, wearing a pale nightshirt. A pale blanket covers the body, and the
    hand rests on top of it. Soft pale colours.
  exact:
    - The roof is one small dot at the peak, a short left wall, and one long line across the top that turns down at the right and ends in a small hook to the left.
    - The dot at the peak stands free of the roof line below it.
    - The bed's upright post is a straight vertical line, the longest vertical of the picture.
    - The small dot beside the bed post does not touch it.
    - The rising stroke at the bottom left ends on the middle of the bed post.
    - The long vertical on the left of the sleeper is clearly shorter than the bed post, about a fifth as long, a short stub.
    - The sleeper's three short bars, one above the other, are each shorter than the line below them with the hook.
    - The line with the hook, below them, is the longest line on the right and ends in a small hook down to the left.
    - The last two strokes cross each other in the middle; the long one runs down to the lower right and then across.
  strokes:
    - where: a short dot at the top centre, slanting down to the right
      part: the roof's peak
    - where: a short line down the upper left, below the peak
      part: the roof's left wall
    - where: a long line across the top, from the left wall to the right half, turning down at the right end with a small hook to the left
      part: the roof's ridge and its right edge
    - where: a long straight line down the left side, from the upper left nearly to the bottom, ending in a plain point
      part: the bed's headboard and post
    - where: a small dot left of the post, slanting down to the right, not touching the post
      part: the pillow on the bed
    - where: a short stroke rising to the right at the bottom left, ending on the middle of the bed post
      part: the bed's low footboard rail
    - where: a line across the upper middle, rising slightly to the right, then turning down at its right end
      part: the sleeper's head and back
    - where: a short line across below it, rising slightly to the right
      part: the sleeper's arm lying along the body
    - where: a short line across below that, rising slightly to the right, meeting the right end of the first line
      part: the folded edge of the blanket
    - where: a short stub of a vertical in the middle, below the three bars
      part: the sleeper's raised knee
    - where: a line across the middle, starting at the stub and ending in a small hook down to the left
      part: the top edge of the blanket
    - where: a line across below the blanket, rising slightly to the right, turning down and then down to the left
      part: the sleeper's lower legs, bent
    - where: a stroke from the middle sweeping down to the lower right and then across to the right
      part: the sleeper's long body lying toward the right, ending in the feet

罪:
  object: a bird caught under a net, its two wings spread apart back to back, the wrongdoer caught
  history: >-
    An ideogram: a net 罒 thrown over wrongdoing 非. The oldest form of 非 draws two wings spread
    away from each other, back to back, which came to mean going against what is right.
  layout: >-
    A fishing net hangs across the top of the square in its frame, its cords crossing. Beneath it,
    one bird with a friendly face seen from behind its back, with its two wings spread wide to the
    left and to the right, each wing made of a long spine with feathers on the outer side. The bird is
    pale grey and blue, the net a pale tan.
  exact:
    - The net's frame has a short left pole and a long top bar that turns down at the right end and sweeps to the lower left.
    - The net's two inner cords are short, side by side, and hang from the top bar to the line across under them, which closes the net.
    - Both wing spines are long vertical lines; the left one starts with a slight slant down to the right, the right one is straight.
    - The left wing has two short feathers pointing left, one above the other, and a longer rising feather below them; all three end on the left spine.
    - The right wing has three feathers pointing right, one above the other; the lowest is the longest, and they start on the right spine.
    - The two wings do not touch each other.
    - The net covers the top third and does not reach the wings, which begin just below it.
  strokes:
    - where: a short line down the upper left
      part: the net frame's left pole
    - where: a line across the top, turning down to the lower left at the right end
      part: the net's top bar and its right edge
    - where: a short line down in the upper centre, left of the middle
      part: a net cord hanging down
    - where: a short line down in the upper centre, right of the middle
      part: a second net cord hanging down
    - where: a line across the bottom of the net, rising slightly to the right, joining the left pole and the top bar
      part: the bottom rim of the net
    - where: a long line down the left half, starting with a slant to the right and then running straight down
      part: the left wing's spine
    - where: a short line across on the left, ending on the left spine, in the upper part
      part: the left wing's upper feather
    - where: a short line across on the left, ending on the left spine, below the first
      part: the left wing's middle feather
    - where: a longer stroke rising to the right at the lower left, ending on the left spine
      part: the left wing's lowest feather
    - where: a long straight line down the right half, from just below the net to the bottom
      part: the right wing's spine
    - where: a short line across to the right, starting at the top of the right spine
      part: the right wing's upper feather
    - where: a short line across to the right, starting at the middle of the right spine
      part: the right wing's middle feather
    - where: a slightly longer line across to the right, starting lower on the right spine
      part: the right wing's lowest and longest feather

錯:
  object: a heap of gold on the left, and on the right the sun of days long past, sinking below an old gate
  history: >-
    An ideogram: gold 金 that once was 昔 but is lost. 昔 draws the days gone by, the sun 日 under
    stacked layers of earlier time.
  layout: >-
    The left third shows a small pile of gold bars and nuggets lying on the ground, pale yellow, with
    a few small glints. The right two thirds show a pale orange sun resting low on a long plank, with
    two upright posts and a crossbar standing above it like an old gate through which the sun is
    seen; the gate is faded and grey. No people.
  exact:
    - The left sweep starts at the top and ends far down at the left; a short dot touches it in the upper middle and there is a tiny gap between the sweep and the first bar.
    - The upper bar on the left is short, the lower one a little longer, about one and a quarter times as long.
    - The vertical on the left crosses the lower bar and ends on the long rising stroke at the bottom.
    - The two small dots beside the pile stand free of everything.
    - On the right, the top bar crosses both posts; the posts end on the long plank below.
    - The long plank is the longest line on the right, about one and a half times as long as the top bar.
    - The sun is a small box whose left side and bottom curve are one stroke; its inner bar is short and touches the left side.
    - The sun's bottom bar is short and ends on the box's curved side.
  strokes:
    - where: a sweep down the upper left, starting at the top, turning and ending low at the far left
      part: the left slope of the gold heap
    - where: a short dot-like stroke at the top, slanting down to the right, touching the sweep
      part: a glint of light at the top of the heap
    - where: a short line across in the middle of the left part, rising slightly to the right
      part: the upper gold bar
    - where: a slightly longer line across below it, rising slightly to the right
      part: the lower gold bar
    - where: a short vertical down the left part, starting on the upper bar and crossing the lower bar
      part: a stake standing in the heap
    - where: a tiny dot at the lower left, slanting down to the right, standing free
      part: a small nugget on the left
    - where: a tiny dot beside the heap on the right, slanting down to the left, standing free
      part: a small nugget on the right
    - where: a long stroke rising to the right along the bottom of the left part
      part: the ground the heap lies on
    - where: a line across the upper middle of the right part, rising slightly to the right
      part: the gate's crossbar
    - where: a short stroke down to the right, then straight down, in the upper left of the right part, crossing the crossbar
      part: the gate's left post
    - where: a stroke down from the top, slightly right of centre, crossing the crossbar
      part: the gate's right post
    - where: a long line across the middle of the right part, rising slightly to the right, under both posts and touching their ends
      part: the long plank the gate stands on
    - where: a short line down in the lower middle, just below the plank
      part: the sun's left side
    - where: a line across to the right, starting at the top of the left side and turning down at its end to the lower right
      part: the sun's top and rounded right side
    - where: a short line across inside the sun, rising slightly to the right, touching its left side
      part: the sun's centre line
    - where: a short line across at the bottom of the sun, rising slightly to the right, ending on the right side
      part: the sun's bottom edge, sinking away

