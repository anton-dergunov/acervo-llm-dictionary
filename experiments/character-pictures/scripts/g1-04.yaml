# Full run, group g1, batch 04. Written from the fact sheets, following scripts/GUIDE.md.

記:
  object: spoken words on the left being noted down as a private note on the right, a speaking mouth beside a knotted cord
  history: >-
    An ideogram: a private note 己 made of speech 言. The component 己 began as a winding cord and
    also gives the sound.
  layout: >-
    The left half is a speaking mouth with three lines of spoken words stacked above it and one
    small spark of sound at the very top; the mouth is an open pair of pale pink lips. The right
    half is a pale cord folded and knotted into a private note: a bent top fold, a short band
    across its middle, and a long tail that runs down, curves right and turns up at its end.
    Colours are pale: soft pink lips, pale cream cord. Nothing in the picture is a person.
  exact:
    - The top line of spoken words on the left is long; the two lines under it are each less than half as long.
    - The cord's top fold is the longest line across, the top line of spoken words is about three quarters as long as it, and the band across the cord's middle is less than half as long as the fold.
    - The mouth's left side and its upper lip start together; its lower lip is a short line that touches the mouth's left side and ends on the lip's corner.
    - The cord's top fold turns down to the left, and its short band touches both the fold and the long tail.
    - The long tail goes down, then turns across to the right and ends in a small hook up.
    - The spark of sound at the top left stands free of every other stroke, as do the three lines of words.
  strokes:
    - where: a short stroke at the top of the left half, slanting down to the right
      part: the spark of sound, the word leaving the mouth
    - where: a long line across the upper left half, about three quarters as long as the cord's top fold, rising a little to the right
      part: the first and longest line of spoken words
    - where: a short line across below it, rising a little to the right, less than half as long as the one above
      part: the second line of spoken words
    - where: a short line across below that, rising a little to the right, also less than half as long as the top one
      part: the third line of spoken words
    - where: a short line down the left side of the lower left half
      part: the mouth's left corner and left side
    - where: a line across the mouth's top, rising a little to the right, turning down at the right to run down the right side
      part: the upper lip, curving down into the mouth's right corner
    - where: a short line across the bottom of the left half, between the left side and the right corner
      part: the lower lip
    - where: a line across the top of the right half, the longest line across in the whole character, turning back down to the left
      part: the cord's top fold
    - where: a short line across the middle of the right half, less than half as long as the fold, from the fold to the tail
      part: the band that ties the cord into a note
    - where: a long line down from the middle of the right half, then curving across to the right and ending in a small hook up
      part: the cord's long tail, curling out at its end

记:
  object: spoken words on the left being noted down as a private note on the right, a speaking mouth beside a knotted cord
  history: >-
    An ideogram: a private note 己 made of speech 讠. The component 己 began as a winding cord and
    also gives the sound.
  layout: >-
    The left half is a speaking lip line, drawn as a curved pale pink lip rising from the left and
    turning down at the right into a chin, with a spark of sound above it. The right half is a pale
    cord folded and knotted into a private note: a bent top fold, a short band across its middle,
    and a long tail that runs down, curves right and turns up at its end. Colours are pale: soft
    pink lip, pale cream cord. Nothing in the picture is a person.
  exact:
    - The spark of sound at the top left stands free of every other stroke, as does the lip line under it.
    - The cord's top fold is clearly shorter than the lip line, about three fifths as long.
    - The lip line rises a little to the right, turns down at the right and ends in a small hook up.
    - The cord's top fold turns down to the left, and its short band touches both the fold and the long tail.
    - The long tail goes down, then turns across to the right and ends in a small hook up.
  strokes:
    - where: a short stroke at the top of the left half, slanting down to the right
      part: the spark of sound, the word leaving the mouth
    - where: a long line across the lower left half, rising a little to the right, turning down at its right end and finishing in a small hook up
      part: the speaking lip and chin
    - where: a line across the top of the right half, about three fifths as long as the lip line, turning back down to the left
      part: the cord's top fold
    - where: a short stroke in the middle of the right half rising to the right, from the fold toward the tail
      part: the band that ties the cord into a note
    - where: a long line down from the middle of the right half, then curving across to the right and ending in a small hook up
      part: the cord's long tail, curling out at its end

由:
  object: a road leading up to a farm field, a path running into the middle of a ploughed field from above
  history: >-
    An ideogram: a road 丨 leading to the farm 田. The field is the square frame with its cross
    bar, and the road is the line that runs on above it.
  layout: >-
    A square pale green field fills the lower three quarters of the frame, with a pale brown road
    running from the very top of the frame straight down through the field's top edge into its
    middle. The field has furrows and a few small pale crops between the strokes. No person.
  exact:
    - The road is a straight line that begins above the field's top edge and ends on the field's bottom edge, with no hook.
    - The road is longer than the field is wide to its left side, and it crosses the field's top edge and the field's middle bar.
    - The field's middle bar crosses the road but stops short of the left side of the field.
    - The field's left side starts at its top left corner and ends where the bottom edge begins.
    - The field's right side runs down to the bottom right corner, where the bottom edge ends.
  strokes:
    - where: a short line down the left side of the field, slanting a little to the right
      part: the field's left edge
    - where: a long line across the top of the field, turning down at the right and running down the right side
      part: the field's top edge and right edge, one fence line
    - where: a line across the middle of the field, rising a little to the right, crossing the road
      part: the furrow across the middle of the field
    - where: a long straight line from above the top edge down through the middle of the field to its bottom edge
      part: the road leading into the farm
    - where: a line across the bottom of the field, rising a little to the right, longer than the middle line
      part: the field's bottom edge

東:
  object: the sun rising behind a tree
  history: >-
    An ideogram: the sun 日 caught in the branches of a tree 木, the east where it rises. The
    modern form keeps the tree and the sun as one tangle of lines.
  layout: >-
    A tall tree fills the frame from top to bottom, with a pale leafy crown around its top. A big
    round pale golden sun sits low on the trunk, behind the strokes, its rim following the sun's
    four strokes in the middle of the picture. Pale roots spread under the tree. No person.
  exact:
    - The trunk is a straight vertical line ending in a plain point at the bottom, with no hook, and it crosses the branch line, both of the sun's inner bars and the sun's top.
    - The branch line across the top is short, about half as long as the sun's top line, and the trunk crosses its middle.
    - The sun's left side and its top-and-right side start together at the sun's top left corner.
    - The sun's top-and-right side ends where the sun's bottom line ends, at the lower right.
    - The sun's two inner bars float free of the sun's sides; the upper one is about three fifths as long as the branch line, the lower one about four fifths.
    - The left root starts on the trunk where it meets the sun's bottom line, and sweeps down to the bottom left; it does not touch the right root.
    - The right root starts at the trunk, runs down to the right and turns across to the right at its foot.
  strokes:
    - where: a short line across the upper part of the tree, rising a little to the right
      part: the tree's branches
    - where: a short line on the left side of the middle, slanting down to the right
      part: the sun's left rim
    - where: a long line across the middle, from the sun's top left to its right, then turning down at the right and running to the lower right
      part: the sun's top and right rim
    - where: a short line across the sun's middle, rising a little to the right, crossing the trunk
      part: the bright band at the sun's heart
    - where: a line across the lower part of the sun, rising a little to the right, crossing the trunk
      part: the sun's bottom rim
    - where: a long straight line down the middle from the top of the frame nearly to the bottom, crossing the branch line and the sun
      part: the tree's trunk
    - where: a sweep from the trunk's middle down and out to the bottom left
      part: the root spreading left
    - where: a sweep from the trunk's middle down to the right, turning across to the right at its foot
      part: the root spreading right

东:
  object: the sun rising behind a tree
  history: >-
    An ideogram: the sun 日 caught in the branches of a tree 木, the east where it rises. The
    simplified form keeps only the shape of the tree.
  layout: >-
    A tree fills the frame, with a big round pale golden sun rising behind its crown, higher than
    the middle of the picture and wider than the trunk. The tree's trunk runs down from the top
    and its foot bends out to the right; a root hangs under the crossing, and two small roots
    spread to either side below it. Pale colours. No person.
  exact:
    - The line across the top is the longest line across and rises a little to the right; the long stroke crosses it at its middle.
    - The long stroke goes down from the top, then turns across to the right; the turn is its end.
    - The root under the crossing goes down and ends in a small hook up to the left; it is about two thirds as long as the long stroke.
    - The two small roots are short, slanting down and out, one to the left and one to the right; they stand free of every other stroke.
  strokes:
    - where: a long line across the upper part of the frame, rising a little to the right
      part: the tree's branches, spread wide
    - where: a long line down from the top centre, then turning across to the right near the middle
      part: the trunk, bending out into a bough that points to the right
    - where: a line down from the middle of the trunk to the lower part of the frame, ending in a small hook up to the left
      part: the trunk's lower root
    - where: a short stroke at the lower left, slanting down to the left
      part: the small root spreading left
    - where: a short stroke at the lower right, slanting down to the right
      part: the small root spreading right

正:
  object: a bare foot stepping up to a line and stopping exactly on it
  history: >-
    An ideogram: a foot 止 stopping at the right place, marked by the line 一. The oldest forms
    drew a foot beneath a mark.
  layout: >-
    A bare foot seen from above, toes up, fills the lower part of the frame, standing on the long
    line along the bottom as its ground. A short line across the top is the mark the foot is
    walking to. Pale skin, a pale warm floor. No person, only the foot.
  exact:
    - The top line is clearly shorter than the bottom line, a little over half as long.
    - The foot's long middle line starts on the middle of the top line and ends on the middle of the bottom line.
    - The right toe line starts on the middle line and runs across to the right; it is about a quarter as long as the bottom line.
    - The left toe line stands on the bottom line, slanting down to the right, and does not touch the middle line.
    - The bottom line is the longest stroke, spanning nearly the whole width.
  strokes:
    - where: a short line across the top, a little over half as long as the bottom line, rising a little to the right
      part: the mark the foot comes to
    - where: a line down the middle, from the top line to the bottom line, slanting a little to the right and then straight
      part: the foot's long middle line, from the toes to the heel
    - where: a short line across the right side, from the middle line to the right
      part: the foot's inner toe
    - where: a line on the left side, slanting down to the right, ending on the bottom line
      part: the foot's outer edge
    - where: a long line across the bottom, from the far left to the far right
      part: the ground the foot stands on

白:
  object: a burning candle, with its flame above it
  history: >-
    The oldest forms drew a flame on a candle, or the rays of the sun. The modern form keeps a
    small tick above a box.
  layout: >-
    A pale cream candle stands in the lower two thirds of the frame, with a small gentle flame
    hovering above its top left corner. The flame is pale yellow and orange-pink, drawn behind the
    top stroke; the candle has a soft pink wax band across its middle. Nothing is black. No person.
  exact:
    - The small stroke on top ends on the candle's top left corner; it does not touch the left side below it.
    - The candle's left side and the top-and-right side start together at the top left corner.
    - The middle band starts on the left side and stops short of the right side, as long as the bottom line.
    - The bottom line starts on the left side and ends on the end of the top-and-right side, closing the candle.
    - The top-and-right side runs across then down, and is about three times as long as the middle band.
  strokes:
    - where: a short stroke at the top, slanting down to the right and then back down to the left, above the candle's top left
      part: the flame
    - where: a line down the left side of the box, slanting a little to the right
      part: the candle's left side
    - where: a long line across the top, turning down at the right and running down the right side to the bottom
      part: the candle's top rim and right side
    - where: a short line across the middle, from the left side, stopping before the right
      part: the soft wax band round the candle
    - where: a short line across the bottom, from the left side to the right side
      part: the candle's base

司:
  object: an officer with his arm raised, giving orders from his open mouth
  history: >-
    An ideogram: a person speaking orders 口 and raising their arm. The raised arm is the long
    hooked stroke that wraps over the top and down the right.
  layout: >-
    An officer stands in simple pale robes; his face is on the left, with two eyes above the
    brow line, a nose, and a wide-open mouth in the lower left. His arm rises over the top of
    the picture and comes down on his right side as a long sleeve ending in a hook at the hem.
    Pale robe, soft skin.
  exact:
    - The raised arm is the longest stroke; it runs across the top, turns down on the right side and ends in a small hook up to the left.
    - The brow line stands free, short, and rises a little to the right.
    - The mouth's left side and its upper lip start together; the lower lip starts on the left side and stops at the corner of the upper lip.
    - The lower lip is clearly shorter than the upper lip, about half as long.
    - The mouth is small compared with the arm, in the lower left of the picture.
  strokes:
    - where: a long line across the top, then down the right side to the bottom, ending in a small hook up to the left
      part: the raised arm and long sleeve, hooked at the hem
    - where: a short line across the upper left, rising a little to the right
      part: the officer's brow
    - where: a short line down the left of the mouth
      part: the mouth's left corner
    - where: a line across the top of the mouth, curving down at the right with a small hook
      part: the upper lip, curving down into the right corner
    - where: a short line across the bottom of the mouth, about half as long as the upper lip, from the left side to the right corner
      part: the lower lip

平:
  object: a leveling scale, a balance whose beam sits flat on its post
  history: >-
    The oldest forms drew a leveling scale, with a bar balanced on a post and weights at either
    side. The modern form keeps the post, the beam and two small marks.
  layout: >-
    A wooden post stands in the centre of the frame, with a top cap across its head. A long flat
    beam crosses the post at its middle, perfectly level. Two small pale weights sit above the
    beam, one on each side. Pale wood and pale brass, no person.
  exact:
    - The post is a straight vertical line, ending in a plain point at the bottom with no hook; it starts on the middle of the top cap.
    - The beam is about twice as long as the top cap, and the post crosses its middle.
    - The right weight is longer than the left weight, and ends in a short turn back to the left.
    - Both weights stand free of the post and the beam.
  strokes:
    - where: a short line across the top, rising a little to the right
      part: the top cap of the scale
    - where: a short stroke in the upper left, slanting down to the right
      part: the left weight
    - where: a longer stroke in the upper right, slanting down to the left
      part: the right weight
    - where: a long flat line across the middle of the frame, from the left to the right
      part: the beam
    - where: a long straight line down the middle, from the top cap to the bottom
      part: the post

北:
  object: two people sitting back to back, each facing away from the other
  history: >-
    The oldest forms drew two people sitting back to back, which came to stand for turning the
    back, the north. The right figure is 匕.
  layout: >-
    Two seated people fill the frame, with a clear gap between them. The left one faces left, her
    back a straight line; the right one faces right, bent forward with a rounded back. Both have
    friendly faces with eyes, a nose and a mouth, and wear simple pale clothes in different soft
    colours.
  exact:
    - The two people do not touch each other.
    - The left person's back is a straight vertical line, plain at the bottom; her arm touches it in the middle and her seat touches its foot.
    - The right person's back is a long stroke; it goes down, turns down to the right, then along the ground and up in a small hook.
    - The right person's arm touches her back in the middle and does not touch the top.
  strokes:
    - where: a straight line down the left half, slightly right of centre of that half
      part: the left person's back
    - where: a short stroke from the left, rising to the right, touching the back at its middle
      part: the left person's arm
    - where: a short line across the bottom left, rising to the right at its end, touching the back's foot
      part: the left person's folded legs
    - where: a short stroke in the upper right, slanting down to the left
      part: the right person's arm, reaching toward her knees
    - where: a long stroke starting at the top of the right half, going down, then turning down to the right, then across with a small rise and a hook up at its end
      part: the right person's head, back, folded legs and feet

处:
  object: a walker's foot coming to a place and planting a flag there
  history: >-
    An ideogram: to go somewhere 夂 and put down a flag 卜. The foot 夂 is a foot walking toward the
    right.
  layout: >-
    A walking person is seen as a pair of legs and boots at the left, with a friendly face above
    that is only suggested by a pale head, and simple pale clothes. At the right, a flagpole is
    planted in the ground with a pale flag fluttering from it. Pale colours.
  exact:
    - The pole is a straight line slanting a little to the right, longer than the flag stroke; it stands free of the legs.
    - The flag cloth is a short stroke slanting down to the right beside the pole, with a small gap from the pole.
    - The walker's first stroke does not touch the long sweep at the bottom; the second stroke starts on the first, crosses the long sweep and ends at the bottom left.
    - The long sweep at the bottom starts in the middle of the left half and runs far to the right, ending in a flat stretch.
  strokes:
    - where: a stroke in the upper left, down and then bending down to the left
      part: the walker's back leg
    - where: a line across from the middle of the left leg, rising a little to the right, turning down and then down to the left to the bottom left
      part: the walker's front leg, bending at the knee and ending at the boot
    - where: a long stroke from the left middle, sweeping down to the right and turning into a flat stretch across to the right
      part: the path the foot steps along
    - where: a long stroke down the right half, slanting a little to the right
      part: the flagpole
    - where: a short stroke on the right of the pole, slanting down to the right, with a small gap from the pole
      part: the flag

朮:
  object: a tree with a small seed above its right side
  history: 'A variant of 术: a tree 木 with a small dot beside its top.'
  layout: >-
    A tree fills the frame, with a short branch line high up, a straight trunk, and two roots below
    that start apart from the trunk. A small pale round seed floats above the trunk on the right.
    Pale leaves surround the treetop, behind the strokes. No person.
  exact:
    - The trunk is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The branch line rises a little to the right and the trunk crosses its middle.
    - The left root and the right root do not touch the trunk or each other.
    - The right root goes down, turns across to the right and ends in a small hook up; it is nearly as long as the trunk.
    - The seed is a small dot above the right of the trunk, and stands free of everything.
  strokes:
    - where: a line across the upper middle, rising a little to the right
      part: the tree's branches
    - where: a long straight line down the middle, from the top to the bottom
      part: the trunk
    - where: a sweep in the lower left, starting left of the trunk and going down to the bottom left
      part: the left root, apart from the trunk
    - where: a stroke in the lower right, starting right of the trunk, going down and turning across to the right with a small hook up
      part: the right root, apart from the trunk
    - where: a small dot at the top right of the trunk, slanting down to the right
      part: the seed hanging above

半:
  object: an ox splitting a log in half, an ox's head under a log cut into two pieces
  history: >-
    An ideogram: a cow 牛 splitting 丷 wood in half. The two ticks are the two halves of the log
    coming apart.
  layout: >-
    An ox's head seen from the front fills the lower and middle frame, with its horns, brow and ears
    held out to the sides. Above its head, two halves of a log lean toward each other at the base
    as they fall apart. Pale brown ox, pale yellow wood. The ox has a calm face.
  exact:
    - The two halves of the log are separate and stand free of everything; the right half is longer than the left, about half as long again.
    - The brow line is short, about half as long as the ears line, and rises a little to the right.
    - The ears line is long, nearly the whole width of the picture.
    - The long vertical crosses the brow line and the ears line, and ends at the bottom in a plain point, with no hook.
  strokes:
    - where: a short stroke in the upper left, slanting down to the right
      part: the left half of the log
    - where: a longer stroke in the upper right, slanting down to the left
      part: the right half of the log
    - where: a short line across the upper middle, rising a little to the right
      part: the ox's brow between its horns
    - where: a very long line across the middle, from near the left edge to near the right edge
      part: the ox's ears and horns, held out to both sides
    - where: a long straight line down the centre from the top to the bottom
      part: the ox's long face, down to its muzzle

佈:
  object: a person on the left announcing, while a cloth banner hangs held in a hand on the right
  history: >-
    An ideogram: a person 亻 making an announcement 布, the cloth 巾 held in a hand and hung up.
    The cloth is also the sound.
  layout: >-
    The person fills the left third and faces right, with a friendly face, eyes, a nose and an open
    mouth, and simple pale clothes. At the right, a hand comes in from the top holding a pale cloth
    that hangs over a rod on a stand. Pale cloth, pale wooden stand.
  exact:
    - The person's body stroke sweeps down to the left, and the legs line starts on the middle of the body stroke.
    - The hand's long sweep goes down to the left from the top and crosses the line across.
    - The line across rises a little to the right; the long sweep crosses its middle.
    - The cloth's short left edge touches the hand's sweep; the rod with the right edge has a small gap from the sweep.
    - The stand is a straight vertical line with no hook, and does not touch the line across above it.
    - The rod stroke goes across, turns down and ends in a small hook to the left.
  strokes:
    - where: a stroke from the top of the left third, going down and turning down to the left
      part: the person's head, arm and body, sweeping to the left
    - where: a short line down the left third, starting on the middle of the first stroke
      part: the person's legs
    - where: a line across the upper right, rising a little to the right, crossing the hand's sweep
      part: the arm of the hand, reaching in
    - where: a long stroke starting at the top middle, going down and sweeping to the left
      part: the hand and its thumb, gripping the cloth
    - where: a short line down in the middle of the right half, starting on the sweep
      part: the cloth's left edge, hanging
    - where: a line across, rising a little to the right, turning down at the right and ending in a small hook to the left
      part: the rod with the cloth over it, and the cloth's right edge, curling at its hem
    - where: a long straight line down from just below the line across, to the bottom
      part: the stand that holds the rod

布:
  object: a cloth banner held in a hand, hung over a rod on a stand
  history: >-
    An ideogram: cloth 巾 held in a hand. The hand is the long sweep at the left; the cloth hangs
    from a rod on a stand.
  layout: >-
    A hand comes in from the top left and holds a pale cloth that hangs over a rod on a stand, at
    the centre of the picture. The cloth is pale and soft; the stand is pale wood. No person, only
    the hand and its sleeve.
  exact:
    - The arm line across the top rises a little to the right; the hand's sweep crosses its middle.
    - The stand is a straight vertical line with no hook, and does not touch the arm line.
    - The rod stroke goes across, turns down and ends in a small hook to the left; the stand crosses it.
    - The cloth's short left edge touches the hand's sweep and starts where the rod begins.
  strokes:
    - where: a long line across the top, rising a little to the right
      part: the sleeve and arm reaching in
    - where: a long stroke starting at the top middle, going down and sweeping to the lower left
      part: the hand and its thumb, gripping the cloth
    - where: a short line down in the left of the lower half, starting on the sweep
      part: the cloth's left edge, hanging
    - where: a line across, rising a little to the right, turning down at the right and ending in a small hook to the left
      part: the rod with the cloth over it, and the cloth's right edge, curling at its hem
    - where: a long straight line down the centre, from below the arm line to the bottom
      part: the stand that holds the rod

示:
  object: a stone altar, with an offering slab on top of a table on a post
  history: >-
    The oldest forms drew an altar: a flat table on a post, often with something laid on top. The
    modern form keeps the slab, the table and the post with its bracing.
  layout: >-
    A stone altar stands in the centre of the frame with a pale flat offering slab hovering above
    its table. A thick post holds up the table, and two braces spread out below it. Pale grey
    stone. No person.
  exact:
    - The offering slab on top is short, a little under half as long as the table.
    - The table is a long flat line, nearly the width of the picture.
    - The post starts on the middle of the table and ends in a small hook up to the left.
    - The two braces are short and stand free of the post, slanting down and out, one on each side.
    - The slab stands free of the table.
  strokes:
    - where: a short line across the upper middle, a little under half as long as the table, rising a little to the right
      part: the offering slab lying above the altar
    - where: a long line across the middle, from the left to the right
      part: the altar's table top
    - where: a line down the centre from the middle of the table, ending in a small hook up to the left
      part: the post that holds the table
    - where: a short stroke at the lower left, slanting down to the left
      part: the left brace
    - where: a short stroke at the lower right, slanting down to the right
      part: the right brace

失:
  object: a man letting something fall from his hand, a small parcel tumbling beside him
  history: >-
    An ideogram: something 丿 falling from a hand 夫. The man 夫 is a person 大 with a pin in his
    hair.
  layout: >-
    A man stands facing front with a friendly face, eyes, a nose and a mouth, and simple pale
    clothes, his arms held out wide. A small pale parcel tumbles through the air at the upper left,
    beside his left hand. His hat-pin is the short line across his head.
  exact:
    - The falling parcel is a short slanting stroke at the upper left; it touches the hat-pin line's left end and is less than a third as long as the man's long leg.
    - The hat-pin line across his head is short and rises a little to the right; the left leg crosses it.
    - The hat-pin is clearly shorter than the arms line, a little over half as long.
    - The arms line is long and the left leg crosses it; the right leg starts on both the arms line and the left leg.
    - The left leg is the longest stroke, going all the way from the top to the bottom left.
    - The right leg sweeps down to the right and turns across to the right at its foot.
  strokes:
    - where: a short stroke at the upper left, going down and turning down to the left
      part: the falling parcel
    - where: a short line across the top, from the falling stroke, a little over half as long as the arms line, rising a little to the right
      part: the man's hat-pin, across his head
    - where: a long line across the middle, from the left to the right
      part: the man's outstretched arms
    - where: a very long stroke from the top centre, going down and sweeping to the bottom left
      part: the man's head, body and left leg
    - where: a stroke from the middle of the body, sweeping down to the right and turning across to the right at its foot
      part: the man's right leg and foot

史:
  object: a hand holding a writing brush upright in a brush pot with an open mouth
  history: >-
    An ideogram: a hand 乂 using a pen to record a history. The oldest forms drew a hand holding a
    brush.
  layout: >-
    A pale brush pot with an open top stands at the upper left, with a long brush standing in it
    that rises above and sinks to the left below. A hand sweeps in from the left across the middle
    and down to the right, gripping the brush. Pale ceramic, pale wood, soft skin; the hand is only
    a hand.
  exact:
    - The pot's left side starts at the pot's top left corner, where the upper edge also starts.
    - The pot's right side ends in a small hook down to the left, and touches the end of the pot's bottom line.
    - The pot's bottom line is shorter than its upper edge, about half as long.
    - The brush is the longest stroke, from the top centre to the bottom left; it crosses the pot's upper edge and bottom line.
    - The hand crosses the brush near its middle and turns across to the right at its end.
  strokes:
    - where: a short line down the left of the pot, slanting a little to the right
      part: the pot's left side
    - where: a line across the top of the pot, ending in a small hook down to the left
      part: the pot's upper rim and right side
    - where: a short line across the lower part of the pot
      part: the pot's bottom
    - where: a very long stroke from the top centre, going down and sweeping to the bottom left
      part: the brush, standing in the pot
    - where: a long stroke from the left middle, going across, then down to the right and across to the right again
      part: the hand and arm, gripping the brush

包:
  object: a baby, with a face, swaddled in a blanket that wraps round it from the top
  history: >-
    An ideogram: to swaddle 勹 a baby 巳. The wrapper 勹 also gives the sound.
  layout: >-
    A pale blanket wraps round a baby from the top and the right. The baby's face looks out of the
    opening at the left, with eyes, a nose and a small mouth. Its curled body fills the lower part
    of the frame. Soft pale blue blanket, pale pink skin.
  exact:
    - The blanket's left fold goes down and bends to the lower left; the blanket's top-and-right fold starts on its middle.
    - The blanket's right fold goes across, turns down and ends in a small hook up to the left.
    - The baby's head loop is formed by two short strokes that meet at their ends, with a small gap from the blanket's left fold.
    - The baby's long body stroke starts at the top left of the loop, goes down, curls across to the right, and turns up at its end.
  strokes:
    - where: a stroke at the upper left, going down and bending down to the left
      part: the blanket's left fold
    - where: a long line across the top, rising a little to the right, turning down at the right and ending in a small hook up to the left
      part: the blanket's top and right fold
    - where: a short stroke in the middle left, rising to the right and turning down
      part: the baby's brow and forehead
    - where: a short line across below it, rising a little to the right
      part: the baby's cheek and chin
    - where: a long stroke down the left side of the lower half, curling across the bottom to the right and turning up at its end
      part: the baby's curled body and legs

乐:
  object: a musical instrument with wood, strings and a pick
  history: >-
    An ideogram: a musical instrument with wood 木, strings 幺 and a pick 白. The simplified form
    keeps the pick, the frame and the wooden stand as five strokes.
  layout: >-
    A pale stringed instrument fills the frame, mounted on a small pale wooden stand. A pale pick
    hangs at the top above the strings. The strings are a loop of pale cord stretched across the
    frame. Pale wood, pale cream cord. No person.
  exact:
    - The pick is a slanting stroke from the top right ending on the strings' start at the left.
    - The strings stroke goes down on the left, then turns across rising to the right, then continues across to the right.
    - The wooden post crosses the strings, and ends in a small hook up to the left; it is nearly as long as the strings' downward stroke.
    - The two small legs are short and stand free of every other stroke.
  strokes:
    - where: a stroke in the upper middle, sweeping from the top right down and out to the left
      part: the pick
    - where: a long line starting at the upper left, going down, then turning across, rising a little to the right, and continuing to the right
      part: the strings stretched across the frame
    - where: a line down the centre, crossing the strings, ending in a small hook up to the left
      part: the wooden post of the stand
    - where: a short stroke at the lower left, slanting down to the left
      part: the stand's left foot
    - where: a short stroke at the lower right, slanting down to the right
      part: the stand's right foot

樂:
  object: a musical instrument with wood, strings and a pick
  history: >-
    An ideogram: a musical instrument with wood 木, strings 幺 and a pick 白. The oldest forms drew
    a drum or a rack with strings on a wooden stand.
  layout: >-
    A wooden stand fills the lower half, with a crossbeam and a post and two legs. Above it, a
    pale pick sits in the middle of the upper half, with a bundle of twisted strings on each side
    of it. The three upper parts do not touch each other. Pale wood, pale cream strings, pale
    yellow pick. No person.
  exact:
    - The beam of the stand is the longest stroke across, and the post crosses its middle.
    - The pick's top-and-right edge is about half as long as the beam.
    - The post is a straight vertical line ending in a plain point at the bottom, with no hook.
    - The two legs both start where the post crosses the beam, and do not touch each other; both are about as long as the post.
    - The pick and the two bundles of strings stand apart; nothing in the left bundle touches the pick, and nothing in the right bundle touches the pick.
    - Inside the pick, the two small dots stand free of its sides.
    - The left bundle and the right bundle are mirror images of each other, each of three strokes, the last a dot.
  strokes:
    - where: a short stroke at the very top of the middle, going down
      part: the pick's tip
    - where: a line down the left side of the middle pick, from its upper left to its lower part
      part: the pick's left edge
    - where: a line across the top of the middle pick, about half as long as the stand's crossbeam, turning down at the right and running down the right side
      part: the pick's top and right edge
    - where: a tiny dot inside the pick, a little left of the middle
      part: a small round mark on the pick
    - where: a tiny dot at the lower part of the pick, rising a little to the right
      part: a second small mark on the pick
    - where: a stroke at the top of the left bundle, slanting down to the right, then turning down to the left, ending in a small hook up to the right
      part: the left bundle's first twist of string
    - where: a stroke below it, going down to the left and ending in a hook across to the right
      part: the left bundle's second twist
    - where: a small dot at the end of the left bundle, slanting down to the right
      part: the left bundle's knot
    - where: a stroke at the top of the right bundle, slanting down to the right, then turning down to the left, then across rising a little to the right
      part: the right bundle's first twist of string
    - where: a stroke below it, going down to the left and ending in a hook across rising a little to the right
      part: the right bundle's second twist
    - where: a small dot at the end of the right bundle, slanting down to the right
      part: the right bundle's knot
    - where: a long line across the middle of the stand, from the far left to the far right
      part: the stand's crossbeam
    - where: a long straight line down the middle of the stand, crossing the beam
      part: the stand's post
    - where: a sweep from the crossing of post and beam, down and out to the bottom left
      part: the stand's left leg
    - where: a sweep from the crossing of post and beam, down and out to the right, turning across at its foot
      part: the stand's right leg

石:
  object: a rock lying under the overhang of a cliff
  history: >-
    An ideogram: a rock 口 at the base of a cliff 厂. The oldest forms drew a stone below an
    overhanging ledge.
  layout: >-
    A pale grey cliff overhangs the upper left, with its face sloping down to the lower left. A
    rounded pale grey-brown boulder lies at the foot of the cliff, in the right half of the frame,
    under the ledge. The boulder is drawn as an open-mouthed hollow rock with a lip, no person.
  exact:
    - The ledge line across the top is nearly as long as the boulder's top-and-right line.
    - The boulder's bottom line is clearly shorter than its top-and-right line, a little over half as long.
    - The cliff face starts on the middle of the ledge and sweeps down and out to the bottom left.
    - The boulder's left side starts on the cliff face, and starts together with its top-and-right line.
    - The boulder's top-and-right line stands free of the cliff face, with a small gap.
    - The boulder's bottom line starts on the end of its left side and ends on the end of the top-and-right line.
  strokes:
    - where: a line across the top, from the upper left to the upper right
      part: the cliff's overhanging ledge
    - where: a long stroke starting at the middle of the ledge, going down and sweeping to the bottom left
      part: the cliff face
    - where: a short line down the left of the right half, starting on the cliff face
      part: the boulder's left side
    - where: a line across the top of the boulder, turning down and to the left at the right
      part: the boulder's top and right shoulder
    - where: a short line across the bottom of the boulder, a little over half as long as its top line, rising a little to the right
      part: the boulder's base on the ground

古:
  object: a mouth speaking, with a cross-shaped tally of ten sticks standing on it
  history: >-
    An ideogram: words passing through ten 十 mouths 口, handed down through many tellings, so
    old.
  layout: >-
    A pale cross made of two crossed sticks stands in the upper part, its tall stick standing on
    the top lip of an open mouth in the lower part of the frame. The mouth is a wide-open pair of
    pale pink lips. No person.
  exact:
    - The tally's cross bar is long, nearly the whole width; the tall stick crosses it near its middle and its foot touches the middle of the top lip.
    - The tall stick is a little over half the height of the picture and slants slightly.
    - The mouth's left side and its top lip start together; the bottom line touches the left side's end and the lip's end.
    - The bottom line is shorter than the top lip, a little over half as long.
  strokes:
    - where: a long line across the upper part, from the left to the right
      part: the tally's cross bar
    - where: a line down the centre from the top, slanting a little to the left and then straight, to the top lip
      part: the tally's tall stick
    - where: a short line down the left of the lower half
      part: the mouth's left corner
    - where: a line across the top of the mouth, turning down at the right and running down to the left
      part: the upper lip, curving into the right corner
    - where: a short line across the bottom of the mouth
      part: the lower lip

奴:
  object: a woman kneeling beside her master's hand, which rests toward her from the right
  history: >-
    An ideogram: a woman 女 standing by her master's right hand 又. The woman also provides the
    sound.
  layout: >-
    The woman fills the left half, kneeling and facing left, her arms crossed in front of her; she
    has a friendly face, eyes, a nose and a mouth, and simple pale clothes. A large pale hand
    reaches in from the right edge, open, its fingers sweeping down and out. Pale skin, pale
    clothes in different soft colours.
  exact:
    - The woman's first stroke goes down from her head, then turns down to the right to her lap; the second sweep crosses it and ends at the bottom left.
    - The arm line across rises to the right, crosses the first stroke and ends on the second.
    - The hand and the woman do not touch.
    - The hand's first stroke crosses the second, turns down and ends in a short sweep to the left; the second starts on it, runs down and turns across to the right at its end.
  strokes:
    - where: a stroke in the left half from the top down, bending to the lower right
      part: the woman's head, back and lap
    - where: a sweep from the middle of the left half down to the bottom left
      part: her arm, reaching down
    - where: a line across the left half, rising to the right at its end
      part: her other arm, held across in front
    - where: a line across the top of the right half, turning down and then down to the left
      part: the master's hand and wrist
    - where: a stroke from the middle of the right half, sweeping down to the right and turning across to the right
      part: the master's fingers, spread out

四:
  object: a child in a small room with four walls
  history: >-
    An ideogram: a child 儿 in a room with four walls 囗. The child hangs its legs near the top of
    the room.
  layout: >-
    A small square room fills the middle of the frame, with a pale child sitting at its top, with
    a big friendly face with eyes, a nose and a mouth, and simple pale clothes. The child's body is
    drawn pale behind the strokes; its two legs are the two inner strokes and hang down toward the
    floor without reaching it. Pale walls, a pale floor.
  exact:
    - The room's left wall is short, and starts together with the top-and-right wall at the top left corner.
    - The top-and-right wall is the longest stroke; it runs across and then down the whole right side to the bottom right corner.
    - The floor line starts on the left wall's foot and ends on the right wall's foot, closing the room.
    - The child's two legs stand free of the floor, and the left leg stops short of the left wall.
    - The right leg is longer than the left leg and turns across to the right at its foot.
  strokes:
    - where: a short line down the left side of the room
      part: the room's left wall
    - where: a long line across the top, turning down at the right and running down the right side to the bottom
      part: the room's ceiling and right wall
    - where: a short line in the upper middle, going down and turning to the lower left
      part: the child's left leg
    - where: a line in the upper middle, a little right of the left leg, going down and turning across to the right at its foot
      part: the child's right leg and foot
    - where: a line across the bottom of the room, from the left wall's foot to the right wall's foot
      part: the room's floor

且:
  object: a stone altar, a tall block with two shelves, standing on a wide base slab
  history: >-
    The oldest forms drew a stone altar, a block with shelves for offerings. The modern form is a
    tall box on a base line.
  layout: >-
    A tall narrow pale grey stone block stands on a wide flat base slab. The block has two small
    shelves cut in its front, in the upper and lower middle. The slab is about twice as wide as the
    block. Pale grey stone. No person.
  exact:
    - The base slab is about twice as wide as the block, and a little wider than the block is tall.
    - The two shelf lines are short, about a fifth as long as the base slab, and start on the left side and stop short of the right side.
    - The block's left side ends on the middle of the slab, and the right side ends on the slab as well.
    - The block's top-and-right line starts at the left side's start and runs across, then down the right.
  strokes:
    - where: a long line down the left side of the block, from the top to the base slab
      part: the block's left side
    - where: a line across the top, turning down at the right and running down the right side to the slab
      part: the block's top and right side
    - where: a short line across the upper middle, from the left side, stopping before the right
      part: the upper shelf
    - where: a short line across the lower middle, from the left side, stopping before the right
      part: the lower shelf
    - where: a long line across the bottom, from the far left to the far right
      part: the base slab

母:
  object: a mother kneeling, seen from the front, with two small round ornaments on her dress
  history: >-
    The oldest forms drew a woman 女 with two dots marking a mother, one who nurses. The modern form
    wraps the figure in a frame with two dots.
  layout: >-
    A mother kneels in the centre of the frame, seen from the front, her arms crossed in front of
    her. She has a kind face with eyes, a nose and a mouth, and a simple pale dress. Two small round
    pale ornaments sit at her chest. Soft pale colours.
  exact:
    - The mother's left outline starts at the top, goes down, then runs along the bottom to the right, finishing with a short turn down.
    - The mother's right outline starts on the left outline, runs across and down her right side, and ends in a small hook up to the left.
    - The arms line across the middle is long, nearly the whole width, and crosses both outlines.
    - The two chest ornaments are small slanting dots that stand free of every other stroke; the upper one is above the arms line and the lower one is below it.
  strokes:
    - where: a long stroke down the left of the frame, turning across along the bottom to the right and ending in a short turn down to the right
      part: the mother's left side and her folded knees
    - where: a long stroke across the top, turning down along the right side and ending in a hook up to the left
      part: the mother's head and right side, down to her hem
    - where: a small dot slanting down to the right, above the arms line
      part: the upper chest ornament
    - where: a long line across the middle, from near the left edge to near the right edge
      part: the mother's arms, crossed in front of her
    - where: a small dot slanting down to the right, below the arms line
      part: the lower chest ornament

节:
  object: a bamboo stalk with a joint, where the stalk is banded and its tip splits in two
  history: >-
    An ideogram from the sections of bamboo ⺮, a joint where a stalk is divided. The top 艹 is a
    grass-like tip.
  layout: >-
    A pale green bamboo stalk fills the frame, with a leafy tip at the top that splits into two
    short shoots held by a band. A joint wraps the stalk below, and the stalk runs on to the
    bottom. Pale green stalk, pale cream bands. No person.
  exact:
    - The band across the top is long; the two short shoots cross it, the left one shorter than the right.
    - The joint band stands apart from the shoots, with small gaps.
    - The joint goes across rising to the right, turns down and ends in a small hook up to the left.
    - The stalk is a straight vertical line with no hook; it starts on the middle of the joint and runs to the bottom.
  strokes:
    - where: a long line across the top, rising a little to the right
      part: the band holding the shoots
    - where: a short line down on the left, crossing the band
      part: the left shoot
    - where: a short line down on the right, slanting a little to the right, crossing the band
      part: the right shoot
    - where: a line across the middle, rising a little to the right, turning down and ending in a small hook up to the left
      part: the joint banding the stalk
    - where: a straight line down from the middle of the joint to the bottom
      part: the bamboo stalk

击:
  object: a hand striking down into an open bowl
  history: >-
    An ideogram: a hand 手 provides the meaning, striking. The simplified form keeps the hand as a
    cross of lines above an open container 凵.
  layout: >-
    An open hand, fingers spread, comes down from the top into a pale open bowl at the bottom of
    the frame. The bowl is an open-topped container with a rounded bottom. The hand is soft pale
    skin. No person, only the hand and its sleeve.
  exact:
    - The fingertip line is short, a little over half as long as the line below, and the hand's long line crosses it.
    - The thumb line is the longest across, nearly the whole width, and the hand's long line crosses it.
    - The hand's long line goes down, ends on the bowl's bottom and does not hook.
    - The bowl's left side and its bottom are one stroke that rises a little to the right at its end; the right side is a separate stroke that starts above the end.
    - The bowl is open at the top; the thumb line stops short of both bowl sides.
  strokes:
    - where: a short line across the upper part, rising a little to the right
      part: the fingertips
    - where: a long line across the middle, from the left to the right
      part: the thumb and little finger, spread wide
    - where: a long line down the centre, slanting a little to the right and then straight, to the bowl's bottom
      part: the middle finger and palm, striking down
    - where: a line down the left of the lower part, turning across along the bottom and rising a little to the right
      part: the bowl's left side and bottom
    - where: a line down the right of the lower part, slanting a little to the right
      part: the bowl's right side

擊:
  object: a hand striking a drum with a club, while an open hand rises from below
  history: >-
    An ideogram: to strike 毄 with a hand 手. The striking part shows a drum on a post and a hand
    with a club; the hand 手 is the open hand at the bottom.
  layout: >-
    The upper left half is a pale drum on a post: a box with bands, with a long pole through it.
    The upper right is a hand with a raised club, swinging toward the drum. Below, an open hand,
    fingers spread, seen from the palm side with the wrist below, rises toward them. Pale
    skin, pale wood, pale grey drum skin. No person, only hands.
  exact:
    - The post is a long vertical line from the top to the middle, crossing the cap, the drum's top, the two bands and the long rail; its end touches the drum's base.
    - The cap on the post is short, about half as long as the long rail.
    - The long rail across the middle of the drum is the longest line across on the left.
    - The long rail is about two thirds as long as the open hand's thumb line, which is the longest line across in the whole character.
    - The drum's top-and-right edge is nearly as long as the long rail, and runs across rising a little to the right, then down.
    - The two bands inside the drum are short and stand free of the drum's sides.
    - The drum's base starts at the left, goes down and across rising a little to the right, and is joined by a small dot at its end.
    - The club hand has a short cuff stroke, a long raised club with a hook and two arm strokes that cross; the club does not touch the drum.
    - The open hand's fingertips stroke runs from right to left; its middle finger is the long vertical ending in a small hook to the left.
    - The open hand's thumb line is the longest across the bottom; the other line across is shorter, about half as long.
  strokes:
    - where: a short line across the very top of the left half, rising a little to the right
      part: the cap of the drum post
    - where: a short stroke in the upper left, slanting down to the right
      part: the drum's left side
    - where: a line across the upper left, rising a little to the right and turning down at the right
      part: the drum's top and right edge
    - where: a short line across inside the drum, rising a little to the right, floating
      part: the upper band round the drum
    - where: a short line across below it, rising to the right, floating
      part: the lower band round the drum
    - where: a long line across the middle left, about two thirds as long as the open hand's bottom line, rising a little to the right, from the far left to the middle
      part: the long rail the drum rests on
    - where: a long straight line down from the top of the left half to the middle, through everything
      part: the post the drum stands on
    - where: a line from the left middle going down, then across, rising a little to the right
      part: the drum's base
    - where: a small dot at the end of the base, slanting down to the right
      part: the drum's foot peg
    - where: a short stroke at the top of the right half, going down and bending down to the left
      part: the club hand's wrist cuff
    - where: a line across the top right, then turning down and across to the right
      part: the club, raised and swinging
    - where: a line across the middle right, going across to the right and then down to the left
      part: the striking arm
    - where: a stroke from the middle right, sweeping down to the right and turning across to the right
      part: the striking hand
    - where: a short stroke across the top of the lower hand, running from the right to the left
      part: the open hand's fingertips
    - where: a line across the lower hand, rising a little to the right
      part: the open hand's fingers spreading out
    - where: a long line across the bottom of the lower hand, the longest line across in the whole character
      part: the open hand's thumb and little finger, spread wide
    - where: a long line down the centre of the lower hand, slanting a little to the right and ending in a small hook up to the left
      part: the open hand's middle finger, running down to the wrist
