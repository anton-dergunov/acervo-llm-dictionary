# The fixed word list. Tracked, so two runs compare the same thing.
#
# Two learners, each a vocabulary as Settings ▸ Vocabularies stores it: a level, a variety and a note
# in their own words. The note is deliberately specific — a trip, a job, a hobby — because a specific
# note is the one a writer is tempted to build everything around.
#
# Every word belongs to one group:
#   unrelated  nothing to do with the note. Measures leakage: an example about Argentina for
#              `cactus` is the failure this experiment exists to catch.
#   related    the note is where the word lives. Measures uptake: here the note *should* show.
#   variety    Spanish only: a word whose form or use differs between Spain and Argentina. Measures
#              whether the variety is preferred (`variety_forms`) without the headword being erased
#              from its own entry, and whether the other variety is still mentioned (`other_forms`).
#
# `leak` lists, per vocabulary, the stems a sentence that is *about the note* almost always contains.
# Matched against the accent-folded, lower-cased example and its translation. A keyword list is
# blunt; the review page is how its recall is checked against a person.

vocabularies:
  es:
    language: es
    definitionLang: es
    glossLangs: [en]
    notesLang: en
    region: AR
    level: B1
    learnerNote: >-
      Preparing for a two-week trip to Argentina in March. I work in software. I learned Spanish
      from Spain, so peninsular forms are familiar; the subjunctive is my weak spot.
    leak: [argentin, buenos aires, porten, patagoni, mendoza, bariloche, iguazu, viaj, vacacion,
           turist, aeropuert, vuelo, avion, hotel, pasaport, maleta, software, program, codigo,
           informatic, desarroll, trip, travel, flight, airport, vacation, holiday, tourist,
           programm, developer, coding]
  en:
    language: en
    definitionLang: en
    glossLangs: [ru]
    notesLang: ru
    region: GB
    level: C1
    learnerNote: >-
      I use English at work: meetings with clients and a lot of email. I like football.
    leak: [meeting, email, e-mail, client, colleague, office, boss, deadline, presentation,
           business, football, match, goal, team, league, pitch, striker, referee, совещан,
           клиент, коллег, офис, футбол, матч, команд]

topics: [Emotions, Actions, Nature, Culture, Food, Health, Appearance, Technology, Travel, Slang, Social, Places, Misc]

