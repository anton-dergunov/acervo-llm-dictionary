{{#HeadwordAudio}}
<div class="acv-frame"><div class="acv k-lis">
  <div class="acv-top"><span class="kind">Listen</span><span class="lang">{{Language}}</span></div>
  <div class="acv-body listen-stage">
    <button class="play-big" type="button" aria-label="Play the word"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 5-10 5z"/></svg></button>
    {{HeadwordAudio}}
    <p>What word do you hear?</p>
    <span class="small">Say it back and spell it before revealing</span>
  </div>
</div></div>
<!-- acervo:script -->
{{/HeadwordAudio}}
