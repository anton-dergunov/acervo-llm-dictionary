services:
  # The Acervo server: one Python service that owns the graph, capture, the dictionary routes and
  # the interface itself.
  server:
    build:
      context: ../..
      dockerfile: deploy/acervo/server/Dockerfile
      args:
        # The robot runs in here now, and its sync protocol is version-locked to the sync server's:
        # the same pin, upgraded as a pair.
        ANKI_VERSION: "${ACERVO_ANKI_VERSION:-26.8.1}"
    restart: unless-stopped
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    environment:
      ACERVO_APP_VERSION: "${ACERVO_APP_VERSION:-}"
      ACERVO_APP_BUILD: "${ACERVO_APP_BUILD:-}"
      ACERVO_DB_PATH: /var/lib/acervo/server/acervo.db
      ACERVO_JWT_SECRET: "${ACERVO_JWT_SECRET:-}"
      ACERVO_DOWNLOADS_PATH: /var/lib/acervo/downloads
      ACERVO_DICTIONARIES_PATH: /var/lib/acervo/dictionaries
      ACERVO_MEDIA_PATH: /var/lib/acervo/media
      ACERVO_PROMPTS_PATH: /app/prompts
      # Where the corpus lives, on the compose network. Internal by construction: the service
      # publishes no port, and the browser reaches it through this server's authenticated proxy.
      ACERVO_SPEECH_URL: "${ACERVO_SPEECH_URL:-http://speech-retrieval:8000/api/v1}"
      # Where the loop generator lives, on the compose network. Internal by construction, exactly
      # like the corpus: it publishes no port, and nothing outside this network has business
      # reaching it — a render is asked for by the server, never by a browser.
      ACERVO_LEXIBEAT_URL: "${ACERVO_LEXIBEAT_URL:-http://lexibeat:8000/api/v1}"
      # Held here and never sent to a client, exactly like a provider key: it authorises channel
      # mutations, and the proxy attaches it server-side.
      ACERVO_SPEECH_OPERATOR_TOKEN: "${ACERVO_SPEECH_OPERATOR_TOKEN:-}"
      # Which providers answer, in order, as ids from models/catalogue.json. Unset means every one
      # this deployment has credentials for, in catalogue order — so a server with one key needs
      # nothing here. The keys themselves are named by their catalogue rows, and every value comes
      # from llm.env, which the installer writes mode 600 and compose passes last.
      ACERVO_TEXT_CHAIN: "${ACERVO_TEXT_CHAIN:-}"
      # The zone days and Settings ▸ Schedule's nightly hour are read in; unset means UTC.
      ACERVO_TIMEZONE: "${ACERVO_TIMEZONE:-}"
      # The Anki robot: another sync client of the sync server beside it, pushing the vocabulary
      # after it changes and reading review state back every hour. Its collection is in the worker's
      # directory, mounted below, so a command run by hand in the worker uses the same one and the
      # same lock. Unset credentials mean no Anki here, and nothing Anki runs.
      ACERVO_ANKI_SYNC_ENDPOINT: "http://anki-sync-server:8080/"
      ACERVO_ANKI_SYNC_USERNAME: "${ACERVO_ANKI_SYNC_USERNAME:-}"
      ACERVO_ANKI_SYNC_PASSWORD: "${ACERVO_ANKI_SYNC_PASSWORD:-}"
      ACERVO_ANKI_DATA_PATH: /var/lib/acervo/worker
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      ACERVO_OLLAMA_URL: "${ACERVO_OLLAMA_URL:-}"
      # Vertex authenticates by application default credentials, not by a key: LiteLLM has no
      # express-key path. Without GOOGLE_APPLICATION_CREDENTIALS pointing at a service-account file
      # mounted into the container, the vertex row is simply unavailable and health says so.
      ACERVO_VERTEX_PROJECT: "${ACERVO_VERTEX_PROJECT:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      # Optional guard: the account those credentials must belong to, or the row refuses to run.
      ACERVO_VERTEX_ACCOUNT: "${ACERVO_VERTEX_ACCOUNT:-}"
    ports:
      - "${ACERVO_APP_BIND_ADDRESS:-127.0.0.1}:${ACERVO_APP_PORT:-27702}:8000"
    volumes:
      - "${ACERVO_SERVER_DATA:-acervo-server-data}:/var/lib/acervo/server"
      - "${ACERVO_DOWNLOADS:-acervo-downloads}:/var/lib/acervo/downloads:ro"
      - "${ACERVO_DICTIONARIES:-acervo-dictionaries}:/var/lib/acervo/dictionaries:ro"
      # Read-write, unlike the dictionaries beside it: the server draws sense images now, and the
      # file and the row that names it have to be written by the same party. Dictionaries stay
      # read-only because nothing but the worker ever compiles one.
      - "${ACERVO_MEDIA:-acervo-media}:/var/lib/acervo/media"
      # The robot's Anki collection, its backups and the cards' kept payload. Not under the server's
      # own data directory, so --reset-database never takes Anki with it; --reset-anki does.
      - "${ACERVO_WORKER_DATA:-acervo-worker-data}:/var/lib/acervo/worker"
      # Google will not authenticate from an environment variable: Vertex wants a credentials
      # file, and LiteLLM has no express-key path. The directory is mounted rather than the
      # file so the mount is valid whether or not one has been configured.
      - "${ACERVO_CREDENTIALS:-acervo-credentials}:/run/acervo/credentials:ro"
    healthcheck:
      # Asserts an HTTP 200, not a TCP connect: a service that is listening but refusing every
      # request is not healthy. `wget` is deliberately not used — the alpine image had it and
      # python:3.12-slim does not, and a container whose healthcheck binary is missing reports
      # unhealthy forever while serving perfectly.
      #
      # A minute apart, here and in every service below, because a probe is not free: each one makes
      # Docker rewrite the container's state with an fsync, which on the NAS's mirrored disks was a
      # constant ~200 small writes a second at 5 s. Nothing restarts on "unhealthy" — it is a readout
      # for DSM and `deploy.sh --status` — so three missed probes is soon enough. The installer does
      # not wait on this cadence: it runs the same command itself (install.sh, wait_until_serving).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/acervo/v1/health', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s

  # The spoken-usage-retrieval corpus: a foreign service deployed beside Acervo, like the Anki sync
  # server, and reached over HTTP only. Acervo's server never imports it and never opens its SQLite
  # file — the core and the corpus deliberately share no database, container or backup policy
  # (docs/README.md, "The invariants"). The version it runs is deploy/acervo/speech/pin.json.
  speech-retrieval:
    build:
      context: ../..
      dockerfile: deploy/acervo/speech/Dockerfile
    restart: unless-stopped
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    environment:
      # Channel management is offered in Settings ▸ Clips through Acervo's proxy, so mutations are
      # on — and binding a non-loopback host with mutations enabled and no token makes the service
      # refuse to start, which is why the token is not optional here.
      SPEECH_RETRIEVAL_ENABLE_CHANNEL_MUTATIONS: "true"
      # Not `:?`. A required variable is checked at *interpolation* time, so an absent one failed
      # every compose command in the file — including `build`, and including invocations that have
      # nothing to do with this service. The guard that matters is the service's own: channel
      # mutations are on and the host is not loopback, so it refuses to start without a token rather
      # than serving an unauthenticated write API. `install.sh` mints one on first deploy.
      SPEECH_RETRIEVAL_OPERATOR_TOKEN: "${ACERVO_SPEECH_OPERATOR_TOKEN:-}"
      # Acervo's own interface is the only browser client and it reaches this through the server's
      # proxy, so the service needs no CORS origins of its own.
      SPEECH_RETRIEVAL_CORS_ORIGINS: ""
      # The player's target text runs on the *owner's* chain rather than on a key this service
      # holds (spoken-clips §2.13). The chain is **given** rather than looked up: this container has
      # no business reaching Acervo's database, which is the rule for any work that cannot import
      # `repository/`. With none of these set, no provider is injected and the service falls back to
      # the authored caption where one exists and no target text where none does.
      ACERVO_TEXT_CHAIN: "${ACERVO_TEXT_CHAIN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      ACERVO_OLLAMA_URL: "${ACERVO_OLLAMA_URL:-}"
      # Vertex needs the credentials *file*, which is the one provider whose secret is not a value.
      ACERVO_VERTEX_PROJECT: "${ACERVO_VERTEX_PROJECT:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      ACERVO_VERTEX_ACCOUNT: "${ACERVO_VERTEX_ACCOUNT:-}"
    # Deliberately no `ports`. Nothing outside the compose network talks to it: the browser goes
    # through Acervo's authenticated proxy, which is what keeps an unauthenticated read API off the
    # network and the operator token off the client.
    volumes:
      # Two mounts, not one, because only one half is disposable. `raw/` is downloaded captions —
      # bandwidth spent, not politely re-fetchable, and the only store in this deployment that is
      # neither disposable nor rebuildable from something Acervo holds. Nothing deletes it.
      - "${ACERVO_SPEECH_CACHE:-acervo-speech-cache}:/var/lib/speech/data/raw"
      # The index and the derived artifacts, rebuilt from the cache by `update --once` at the cost
      # of CPU and no traffic. Mounted at the parent, with the cache mounted inside it.
      - "${ACERVO_SPEECH_INDEX:-acervo-speech-index}:/var/lib/speech/data"
      # The owner's channel list, seeded from the wheel on first start and never overwritten.
      - "${ACERVO_SPEECH_CATALOGUES:-acervo-speech-catalogues}:/var/lib/speech/catalogues"
      # The same credentials directory the server and the worker already mount, and for the same
      # reason: Vertex authenticates from a file that Google will not accept as a value.
      - "${ACERVO_CREDENTIALS:-acervo-credentials}:/run/acervo/credentials:ro"
    healthcheck:
      # Liveness, **not** readiness. Readiness answers 503 until an index has been built, which is
      # honest and correct on a fresh deployment — and a healthcheck pointed at it would report a
      # perfectly good service as failed and fail the install. Whether the corpus is ready is a
      # question for Settings ▸ Clips, which reads /status.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s

  # The loop generator. Procedural music plus speech it does not synthesise itself: numpy and
  # scipy over CC0 samples, no GPU, no network and byte-identical from a seed, which is what makes
  # building a loop on this machine possible at all.
  lexibeat:
    build:
      context: ../..
      dockerfile: deploy/acervo/lexibeat/Dockerfile
    restart: unless-stopped
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    environment:
      # Where to come home for a voice. `serve.py` implements LexiBeat's `Backend` as a call to
      # POST /pronunciations/take, carrying the render-scoped token that arrived with the request.
      ACERVO_API_URL: "${ACERVO_LEXIBEAT_API_URL:-http://server:8000/api/acervo/v1}"
      LEXIBEAT_SERVICE_OUT: /var/lib/lexibeat/out
    # **Deliberately no provider credential of any kind**, and this is the one companion service
    # where that is true — no GEMINI_API_KEY, no Cloudflare pair, no Vertex project, no credentials
    # mount. It is handed a voice per render instead (§2.3), so there is nothing here to leak, to
    # rotate, or to keep in step with the server's chain. `test_deployment.py` asserts the absence
    # so a later reader cannot mistake it for an oversight.
    #
    # Deliberately no `ports` either, for `speech-retrieval`'s reason: a render is asked for by the
    # server, and nothing outside this network talks to it.
    volumes:
      # ~3.1 GB of content-addressed audio, the bundle `lexibeat/pin.json` names — the entrypoint
      # looks for that root and no other — fetched once with `lexibeat-bundle fetch` and never
      # deleted by a reset — the dictionaries arrangement, and for its reason: the owner's own data
      # moved between the owner's own machines. Without it the engine serves and offers only the
      # sample-free electronic palette, which is a different category of sound rather than a
      # slightly plainer one.
      - "${ACERVO_LEXIBEAT_BUNDLE:-acervo-lexibeat-bundle}:/var/lib/lexibeat/bundle"
      # Finished tracks, until Acervo has fetched them. Entirely disposable.
      - "${ACERVO_LEXIBEAT_OUT:-acervo-lexibeat-out}:/var/lib/lexibeat/out"
    # Deliberately **no `depends_on`**, in either direction. Render requests arrive *from* the
    # server, so the server is up whenever a call comes home; and the server must start whether or
    # not this is healthy, because everything else it does works without loops.
    healthcheck:
      # Liveness, **not** readiness, and specifically not "is the sample bundle present". A fresh
      # deployment has no bundle and still serves; gating on it would fail the install of a working
      # service, which is the lesson the corpus healthcheck beside this one paid for.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s

  anki-sync-server:
    build:
      context: ../..
      dockerfile: deploy/acervo/Dockerfile
      # The stage before any of Acervo's code, which this service never runs: a deploy that changes
      # code finds this image unchanged and leaves the container running.
      target: sync-server
      args:
        ANKI_VERSION: "${ACERVO_ANKI_VERSION:-26.8.1}"
    restart: unless-stopped
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    command: ["python", "-m", "anki.syncserver"]
    environment:
      SYNC_USER1: "${ACERVO_ANKI_SYNC_USERNAME:?Set ACERVO_ANKI_SYNC_USERNAME}:${ACERVO_ANKI_SYNC_PASSWORD:?Set ACERVO_ANKI_SYNC_PASSWORD}"
      SYNC_BASE: /var/lib/acervo/anki-server
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8080"
      RUST_LOG: "${ACERVO_ANKI_LOG_LEVEL:-anki=info}"
    ports:
      - "${ACERVO_BIND_ADDRESS:-127.0.0.1}:${ACERVO_ANKI_PORT:-27701}:8080"
    volumes:
      - "${ACERVO_ANKI_SERVER_DATA:?Set ACERVO_ANKI_SERVER_DATA}:/var/lib/acervo/anki-server"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Acervo's own server-side work. Not a running service: `profiles: ["tools"]` means it exists to
  # be started by `docker compose run --rm`, do one job, and exit. A new job is a new subcommand of
  # acervo_worker.py, never a new container.
  acervo-worker:
    build:
      context: ../..
      dockerfile: deploy/acervo/Dockerfile
      target: worker
      args:
        ANKI_VERSION: "${ACERVO_ANKI_VERSION:-26.8.1}"
    profiles: ["tools"]
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    entrypoint: ["python", "/app/scripts/acervo_worker.py"]
    environment:
      ACERVO_ANKI_SYNC_ENDPOINT: "http://anki-sync-server:8080/"
      ACERVO_ANKI_SYNC_USERNAME: "${ACERVO_ANKI_SYNC_USERNAME:?Set ACERVO_ANKI_SYNC_USERNAME}"
      ACERVO_ANKI_SYNC_PASSWORD: "${ACERVO_ANKI_SYNC_PASSWORD:?Set ACERVO_ANKI_SYNC_PASSWORD}"
      ACERVO_ANKI_COLLECTION: /var/lib/acervo/worker/collection.anki2
      ACERVO_ANKI_BACKUP_DIR: /var/lib/acervo/worker/backups
      ACERVO_ANKI_TEMPLATE_DIR: /app/templates
      # Compiled dictionaries are written here and served read-only by the server. The downloaded
      # sources stay in the worker's own data directory and are never exposed.
      ACERVO_DICTIONARIES_PATH: /var/lib/acervo/dictionaries
      ACERVO_MEDIA_PATH: /var/lib/acervo/media
      ACERVO_DICTIONARY_CACHE: /var/lib/acervo/worker/dictionary-sources
      # Where a by-hand loop render signs in, over POST /session like any other client, with a
      # password it asks for. Deliberately not ACERVO_JWT_SECRET: that signs every account's
      # tokens, and a batch job has no business holding it.
      ACERVO_SERVER_URL: "${ACERVO_SERVER_URL:-http://server:8000}"
      # Which providers answer, in order, as ids from models/catalogue.json. Unset means every one
      # this deployment has credentials for, in catalogue order — so a server with one key needs
      # nothing here. The keys themselves are named by their catalogue rows, and every value comes
      # from llm.env, which the installer writes mode 600 and compose passes last.
      ACERVO_TEXT_CHAIN: "${ACERVO_TEXT_CHAIN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      ACERVO_OLLAMA_URL: "${ACERVO_OLLAMA_URL:-}"
      # Vertex authenticates by application default credentials, not by a key: LiteLLM has no
      # express-key path. Without GOOGLE_APPLICATION_CREDENTIALS pointing at a service-account file
      # mounted into the container, the vertex row is simply unavailable and health says so.
      ACERVO_VERTEX_PROJECT: "${ACERVO_VERTEX_PROJECT:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      # Optional guard: the account those credentials must belong to, or the row refuses to run.
      ACERVO_VERTEX_ACCOUNT: "${ACERVO_VERTEX_ACCOUNT:-}"
    volumes:
      - "${ACERVO_WORKER_DATA:?Set ACERVO_WORKER_DATA}:/var/lib/acervo/worker"
      - "${ACERVO_DICTIONARIES:-acervo-dictionaries}:/var/lib/acervo/dictionaries"
      - "${ACERVO_MEDIA:-acervo-media}:/var/lib/acervo/media"
      - "${ACERVO_INPUT_PATH:?Set ACERVO_INPUT_PATH}:/input:ro"
      - "${ACERVO_CREDENTIALS:-acervo-credentials}:/run/acervo/credentials:ro"
    depends_on:
      anki-sync-server:
        condition: service_healthy
    # Deliberately *not* depending on `server`. Only a by-hand loop render talks to it, and a
    # dependency here applies to every `run --rm` — it would build and start the whole API service to
    # compile a dictionary, and drag it into tests that have nothing to do with it. In production the
    # server is `restart: unless-stopped` and already up; when it is not, the client says so in
    # exactly those words rather than hanging.

volumes:
  acervo-server-data:
  acervo-worker-data:
  acervo-downloads:
  acervo-dictionaries:
  acervo-media:
  acervo-speech-cache:
  acervo-speech-index:
  acervo-speech-catalogues:
  acervo-lexibeat-bundle:
  acervo-lexibeat-out:
  # The fallback for `ACERVO_CREDENTIALS`, which three services mount. Undeclared, it made *every*
  # compose command fail with "refers to undefined volume" the moment a caller left the variable
  # unset — which the installer never does and the Docker integration test always does.
  acervo-credentials:
