<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acervo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="acervo.css">
</head>
<body>

<div class="viewport">
<div class="app">
  <div class="brand"><span class="mark">A.</span></div>

  <header class="topbar">
    <div class="search" id="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Search your words…" autocomplete="off" spellcheck="false">
      <span class="kbd">⌘K</span>
      <button class="scope" id="scopeBtn" aria-haspopup="menu" aria-label="What search covers">yours +3</button>
      <!-- Your own words are deliberately not on this list: they are always searched and always
           first. What is switchable is only how far past them a search reaches. -->
      <div class="menu scope-menu" id="scopeMenu">
        <div class="label menu-label">Your words, then…</div>
        <label class="on"><input type="checkbox" data-scope="device" checked>
          <span><span>Dictionaries on this device</span>
                <span class="hint">Instant, and answers with the server unreachable</span></span></label>
        <label class="on"><input type="checkbox" data-scope="server" checked>
          <span><span>Dictionaries on your server</span>
                <span class="hint">Read over the network as you pause</span></span></label>
        <label class="on"><input type="checkbox" data-scope="online" checked>
          <span><span>Online sources</span>
                <span class="hint">Asked only when you press ⏎</span></span></label>
      </div>
    </div>

    <!-- What is playing, here only on a tablet-sized window whose rail an article has hidden: a phone
         has the bar at the foot and a wider window the rail's own card. `acervo.css` picks which. -->
    <span id="loopChip"></span>

    <button class="tb-btn primary" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="wide-only">Add</span>
    </button>

    <button class="tb-btn sync-chip synced" id="syncChip" title="Up to date with the server" aria-label="Up to date with the server">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6 10.2 3.9 3.9 0 0 0 7 18z"/></svg>
    </button>

    <button class="tb-btn lang-btn" id="langBtn" aria-haspopup="menu"></button>
    <div class="menu" id="langMenu"></div>
  </header>

  <nav class="rail" id="rail" aria-label="Topics"></nav>

  <main class="main" id="main">
    <div class="pane" id="paneWrap">
      <div class="art-bar" id="artBar" style="display:none"></div>
      <div id="pane"></div>
      <!-- The ask dock is a sibling of the article, not a child of it, exactly as it is in the
           application: at its largest detent the article is hidden and the sheet is not. -->
      <div id="askSlot"></div>
    </div>
    <!-- Composing replaces the list rather than covering it, so the surface owns the height and
         can pin its own header and buttons. -->
    <div id="composer" style="display:none"></div>
  </main>

  <!-- The bar is a row of `.app`, not a child of the pane: the ask dock already owns the bottom of
       the article column, and loops §2.13 forbids a second dock there. So this is drawn only where
       the list is, and simply is not rendered over an article, an external entry or the composer.
  --> <div class="foot">
    <!-- The selection: words picked to make a loop or a story from. Drawn over the list and the
         map at every width, and like the bar below it never over an article. On a phone it takes
         the Made bar's place; a loop that is playing keeps its bar, under this one. -->
    <div class="selbar" id="selbar"></div>
    <div class="loopbar madebar" id="loopbar"></div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<div id="harness" title="Prototype only — preview at other screen sizes">
  <button data-frame="desktop" class="on">Desktop</button>
  <button data-frame="tablet">Tablet</button>
  <button data-frame="phone">Phone</button>
  <span style="width:1px;background:var(--rule-soft);margin:2px 3px"></span>
  <button id="viewBtn" title="Default article view — auto follows the device">View: auto</button>
  <button id="trBtn" title="Listen buttons after translations too">▷ Translations</button>
  <span style="width:1px;background:var(--rule-soft);margin:2px 3px"></span>
  <button id="themeBtn" title="Cycle light / dark / follow the system">Theme</button>
  <span style="width:1px;background:var(--rule-soft);margin:2px 3px"></span>
  <button id="layoutBtn" title="Open the loops surface">Loops</button>
  <button id="storyBtn" title="Open the stories surface">Stories</button>
  <button id="speedBtn" title="Wind the clock on — a word really takes twenty-two seconds, and a story's sentence a few">1×</button>
  <span style="width:1px;background:var(--rule-soft);margin:2px 3px"></span>
  <button id="mapBtn" title="Open the map">Map</button>
  <button id="mapStyleBtn" title="Which of the three looks">Style: atlas</button>
  <button id="mapLabelsBtn" title="How regions are named: a model, the most central words, or distinctive terms">Labels: model</button>
  <button id="mapUpdateBtn" title="Play a new layout arriving">Update</button>
  <button id="mapSampleBtn" title="Use the committed sample instead of your own map">Sample</button>
</div>

<script src="data.js"></script>
<!-- The map's data: the committed sample, then the owner's own map if it has been generated
     (git-ignored; see README). A missing file only logs a 404, and the sample is used. -->
<script src="map-data.js"></script>
<script src="map-data.local.js"></script>
<script src="map.js"></script>
<script src="vendor/embla-carousel.umd.js"></script>
<script src="vendor/embla-carousel-wheel-gestures.umd.js"></script>
<script src="writing.js"></script>
<script src="app.js"></script>
</body>
</html>
