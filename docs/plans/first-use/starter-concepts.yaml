# The shared concept list for the starter vocabularies — a draft for review.
#
# Plan: docs/plans/first-use/starter-vocabularies.md. This file is the freeze point for pictures:
# once reviewed, each concept's picture is drawn once and reused by every vocabulary.
#
# A concept is one MEANING, not one word. English is only the label language. Where languages cut a
# meaning differently, the concepts are cut finer, so each one still has one picture:
#   - fish-animal and fish-food (Spanish pez / pescado)
#   - know-fact and know-person (saber / conocer, wissen / kennen)
#   - play-game and play-instrument (jugar / tocar)
# The other direction works too: Russian рука is one word with two senses, arm and hand, and each
# sense takes its concept's picture.
#
# Fields
#   id     the concept's stable key: an English label, with a suffix where one label has several
#          concepts (fish-animal, fish-food)
#   sense  the meaning, in a few English words: what decides which sense of a word it matches
#   pos    noun | verb | adj | adv | conj | prep | expr
#   level  A1 | A2 | B1 (rough CEFR)
#   pic    omitted = one shared picture. none = no shared picture (grammar words, and a few that no
#          picture can carry); a vocabulary may still draw its own.
#   note   how languages differ here, or why the picture needs care
#   also   further topics the word is filed under

